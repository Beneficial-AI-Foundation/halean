name = "HALean"
version = "0.1.0"
# Only the library: every lean_exe root must declare a top-level `main`, so
# importing all executable roots into one environment (as probe-lean does with
# the default targets) can never work. Build executables by name:
#   lake build halean-automation halean-script ...   (README, "Setup")
defaultTargets = ["HALean"]

[[lean_lib]]
name = "HALean"

# One executable per service. Each speaks JSON lines on stdin/stdout. Their root
# modules live in Exe/, outside the HALean library, so no module is both a
# library module and an executable root.
[[lean_exe]]
name = "halean-automation"
root = "Exe.Automation"

[[lean_exe]]
name = "halean-template"
root = "Exe.Template"

[[lean_exe]]
name = "halean-sun-grid"
root = "Exe.SunGrid"

[[lean_exe]]
name = "halean-core-states"
root = "Exe.CoreStates"

[[lean_exe]]
name = "halean-core-services"
root = "Exe.CoreServices"

[[lean_exe]]
name = "halean-core-events"
root = "Exe.CoreEvents"

[[lean_exe]]
name = "halean-core"
root = "Exe.Core"

[[lean_exe]]
name = "halean-script"
root = "Exe.Script"

name = "HALean"
version = "0.1.0"
defaultTargets = ["HALean", "halean-automation", "halean-template"]

[[lean_lib]]
name = "HALean"

# One executable per service. Each speaks JSON lines on stdin/stdout.
[[lean_exe]]
name = "halean-automation"
root = "HALean.Automation.Main"

[[lean_exe]]
name = "halean-template"
root = "HALean.Template.Main"

[[lean_exe]]
name = "halean-sun-grid"
root = "HALean.Automation.SunGrid"

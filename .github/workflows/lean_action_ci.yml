name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          # the library (default target) plus every executable, so pull
          # requests still compile the Exe/ roots
          build-args: HALean halean-automation halean-script halean-template halean-sun-grid halean-core halean-core-states halean-core-services halean-core-events

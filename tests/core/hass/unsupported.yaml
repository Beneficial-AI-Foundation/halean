# Joined core: inputs outside the model are rejected (HA does not run them).
# Run with: uv run tests/differential/run.py -k core

- name: rejected_inputs
  ops:
    - {op: listen, id: a, event_type: x, run_immediately: true, unsupported: true}
    - {op: listen, id: a, event_type: state_changed, filter: {eq: {new_state: null}}, unsupported: true}
    - {op: listen_once, id: a, event_type: x, filter: true, unsupported: true}
    - {op: listen, id: a, event_type: state_reported, unsupported: true}
    - {op: listen, id: a, event_type: x, filter: true, filter_callback: false, unsupported: true}
    - {op: fire, event_type: x, time_fired: 1795710645000000, unsupported: true}
    - {op: set, entity_id: light.é, state: "on", unsupported: true}
    - {op: call, domain: tést, service: x, unsupported: true}
    # probatio refuses AtLeastOne() with no keys when the schema is built
    - {op: register, domain: test, service: s, handler: {return: null},
       schema: {fields: [{key: a, value: {at_least_one: []}}]}, unsupported: true}
    # repr() escapes U+200B (not printable); not modelled
    - {op: call, domain: test, service: "x", data: {a: "a​b"}, unsupported: true}
    - op: listen
      id: a
      event_type: x
      react: [{call: {id: c, domain: d, service: s, catch: true}}]
      unsupported: true
    - {op: listen, id: ok, event_type: x}
    - {op: fire, event_type: x}

- name: runaway_recursion_rejected
  # a handler that calls itself: HA would end in RecursionError; the model
  # stops at MAX_CALL_DEPTH and rejects the operation, changing nothing
  ops:
    - op: register
      domain: test
      service: again
      handler:
        do:
          - set: {entity_id: counter.depth, state: "x", force_update: true}
          - call: {id: self, domain: test, service: again, blocking: true}
    - {op: call, domain: test, service: again, blocking: true, unsupported: true}
    - {op: get, entity_id: counter.depth}

- name: async_rejected_inputs
  ops:
    # a @callback cannot await; only asyncio.sleep(0) is modelled
    - {op: listen, id: a, event_type: x, react: [{sleep: 0}], unsupported: true}
    - {op: listen, id: a, event_type: x, react: [{wait: f}], unsupported: true}
    - {op: listen, id: a, event_type: x, async: true, react: [{sleep: 1}], unsupported: true}
    - {op: register, domain: test, service: s, handler: {do: [{wait: 3}]}, unsupported: true}
    - {op: listen, id: ok, event_type: x, async: true, react: [{sleep: 0}, {fire: {event_type: y}}]}
    - {op: fire, event_type: x}

- name: async_never_returning_rejected
  # HA would never return (or log in set order): checked on the model only
  engine_only: true
  manual: true
  ops:
    - op: listen
      id: w
      event_type: go
      async: true
      react: [{wait: never}]
    - {op: fire, event_type: go}
    # the task waits on a future nobody resolves
    - {op: block_till_done, unsupported: true}
    - {op: resolve, id: never}
    - {op: block_till_done}
    # the main task waits on a future nobody resolves
    - op: register
      domain: test
      service: stuck
      handler: {do: [{wait: never2}]}
    - {op: call, domain: test, service: stuck, blocking: true, unsupported: true}
    # two task exceptions freed together by block_till_done: set order
    - op: listen
      id: x1
      event_type: two
      async: true
      react: [{sleep: 0}, {raise: ValueError, message: one}]
    - op: listen
      id: x2
      event_type: two
      async: true
      react: [{sleep: 0}, {raise: ValueError, message: two}]
    - {op: fire, event_type: two}
    - {op: block_till_done, unsupported: true}
    # freed one at a time (outside block_till_done): fine
    - {op: sleep}
    - {op: sleep}
    - {op: block_till_done}
    # an async listener that re-fires its own event after each suspension
    - op: listen
      id: loop
      event_type: ping
      async: true
      react: [{sleep: 0}, {fire: {event_type: ping}}]
    - {op: fire, event_type: ping}
    - {op: block_till_done, unsupported: true}

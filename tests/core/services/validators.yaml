       data: {one: Light.Kitchen, many: "light.a, switch.B ,light.c", light: LIGHT.X, sw: [switch.y]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true,
       data: {many: [light.a], light: "light.b"}, target: {entity_id: ALL}}

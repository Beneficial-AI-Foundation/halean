    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, target: {entity_id: "None"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, target: {entity_id: "light.a,light.b"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {one: light}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {one: "light._x"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {one: 5}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {one: null}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {one: "light.x\n"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {many: null}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {many: "light.a,,light.b"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {many: [light.a, 3]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {many: [[light.a]]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {many: 5}}

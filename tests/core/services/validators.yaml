    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {p: 65536}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {p: true}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {p: 80.5}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {p: "http"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {p: null}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {p: " 22 "}}

- name: val_cv_string_boolean
  ops:
    - {op: register, domain: test_v, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: s, value: {cv: string}}, {key: b, value: {cv: boolean}}]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: "x", b: " YES "}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: 5, b: "Off"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: 1.0, b: "enable"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: false, b: "0"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: 2}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: 0.0}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: -0.5}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: false}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: "  MAYBE "}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: null}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: [1, "a"]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: {x: 1}}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: null}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: [1]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {s: {}}}

# cv.boolean strips with str.isspace (HALean.Template.cvBooleanText_iff): \v \f \x1c-\x1f
# (Unicode spaces are covered by template cases: repr() of non-printable non-ASCII text
# in the call_service event is a known gap)
- name: val_cv_boolean_whitespace
  ops:
    - {op: register, domain: test_v, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: b, value: {cv: boolean}}]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: "\x0bON\x0c"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {b: "\x1cno\x1f"}}

- name: val_cv_entity_ids
  ops:

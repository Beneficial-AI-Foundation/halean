- name: val_lower_upper_ensure_list_port
  ops:
    - {op: register, domain: test_v, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: lo, value: {lower: null}}, {key: up, value: {upper: null}},
                         {key: el, value: {ensure_list: null}}, {key: p, value: {port: null}},
                         {key: els, value: {all: [{ensure_list: null}, {list: [str]}]}}]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true,
       data: {lo: "MiXeD 1", up: "abc-é", el: null, p: 8123, els: "a"}, unsupported: true}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true,
       data: {lo: "MiXeD 1", up: "abc-x", el: null, p: 8123, els: "a"}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true,
       data: {lo: 1.5, up: [a, {b: null}], el: 5, p: "443", els: [a, b]}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true,
       data: {lo: null, up: true, el: [1], p: 80.0, els: []}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {el: {a: 1}, els: null}}
    - {op: call, domain: test_v, service: v, blocking: true, return_response: true, data: {els: 3}}

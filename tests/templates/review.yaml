# --- M8: loop.depth, loop.cycle -------------------------------------------------
- {name: m8_loop_depth, template: "{% for a in [1] %}{{ loop.depth }}{{ loop.depth0 }}{% endfor %}"}
- {name: m8_loop_cycle, template: "{% for x in [1, 2, 3] %}{{ loop.cycle('a', 'b') }}{% endfor %}"}
- {name: m8_loop_cycle_empty, template: "{% for x in [1] %}{{ loop.cycle() }}{% endfor %}"}
# loop.changed keeps state between calls: not modelled, refused
- {name: m8_loop_changed, template: "{% for x in [1, 1] %}{{ loop.changed(x) }}{% endfor %}", expect_error_in_halean_only: true}

# --- M9: for/else runs unless an iteration reached the end of the body ---------
- {name: m9_continue_else, template: "{% for x in [1] %}{% continue %}{% else %}E{% endfor %}"}
- {name: m9_continue_first_only, template: "{% for x in [1, 2] %}{% if x == 1 %}{% continue %}{% endif %}{{ x }}{% else %}E{% endfor %}"}
- {name: m9_continue_last_only, template: "{% for x in [1, 2] %}{% if x == 2 %}{% continue %}{% endif %}{{ x }}{% else %}E{% endfor %}"}
- {name: m9_break_first, template: "{% for x in [1, 2] %}{% break %}{% else %}E{% endfor %}"}
- {name: m9_break_second, template: "{% for x in [1, 2] %}{{ x }}{% if x == 2 %}{% break %}{% endif %}{% else %}E{% endfor %}"}
- {name: m9_empty_else, template: "{% for x in [] %}{{ x }}{% else %}E{% endfor %}"}

# --- M11: startswith/endswith with start and end ----------------------------------
- {name: m11_startswith_start, template: "{{ 'abc'.startswith('b', 1) }}"}
- {name: m11_endswith_end, template: "{{ 'abc'.endswith('b', 0, 2) }}"}
- {name: m11_more, template: "{{ ['abc'.startswith('', 3), 'abc'.startswith('', 4), 'abc'.endswith('c', -1), 'abc'.startswith('a', -10), 'abc'.endswith(('x', 'bc'), none, 3), 'abc'.startswith('ab', 0, 1), 'abc'.startswith('b', true)] }}"}
- {name: m11_tuple_non_str, template: "{{ 'abc'.startswith(('a', 1)) }}"}
- {name: m11_bad_index, template: "{{ 'abc'.startswith('a', 'x') }}"}

# --- M13: sum (Python 3.12+ compensated summation) ---------------------------------
- {name: m13_sum_floats, template: "{{ [0.1, 0.2, 0.3] | sum }}"}
- {name: m13_sum_mixed, template: "{{ [[1, 0.1, 0.2, 0.3] | sum, [0.1] * 10 | sum, [1e100, 1.0, -1e100] | sum, [true, 0.1, 0.2] | sum, [0.1, 0.2, 0.3] | sum(start=0.5)] }}"}
- {name: m13_sum_ints, template: "{{ [[1, 2, true] | sum, [2 ** 62, 2 ** 62, 1] | sum, [] | sum, [0.5] | sum(start=-1)] }}"}
# a total beyond Py_ssize_t leaves the fast paths: then floats add plainly
- {name: m13_sum_overflow, template: "{{ [2 ** 63, 0.1, 0.2, 0.3] | sum }} {{ [2 ** 62, 2 ** 62, 0.1, 0.2, 0.3] | sum }}"}
- {name: m13_sum_inf, template: "{{ [1e308, 1e308, -1e308] | sum }} {{ [('inf' | float), 1.0] | sum }}"}
- {name: m13_sum_attribute, template: "{{ [{'a': 0.1}, {'a': 0.2}, {'a': 0.3}] | sum(attribute='a') }}"}
- {name: m13_sum_lists, template: "{{ [[1], [2]] | sum(start=[]) }}"}
- {name: m13_sum_str_start, template: "{{ ['a'] | sum(start='') }}"}
- {name: m13_sum_str_items, template: "{{ ['a', 'b'] | sum }}"}


- {name: m16_as_datetime_24_more, template: "{{ as_datetime('2026-11-20 24:00') }}|{{ as_datetime('2026-12-31T24:00:00.000') }}|{{ as_datetime('2026-11-20T24:00:00+01:00') }}|{{ as_datetime('2026-11-20T24:00:00Z') }}"}

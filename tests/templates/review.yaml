# Cases from the external faithfulness review of 2026-11-24 (items M1-M18 of
# its section 4.3, and the features where HALean raised and HA did not), with
# the edge cases the fixes had to get right. Same format as cases.yaml.

# --- M1: float floor division and modulo (CPython's float_divmod) ------------
- {name: m1_floordiv_negzero, template: "{{ 0 // -0.5 }}"}
- {name: m1_floordiv_more, template: "{{ [0 // -0.5, -0.0 // 1, 0.0 // -1, 1 // -0.5, -1 // 0.5, 0 % -0.5, -0.0 % 1] }}"}
# (`inf` comes from a variable: Jinja folds `'inf' | float` into the compiled
# code as the name `inf`, a NameError; see README, Known gaps)
- name: m1_floordiv_inf
  template: "{% set i = s | float %}{{ [1.0 // i, -1.0 // i, 1.0 // -i, -1.0 // -i, 1.0 % i, -1.0 % i, 1.0 % -i, 0.0 // -i, -0.0 % i] }}"
  variables: {s: inf}
- name: m1_floordiv_inf_nan
  template: "{% set i = s | float %}{{ [i // 1, i % 2, -i // i] }}"
  variables: {s: inf}

# --- M2: string-literal escapes (unicode-escape) -----------------------------
- {name: m2_escape_u, template: "{{ '\\u00e9' }}"}
- {name: m2_escape_U, template: "{{ '\\U0001F600' | length }}"}
- {name: m2_escape_octal, template: "{{ ['\\101', '\\0', '\\7a', '\\1234', '\\777', '\\8'] }}"}
- {name: m2_escape_x, template: "{{ '\\x41\\x7e' }}"}
- {name: m2_escape_misc, template: "{{ ['\\a\\b\\f\\v', '\\q', 'a\\\nb'] }}"}
- {name: m2_escape_backslash_nonascii, template: "{{ ['\\é', '\\€'] }}"}
- {name: m2_escape_nonascii_literal, template: "{{ 'é€😀' | length }}"}
# \N{...} needs the Unicode name database: refused
- {name: m2_escape_N, template: "{{ '\\N{BULLET}' }}", unsupported: true}
# a lone surrogate cannot be a Lean Char: refused
- {name: m2_escape_surrogate, template: "{{ '\\ud800' | length }}", unsupported: true}
- {name: m2_escape_truncated, template: "{{ '\\x4' }}", unsupported: true, ha_error: true}
- {name: m2_escape_truncated_u, template: "{{ '\\u00e' }}", unsupported: true, ha_error: true}
- {name: m2_escape_too_large, template: "{{ '\\U00110000' }}", unsupported: true, ha_error: true}
# the lexer joins lines with \n (in text and in string literals)
- {name: m2_newlines, template: "{{ 'a\r\nb' | length }}x\r\ny\rz"}

# --- M3: repr() escapes what str.isprintable() rejects ------------------------
- {name: m3_repr_nonprint, template: "{{ ['\u0080', ' ', '　', '​', '­', ' '] }}"}
- {name: m3_repr_astral, template: "{{ ['\U000E0001', '\\uffff', '\U0010FFFF', '\U0001F600', 'é°€'] }}"}
- {name: m3_repr_unassigned, template: "{{ ['͸', 'ͷ'] }}"}

# --- M4: Unicode whitespace in split() and trim (already fixed before) -------
- {name: m4_split_unicode_space, template: "{{ 'a b　c'.split() }}"}
- {name: m4_trim_unicode_space, template: "{{ (' x　' | trim) | length }}"}


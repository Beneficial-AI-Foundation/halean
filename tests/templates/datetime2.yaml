# More dates and times: strptime, as_timedelta, relative_time, time_since,
# time_until, timedelta_string, the datetime test, timedelta() with floats.
# Clock frozen at 2026-11-20 16:30:45.123 UTC, HA in US/Pacific (see cases.yaml).


# --- relative_time / time_since / time_until / timedelta_string ---
- {template: "{{ relative_time(now() - timedelta(hours=2, minutes=40)) }} | {{ relative_time(now() - timedelta(seconds=1)) }} | {{ relative_time(now()) }} | {{ relative_time(now() + timedelta(hours=1)) }} | {{ relative_time('x') }} | {{ relative_time(5) }}"}
- {template: "{{ relative_time(now() - timedelta(days=400)) }} | {{ relative_time(now() - timedelta(days=45)) }} | {{ relative_time(now() - timedelta(days=15)) }} | {{ relative_time(now() - timedelta(seconds=89.5)) }} | {{ relative_time(now() - timedelta(seconds=90.5)) }}"}
- {template: "{{ time_since(now() - timedelta(days=400, hours=5, minutes=3, seconds=7)) }} | {{ time_since(now() - timedelta(days=400, hours=5, minutes=3, seconds=7), 2) }} | {{ time_since(now() - timedelta(days=400, hours=5, minutes=3, seconds=7), 0) }} | {{ time_since(now() - timedelta(days=400, hours=5, minutes=33), 3) }}"}
- {template: "{{ time_since(now() - timedelta(days=1, seconds=30), precision=2.0) }} | {{ time_since(now() - timedelta(days=1, seconds=30), true) }} | {{ time_since(now() - timedelta(days=1, seconds=30), 'x') }} | {{ time_since(now() - timedelta(days=1, seconds=30), -1) }}"}
- {template: "{{ time_until(now() + timedelta(hours=26, minutes=31)) }} | {{ time_until(now() + timedelta(hours=26, minutes=31), 2) }} | {{ time_until(now() - timedelta(hours=1)) }} | {{ time_until(now()) }} | {{ time_until(now() + timedelta(milliseconds=400)) }} | {{ time_until(now() + timedelta(milliseconds=600)) }}"}

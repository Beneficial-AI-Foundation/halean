# --- the demo's room report (demo/automations.yaml) ---------------------------
- name: demo room report
  template: "{% set t = states('sensor.living_room_temperature') | float(0) %} {{ t | round(1) }} °C, heater {{ states('switch.heater') }}, {{ 'cold' if t < 19.5 else 'comfortable' if t <= 21.5 else 'warm' }} (last: {{ trigger.to_state.name }} is {{ trigger.to_state.state }})"
  states:
    - {entity_id: sensor.living_room_temperature, state: "19.26"}
    - {entity_id: switch.heater, state: "off"}
  variables: {trigger: {to_state: {name: Living room temperature, state: "19.26"}}}
- name: demo room report condition
  template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown', 'unavailable'] }}"
  variables: {trigger: {to_state: {state: "unknown"}}}
  condition: true

# --- range, iteration over states, higher-order filters -----------------------
- {template: "{{ range(3) }} {{ range(1, 10, 3) | list }} {{ range(5, 0, -2) | list }} {{ 2 in range(3) }}"}
- {template: "{{ range(10) | length }} {{ range(0) | list }}"}
- {template: "{{ range(200000) }}"}
- {template: "{{ range(3, 1) | list }} {{ range(-3) | list }}"}
- template: "{% for s in states.light %}{{ s.entity_id }}={{ s.state }};{% endfor %}"
  states:
    - {entity_id: light.b, state: "on"}
    - {entity_id: switch.x, state: "off"}
    - {entity_id: light.a, state: "off"}
- template: "{{ states.light | list | length }} {{ states | count }}"
  states:
    - {entity_id: light.b, state: "on"}
    - {entity_id: switch.x, state: "off"}
    - {entity_id: light.a, state: "off"}
- template: "{{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
  states:
    - {entity_id: light.b, state: "on"}
    - {entity_id: light.a, state: "off"}
    - {entity_id: light.c, state: "on"}
- template: "{{ states | selectattr('domain', 'in', ['light', 'switch']) | rejectattr('state', 'eq', 'off') | map(attribute='name') | join(', ') }}"
  states:
    - {entity_id: light.b, state: "on", attributes: {friendly_name: Bed light}}
    - {entity_id: switch.fan, state: "on"}
    - {entity_id: sensor.t, state: "on"}
    - {entity_id: light.a, state: "off"}
- template: "{{ states.sensor | map(attribute='state') | map('float', 0) | sum }}"
  states:
    - {entity_id: sensor.a, state: "1.5"}
    - {entity_id: sensor.b, state: "unknown"}
    - {entity_id: sensor.c, state: "2"}
- template: "{{ states.light | map(attribute='attributes.brightness', default=0) | list }}"
  states:
    - {entity_id: light.a, state: "on", attributes: {brightness: 200}}
    - {entity_id: light.b, state: "off"}

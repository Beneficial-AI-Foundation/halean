  expect_error_in_halean_only: true
- template: "{{ is_state('light.x', 'on') }} {{ is_state('light.x', ['off', 'on']) }} {{ is_state('light.y', 'on') }}"
  states: [{entity_id: light.x, state: "on"}]
- template: "{{ state_attr('light.x', 'brightness') }} {{ state_attr('light.x', 'nope') }} {{ state_attr('light.z', 'a') }}"
  states: [{entity_id: light.x, state: "on", attributes: {brightness: 128}}]
- template: "{{ is_state_attr('light.x', 'brightness', 128) }} {{ is_state_attr('light.x', 'brightness', '128') }}"
  states: [{entity_id: light.x, state: "on", attributes: {brightness: 128}}]
- template: "{{ has_value('sensor.a') }} {{ has_value('sensor.b') }} {{ has_value('sensor.c') }}"
  states:
    - {entity_id: sensor.a, state: "1"}
    - {entity_id: sensor.b, state: "unknown"}
- template: "{{ 'light.x' is is_state('on') }} {{ 'sensor.a' | has_value }} {{ 'light.x' | state_attr('brightness') }}"
  states:
    - {entity_id: light.x, state: "on", attributes: {brightness: 1}}
    - {entity_id: sensor.a, state: "1"}
- template: "{{ 'sensor.a' | states }}"
  states: [{entity_id: sensor.a, state: "on"}]
- template: "{{ state_attr('light.x', 'rgb') }}"
  states: [{entity_id: light.x, state: "on", attributes: {rgb: [255, 0, 10]}}]


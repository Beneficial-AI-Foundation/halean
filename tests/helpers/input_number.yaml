# input_number: config (bounds, step, mode), set_value / increment /
# decrement, float formatting of the state, NaN, restore.
- name: input_number_services
  steps:
    - setup:
        input_number:
          n: {min: 0, max: 10, step: 0.1}
          m: {min: -1, max: 1e16, initial: 0.3, name: M, unit_of_measurement: "°C", mode: box, icon: "mdi:x"}
          k: {min: "-5", max: "5.5", initial: "2", step: "2.5"}
    - call: input_number.increment
      data: {entity_id: input_number.n}
    - call: input_number.increment
      data: {entity_id: input_number.n}
    - call: input_number.increment
      data: {entity_id: input_number.n}
    - call: input_number.decrement
      data: {entity_id: input_number.n}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: 9.95}
    - call: input_number.increment
      data: {entity_id: input_number.n}
    - call: input_number.increment
      data: {entity_id: input_number.n}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: 11}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: -0.0001}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: "3"}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: "three"}
    - call: input_number.set_value
      data: {entity_id: input_number.n}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: true}
    - call: input_number.set_value
      data: {entity_id: input_number.m, value: 123456789012345.6}
    - call: input_number.set_value
      data: {entity_id: input_number.m, value: 0.00001}
    - call: input_number.set_value
      data: {entity_id: input_number.m, value: 1e15}
    - call: input_number.set_value
      data: {entity_id: input_number.m, value: 0.1}
    - call: input_number.increment
      data: {entity_id: input_number.m}
    - call: input_number.increment
      data: {entity_id: input_number.m}
    - call: input_number.decrement
      data: {entity_id: input_number.k}
    - call: input_number.decrement
      data: {entity_id: input_number.k}
    - call: input_number.decrement
      data: {entity_id: input_number.k}
    - call: input_number.decrement
      data: {entity_id: input_number.k}
    - call: input_number.increment
      data: {entity_id: [input_number.k, input_number.n]}
    - call: input_number.set_value
      data: {entity_id: all, value: 5}
    - call: input_number.set_value
      data: {entity_id: all, value: 10.5}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: "nan"}
    - call: input_number.increment
      data: {entity_id: input_number.n}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: "inf"}
    - call: input_number.set_value
      data: {entity_id: input_number.n, value: "-0"}

- name: input_number_config_bounds
  steps:
    - setup:
        input_number:
          x: {min: 3, max: 1}
- name: input_number_config_equal_bounds
  steps:
    - setup:
        input_number:
          x: {min: 3, max: 3}
- name: input_number_config_initial_out_of_range
  steps:
    - setup:
        input_number:
          x: {min: 0, max: 3, initial: 5}
          y: {min: 1}
- name: input_number_config_missing_max
  steps:
    - setup:
        input_number:
          x: {min: 0}
- name: input_number_config_none
  steps:
    - setup:
        input_number:
          x:
- name: input_number_config_step_zero
  steps:
    - setup:
        input_number:
          x: {min: 0, max: 1, step: 0}
- name: input_number_config_bad_mode
  steps:
    - setup:
        input_number:
          x: {min: 0, max: 1, mode: dial}
- name: input_number_config_bad_number
  steps:
    - setup:
        input_number:
          x: {min: zero, max: 1}
- name: input_number_config_nan_bounds
  steps:
    - setup:
        input_number:
          x: {min: "nan", max: 1}
    - call: input_number.increment
      data: {entity_id: input_number.x}
    - call: input_number.set_value
      data: {entity_id: input_number.x, value: 0.5}

- name: input_number_restore
  steps:
    - setup:
        input_number:
          a: {min: 0, max: 10}
          b: {min: 0, max: 10}
          c: {min: 0, max: 10}
          d: {min: 0, max: 10, initial: 2}
          e: {min: 0, max: 10}
      restore:
        - [input_number.a, "7.5", {}]
        - [input_number.b, "11", {}]
        - [input_number.c, "unknown", {}]
        - [input_number.d, "5", {}]
        - [input_number.e, " 3 ", {}]

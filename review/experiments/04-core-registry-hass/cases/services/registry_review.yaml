# Review cases for the service registry (format of tests/core/services/registry.yaml).
- name: s_brace_domain_not_found
  ops:
    - {op: call, domain: "{service}", service: x, blocking: true}

- name: s_brace_variants_not_found
  ops:
    - {op: call, domain: "a", service: "{domain}", blocking: true}
    - {op: call, domain: "{", service: "}", blocking: true}
    - {op: call, domain: "{0}", service: "{}", blocking: false}
    - {op: call, domain: "{{domain}}", service: "{return_response}", blocking: true}

- name: s_brace_service_in_domain_uppercase
  ops:
    - {op: call, domain: "X{SERVICE}", service: "Y", blocking: true}

- name: s_ctx_empty_id
  ops:
    - {op: register, domain: test_a, service: echo, handler: {echo: true}, supports_response: optional}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, context: {id: ""}}

- name: s_ctx_empty_id_nonblocking_error_log
  ops:
    - {op: register, domain: test_a, service: bad, handler: {raise: ValueError, message: boom}}
    - {op: call, domain: test_a, service: bad, context: {id: "", user_id: u, parent_id: p}}

- name: s_ctx_fields
  ops:
    - {op: register, domain: test_a, service: echo, handler: {echo: true}, supports_response: optional}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, context: {id: c1, user_id: null, parent_id: null}}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, context: {id: " ", user_id: "", parent_id: ""}}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, context: {id: "id with 'quotes' and \\ backslash", parent_id: "p"}}
    - {op: call, domain: test_a, service: echo, context: {id: only-nb}}
    - {op: call, domain: test_a, service: nope, blocking: true, context: {id: c2}}

- name: s_log_repr_nested_data
  ops:
    - {op: register, domain: test_a, service: f, handler: {raise: ValueError, message: "m"}}
    - {op: call, domain: test_a, service: f, data: {a: [{b: 1}, "q'x"], c: "it's", d: {}, e: {f: {}}, g: "", h: [], i: null, j: 1.5e+20}}
    - {op: call, domain: test_a, service: f, data: {"": 1, " ": " "}}
    - {op: call, domain: test_a, service: f, data: {a: {b: [1, {c: 2}]}}, target: {a: 2}}
    - {op: call, domain: test_a, service: f, data: {a: {b: {c: {d: true}}}, z: [[], [[]], {}]}}
    - {op: call, domain: test_a, service: f, data: {"k=v": "a, b", "x": "=", "y": ","}}
    - {op: call, domain: test_a, service: f, data: {t: true, f: false, n: null, i: -7, fl: -0.0, big: 123456789012345678901234567890}}

- name: s_empty_names
  ops:
    - {op: register, domain: "", service: "", handler: {return: null}}
    - {op: has, domain: "", service: ""}
    - {op: call, domain: "", service: "", blocking: true}
    - {op: list}
    - {op: list_domain, domain: ""}
    - {op: supports_response, domain: "", service: ""}
    - {op: remove, domain: "", service: ""}
    - {op: call, domain: "", service: "", blocking: true}
    - {op: remove, domain: "", service: ""}

- name: s_raise_without_message
  ops:
    - {op: register, domain: test_a, service: f, handler: {raise: HomeAssistantError}}
    - {op: register, domain: test_a, service: g, handler: {raise: Invalid}}
    - {op: register, domain: test_a, service: h, handler: {raise: ServiceValidationError, message: ""}}
    - {op: register, domain: test_a, service: i, handler: {raise: RuntimeError}}
    - {op: call, domain: test_a, service: f, blocking: true}
    - {op: call, domain: test_a, service: g, blocking: true}
    - {op: call, domain: test_a, service: h, blocking: true}
    - {op: call, domain: test_a, service: i, blocking: true}
    - {op: call, domain: test_a, service: f}
    - {op: call, domain: test_a, service: g}
    - {op: call, domain: test_a, service: h}
    - {op: call, domain: test_a, service: i}


    - {op: register, domain: test_a, service: two, handler: {return: null}}
    - {op: register, domain: test_a, service: three, handler: {return: null}, schema: {fields: [{key: a, type: int}]}}
    - {op: register, domain: TEST_A, service: One, handler: {raise: ValueError, message: replaced}}
    - {op: list}
    - {op: supports_response, domain: test_a, service: one}
    - {op: call, domain: test_a, service: one, blocking: true, return_response: true}
    - {op: call, domain: test_a, service: one, blocking: true}
    - {op: register, domain: test_a, service: three, handler: {echo: true}, supports_response: optional}
    - {op: call, domain: test_a, service: three, blocking: true, return_response: true, data: {a: "not an int", extra: 1}}
    - {op: list}

- name: s_target_overrides_keep_position
  ops:
    - {op: register, domain: test_a, service: echo, handler: {echo: true}, supports_response: optional}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, data: {a: 1, b: 2, c: 3}, target: {d: 4, b: 20, a: 10}}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, target: {z: 1, y: 2}}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, data: null, target: null}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, data: {}, target: {only: target}}
    - {op: call, domain: test_a, service: echo, blocking: true, return_response: true, data: {only: data}, target: {}}
    - {op: call, domain: test_a, service: echo, data: {a: 1}, target: {a: {nested: [1]}}}

- name: s_check_order_not_found_then_response_then_schema
  ops:
    - {op: register, domain: test_a, service: none, handler: {return: {a: 1}}, schema: {fields: [{key: n, type: int, required: true}]}}
    - {op: register, domain: test_a, service: only, handler: {return: {a: 1}}, supports_response: only, schema: {fields: [{key: n, type: int, required: true}]}}
    # not found comes before the return_response rules
    - {op: call, domain: test_a, service: nope, return_response: true}
    # blocking=False with return_response comes before "does not support"
    - {op: call, domain: test_a, service: none, return_response: true, data: {bad: 1}}
    # the response rules come before the schema
    - {op: call, domain: test_a, service: none, blocking: true, return_response: true, data: {bad: 1}}
    - {op: call, domain: test_a, service: only, blocking: true, data: {bad: 1}}
    - {op: call, domain: test_a, service: only, data: {bad: 1}}
    # then the schema: no call_service event
    - {op: call, domain: test_a, service: only, blocking: true, return_response: true, data: {bad: 1}}
    - {op: call, domain: test_a, service: none, data: {n: "x"}}
    - {op: call, domain: test_a, service: none, data: {n: 1}}
    - {op: call, domain: test_a, service: only, blocking: true, return_response: true, target: {n: 2}}


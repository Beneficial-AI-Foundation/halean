    - {op: list}
    - {op: remove, domain: test_b, service: y}
    - {op: register, domain: test_b, service: y2, handler: {return: null}}
    - {op: register, domain: test_b, service: y, handler: {return: null}}
    - {op: list}
    - {op: list_domain, domain: test_b}


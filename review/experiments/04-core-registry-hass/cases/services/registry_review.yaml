    - {op: call, domain: "TE ST", service: "a.b\tc", blocking: true, return_response: true}
    - {op: call, domain: "TE ST", service: "a.b\tc", data: {x: 1}}
    - {op: call, domain: "TE ST", service: "nope\n", blocking: true}
    - {op: remove, domain: "te st", service: "A.b\tC"}
    - {op: remove, domain: "te st", service: "A.b\tC"}
    - {op: list}


    - {op: register, domain: test, service: s19, handler: {do: [{call: {id: c19, domain: test, service: s20, blocking: true}}]}}
    - {op: register, domain: test, service: s18, handler: {do: [{call: {id: c18, domain: test, service: s19, blocking: true}}]}}
    - {op: register, domain: test, service: s17, handler: {do: [{call: {id: c17, domain: test, service: s18, blocking: true}}]}}
    - {op: register, domain: test, service: s16, handler: {do: [{call: {id: c16, domain: test, service: s17, blocking: true}}]}}
    - {op: register, domain: test, service: s15, handler: {do: [{call: {id: c15, domain: test, service: s16, blocking: true}}]}}
    - {op: register, domain: test, service: s14, handler: {do: [{call: {id: c14, domain: test, service: s15, blocking: true}}]}}
    - {op: register, domain: test, service: s13, handler: {do: [{call: {id: c13, domain: test, service: s14, blocking: true}}]}}
    - {op: register, domain: test, service: s12, handler: {do: [{call: {id: c12, domain: test, service: s13, blocking: true}}]}}
    - {op: register, domain: test, service: s11, handler: {do: [{call: {id: c11, domain: test, service: s12, blocking: true}}]}}
    - {op: register, domain: test, service: s10, handler: {do: [{call: {id: c10, domain: test, service: s11, blocking: true}}]}}
    - {op: listen, id: m, event_type: bottom}
    - {op: call, domain: test, service: s10, blocking: true}

- name: h_handler_spec_with_raise_and_return
  # the spec format says one of return / echo / raise; both harness and driver accept more than one
  ops:
    - {op: register, domain: test, service: both, handler: {raise: ValueError, message: v, return: {a: 1}}, supports_response: optional}
    - {op: call, domain: test, service: both, blocking: true, return_response: true}

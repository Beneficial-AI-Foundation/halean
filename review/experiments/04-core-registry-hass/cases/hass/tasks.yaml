# Review cases: tasks, futures, block_till_done rounds, failed-task logging.
- name: h_future_several_waiters_order
  manual: true
  ops:
    - {op: listen, id: w1, event_type: go, async: true, react: [{wait: f}, {fire: {event_type: w1_woken}}, {sleep: 0}, {fire: {event_type: w1_end}}]}
    - {op: listen, id: w2, event_type: go, async: true, react: [{sleep: 0}, {wait: f}, {fire: {event_type: w2_woken}}]}
    - {op: listen, id: w3, event_type: go, async: true, react: [{wait: f}, {fire: {event_type: w3_woken}}, {wait: f}, {fire: {event_type: w3_again}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: sleep}
    - {op: resolve, id: f}
    - {op: sleep}
    - {op: sleep}

- name: h_future_resolved_before_wait
  manual: true
  ops:
    - {op: resolve, id: f}
    - {op: register, domain: test, service: s, handler: {do: [{wait: f}, {fire: {event_type: no_suspend}}, {resolve: g}, {wait: g}, {fire: {event_type: still_no_suspend}}], return: {ok: 1}}, supports_response: optional}
    - {op: listen, id: m, event_type: "*"}
    - {op: call, domain: test, service: s, blocking: true, return_response: true}
    - {op: call, domain: test, service: s, unsupported: true}
    - {op: listen, id: a, event_type: go, async: true, react: [{wait: f}, {raise: RuntimeError, message: "sync prefix"}]}
    - {op: fire, event_type: go}

- name: h_main_and_task_wait_same_future
  manual: true
  ops:
    - {op: register, domain: test, service: waiter, handler: {do: [{fire: {event_type: waiting}}, {wait: f}, {fire: {event_type: main_woken}}], return: {ok: 1}}, supports_response: optional}
    - {op: listen, id: t1, event_type: waiting, async: true, react: [{wait: f}, {fire: {event_type: t1_woken}}]}
    - {op: listen, id: res, event_type: waiting, async: true, react: [{sleep: 0}, {resolve: f}, {fire: {event_type: resolved}}]}
    - {op: listen, id: t2, event_type: waiting, async: true, react: [{wait: f}, {fire: {event_type: t2_woken}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: call, domain: test, service: waiter, blocking: true, return_response: true}
    - {op: sleep}

- name: h_future_resolved_by_callback_in_same_dispatch
  manual: true
  ops:
    - {op: listen, id: r, event_type: need, react: [{resolve: f}]}
    - {op: register, domain: test, service: s, handler: {do: [{fire: {event_type: need}}, {wait: f}, {fire: {event_type: got}}]}}
    - {op: listen, id: m, event_type: "*"}
    - {op: call, domain: test, service: s, blocking: true}
    - {op: listen, id: inside, event_type: outer, react: [{call: {id: nb, domain: test, service: s2}}, {fire: {event_type: outer_end}}]}
    - {op: listen, id: r2, event_type: need2, react: [{resolve: f2}]}
    - {op: register, domain: test, service: s2, handler: {do: [{fire: {event_type: need2}}, {wait: f2}, {fire: {event_type: got2}}]}}
    - {op: fire, event_type: outer}
    - {op: sleep}
    - {op: sleep}

- name: h_async_raise_before_suspension
  ops:
    - {op: listen, id: a, event_type: go, async: true, react: [{fire: {event_type: a_pre}}, {raise: ValueError, message: "sync"}]}
    - {op: listen, id: b, event_type: go, react: [{raise: RuntimeError, message: "cb"}]}
    - {op: listen, id: c, event_type: go, async: true, react: [{call: {id: nf, domain: test, service: nope, blocking: true}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}

- name: h_async_raise_after_suspension
  ops:
    - {op: listen, id: a, event_type: go, async: true, react: [{sleep: 0}, {fire: {event_type: a_mid}}, {raise: ValueError, message: "late"}]}
    - {op: listen, id: ok, event_type: go, async: true, react: [{sleep: 0}, {sleep: 0}, {sleep: 0}, {fire: {event_type: ok_done}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}

- name: h_async_raise_after_suspension_manual_sleeps
  manual: true
  ops:
    - {op: listen, id: a, event_type: go, async: true, react: [{sleep: 0}, {fire: {event_type: a_mid}}, {raise: ValueError, message: "late"}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: sleep}
    - {op: fire, event_type: other}
    - {op: sleep}
    - {op: sleep}

- name: h_failed_task_finished_before_block_till_done
  manual: true
  ops:
    - {op: listen, id: bad, event_type: go, async: true, react: [{sleep: 0}, {raise: ValueError, message: "early"}]}
    - {op: listen, id: slow, event_type: go, async: true, react: [{sleep: 0}, {sleep: 0}, {sleep: 0}, {fire: {event_type: slow_done}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: sleep}
    - {op: fire, event_type: between}
    - {op: block_till_done}

- name: h_failed_task_done_but_in_set_when_round_starts
  manual: true
  ops:
    - {op: listen, id: bad, event_type: go, async: true, react: [{sleep: 0}, {raise: ValueError, message: "at round start"}]}
    - {op: listen, id: slow, event_type: go, async: true, react: [{sleep: 0}, {sleep: 0}, {sleep: 0}, {fire: {event_type: slow_done}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: block_till_done}
    - {op: fire, event_type: after}

- name: h_failures_in_separate_rounds
  manual: true
  ops:
    - {op: listen, id: bad1, event_type: go, async: true, react: [{sleep: 0}, {sleep: 0}, {raise: ValueError, message: "one"}]}
    - {op: listen, id: spawner, event_type: go, async: true, react: [{sleep: 0}, {sleep: 0}, {sleep: 0}, {sleep: 0}, {fire: {event_type: again}}]}
    - {op: listen, id: bad2, event_type: again, async: true, react: [{sleep: 0}, {sleep: 0}, {sleep: 0}, {raise: RuntimeError, message: "two"}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: block_till_done}

- name: h_task_fails_while_main_awaits_blocking_call
  manual: true
  ops:
    - {op: register, domain: test, service: slow, handler: {do: [{fire: {event_type: started}}, {sleep: 0}, {sleep: 0}, {sleep: 0}, {sleep: 0}, {fire: {event_type: finished}}]}}
    - {op: listen, id: bad, event_type: started, async: true, react: [{sleep: 0}, {raise: ValueError, message: "during call"}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: call, domain: test, service: slow, blocking: true}

- name: h_async_listener_blocking_call_error_after_suspend
  ops:
    - {op: register, domain: test, service: late_fail, handler: {do: [{sleep: 0}], raise: HomeAssistantError, message: "late"}}
    - {op: listen, id: a, event_type: go, async: true, react: [{call: {id: c, domain: test, service: late_fail, blocking: true, data: {x: 1}}}, {fire: {event_type: not_reached}}]}
    - {op: listen, id: a2, event_type: go2, async: true, react: [{call: {id: c2, domain: test, service: late_fail, data: {y: [1]}}}, {fire: {event_type: reached}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: fire, event_type: go2}

- name: h_block_till_done_three_generations
  manual: true
  ops:
    - {op: listen, id: g1, event_type: gen1, async: true, react: [{sleep: 0}, {fire: {event_type: gen2}}, {sleep: 0}, {fire: {event_type: g1_end}}]}
    - {op: listen, id: g2, event_type: gen2, async: true, react: [{sleep: 0}, {sleep: 0}, {fire: {event_type: gen3}}]}
    - {op: listen, id: g3, event_type: gen3, async: true, react: [{sleep: 0}, {sleep: 0}, {sleep: 0}, {fire: {event_type: g3_end}}, {raise: ValueError, message: "g3"}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: gen1}
    - {op: block_till_done}
    - {op: block_till_done}

- name: h_callback_listener_blocking_call_handler_suspends
  manual: true
  ops:
    - {op: register, domain: test, service: slow, handler: {do: [{fire: {event_type: s1}}, {sleep: 0}, {fire: {event_type: s2}}], raise: ValueError, message: "slow failed"}}
    - {op: listen, id: cb, event_type: go, react: [{call: {id: b, domain: test, service: slow, blocking: true}}, {call: {id: nb, domain: test, service: slow, data: {q: 1}}}, {fire: {event_type: cb_end}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: sleep}
    - {op: sleep}

- name: h_nonblocking_then_raise_in_async_listener
  ops:
    - {op: register, domain: test, service: slow, handler: {do: [{sleep: 0}, {fire: {event_type: slow_end}}]}}
    - {op: listen, id: a, event_type: go, async: true, react: [{call: {id: nb, domain: test, service: slow}}, {raise: ValueError, message: "after nb"}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}

- name: h_react_times_and_filter_async
  ops:
    - {op: listen, id: a, event_type: go, async: true, filter: {has: k}, react_times: 1, react: [{sleep: 0}, {fire: {event_type: a_ran, context: inherit}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: fire, event_type: go, data: {k: 1}, context: {id: c1}}
    - {op: fire, event_type: go, data: {k: 2}}

- name: h_task_dispatch_nested_queue
  manual: true
  ops:
    - {op: listen, id: t, event_type: go, async: true, react: [{sleep: 0}, {fire: {event_type: e1}}, {fire: {event_type: e2}}]}
    - {op: listen, id: l1, event_type: e1, react: [{fire: {event_type: e1a}}, {fire: {event_type: e1b}}]}
    - {op: listen, id: l1a, event_type: e1a, react: [{fire: {event_type: e1aa}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: sleep}

- name: h_two_blocking_callers_same_suspending_service
  manual: true
  ops:
    - {op: register, domain: test, service: slow, handler: {do: [{sleep: 0}, {fire: {event_type: slow_mid, context: inherit}}, {wait: gate}], echo: true}, supports_response: optional}
    - {op: listen, id: c1, event_type: go, async: true, react: [{call: {id: r1, domain: test, service: slow, blocking: true, return_response: true, data: {who: 1}, context: {id: k1}}}]}
    - {op: listen, id: c2, event_type: go, react: [{call: {id: r2, domain: test, service: slow, blocking: true, return_response: true, data: {who: 2}, context: {id: k2}}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: sleep}
    - {op: resolve, id: gate}
    - {op: block_till_done}

- name: h_resume_sees_later_clock
  manual: true
  ops:
    - {op: listen, id: a, event_type: go, async: true, react: [{set: {entity_id: sensor.t, state: "1"}}, {sleep: 0}, {set: {entity_id: sensor.t, state: "2"}}, {fire: {event_type: late}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go, now: 1795710645000000}
    - {op: get, entity_id: sensor.t, now: 1795710646000000}
    - {op: sleep, now: 1795710647500000}
    - {op: get, entity_id: sensor.t}

- name: h_resolve_twice_in_callback_listener
  ops:
    - {op: listen, id: r, event_type: go, react: [{resolve: f}, {fire: {event_type: resolved_once}}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: fire, event_type: go, unsupported: true}

- name: h_async_listener_survives_removal
  manual: true
  ops:
    - {op: listen, id: a, event_type: go, async: true, react: [{unsub: a}, {sleep: 0}, {fire: {event_type: a_after_unsub}}, {unsub: a}]}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: go}
    - {op: fire, event_type: go}
    - {op: sleep}

- name: h_block_till_done_main_only_noop_and_sleep_noop
  manual: true
  ops:
    - {op: block_till_done}
    - {op: sleep}
    - {op: listen, id: m, event_type: "*"}
    - {op: fire, event_type: x}
    - {op: block_till_done}

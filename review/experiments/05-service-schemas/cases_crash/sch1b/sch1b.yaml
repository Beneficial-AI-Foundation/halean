# SCH-1, second form: a zero mantissa (Python: 0.0, a valid 0-second period).

- name: hw_sch1_time_period_zero_huge_exponent
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: t, value: {cv: time_period}}]}}
    - {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {t: "0e9999999999"}}

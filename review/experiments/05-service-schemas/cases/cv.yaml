# Hand-written cases: cv.* validators.

- name: hw_cv_boolean_string
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: b, value: {cv: boolean}}, {key: s, value: {cv: string}}]}}
    - &c1 {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {b: "tRuE"}}
    - {<<: *c1, data: {b: "\tON\n"}}
    - {<<: *c1, data: {b: "Enable"}}
    - {<<: *c1, data: {b: "DISABLE "}}
    - {<<: *c1, data: {b: "enabled"}}
    - {<<: *c1, data: {b: "y"}}
    - {<<: *c1, data: {b: "01"}}
    - {<<: *c1, data: {b: "1.0"}}
    - {<<: *c1, data: {b: ""}}
    - {<<: *c1, data: {b: "  "}}
    - {<<: *c1, data: {b: " N O "}}
    - {<<: *c1, data: {b: "TRUE "}}
    - {<<: *c1, data: {b: "　off "}}
    - {<<: *c1, data: {b: -0.0}}
    - {<<: *c1, data: {b: 5.0e-324}}
    - {<<: *c1, data: {b: -7}}
    - {<<: *c1, data: {b: 100000000000000000000000000000000000000}}
    - {<<: *c1, data: {b: []}}
    - {<<: *c1, data: {b: [true]}}
    - {<<: *c1, data: {b: {"on": true}}}
    - {<<: *c1, data: {s: ""}}
    - {<<: *c1, data: {s: 1.0e+16}}
    - {<<: *c1, data: {s: -0.0}}
    - {<<: *c1, data: {s: true}}
    - {<<: *c1, data: {s: 12345678901234567890123}}
    - {<<: *c1, data: {s: "é"}}
    - {<<: *c1, data: {s: []}}


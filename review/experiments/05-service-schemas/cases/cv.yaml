                         {key: comp, value: {cv: comp_entity_ids}},
                         {key: dom, value: {cv: entity_domain, domain: light}},
                         {key: doms, value: {cv: entity_domain, domain: [light, "switch"]}},
                         {key: nodom, value: {cv: entity_domain, domain: []}}]}}

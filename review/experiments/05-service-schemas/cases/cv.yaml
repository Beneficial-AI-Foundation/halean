- name: hw_lower_upper_containers
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: lo, value: {lower: null}}, {key: up, value: {upper: null}},
                         {key: chain, value: {all: [{upper: null}, {in: ["TRUE", "NONE", "1.5E-05", "[1, 'A']"]}]}}]}}
    - &c5 {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {lo: [A, {B: null}, true, 1.0e-5]}}
    - {<<: *c5, data: {up: {a: [1.5, "it's", 'q"q'], b: false}}}
    - {<<: *c5, data: {lo: 1.0e+16, up: 1.0e-7}}
    - {<<: *c5, data: {chain: true}}
    - {<<: *c5, data: {chain: null}}
    - {<<: *c5, data: {chain: 0.000015}}
    - {<<: *c5, data: {chain: [1, a]}}
    - {<<: *c5, data: {chain: "none "}}

- name: hw_timedelta_through_validators
  # a timedelta made by cv.time_period, then read by another validator
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [
         {key: bool, value: {all: [{cv: time_period}, {cv: boolean}]}},
         {key: eid, value: {all: [{cv: time_period}, {cv: entity_id}]}},
         {key: slug, value: {all: [{cv: time_period}, {cv: slug}]}},
         {key: tps, value: {all: [{cv: time_period}, {cv: time_period_str}]}},
         {key: sec, value: {all: [{cv: time_period}, {cv: time_period_seconds}]}},
         {key: rng, value: {all: [{cv: time_period}, {range: {min: 0}}]}},
         {key: len, value: {all: [{cv: time_period}, {length: {min: 0}}]}},
         {key: ci, value: {all: [{cv: time_period}, {coerce: int}]}},
         {key: port, value: {all: [{cv: time_period}, {port: null}]}},
         {key: lst, value: {all: [{cv: time_period}, {ensure_list: null}, {list: [timedelta]}]}},
         {key: lit, value: {all: [{cv: time_period}, {in: [0, "0:00:00"]}]}},
         {key: td, value: {all: [{cv: time_period}, timedelta, {cv: positive_time_period}]}},
         {key: lo, value: {all: [{cv: time_period}, {lower: null}]}}]}}
    - &c6 {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {bool: 0}}
    - {<<: *c6, data: {eid: "1:30"}}
    - {<<: *c6, data: {slug: -1.5}}
    - {<<: *c6, data: {tps: 90061.000001}}
    - {<<: *c6, data: {sec: {days: 2}}}
    - {<<: *c6, data: {rng: 5}}
    - {<<: *c6, data: {len: 5}}
    - {<<: *c6, data: {ci: 5}}
    - {<<: *c6, data: {port: 80}}
    - {<<: *c6, data: {lst: 0}}
    - {<<: *c6, data: {lit: 0}}
    - {<<: *c6, data: {td: 172800}}
    - {<<: *c6, data: {td: -1}}
    - {<<: *c6, data: {lo: 86400.5}}

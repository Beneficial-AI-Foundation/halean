# Reproducers of the divergences in FINDINGS.md. Each case fails with the
# shipped assertions, except hw_sch3_control (the same data before the schema's
# 50th validation), which passes.

- name: hw_sch2_repr_non_printable
  # SCH-2: repr() of a string with a non-printable non-ASCII character
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: s, type: str}]}}
    - {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {s: "a b"}}

- name: hw_sch2_path_non_printable_key
  # SCH-2, in a message: the path of an unknown key
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: s, type: str}]}}
    - {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {"​": 1}}

- name: hw_sch3_control
  # the datum of SCH-3 on a schema validated fewer than 50 times: both say "expected float"
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: f, value: {coerce: float}}]}}
    - {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {f: }}

- name: hw_sch3_coerce_float_after_50_validations

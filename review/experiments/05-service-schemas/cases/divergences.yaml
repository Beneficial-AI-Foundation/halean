- name: hw_sch4_timedelta_not_iterable
  # SCH-4: the TypeError of iterating a timedelta names the type 'datetime.timedelta'
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: e, value: {all: [{cv: time_period}, {cv: entity_ids}]}}]}}
    - {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {e: 5}}

- name: hw_sch5_slug_ampersand_semicolon
  # SCH-5: text with '&' and ';' but no HTML entity is refused
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: sl, value: {cv: slug}}]}}
    - {op: call, domain: hw, service: v, blocking: true, return_response: true, data: {sl: "a;&"}}

- name: hw_sch6_at_least_one_no_keys
  # SCH-6: probatio.AtLeastOne() raises SchemaError; HALean registers the service
  ops:
    - {op: register, domain: hw, service: v, handler: {echo: true}, supports_response: only,
       schema: {fields: [{key: m, value: {at_least_one: []}}]}}

# Timestamps, isoformat, compressed state, contexts.

- name: time_whole_second
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:00+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:31:01+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: get, entity_id: s.a}

- name: time_microsecond_edges
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:00.000001+00:00"}
    - {op: set, entity_id: s.b, state: x, now: "2026-11-20T16:31:00.999999+00:00"}
    - {op: set, entity_id: s.c, state: x, now: "2026-11-20T16:31:00.100000+00:00"}
    - {op: set, entity_id: s.d, state: x, now: "2026-11-20T16:31:00.000010+00:00"}
    - {op: set, entity_id: s.e, state: x, now: "2026-11-20T23:59:59.999999+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: inspect, entity_id: s.b}
    - {op: inspect, entity_id: s.c}
    - {op: inspect, entity_id: s.d}
    - {op: inspect, entity_id: s.e}

- name: time_one_microsecond_apart
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:00.000001+00:00"}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:31:00.000002+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:31:00.000003+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: get, entity_id: s.a}

- name: time_same_instant_ops
  ops:
    - {op: set, entity_id: s.a, state: x}
    - {op: set, entity_id: s.a, state: x}
    - {op: set, entity_id: s.a, state: y}
    - {op: set, entity_id: s.a, state: y, attributes: {a: 1}}
    - {op: inspect, entity_id: s.a}
    - {op: remove, entity_id: s.a}

- name: time_goes_backwards
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:00+00:00"}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:30:00+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:29:00+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: get, entity_id: s.a}

- name: time_other_utc_offset_in_case
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T18:31:00.5+02:00"}
    - {op: get, entity_id: s.a}

- name: time_year_2038_and_2106
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2038-01-19T03:14:08.000001+00:00"}
    - {op: set, entity_id: s.b, state: x, now: "2106-02-07T06:28:16.999999+00:00"}
    - {op: set, entity_id: s.c, state: x, now: "2200-06-15T12:00:00.654321+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: inspect, entity_id: s.b}
    - {op: inspect, entity_id: s.c}
    - {op: all}

- name: time_year_2300_float_resolution
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2300-01-01T00:00:00.000001+00:00", context: {id: c1}}
    - {op: get, entity_id: s.a}

- name: time_year_2001
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2001-09-09T01:46:40+00:00"}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2001-09-09T01:46:40.000001+00:00"}
    - {op: inspect, entity_id: s.a}

- name: time_report_sequence
  ops:
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:31:00+00:00"}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:31:01+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2026-11-20T16:31:02.5+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 2}, now: "2026-11-20T16:31:03+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: y, attributes: {a: 2}, now: "2026-11-20T16:31:04+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.a, state: y, attributes: {a: 2}, now: "2026-11-20T16:31:05+00:00"}
    - {op: get, entity_id: s.a}
    - {op: all}

- name: ctx_user_and_parent
  ops:
    - {op: set, entity_id: s.a, state: x, context: {id: c1, user_id: u1, parent_id: p1}}
    - {op: inspect, entity_id: s.a}
    - {op: set, entity_id: s.b, state: x, context: {id: c2, parent_id: p1}}
    - {op: inspect, entity_id: s.b}
    - {op: set, entity_id: s.c, state: x, context: {id: c3, user_id: ""}}
    - {op: inspect, entity_id: s.c}
    - {op: set, entity_id: s.d, state: x, context: {id: c4, user_id: null, parent_id: null}}
    - {op: inspect, entity_id: s.d}
    - {op: set, entity_id: s.e, state: x, context: {id: c5, parent_id: ""}}
    - {op: inspect, entity_id: s.e}

- name: ctx_report_keeps_state_context
  ops:
    - {op: set, entity_id: s.a, state: x, context: {id: c1, user_id: u1}}
    - {op: set, entity_id: s.a, state: x, context: {id: c2, user_id: u2}, now: "2026-11-20T16:31:00+00:00"}
    - {op: get, entity_id: s.a}
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:01+00:00"}
    - {op: get, entity_id: s.a}
    - {op: set, entity_id: s.a, state: y, now: "2026-11-20T16:31:02+00:00"}
    - {op: inspect, entity_id: s.a}

- name: ctx_same_id_reused
  ops:
    - {op: set, entity_id: s.a, state: x, context: {id: c1}}
    - {op: set, entity_id: s.b, state: x, context: {id: c1, user_id: u}}
    - {op: remove, entity_id: s.a, context: {id: c1, parent_id: p}}
    - {op: remove, entity_id: s.b, context: {id: c1}}
    - {op: remove, entity_id: s.b, context: {id: c1}}

- name: ctx_unusual_ids
  ops:
    - {op: set, entity_id: s.a, state: x, context: {id: " "}}
    - {op: set, entity_id: s.b, state: x, context: {id: "01KAGQ0000000000000000000Z"}}
    - {op: set, entity_id: s.c, state: x, context: {id: "é😀", user_id: "ü", parent_id: "\n"}}
    - {op: inspect, entity_id: s.a}
    - {op: inspect, entity_id: s.c}

- name: ctx_generated_numbering_interleaved
  ops:
    - {op: set, entity_id: s.a, state: x}
    - {op: set, entity_id: s.b, state: x, context: {id: mine}}
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:00+00:00"}
    - {op: set, entity_id: s.a, state: y, now: "2026-11-20T16:31:01+00:00"}
    - {op: remove, entity_id: s.b, now: "2026-11-20T16:31:02+00:00"}
    - {op: remove, entity_id: s.a, now: "2026-11-20T16:31:03+00:00"}
    - {op: set, entity_id: s.a, state: x, now: "2026-11-20T16:31:04+00:00"}
    - {op: inspect, entity_id: s.a}
    - {op: all}

# 2**33 s = 2242-03-16T12:56:32Z: from here on a float timestamp has a spacing of 1.9 µs
- name: time_just_before_2pow33_seconds
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2242-03-16T12:56:31.999999+00:00", context: {id: c1}}
    - {op: set, entity_id: s.a, state: x, attributes: {a: 1}, now: "2242-03-16T12:56:31.999998+00:00", context: {id: c1}}
    - {op: inspect, entity_id: s.a}
    - {op: get, entity_id: s.a}

- name: time_just_after_2pow33_seconds
  ops:
    - {op: set, entity_id: s.a, state: x, now: "2242-03-16T12:56:32.000001+00:00", context: {id: c1}}
    - {op: get, entity_id: s.a}

description: random scenario seed=101 index=20
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s3
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - event: mark
      event_data:
        id: s2.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - repeat:
        count: 2
        sequence:
        - delay: 1
        - event: mark
          event_data:
            id: s3.3
            v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - stop: bad
          error: true
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s1
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 2
  call: s3
  data:
    v: 3
- at: 4
  call: s3
  return_response: true
- at: 5
  call: s1
  data:
    v: 2
- at: 6
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 2
- at: 10
  result: 0
  response:
    n: 0
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 13
  call: s3
- at: 16
  call: s1
  data:
    v: 4
  return_response: true

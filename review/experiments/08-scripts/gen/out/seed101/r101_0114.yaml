description: random scenario seed=101 index=114
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - delay: 1
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 2
  reload:
    s0:
      alias: Script 0 B
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s0'') }}'
          cur: '{{ state_attr(''script.s0'', ''current'') }}'
      - delay: 1
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
      alias: Reloaded s1
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s2.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: script.turn_off
        target:
          entity_id: script.s1
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 5
  result: 1
  response:
    n: 1
- at: 5
- at: 6
  result: 0
  response:
    n: 0
- at: 7
  result: 2
  response:
    n: 2
- at: 8
  call: s1

description: random scenario seed=101 index=235
scripts:
  s0:
    alias: Script 0 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 3
  s2:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 4
  call: s0
  data:
    v: 4
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  result: 1
  response:
    n: 1
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 9
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 13
  call: s1
  data:
    v: 2
  return_response: true
- at: 14
  call: s2
  data:
    v: 2
- at: 15
  result: 2
  response:
    n: 2
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
    variables:
      v: 0
- at: 19
  call: s0
- at: 20
  result: 3
  response:
    n: 3

description: random scenario seed=101 index=82
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
steps:
- at: 1
  reload:
    s0:
      alias: Reloaded s0
      icon: mdi:script
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - action: script.toggle
        target:
          entity_id: script.s2
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s2.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s2.4
          v: '{{ v | default(0) }}'
- at: 3
  call: s2
  data:
    v: 4
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id: script.s0
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 6
  result: 0
  response:
    n: 0
- at: 7
  call: s0
  data:
    v: 3
  return_response: true
- at: 10
  call: s0
- at: 11
  call: s0
  data:
    v: 3
- at: 12
  call: s1
- at: 15
  result: 2
  response:
    n: 2
- at: 17
  call: s2
  data:
    v: 1
- at: 17
  result: 1
  response:
    n: 1
- at: 19
  result: 3
  response:
    n: 3
- at: 20
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2

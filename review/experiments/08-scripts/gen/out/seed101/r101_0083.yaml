description: random scenario seed=101 index=83
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 2
  call: s1
  data:
    v: 0
- at: 5
  call: s0
  data:
    v: 4
- at: 8
- at: 9
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 3
- at: 11
  call: s1
- at: 14
  call: turn_off
  data:
    entity_id: all
- at: 16
  call: s1
  data:
    v: 0
- at: 16
  call: s1
  return_response: true
- at: 16
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 17
  call: s1
  data:
    v: 1
- at: 17
  call: s0
  data:
    v: 4

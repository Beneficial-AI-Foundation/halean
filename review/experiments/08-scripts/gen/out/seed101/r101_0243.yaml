description: random scenario seed=101 index=243
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    alias: Script 1 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 3
  call: s2
  data:
    v: 2
- at: 4
  result: 1
  response:
    n: 1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
    variables:
      v: 4
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 8
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  result: 2
  response:
    n: 2
- at: 11
  call: s3
  data:
    v: 4
- at: 12
  call: s1
  data:
    v: 1
  return_response: true
- at: 13
  call: s2

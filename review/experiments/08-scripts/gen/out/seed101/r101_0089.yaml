description: random scenario seed=101 index=89
scripts:
  s0:
    alias: Script 0 A
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
    - delay: 1
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - parallel:
      - sequence:
        - delay: 1
        - event: mark
          event_data:
            id: s2.3
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
steps:
- at: 1
  call: s2
  data:
    v: 0
  return_response: true
- at: 2
  call: s1
  data:
    v: 0
  return_response: true
- at: 4
  call: s2
  data:
    v: 3
- at: 5
  call: s2
  data:
    v: 2
  return_response: true
- at: 8
  call: s0
  data:
    v: 4
- at: 9
  call: s1
- at: 10
  call: s1
- at: 11
  call: s0
- at: 12
  call: s2
  data:
    v: 3
- at: 14
  call: s1
- at: 16
  call: s1
  data:
    v: 4
- at: 17
  call: s2
  data:
    v: 2
- at: 18
  call: turn_off
  data:
    entity_id: all
- at: 18
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 4
- at: 19
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0

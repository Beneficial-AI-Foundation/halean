description: random scenario seed=101 index=218
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - parallel:
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
      - sequence:
        - action: test.m
          data:
            id: s1.4
            v: '{{ v | default(0) }}'
  s2:
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
    - delay: 1
  s4:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s4.7
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      else:
      - variables:
          out:
            id: s4.8
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.turn_off
          target:
            entity_id: script.s3
        - event: mark
          event_data:
            id: s4.9
        else:
        - action: test.m
          data:
            id: s4.10
            v: '{{ v | default(0) }}'
    - delay: 3
steps:
- at: 1
  call: s1
- at: 2
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: s1
  data:
    v: 4
- at: 6
  call: s2
  data:
    v: 2
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 7
  call: s3
  data:
    v: 2
- at: 8
  result: 1
  ok: false
  error_kind: ha_error
- at: 9
  result: 2
  response:
    n: 2
- at: 10
  result: 3
  response:
    n: 3
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 13
  result: 4
  response:
    n: 4
- at: 14
  result: 5
  response:
    n: 5
- at: 15
  call: s3
  data:
    v: 1

description: random scenario seed=101 index=90
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    alias: Script 1 A
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - delay: 3
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s2.6
          v: '{{ v | default(0) }}'
      else:
      - action: test.m
        data:
          id: s2.7
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s2.8
          v: '{{ v | default(0) }}'
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.9
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s4
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
  s4:
    alias: Script 4 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s4.10
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s4.11
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 2
  call: s3
- at: 4
  call: s3
  data:
    v: 0
  return_response: true
- at: 5
  call: s3
  data:
    v: 3
  return_response: true
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s4
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 1
- at: 7
  result: 0
  ok: false
  error_kind: other
- at: 8
  result: 1
  ok: false
  error_kind: invalid
- at: 10
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 11
  reload:
    s0:
      icon: mdi:script
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s0.2
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s4'') }}'
          cur: '{{ state_attr(''script.s4'', ''current'') }}'
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
    s1:
      alias: Script 1 A
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
          - script.s4
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - delay: 3
    s2:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s2.6
            v: '{{ v | default(0) }}'
        else:
        - action: test.m
          data:
            id: s2.7
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s2.8
            v: '{{ v | default(0) }}'
      alias: Reloaded s2
    s3:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s3.9
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s4'') }}'
          cur: '{{ state_attr(''script.s4'', ''current'') }}'
      - action: script.turn_off
        target:
          entity_id: script.s4
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
    s4:
      alias: Script 4 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - stop: bad
        error: true
      - action: test.m
        data:
          id: s4.10
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s4.11
          v: '{{ v | default(0) }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
- at: 13
  call: s0
  data:
    v: 2
  return_response: true
- at: 16
  call: s4
- at: 18
  call: s3
  data:
    v: 0
- at: 21
  call: s2
- at: 22
  result: 2
  response:
    n: 2
- at: 23
  call: s3
  data:
    v: 1
  return_response: true

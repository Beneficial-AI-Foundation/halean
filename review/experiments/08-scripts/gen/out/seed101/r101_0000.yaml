description: random scenario seed=101 index=0
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    alias: Script 1 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s3.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s2'') }}'
            cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 1
  call: s2
- at: 1
  call: s2
- at: 1
  call: s2
  return_response: true
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
    variables:
      v: 4
- at: 2
  call: s0
  data:
    v: 3
- at: 2
  result: 1
  response:
    n: 1
- at: 4
  result: 2
  response:
    n: 2
- at: 5
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  call: s3
  data:
    v: 4
- at: 6
  result: 3
  response:
    n: 3
- at: 9
  call: s0
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 12
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      alias: Reloaded s0
    s1:
      alias: Script 1 A
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s0
    s2:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s2.3
          v: '{{ v | default(0) }}'
        response_variable: r
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s1
      - repeat:
          count: 2
          sequence:
          - event: mark
            event_data:
              id: s3.4
              v: '{{ v | default(0) }}'
              st: '{{ states(''script.s2'') }}'
              cur: '{{ state_attr(''script.s2'', ''current'') }}'
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
- at: 14
  result: 5
  response:
    n: 5

description: random scenario seed=101 index=240
scripts:
  s0:
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
    - delay: 1
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    alias: Script 2 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 3
- at: 2
  call: turn_off
  data:
    entity_id: script.s0
- at: 2
  call: s1
  data:
    v: 4
  return_response: true
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  call: s1
  data:
    v: 2
  return_response: true
- at: 7
  call: s2
  data:
    v: 2
- at: 10
  reload:
    s0:
      icon: mdi:script
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - delay: 1
      - delay: 1
    s1:
      mode: queued
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
        response_variable: r
    s2:
      alias: Script 2 B
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s1
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 13
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 14
  result: 2
  response:
    n: 2

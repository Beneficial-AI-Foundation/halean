description: random scenario seed=101 index=151
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s0.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
  s1:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - delay: 2
steps:
- at: 1
  call: s0
- at: 2
  call: s2
- at: 3
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 8
  call: s0
  return_response: true
- at: 10
  call: turn_off
  data:
    entity_id: script.s3
- at: 10
- at: 11
  result: 1
  response:
    n: 1
- at: 13
  result: 0
  response:
    n: 0
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s2

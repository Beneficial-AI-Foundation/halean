description: random scenario seed=101 index=2
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.turn_off
      target:
        entity_id: script.s3
steps:
- at: 3
  call: s0
  data:
    v: 4
  return_response: true
- at: 3
  result: 0
  ok: false
  error_kind: invalid
- at: 3
  call: s3
- at: 5
  result: 1
  response:
    n: 1
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 9
  call: s0
  return_response: true
- at: 9
  call: turn_off
  data:
    entity_id: all
- at: 12
  result: 2
  response:
    n: 2
- at: 12
  reload:
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - variables:
          out:
            id: s1.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
    s2:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
    s3:
      alias: Script 3 B
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.turn_off
        target:
          entity_id: script.s0
      - action: script.turn_off
        target:
          entity_id: script.s2
      - action: script.turn_off
        target:
          entity_id: script.s3

description: random scenario seed=101 index=117
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s3.3
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s3.4
            v: '{{ v | default(0) }}'
          continue_on_error: true
steps:
- at: 1
  call: s2
  data:
    v: 2
- at: 2
  reload:
    s0:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
          - script.s3
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s2:
      mode: parallel
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
    s3:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - event: mark
            event_data:
              id: s3.3
              v: '{{ v | default(0) }}'
          - action: test.m
            data:
              id: s3.4
              v: '{{ v | default(0) }}'
            continue_on_error: true
      alias: Reloaded s3
- at: 3
  call: s1
  data:
    v: 0
- at: 6
  call: s0
  data:
    v: 1
  return_response: true
- at: 7
  result: 0
  response:
    n: 0
- at: 10
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 11
  call: turn_off
  data:
    entity_id: all
- at: 12
  result: 1
  ok: false
  error_kind: other
- at: 15
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 15
  call: s2
  data:
    v: 2
  return_response: true
- at: 18
  result: 2
  response:
    n: 2

description: random scenario seed=101 index=99
scripts:
  s0:
    alias: Script 0 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s1.3
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 2
  call: s1
  data:
    v: 3
- at: 3
  call: s2
  return_response: true
- at: 4
  call: s1
  data:
    v: 4
  return_response: true
- at: 5
  call: s0
  data:
    v: 2
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 9
  call: s2
  data:
    v: 2
- at: 12
  call: s0
  data:
    v: 4
- at: 13
- at: 14
  call: s0
- at: 16
  call: turn_off
  data:
    entity_id: script.s2
- at: 17
  call: s2
  data:
    v: 2
- at: 19
  call: s0
  return_response: true
- at: 22
  call: s1
  data:
    v: 4
- at: 23
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 24
  call: s1
  data:
    v: 4
  return_response: true

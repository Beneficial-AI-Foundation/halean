description: random scenario seed=101 index=13
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - delay: 3
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: test.m
          data:
            id: s0.1
            v: '{{ v | default(0) }}'
          continue_on_error: true
      - delay: 1
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 2
  call: s1
- at: 3
  call: s0
- at: 4
  call: s1
  return_response: true
- at: 6
  call: s0
  data:
    v: 0
- at: 6
  result: 1
  response:
    n: 1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 2
- at: 7
  result: 0
  ok: false
  error_kind: other
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 0
- at: 8
- at: 9
  result: 2
  ok: false
  error_kind: ha_error
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 10
  reload:
    s0:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - delay: 3
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: test.m
            data:
              id: s0.1
              v: '{{ v | default(0) }}'
            continue_on_error: true
        - delay: 1
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
      alias: Reloaded s0
    s1:
      alias: Script 1 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    s2:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s2
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s1

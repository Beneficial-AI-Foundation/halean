description: random scenario seed=101 index=132
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - delay: 2
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s4
    - delay: 1
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s4:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - parallel:
      - sequence:
        - delay: 1
        - delay: 1
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
        - event: mark
          event_data:
            id: s4.2
            v: '{{ v | default(0) }}'
steps:
- at: 2
  call: s0
  return_response: true
- at: 3
  call: s1
  data:
    v: 1
  return_response: true
- at: 4
  reload:
    s0:
      icon: mdi:script
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    s1:
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - delay: 2
    s2:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
      - action: script.turn_off
        target:
          entity_id: script.s1
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
          - script.s4
      - delay: 1
    s3:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s3.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
    s4:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
      - parallel:
        - sequence:
          - delay: 1
          - delay: 1
        - sequence:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
          - event: mark
            event_data:
              id: s4.2
              v: '{{ v | default(0) }}'
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 9
  call: s2
- at: 10
  call: s2
  data:
    v: 3
- at: 11
  call: s1
- at: 12
  call: s0
  data:
    v: 2
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 15
  call: s1
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s4

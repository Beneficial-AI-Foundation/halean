description: random scenario seed=101 index=75
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - delay: 2
      - sequence:
        - event: mark
          event_data:
            id: s0.1
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
        - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s1.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      else:
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.7
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s2
- at: 1
  call: turn_off
  data:
    entity_id: script.s1
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 4
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
    variables:
      v: 4
- at: 3
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 5
  call: s1
  data:
    v: 3
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 7
  call: s0
- at: 10
  call: turn_off
  data:
    entity_id: script.s2
- at: 11
  result: 0
  response:
    n: 0
- at: 14
  call: s2
  data:
    v: 0
- at: 14
  result: 1
  response:
    n: 1
- at: 15
  call: s2
  data:
    v: 3
- at: 18
  call: turn_off
  data:
    entity_id: script.s2

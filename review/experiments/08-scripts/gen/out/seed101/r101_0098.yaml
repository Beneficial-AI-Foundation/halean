description: random scenario seed=101 index=98
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - stop: bad
      error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      else:
      - delay: 1
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - delay: 1
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 1
  call: s2
  data:
    v: 0
  return_response: true
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
    variables:
      v: 4
- at: 2
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 6
  result: 0
  response:
    n: 0
- at: 7
  call: s2
- at: 7
  call: turn_off
  data:
    entity_id: all
- at: 7
  call: s2
  data:
    v: 4
  return_response: true
- at: 8
- at: 9
  call: s1
  data:
    v: 2
- at: 10
  result: 2
  response:
    n: 2
- at: 11
- at: 12
  result: 1
  response:
    n: 1
- at: 13
  call: s2
  data:
    v: 0
- at: 13
  call: s3
  data:
    v: 3
  return_response: true

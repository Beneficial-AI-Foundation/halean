description: random scenario seed=101 index=237
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - variables:
        out:
          id: s2.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - parallel:
      - sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
        - delay: 1
      - sequence:
        - variables:
            out:
              id: s2.4
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
- at: 3
  call: s0
- at: 4
  call: s3
  data:
    v: 0
- at: 5
  call: s1
  data:
    v: 1
  return_response: true
- at: 8
  call: s0
- at: 9
  call: s3
  data:
    v: 0
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2

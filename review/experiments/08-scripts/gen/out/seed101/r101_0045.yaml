description: random scenario seed=101 index=45
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s2.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s4
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s4:
    alias: Script 4 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 1
    - variables:
        out:
          id: s4.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 3
  call: s0
  return_response: true
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s4
- at: 4
  call: s0
  data:
    v: 1
  return_response: true
- at: 7
  call: s1
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 11
  call: s1
  data:
    v: 1
- at: 11
  call: s0
- at: 14
  call: s0
  data:
    v: 1
- at: 16
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 18
- at: 18
  call: s2
  data:
    v: 3

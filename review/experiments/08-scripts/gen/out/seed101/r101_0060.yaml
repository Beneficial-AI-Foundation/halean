description: random scenario seed=101 index=60
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s1:
    alias: Script 1 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s1
    - delay: 3
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 1
  call: s0
  data:
    v: 4
  return_response: true
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 7
  call: turn_off
  data:
    entity_id: script.s1
- at: 9
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
    s1:
      alias: Script 1 A
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
      - delay: 1
      - action: script.turn_off
        target:
          entity_id: script.s1
      - delay: 3
- at: 9
  call: s1
  data:
    v: 0
- at: 10
  call: s1
  data:
    v: 4
- at: 10
  call: s1
- at: 11
- at: 12
  call: s1
  data:
    v: 4
  return_response: true
- at: 13
  call: s0
  return_response: true
- at: 14
  call: s0
  data:
    v: 1
- at: 14
  call: s1
  return_response: true
- at: 14
  call: s0
  data:
    v: 3
  return_response: true
- at: 15
  call: s0
  data:
    v: 4

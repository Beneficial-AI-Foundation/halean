description: random scenario seed=101 index=70
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.toggle
      target:
        entity_id: script.s3
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
steps:
- at: 3
  call: s3
  return_response: true
- at: 4
  call: s0
  return_response: true
- at: 5
  call: s3
  return_response: true
- at: 6
  call: s2
  data:
    v: 3
- at: 7
  call: s0
- at: 7
  call: s2
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 7
  call: turn_off
  data:
    entity_id: all
- at: 8
  call: s3
  data:
    v: 4
- at: 9

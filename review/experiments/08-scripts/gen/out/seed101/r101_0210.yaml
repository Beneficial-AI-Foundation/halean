description: random scenario seed=101 index=210
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: script.turn_off
      target:
        entity_id: script.s2
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s3:
    alias: Script 3 B
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s3.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s2'') }}'
            cur: '{{ state_attr(''script.s2'', ''current'') }}'
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s3
steps:
- at: 1
  call: s3
  return_response: true
- at: 2
  result: 0
  response:
    n: 0
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 3
  result: 1
  response:
    n: 1
- at: 4
  call: s3
- at: 5
  result: 2
  response:
    n: 2
- at: 5
  call: s2
- at: 7
  call: turn_off
  data:
    entity_id: all
- at: 8
  call: s2
- at: 9
  call: s0
  data:
    v: 1
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 11
  call: s0
- at: 13
  result: 3
  response:
    n: 3
- at: 13
  call: turn_off
  data:
    entity_id: script.s0

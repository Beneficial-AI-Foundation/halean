description: random scenario seed=101 index=246
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 1
  call: s1
  data:
    v: 3
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 2
  call: s1
- at: 3
  reload:
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - stop: bad
        error: true
      - action: script.turn_off
        target:
          entity_id: script.s2
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
    s2:
      icon: mdi:script
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
        response_variable: r
- at: 4
  call: s2
  data:
    v: 0
- at: 6
  call: s1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 0
- at: 7
  call: s2
  data:
    v: 3
- at: 8
  result: 0
  response:
    n: 0
- at: 9
- at: 9
  result: 1
  response:
    n: 1

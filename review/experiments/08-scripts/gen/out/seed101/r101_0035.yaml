description: random scenario seed=101 index=35
scripts:
  s0:
    alias: Script 0 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s0.1
            v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - variables:
        out:
          id: s3.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s3
  data:
    v: 0
  return_response: true
- at: 3
  call: s3
  return_response: true
- at: 6
  call: s3
  data:
    v: 1
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 11
  result: 1
  response:
    n: 1
- at: 12
  reload:
    s0:
      alias: Script 0 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s0.1
              v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    s2:
      mode: parallel
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s2.2
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: test.m
        data:
          id: s2.3
          v: '{{ v | default(0) }}'
    s3:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s3.7
          v: '{{ v | default(0) }}'
      - delay: 3
- at: 14
  result: 2
  ok: false
  error_kind: other
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 1

description: random scenario seed=101 index=201
scripts:
  s0:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
  s1:
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 1
  call: s2
  data:
    v: 4
- at: 2
  call: s3
  return_response: true
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  result: 1
  response:
    n: 1
- at: 6
  result: 2
  response:
    n: 2
- at: 6
  call: s0
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 8
- at: 10
  call: s1
  data:
    v: 4

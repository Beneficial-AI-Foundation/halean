description: random scenario seed=101 index=251
scripts:
  s0:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s1
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    alias: Script 3 B
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s2
steps:
- at: 2
  call: s3
  data:
    v: 3
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 5
  call: s0
  data:
    v: 0
- at: 7
  call: s1
- at: 10
  call: s3
  data:
    v: 3
  return_response: true
- at: 11
  call: s1
  data:
    v: 3
- at: 12
  reload:
    s0:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.toggle
        target:
          entity_id: script.s1
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
      alias: Reloaded s0
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s0
      - variables:
          out:
            id: s1.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
    s2:
      icon: mdi:script
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    s3:
      alias: Script 3 B
      icon: mdi:script
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - action: script.turn_off
            target:
              entity_id: script.s2
- at: 13
  call: s1
  data:
    v: 4
- at: 16
  call: s0
  data:
    v: 0
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s0

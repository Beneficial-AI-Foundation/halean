description: random scenario seed=101 index=67
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s2
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 3
    - delay: 2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 3
  call: s2
- at: 6
  call: s2
  return_response: true
- at: 7
  call: s0
  return_response: true
- at: 7
  result: 0
  response:
    n: 0
- at: 8
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 9
  call: s2
  data:
    v: 3
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 11
  call: s2

description: random scenario seed=101 index=64
scripts:
  s0:
    alias: Script 0 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: test.m
          data:
            id: s2.4
            v: '{{ v | default(0) }}'
          response_variable: r
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
        else:
        - action: test.m
          data:
            id: s2.6
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s2.7
      - action: test.m
        data:
          id: s2.8
          v: '{{ v | default(0) }}'
      else:
      - delay: 1
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.10
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 3
  call: s1
  data:
    v: 0
- at: 4
  call: s2
- at: 7
  result: 0
  response:
    n: 0
- at: 9
  call: s1
  data:
    v: 2
- at: 11
  result: 1
  response:
    n: 1
- at: 11
  call: s0
  data:
    v: 2
- at: 12
  call: s3
  return_response: true
- at: 15
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 16
  call: s2
  return_response: true
- at: 17
  call: s1
  return_response: true

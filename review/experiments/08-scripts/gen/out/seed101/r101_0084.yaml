description: random scenario seed=101 index=84
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
      else:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - action: script.turn_off
        target:
          entity_id: script.s1
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    alias: Script 3 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s1
  return_response: true
- at: 4
  call: s2
  data:
    v: 3
  return_response: true
- at: 5
  call: s0
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 9
  call: turn_off
  data:
    entity_id: script.s2
- at: 9
  call: s2
- at: 10
  call: s3
- at: 11
  call: s2
  data:
    v: 3
  return_response: true

description: random scenario seed=101 index=194
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 3
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - repeat:
        count: 2
        sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
  s1:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s2.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 2
  call: s1
- at: 5
- at: 8
  call: s2
  data:
    v: 1
- at: 9
  call: s0
  return_response: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 11
  call: s1
  data:
    v: 3
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 3
- at: 11
  call: s1
  return_response: true
- at: 12
  reload:
    s1:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
    s2:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - variables:
          out:
            id: s2.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_off
        target:
          entity_id: script.s0
      - action: script.turn_off
        target:
          entity_id: script.s0
- at: 13
  call: s1
  data:
    v: 2
- at: 15
  call: s1
- at: 15
  call: s2
  data:
    v: 1
- at: 17
  call: s2
  data:
    v: 3
- at: 18
  call: s1
  return_response: true

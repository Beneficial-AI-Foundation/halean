description: random scenario seed=101 index=226
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s4
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s4
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  call: s0
  data:
    v: 1
  return_response: true
- at: 4
  call: s4
- at: 4
  call: s4
- at: 7
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 9
- at: 12
  call: s3
  return_response: true
- at: 12
  call: s2
  data:
    v: 3
  return_response: true
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s4

description: random scenario seed=101 index=43
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s1:
    alias: Script 1 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s3
- at: 4
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 5
  call: s2
- at: 6
  result: 0
  response:
    n: 0
- at: 6
  call: s1
- at: 7
  call: s2

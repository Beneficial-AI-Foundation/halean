description: random scenario seed=101 index=242
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s1
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s1
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - delay: 1
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
steps:
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 3
  call: s1
- at: 6
  result: 1
  response:
    n: 1
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 7
  reload:
    s0:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
    s1:
      alias: Script 1 A
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
      - delay: 1
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
    s3:
      alias: Script 3 B
      mode: single
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - event: mark
        event_data:
          id: s3.4
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
- at: 10
  result: 0
  response:
    n: 0
- at: 11
  call: s0
  data:
    v: 2
- at: 12
  result: 2
  response:
    n: 2
- at: 13
  call: s1
  data:
    v: 3
- at: 14
  result: 3
  ok: false
  error_kind: other

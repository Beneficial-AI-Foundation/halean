description: random scenario seed=101 index=109
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.toggle
        target:
          entity_id: script.s1
      - action: script.turn_off
        target:
          entity_id: script.s2
      else:
      - parallel:
        - sequence:
          - event: mark
            event_data:
              id: s0.1
              v: '{{ v | default(0) }}'
              st: '{{ states(''script.s1'') }}'
              cur: '{{ state_attr(''script.s1'', ''current'') }}'
          - event: mark
            event_data:
              id: s0.2
              v: '{{ v | default(0) }}'
        - sequence:
          - action: test.m
            data:
              id: s0.3
              v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - event: mark
      event_data:
        id: s2.7
        v: '{{ v | default(0) }}'
steps:
- at: 2
  call: s0
  data:
    v: 3
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 3
  call: turn_off
  data:
    entity_id: script.s2
- at: 3
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 5
  call: turn_off
  data:
    entity_id: script.s2
- at: 5
  call: s1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 0
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 10
  call: s2
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 13
  call: turn_off
  data:
    entity_id: all
- at: 13
  call: turn_off
  data:
    entity_id: script.s0
- at: 14
  result: 2
  response:
    n: 2
- at: 15
  call: s0
  data:
    v: 2
  return_response: true

description: random scenario seed=101 index=54
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s2:
    alias: Script 2 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s3:
    alias: Script 3 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - parallel:
      - sequence:
        - delay: 1
      - sequence:
        - action: test.m
          data:
            id: s3.5
            v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - variables:
        out:
          id: s3.7
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out

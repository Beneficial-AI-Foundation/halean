description: random scenario seed=101 index=10
scripts:
  s0:
    alias: Script 0 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - stop: bad
      error: true
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s3
- at: 1
  call: s2
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id: script.s2
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  result: 0
  response:
    n: 0
- at: 7
  call: s3
  data:
    v: 0
- at: 8
  call: s1
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 13
  call: s3
  return_response: true
- at: 14
  call: s0
  data:
    v: 1
- at: 15
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 16
  result: 2
  response:
    n: 2
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 3
- at: 19
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 2

  data:
    v: 3
- at: 2
  call: s4
  data:
    v: 4
  return_response: true
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s3
    variables:
      v: 4
- at: 3
  call: s3
- at: 4
  call: s0
  data:
    v: 2
- at: 5

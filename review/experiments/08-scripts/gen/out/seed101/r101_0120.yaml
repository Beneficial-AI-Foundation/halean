description: random scenario seed=101 index=120
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - delay: 3
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
- at: 2
- at: 5
  call: s2
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 5
  call: turn_off
  data:
    entity_id: all
- at: 6
  call: s0
  data:
    v: 4
  return_response: true
- at: 7
  call: s1
  data:
    v: 1
- at: 9
  call: s1
  return_response: true
- at: 9
  call: s0
  data:
    v: 1
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
    variables:
      v: 1
- at: 12
  call: s1
  data:
    v: 2
  return_response: true
- at: 13
  call: turn_off
  data:
    entity_id: script.s2
- at: 16
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 18
- at: 20
  call: s0
  data:
    v: 2
  return_response: true

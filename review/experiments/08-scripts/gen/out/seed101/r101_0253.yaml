description: random scenario seed=101 index=253
scripts:
  s0:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
  s1:
    alias: Script 1 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s2
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        - parallel:
          - sequence:
            - action: test.m
              data:
                id: s1.1
                v: '{{ v | default(0) }}'
          - sequence:
            - action: script.s0
              data:
                v: '{{ v | default(0) + 1 }}'
      - sequence:
        - event: mark
          event_data:
            id: s1.2
            v: '{{ v | default(0) }}'
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
steps:
- at: 2

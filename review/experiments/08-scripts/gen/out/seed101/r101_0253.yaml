          entity_id: script.s2
    s1:
      alias: Reloaded s1
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - action: script.turn_on
            target:
              entity_id:
              - script.s2

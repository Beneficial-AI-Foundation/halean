description: random scenario seed=101 index=167
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    alias: Script 1 A
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 1
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s3
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 3
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      else:
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - stop: bad
      error: true
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - parallel:
      - sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
      - sequence:
        - variables:
            out:
              id: s3.6
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
steps:
- at: 1
  call: s2
  data:
    v: 4
- at: 3
  call: s2
  data:
    v: 1
- at: 4
  call: s2
- at: 7
  call: s3
  data:
    v: 3
  return_response: true
- at: 8
  call: s2
  data:
    v: 4
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 12
  call: s0
  data:
    v: 2
  return_response: true
- at: 14
  call: s0
  data:
    v: 2
  return_response: true
- at: 14
  call: s1
- at: 14
- at: 15
  result: 0
  response:
    n: 0
- at: 16
  call: s1
- at: 19
- at: 19
  result: 2
  response:
    n: 2
- at: 22
  result: 1
  response:
    n: 1
- at: 23
  call: s2
  return_response: true

description: random scenario seed=101 index=130
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s3
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s3
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s3:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.1
        v: '{{ v | default(0) }}'
    - delay: 1
    - action: test.m
      data:
        id: s3.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
steps:
- at: 1
  reload:
    s0:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: script.turn_off
        target:
          entity_id: script.s3
      - delay: 3
      - action: script.turn_off
        target:
          entity_id: script.s2
    s1:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: test.m
          data:
            id: s1.4
            v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.5
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    s2:
      icon: mdi:script
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
    s3:
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s3.1
          v: '{{ v | default(0) }}'
      - delay: 1
      - action: test.m
        data:
          id: s3.2
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - event: mark
        event_data:
          id: s3.3
          v: '{{ v | default(0) }}'
- at: 2
  call: s1
  data:
    v: 0
  return_response: true
- at: 5
  call: s3
- at: 6
  result: 0
  response:
    n: 0
- at: 8
  call: s2
  return_response: true
- at: 10
  call: s0
  return_response: true
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
    variables:
      v: 3

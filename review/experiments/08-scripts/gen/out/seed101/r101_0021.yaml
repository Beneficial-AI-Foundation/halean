description: random scenario seed=101 index=21
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - delay: 2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s4:
    alias: Script 4 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 1
  call: s3
  data:
    v: 2
  return_response: true
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
    variables:
      v: 4
- at: 5
  call: s0
  data:
    v: 0
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 8
  result: 0
  response:
    n: 0
- at: 9
  call: s1
  data:
    v: 1
- at: 10
  call: s1
- at: 10
  call: s4
  data:
    v: 1
- at: 11
  call: s4
  data:
    v: 2
- at: 13
  reload:
    s0:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - delay: 2
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s1:
      icon: mdi:script
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
        response_variable: r
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      - action: test.m
        data:
          id: s2.7
          v: '{{ v | default(0) }}'
      - delay: 1
    s3:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
    s4:
      alias: Script 4 A
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s4.5
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s4.6
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
- at: 15
  result: 1
  response:
    n: 1
- at: 18

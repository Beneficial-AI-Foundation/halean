description: random scenario seed=101 index=217
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 2
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 2
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 3
  s3:
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s2
      else:
      - action: test.m
        data:
          id: s3.3
          v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s2
  return_response: true
- at: 2
  call: s1
- at: 3
  call: s1
  data:
    v: 2
- at: 3
  call: s0
- at: 4
  result: 0
  response:
    n: 0
- at: 4
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 7
  call: turn_off
  data:
    entity_id: script.s3
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s3

description: random scenario seed=101 index=105
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s1:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 4
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  call: s1
  data:
    v: 3
- at: 8
  call: s2
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 11
  result: 2
  response:
    n: 2
- at: 14
  call: turn_off
  data:
    entity_id: script.s1
- at: 16
  call: s1
  data:
    v: 1
  return_response: true
- at: 18
  result: 3
  response:
    n: 3

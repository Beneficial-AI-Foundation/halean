    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - repeat:
        count: 2
        sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'

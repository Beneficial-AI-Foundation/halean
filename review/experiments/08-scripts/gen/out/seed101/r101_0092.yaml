description: random scenario seed=101 index=92
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 A
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - delay: 1
    - delay: 3
  s4:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
  call: s1
  data:
    v: 0
  return_response: true
- at: 2
  call: s3
  data:
    v: 2
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 3
  call: s2
  data:
    v: 1
- at: 6
  call: s1
  data:
    v: 2
  return_response: true
- at: 7
  result: 0
  ok: false
  error_kind: ha_error
- at: 8
  call: s3
  data:
    v: 3
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 2
- at: 9
  call: s4
- at: 11
  result: 1
  response:
    n: 1
- at: 14
  call: s3
  data:
    v: 1
  return_response: true

description: random scenario seed=101 index=200
scripts:
  s0:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s0.1
            v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 1
  call: s2
  data:
    v: 2
- at: 2
  call: turn_off
  data:
    entity_id: all
- at: 3
  call: s0
  data:
    v: 3
  return_response: true
- at: 5
- at: 5
  call: s1
  return_response: true
- at: 5
  result: 0
  ok: false
  error_kind: other
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 7
  result: 1
  response:
    n: 1
- at: 7
  call: s2
  data:
    v: 3
  return_response: true
- at: 7
  call: s0
  data:
    v: 3
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 8
  result: 2
  response:
    n: 2
- at: 9
  call: s2
  data:
    v: 0
  return_response: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 4
- at: 10
  call: s0
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
    variables:
      v: 4

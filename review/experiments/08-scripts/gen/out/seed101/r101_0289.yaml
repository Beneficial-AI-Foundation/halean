description: random scenario seed=101 index=289
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - delay: 2
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 2
  call: s3
  data:
    v: 4
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 5
  call: s0
  data:
    v: 0
- at: 6
  call: s1
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 7
  call: s0
  data:
    v: 1
- at: 8
  call: turn_off
  data:
    entity_id: script.s0
- at: 9
  result: 0
  response:
    n: 0

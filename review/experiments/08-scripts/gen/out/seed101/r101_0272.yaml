description: random scenario seed=101 index=272
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    alias: Script 2 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: test.m
            data:
              id: s2.4
              v: '{{ v | default(0) }}'
          - action: script.s2
            data:
              v: '{{ v | default(0) + 1 }}'
            continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s3:
    alias: Script 3 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
steps:
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 3
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 5
  result: 0
  ok: false
  error_kind: ha_error
- at: 5
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
    s1:
      mode: single
      fields:
        v: {}

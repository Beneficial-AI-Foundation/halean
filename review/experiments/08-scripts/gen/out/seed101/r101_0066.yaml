description: random scenario seed=101 index=66
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s0.3
            v: '{{ v | default(0) }}'
          response_variable: r
      - sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
        - event: mark
          event_data:
            id: s1.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
      - sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s3
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 1
  call: s3
  data:
    v: 3
  return_response: true
- at: 4
  call: s1
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 5
  result: 0
  ok: false
  error_kind: ha_error
- at: 8
  call: s1
  data:
    v: 0
- at: 9
  call: s3
  data:
    v: 0
- at: 10
  call: s1
  data:
    v: 4
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 11
  call: s2
- at: 12
  result: 1
  response:
    n: 1
- at: 14
  result: 2
  response:
    n: 2

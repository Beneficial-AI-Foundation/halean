description: random scenario seed=101 index=158
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - variables:
        out:
          id: s2.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s3.4
            v: '{{ v | default(0) }}'
        - delay: 2
      - sequence:
        - action: test.m
          data:
            id: s3.5
            v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s3.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.9
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s4.10
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 3
  call: s2
  return_response: true
- at: 4
  call: s4
  data:
    v: 2
  return_response: true
- at: 4
  result: 0
  response:
    n: 0
- at: 7
  call: turn_off
  data:
    entity_id: script.s3
- at: 9
  result: 1
  ok: false
  error_kind: invalid
- at: 10
- at: 11
  call: s4
  data:
    v: 2
  return_response: true
- at: 13
  call: s4
  data:
    v: 3
  return_response: true
- at: 13
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 14
  result: 2
  response:
    n: 2
- at: 15
  call: s3
  data:
    v: 2
  return_response: true

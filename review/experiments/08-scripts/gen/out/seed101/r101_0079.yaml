description: random scenario seed=101 index=79
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 3
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - parallel:
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s3
      - sequence:
        - action: test.m
          data:
            id: s2.4
            v: '{{ v | default(0) }}'
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - variables:
        out:
          id: s2.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s3.8
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s3
steps:
- at: 1
  call: s3
  data:
    v: 1
- at: 2
  call: s3
  data:
    v: 3
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s3
    variables:
      v: 4
- at: 2
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 3
  result: 1
  response:
    n: 1
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: s2
  data:
    v: 3
- at: 5
  result: 2
  ok: false
  error_kind: invalid
- at: 8
  call: s3
  data:
    v: 1
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 13
  result: 4
  ok: false
  error_kind: ha_error

  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 1
- at: 2
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 6
  call: turn_off
  data:
    entity_id: script.s1
- at: 6

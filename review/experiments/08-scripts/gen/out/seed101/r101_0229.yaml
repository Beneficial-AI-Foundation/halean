- at: 10
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 12
  result: 1
  ok: false
  error_kind: ha_error
- at: 13
  call: s0
  data:
    v: 2
- at: 14
  call: s1

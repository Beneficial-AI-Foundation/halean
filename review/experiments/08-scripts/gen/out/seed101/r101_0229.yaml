description: random scenario seed=101 index=229
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - repeat:
        count: 2
        sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
  s2:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 2
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:

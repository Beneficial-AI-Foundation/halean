description: random scenario seed=101 index=50
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.toggle
      target:
        entity_id: script.s3
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
  s3:
    alias: Script 3 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 2
  call: s1
  data:
    v: 2
- at: 4
  call: s3
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - variables:
          out:
            id: s0.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.toggle
        target:
          entity_id: script.s3
    s1:
      alias: Script 1 B
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s1
    s3:
      alias: Reloaded s3
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
- at: 8
  call: turn_off
  data:
    entity_id: script.s2
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 12
- at: 13
  result: 1
  response:
    n: 1
- at: 16
  call: s3
  data:
    v: 4
- at: 17
  call: s3
  return_response: true
- at: 18
  result: 3
  response:
    n: 3

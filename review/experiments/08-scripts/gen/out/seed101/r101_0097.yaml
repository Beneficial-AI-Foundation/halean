      data:
        id: s4.5
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s4.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'

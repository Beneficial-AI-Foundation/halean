description: random scenario seed=101 index=36
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
      - delay: 2
      else:
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 1
- at: 2
- at: 3
  call: s2
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: s2
  data:
    v: 1
  return_response: true
- at: 6
  call: s2
  return_response: true
- at: 7
  call: s0
  return_response: true
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 0
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 11
  result: 1
  response:
    n: 1

description: random scenario seed=101 index=125
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - delay: 3
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s1.4
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s1.5
            v: '{{ v | default(0) }}'
          response_variable: r
      - sequence:
        - action: test.m
          data:
            id: s1.6
            v: '{{ v | default(0) }}'
          continue_on_error: true
        - delay: 3
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s2.8
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
      - sequence:
        - variables:
            out:
              id: s2.9
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        - action: script.turn_off
          target:
            entity_id: script.s0
    - event: mark
      event_data:
        id: s2.10
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s0
  data:
    v: 2
- at: 5
  call: s2
  data:
    v: 4
- at: 6
  call: s0
- at: 8
  call: s0
  data:
    v: 3
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 9
  call: s0
- at: 11
  call: s0
- at: 12
  call: s0
  data:
    v: 4
- at: 12
  call: s1
  return_response: true

description: random scenario seed=101 index=100
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - delay: 1
steps:
- at: 1
  call: s0
  data:
    v: 4
- at: 4
  call: s3
  return_response: true
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 2
- at: 7
  result: 1
  response:
    n: 1
- at: 10
  result: 0
  response:
    n: 0
- at: 12
  result: 2
  response:
    n: 2
- at: 14
  result: 3
  response:
    n: 3
- at: 15
  result: 4
  response:
    n: 4
- at: 17
  result: 5
  response:
    n: 5
- at: 20
  reload:
    s0:
      icon: mdi:script
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.toggle
        target:
          entity_id: script.s3
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s3'') }}'
          cur: '{{ state_attr(''script.s3'', ''current'') }}'
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s3.6
          v: '{{ v | default(0) }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      - delay: 1
- at: 21

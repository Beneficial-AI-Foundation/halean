description: random scenario seed=101 index=193
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s3.5
            v: '{{ v | default(0) }}'
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.s0
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
            continue_on_error: true
          - action: test.m
            data:
              id: s3.6
              v: '{{ v | default(0) }}'
            continue_on_error: true
          else:
          - action: test.m
            data:
              id: s3.7
              v: '{{ v | default(0) }}'
      - sequence:
        - delay: 2
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s2

description: random scenario seed=101 index=197
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - delay: 2
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s2.6
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s3.10
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - action: test.m
        data:
          id: s3.11
          v: '{{ v | default(0) }}'
  s4:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - delay: 2
steps:
- at: 1
  call: s4
  data:
    v: 3
- at: 2
  call: s3
  data:
    v: 2
- at: 4
  call: s1
  data:
    v: 2
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 7
  result: 1
  response:
    n: 1
- at: 8
  reload:
    s0:
      alias: Script 0 A
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
        response_variable: r
      alias: Reloaded s1
    s2:
      alias: Script 2 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
      - delay: 2
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - event: mark
          event_data:
            id: s2.6
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s3.7
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s3.8
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s3.9
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: test.m
          data:
            id: s3.10
            v: '{{ v | default(0) }}'
          continue_on_error: true
        - action: test.m
          data:
            id: s3.11
            v: '{{ v | default(0) }}'
    s4:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      - delay: 2
- at: 10
  call: s3
  data:
    v: 0
- at: 11
- at: 12
  call: s1
- at: 13
  call: s3
  return_response: true
- at: 13
  result: 0
  response:
    n: 0
- at: 14
  call: turn_off
  data:
    entity_id: all

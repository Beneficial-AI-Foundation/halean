description: random scenario seed=101 index=78
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - delay: 2
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s2.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      else:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: script.turn_off
        target:
          entity_id: script.s0
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s2.6
            v: '{{ v | default(0) }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 2
  call: s2
  return_response: true
- at: 3
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 6
  call: s0
  return_response: true
- at: 8
  call: s1
- at: 10
  call: s0
  data:
    v: 4
- at: 10
  call: s2
  data:
    v: 1
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 12
  call: s0
  data:
    v: 3
- at: 13
  call: s0
  data:
    v: 2
  return_response: true
- at: 15
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
      alias: Reloaded s0
    s1:
      icon: mdi:script
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - event: mark
        event_data:
          id: s1.4
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - delay: 2
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s1
      - delay: 1
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - variables:
            out:
              id: s2.5
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        else:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
        - action: script.turn_off
          target:
            entity_id: script.s0
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s2.6
              v: '{{ v | default(0) }}'
- at: 16
  call: s2
  data:
    v: 0
  return_response: true
- at: 19
  call: s2
- at: 21
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2

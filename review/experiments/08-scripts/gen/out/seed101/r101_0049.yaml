description: random scenario seed=101 index=49
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - stop: bad
      error: true
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - stop: bad
          error: true
        - action: test.m
          data:
            id: s1.2
            v: '{{ v | default(0) }}'
          response_variable: r
      - sequence:
        - delay: 2
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.toggle
      target:
        entity_id: script.s4
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
  s4:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  call: s1
  data:
    v: 4
- at: 2
  call: s0
  return_response: true
- at: 3
  call: turn_off
  data:
    entity_id: script.s4
- at: 4
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - variables:
          out:
            id: s0.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - stop: bad
        error: true
    s1:
      alias: Script 1 B
      icon: mdi:script
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - stop: bad
            error: true
          - action: test.m
            data:
              id: s1.2
              v: '{{ v | default(0) }}'
            response_variable: r
        - sequence:
          - delay: 2
      - variables:
          out:
            id: s1.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.5
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.toggle
        target:
          entity_id: script.s4
      - action: test.m
        data:
          id: s2.6
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s2.7
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s3.8
    s4:
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
- at: 5
  call: s0
  data:
    v: 2
  return_response: true
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s3
    variables:
      v: 4
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 4
- at: 9
  call: s3

description: random scenario seed=101 index=199
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - delay: 1
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - delay: 3
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 3
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 5
  call: turn_off
  data:
    entity_id: script.s2
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 8
  call: s0
  data:
    v: 4
- at: 9
  result: 0
  response:
    n: 0
- at: 11
  call: turn_off
  data:
    entity_id: script.s2
- at: 13
  result: 1
  response:
    n: 1
- at: 14
  call: s0
- at: 17
  call: s0
  data:
    v: 3
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 19

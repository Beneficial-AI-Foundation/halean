description: random scenario seed=101 index=292
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s0
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
      else:
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.6
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.7
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - repeat:
        count: 2
        sequence:
        - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    alias: Script 3 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r

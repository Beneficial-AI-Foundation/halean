description: random scenario seed=101 index=142
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - delay: 3
  s1:
    alias: Script 1 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - delay: 2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
  s3:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s4:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 1
    - delay: 3
steps:
- at: 1
  call: turn_off
  data:
    entity_id: script.s2
- at: 3
  call: s4
  data:
    v: 1
- at: 4
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 7
  call: s1
  data:
    v: 0
- at: 8
  result: 1
  response:
    n: 1
- at: 9
  call: s2
  return_response: true
- at: 10
  call: turn_off
  data:
    entity_id: all
- at: 12
  call: turn_off
  data:
    entity_id: all
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 3
- at: 13
  result: 0
  response:
    n: 0
- at: 16
  call: s2
  data:
    v: 4
- at: 17
  result: 3
  ok: false
  error_kind: ha_error
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s4

description: random scenario seed=101 index=5
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
  s1:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - delay: 2
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.7
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s2.8
        v: '{{ v | default(0) }}'
  s3:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
    - delay: 1
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - stop: bad
        error: true
      - action: script.toggle
        target:
          entity_id: script.s4
      else:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
steps:
- at: 2
  call: s0
  data:
    v: 2
- at: 3
  result: 1
  response:
    n: 1
- at: 4
  call: s0
- at: 5
  call: s0
  data:
    v: 1
  return_response: true
- at: 5
  call: s3
- at: 6
  call: s1
  return_response: true
- at: 8
  call: s1
  data:
    v: 3
  return_response: true
- at: 9
  reload:
    s0:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - parallel:
        - sequence:
          - delay: 3
          - action: test.m
            data:
              id: s0.10
              v: '{{ v | default(0) }}'
        - sequence:
          - stop: bad
            error: true
          - action: script.turn_on
            target:
              entity_id:
              - script.s4
              - script.s3
            data:
              variables:
                v: '{{ v | default(0) + 10 }}'
    s1:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
      - delay: 2
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: test.m
        data:
          id: s1.5
          v: '{{ v | default(0) }}'
        response_variable: r
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s2.6
          v: '{{ v | default(0) }}'
      - variables:
          out:
            id: s2.7
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s2.8
          v: '{{ v | default(0) }}'
    s3:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s3.9
          v: '{{ v | default(0) }}'
      - delay: 1
      - delay: 1
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - stop: bad
          error: true
        - action: script.toggle
          target:
            entity_id: script.s4
        else:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
    s4:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s3
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s4
- at: 12

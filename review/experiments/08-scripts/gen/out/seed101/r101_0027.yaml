description: random scenario seed=101 index=27
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 3
  call: s0
  data:
    v: 3
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: s1
  data:
    v: 0
- at: 5
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 10
  call: s0
- at: 12
  call: s2
- at: 12
  result: 1
  response:
    n: 1

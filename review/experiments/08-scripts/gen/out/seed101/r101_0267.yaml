description: random scenario seed=101 index=267
scripts:
  s0:
    alias: Script 0 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: single
    fields:

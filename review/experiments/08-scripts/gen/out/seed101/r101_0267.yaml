      continue_on_error: true
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s4
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}

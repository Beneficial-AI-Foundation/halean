description: random scenario seed=101 index=6
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - delay: 3
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
        - event: mark
          event_data:
            id: s1.3
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    alias: Script 2 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - stop: bad
        error: true
      - event: mark
        event_data:
          id: s2.6
          v: '{{ v | default(0) }}'
      else:
      - delay: 2
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
steps:
- at: 1
  call: s1
- at: 4
  reload:
    s1:
      alias: Script 1 A
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - repeat:
          count: 2
          sequence:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
            continue_on_error: true
          - event: mark
            event_data:
              id: s1.3
              v: '{{ v | default(0) }}'
              r: '{{ r | default(''undef'') }}'
      - event: mark
        event_data:
          id: s1.4
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    s2:
      alias: Script 2 A
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s2.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_off
        target:
          entity_id: script.s2
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - stop: bad
          error: true
        - event: mark
          event_data:
            id: s2.6
            v: '{{ v | default(0) }}'
        else:
        - delay: 2
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
- at: 5
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 8
- at: 9
  result: 1
  response:
    n: 1
- at: 12
  result: 0
  ok: false
  error_kind: invalid
- at: 13
  call: s2
  data:
    v: 2
- at: 14
  call: turn_off
  data:
    entity_id: all

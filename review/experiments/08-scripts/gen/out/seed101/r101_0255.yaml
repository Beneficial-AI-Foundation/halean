description: random scenario seed=101 index=255
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - stop: bad
      error: true
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s2.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_off
        target:
          entity_id: script.s3
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 2
  call: s1
- at: 3
  call: s2
  data:
    v: 1
  return_response: true
- at: 3
  call: s2
  data:
    v: 4
- at: 5
- at: 8
- at: 8
  call: s1
  data:
    v: 1
- at: 10
  call: s3
  data:
    v: 4
  return_response: true

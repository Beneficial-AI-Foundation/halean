      - stop: done
        response_variable: out
- at: 4
  call: s0
  data:
    v: 1
- at: 5
  call: s0
  return_response: true
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 7
  call: s1
  data:
    v: 3
- at: 7
  call: s0
  return_response: true
- at: 8
  call: s0
  return_response: true
- at: 8
  call: s0
  data:
    v: 3
- at: 10

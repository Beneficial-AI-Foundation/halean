description: random scenario seed=101 index=154
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s2.2
            v: '{{ v | default(0) }}'
      - sequence:
        - event: mark
          event_data:
            id: s2.3
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s1'') }}'
            cur: '{{ state_attr(''script.s1'', ''current'') }}'
steps:
- at: 1
  call: s2
  data:
    v: 4
  return_response: true
- at: 2
  call: s0
  data:
    v: 3
  return_response: true
- at: 3
  reload:
    s0:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
          - script.s2
    s1:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s1.1

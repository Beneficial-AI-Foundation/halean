description: random scenario seed=101 index=277
scripts:
  s0:
    alias: Script 0 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 1
  call: s1
- at: 2
  call: s1
  data:
    v: 3
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 4
  call: s0
  data:
    v: 4
- at: 7
  call: s1
  data:
    v: 4
- at: 9
  call: s2
  data:
    v: 3
- at: 12
  call: s1
  data:
    v: 3
  return_response: true
- at: 13
  call: s0
  data:
    v: 4
  return_response: true
- at: 15
- at: 18
  call: s1
  data:
    v: 0
- at: 18
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 21
  call: s0
  data:
    v: 3
- at: 22
  call: s0
  data:
    v: 0
  return_response: true
- at: 24
  call: s0
  data:
    v: 2

description: random scenario seed=101 index=231
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
          response_variable: r
      - sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    alias: Script 1 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
  s4:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 4
  result: 0
  response:
    n: 0
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 7
  call: s3
  data:
    v: 1
  return_response: true
- at: 7
  call: s4
  return_response: true
- at: 8
- at: 9
  call: s0
  data:
    v: 0
  return_response: true
- at: 12
  call: s4
  data:
    v: 3
- at: 13
  call: turn_off
  data:
    entity_id: script.s3
- at: 14
  call: s3
  data:
    v: 1
- at: 15
  call: turn_off
  data:
    entity_id: script.s2
- at: 16
- at: 18
  call: s3
  return_response: true
- at: 19
  call: turn_off
  data:
    entity_id: all
- at: 20
  call: turn_on
  data:
    entity_id:
    - script.s4

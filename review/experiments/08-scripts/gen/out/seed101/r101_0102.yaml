description: random scenario seed=101 index=102
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - delay: 3
  s3:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 1
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 1
  call: s3
  data:
    v: 2
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 2
  call: s1
  data:
    v: 1
- at: 5
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
    s1:
      alias: Script 1 B
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.5
          v: '{{ v | default(0) }}'
    s2:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - delay: 3
    s3:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
      - action: test.m
        data:
          id: s3.4
          v: '{{ v | default(0) }}'
        continue_on_error: true
- at: 6
  call: s3
  data:
    v: 1
  return_response: true
- at: 8
  call: s2
  data:
    v: 4
  return_response: true
- at: 8
  call: turn_off
  data:
    entity_id: script.s0
- at: 8
  call: s2
  return_response: true
- at: 8
  call: s3
  return_response: true

description: random scenario seed=101 index=150
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - delay: 2
    - delay: 1
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s4:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0

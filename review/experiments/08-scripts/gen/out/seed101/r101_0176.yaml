description: random scenario seed=101 index=176
scripts:
  s0:
    alias: Script 0 A
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: script.turn_off
        target:
          entity_id: script.s3
      else:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    alias: Script 2 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s3.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_off
        target:
          entity_id: script.s1
      else:
      - action: test.m
        data:
          id: s3.5
          v: '{{ v | default(0) }}'
        continue_on_error: true
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'

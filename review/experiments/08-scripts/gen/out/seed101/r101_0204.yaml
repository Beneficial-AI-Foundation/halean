description: random scenario seed=101 index=204
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 1
  call: s1
  data:
    v: 1
- at: 2
- at: 2
- at: 3
  call: s2
  data:
    v: 2
  return_response: true
- at: 3
  call: s0
- at: 6
  call: s2
- at: 7
  call: s2
  return_response: true
- at: 10
  call: s1
- at: 11
  call: s1
  return_response: true
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1

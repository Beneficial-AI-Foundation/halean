description: random scenario seed=101 index=198
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 2
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
  call: s1
- at: 2
  call: s2
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 3
  call: s1
  data:
    v: 2
  return_response: true
- at: 4
  call: s0
- at: 7
  call: s2
- at: 7
  call: s0
  data:
    v: 1
- at: 8
  call: s2
  data:
    v: 2
- at: 8
  call: turn_off
  data:
    entity_id: script.s0
- at: 9
  call: s1
  data:
    v: 4
- at: 10
  call: s0
  data:
    v: 1
  return_response: true
- at: 12
  call: s2
  data:
    v: 3

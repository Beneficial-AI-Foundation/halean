        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 1
        - event: mark
          event_data:
            id: s2.3
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'

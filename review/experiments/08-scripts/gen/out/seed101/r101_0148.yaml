description: random scenario seed=101 index=148
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:

description: random scenario seed=101 index=134
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - delay: 2
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - variables:
        out:
          id: s2.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 1
steps:
- at: 3
  call: s1
  data:
    v: 0
  return_response: true
- at: 4
  call: s2
  data:
    v: 3
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 6
  call: s1
  data:
    v: 4
- at: 8
  call: s0
  data:
    v: 0
  return_response: true
- at: 9
  call: s1
  return_response: true
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 1
- at: 14
  call: s0
  data:
    v: 0
  return_response: true
- at: 14
  call: s0
  data:
    v: 1
- at: 15
- at: 16
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s2

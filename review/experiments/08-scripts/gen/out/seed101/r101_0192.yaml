description: random scenario seed=101 index=192
scripts:
  s0:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    alias: Script 1 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - delay: 3
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - delay: 3
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
  s4:
    alias: Script 4 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s4.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
steps:
- at: 3
  call: s2
  data:
    v: 3
- at: 4
  call: s0
  data:
    v: 3
  return_response: true
- at: 5
  call: s4
- at: 5
  result: 0
  response:
    n: 0
- at: 8
  call: s3
  data:
    v: 3
  return_response: true
- at: 9
  call: s2
  data:
    v: 0
- at: 11
  result: 2
  response:
    n: 2
- at: 12
  result: 1
  response:
    n: 1
- at: 14
  call: s2
  return_response: true
- at: 17
  call: s0
  data:
    v: 2
  return_response: true
- at: 18
  call: s4
- at: 19
  call: s2
  data:
    v: 1
  return_response: true
- at: 19
  result: 3
  response:
    n: 3

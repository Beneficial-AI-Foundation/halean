description: random scenario seed=101 index=108
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s2
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
      - sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 1
  call: turn_off
  data:
    entity_id: script.s1
- at: 4
  call: s0
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 10
- at: 13
  call: s2
  data:
    v: 0
- at: 13
  call: s1
  data:
    v: 3
- at: 14
  call: s0
  data:
    v: 0
- at: 15
  call: turn_off
  data:
    entity_id: script.s1
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s2
    variables:
      v: 3
- at: 16
  call: s2
  return_response: true
- at: 17
  call: s3
  return_response: true
- at: 18
  call: s2
  return_response: true
- at: 19
  call: s3
  data:
    v: 2
- at: 21

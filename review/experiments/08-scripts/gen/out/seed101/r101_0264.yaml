description: random scenario seed=101 index=264
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 2
  call: s1
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 11
  call: s3
  data:
    v: 4
- at: 12
  result: 2
  response:
    n: 2
- at: 15
- at: 17
  result: 3
  response:
    n: 3
- at: 20
- at: 23
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 25
- at: 25
  result: 4
  response:
    n: 4

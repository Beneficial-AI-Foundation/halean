description: random scenario seed=101 index=191
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
    - delay: 3
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s4:
    alias: Script 4 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - variables:
        out:
          id: s4.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
  call: s2
  data:
    v: 2
- at: 2
  result: 0
  response:
    n: 0
- at: 2
  call: s4
  data:
    v: 3
  return_response: true
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 6
  result: 2
  response:
    n: 2
- at: 7
  call: s3
- at: 7
  call: s2
  data:
    v: 4
- at: 9
  call: s4
  data:
    v: 2
- at: 10
  result: 3
  ok: false
  error_kind: ha_error
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s4

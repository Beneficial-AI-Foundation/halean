description: random scenario seed=101 index=238
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - delay: 3
  s2:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - delay: 1
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.7
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s4.8
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
    - event: mark
      event_data:
        id: s4.9
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s1
  data:
    v: 2
- at: 1
  call: s4
  data:
    v: 0
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 3
  result: 0
  response:
    n: 0
- at: 6
  call: s4
- at: 9
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 10
  call: turn_off
  data:
    entity_id: script.s3
- at: 11
- at: 11
  result: 1
  response:
    n: 1
- at: 14
  result: 2
  response:
    n: 2

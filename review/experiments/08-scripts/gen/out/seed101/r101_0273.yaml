description: random scenario seed=101 index=273
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - repeat:
        count: 2
        sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
        - delay: 1
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
  s4:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - delay: 3
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'

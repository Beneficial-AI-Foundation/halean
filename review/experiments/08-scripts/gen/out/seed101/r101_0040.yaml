description: random scenario seed=101 index=40
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - delay: 3
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    alias: Script 1 A
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s2
            - script.s3
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        - action: test.m
          data:
            id: s1.5
            v: '{{ v | default(0) }}'
      - sequence:
        - delay: 1
        - repeat:
            count: 2
            sequence:
            - delay: 3
            - action: script.s3
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 2
  call: s0
  return_response: true
- at: 3
  call: s2
  data:
    v: 1
- at: 4
  call: s0
  data:
    v: 3
- at: 4
  result: 1
  ok: false
  error_kind: ha_error
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: turn_off
  data:
    entity_id: script.s1
- at: 6
  call: s2
  data:
    v: 1
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 8
  result: 2
  response:
    n: 2
- at: 9
- at: 10
  call: s0
  data:
    v: 4
- at: 12
  result: 3
  response:
    n: 3

description: random scenario seed=101 index=139
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s0.2
            v: '{{ v | default(0) }}'
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - repeat:
            count: 2
            sequence:
            - event: mark
              event_data:
                id: s0.3
    - delay: 3
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 1
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 1
  call: s1
  data:
    v: 3
  return_response: true
- at: 1
  call: s3
- at: 2
  result: 0
  response:
    n: 0
- at: 3
- at: 4
  call: s0
- at: 5
- at: 7
  call: turn_off
  data:
    entity_id: script.s2
- at: 8
  call: s0
  data:
    v: 0
- at: 9
  reload:
    s0:
      alias: Script 0 B
      mode: single
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - parallel:
        - sequence:
          - event: mark
            event_data:
              id: s0.2
              v: '{{ v | default(0) }}'
        - sequence:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
          - repeat:
              count: 2
              sequence:
              - event: mark
                event_data:
                  id: s0.3
      - delay: 3
    s1:
      alias: Script 1 B
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        response_variable: r
    s2:
      icon: mdi:script
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - delay: 1
      alias: Reloaded s2
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - variables:
          out:
            id: s3.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s3.6
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'

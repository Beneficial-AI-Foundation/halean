description: random scenario seed=101 index=196
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.toggle
      target:
        entity_id: script.s2
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s2.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
  s4:
    alias: Script 4 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
    - delay: 1
    - delay: 1
steps:
- at: 1
  call: s3
  data:
    v: 2
  return_response: true
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 2
  call: s3
- at: 3
  call: s3
  return_response: true
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 5
  call: s4
  data:
    v: 3
- at: 6
  call: s1
  data:
    v: 3
- at: 9
- at: 10
  call: s2
  data:
    v: 0
- at: 11
  call: s0
  data:
    v: 0
- at: 13
  result: 0
  response:
    n: 0
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 15
  call: toggle
  data:
    entity_id:
    - script.s4
    - script.s1
- at: 18
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s0.2
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s4'') }}'
          cur: '{{ state_attr(''script.s4'', ''current'') }}'
      - action: script.turn_off
        target:
          entity_id: script.s2
    s2:
      alias: Script 2 A
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s0'') }}'
          cur: '{{ state_attr(''script.s0'', ''current'') }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - variables:
            out:
              id: s2.4
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
    s3:
      mode: parallel
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
    s4:
      alias: Script 4 A
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - delay: 1
      - delay: 1
      - delay: 1
- at: 20
  call: s4
- at: 20
  call: turn_off
  data:
    entity_id: all

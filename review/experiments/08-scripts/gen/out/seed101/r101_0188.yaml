description: random scenario seed=101 index=188
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s0.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s3'') }}'
          cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - delay: 2
  s1:
    alias: Script 1 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - delay: 2
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s0
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
steps:
- at: 1
- at: 3
  call: turn_off
  data:
    entity_id: script.s1
- at: 6
  call: s2
  data:
    v: 1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 9
- at: 10
  call: s0
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 14
  call: s1
  data:
    v: 4

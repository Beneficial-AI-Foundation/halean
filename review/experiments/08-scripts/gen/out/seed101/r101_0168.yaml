description: random scenario seed=101 index=168
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s1:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s4
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      - action: test.m
        data:
          id: s2.4
          v: '{{ v | default(0) }}'
        continue_on_error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - delay: 1
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - stop: bad
      error: true
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s4.7
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 2
  call: s1
- at: 3
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 5
- at: 6
  call: s3
  data:
    v: 3
  return_response: true
- at: 8
  result: 0
  response:
    n: 0
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 8
  call: s4
  data:
    v: 4
  return_response: true
- at: 10
  call: s4
- at: 11
  result: 2
  response:
    n: 2
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s4
- at: 14
  reload:
    s0:
      alias: Script 0 B
      mode: single
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s2'') }}'
          cur: '{{ state_attr(''script.s2'', ''current'') }}'
    s1:
      icon: mdi:script
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - action: script.toggle
        target:
          entity_id: script.s4
      - action: script.turn_off
        target:
          entity_id: script.s1
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
    s3:
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - delay: 1
      - action: test.m
        data:
          id: s3.5
          v: '{{ v | default(0) }}'
      - stop: bad
        error: true
    s4:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - action: test.m
        data:
          id: s4.6
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.turn_off
        target:
          entity_id: script.s0
      - action: test.m
        data:
          id: s4.7
          v: '{{ v | default(0) }}'
        response_variable: r
- at: 15
  result: 1
  response:
    n: 1
- at: 17
  call: s4
  data:
    v: 1
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
    variables:
      v: 3
- at: 20
  call: s4
  data:
    v: 4

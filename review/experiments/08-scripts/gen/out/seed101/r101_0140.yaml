description: random scenario seed=101 index=140
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 1
        - action: script.turn_on
          target:
            entity_id:
            - script.s4
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 3
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s3
  s3:
    alias: Script 3 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s3.2
          v: '{{ v | default(0) }}'
      - variables:
          out:
            id: s3.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s3
  s4:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s3
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
steps:
- at: 2
  call: s2
  data:
    v: 3
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 6
  call: s1
  data:
    v: 0
  return_response: true
- at: 8
  call: s4
  data:
    v: 1
- at: 8
  call: s4
- at: 9
  call: s1
  data:
    v: 1
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s4
    - script.s1
- at: 11
  result: 1
  ok: false
  error_kind: invalid
- at: 11
  call: s0
- at: 12
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - delay: 1
          - action: script.turn_on
            target:
              entity_id:
              - script.s4
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
          - script.s4
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - delay: 3
    s1:
      mode: queued
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - delay: 1
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
    s2:
      alias: Script 2 A
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.1
          v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s3
    s3:
      alias: Script 3 A
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.toggle
        target:
          entity_id: script.s4
      - action: test.m
        data:
          id: s3.6
          v: '{{ v | default(0) }}'
        response_variable: r
      - variables:
          out:
            id: s3.7
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
    s4:
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s4.4
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - action: script.turn_off
        target:
          entity_id: script.s3
      - action: test.m
        data:
          id: s4.5
          v: '{{ v | default(0) }}'
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.s4
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s4
    variables:
      v: 2
- at: 16
- at: 19
- at: 21
  call: s3
  data:
    v: 1

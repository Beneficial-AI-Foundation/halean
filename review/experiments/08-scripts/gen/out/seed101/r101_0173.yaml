      target:
        entity_id: script.s0
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.turn_off
      target:
        entity_id: script.s3

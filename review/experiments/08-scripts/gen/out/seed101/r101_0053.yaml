description: random scenario seed=101 index=53
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s4:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s3
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 2
  call: s1
  data:
    v: 4
- at: 2
  call: s0
  data:
    v: 1
- at: 3
  call: s3
  return_response: true
- at: 5
  call: s2
  data:
    v: 1
- at: 7
  call: s4
  return_response: true
- at: 7
  call: s0
  data:
    v: 1
  return_response: true
- at: 10
  result: 0
  response:
    n: 0
- at: 11
  call: s3
  data:
    v: 2
- at: 12
- at: 13
  call: s4
  data:
    v: 3
  return_response: true
- at: 16
  call: s2
- at: 17
  call: s4
  data:
    v: 4
- at: 17
  call: s3
  data:
    v: 3
- at: 20
  call: s4
  data:
    v: 1
  return_response: true

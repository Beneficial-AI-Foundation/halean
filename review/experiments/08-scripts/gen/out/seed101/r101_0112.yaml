description: random scenario seed=101 index=112
scripts:
  s0:
    alias: Script 0 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s0.3
            v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.6
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s3
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s2.7
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
        - action: script.turn_on
          target:
            entity_id:
            - script.s3
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
      - sequence:
        - event: mark
          event_data:
            id: s2.8
            v: '{{ v | default(0) }}'
  s3:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.turn_off
      target:
        entity_id: script.s1
    - event: mark
      event_data:
        id: s3.9
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 1
  call: s1
  data:
    v: 3
- at: 3
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: s2
  data:
    v: 4
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 9
  result: 1
  response:
    n: 1
- at: 10
  call: s1
  return_response: true
- at: 10
  reload:
    s0:
      alias: Script 0 A
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s3
      - variables:
          out:
            id: s0.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s0.2
              v: '{{ v | default(0) }}'
          - action: test.m
            data:
              id: s0.3
              v: '{{ v | default(0) }}'
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
          - script.s2
    s1:
      mode: single
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.5
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s1.6
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - action: script.turn_off
        target:
          entity_id: script.s3
    s3:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - action: script.turn_off
        target:
          entity_id: script.s0
      - action: script.turn_off
        target:
          entity_id: script.s1
      - event: mark
        event_data:
          id: s3.9
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
- at: 11
  result: 2
  response:
    n: 2
- at: 14
  call: s0
  data:
    v: 4

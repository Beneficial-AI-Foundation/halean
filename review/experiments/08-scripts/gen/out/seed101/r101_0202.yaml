description: random scenario seed=101 index=202
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s0.1
            v: '{{ v | default(0) }}'
        - repeat:
            count: 2
            sequence:
            - action: test.m
              data:
                id: s0.2
                v: '{{ v | default(0) }}'
              response_variable: r
            - delay: 3
      - sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - delay: 1
steps:
- at: 1
  call: s1
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 6
  result: 0
  ok: false
  error_kind: invalid
- at: 8
  call: s3
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id: all
- at: 11
  call: s0
  data:
    v: 2
  return_response: true
- at: 14
  call: s2
  data:
    v: 2
  return_response: true
- at: 17
  call: s0
  return_response: true

description: random scenario seed=101 index=247
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
  s1:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
steps:
- at: 3
  call: s0
  data:
    v: 1
- at: 4
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 9
  call: s1
  data:
    v: 1
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 10
  call: s2
  data:
    v: 4
- at: 11
  call: s1
  data:
    v: 0
- at: 12
  call: s2
- at: 13
  call: s1
- at: 14
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 15
  call: s2
  data:
    v: 3
  return_response: true

description: random scenario seed=101 index=222
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    alias: Script 1 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 1
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s4:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
    - action: test.m
      data:
        id: s4.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 1
  call: s2
  data:
    v: 2
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s4
    - script.s3
- at: 5
  result: 0
  response:
    n: 0
- at: 8
  call: s1
  data:
    v: 3
  return_response: true
- at: 9
  call: s2
  data:
    v: 4
  return_response: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 9
  call: s3
  return_response: true
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s4
- at: 10
- at: 12
  result: 2
  response:
    n: 2
- at: 12
  result: 1
  response:
    n: 1

description: random scenario seed=101 index=7
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s1.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      else:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 1
  call: s1
  return_response: true
- at: 2
  call: s2
- at: 3
  call: s0
  data:
    v: 0
  return_response: true
- at: 5
  call: turn_off
  data:
    entity_id: script.s1
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 5
  call: s2
- at: 7
  call: s1
  data:
    v: 2
- at: 8
  call: s1
  data:
    v: 3
- at: 9
  reload:
    s0:
      alias: Script 0 B
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
    s1:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.turn_off
          target:
            entity_id: script.s1
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - variables:
            out:
              id: s1.1
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        else:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
      alias: Reloaded s1
    s2:
      icon: mdi:script
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s1
- at: 11
  call: s2
  data:
    v: 0
  return_response: true
- at: 14
  call: s2
  data:
    v: 2
- at: 15
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 3

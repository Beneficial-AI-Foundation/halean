description: random scenario seed=101 index=86
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - delay: 2
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s4
  data:
    v: 2
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: s0
- at: 7
  call: s0
  data:
    v: 4
  return_response: true
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s4
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 11
  result: 1
  response:
    n: 1
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
    variables:
      v: 1
- at: 13
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0

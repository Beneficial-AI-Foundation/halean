description: random scenario seed=101 index=24
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s3
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s3
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s3.2
            v: '{{ v | default(0) }}'
        - repeat:
            count: 2
            sequence:
            - delay: 2
      - sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
        - action: test.m
          data:
            id: s3.3
            v: '{{ v | default(0) }}'
steps:
- at: 1
- at: 4
  call: s2
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 7
  call: s0
- at: 10
  result: 0
  response:
    n: 0
- at: 13
- at: 14
  call: s0
  data:
    v: 2
- at: 15
  call: turn_off
  data:
    entity_id: all
- at: 17
  result: 1
  response:
    n: 1
- at: 20
  result: 2
  response:
    n: 2
- at: 22
  call: s1
  data:
    v: 2
  return_response: true
- at: 23
  call: s0
  data:
    v: 4
  return_response: true

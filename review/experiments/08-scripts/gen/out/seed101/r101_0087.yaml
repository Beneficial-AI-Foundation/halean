    alias: Script 2 B
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s2.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
        - action: script.turn_off
          target:
            entity_id: script.s1
      - sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out

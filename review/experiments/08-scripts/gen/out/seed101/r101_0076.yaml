description: random scenario seed=101 index=76
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - delay: 2
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 1
  call: s1
  return_response: true
- at: 3
  call: s1
  return_response: true
- at: 6
  call: s1
  return_response: true
- at: 8
  call: s1
- at: 9
  call: s2
  data:
    v: 4
- at: 12
  call: s2
  data:
    v: 2
  return_response: true
- at: 15
  call: s1
  data:
    v: 3
  return_response: true
- at: 16
  call: s2
  return_response: true
- at: 17
  call: s1
  data:
    v: 3
- at: 18
  call: s2
  data:
    v: 0
  return_response: true

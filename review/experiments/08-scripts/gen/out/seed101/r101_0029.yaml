description: random scenario seed=101 index=29
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - delay: 2
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - delay: 1
  s2:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s2.4
            v: '{{ v | default(0) }}'
          response_variable: r
      - sequence:
        - action: test.m
          data:
            id: s2.5
            v: '{{ v | default(0) }}'
    - delay: 3
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - stop: bad
      error: true
steps:
- at: 2
  call: s0
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  call: s1
  data:
    v: 3
- at: 8
  call: s2
  data:
    v: 2
  return_response: true
- at: 11
  result: 1
  response:
    n: 1
- at: 12
  result: 2
  response:
    n: 2
- at: 15
- at: 18
  call: s0
  data:
    v: 4
- at: 19

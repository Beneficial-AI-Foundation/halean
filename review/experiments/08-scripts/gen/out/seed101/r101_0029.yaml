description: random scenario seed=101 index=29
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - event: mark
            event_data:
              id: s0.2
              v: '{{ v | default(0) }}'
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
          else:
          - event: mark
            event_data:
              id: s0.3
              v: '{{ v | default(0) }}'
              st: '{{ states(''script.s1'') }}'
              cur: '{{ state_attr(''script.s1'', ''current'') }}'
          - action: script.turn_off
            target:
              entity_id: script.s3
      - sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - variables:
        out:
          id: s2.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s2.7
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: test.m
      data:
        id: s2.8
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
        - delay: 1
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 1
  call: s0
  data:
    v: 1
- at: 2
  call: s0
  data:
    v: 2
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 6
  result: 1
  response:
    n: 1
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  result: 3
  ok: false
  error_kind: invalid
- at: 10
  result: 4
  response:
    n: 4
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3

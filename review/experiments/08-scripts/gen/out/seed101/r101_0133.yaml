description: random scenario seed=101 index=133
scripts:
  s0:
    alias: Script 0 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - stop: bad
      error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s2
  s2:
    alias: Script 2 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s3.2
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 3
- at: 3
  call: s1
  data:
    v: 4
- at: 4
  call: s1
  data:
    v: 0
  return_response: true
- at: 5
  call: s3
  data:
    v: 2
- at: 5
  result: 0
  response:
    n: 0
- at: 8
  call: s3
  data:
    v: 2
- at: 8
  call: s2
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 10
- at: 12
  result: 1
  response:
    n: 1
- at: 13
  result: 2
  response:
    n: 2
- at: 15
  call: turn_off
  data:
    entity_id: all

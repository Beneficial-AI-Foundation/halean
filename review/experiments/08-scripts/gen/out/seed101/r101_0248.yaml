description: random scenario seed=101 index=248
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s2:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.toggle
      target:
        entity_id: script.s4
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s4
  s4:
    alias: Script 4 A
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 2
  call: s4
  return_response: true
- at: 2
- at: 3
- at: 4
  call: s0
  data:
    v: 1
- at: 5
  result: 0
  response:
    n: 0
- at: 8
  call: s2
  data:
    v: 3
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 10
- at: 11
- at: 13
  call: s1
  data:
    v: 4
- at: 15
  call: s4
  data:
    v: 0
  return_response: true
- at: 16
  call: s3
  return_response: true
- at: 16
  call: s4

description: random scenario seed=101 index=256
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s3
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        - action: test.m
          data:
            id: s2.2
            v: '{{ v | default(0) }}'
          continue_on_error: true
  s3:
    alias: Script 3 A
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 1
  call: s3
- at: 2
  call: s2
  data:
    v: 1
  return_response: true
- at: 3
- at: 5
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: s2
  data:
    v: 3
- at: 6
  reload:
    s0:
      alias: Script 0 A
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
    s1:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - stop: bad
        error: true
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      alias: Reloaded s1
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - action: script.turn_on
            target:
              entity_id:
              - script.s3
            data:
              variables:
                v: '{{ v | default(0) + 10 }}'
          - action: test.m
            data:
              id: s2.2
              v: '{{ v | default(0) }}'
            continue_on_error: true
    s3:
      alias: Script 3 A
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 2
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0

description: random scenario seed=101 index=187
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s3.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 1
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
    - delay: 1
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
    variables:
      v: 1
- at: 4
  call: turn_off
  data:
    entity_id: all
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: s0
  data:
    v: 4
- at: 8
  call: s4
  data:
    v: 2
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 4
- at: 11
  call: s0
- at: 12
  result: 1
  response:
    n: 1

description: random scenario seed=101 index=241
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 1
  call: s0
  data:
    v: 4
- at: 2
  call: s1
  return_response: true
- at: 3
  call: s0
  data:
    v: 2
  return_response: true
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 6
  result: 0
  ok: false
  error_kind: ha_error
- at: 7
  call: s1
- at: 8
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      alias: Script 1 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s2:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - delay: 1
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
- at: 10
  result: 1
  response:
    n: 1
- at: 10
  call: s0
  data:
    v: 1
- at: 10
  call: s2
  data:
    v: 1
  return_response: true
- at: 10
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 11
  call: s0
- at: 12
  call: s0
  data:
    v: 2
  return_response: true
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 4

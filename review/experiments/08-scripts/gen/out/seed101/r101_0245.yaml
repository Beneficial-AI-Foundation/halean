description: random scenario seed=101 index=245
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - delay: 2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - repeat:
            count: 2
            sequence:
            - event: mark
              event_data:
                id: s2.3
                v: '{{ v | default(0) }}'
      - sequence:
        - variables:
            out:
              id: s2.4
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 2
  call: s1
  data:
    v: 4
- at: 3
  call: s0
  data:
    v: 0
- at: 3
  result: 0
  response:
    n: 0
- at: 3
  result: 1
  response:
    n: 1
- at: 4
  call: s1
  data:
    v: 4
- at: 7
  call: s0
  data:
    v: 4
- at: 9
  call: s0
  data:
    v: 3
- at: 10
  result: 2
  ok: false
  error_kind: ha_error
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 14
  call: s0
  data:
    v: 4
  return_response: true
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 2
- at: 17
  call: s2
  return_response: true

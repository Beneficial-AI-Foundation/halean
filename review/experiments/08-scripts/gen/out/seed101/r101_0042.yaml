description: random scenario seed=101 index=42
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s2
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s3.3
          v: '{{ v | default(0) }}'
      - variables:
          out:
            id: s3.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s3
    variables:
      v: 1
- at: 4
  call: s3
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
    variables:
      v: 0
- at: 6
  call: s1
  data:
    v: 2
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 11
  call: s2
  data:
    v: 4
- at: 13
  call: s3
  return_response: true
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 17
  call: s2
  return_response: true
- at: 17
  call: s2
- at: 18
  call: s0
  data:
    v: 4
- at: 20

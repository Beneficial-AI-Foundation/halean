description: random scenario seed=101 index=170
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s2
  data:
    v: 0
  return_response: true
- at: 2
  call: s1
  data:
    v: 2
  return_response: true
- at: 3
  call: s0
- at: 3
  call: s0
  data:
    v: 3
  return_response: true
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 4
  call: s2
  data:
    v: 2
  return_response: true
- at: 7
  call: turn_off
  data:
    entity_id: script.s2
- at: 7
  call: s2
  return_response: true
- at: 10
  call: s2
- at: 11
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 12
  call: s2
  data:
    v: 3
  return_response: true
- at: 15
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 18
  call: s2
  return_response: true

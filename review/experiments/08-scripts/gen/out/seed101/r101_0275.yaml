description: random scenario seed=101 index=275
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s1.6
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s2.7
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 2
  call: s1
  return_response: true
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 8
  call: s2
  return_response: true
- at: 8
  call: s2
- at: 9
  call: s2
  data:
    v: 0
- at: 10
  call: s1
- at: 11
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 15
  result: 0
  response:
    n: 0

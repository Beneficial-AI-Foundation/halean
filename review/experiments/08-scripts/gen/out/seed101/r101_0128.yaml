description: random scenario seed=101 index=128
scripts:
  s0:
    alias: Script 0 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 1
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
    - delay: 1
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s4
    - action: test.m
      data:
        id: s2.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.toggle
      target:
        entity_id: script.s4
  s4:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.3
        v: '{{ v | default(0) }}'
steps:
- at: 1
- at: 3
- at: 5
- at: 6
  call: s4
  data:
    v: 0
  return_response: true
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 10
  call: s0
- at: 13
- at: 14
  result: 0
  response:
    n: 0
- at: 15
  call: turn_off
  data:
    entity_id: all
- at: 15
  call: s3
- at: 16
- at: 19
  call: s3
  return_response: true
- at: 20
  call: s3
  data:
    v: 3
- at: 22
  call: s2
  data:
    v: 2

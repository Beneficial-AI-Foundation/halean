description: random scenario seed=101 index=207
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s1:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s0
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s3.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 1
  call: s2
  data:
    v: 4
- at: 1
  call: s0
  data:
    v: 1
- at: 2
  result: 0
  response:
    n: 0
- at: 3
  call: s1
  data:
    v: 0
- at: 4
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 5
  call: s0
  return_response: true
- at: 6
  result: 1
  response:
    n: 1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 2
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 11
  call: s1
  return_response: true
- at: 14
  reload:
    s0:
      alias: Script 0 B
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
    s1:
      icon: mdi:script
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - stop: bad
        error: true
      - delay: 1
      - action: script.turn_off
        target:
          entity_id: script.s0
    s2:
      alias: Script 2 A
      mode: single
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    s3:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s3.2
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
      - action: test.m
        data:
          id: s3.3
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: test.m
        data:
          id: s3.4
          v: '{{ v | default(0) }}'
        response_variable: r
      alias: Reloaded s3
- at: 14
  result: 2
  response:
    n: 2
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 15
- at: 16
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 17
  call: s1
  data:
    v: 2

description: random scenario seed=101 index=274
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_off
      target:
        entity_id: script.s3
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - delay: 1
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
      - sequence:
        - delay: 1
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s3.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s2
- at: 2
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: turn_off
  data:
    entity_id: script.s1
- at: 5
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 9
  call: s3
  data:
    v: 3
  return_response: true
- at: 12
  call: s0
  data:
    v: 2
- at: 15
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 16
  result: 1
  ok: false
  error_kind: other
- at: 17
  call: s0
  return_response: true
- at: 18
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
    variables:
      v: 2

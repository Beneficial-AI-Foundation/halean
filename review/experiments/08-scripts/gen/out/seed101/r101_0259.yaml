description: random scenario seed=101 index=259
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s1.3
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s1.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s2'') }}'
            cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - delay: 1
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 3
        - delay: 1
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s0
  data:
    v: 1
- at: 4
  call: s1
  data:
    v: 3
- at: 6
  call: s0
  data:
    v: 3
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: s3
  return_response: true
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 10
  call: s1
- at: 10
  reload:
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s1.3
              v: '{{ v | default(0) }}'
          - event: mark
            event_data:
              id: s1.4
              v: '{{ v | default(0) }}'
              st: '{{ states(''script.s2'') }}'
              cur: '{{ state_attr(''script.s2'', ''current'') }}'
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - delay: 1
      - action: test.m
        data:
          id: s1.5
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s2:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s0
      - stop: bad
        error: true
      - action: test.m
        data:
          id: s2.6
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
    s3:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - delay: 3
          - delay: 1
      - action: test.m
        data:
          id: s3.7
          v: '{{ v | default(0) }}'
- at: 12
  result: 2
  response:
    n: 2
- at: 12
  call: s1
  data:
    v: 0
  return_response: true
- at: 15
  result: 3
  response:
    n: 3
- at: 15
- at: 16
  call: turn_off
  data:
    entity_id: all

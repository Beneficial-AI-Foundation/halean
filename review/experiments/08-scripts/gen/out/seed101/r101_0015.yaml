description: random scenario seed=101 index=15
scripts:
  s0:
    alias: Script 0 A
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s1:
    alias: Script 1 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 5
  call: turn_off
  data:
    entity_id: script.s0
- at: 5
  call: s1
  data:
    v: 4
- at: 6
  call: s2
- at: 9
  call: s0
  data:
    v: 0
- at: 11
  call: s1
  return_response: true
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 15
  call: s1
  data:
    v: 4

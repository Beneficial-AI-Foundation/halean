description: random scenario seed=101 index=160
scripts:
  s0:
    alias: Script 0 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s3
    - delay: 2
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 3
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s2
  data:
    v: 2
  return_response: true
- at: 1
  call: s3
  return_response: true
- at: 2
  reload:
    s0:
      alias: Script 0 A
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - action: script.toggle
        target:
          entity_id: script.s3
      - delay: 2
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - delay: 3
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
    s3:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s3.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      alias: Reloaded s3
- at: 4
  call: s2
- at: 6
  call: s2
  data:
    v: 2
- at: 6
  call: s1
  data:
    v: 3
- at: 6
- at: 6
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 9
  call: s2

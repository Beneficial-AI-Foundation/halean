description: random scenario seed=101 index=37
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - repeat:
            count: 2
            sequence:
            - action: script.turn_on
              target:
                entity_id:
                - script.s3
                - script.s1
      - sequence:
        - delay: 3
        - delay: 1
  s1:
    alias: Script 1 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.toggle
      target:
        entity_id: script.s3
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s3.6
            v: '{{ v | default(0) }}'
          continue_on_error: true
    - delay: 1
    - parallel:
      - sequence:
        - delay: 1
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s1
    - event: mark
      event_data:
        id: s3.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 1
  call: s2
  data:
    v: 2
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 1
- at: 2
  call: s2
  data:
    v: 2
  return_response: true
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 1
- at: 4
  call: turn_off
  data:
    entity_id: script.s3
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s3
    variables:
      v: 2
- at: 5
  call: s2
  data:
    v: 1
- at: 6
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 9
  call: s2
  data:
    v: 1
- at: 10
  call: s1
  data:
    v: 1
- at: 12

description: random scenario seed=101 index=164
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
    - parallel:
      - sequence:
        - action: script.s4
          data:
            v: '{{ v | default(0) + 1 }}'
      - sequence:
        - delay: 1
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s4
    - action: script.toggle
      target:
        entity_id: script.s4
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
      else:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s3.6
            v: '{{ v | default(0) }}'
      - sequence:
        - delay: 1
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 2
  call: s1
  return_response: true
- at: 3
  call: s2
  data:
    v: 1
- at: 4
  call: s1
- at: 5
  result: 0
  response:
    n: 0
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s3
    variables:
      v: 2
- at: 11
  result: 1
  response:
    n: 1
- at: 13
  call: s4
  data:
    v: 3
- at: 15
  reload:
    s0:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
      - parallel:
        - sequence:
          - action: script.s4
            data:
              v: '{{ v | default(0) + 1 }}'
        - sequence:
          - delay: 1
          - action: script.s3
            data:
              v: '{{ v | default(0) + 1 }}'
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
    s1:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.toggle
        target:
          entity_id: script.s4
      - action: script.toggle
        target:
          entity_id: script.s4
    s3:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s3.5
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s4'') }}'
          cur: '{{ state_attr(''script.s4'', ''current'') }}'
      - parallel:
        - sequence:
          - action: test.m
            data:
              id: s3.6
              v: '{{ v | default(0) }}'
        - sequence:
          - delay: 1
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
    s4:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
- at: 15
  call: s4
  return_response: true
- at: 18
  call: s1
- at: 19
  call: s0
- at: 21
- at: 24
  call: s1

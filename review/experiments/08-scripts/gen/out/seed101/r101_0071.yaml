description: random scenario seed=101 index=71
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - delay: 1
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s3
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: test.m
            data:
              id: s1.2
              v: '{{ v | default(0) }}'
          - delay: 1
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s2.5
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      else:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
  s4:
    alias: Script 4 B
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.7
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 1

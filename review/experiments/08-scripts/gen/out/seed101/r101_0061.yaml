description: random scenario seed=101 index=61
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s0'') }}'
          cur: '{{ state_attr(''script.s0'', ''current'') }}'
      else:
      - action: script.turn_off
        target:
          entity_id: script.s3
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
        continue_on_error: true
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - delay: 3
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s4
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s4:
    alias: Script 4 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
    - event: mark
      event_data:
        id: s4.4
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s4.5
        v: '{{ v | default(0) }}'
steps:
- at: 2
  call: turn_off
  data:
    entity_id: script.s3
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 0
- at: 6
  call: s2
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 9
  call: s3
- at: 10
  call: s0
  data:
    v: 0
- at: 11
  result: 0
  response:
    n: 0
- at: 12
  result: 1
  response:
    n: 1
- at: 12
  call: s1
  return_response: true
- at: 13
  result: 2
  response:
    n: 2
- at: 13
  call: turn_off
  data:
    entity_id: all
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s4
- at: 14
  call: s4
  data:
    v: 2
- at: 14
  call: s2
- at: 17
  result: 3
  response:
    n: 3
- at: 19
  result: 4
  response:
    n: 4

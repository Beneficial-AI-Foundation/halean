description: random scenario seed=101 index=298
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.toggle
        target:
          entity_id: script.s2
      else:
      - delay: 1
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 2
  call: s2
  data:
    v: 0
- at: 4
  call: s0
- at: 7
  call: turn_off
  data:
    entity_id: script.s0
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 9
  reload:
    s0:
      alias: Script 0 B
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s0.2
          v: '{{ v | default(0) }}'
    s1:
      alias: Script 1 A
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - action: test.m
            data:
              id: s1.5
              v: '{{ v | default(0) }}'
            response_variable: r
          - action: script.turn_off
            target:
              entity_id: script.s1
        - sequence:
          - event: mark
            event_data:
              id: s1.6
              v: '{{ v | default(0) }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - delay: 2
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
- at: 10
  result: 0
  response:
    n: 0
- at: 10
  result: 1
  response:
    n: 1
- at: 11
  call: turn_off
  data:
    entity_id: script.s1
- at: 11
  result: 2
  response:
    n: 2

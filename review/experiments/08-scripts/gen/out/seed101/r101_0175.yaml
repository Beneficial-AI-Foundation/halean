description: random scenario seed=101 index=175
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - delay: 3
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    alias: Script 2 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s2
  data:
    v: 3
- at: 5
  call: s1
  data:
    v: 4
- at: 7
  call: s2
  data:
    v: 3
- at: 10
  call: s1
  data:
    v: 4
- at: 11
  call: turn_off
  data:
    entity_id: script.s2
- at: 12
  result: 0
  ok: false
  error_kind: other
- at: 13
  call: turn_off
  data:
    entity_id: script.s1
- at: 16
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 19
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 4
- at: 20
  call: s1

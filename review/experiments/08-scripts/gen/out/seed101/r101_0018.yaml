description: random scenario seed=101 index=18
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - delay: 1
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s2.4
            v: '{{ v | default(0) }}'
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s2
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 2
steps:
- at: 1
  call: turn_off
  data:
    entity_id: script.s0
- at: 4
  call: s2
  data:
    v: 3
  return_response: true
- at: 5
  call: s2
  data:
    v: 1
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 4
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 9
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 11
  call: s1
  data:
    v: 3
- at: 12

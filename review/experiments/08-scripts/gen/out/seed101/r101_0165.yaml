description: random scenario seed=101 index=165
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s2.4
            v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s3
      - sequence:
        - delay: 2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - delay: 2
        - delay: 1
        else:
        - delay: 1
        - event: mark
          event_data:
            id: s3.5
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s3.6
            v: '{{ v | default(0) }}'
          response_variable: r
        - event: mark
          event_data:
            id: s3.7
            v: '{{ v | default(0) }}'
      - sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
  s4:
    alias: Script 4 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.8
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s4.9
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s3
  data:
    v: 4
- at: 5
  call: s4
  data:
    v: 4
  return_response: true
- at: 7
  call: s4
  data:
    v: 3
  return_response: true
- at: 8
  call: s4
  data:
    v: 4
  return_response: true
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  call: turn_off
  data:
    entity_id: script.s4
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 11
  call: s3
  return_response: true
- at: 11
  call: s4
  data:
    v: 1

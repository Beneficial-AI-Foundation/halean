description: random scenario seed=101 index=163
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 A
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s3.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s3.8
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 1
  call: s0
  data:
    v: 1
- at: 3
  call: s2
  data:
    v: 3
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 5
  result: 0
  response:
    n: 0
- at: 7
  result: 1
  response:
    n: 1
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
    variables:
      v: 1
- at: 8
  call: s1
  data:
    v: 2
  return_response: true
- at: 9
  call: s0
  data:
    v: 1
  return_response: true
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 11
  result: 3
  response:
    n: 3
- at: 13
  call: s3
- at: 14

description: random scenario seed=101 index=156
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - delay: 2
    - variables:
        out:
          id: s0.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    alias: Script 2 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - delay: 1
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
        - stop: bad
          error: true
  s4:
    alias: Script 4 A
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.turn_off
      target:
        entity_id: script.s4

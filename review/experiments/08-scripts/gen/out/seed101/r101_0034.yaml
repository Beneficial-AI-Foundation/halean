description: random scenario seed=101 index=34
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 2
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - delay: 3
  s2:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 1
- at: 2
  call: s1
  data:
    v: 0
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: s2
  data:
    v: 0
- at: 7
  call: s0
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  call: s0
  data:
    v: 4
  return_response: true
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 10
  call: s0
  data:
    v: 1
- at: 10
  call: s1
  return_response: true
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s0

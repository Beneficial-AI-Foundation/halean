description: random scenario seed=101 index=250
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
  s1:
    alias: Script 1 A
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s1.3
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s1.4
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
      - sequence:
        - delay: 3
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    alias: Script 3 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s4
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s4:
    alias: Script 4 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.8
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - variables:
        out:
          id: s4.9
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s4.10
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s4
- at: 1
  call: s0
- at: 2
  result: 0
  response:
    n: 0
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 3
  call: s1
  return_response: true
- at: 5
  call: s4
  data:
    v: 2
- at: 7
  reload:
    s0:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - action: test.m
        data:
          id: s2.5
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    s3:
      alias: Script 3 B
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s3.6
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.turn_off
        target:
          entity_id: script.s4
      - action: test.m
        data:
          id: s3.7
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    s4:
      alias: Script 4 B
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s4.8
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - variables:
          out:
            id: s4.9
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s4.10
          v: '{{ v | default(0) }}'
- at: 8
- at: 9
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 10
  result: 1
  response:
    n: 1
- at: 13
- at: 13
  call: s3
  data:
    v: 1
  return_response: true
- at: 14
  call: s4
  data:
    v: 2
- at: 15
  result: 2
  response:
    n: 2
- at: 17
  call: turn_off
  data:
    entity_id: script.s2

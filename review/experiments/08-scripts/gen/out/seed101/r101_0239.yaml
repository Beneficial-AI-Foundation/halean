description: random scenario seed=101 index=239
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      else:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 2
  result: 0
  response:
    n: 0
- at: 3
  call: s0
  data:
    v: 3
  return_response: true
- at: 4
  call: s2
  data:
    v: 0
  return_response: true
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 8
  call: turn_off
  data:
    entity_id: script.s2
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 3
- at: 10
  result: 2
  response:
    n: 2
- at: 11
  call: s1
  data:
    v: 1

description: random scenario seed=101 index=153
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 1
  result: 0
  ok: false
  error_kind: ha_error
- at: 3
  call: s0
  data:
    v: 1
- at: 4
  call: s2
- at: 6
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    s1:
      alias: Script 1 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
    s2:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s0
      alias: Reloaded s2
- at: 7
  call: s2
  data:
    v: 1
- at: 7
  call: s0
  data:
    v: 4
- at: 10
- at: 10
  call: s0
- at: 13
  call: s1
- at: 16
  call: s2
- at: 17
  call: turn_off
  data:
    entity_id: all
- at: 19
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2

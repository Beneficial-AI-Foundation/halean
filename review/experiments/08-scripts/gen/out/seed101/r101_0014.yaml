description: random scenario seed=101 index=14
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - delay: 2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.7
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
  s3:
    alias: Script 3 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
    - stop: bad
      error: true
    - event: mark
      event_data:
        id: s3.9
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
steps:
- at: 3
  call: s0
  data:
    v: 0
- at: 4
  call: s1
  return_response: true
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 6
  call: s1
  data:
    v: 2
  return_response: true
- at: 7
  call: s1
- at: 8
  result: 2
  ok: false
  error_kind: ha_error
- at: 9

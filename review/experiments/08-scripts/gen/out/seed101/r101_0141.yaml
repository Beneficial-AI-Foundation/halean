description: random scenario seed=101 index=141
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - stop: bad
      error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 2
  call: turn_off
  data:
    entity_id: all
- at: 3
  result: 1
  ok: false
  error_kind: invalid
- at: 5
  result: 0
  ok: false
  error_kind: other
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
    variables:
      v: 1
- at: 7
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 10
  call: s1
  return_response: true
- at: 13
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
          - script.s1
      alias: Reloaded s0
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
        response_variable: r
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - stop: bad
        error: true
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 17
  result: 3
  response:
    n: 3
- at: 18
  call: turn_off
  data:
    entity_id: script.s1
- at: 20
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
          - script.s1
      alias: Reloaded s0
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
        response_variable: r
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - stop: bad
        error: true
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
      alias: Reloaded s2

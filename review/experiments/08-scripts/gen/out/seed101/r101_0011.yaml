description: random scenario seed=101 index=11
scripts:
  s0:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
    - stop: bad
      error: true
  s1:
    alias: Script 1 A
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - parallel:
      - sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
        - action: script.turn_on
          target:
            entity_id:
            - script.s4
      - sequence:
        - parallel:
          - sequence:
            - action: test.m
              data:
                id: s1.4
                v: '{{ v | default(0) }}'
            - event: mark
              event_data:
                id: s1.5
                v: '{{ v | default(0) }}'
          - sequence:
            - action: script.turn_off
              target:
                entity_id: script.s3
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
    - action: script.turn_off
      target:
        entity_id: script.s4
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - event: mark
          event_data:
            id: s2.6
            v: '{{ v | default(0) }}'
  s3:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s4:
    alias: Script 4 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s4.8
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s2
  return_response: true
- at: 3
  result: 0
  response:
    n: 0
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  reload:
    s0:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - event: mark
        event_data:
          id: s0.2
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s3'') }}'
          cur: '{{ state_attr(''script.s3'', ''current'') }}'
      - action: test.m
        data:
          id: s0.3
          v: '{{ v | default(0) }}'
      - stop: bad
        error: true
    s1:
      alias: Script 1 A

description: random scenario seed=101 index=11
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s1:
    alias: Script 1 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - stop: bad
      error: true
  s2:
    alias: Script 2 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s4:
    alias: Script 4 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s4.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s4.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
steps:
- at: 2
  call: s3
  data:
    v: 3
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 6
  result: 0
  response:
    n: 0
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 8
  call: s0
  data:
    v: 0
- at: 9
  call: s3
- at: 9
  call: s3
  data:
    v: 1

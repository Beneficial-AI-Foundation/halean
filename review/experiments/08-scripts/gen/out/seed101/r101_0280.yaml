description: random scenario seed=101 index=280
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.s2
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
          else:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
          - action: script.turn_on
            target:
              entity_id:
              - script.s1
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - delay: 3
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 1
  call: s0
  return_response: true
- at: 2
  call: s0
  data:
    v: 3
- at: 2
- at: 4
  reload:
    s0:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - if:
            - condition: template
              value_template: '{{ v | default(0) is even }}'
            then:
            - action: script.s2
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
            else:
            - action: script.s1
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
            - action: script.turn_on
              target:
                entity_id:
                - script.s1
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s2'') }}'
          cur: '{{ state_attr(''script.s2'', ''current'') }}'
      - delay: 3
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 9
  result: 1
  response:
    n: 1
- at: 10
  call: s0
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 2
- at: 13
  call: s1
  data:
    v: 4
- at: 14
  result: 0
  response:
    n: 0
- at: 16
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 17
  result: 2
  response:
    n: 2
- at: 18
  call: s1
  data:
    v: 2
- at: 19
  call: s1
- at: 20
  call: s0

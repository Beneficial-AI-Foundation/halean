description: random scenario seed=101 index=223
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s4
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s3:
    alias: Script 3 B
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s4:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - variables:
        out:
          id: s4.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 2
  call: s3
  return_response: true
- at: 2
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  call: s0
  return_response: true
- at: 7
  result: 1
  response:
    n: 1
- at: 8
  call: s0
  data:
    v: 2
  return_response: true
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 9
  result: 2
  response:
    n: 2
- at: 12
  result: 3
  response:
    n: 3
- at: 14
  call: turn_off
  data:
    entity_id: script.s3
- at: 14
  call: s4
  data:
    v: 3
  return_response: true
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 15
  result: 4
  response:
    n: 4
- at: 16
  result: 5
  response:
    n: 5
- at: 17
  call: s3
  data:
    v: 1

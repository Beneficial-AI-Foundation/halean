description: random scenario seed=101 index=184
scripts:
  s0:
    alias: Script 0 A
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - variables:
        out:
          id: s0.1

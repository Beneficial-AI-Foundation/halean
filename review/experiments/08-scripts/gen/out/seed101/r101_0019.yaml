description: random scenario seed=101 index=19
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - delay: 1
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.toggle
      target:
        entity_id: script.s2
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    alias: Script 2 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 2
  call: s2
  data:
    v: 0
  return_response: true
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 5
  call: turn_off
  data:
    entity_id: script.s0
- at: 5
  call: s0
  data:
    v: 4
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 11
  call: turn_off
  data:
    entity_id: script.s0
- at: 11
- at: 13
- at: 14
  call: s0
  data:
    v: 1
  return_response: true
- at: 15
  call: s1

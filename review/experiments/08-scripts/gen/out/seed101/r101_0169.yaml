description: random scenario seed=101 index=169
scripts:
  s0:
    alias: Script 0 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s3
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
    - action: script.turn_off
      target:
        entity_id: script.s4
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
  s4:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s4
    - delay: 1
steps:
- at: 1
  call: s0
- at: 2
  call: s1
  data:
    v: 1
  return_response: true
- at: 5
  result: 0
  response:
    n: 0
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 9
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 10
  call: s1
  data:
    v: 4
- at: 11
  result: 1
  ok: false
  error_kind: invalid
- at: 12
  call: s1
  data:
    v: 4
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 17
- at: 17
  call: turn_off
  data:
    entity_id: all
- at: 19
  call: s3
  data:
    v: 3
- at: 20
  call: s4
  return_response: true
- at: 21
  result: 3
  ok: false
  error_kind: invalid
- at: 22
  result: 2
  response:
    n: 2

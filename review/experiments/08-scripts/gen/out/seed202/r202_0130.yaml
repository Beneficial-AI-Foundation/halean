description: random scenario seed=202 index=130
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s1
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 1
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s2
  data:
    v: 0
  return_response: true
- at: 2
  call: s1
  return_response: true
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 3
  call: s0
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 7
  call: s0
  data:
    v: 0
- at: 9
  call: s0
  data:
    v: 4
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 0
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 11
  call: turn_off
  data:
    entity_id: all
- at: 13
  call: s1
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
    variables:
      v: 4
- at: 17
  call: s1
  data:
    v: 3
  return_response: true
- at: 20
  result: 1
  ok: false
  error_kind: other

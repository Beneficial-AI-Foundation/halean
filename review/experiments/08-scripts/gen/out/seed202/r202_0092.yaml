description: random scenario seed=202 index=92
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 3
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s4:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
steps:
- at: 1
- at: 1
  call: s0
  return_response: true
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  call: s3
  data:
    v: 1
  return_response: true
- at: 8
  call: s4
  data:
    v: 1
  return_response: true
- at: 9
  call: s1
  data:
    v: 1
  return_response: true
- at: 10
  result: 0
  response:
    n: 0
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
    variables:
      v: 1
- at: 12
  call: s3
- at: 15
  call: s1
- at: 15
  result: 2
  response:
    n: 2
- at: 16
  call: s4
- at: 17
  result: 3
  response:
    n: 3
- at: 17
  call: s0
  data:
    v: 1
- at: 18
  call: turn_on
  data:
    entity_id:
    - script.s3
    variables:
      v: 1

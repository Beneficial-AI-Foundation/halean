      response_variable: r
      continue_on_error: true
    - delay: 3
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true

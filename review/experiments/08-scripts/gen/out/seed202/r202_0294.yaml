      - sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - event: mark
            event_data:
              id: s1.3
              v: '{{ v | default(0) }}'
              st: '{{ states(''script.s1'') }}'
              cur: '{{ state_attr(''script.s1'', ''current'') }}'
          - event: mark
            event_data:
              id: s1.4
              v: '{{ v | default(0) }}'
      - sequence:
        - delay: 3
        - action: test.m
          data:
            id: s1.5
            v: '{{ v | default(0) }}'

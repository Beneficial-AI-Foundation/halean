description: random scenario seed=202 index=142
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - delay: 1
  s2:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - parallel:
      - sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
        - event: mark
          event_data:
            id: s2.3
            v: '{{ v | default(0) }}'
      - sequence:
        - action: script.s4
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s4:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - delay: 1
    - action: script.turn_off
      target:
        entity_id: script.s3
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 4
  call: s4
  data:
    v: 2
- at: 5
  call: s2
- at: 6
- at: 7
  call: s0
  data:
    v: 0
  return_response: true
- at: 9
  call: turn_off
  data:
    entity_id: script.s3
- at: 9
  call: s4
- at: 10
  call: s0
  data:
    v: 1
  return_response: true

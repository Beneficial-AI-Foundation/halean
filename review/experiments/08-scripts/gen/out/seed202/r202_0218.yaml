description: random scenario seed=202 index=218
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - repeat:
        count: 2
        sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - delay: 1
          - action: script.s0
            data:
              v: '{{ v | default(0) + 1 }}'
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s2:
    alias: Script 2 A
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.toggle
          target:
            entity_id: script.s4
        - event: mark
          event_data:
            id: s3.5
            v: '{{ v | default(0) }}'
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s4.6
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s4.7
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s2'') }}'
            cur: '{{ state_attr(''script.s2'', ''current'') }}'
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s4
    variables:
      v: 2
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: turn_off
  data:
    entity_id: script.s1
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 7
  result: 1
  response:
    n: 1
- at: 8
  call: s3
  data:
    v: 4
  return_response: true
- at: 10
  call: s3
  return_response: true
- at: 11
  call: s2
  data:
    v: 0
  return_response: true
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s4
    - script.s0
    variables:
      v: 1
- at: 16
  call: s4
  data:
    v: 3
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 18
  result: 2
  response:
    n: 2
- at: 18
- at: 20
- at: 20
  result: 3
  response:
    n: 3

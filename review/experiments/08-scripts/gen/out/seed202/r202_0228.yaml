description: random scenario seed=202 index=228
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s1.1
            v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s3:
    alias: Script 3 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
      - sequence:
        - delay: 3
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 3

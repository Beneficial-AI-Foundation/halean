description: random scenario seed=202 index=205
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 1
  call: s2
  return_response: true
- at: 2
  result: 0
  response:
    n: 0
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 5
  call: s1
- at: 6
  call: s0
  data:
    v: 2
- at: 7
  call: s1
  return_response: true
- at: 8
  call: s0
  data:
    v: 2
- at: 9
  call: turn_off
  data:
    entity_id: script.s0
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s0

description: random scenario seed=202 index=153
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: script.turn_off
        target:
          entity_id: script.s2
      else:
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s2.6
          v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.7
        v: '{{ v | default(0) }}'
steps:
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 4
  reload:
    s0:
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
      - variables:
          out:
            id: s1.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - event: mark
        event_data:
          id: s1.4
          v: '{{ v | default(0) }}'
    s2:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 5
  call: s2
- at: 5
  call: turn_off
  data:
    entity_id: all
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 1
- at: 12
  call: s2
  data:
    v: 1
- at: 13
  call: s2
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 15
  call: s0
  data:
    v: 4
- at: 18
  call: s2
  data:
    v: 3

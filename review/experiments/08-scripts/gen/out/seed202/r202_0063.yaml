description: random scenario seed=202 index=63
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s4:
    alias: Script 4 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0

description: random scenario seed=202 index=272
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.toggle
      target:
        entity_id: script.s3
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s3:
    alias: Script 3 B
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - stop: bad
      error: true
  s4:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s4.4
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - variables:
          out:
            id: s4.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      else:
      - event: mark
        event_data:
          id: s4.6
          v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s3
  return_response: true
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 2
  result: 0
  ok: false
  error_kind: invalid
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 5
- at: 5
  result: 1
  ok: false
  error_kind: invalid
- at: 5
  call: s1
  data:
    v: 2
  return_response: true
- at: 7
  call: s2
  data:
    v: 2
  return_response: true
- at: 8
  call: s4
- at: 8
  result: 3
  response:
    n: 3
- at: 11
  result: 2
  response:
    n: 2
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s4
- at: 14
  result: 5
  response:
    n: 5
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 17
  result: 4
  response:
    n: 4
- at: 19
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s4

description: random scenario seed=202 index=158
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s0.2
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s0'') }}'
            cur: '{{ state_attr(''script.s0'', ''current'') }}'
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
        - stop: bad
          error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
    - delay: 3
steps:
- at: 1
  call: s3
  data:
    v: 4
  return_response: true
- at: 2
  call: turn_off
  data:
    entity_id: all
- at: 3
  call: s4
- at: 4
  call: s2
  data:
    v: 3
  return_response: true
- at: 7
  call: s4
  data:
    v: 1
  return_response: true
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 9
  call: s2
  return_response: true
- at: 10
- at: 11
  call: s2

description: random scenario seed=202 index=46
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - delay: 1
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s1.2
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
  s2:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s4:
    alias: Script 4 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - event: mark
      event_data:
        id: s4.4
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s3

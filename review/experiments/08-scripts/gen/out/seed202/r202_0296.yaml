description: random scenario seed=202 index=296
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s0.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
        response_variable: r
      else:
      - action: script.turn_off
        target:
          entity_id: script.s3
    - delay: 3
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - parallel:
      - sequence:
        - parallel:
          - sequence:
            - action: test.m
              data:
                id: s1.3
                v: '{{ v | default(0) }}'
            - variables:
                out:
                  id: s1.4
                  v: '{{ v | default(0) }}'
            - stop: done
              response_variable: out
          - sequence:
            - event: mark
              event_data:
                id: s1.5
                v: '{{ v | default(0) }}'
                this: '{{ this.state }}/{{ this.attributes.current }}'
      - sequence:
        - action: test.m
          data:
            id: s1.6
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s1.7
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
    - action: test.m
      data:
        id: s1.8
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.9
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.10
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.turn_off
      target:
        entity_id: script.s3
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 4
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 5
  call: s2
  return_response: true
- at: 8
  call: s1
- at: 10
  call: s0
  data:
    v: 1
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 11
  result: 1
  response:
    n: 1
- at: 12
  call: s0
  data:
    v: 0

description: random scenario seed=202 index=53
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - delay: 1
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 1
  call: s1
  return_response: true
- at: 1
  result: 0
  response:
    n: 0
- at: 2
- at: 3
  call: s3
  data:
    v: 2
  return_response: true
- at: 5
  call: s2
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 3
- at: 10
  call: turn_off
  data:
    entity_id: script.s3
- at: 10
  result: 2
  response:
    n: 2
- at: 10
  call: s3

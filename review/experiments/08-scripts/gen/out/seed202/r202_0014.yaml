description: random scenario seed=202 index=14
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    alias: Script 1 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s4:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - stop: bad
      error: true
    - event: mark
      event_data:
        id: s4.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 4
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: s2
  return_response: true
- at: 8
  result: 1
  response:
    n: 1
- at: 8
  result: 0
  response:
    n: 0
- at: 10
  call: s4
  data:
    v: 1
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id: all
- at: 12
  call: s2
  data:
    v: 0
- at: 12
  call: s2
  data:
    v: 0
- at: 15
  call: turn_off
  data:
    entity_id: all
- at: 17
  result: 2
  response:
    n: 2
- at: 20
  call: turn_on
  data:
    entity_id:
    - script.s4
    variables:
      v: 0
- at: 21
  call: s3
  return_response: true

description: random scenario seed=202 index=106
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s1.1
            v: '{{ v | default(0) }}'
          response_variable: r
          continue_on_error: true
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 2
- at: 4
  call: s2
  return_response: true
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 3
- at: 7
  call: s0
  data:
    v: 4
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 10
  call: s2
  return_response: true
- at: 11
- at: 12
  reload:

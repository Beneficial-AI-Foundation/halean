description: random scenario seed=202 index=146
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - stop: bad
      error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 1
  call: s1
  return_response: true
- at: 4
  call: s2
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 6
  call: s0
- at: 7
  call: s1
  data:
    v: 2
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 9
  call: s1
  data:
    v: 3
  return_response: true
- at: 10
  call: s1
  return_response: true
- at: 11
  call: s0
  data:
    v: 1
  return_response: true
- at: 12
  call: s2
  data:
    v: 1
  return_response: true
- at: 13
  call: s1
  data:
    v: 1
  return_response: true
- at: 16
  call: turn_off
  data:
    entity_id: all
- at: 19
  call: s2
- at: 22
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 25
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0

description: random scenario seed=202 index=188
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - repeat:
        count: 2
        sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s1.3
            v: '{{ v | default(0) }}'
          continue_on_error: true
      - sequence:
        - event: mark
          event_data:
            id: s1.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s3'') }}'
            cur: '{{ state_attr(''script.s3'', ''current'') }}'
        - action: test.m
          data:
            id: s1.5
            v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.6
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s2.8
          v: '{{ v | default(0) }}'
      else:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
  s3:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
steps:
- at: 2
  call: s2
  return_response: true
- at: 3
  result: 0
  response:
    n: 0
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 7
- at: 8
  result: 2
  response:
    n: 2
- at: 8
  call: s3
  data:
    v: 4
  return_response: true
- at: 11
  call: s3
- at: 11
  call: turn_off
  data:
    entity_id: script.s2
- at: 13
- at: 14
  call: s3
  return_response: true
- at: 15
  result: 1
  response:
    n: 1
- at: 18
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 20
  call: s1
  data:
    v: 0

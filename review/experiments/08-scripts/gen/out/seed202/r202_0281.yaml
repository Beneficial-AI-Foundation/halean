  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s2.3
            v: '{{ v | default(0) }}'
        - delay: 2
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - delay: 1

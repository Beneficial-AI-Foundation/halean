description: random scenario seed=202 index=225
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 1
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 4
  call: s2
  data:
    v: 1
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 6
  result: 1
  response:
    n: 1
- at: 7
  result: 0
  response:
    n: 0
- at: 10
  call: s1
  data:
    v: 0
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 2
- at: 13
  result: 2
  response:
    n: 2
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 15
  call: s3
- at: 15
- at: 18
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 2
- at: 19
  call: s0
  data:
    v: 0
- at: 20
  result: 3
  ok: false
  error_kind: other
- at: 21
  call: s2
- at: 24
  call: s3
  data:
    v: 0
  return_response: true

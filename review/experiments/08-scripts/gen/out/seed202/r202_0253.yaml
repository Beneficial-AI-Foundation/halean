description: random scenario seed=202 index=253
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - delay: 1
steps:
- at: 1
  call: s1
  data:
    v: 0
  return_response: true
- at: 4
  call: s0
- at: 5
  call: s1
  data:
    v: 0
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 7
  call: s0
- at: 9
  result: 1
  response:
    n: 1
- at: 11
- at: 11
  call: s1
- at: 14
  call: turn_off
  data:
    entity_id: script.s2
- at: 15
  call: turn_off
  data:
    entity_id: script.s0
- at: 16
  result: 0
  response:
    n: 0

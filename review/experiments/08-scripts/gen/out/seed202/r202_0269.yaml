    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - stop: bad
      error: true
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - event: mark
      event_data:
        id: s4.8
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'

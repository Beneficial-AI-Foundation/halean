description: random scenario seed=202 index=269
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
    - action: test.m

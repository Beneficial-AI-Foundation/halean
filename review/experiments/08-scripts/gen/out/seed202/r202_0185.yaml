        id: s2.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - delay: 2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'

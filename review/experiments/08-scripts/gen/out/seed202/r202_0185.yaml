description: random scenario seed=202 index=185
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0

description: random scenario seed=202 index=168
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s1.2
            v: '{{ v | default(0) }}'
        - variables:
            out:
              id: s1.3
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
steps:
- at: 1
  call: s0
  return_response: true
- at: 1
- at: 2
  call: s1
  data:
    v: 3
  return_response: true
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
    variables:
      v: 4
- at: 5
  call: turn_off
  data:
    entity_id: script.s4
- at: 7
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s4
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s4
    variables:
      v: 0
- at: 11
  result: 0
  response:
    n: 0
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 15
  call: s4
  return_response: true

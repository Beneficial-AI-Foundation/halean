description: random scenario seed=202 index=38
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - delay: 1
    - event: mark
      event_data:
        id: s2.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - stop: bad
      error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 1
  call: turn_off
  data:
    entity_id: script.s1
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
    variables:
      v: 4
- at: 4
  reload:
    s0:
      icon: mdi:script
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    s2:
      alias: Script 2 A
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s2.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - event: mark
        event_data:
          id: s2.6
          v: '{{ v | default(0) }}'
      - delay: 1
      - event: mark
        event_data:
          id: s2.7
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
    s3:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s3.9
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s3.10
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s3'') }}'
          cur: '{{ state_attr(''script.s3'', ''current'') }}'
      - action: script.turn_off
        target:
          entity_id: script.s1
- at: 4
  call: s1
  data:
    v: 3
  return_response: true
- at: 5
  call: s1
- at: 6
  result: 0
  response:
    n: 0
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 9
  call: s2
  data:
    v: 1
  return_response: true
- at: 12
  call: s3
  return_response: true

description: random scenario seed=202 index=170
scripts:
  s0:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:

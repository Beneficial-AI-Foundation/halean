        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.9
        v: '{{ v | default(0) }}'

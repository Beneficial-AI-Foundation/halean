description: random scenario seed=202 index=102
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    alias: Script 1 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s2:
    alias: Script 2 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s2.5
            v: '{{ v | default(0) }}'
          response_variable: r
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s3.8
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 3
  call: s2
- at: 6
  call: s0
- at: 6
  call: s2
- at: 8
- at: 9
  result: 1
  response:
    n: 1
- at: 11
  result: 0
  response:
    n: 0
- at: 12
  result: 2
  ok: false
  error_kind: invalid
- at: 15
  call: turn_off
  data:
    entity_id: all

description: random scenario seed=202 index=160
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
  s1:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
  s3:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
  s4:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s4
steps:
- at: 3
  call: s1
  return_response: true
- at: 4
  call: s2
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s4
    - script.s3
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: s2
  data:
    v: 4
- at: 10
  call: s2
  return_response: true
- at: 10
  call: s2
  data:
    v: 4
  return_response: true
- at: 11
  call: s1
  data:
    v: 2
  return_response: true
- at: 14
  call: s3
  data:
    v: 2
- at: 16
  result: 1
  response:
    n: 1
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
    variables:
      v: 0
- at: 17
  result: 2
  response:
    n: 2
- at: 20
  call: s2
- at: 21
  call: turn_off
  data:
    entity_id:
    - script.s4
    - script.s0
- at: 22
  call: s0
  data:
    v: 0
- at: 24
  call: s2
  data:
    v: 2

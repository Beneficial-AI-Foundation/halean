description: random scenario seed=202 index=67
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.4
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - delay: 2
    - event: mark
      event_data:
        id: s1.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.8
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 3
  reload:
    s0:
      alias: Script 0 B
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s0.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
        response_variable: r
      - event: mark
        event_data:
          id: s0.3
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s0.4
          v: '{{ v | default(0) }}'
    s1:
      alias: Script 1 B
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s1.5
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s1.6
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - delay: 2
      - event: mark
        event_data:
          id: s1.7
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.turn_off
          target:
            entity_id: script.s1
        - action: test.m
          data:
            id: s2.9
            v: '{{ v | default(0) }}'
        else:
        - action: test.m
          data:
            id: s2.10
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s2.11
            v: '{{ v | default(0) }}'
      - delay: 1
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 5
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 6
  result: 0
  response:
    n: 0
- at: 7
  call: s0
- at: 8
  call: s1
- at: 9
  call: s0
  data:
    v: 1
- at: 12
  call: s0
  data:
    v: 3
- at: 14
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 2

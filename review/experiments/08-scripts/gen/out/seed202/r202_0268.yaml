description: random scenario seed=202 index=268
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - event: mark

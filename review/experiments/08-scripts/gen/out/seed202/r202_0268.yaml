    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
      - sequence:
        - delay: 3
    - delay: 2
    - delay: 1

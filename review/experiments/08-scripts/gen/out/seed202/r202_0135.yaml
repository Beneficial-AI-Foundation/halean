description: random scenario seed=202 index=135
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s3.7
          v: '{{ v | default(0) }}'
      else:
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: script.turn_off
        target:
          entity_id: script.s2
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s4.8
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 3
  call: s4
  data:
    v: 3
- at: 4
  call: s4
  return_response: true
- at: 6
- at: 9
  call: s4
  data:
    v: 4
  return_response: true
- at: 12
  call: s0
  data:
    v: 0
- at: 15
  result: 0
  response:
    n: 0
- at: 15
  call: s2
  data:
    v: 2
- at: 17
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 19
  result: 1
  response:
    n: 1
- at: 20
  call: turn_on
  data:
    entity_id:
    - script.s3
    variables:
      v: 0
- at: 22
  call: s4
  data:
    v: 2
- at: 23
- at: 24
  call: toggle
  data:
    entity_id:
    - script.s4
    - script.s3
- at: 24
- at: 24
  call: s3
  return_response: true

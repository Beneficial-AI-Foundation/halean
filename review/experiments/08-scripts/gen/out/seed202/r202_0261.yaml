description: random scenario seed=202 index=261
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 2
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - delay: 2
    - action: script.turn_off
      target:
        entity_id: script.s4
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s3.3
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s0'') }}'
          cur: '{{ state_attr(''script.s0'', ''current'') }}'
      else:
      - action: test.m
        data:
          id: s3.4
          v: '{{ v | default(0) }}'
      - stop: bad
        error: true
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.turn_off
      target:
        entity_id: script.s4
steps:
- at: 3
  call: s2
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: s4
- at: 5
  call: s4
  return_response: true
- at: 7
  call: s3
  data:
    v: 1
  return_response: true
- at: 8
  result: 1
  response:
    n: 1
- at: 9
  call: s3
  data:
    v: 1
- at: 10
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s4
- at: 10
  result: 2
  response:
    n: 2
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s4

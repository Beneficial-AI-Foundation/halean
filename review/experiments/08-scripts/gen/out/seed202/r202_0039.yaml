description: random scenario seed=202 index=39
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 1
      else:
      - delay: 1
      - delay: 2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    alias: Script 3 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - stop: bad
      error: true
    - variables:
        out:
          id: s3.7
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 2
  call: s0
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 6
  result: 0
  response:
    n: 0
- at: 6
  call: s2
  data:
    v: 2
  return_response: true
- at: 7
  call: s0
  return_response: true
- at: 7
- at: 10
  call: s3
  data:
    v: 1
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 14
  call: s0
  data:
    v: 0
  return_response: true
- at: 15
  result: 1
  ok: false
  error_kind: ha_error
- at: 18
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 19
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 21
  call: turn_off
  data:
    entity_id: script.s0
- at: 24
  call: s0
  data:
    v: 4
  return_response: true
- at: 27
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1

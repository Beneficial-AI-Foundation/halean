description: random scenario seed=202 index=71
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.toggle
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s1
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 1
- at: 3
  result: 0
  ok: false
  error_kind: other
- at: 5
  call: s0
  data:
    v: 4
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 1
- at: 7
  call: s2
  data:
    v: 0
- at: 7
  call: s2
- at: 9
  call: s1
  data:
    v: 3
- at: 12
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - repeat:
          count: 2
          sequence:
          - event: mark
            event_data:
              id: s0.5
              v: '{{ v | default(0) }}'
              r: '{{ r | default(''undef'') }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.toggle
        target:
          entity_id: script.s2
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
    s2:
      alias: Script 2 B
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - action: test.m
        data:
          id: s2.4
          v: '{{ v | default(0) }}'
- at: 13
- at: 14
  call: s1
  data:
    v: 2
- at: 15
  result: 2
  response:
    n: 2
- at: 16
  result: 1
  response:
    n: 1
- at: 17
  result: 4
  response:
    n: 4
- at: 20
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 21
  call: turn_on
  data:
    entity_id:
    - script.s0

description: random scenario seed=202 index=48
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - delay: 1
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.toggle
      target:
        entity_id: script.s4
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s2.5
            v: '{{ v | default(0) }}'
          continue_on_error: true
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - parallel:
          - sequence:
            - action: test.m
              data:
                id: s3.6
                v: '{{ v | default(0) }}'
              continue_on_error: true
          - sequence:
            - action: script.s1
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
            - action: script.turn_off
              target:
                entity_id: script.s2
    - event: mark
      event_data:
        id: s3.7
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.8
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - parallel:
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s4
      - sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.s4
            data:
              v: '{{ v | default(0) + 1 }}'
          else:
          - delay: 1
        - action: script.turn_off
          target:
            entity_id: script.s3
steps:
- at: 1
  call: s1
  data:
    v: 0
  return_response: true
- at: 3
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s3
    variables:
      v: 2
- at: 7
  call: turn_off
  data:
    entity_id: script.s1
- at: 8
  result: 0
  response:
    n: 0
- at: 9
  result: 1
  response:
    n: 1
- at: 10
  call: s4
  data:
    v: 3
  return_response: true
- at: 11
  call: s2
  data:
    v: 1
- at: 12
  call: s1
  return_response: true
- at: 13

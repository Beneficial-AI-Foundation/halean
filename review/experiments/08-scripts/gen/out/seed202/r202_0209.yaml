description: random scenario seed=202 index=209
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - stop: bad
      error: true
  s3:
    alias: Script 3 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s3.4
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s1'') }}'
            cur: '{{ state_attr(''script.s1'', ''current'') }}'
        - parallel:
          - sequence:
            - event: mark
              event_data:
                id: s3.5
                v: '{{ v | default(0) }}'
          - sequence:
            - delay: 3
            - delay: 1
  s4:
    alias: Script 4 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - variables:
        out:
          id: s4.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 5
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s4
- at: 9
  call: s3
  data:
    v: 3
- at: 12
  result: 0
  response:
    n: 0
- at: 13
  call: s1
  data:
    v: 0
- at: 13
  result: 1
  response:
    n: 1
- at: 14
  result: 2
  response:
    n: 2
- at: 15
- at: 16
  call: s0
- at: 17
- at: 19
  call: s3
  return_response: true
- at: 20
  call: s0
  data:
    v: 0
- at: 20
  call: s1

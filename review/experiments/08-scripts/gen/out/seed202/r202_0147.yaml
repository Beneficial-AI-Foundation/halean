description: random scenario seed=202 index=147
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    alias: Script 2 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    alias: Script 3 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s4:
    alias: Script 4 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s4
steps:
- at: 1
  call: s2
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s4
- at: 8
  result: 2
  response:
    n: 2
- at: 8
  result: 1
  response:
    n: 1
- at: 8
- at: 8
- at: 9
  result: 3
  response:
    n: 3
- at: 12
  call: s2
  data:
    v: 0
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 14
  call: s0
  return_response: true
- at: 16
  call: s0
- at: 17
  call: s1
  data:
    v: 3
- at: 19
  result: 4
  response:
    n: 4

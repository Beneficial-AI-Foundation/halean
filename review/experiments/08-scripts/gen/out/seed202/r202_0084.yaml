description: random scenario seed=202 index=84
scripts:
  s0:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
  s1:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 2
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 6
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 6
  call: s3
  data:
    v: 0
  return_response: true
- at: 7
  call: s0
  return_response: true
- at: 8
  call: s0
  data:
    v: 0
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
    variables:
      v: 2
- at: 10
  call: s0
  data:
    v: 1

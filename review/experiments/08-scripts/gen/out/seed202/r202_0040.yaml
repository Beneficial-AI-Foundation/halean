description: random scenario seed=202 index=40
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - delay: 2
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 2
  call: s2
  data:
    v: 1
  return_response: true
- at: 3
- at: 4
- at: 4
  call: s3
  return_response: true
- at: 5
  call: s2
  data:
    v: 3
- at: 7
  call: s3
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 10
  call: s2
- at: 12
  call: s1
  data:
    v: 0
  return_response: true
- at: 12
  call: s1
- at: 13

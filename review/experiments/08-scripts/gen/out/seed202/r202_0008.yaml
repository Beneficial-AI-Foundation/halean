description: random scenario seed=202 index=8
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s2
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    alias: Script 3 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s0
      - delay: 1
      else:
      - action: test.m
        data:
          id: s3.7
          v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s3.8
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s2
  data:
    v: 0
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  result: 1
  response:
    n: 1
- at: 6
  result: 2
  response:
    n: 2
- at: 7
  call: turn_off
  data:
    entity_id: script.s2
- at: 10
  call: s3
  data:
    v: 3
  return_response: true
- at: 10
  reload:
    s0:
      icon: mdi:script
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.toggle
        target:
          entity_id: script.s2
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
          - script.s1
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - stop: bad
        error: true
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      mode: queued
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
      - action: script.toggle
        target:
          entity_id: script.s2
      - event: mark
        event_data:
          id: s1.3
          v: '{{ v | default(0) }}'
    s2:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.9
    s3:
      alias: Script 3 A
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.turn_off
          target:
            entity_id: script.s0
        - delay: 1
        else:
        - action: test.m
          data:
            id: s3.7
            v: '{{ v | default(0) }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s3.8
          v: '{{ v | default(0) }}'
- at: 13
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0

description: random scenario seed=202 index=25
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 1
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        response_variable: r
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - variables:
            out:
              id: s2.7
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
  s3:
    alias: Script 3 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.8
        v: '{{ v | default(0) }}'
steps:
- at: 1
- at: 1
  call: s2
  data:
    v: 0
  return_response: true
- at: 1
  call: s3
- at: 2
  result: 0
  response:
    n: 0
- at: 3
  call: turn_off
  data:
    entity_id: script.s1
- at: 4
  call: s3
- at: 5
  call: s2
  data:
    v: 4
- at: 6
- at: 8
  call: s3
- at: 9
  result: 1
  response:
    n: 1
- at: 9
- at: 10
  call: s0
- at: 11
  call: s0

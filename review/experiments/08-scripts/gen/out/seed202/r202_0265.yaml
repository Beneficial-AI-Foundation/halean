description: random scenario seed=202 index=265
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - stop: bad
      error: true
    - action: script.turn_off
      target:
        entity_id: script.s1
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s1.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 0
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 6
  call: s1
  data:
    v: 0
- at: 7
  call: s1
  data:
    v: 1
- at: 10
  result: 1
  response:
    n: 1
- at: 11
  result: 0
  response:
    n: 0
- at: 12
  call: s0

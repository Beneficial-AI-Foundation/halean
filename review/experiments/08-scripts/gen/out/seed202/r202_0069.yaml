description: random scenario seed=202 index=69
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.toggle
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 A
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
      else:
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s2'') }}'
          cur: '{{ state_attr(''script.s2'', ''current'') }}'
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
        - variables:
            out:
              id: s2.6
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 2
  call: turn_off
  data:
    entity_id: script.s0
- at: 5
  result: 0
  ok: false
  error_kind: other
- at: 6
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 3
- at: 10
  call: s2
- at: 11

description: random scenario seed=202 index=287
scripts:
  s0:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s2.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 3
  call: turn_off
  data:
    entity_id: all
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 7
- at: 10
  result: 0
  response:
    n: 0
- at: 10
  call: s2
  data:
    v: 0
  return_response: true
- at: 12
  call: s1
  data:
    v: 1
  return_response: true
- at: 12
  call: s0
  return_response: true
- at: 13
  call: s2
  return_response: true
- at: 16
  call: s0
  return_response: true

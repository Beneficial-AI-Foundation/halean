        id: s3.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s4.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'
      continue_on_error: true

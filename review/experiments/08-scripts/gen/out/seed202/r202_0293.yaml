description: random scenario seed=202 index=293
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 3
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m

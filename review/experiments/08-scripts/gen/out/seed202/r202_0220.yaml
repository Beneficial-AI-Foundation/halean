description: random scenario seed=202 index=220
scripts:
  s0:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
    - stop: bad
      error: true
    - delay: 2
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s0
- at: 4
  call: s1
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 8
  call: s1
  data:
    v: 1
- at: 11
  call: s0
- at: 12
  call: s2
  return_response: true
- at: 13
  call: s0
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 16
  call: s2
  data:
    v: 4
- at: 17
  call: s1
  data:
    v: 4
- at: 18
  call: s0
  data:
    v: 0

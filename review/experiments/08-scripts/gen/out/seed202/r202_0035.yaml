description: random scenario seed=202 index=35
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.toggle
      target:
        entity_id: script.s3
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s1
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
  s4:
    alias: Script 4 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s4.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - variables:
        out:
          id: s4.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s4.7
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s4.8
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'

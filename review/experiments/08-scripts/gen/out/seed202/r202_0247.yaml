description: random scenario seed=202 index=247
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s3:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: turn_off
  data:
    entity_id: script.s2
- at: 2
- at: 3
  call: s2
  data:
    v: 0
  return_response: true
- at: 4
  result: 0
  response:
    n: 0
- at: 4
  call: s3
  data:
    v: 0
  return_response: true
- at: 5
  call: s4
  data:
    v: 0
- at: 6
  call: s2
- at: 6
  result: 1
  response:
    n: 1

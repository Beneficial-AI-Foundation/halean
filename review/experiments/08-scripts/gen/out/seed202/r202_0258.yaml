description: random scenario seed=202 index=258
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s2.1
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - repeat:
            count: 2
            sequence:
            - event: mark
              event_data:
                id: s3.2
            - action: script.s3
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
      - sequence:
        - action: test.m
          data:
            id: s3.3
            v: '{{ v | default(0) }}'
          response_variable: r
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
steps:
- at: 1
  call: s0
- at: 3
  call: s2
  return_response: true
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: s3
  data:
    v: 1
- at: 6
  result: 1
  response:
    n: 1
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 8
  call: s3
- at: 9
  result: 3
  response:
    n: 3
- at: 10
  result: 2
  response:
    n: 2
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 12
  call: s3
  data:
    v: 4
  return_response: true
- at: 12
  call: s0
- at: 14
  call: s2
  data:
    v: 1
- at: 16
  call: s2
  data:
    v: 3
- at: 17
  result: 4
  response:
    n: 4

description: random scenario seed=202 index=264
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
      - sequence:
        - parallel:
          - sequence:
            - action: script.s2
              data:
                v: '{{ v | default(0) + 1 }}'
          - sequence:
            - action: test.m
              data:
                id: s0.3
                v: '{{ v | default(0) }}'
              response_variable: r
            - action: test.m
              data:
                id: s0.4
                v: '{{ v | default(0) }}'
              response_variable: r
        - repeat:
            count: 2
            sequence:
            - action: script.s2
              data:
                v: '{{ v | default(0) + 1 }}'
              continue_on_error: true
            - action: script.turn_off
              target:
                entity_id: script.s0
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s3
    - variables:
        out:
          id: s3.8
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s3
  return_response: true
- at: 3
  call: s3
  data:
    v: 3
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 4
  call: s3
- at: 4
  call: turn_off
  data:
    entity_id: script.s1
- at: 5
  call: s2
  data:
    v: 0
- at: 6
  call: s3
- at: 7
  call: s0
  return_response: true
- at: 8
- at: 9
  call: s1
  data:
    v: 4
  return_response: true
- at: 12
  call: turn_off
  data:
    entity_id: all

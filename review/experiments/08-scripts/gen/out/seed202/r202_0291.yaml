description: random scenario seed=202 index=291
scripts:
  s0:
    alias: Script 0 A
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 1
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  call: s0
  data:
    v: 0
- at: 2
  call: s2
  data:
    v: 3
  return_response: true
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 5
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 7
  call: s3
- at: 10
  call: s0
  return_response: true
- at: 10
  result: 0
  response:
    n: 0
- at: 11
  result: 1
  response:
    n: 1
- at: 14
  result: 3
  response:
    n: 3
- at: 15
  call: s2
  return_response: true

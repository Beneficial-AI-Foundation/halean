description: random scenario seed=202 index=189
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
          response_variable: r
          continue_on_error: true
    - parallel:
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
        - action: test.m
          data:
            id: s0.3
            v: '{{ v | default(0) }}'
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s3
  s1:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - delay: 1
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
  s3:
    alias: Script 3 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s4:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s4.7
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s4.8
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'

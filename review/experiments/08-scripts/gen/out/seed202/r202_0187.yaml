description: random scenario seed=202 index=187
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.turn_off
          target:
            entity_id: script.s2
        else:
        - delay: 2
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
  s4:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
steps:
- at: 3
  call: turn_off
  data:
    entity_id: all
- at: 4
  call: s2
- at: 5
  call: s3
  data:
    v: 2
- at: 6
  call: turn_off
  data:
    entity_id: script.s1
- at: 8
  call: s0
  return_response: true
- at: 11
  call: s4
  data:
    v: 4
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 13
  call: s2
  data:
    v: 0
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s4
    - script.s2
    variables:
      v: 1

description: random scenario seed=202 index=42
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s2:
    alias: Script 2 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 1

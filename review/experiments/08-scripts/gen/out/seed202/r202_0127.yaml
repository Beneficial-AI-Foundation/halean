description: random scenario seed=202 index=127
scripts:
  s0:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 1
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s1:
    alias: Script 1 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
      - sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 1
  call: s1
  data:
    v: 4
  return_response: true
- at: 2
  result: 0
  ok: false
  error_kind: ha_error
- at: 3
  call: s2
  data:
    v: 3
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 5
  call: turn_off
  data:
    entity_id: all
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  call: s1
  data:
    v: 2
- at: 7
  result: 2
  response:
    n: 2
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1

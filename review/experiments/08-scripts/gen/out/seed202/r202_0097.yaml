        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.6
          v: '{{ v | default(0) }}'
    - stop: done

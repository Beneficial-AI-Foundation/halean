description: random scenario seed=202 index=15
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 1
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      else:
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s0
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s1
    - stop: bad
      error: true
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 2
  call: s1
- at: 3
  result: 0
  ok: false
  error_kind: ha_error
- at: 5
  call: s0
  data:
    v: 0
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 3
- at: 6
  result: 1
  response:
    n: 1
- at: 8
  result: 2
  response:
    n: 2
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
    variables:
      v: 2
- at: 12
  call: s2
  data:
    v: 0
- at: 13
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - delay: 1
        - action: script.turn_on
          target:
            entity_id:
            - script.s1
            - script.s2
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        else:
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
      - action: script.toggle
        target:
          entity_id: script.s2
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.turn_off
        target:
          entity_id: script.s0
    s2:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
      - action: script.turn_off
        target:
          entity_id: script.s1
      - stop: bad
        error: true
      - action: script.turn_off
        target:
          entity_id: script.s2
      alias: Reloaded s2
- at: 16
  call: turn_off
  data:
    entity_id: all
- at: 18
  result: 3
  response:
    n: 3
- at: 21
  call: s2
  data:
    v: 2
- at: 22
  call: s1
- at: 23
  result: 4
  response:
    n: 4

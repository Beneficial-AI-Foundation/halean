description: random scenario seed=202 index=20
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - parallel:
      - sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - event: mark
            event_data:
              id: s0.2
              v: '{{ v | default(0) }}'
              this: '{{ this.state }}/{{ this.attributes.current }}'
          else:
          - action: test.m
            data:
              id: s0.3
              v: '{{ v | default(0) }}'
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
      - sequence:
        - delay: 1
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s2:
    alias: Script 2 A
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
steps:
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 4
  call: s1
  data:
    v: 2
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 0
- at: 5
  call: s2
  data:
    v: 2
- at: 5
  call: s0
  data:
    v: 3
  return_response: true
- at: 6
  call: s1
  return_response: true
- at: 8
  result: 0
  response:
    n: 0
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 11
  call: s0
- at: 12
  result: 1
  response:
    n: 1
- at: 13
  call: turn_off
  data:
    entity_id: all
- at: 14
  call: s0
- at: 15
  call: s0
- at: 15
  reload:
    s0:
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - parallel:
        - sequence:
          - if:
            - condition: template
              value_template: '{{ v | default(0) is even }}'
            then:
            - event: mark
              event_data:
                id: s0.2
                v: '{{ v | default(0) }}'
                this: '{{ this.state }}/{{ this.attributes.current }}'
            else:
            - action: test.m
              data:
                id: s0.3
                v: '{{ v | default(0) }}'
            - action: script.s1
              data:
                v: '{{ v | default(0) + 1 }}'
        - sequence:
          - delay: 1
          - action: script.s2
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
    s1:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: script.toggle
        target:
          entity_id: script.s2
- at: 17
  result: 2
  response:
    n: 2

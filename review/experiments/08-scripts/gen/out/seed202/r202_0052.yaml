description: random scenario seed=202 index=52
scripts:
  s0:
    alias: Script 0 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - delay: 3
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 2
  call: s1
  data:
    v: 3
- at: 3
  call: s2
  data:
    v: 1
  return_response: true
- at: 4
  call: s2
  return_response: true
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 12
  call: s2
  data:
    v: 2
- at: 15
  call: s1
  data:
    v: 2
- at: 18
- at: 18
  result: 1
  response:
    n: 1
- at: 19
  call: s1
  return_response: true
- at: 21
  call: s2
  data:
    v: 3

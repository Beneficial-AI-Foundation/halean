description: random scenario seed=202 index=55
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
  s2:
    alias: Script 2 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
steps:
- at: 1
  call: s3
  data:
    v: 3
- at: 3
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: s2
- at: 6
  result: 0
  response:
    n: 0
- at: 9
  call: s0
  return_response: true
- at: 12
  call: s1
  return_response: true
- at: 12
  result: 2
  response:
    n: 2
- at: 14
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 15
  call: s1
  data:
    v: 2
  return_response: true
- at: 15
  call: s1
- at: 16
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 19
  result: 1
  response:
    n: 1

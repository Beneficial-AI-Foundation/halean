description: random scenario seed=202 index=3
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    alias: Script 2 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s3:
    alias: Script 3 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s3.2
            v: '{{ v | default(0) }}'
        - action: test.m
          data:
            id: s3.3
            v: '{{ v | default(0) }}'
    - delay: 3
  s4:
    alias: Script 4 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s4.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - event: mark
      event_data:
        id: s4.5
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 6
  result: 0
  response:
    n: 0
- at: 8
  call: s3
  data:
    v: 3
  return_response: true
- at: 8
  call: s0
  data:
    v: 3
  return_response: true
- at: 9
  result: 1
  response:
    n: 1
- at: 10
  reload:
    s0:
      icon: mdi:script
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s1.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    s2:
      alias: Script 2 A
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
    s3:
      alias: Script 3 A
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s3.2
              v: '{{ v | default(0) }}'
          - action: test.m
            data:
              id: s3.3
              v: '{{ v | default(0) }}'
      - delay: 3
    s4:
      alias: Script 4 B
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - delay: 1
      - action: test.m
        data:
          id: s4.8
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s4.9
          v: '{{ v | default(0) }}'
- at: 11
- at: 12
  result: 2
  response:
    n: 2
- at: 13
  result: 3
  response:
    n: 3
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s4
    - script.s1
- at: 15
  call: s2
  return_response: true
- at: 15
  result: 4
  response:
    n: 4
- at: 18
- at: 18

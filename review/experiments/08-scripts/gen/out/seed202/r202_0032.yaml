description: random scenario seed=202 index=32
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
  s2:
    alias: Script 2 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
  call: s0
- at: 3
  call: s0
  data:
    v: 3
- at: 6
  call: turn_off
  data:
    entity_id: all
- at: 7
  call: s2
- at: 7
  result: 0
  response:
    n: 0
- at: 7
  call: s1
  data:
    v: 3
- at: 8
  call: s1
  data:
    v: 1
  return_response: true
- at: 10
  call: s2
  data:
    v: 4
  return_response: true
- at: 10
- at: 12
  call: s1
- at: 13
  call: s2
  data:
    v: 3
  return_response: true
- at: 16
  result: 1
  response:
    n: 1
- at: 18
  result: 2
  response:
    n: 2

description: random scenario seed=202 index=211
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 3
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s4
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - delay: 3
    s2:
      alias: Script 2 B
      icon: mdi:script
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - variables:
          out:
            id: s2.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - delay: 2
    s3:
      mode: single
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.turn_off
        target:
          entity_id: script.s4
    s4:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s4.2
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s3'') }}'
          cur: '{{ state_attr(''script.s3'', ''current'') }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
- at: 2
  call: s4
  data:
    v: 2
  return_response: true
- at: 5
  call: s2
  data:
    v: 0
  return_response: true
- at: 7
  call: turn_off
  data:
    entity_id: all
- at: 10
  call: turn_off
  data:
    entity_id: script.s4
- at: 12
  call: s1
- at: 13
  call: s2
  data:
    v: 3
  return_response: true
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s1

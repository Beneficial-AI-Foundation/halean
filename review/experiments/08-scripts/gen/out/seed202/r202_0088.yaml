description: random scenario seed=202 index=88
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - stop: bad
        error: true
      - action: test.m
        data:
          id: s2.5
          v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 1
  call: s0
  return_response: true
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 3
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: s1
  data:
    v: 1
- at: 6
  call: s2
  return_response: true
- at: 7
  call: turn_off
  data:
    entity_id: all
- at: 8
- at: 10
  call: s0
  data:
    v: 4
  return_response: true
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0

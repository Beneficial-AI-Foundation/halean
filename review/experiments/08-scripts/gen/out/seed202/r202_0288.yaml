      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - delay: 1
  s2:
    mode: single
    fields:

      data:
        id: s3.10
        v: '{{ v | default(0) }}'
      response_variable: r
    - variables:
        out:
          id: s3.11
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.12
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out

description: random scenario seed=202 index=288
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.3

description: random scenario seed=202 index=206
scripts:
  s0:
    alias: Script 0 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        response_variable: r
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s3.8
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s3
- at: 2
  call: s3
  data:
    v: 3
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 4
  result: 0
  response:
    n: 0
- at: 6
  call: s3
  data:
    v: 1
- at: 8
  result: 1
  response:
    n: 1
- at: 9
  call: s3
  data:
    v: 4
  return_response: true
- at: 10
  call: turn_off
  data:
    entity_id: all
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0

description: random scenario seed=202 index=72
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 B
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - parallel:
      - sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
      - sequence:
        - stop: bad
          error: true
    - action: script.turn_off
      target:
        entity_id: script.s3
    - variables:
        out:
          id: s2.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s1
  return_response: true
- at: 4
  call: s3
  return_response: true
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  call: turn_off
  data:
    entity_id: script.s3
- at: 7
  call: s1
- at: 9
  call: s2
- at: 10
  result: 1
  response:
    n: 1
- at: 11
  result: 2
  ok: false
  error_kind: ha_error
- at: 12
  call: s2
  data:
    v: 3
  return_response: true
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 14
  call: s3
  data:
    v: 0
  return_response: true
- at: 17
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 17
  reload:
    s0:
      alias: Script 0 B
      icon: mdi:script
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      alias: Reloaded s1
    s2:
      alias: Script 2 B
      mode: parallel
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
        response_variable: r
      - parallel:
        - sequence:
          - action: script.s0
            data:
              v: '{{ v | default(0) + 1 }}'
            continue_on_error: true
        - sequence:
          - stop: bad
            error: true
      - action: script.turn_off
        target:
          entity_id: script.s3
      - variables:
          out:
            id: s2.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
    s3:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - action: test.m
        data:
          id: s3.4
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - variables:
          out:
            id: s3.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
- at: 17
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s2

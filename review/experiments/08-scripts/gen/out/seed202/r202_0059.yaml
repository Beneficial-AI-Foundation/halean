description: random scenario seed=202 index=59
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s4.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s4.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - parallel:
      - sequence:
        - action: test.m
          data:
            id: s4.6
            v: '{{ v | default(0) }}'
          continue_on_error: true
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s2
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 2
- at: 3
  call: s2
  return_response: true
- at: 4
  call: s2
  data:
    v: 2
- at: 7
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 8
- at: 9
  call: s3
  data:
    v: 3
  return_response: true
- at: 9
- at: 11
  result: 0
  response:
    n: 0
- at: 14
  call: s2
  data:
    v: 1
- at: 14
  call: s4
  return_response: true

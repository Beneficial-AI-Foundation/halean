description: random scenario seed=202 index=89
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s3.3
          v: '{{ v | default(0) }}'
        continue_on_error: true
      else:
      - parallel:
        - sequence:
          - action: script.turn_off
            target:
              entity_id: script.s1
          - action: script.s2
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
        - sequence:
          - action: script.s0
            data:
              v: '{{ v | default(0) + 1 }}'
          - action: test.m
            data:
              id: s3.4
              v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_off
      target:
        entity_id: script.s1

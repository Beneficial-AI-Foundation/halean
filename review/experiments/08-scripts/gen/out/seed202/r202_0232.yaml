description: random scenario seed=202 index=232
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 3
  call: s0
  data:
    v: 4
- at: 4
  call: s1
  data:
    v: 4
- at: 6
  call: s0
  data:
    v: 1
  return_response: true
- at: 8
- at: 11
  call: s0
  data:
    v: 2
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 13
  call: s2
- at: 16
  call: s2
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 19
  call: s1
- at: 21
  call: s2

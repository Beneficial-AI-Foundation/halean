description: random scenario seed=202 index=124
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - delay: 1
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - variables:
        out:
          id: s2.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s2.7
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.8
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
- at: 3
  call: s2
- at: 4
  call: s1
  data:
    v: 4
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 8
  result: 0
  ok: false
  error_kind: ha_error
- at: 9
- at: 10
  result: 1
  response:
    n: 1
- at: 12
  call: s2
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 13
  call: s1
  data:
    v: 2
  return_response: true
- at: 14
  call: s0
  return_response: true
- at: 15
  result: 3
  response:
    n: 3

description: random scenario seed=202 index=199
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 1
  call: s0
  data:
    v: 1
  return_response: true
- at: 3
  call: s2
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 8
  call: s0
- at: 9
  call: s1
  data:
    v: 3
- at: 9
  reload:
    s0:
      alias: Script 0 A
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
          - script.s2
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - action: script.turn_off
        target:
          entity_id: script.s1
- at: 12
  call: s1
  data:
    v: 3
  return_response: true
- at: 12
  result: 0
  response:
    n: 0

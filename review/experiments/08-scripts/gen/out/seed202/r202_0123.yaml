description: random scenario seed=202 index=123
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s1
    - stop: bad
      error: true
steps:
- at: 1
  call: s1
  data:
    v: 0
  return_response: true
- at: 2
  call: s2
  data:
    v: 4
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 4
  result: 0
  response:
    n: 0
- at: 6
  call: s1
  data:
    v: 0
  return_response: true
- at: 7
  call: s1
  data:
    v: 0
  return_response: true
- at: 7
  call: s1
- at: 9
  call: s0
  return_response: true
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 3
- at: 13
  call: s2

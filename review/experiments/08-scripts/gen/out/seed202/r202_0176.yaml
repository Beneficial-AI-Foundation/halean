description: random scenario seed=202 index=176
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - delay: 3
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - delay: 1
      else:
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - event: mark
      event_data:
        id: s3.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
steps:
- at: 1
  call: s0
- at: 3
  call: turn_off
  data:
    entity_id: script.s0
- at: 6
  call: s3
- at: 8
  call: s3
  data:
    v: 2
  return_response: true
- at: 10
  call: s0
- at: 11
  call: s1
  data:
    v: 1
  return_response: true
- at: 12
  call: s3
  data:
    v: 1
- at: 12
  result: 0
  response:
    n: 0
- at: 13
  call: turn_off
  data:
    entity_id: script.s1
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 2
- at: 17
  call: s2
  return_response: true
- at: 18
  call: s3
  data:
    v: 0

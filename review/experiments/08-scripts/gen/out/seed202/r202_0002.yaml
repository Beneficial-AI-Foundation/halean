description: random scenario seed=202 index=2
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.toggle
      target:
        entity_id: script.s3
    - parallel:
      - sequence:
        - repeat:
            count: 2
            sequence:
            - delay: 1
      - sequence:
        - parallel:
          - sequence:
            - event: mark
              event_data:
                id: s0.2
                v: '{{ v | default(0) }}'
                st: '{{ states(''script.s1'') }}'
                cur: '{{ state_attr(''script.s1'', ''current'') }}'
          - sequence:
            - action: script.s3
              data:
                v: '{{ v | default(0) + 1 }}'
              continue_on_error: true
            - action: script.turn_on
              target:
                entity_id:
                - script.s1
              data:
                variables:
                  v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s3:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 2
steps:
- at: 1
  call: s3
- at: 2
  call: s1
  data:
    v: 2
- at: 2
  call: s2
  return_response: true
- at: 2
  result: 0
  response:
    n: 0
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 4
  result: 1
  response:
    n: 1
- at: 5
  call: turn_off
  data:
    entity_id: all
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 9
  call: s2
  data:
    v: 1
- at: 10
  call: s3
  data:
    v: 2
- at: 11
  call: s3
  data:
    v: 2
  return_response: true
- at: 11
  call: s2
  data:
    v: 4
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0

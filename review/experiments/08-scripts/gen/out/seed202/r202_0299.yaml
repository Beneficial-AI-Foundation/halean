description: random scenario seed=202 index=299
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
  s1:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s2.1
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
        - parallel:
          - sequence:
            - delay: 2
            - action: script.s0
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
          - sequence:
            - action: script.turn_off
              target:
                entity_id: script.s0
            - action: test.m
              data:
                id: s2.2
                v: '{{ v | default(0) }}'
              response_variable: r
              continue_on_error: true
steps:
- at: 2
  call: s1
  data:
    v: 1
  return_response: true
- at: 3
  call: s2
  data:
    v: 1
  return_response: true
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 5
  call: s2
- at: 6
  call: s1
  data:
    v: 3
  return_response: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 9
  result: 0
  response:
    n: 0
- at: 10
- at: 10
  result: 1
  response:
    n: 1
- at: 10
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 11
  call: s1
- at: 12
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 4
- at: 14
  call: s0
- at: 16
  call: s0
  return_response: true

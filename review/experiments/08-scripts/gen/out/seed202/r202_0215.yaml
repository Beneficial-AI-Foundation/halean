description: random scenario seed=202 index=215
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 3
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - parallel:
        - sequence:
          - delay: 3
          - delay: 2
        - sequence:
          - action: script.turn_off
            target:
              entity_id: script.s2
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
steps:
- at: 1
  call: s0
  data:
    v: 4
- at: 2
  call: s0
  data:
    v: 4
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 2
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  call: s0
  data:
    v: 0
- at: 6
  call: s1
  data:
    v: 3
- at: 8
  reload:
    s0:
      alias: Script 0 B
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s2:
      icon: mdi:script
      mode: parallel
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - delay: 3
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - event: mark
          event_data:
            id: s2.3
            v: '{{ v | default(0) }}'
        - parallel:
          - sequence:
            - delay: 3
            - delay: 2
          - sequence:
            - action: script.turn_off
              target:
                entity_id: script.s2
            - action: script.s1
              data:
                v: '{{ v | default(0) + 1 }}'
              response_variable: r
- at: 8
  result: 1
  response:
    n: 1
- at: 8
  call: s2
  return_response: true

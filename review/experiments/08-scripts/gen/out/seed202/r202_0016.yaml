description: random scenario seed=202 index=16
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - variables:
            out:
              id: s1.3
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        - action: script.turn_on
          target:
            entity_id:
            - script.s2
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
      - sequence:
        - action: script.s0
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - action: test.m
          data:
            id: s1.4
            v: '{{ v | default(0) }}'
          response_variable: r
          continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s1
    - delay: 1
steps:
- at: 1
  call: s2
  return_response: true
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 3
  reload:
    s0:
      alias: Script 0 B
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 1
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
      - variables:
          out:
            id: s0.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - variables:
              out:
                id: s1.3
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
          - action: script.turn_on
            target:
              entity_id:
              - script.s2
            data:
              variables:
                v: '{{ v | default(0) + 10 }}'
        - sequence:
          - action: script.s0
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
          - action: test.m
            data:
              id: s1.4
              v: '{{ v | default(0) }}'
            response_variable: r
            continue_on_error: true
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s1.5
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    s2:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.8
- at: 4
  call: s0
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  result: 1
  response:
    n: 1
- at: 9
  call: s1
  return_response: true
- at: 12
  call: s2
- at: 13
  result: 2
  response:
    n: 2
- at: 15
  call: s0
  data:
    v: 4
  return_response: true
- at: 16
  call: turn_off
  data:
    entity_id: script.s2
- at: 17
  call: s2
  data:
    v: 4
  return_response: true
- at: 18
  call: s2

description: random scenario seed=202 index=10
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 1
    - parallel:
      - sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
      - sequence:
        - event: mark
          event_data:
            id: s2.4
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - stop: bad
      error: true

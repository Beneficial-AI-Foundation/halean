description: random scenario seed=202 index=241
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.toggle
      target:
        entity_id: script.s1
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - delay: 1
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - delay: 2
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - delay: 1
      else:
      - variables:
          out:
            id: s2.6
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
steps:
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 1
  call: turn_off
  data:
    entity_id: script.s1
- at: 3
  call: s2
  return_response: true
- at: 3
  result: 0
  response:
    n: 0
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 7
  call: turn_off
  data:
    entity_id: all
- at: 7
  call: s0
  data:
    v: 2
  return_response: true
- at: 8
  call: s2

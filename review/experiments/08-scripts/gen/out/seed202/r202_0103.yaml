      - stop: done
        response_variable: out
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
      - variables:
          out:
            id: s2.8
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
    s3:
      alias: Script 3 A
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1

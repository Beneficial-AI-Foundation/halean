description: random scenario seed=202 index=103
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s4
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
  s3:
    alias: Script 3 A
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - repeat:
        count: 2
        sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s4
        - event: mark
          event_data:
            id: s3.6
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s4'') }}'
            cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s4:
    alias: Script 4 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 3
  call: s1
  data:
    v: 1
- at: 4
  call: s3
  data:
    v: 4
- at: 4
  call: s0
  data:
    v: 4
- at: 5
  call: s1
  data:
    v: 3
  return_response: true
- at: 6
  result: 0
  response:
    n: 0
- at: 8
  call: s4
  data:
    v: 4
  return_response: true
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 11
  call: s2
  data:
    v: 2
- at: 14
  call: s1
  return_response: true
- at: 15
  reload:
    s0:
      icon: mdi:script
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      alias: Script 1 A
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s1.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s1.3
          v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s4
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - variables:

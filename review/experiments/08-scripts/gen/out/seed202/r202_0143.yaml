description: random scenario seed=202 index=143
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s1
  data:
    v: 4
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 1
  result: 0
  response:
    n: 0
- at: 1
  result: 1
  ok: false
  error_kind: invalid
- at: 4
  call: s2
  data:
    v: 4
- at: 6
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 7
  result: 2
  response:
    n: 2
- at: 7
  result: 3
  ok: false
  error_kind: other
- at: 8
- at: 9
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1

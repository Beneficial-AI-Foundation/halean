      value_template: '{{ v | default(0) < 2 }}'
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out

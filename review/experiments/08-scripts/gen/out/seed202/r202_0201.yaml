description: random scenario seed=202 index=201
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - action: script.toggle
          target:
            entity_id: script.s2
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
  s2:
    alias: Script 2 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - stop: bad
      error: true
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 3
  call: s1
  return_response: true
- at: 6
  call: s0
  data:
    v: 4
- at: 8
  call: s2
  data:
    v: 1
- at: 10
  call: s1
  data:
    v: 4
  return_response: true
- at: 10
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - action: script.toggle
            target:
              entity_id: script.s2
        - sequence:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
    s2:
      alias: Script 2 A
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
- at: 10
  call: s2
  data:
    v: 1

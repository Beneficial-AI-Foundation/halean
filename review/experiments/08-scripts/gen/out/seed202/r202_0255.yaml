description: random scenario seed=202 index=255
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
  s3:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 1
    - delay: 1
  s4:
    alias: Script 4 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - delay: 1
steps:
- at: 1
  call: s0
- at: 4
  result: 0
  response:
    n: 0
- at: 7
  result: 1
  response:
    n: 1
- at: 10
  call: s4
  data:
    v: 1
  return_response: true
- at: 11
  call: s2
  data:
    v: 2
- at: 13
  call: s2
- at: 14
  call: s2
  data:
    v: 3
  return_response: true
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 16
  call: s4
- at: 17
  call: s3
- at: 18
  call: s3
  data:
    v: 2
  return_response: true
- at: 21
  call: s1
  data:
    v: 2
- at: 24
  call: s3
  data:
    v: 3
- at: 25
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 0
- at: 26
  result: 2
  response:
    n: 2

description: random scenario seed=202 index=207
scripts:
  s0:
    alias: Script 0 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      else:
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s2
        - delay: 2
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - variables:
            out:
              id: s3.3
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
      - sequence:
        - variables:
            out:
              id: s3.4
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s3.5
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
      - delay: 3
      else:
      - event: mark
        event_data:
          id: s3.6
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - action: test.m
        data:
          id: s3.7
          v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s1
  data:
    v: 3
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 6
  result: 1
  response:
    n: 1
- at: 7
  call: s0
  data:
    v: 3
- at: 10
  call: s2
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id: all
- at: 12
  call: turn_off
  data:
    entity_id: script.s2
- at: 13
  reload:
    s0:
      alias: Script 0 A
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
          - script.s2
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
          - script.s3
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        - action: script.turn_on
          target:
            entity_id:
            - script.s2
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
        else:
        - action: test.m
          data:
            id: s1.2
            v: '{{ v | default(0) }}'
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - action: script.turn_off
            target:
              entity_id: script.s2
          - delay: 2
    s3:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - variables:
              out:
                id: s3.3
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
        - sequence:
          - variables:
              out:
                id: s3.4
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
      - delay: 1
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - event: mark
          event_data:
            id: s3.5
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s1'') }}'
            cur: '{{ state_attr(''script.s1'', ''current'') }}'
        - delay: 3
        else:
        - event: mark
          event_data:
            id: s3.6
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
        - action: test.m
          data:
            id: s3.7
            v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s3.8
          v: '{{ v | default(0) }}'
      alias: Reloaded s3
- at: 14
  result: 2
  response:
    n: 2
- at: 15
  result: 0
  response:
    n: 0
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 17
  call: turn_off
  data:
    entity_id: script.s2

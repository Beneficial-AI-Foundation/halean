description: random scenario seed=202 index=93
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.turn_on

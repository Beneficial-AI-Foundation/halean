description: random scenario seed=202 index=226
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - delay: 2
  s1:
    alias: Script 1 B
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s2
          data:
            v: '{{ v | default(0) + 1 }}'
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.s2
            data:
              v: '{{ v | default(0) + 1 }}'
            response_variable: r
            continue_on_error: true
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    alias: Script 2 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - stop: bad
      error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.s4
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s2.4
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      else:
      - action: script.turn_off
        target:
          entity_id: script.s3
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
    - repeat:
        count: 2
        sequence:
        - variables:
            out:
              id: s3.5
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
      continue_on_error: true

        id: s1.3
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - delay: 2
    - action: script.turn_off
      target:
        entity_id: script.s1
  s4:
    alias: Script 4 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s4.5
        v: '{{ v | default(0) }}'

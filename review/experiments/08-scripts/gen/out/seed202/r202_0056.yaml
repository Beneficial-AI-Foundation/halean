    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:

description: random scenario seed=202 index=109
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - stop: bad
      error: true
    - parallel:
      - sequence:
        - action: script.s4
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
      - sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
  s2:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.1
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 B
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s4:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - delay: 2
    - delay: 1
steps:
- at: 1
  call: s1
- at: 2
  result: 0
  ok: false
  error_kind: other
- at: 4
  call: s4
  return_response: true
- at: 6
  call: s0

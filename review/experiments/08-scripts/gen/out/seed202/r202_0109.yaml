- at: 7
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 8
  call: s3
  data:
    v: 3
  return_response: true
- at: 10
  call: s4
  data:
    v: 0
  return_response: true
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 12
  result: 2
  response:
    n: 2

description: random scenario seed=202 index=145
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - event: mark
      event_data:
        id: s3.2
        v: '{{ v | default(0) }}'
  s4:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s1
  data:
    v: 3
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 3
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 4
  call: s2
  data:
    v: 1
  return_response: true
- at: 5
  call: s0
  data:
    v: 1
  return_response: true
- at: 6
  call: s4
- at: 9
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 3
    s2:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
    s3:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - delay: 2
      - event: mark
        event_data:
          id: s3.2
          v: '{{ v | default(0) }}'
    s4:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s4.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
- at: 9
  call: s3
- at: 12
  call: s4
  return_response: true
- at: 13
  call: s3
- at: 14
  call: s2
  return_response: true
- at: 15
  call: s4

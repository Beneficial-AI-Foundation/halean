description: random scenario seed=202 index=227
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.toggle
      target:
        entity_id: script.s4
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
  s4:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.turn_off
      target:
        entity_id: script.s3
    - delay: 1
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s0
  data:
    v: 1
- at: 4
  result: 1
  response:
    n: 1
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  result: 2
  ok: false
  error_kind: invalid
- at: 12
  call: s1
  data:
    v: 1
- at: 15
  call: s1
  data:
    v: 0
- at: 17
  call: s3
  data:
    v: 0
- at: 17
  result: 3
  response:
    n: 3
- at: 18
  call: s2
  return_response: true
- at: 19
- at: 19
- at: 20
  result: 4
  ok: false
  error_kind: invalid

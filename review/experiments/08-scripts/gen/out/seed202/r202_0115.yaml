description: random scenario seed=202 index=115
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - variables:
        out:
          id: s0.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.toggle
      target:
        entity_id: script.s4
    - variables:
        out:
          id: s1.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s3
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s3:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s3.7
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
      else:
      - event: mark
        event_data:
          id: s3.8
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: script.turn_on
        target:
          entity_id:
          - script.s4
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s3.10
        v: '{{ v | default(0) }}'
      response_variable: r
  s4:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.11
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s4.12
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
    variables:
      v: 0
- at: 3
  call: s0
- at: 5
  call: s1
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 10
  result: 1
  ok: false
  error_kind: ha_error
- at: 10
  call: s3
  data:
    v: 1
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s3
- at: 14
  result: 0
  response:
    n: 0
- at: 15
  call: s2
  data:
    v: 0
  return_response: true

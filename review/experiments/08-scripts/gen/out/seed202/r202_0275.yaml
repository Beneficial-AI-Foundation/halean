description: random scenario seed=202 index=275
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.toggle
      target:
        entity_id: script.s3
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    alias: Script 3 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s3.4
          v: '{{ v | default(0) }}'
        response_variable: r
      - action: test.m
        data:
          id: s3.5
          v: '{{ v | default(0) }}'
      else:
      - delay: 1
      - delay: 1
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 2
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
    variables:
      v: 4
- at: 3
  call: s1
  data:
    v: 1
  return_response: true
- at: 6
  call: s1
  data:
    v: 2
- at: 7
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 9
  call: s1
  data:
    v: 2
- at: 10
  result: 1
  response:
    n: 1
- at: 11
  result: 0
  ok: false
  error_kind: invalid
- at: 13
- at: 14
  result: 2
  response:
    n: 2
- at: 16
  result: 4
  response:
    n: 4

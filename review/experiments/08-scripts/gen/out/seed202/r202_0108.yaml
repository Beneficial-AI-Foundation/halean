description: random scenario seed=202 index=108
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.6
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 1
  call: s0
  data:
    v: 1
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 5
  call: turn_off
  data:
    entity_id: script.s2
- at: 7
  call: s1
  data:
    v: 1
- at: 10
  call: s0
- at: 13
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
    variables:
      v: 0
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 4
- at: 18
  reload:
    s0:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s0.1
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - event: mark
        event_data:
          id: s0.2
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s1'') }}'
          cur: '{{ state_attr(''script.s1'', ''current'') }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s0.3
          v: '{{ v | default(0) }}'
    s1:
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s2
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      alias: Reloaded s1
    s2:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.4
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - event: mark
        event_data:
          id: s2.5
          v: '{{ v | default(0) }}'
      - event: mark
        event_data:
          id: s2.6
          v: '{{ v | default(0) }}'
      - action: script.turn_off
        target:
          entity_id: script.s0

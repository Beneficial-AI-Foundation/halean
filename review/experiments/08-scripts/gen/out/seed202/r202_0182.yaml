description: random scenario seed=202 index=182
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
  s2:
    alias: Script 2 A
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - delay: 2
    - stop: bad
      error: true
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s4:
    alias: Script 4 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - event: mark
      event_data:
        id: s4.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s4.4
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
steps:
- at: 3
  call: s3
  data:
    v: 1
  return_response: true
- at: 6
  call: s3
- at: 9

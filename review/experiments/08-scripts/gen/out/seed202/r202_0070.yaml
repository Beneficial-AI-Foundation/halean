description: random scenario seed=202 index=70
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - stop: bad
      error: true
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 2
  call: s0
  data:
    v: 4
  return_response: true
- at: 2
  reload:
    s0:
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
    s2:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - stop: bad
        error: true
      - event: mark
        event_data:
          id: s2.3
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
- at: 3
  call: s0
  data:
    v: 3
  return_response: true
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
    variables:
      v: 2
- at: 4
  call: s0
- at: 7
  call: s2
  return_response: true
- at: 8
  call: s0
  return_response: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 10
  call: s2
  data:
    v: 3
  return_response: true

description: random scenario seed=202 index=141
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - parallel:
      - sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s2
        - action: test.m
          data:
            id: s1.2
            v: '{{ v | default(0) }}'
          response_variable: r
      - sequence:
        - action: script.toggle
          target:
            entity_id: script.s2
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
    - delay: 2
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
steps:
- at: 1
  call: s1
  return_response: true
- at: 2
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 3
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 4
  call: s1
  data:
    v: 2
- at: 6
  call: s1
  data:
    v: 1
  return_response: true
- at: 8
  result: 0
  response:
    n: 0
- at: 8
  call: s0
  data:
    v: 4
- at: 11
  result: 1
  response:
    n: 1
- at: 13
  call: s2
  data:
    v: 3
- at: 14
  call: turn_off
  data:
    entity_id: all

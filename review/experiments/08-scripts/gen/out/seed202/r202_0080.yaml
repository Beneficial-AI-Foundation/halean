description: random scenario seed=202 index=80
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 3
    - delay: 3
    - repeat:
        count: 2
        sequence:
        - stop: bad
          error: true
  s2:
    alias: Script 2 B
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - parallel:
      - sequence:
        - variables:
            out:
              id: s2.4
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        - event: mark
          event_data:
            id: s2.5
            v: '{{ v | default(0) }}'
      - sequence:
        - action: test.m
          data:
            id: s2.6
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s2.7
            v: '{{ v | default(0) }}'
            this: '{{ this.state }}/{{ this.attributes.current }}'
    - action: test.m
      data:
        id: s2.8
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 4
  call: s2
  data:
    v: 4
  return_response: true
- at: 7
  call: s1
  data:
    v: 4
  return_response: true
- at: 7
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
    s2:
      alias: Script 2 B
      icon: mdi:script
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s2.2
          v: '{{ v | default(0) }}'
      - action: test.m
        data:
          id: s2.3
          v: '{{ v | default(0) }}'
        continue_on_error: true
      - parallel:
        - sequence:
          - variables:
              out:
                id: s2.4
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
          - event: mark
            event_data:
              id: s2.5
              v: '{{ v | default(0) }}'
        - sequence:
          - action: test.m
            data:
              id: s2.6
              v: '{{ v | default(0) }}'
          - event: mark
            event_data:
              id: s2.7
              v: '{{ v | default(0) }}'
              this: '{{ this.state }}/{{ this.attributes.current }}'
      - action: test.m
        data:
          id: s2.8
          v: '{{ v | default(0) }}'
        response_variable: r
- at: 8
  call: s2
  data:
    v: 4
- at: 9
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 9
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
    s2:
      alias: Script 2 B
      icon: mdi:script
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s2.9
          v: '{{ v | default(0) }}'
        response_variable: r
- at: 10
- at: 11
  call: turn_off
  data:
    entity_id: all
- at: 12
  call: s2
  data:
    v: 4
- at: 12
  call: s0
  data:
    v: 3

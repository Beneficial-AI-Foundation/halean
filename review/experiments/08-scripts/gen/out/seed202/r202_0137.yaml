description: random scenario seed=202 index=137
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
          st: '{{ states(''script.s2'') }}'
          cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - variables:
        out:
          id: s3.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out

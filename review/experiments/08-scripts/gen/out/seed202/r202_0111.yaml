description: random scenario seed=202 index=111
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    alias: Script 1 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    alias: Script 2 A
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s2.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
  call: turn_off
  data:
    entity_id: script.s0
- at: 2
  call: s1
  data:
    v: 1
  return_response: true
- at: 4
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
    s1:
      alias: Reloaded s1
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - stop: bad
        error: true
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
    s2:
      alias: Script 2 A
      mode: queued
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - variables:
          out:
            id: s2.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.turn_off
        target:
          entity_id: script.s2
- at: 7
  call: s1
- at: 9
  call: s2
  data:
    v: 0
- at: 10
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 13
  call: s0
  data:
    v: 4
  return_response: true
- at: 15
  call: s0
  data:
    v: 4
  return_response: true
- at: 18
  call: s1
- at: 20
  call: s2
  data:
    v: 4
  return_response: true
- at: 21
  call: s0
- at: 23
  call: s2
  data:
    v: 3
- at: 24
  call: s0
  data:
    v: 4
  return_response: true
- at: 25
  call: s0
  data:
    v: 4

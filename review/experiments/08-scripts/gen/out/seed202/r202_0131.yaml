description: random scenario seed=202 index=131
scripts:
  s0:
    alias: Script 0 B
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    alias: Script 1 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
        - script.s2
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - delay: 2
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s4:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - delay: 3
        - parallel:
          - sequence:
            - action: test.m
              data:
                id: s4.4
                v: '{{ v | default(0) }}'
              continue_on_error: true
          - sequence:
            - action: test.m
              data:
                id: s4.5
                v: '{{ v | default(0) }}'
              response_variable: r
      - sequence:
        - delay: 3
        - variables:
            out:
              id: s4.6
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
    - variables:
        out:
          id: s4.7
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s4.8
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s4.9
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 4
  call: s1
  data:
    v: 2
- at: 5
  result: 0
  response:
    n: 0
- at: 7
  call: s3
  return_response: true
- at: 9
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 0
- at: 11
  result: 1
  response:
    n: 1
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s4
    - script.s2
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s1
    variables:
      v: 3
- at: 17
  call: turn_on
  data:
    entity_id:
    - script.s3
    variables:
      v: 3
- at: 19
  call: s1
  data:
    v: 0

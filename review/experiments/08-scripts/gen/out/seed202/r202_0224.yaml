description: random scenario seed=202 index=224
scripts:
  s0:
    alias: Script 0 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - delay: 2
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 3
  call: s0
- at: 4
  result: 0
  response:
    n: 0
- at: 7
  call: s2
  data:
    v: 3
- at: 9
  result: 1
  response:
    n: 1
- at: 11
  call: s1
  data:
    v: 3
- at: 12
- at: 13
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1

description: random scenario seed=202 index=1
scripts:
  s0:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.turn_off
            target:
              entity_id: script.s1
          - event: mark
            event_data:
              id: s1.1
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    alias: Script 2 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.3
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    alias: Script 3 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 2
  call: s3
  data:
    v: 1
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s1
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 5
  reload:
    s0:
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
    s1:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - if:
            - condition: template
              value_template: '{{ v | default(0) is even }}'
            then:
            - action: script.turn_off
              target:
                entity_id: script.s1
            - event: mark
              event_data:
                id: s1.1
      - event: mark
        event_data:
          id: s1.2
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
    s2:
      alias: Script 2 A
      mode: queued
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - if:
            - condition: template
              value_template: '{{ v | default(0) is even }}'
            then:
            - stop: bad
              error: true
            else:
            - event: mark
              event_data:
                id: s2.4
                v: '{{ v | default(0) }}'
                r: '{{ r | default(''undef'') }}'
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            continue_on_error: true
    s3:
      alias: Script 3 A
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
        continue_on_error: true
- at: 7
  call: turn_off
  data:
    entity_id: script.s2
- at: 8
  call: s2
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 10
  call: s2
  data:
    v: 0
- at: 11
  call: s0
  return_response: true
- at: 12
  call: s0
  return_response: true
- at: 12
  call: s3
  data:
    v: 2
  return_response: true
- at: 12

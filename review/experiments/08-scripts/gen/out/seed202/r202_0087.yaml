description: random scenario seed=202 index=87
scripts:
  s0:
    alias: Script 0 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - variables:
        out:
          id: s0.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s1
  s1:
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - variables:
        out:
          id: s3.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 2
  call: s2
- at: 2
  result: 0
  ok: false
  error_kind: ha_error
- at: 4
  result: 1
  response:
    n: 1
- at: 5
  result: 2
  response:
    n: 2
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s2
    - script.s1
- at: 10
  call: s2
  data:
    v: 2
- at: 11
  call: s3
  data:
    v: 2
  return_response: true
- at: 12
  result: 3
  response:
    n: 3
- at: 13
  result: 4
  response:
    n: 4
- at: 13
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 15
  result: 5
  response:
    n: 5
- at: 15
  result: 6
  response:
    n: 6
- at: 16
  call: s1
  return_response: true
- at: 17
  call: turn_off
  data:
    entity_id: script.s1
- at: 18
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s2

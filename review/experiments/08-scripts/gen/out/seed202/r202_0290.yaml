            continue_on_error: true
          - repeat:
              count: 2
              sequence:
              - event: mark
                event_data:
                  id: s0.3
                  v: '{{ v | default(0) }}'
    s1:
      alias: Script 1 A
      icon: mdi:script
      mode: parallel

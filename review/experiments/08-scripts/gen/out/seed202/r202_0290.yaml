    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - delay: 1
      alias: Reloaded s2
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - variables:

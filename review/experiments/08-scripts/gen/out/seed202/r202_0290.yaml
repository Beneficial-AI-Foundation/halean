description: random scenario seed=202 index=290
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
          continue_on_error: true
        - repeat:
            count: 2
            sequence:
            - event: mark
              event_data:
                id: s0.3
                v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s1.4
            v: '{{ v | default(0) }}'
      - sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
            continue_on_error: true
          else:
          - action: script.turn_off
            target:
              entity_id: script.s3
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - delay: 1
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: s2
  data:
    v: 0
  return_response: true
- at: 3
  call: s0
  data:
    v: 1
- at: 4
  result: 0
  response:
    n: 0
- at: 4
  result: 1
  response:
    n: 1
- at: 5
  reload:
    s0:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m

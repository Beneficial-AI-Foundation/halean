          - if:
            - condition: template
              value_template: '{{ v | default(0) is even }}'
            then:
            - action: script.s1
              data:
                v: '{{ v | default(0) + 1 }}'
              continue_on_error: true
            else:
            - action: script.turn_off
              target:
                entity_id: script.s3
          - action: script.s3
            data:
              v: '{{ v | default(0) + 1 }}'
      - event: mark
        event_data:
          id: s1.5
          v: '{{ v | default(0) }}'

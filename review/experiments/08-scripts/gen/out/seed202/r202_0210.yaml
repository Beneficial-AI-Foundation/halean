description: random scenario seed=202 index=210
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - delay: 1
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
  s3:
    alias: Script 3 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
  s4:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 3
  call: s0
  data:
    v: 1
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 4
  result: 0
  response:
    n: 0
- at: 5
  result: 1
  ok: false
  error_kind: invalid
- at: 6
  call: turn_off
  data:
    entity_id: all
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s3
- at: 8
  call: s2
  data:
    v: 2

description: random scenario seed=202 index=274
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 1
      else:
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - stop: bad
      error: true
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s3:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - delay: 1
          - event: mark
            event_data:
              id: s3.6
              v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 3
  call: s3
  data:
    v: 4
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s2
- at: 5
  call: turn_off
  data:
    entity_id: script.s2
- at: 8
  result: 1
  response:
    n: 1
- at: 11
  result: 0
  ok: false
  error_kind: invalid
- at: 11
  call: s0
  data:
    v: 0
  return_response: true
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 15
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0

description: random scenario seed=202 index=132
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - delay: 1
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s0.2
            v: '{{ v | default(0) }}'
          continue_on_error: true
  s1:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s1.3
            v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
steps:
- at: 2
  call: s1
  data:
    v: 4
- at: 3
  call: s2
  return_response: true
- at: 4
  call: s2
- at: 5
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 8
  call: s0
- at: 10
  call: s2
  data:
    v: 4
- at: 10
  reload:
    s0:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - delay: 1
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s0.2
              v: '{{ v | default(0) }}'
            continue_on_error: true
    s2:
      alias: Script 2 A
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s1
      - action: test.m
        data:
          id: s2.4
          v: '{{ v | default(0) }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - repeat:
          count: 2
          sequence:
          - action: script.turn_off
            target:
              entity_id: script.s0
- at: 10
  call: s0
  data:
    v: 0
- at: 11
  call: s2
  data:
    v: 0
  return_response: true
- at: 12
  call: s0
- at: 15
  reload:
    s0:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
      - delay: 1
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s0.2
              v: '{{ v | default(0) }}'
            continue_on_error: true
      alias: Reloaded s0
    s2:
      alias: Script 2 A
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.s1
      - action: test.m
        data:
          id: s2.4
          v: '{{ v | default(0) }}'
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      - repeat:
          count: 2
          sequence:
          - action: script.turn_off
            target:
              entity_id: script.s0
- at: 15
  call: s0
  return_response: true
- at: 16
  call: s2
  data:
    v: 3

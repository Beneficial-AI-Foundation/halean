description: random scenario seed=202 index=105
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s3
    - action: script.turn_off
      target:
        entity_id: script.s3
  s3:
    alias: Script 3 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - delay: 3
  s4:
    alias: Script 4 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - variables:
        out:
          id: s4.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s2
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id: all
- at: 6
  call: s1

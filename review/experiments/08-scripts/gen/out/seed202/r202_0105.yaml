    v: 3
  return_response: true
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: s2
  return_response: true
- at: 8
- at: 9
  result: 1
  response:
    n: 1
- at: 9
  call: s1
- at: 12
  result: 2
  response:
    n: 2
- at: 13
  call: s4
- at: 14
  call: turn_off
  data:
    entity_id: all
- at: 15
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 16
  result: 4
  response:
    n: 4
- at: 17

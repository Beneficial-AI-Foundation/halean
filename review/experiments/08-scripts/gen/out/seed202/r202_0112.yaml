description: random scenario seed=202 index=112
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s0.2
            v: '{{ v | default(0) }}'
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 3
    - delay: 1
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    icon: mdi:script
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - repeat:
        count: 2
        sequence:
        - action: script.turn_off
          target:
            entity_id: script.s0
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s3:
    alias: Script 3 B
    icon: mdi:script
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r

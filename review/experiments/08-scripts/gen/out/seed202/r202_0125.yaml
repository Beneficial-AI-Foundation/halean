description: random scenario seed=202 index=125
scripts:
  s0:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - delay: 1
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s0.3
        v: '{{ v | default(0) }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - delay: 2
    - delay: 1
  s2:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
    - variables:
        out:
          id: s2.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - parallel:
      - sequence:
        - delay: 2
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
      - sequence:
        - action: test.m
          data:
            id: s2.7
            v: '{{ v | default(0) }}'
  s3:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.8
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.9
        v: '{{ v | default(0) }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s4
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
  s4:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.10
        v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:

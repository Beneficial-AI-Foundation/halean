description: random scenario seed=202 index=85
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
    - delay: 2
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - stop: bad
      error: true
    - repeat:
        count: 2
        sequence:
        - event: mark
          event_data:
            id: s3.6
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - delay: 1
          - condition: template
            value_template: '{{ v | default(0) < 2 }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
      response_variable: r
steps:
- at: 3
  call: s2
- at: 4
  result: 0
  ok: false
  error_kind: other
- at: 5
  call: s3
  return_response: true
- at: 8
  call: s1
  data:
    v: 1
- at: 9
- at: 10
  call: turn_off
  data:
    entity_id: script.s3
- at: 12
- at: 15
  result: 1
  response:
    n: 1
- at: 18
  call: turn_off
  data:
    entity_id: script.s0
- at: 18
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s0
- at: 21
  call: s2
  data:
    v: 3
- at: 22
  call: s0
  data:
    v: 4
  return_response: true

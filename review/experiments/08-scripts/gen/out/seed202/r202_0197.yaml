description: random scenario seed=202 index=197
scripts:
  s0:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - repeat:
        count: 2
        sequence:
        - action: script.turn_on
          target:
            entity_id:
            - script.s4
        - action: test.m
          data:
            id: s0.1
            v: '{{ v | default(0) }}'
          continue_on_error: true
    - event: mark
      event_data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - parallel:
      - sequence:
        - action: script.toggle
          target:
            entity_id: script.s4
        - parallel:
          - sequence:
            - action: script.turn_off
              target:
                entity_id: script.s4
          - sequence:
            - event: mark
              event_data:
                id: s1.4
                v: '{{ v | default(0) }}'
                this: '{{ this.state }}/{{ this.attributes.current }}'
            - delay: 1
      - sequence:
        - action: test.m
          data:
            id: s1.5
            v: '{{ v | default(0) }}'
          continue_on_error: true
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    alias: Script 3 A
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - delay: 1
    - delay: 1
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.7
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - event: mark
      event_data:
        id: s4.8
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s0
steps:
- at: 2
  call: s4
  return_response: true
- at: 5
  call: s2
  return_response: true
- at: 7
  reload:
    s0:
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - repeat:
          count: 2
          sequence:
          - action: script.turn_on
            target:
              entity_id:
              - script.s4
          - action: test.m
            data:
              id: s0.1
              v: '{{ v | default(0) }}'
            continue_on_error: true
      - event: mark
        event_data:
          id: s0.2
          v: '{{ v | default(0) }}'
    s2:
      mode: queued
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
    s3:
      alias: Script 3 A
      mode: restart
      fields:
        v: {}
        r: {}
      variables:
        v: 100
      sequence:
      - event: mark
        event_data:
          id: s3.6
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      - delay: 1
      - delay: 1
    s4:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s4.7
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - event: mark
        event_data:
          id: s4.8
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - action: script.turn_off
        target:
          entity_id: script.s0
- at: 7
  call: s4
- at: 8
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 8
  call: s0
  data:
    v: 3
  return_response: true
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 11
- at: 12
  call: s4
  data:
    v: 3
- at: 14
  call: s0
- at: 14
- at: 15
- at: 16
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 17
  call: s3
- at: 17
  result: 0
  response:
    n: 0
- at: 18
  result: 1
  response:
    n: 1

description: random scenario seed=202 index=107
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s1:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    alias: Script 2 A
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - variables:
          out:
            id: s2.4
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s2.5
          v: '{{ v | default(0) }}'
      else:
      - action: test.m
        data:
          id: s2.6
          v: '{{ v | default(0) }}'
steps:
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  call: s2
- at: 5
  result: 1
  response:
    n: 1
- at: 6
  call: s1
  return_response: true
- at: 9
  call: turn_off
  data:
    entity_id: script.s1
- at: 10
- at: 11
  result: 2
  ok: false
  error_kind: other
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 14
  result: 3
  response:
    n: 3

description: random scenario seed=202 index=68
scripts:
  s0:
    alias: Script 0 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - delay: 1
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.toggle
      target:
        entity_id: script.s3
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - action: test.m
      data:
        id: s3.8
        v: '{{ v | default(0) }}'
  s4:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - event: mark
      event_data:
        id: s4.9
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: test.m
      data:
        id: s4.10
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
steps:

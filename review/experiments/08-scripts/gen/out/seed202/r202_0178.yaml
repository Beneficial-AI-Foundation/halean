description: random scenario seed=202 index=178
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - parallel:
      - sequence:
        - action: script.toggle
          target:
            entity_id: script.s3
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
      - sequence:
        - action: test.m
          data:
            id: s0.1
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s0.2
            v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s0.3
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_on
        target:
          entity_id:
          - script.s3
        data:
          variables:
            v: '{{ v | default(0) + 10 }}'
  s1:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
    - stop: bad
      error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    icon: mdi:script
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
steps:
- at: 1
  call: s1
  data:
    v: 0
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s3
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  call: s2
  data:
    v: 4
  return_response: true
- at: 6
  result: 1
  response:
    n: 1
- at: 7
  result: 3
  response:
    n: 3
- at: 10
  call: s2
  data:
    v: 0
- at: 11
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s1
- at: 13
  call: s1
  return_response: true
- at: 16
  result: 4
  response:
    n: 4
- at: 18
  reload:

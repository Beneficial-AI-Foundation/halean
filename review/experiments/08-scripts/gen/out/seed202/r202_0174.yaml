description: random scenario seed=202 index=174
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s0.2
            v: '{{ v | default(0) }}'
            st: '{{ states(''script.s3'') }}'
            cur: '{{ state_attr(''script.s3'', ''current'') }}'
      - sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s3
    - delay: 3
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s3:
    alias: Script 3 A
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 2
  call: s2
- at: 3
  call: s3
- at: 3
  call: s0
  data:
    v: 3
- at: 4
  call: turn_off
  data:
    entity_id:
    - script.s2
    - script.s3
- at: 6
  call: s3
  data:
    v: 0
  return_response: true
- at: 7
  call: s3
  data:
    v: 0
  return_response: true
- at: 9
  call: s0
  data:
    v: 2
  return_response: true
- at: 10
  call: s2
  return_response: true
- at: 10
  call: s1
  return_response: true
- at: 13
  call: turn_off
  data:
    entity_id: script.s0

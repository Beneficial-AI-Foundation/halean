      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s1.2
            v: '{{ v | default(0) }}'
        - event: mark
          event_data:
            id: s1.3
            v: '{{ v | default(0) }}'

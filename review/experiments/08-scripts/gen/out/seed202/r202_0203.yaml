description: random scenario seed=202 index=203
scripts:
  s0:
    alias: Script 0 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - delay: 1
    - variables:
        out:
          id: s0.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - repeat:
        count: 2
        sequence:
        - if:
          - condition: template
            value_template: '{{ v | default(0) is even }}'
          then:
          - action: script.s1
            data:
              v: '{{ v | default(0) + 1 }}'
          else:
          - event: mark
            event_data:
              id: s0.2
              v: '{{ v | default(0) }}'
              st: '{{ states(''script.s0'') }}'
              cur: '{{ state_attr(''script.s0'', ''current'') }}'
          - action: test.m
            data:
              id: s0.3
              v: '{{ v | default(0) }}'
  s1:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
steps:
- at: 2
  call: s2
  data:
    v: 3
  return_response: true
- at: 5
  call: s2
- at: 5
  call: s2
  return_response: true
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s0
    variables:
      v: 3
- at: 6
  call: s0
- at: 8
  call: s0
  return_response: true
- at: 9
  call: s2
  data:
    v: 4
  return_response: true
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s3
- at: 14
  call: s3
  data:
    v: 1
- at: 15
  call: s2
  return_response: true
- at: 16
  call: s3
- at: 19
  result: 1
  response:
    n: 1
- at: 20
  result: 0
  ok: false
  error_kind: ha_error

description: random scenario seed=202 index=6
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - delay: 1
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - variables:
        out:
          id: s2.4
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s2.5
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
steps:
- at: 1
  call: turn_off
  data:
    entity_id: all
- at: 2
  call: turn_off
  data:
    entity_id: script.s0
- at: 4
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: s0
  return_response: true
- at: 7
  result: 0
  response:
    n: 0
- at: 8
  call: s1
- at: 10
  call: s0
- at: 13

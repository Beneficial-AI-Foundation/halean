description: random scenario seed=202 index=121
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - delay: 1
    - repeat:
        count: 2
        sequence:
        - action: script.s3
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
          continue_on_error: true
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
  s4:
    icon: mdi:script
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - parallel:
        - sequence:
          - delay: 3
          - event: mark
            event_data:
              id: s4.7
        - sequence:
          - variables:
              out:
                id: s4.8
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
      - action: test.m
        data:
          id: s4.9
          v: '{{ v | default(0) }}'
        response_variable: r
steps:
- at: 1
  call: s2
- at: 4
  call: s3
- at: 5
  result: 0
  ok: false
  error_kind: other
- at: 8
  call: s3
  data:
    v: 0
  return_response: true
- at: 9
  call: turn_off
  data:
    entity_id: all
- at: 10
  call: s1
  return_response: true
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 14
  call: turn_off
  data:
    entity_id: script.s2
- at: 17
  result: 1
  response:
    n: 1

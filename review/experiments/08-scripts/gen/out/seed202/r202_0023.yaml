description: random scenario seed=202 index=23
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.toggle
        target:
          entity_id: script.s1
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        response_variable: r
      else:
      - event: mark
        event_data:
          id: s0.1
          v: '{{ v | default(0) }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - variables:
        out:
          id: s1.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    alias: Script 2 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - variables:
        out:
          id: s2.6
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 1
  call: s2
  data:
    v: 4
- at: 2
  call: s0
- at: 2
  call: s0
  data:
    v: 2
- at: 3
  call: s0
  return_response: true
- at: 4
- at: 5
  result: 0
  response:
    n: 0
- at: 6
  result: 1
  response:
    n: 1
- at: 7
  result: 2
  response:
    n: 2
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s2
    - script.s1
    variables:
      v: 1
- at: 9
  reload:
    s0:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: script.toggle
          target:
            entity_id: script.s1
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          response_variable: r
        else:
        - event: mark
          event_data:
            id: s0.1
            v: '{{ v | default(0) }}'
      - action: script.s0
        data:
          v: '{{ v | default(0) + 1 }}'
    s1:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.2
          v: '{{ v | default(0) }}'
        response_variable: r
      - condition: template
        value_template: '{{ v | default(0) < 2 }}'
      - variables:
          out:
            id: s1.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s1.4
          v: '{{ v | default(0) }}'
        continue_on_error: true
- at: 10
  call: s0
- at: 11
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s1
    variables:
      v: 3

        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
    - action: script.turn_off
      target:
        entity_id: script.s2
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:

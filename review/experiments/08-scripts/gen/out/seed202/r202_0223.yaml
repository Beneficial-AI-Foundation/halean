    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s1.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s1.6
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark

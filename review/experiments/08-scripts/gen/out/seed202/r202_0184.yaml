description: random scenario seed=202 index=184
scripts:
  s0:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - delay: 2
    - action: script.toggle
      target:
        entity_id: script.s3
  s1:
    alias: Script 1 A
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_off
      target:
        entity_id: script.s1
    - delay: 3
  s3:
    alias: Script 3 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - event: mark
        event_data:
          id: s3.2
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
      else:
      - action: test.m
        data:
          id: s3.3
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      - delay: 1
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s4.4
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s2

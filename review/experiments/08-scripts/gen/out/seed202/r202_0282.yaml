description: random scenario seed=202 index=282
scripts:
  s0:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s1'') }}'
        cur: '{{ state_attr(''script.s1'', ''current'') }}'
  s1:
    alias: Script 1 B
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
  call: s1
- at: 1
  call: s0
- at: 3
  call: s2
  data:
    v: 2
- at: 5
  call: s2
  return_response: true
- at: 6
  call: s0
  data:
    v: 4
  return_response: true
- at: 6
  call: s0
- at: 7
  call: s2
- at: 9
  call: s2
  data:
    v: 1
- at: 9
  call: s0
  data:
    v: 0
- at: 9
  call: s0

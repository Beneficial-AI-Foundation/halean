description: random scenario seed=202 index=251
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - variables:
        out:
          id: s1.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s1.2
        v: '{{ v | default(0) }}'
    - delay: 1
  s2:
    alias: Script 2 B
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - variables:
        out:
          id: s3.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s1
  data:
    v: 1
  return_response: true
- at: 4
  call: s3
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 6
  call: s3
  data:
    v: 3
- at: 7
  call: s1
  data:
    v: 1
- at: 7
  call: s0
  data:
    v: 2
  return_response: true
- at: 8
  call: turn_off
  data:
    entity_id: script.s1
- at: 11
  call: s0
  return_response: true
- at: 13
  result: 0
  response:
    n: 0
- at: 14
  call: s0
  return_response: true
- at: 15
  call: s3
  data:
    v: 2
- at: 15
  call: s1

description: random scenario seed=202 index=74
scripts:
  s0:
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - parallel:
      - sequence:
        - event: mark
          event_data:
            id: s0.2
            v: '{{ v | default(0) }}'
        - delay: 3
      - sequence:
        - variables:
            out:
              id: s0.3
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
  s1:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - stop: bad
      error: true
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.4
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      response_variable: r
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s2.6
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s0
- at: 2
- at: 5
  call: s3
- at: 5
  call: s2
  return_response: true
- at: 5
  call: s3
  data:
    v: 0
- at: 6
  call: s0
  return_response: true
- at: 8
  call: s0
- at: 8
  result: 0
  response:
    n: 0

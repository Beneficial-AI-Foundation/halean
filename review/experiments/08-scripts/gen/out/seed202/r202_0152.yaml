description: random scenario seed=202 index=152
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
      response_variable: r
    - stop: bad
      error: true
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - delay: 1
        - event: mark
          event_data:
            id: s1.3
            v: '{{ v | default(0) }}'
            r: '{{ r | default(''undef'') }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s3:
    alias: Script 3 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - delay: 1
    - event: mark
      event_data:
        id: s3.7
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s3'') }}'
        cur: '{{ state_attr(''script.s3'', ''current'') }}'
    - delay: 1
  s4:
    alias: Script 4 B
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s4.8
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
    - stop: bad
      error: true
steps:
- at: 2
  call: s2
- at: 3
  call: s4
  data:
    v: 3
- at: 5
  call: turn_off
  data:
    entity_id: script.s2
- at: 6
  result: 0
  response:
    n: 0
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 10
  call: s3
  data:
    v: 0
  return_response: true
- at: 11
  call: s4
- at: 11
  result: 1
  response:
    n: 1
- at: 13
  call: turn_off
  data:
    entity_id: all
- at: 16
  call: s1
  data:
    v: 4
  return_response: true
- at: 17
  call: s0
  data:
    v: 2
- at: 18
  call: s2
- at: 20
  result: 2
  response:
    n: 2
- at: 21
  call: s2
  data:
    v: 3
- at: 22
  result: 3
  response:
    n: 3
- at: 24

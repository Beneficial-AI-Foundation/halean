description: random scenario seed=202 index=66
scripts:
  s0:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 1
    - stop: bad
      error: true
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
  s2:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.1
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.turn_off
      target:
        entity_id: script.s2
    - action: script.turn_off
      target:
        entity_id: script.s2

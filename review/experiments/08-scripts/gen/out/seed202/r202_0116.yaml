description: random scenario seed=202 index=116
scripts:
  s0:
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.toggle
          target:
            entity_id: script.s2
    - stop: bad
      error: true
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    alias: Script 2 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.toggle
      target:
        entity_id: script.s3
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        this: '{{ this.state }}/{{ this.attributes.current }}'
  s3:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: test.m
      data:
        id: s3.4
        v: '{{ v | default(0) }}'
      response_variable: r
  s4:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
  call: s3
  data:
    v: 4
- at: 1
  call: turn_off
  data:
    entity_id: script.s2
- at: 3
  call: s2
  return_response: true
- at: 4
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 7
  call: turn_off
  data:
    entity_id: script.s1
- at: 8
  call: turn_off
  data:
    entity_id: all
- at: 10
  reload:
    s0:
      mode: parallel
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - repeat:
          count: 2
          sequence:
          - action: script.toggle
            target:
              entity_id: script.s2
      - stop: bad
        error: true
    s1:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - event: mark
        event_data:
          id: s1.1
          v: '{{ v | default(0) }}'
    s2:
      alias: Script 2 B
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.toggle
        target:
          entity_id: script.s3
      - event: mark
        event_data:
          id: s2.2
          v: '{{ v | default(0) }}'
          this: '{{ this.state }}/{{ this.attributes.current }}'
    s3:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s3.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: test.m
        data:
          id: s3.4
          v: '{{ v | default(0) }}'
        response_variable: r
    s4:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s4.5
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      - action: script.s3
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
      - action: test.m
        data:
          id: s4.6
          v: '{{ v | default(0) }}'
        response_variable: r
        continue_on_error: true
      alias: Reloaded s4
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s4
- at: 11
  call: s2
- at: 12
  call: s4
  return_response: true
- at: 15
  call: s2
  data:
    v: 3
- at: 16
  call: turn_off
  data:
    entity_id: all

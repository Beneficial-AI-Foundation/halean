description: random scenario seed=202 index=250
scripts:
  s0:
    alias: Script 0 B
    icon: mdi:script
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - parallel:
      - sequence:
        - variables:
            out:
              id: s0.1
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
        - delay: 3
      - sequence:
        - variables:
            out:
              id: s0.2
              v: '{{ v | default(0) }}'
        - stop: done
          response_variable: out
  s1:
    alias: Script 1 B
    mode: parallel
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - action: script.s1
          data:
            v: '{{ v | default(0) + 1 }}'
          continue_on_error: true
        - action: test.m
          data:
            id: s1.3
            v: '{{ v | default(0) }}'
          response_variable: r
    - action: test.m
      data:
        id: s1.4
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: test.m
        data:
          id: s2.5
          v: '{{ v | default(0) }}'
        response_variable: r
steps:
- at: 1
  call: s0
  data:
    v: 1
- at: 3
  call: turn_on
  data:
    entity_id:
    - script.s0
    - script.s2
    variables:
      v: 0
- at: 5
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s2
- at: 6
  result: 0
  response:
    n: 0
- at: 9
  call: turn_off
  data:
    entity_id: all
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 12
  result: 1
  response:
    n: 1
- at: 13
  reload:
    s0:
      alias: Script 0 B
      icon: mdi:script
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - parallel:
        - sequence:
          - variables:
              out:
                id: s0.1
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
          - delay: 3
        - sequence:
          - variables:
              out:
                id: s0.2
                v: '{{ v | default(0) }}'
          - stop: done
            response_variable: out
    s2:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - if:
        - condition: template
          value_template: '{{ v | default(0) is even }}'
        then:
        - action: test.m
          data:
            id: s2.5
            v: '{{ v | default(0) }}'
          response_variable: r
- at: 14
  result: 2
  response:
    n: 2
- at: 15
  call: s2
  data:
    v: 1
  return_response: true
- at: 16
  call: s2
- at: 16
  result: 3
  response:
    n: 3
- at: 16
  call: turn_off
  data:
    entity_id: script.s0
- at: 17
  call: turn_off
  data:
    entity_id:
    - script.s0
    - script.s2

description: random scenario seed=202 index=243
scripts:
  s0:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s2
    - delay: 1
  s1:
    alias: Script 1 A
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s1.3
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.toggle
      target:
        entity_id: script.s2
  s2:
    alias: Script 2 B
    mode: parallel
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s3.5
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
steps:
- at: 3
  call: s0
  data:
    v: 0
- at: 4
  call: s1
- at: 5
- at: 8
  call: s2
  data:
    v: 1
- at: 8
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s2
    variables:
      v: 4
- at: 9
  call: s2
  data:
    v: 3
- at: 10
- at: 11
  call: s1
  data:
    v: 3
  return_response: true
- at: 12
  result: 0
  response:
    n: 0
- at: 13
  result: 2
  response:
    n: 2
- at: 14
  call: turn_on
  data:
    entity_id:
    - script.s1
    - script.s0
    variables:
      v: 1

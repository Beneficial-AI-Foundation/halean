description: random scenario seed=202 index=285
scripts:
  s0:
    alias: Script 0 B
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s3
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
  s2:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s4'') }}'
        cur: '{{ state_attr(''script.s4'', ''current'') }}'
    - action: test.m
      data:
        id: s2.5
        v: '{{ v | default(0) }}'
    - delay: 1
  s3:
    alias: Script 3 B
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
  s4:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: test.m
      data:
        id: s4.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s4.7
        v: '{{ v | default(0) }}'
      continue_on_error: true
steps:
- at: 1
  call: s1
- at: 2
  call: s2
  data:
    v: 2
- at: 3
  call: s1
  data:
    v: 0
  return_response: true
- at: 5
  call: turn_off
  data:
    entity_id: script.s4
- at: 7
  result: 0
  response:
    n: 0
- at: 10
  call: s0
  data:
    v: 1
  return_response: true
- at: 11
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 11
  call: turn_off
  data:
    entity_id: script.s2
- at: 12
  result: 2
  response:
    n: 2

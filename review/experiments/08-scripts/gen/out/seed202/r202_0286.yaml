description: random scenario seed=202 index=286
scripts:
  s0:
    alias: Script 0 A
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - repeat:
        count: 2
        sequence:
        - condition: template
          value_template: '{{ v | default(0) < 2 }}'
        - action: script.turn_on
          target:
            entity_id:
            - script.s1
            - script.s2
          data:
            variables:
              v: '{{ v | default(0) + 10 }}'
    - delay: 3
  s1:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
    - action: script.turn_off
      target:
        entity_id: script.s1
  s2:
    icon: mdi:script
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 2
    - action: test.m
      data:
        id: s2.2
        v: '{{ v | default(0) }}'
      response_variable: r
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s4
      data:
        v: '{{ v | default(0) + 1 }}'
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
  s4:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s4.5
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s1
  data:
    v: 2
  return_response: true
- at: 2
- at: 4
  result: 0
  response:
    n: 0
- at: 4
  call: s2
  data:
    v: 1
  return_response: true
- at: 4
  call: turn_on
  data:
    entity_id:
    - script.s1
- at: 7
  result: 1
  response:
    n: 1
- at: 9
  result: 2
  response:
    n: 2
- at: 10
  call: s4
- at: 11
  call: s2
  data:
    v: 2
- at: 12
- at: 12
- at: 14
  call: toggle
  data:
    entity_id:
    - script.s0
    - script.s2
- at: 16
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
- at: 17
  call: s4
  data:
    v: 0
  return_response: true
- at: 18
  call: s3
  data:
    v: 4
  return_response: true

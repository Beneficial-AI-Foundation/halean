description: random scenario seed=202 index=177
scripts:
  s0:
    mode: queued
    max: 2
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - delay: 1
  s3:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s3.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
    - event: mark
      event_data:
        id: s3.4
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
steps:
- at: 2
  call: turn_off
  data:
    entity_id: all
- at: 5
  call: s2
  data:
    v: 2
- at: 6
  call: s1
  return_response: true
- at: 8
  call: toggle
  data:
    entity_id:
    - script.s0
- at: 9
  result: 0
  response:
    n: 0
- at: 10
  call: s2
  data:
    v: 1
- at: 11
- at: 12
  call: turn_off
  data:
    entity_id: all
- at: 13
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 13
  call: s3
  data:
    v: 2
  return_response: true
- at: 13
  call: turn_off
  data:
    entity_id:
    - script.s3
    - script.s2
- at: 15
  call: s0
  data:
    v: 4
  return_response: true
- at: 17
  call: s0
  data:
    v: 2
- at: 18
  call: s2

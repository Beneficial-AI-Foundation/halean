description: random scenario seed=202 index=64
scripts:
  s0:
    alias: Script 0 B
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
  s1:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s1.1
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
steps:
- at: 2
  call: s0
  data:
    v: 4
- at: 3
  call: s1
  data:
    v: 4
- at: 3
  call: s0
  data:
    v: 2
  return_response: true
- at: 3
  call: s0
  data:
    v: 0
- at: 5
  call: s0
- at: 6
  call: turn_off
  data:
    entity_id: script.s1
- at: 7
  call: s2
- at: 8
  result: 0
  response:
    n: 0
- at: 9
  call: s1
  data:
    v: 3
  return_response: true
- at: 9
  call: s2
  data:
    v: 3
  return_response: true
- at: 10
  result: 1
  ok: false
  error_kind: invalid
- at: 13
  call: s2
  return_response: true
- at: 15
  call: s2
  data:
    v: 3
  return_response: true
- at: 16
  result: 2
  ok: false
  error_kind: invalid
- at: 19

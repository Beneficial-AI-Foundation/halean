description: random scenario seed=202 index=22
scripts:
  s0:
    mode: parallel
    max: 2
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
    - condition: template
      value_template: '{{ v | default(0) < 2 }}'
    - event: mark
      event_data:
        id: s0.1
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
    - action: test.m
      data:
        id: s0.2
        v: '{{ v | default(0) }}'
  s1:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s2:
    mode: queued
    max: 3
    fields:
      v: {}
      r: {}
    sequence:
    - stop: bad
      error: true
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
    - repeat:
        count: 2
        sequence:
        - action: test.m
          data:
            id: s2.4
            v: '{{ v | default(0) }}'
  s3:
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s3.5
        v: '{{ v | default(0) }}'
  s4:
    alias: Script 4 A
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - event: mark
      event_data:
        id: s4.6
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s0'') }}'
        cur: '{{ state_attr(''script.s0'', ''current'') }}'
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s4
    variables:
      v: 0
- at: 4
  call: s1
  data:
    v: 0
- at: 5
  result: 0
  response:
    n: 0
- at: 5
  call: s2
  data:
    v: 1
- at: 6
  call: s2
- at: 7
  call: s4
  data:
    v: 3
- at: 7
  call: s2
  data:
    v: 0
- at: 10
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 1
- at: 12
  call: s0
  data:
    v: 4
- at: 13
  reload:
    s0:
      mode: parallel
      max: 2
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.s2
      - condition: template

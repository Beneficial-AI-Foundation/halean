          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
      - action: test.m
        data:
          id: s0.2
          v: '{{ v | default(0) }}'
    s1:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
        continue_on_error: true
    s2:
      mode: queued
      max: 3
      fields:
        v: {}
        r: {}
      sequence:
      - stop: bad
        error: true
      - action: test.m
        data:
          id: s2.3
          v: '{{ v | default(0) }}'
      - repeat:
          count: 2
          sequence:
          - action: test.m
            data:
              id: s2.4
              v: '{{ v | default(0) }}'
    s3:
      mode: single
      fields:
        v: {}
        r: {}
      variables:

description: random scenario seed=202 index=298
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - action: script.toggle
      target:
        entity_id: script.s1
    - if:
      - condition: template
        value_template: '{{ v | default(0) is even }}'
      then:
      - action: script.turn_off
        target:
          entity_id: script.s1
      - action: script.turn_on
        target:
          entity_id:
          - script.s1
          - script.s2

        - action: script.turn_off
          target:
            entity_id: script.s2
        - delay: 1
      - sequence:
        - delay: 3
        - event: mark
          event_data:
            id: s2.2
            v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'

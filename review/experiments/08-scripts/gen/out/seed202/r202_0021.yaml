description: random scenario seed=202 index=21
scripts:
  s0:
    mode: single
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s0.1
        v: '{{ v | default(0) }}'
      continue_on_error: true
  s1:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 1
    - variables:
        out:
          id: s1.2
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - variables:
        out:
          id: s2.3
          v: '{{ v | default(0) }}'
    - stop: done
      response_variable: out
steps:
- at: 1
  call: s1
  data:
    v: 3
  return_response: true
- at: 4
  call: turn_off
  data:
    entity_id: script.s0
- at: 7
  call: toggle
  data:
    entity_id:
    - script.s2
- at: 7
  call: s1
  data:
    v: 2
- at: 9
  call: turn_off
  data:
    entity_id:
    - script.s1
    - script.s0
- at: 10
  reload:
    s0:
      mode: single
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s0.1
          v: '{{ v | default(0) }}'
        continue_on_error: true
    s1:
      mode: parallel
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s2
        data:
          v: '{{ v | default(0) + 1 }}'
      - delay: 1
      - variables:
          out:
            id: s1.2
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
      alias: Reloaded s1
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - variables:
          out:
            id: s2.3
            v: '{{ v | default(0) }}'
      - stop: done
        response_variable: out
- at: 11
  call: turn_off
  data:
    entity_id: script.s0
- at: 12
  call: toggle
  data:
    entity_id:
    - script.s0

description: random scenario seed=202 index=37
scripts:
  s0:
    icon: mdi:script
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s2
        - script.s1
      data:
        variables:
          v: '{{ v | default(0) + 10 }}'
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
        - script.s2
  s1:
    alias: Script 1 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
  s2:
    mode: restart
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s1
      data:
        v: '{{ v | default(0) + 1 }}'
    - delay: 1
    - event: mark
      event_data:
        id: s2.2
        v: '{{ v | default(0) }}'
        r: '{{ r | default(''undef'') }}'
steps:
- at: 1
  call: s0
- at: 2
  result: 0
  response:
    n: 0
- at: 5
  call: s1
  data:
    v: 4
- at: 6
  result: 1
  response:
    n: 1
- at: 8
  result: 2
  response:
    n: 2
- at: 9
  reload:
    s1:
      alias: Script 1 B
      mode: queued
      fields:
        v: {}
        r: {}
      sequence:
      - action: test.m
        data:
          id: s1.1
          v: '{{ v | default(0) }}'
    s2:
      mode: restart
      fields:
        v: {}
        r: {}
      sequence:
      - action: script.s1
        data:
          v: '{{ v | default(0) + 1 }}'
      - delay: 1
      - event: mark
        event_data:
          id: s2.2
          v: '{{ v | default(0) }}'
          r: '{{ r | default(''undef'') }}'
- at: 10
  result: 3
  response:
    n: 3
- at: 11
- at: 12
  call: s1
  data:
    v: 1
  return_response: true

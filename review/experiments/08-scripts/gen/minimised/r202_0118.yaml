description: random scenario seed=202 index=118
scripts:
  s0:
    alias: Script 0 B
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.turn_on
      target:
        entity_id:
        - script.s1
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'
      continue_on_error: true
  s1:
    alias: Script 1 A
    mode: single
    fields:
      v: {}
      r: {}
    variables:
      v: 100
    sequence:
    - action: test.m
      data:
        id: s1.1
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s1.2
        v: '{{ v | default(0) }}'
        st: '{{ states(''script.s2'') }}'
        cur: '{{ state_attr(''script.s2'', ''current'') }}'
  s2:
    mode: parallel
    fields:
      v: {}
      r: {}
    sequence:
    - delay: 3
    - action: script.turn_off
      target:
        entity_id: script.s1
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
  s3:
    mode: queued
    fields:
      v: {}
      r: {}
    sequence:
    - action: script.s2
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
    - action: script.s0
      data:
        v: '{{ v | default(0) + 1 }}'
      response_variable: r
      continue_on_error: true
steps:
- at: 1
  call: turn_on
  data:
    entity_id:
    - script.s2
    variables:
      v: 4
- at: 2
  call: toggle
  data:
    entity_id:
    - script.s1
- at: 5
  call: turn_on
  data:
    entity_id:
    - script.s3
    - script.s0
    variables:
      v: 0
- at: 6
  result: 1
  response:
    n: 1
- at: 14
  call: turn_off
  data:
    entity_id: all

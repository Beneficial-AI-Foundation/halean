        v: '{{ v | default(0) }}'
      continue_on_error: true
    - action: test.m
      data:
        id: s2.3
        v: '{{ v | default(0) }}'
      response_variable: r
    - event: mark
      event_data:
        id: s2.4
        v: '{{ v | default(0) }}'
  s3:
    mode: restart

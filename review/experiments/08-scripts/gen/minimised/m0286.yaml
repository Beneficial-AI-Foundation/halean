    - event: mark
      event_data:
        id: s3.6
        v: '{{ v | default(0) }}'
    - action: test.m
      data:
        id: s3.7
        v: '{{ v | default(0) }}'
    - action: script.s3
      data:
        v: '{{ v | default(0) + 1 }}'

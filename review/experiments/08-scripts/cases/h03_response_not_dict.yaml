description: stop with a string / number / non-empty list response; error only for a caller that asks for the response.
scripts:
  text:
    sequence:
      - variables: {out: hello}
      - stop: done
        response_variable: out
  num:
    sequence:
      - variables: {out: 5}
      - stop: done
        response_variable: out
steps:
  - {at: 1, call: text, return_response: true}
  - {at: 2, call: text}
  - {at: 3, call: num, return_response: true}

description: turn_on / turn_off / toggle with an entity_id that is not a valid entity id (schema error, vol.Invalid).
scripts:
  a:
    sequence:
      - action: test.a
steps:
  - {at: 1, call: turn_on, data: {entity_id: "not an id"}}
  - {at: 2, call: turn_off, data: {entity_id: 5}}
  - {at: 3, call: toggle, data: {entity_id: [script.a, "bad id"]}}

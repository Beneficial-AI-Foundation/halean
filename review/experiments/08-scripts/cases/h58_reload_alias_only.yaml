description: A reload that changes only the alias and icon of an idle script; last_triggered is restored.
scripts:
  a:
    alias: Old name
    sequence:
      - event: a_ran
steps:
  - {at: 1, call: a}
  - at: 2
    reload:
      a:
        alias: New name
        icon: mdi:new-box
        sequence:
          - event: a_ran
  - {at: 3, call: a}

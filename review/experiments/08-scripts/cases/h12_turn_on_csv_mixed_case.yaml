description: turn_on with a comma-separated, mixed-case entity_id string; order of starts is the component's order, not the list's.
scripts:
  a:
    sequence:
      - action: test.a
  b:
    sequence:
      - action: test.b
steps:
  - {at: 1, call: turn_on, data: {entity_id: "Script.B , script.a"}}
  - {at: 2, call: turn_off, data: {entity_id: [SCRIPT.A]}}

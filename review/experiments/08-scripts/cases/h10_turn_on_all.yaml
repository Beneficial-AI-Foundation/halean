description: turn_on with entity_id all starts every script in the component's order; turn_off all stops them.
scripts:
  zed:
    sequence:
      - action: test.zed
  alpha:
    sequence:
      - action: test.alpha
  mid:
    sequence:
      - event: mid_ran
steps:
  - {at: 1, call: turn_on, data: {entity_id: all}}
  - {at: 2, call: turn_off, data: {entity_id: ALL}}

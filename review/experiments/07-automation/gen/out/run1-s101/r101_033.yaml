# random scenario, seed 101, index 33 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: [light.l2, input_boolean.b1]
    from: unavailable
  - {trigger: state, entity_id: light.l1, from: 3, attribute: lvl}
  - {trigger: event, event_type: e2}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.id }}'}
  - sequence:
    - repeat:
        for_each: '{{ [''x'', 1] }}'
        sequence:
        - parallel:
          - sequence:
            - {delay: '{{ 1 }}'}
            - {event: m_2}
            - {delay: '{{ 1 }}'}
          - sequence:
            - {event: m_3}
            - condition: and
              conditions:
              - {condition: time, after: '23:00:00', before: '06:00'}
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - repeat:
            count: '{{ 2 }}'
            sequence:
            - {action: test.s4}
        - condition: not
          conditions:
          - and:
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
            - {condition: time, before: '22:14'}
          - {condition: trigger, id: '1'}
          - '{{ trigger.id == ''0'' }}'
- alias: a1
  id: id1
  variables: {v1: 0}
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s1
    above: 6
    below: 15
    for: {seconds: 2}
  - {trigger: event, event_type: e2}
  actions:
  - delay: {seconds: 1}
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.s2
      to: [abc, '12']
      not_from: '7.5'
    timeout: {seconds: 2}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
- alias: a2
  id: id2
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, for: 2}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: '{{ 2 }}', id: alpha}
  - {trigger: event, event_type: e3}
  conditions:
  - condition: and
    conditions:
    - {condition: state, entity_id: light.l1, state: 'on', for: '00:00:03'}
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
      - '{{ trigger.id == ''0'' }}'
  actions:
  - action: test.s5
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - repeat:
      for_each: []
      sequence:
      - wait_for_trigger:
        - trigger: numeric_state
          entity_id: sensor.s1
          above: 3
          below: 10
          for: {seconds: 2}
        - {trigger: state, entity_id: light.l1}
        timeout: 3
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          - if: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
            then:
            - {action: test.s6, response_variable: v2}
            - event: m_7
              event_data: {n: 7, v: '{{ trigger.id }}'}
            else:
            - {delay: 0}
            - {action: test.s8}
          - {stop: s}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: tick}
- at: 8
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 11
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 12
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 13
  set: [sensor.s1, '1']
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 18
  set: [light.l1, 'off']
- at: 19
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 22
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 25
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: tick}
- at: 30
  send: {type: event, event_type: tick}
- at: 30
  set: [sensor.s2, abc]
- at: 30
  send: {type: event, event_type: tick}
- at: 32
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 33
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 34
  send: {type: event, event_type: tick}
- at: 35
  send: {type: event, event_type: e2}
- at: 36
  send: {type: event, event_type: e3}
- at: 37
  send: {type: event, event_type: tick}

# random scenario, seed 101, index 293 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, for: '00:00:02'}
  - {trigger: state, entity_id: light.l1, from: 'on'}
  conditions:
  - {condition: state, entity_id: input_boolean.b1, state: unavailable}
  actions:
  - {action: test.s1}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.platform }}'}
  - action: test.s3
    data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target:
      entity_id: [light.l1, light.l2]
  - action: test.s4
    data: {n: 4, v: '{{ this.attributes.current }}'}
    continue_on_error: true
- alias: a1
  id: id1
  mode: parallel
  max: 2
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - parallel:
    - event: m_5
      event_data: {n: 5, v: '{{ trigger.description }}'}
    - {event: m_6}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - delay: {seconds: 1}
  - event: m_7
    event_data: {n: 7, v: '{{ trigger.description }}'}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: parallel
  triggers:
  - {trigger: event, event_type: e1}
  actions:
  - {stop: s}
  - action: test.s8
    data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
    continue_on_error: true
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 3
  set: [light.l1, unavailable]
- at: 6
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 8
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 10
  send: {type: event, event_type: e1}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [light.l1, 'on']
- at: 14
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 19
  set: [light.l2, unavailable]
- at: 22
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 23
  set: [sensor.s1, '7.5']
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 27
  set: [sensor.s2, abc]
- at: 29
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 30
  set: [sensor.s1, unavailable]
- at: 31
  send: {type: event, event_type: e1}
- at: 31
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 32
  set: [sensor.s2, unknown]
- at: 33
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}

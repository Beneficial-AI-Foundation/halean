# random scenario, seed 101, index 237 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: time_pattern, seconds: 31}
  - {trigger: event, event_type: e1}
  conditions:
  - condition: not
    conditions:
    - {condition: trigger, id: alpha}
    - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9, enabled: false}
  - {condition: time, before: '22:13:30', weekday: tue}
  actions:
  - repeat:
      while:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.id }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: time, before: '22:14'}
        - '{{ states(''sensor.s2'') | float(0) < 15 }}'
      sequence:
      - action: test.s2
        data: {n: 2, v: '{{ trigger.description }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    default:
    - parallel:
      - {event: m_3}
      - sequence:
        - action: test.s4
          data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
          response_variable: v1
    - if:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
      - '{{ states(''sensor.s1'') | int > 5 }}'
      then:
      - {stop: s}
      else:
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '00:00:03'}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
      - parallel:
        - sequence:
          - {delay: '{{ 1 }}'}
        - sequence:
          - delay: {seconds: 1}
          - variables:
              v2: [a, '{{ 1 + 1 }}']
    - condition: and
      conditions:
      - and:
        - {condition: time, after: '23:00:00', before: '06:00'}
        - {condition: trigger, id: '1', enabled: false}
        - {condition: time, after: '23:00:00'}
      - '{{ trigger.platform == ''event'' }}'
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.id }}'}
  - sequence:
    - {stop: s}
    enabled: false
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 3
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: e3}
- at: 7
  send: {type: service_result, call_id: 0, ok: true}
- at: 10
  set: [sensor.s1, '12']
- at: 11
  send: {type: event, event_type: e3}
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'off']
- at: 18
  set: [sensor.s1, '20']
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, unavailable]
- at: 22
  send: {type: event, event_type: e2}
- at: 22
  set: [light.l2, unavailable]
- at: 23
  set: [sensor.s2, unavailable]
- at: 24
  set: [sensor.s1, '1']
- at: 25
  set: [light.l2, 'off']

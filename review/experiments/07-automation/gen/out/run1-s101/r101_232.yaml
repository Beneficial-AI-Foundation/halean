# random scenario, seed 101, index 232 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - {event: m_1}
  - if:
    - and:
      - {condition: time, after: '22:13:25', before: '06:00'}
    then:
    - if:
      - {condition: trigger, id: '0'}
      then:
      - {event: m_2}
      - {delay: 1}
      continue_on_error: true
    - action: test.s3
      data: {n: 3, v: '{{ trigger.idx }}'}
  - {stop: s}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 2
  set: [sensor.s2, '4']
- at: 5
  set: [sensor.s1, '4']
- at: 6
  set: [input_boolean.b1, 'off']
- at: 7
  set: [sensor.s2, '12']
  attributes: {lvl: 1}
- at: 9
  set: [light.l2, 'off']
- at: 9
  send: {type: event, event_type: e1}
- at: 10
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'off']
- at: 18
  set: [input_boolean.b1, unavailable]
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 23
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e3}

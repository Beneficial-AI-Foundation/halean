    type: event
    event_type: e3
    data: {k: a}
- at: 4
  set: [light.l2, 'on']
- at: 4
  set: [sensor.s1, unknown]
- at: 5
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 10
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 12

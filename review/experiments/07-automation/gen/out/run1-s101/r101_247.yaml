# random scenario, seed 101, index 247 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  - {trigger: event, event_type: e1}
  conditions:
  - {condition: time, before: '22:14'}
  actions:
  - sequence:
    - repeat:
        count: 1
        sequence:
        - event: m_1
          event_data: {n: 1, v: '{{ trigger.platform }}'}
        - parallel:
          - event: m_2
            event_data: {n: 2, v: '{{ now().second }}'}
          - sequence:
            - action: test.s3
              data: {n: 3, v: '{{ trigger.id }}'}
              continue_on_error: true
            - variables: {v1: x}
        - wait_for_trigger:
          - {trigger: event, event_type: e2}
          timeout: 0
        - event: m_4
          event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - {condition: trigger, id: '0'}
    - event: m_5
      event_data: {n: 5, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  - sequence:
    - {event: m_6}
  - action: test.s7
    data: {n: 7, v: '{{ trigger.id }}'}
  - {event: m_8}
  - {event: m_9}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 2}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 1}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s1, '12']
- at: 3

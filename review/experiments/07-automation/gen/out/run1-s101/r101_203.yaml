# random scenario, seed 101, index 203 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  variables: {v1: 0}
  triggers:
  - trigger: state
    entity_id: sensor.s2
    from: ['4', unavailable]
  conditions:
  - not:
    - and:
      - {condition: time, before: '06:00', weekday: tue}
      enabled: false
    - {condition: trigger, id: '0'}
  actions:
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l2, for: '{{ 2 }}'}
    timeout: 2
  - condition: state
    entity_id: [input_boolean.b1]
    state: 'on'
    match: any
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: light.l2
    not_to: 'off'
    from: ['off', 'on']
  - trigger: event
    event_type: e2
    event_data: {k: true}
  conditions:
  - '{{ is_state(''light.l2'', ''off'') }}'
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - action: test.s2
    data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - delay: {seconds: 1}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
      sequence:
      - {stop: s}
      - delay: {seconds: 1}
      - repeat:
          for_each: '{{ states(''light.l1'') }}'
          sequence:
          - {stop: s}
    - conditions:
      - '{{ states(''sensor.s1'') | int(0) > 3 }}'
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      sequence:
      - action: test.s3
        data: {n: 3, v: '{{ trigger.id }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        enabled: false
    default:
    - {delay: '{{ 1 }}'}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [sensor.s1, unknown]
- at: 0
  set: [input_boolean.b1, unavailable]
- at: 0
  set: [input_boolean.b1, 'off']
- at: 1
  set: [input_boolean.b1, unavailable]
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 3
  send: {type: event, event_type: e3}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s2, abc]
- at: 7
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 10
  set: [input_boolean.b1, 'on']
- at: 13
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: e2}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 24
  set: [sensor.s2, abc]
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e1}
- at: 30
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 31
  send: {type: event, event_type: tick}

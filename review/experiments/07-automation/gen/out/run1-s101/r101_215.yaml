# random scenario, seed 101, index 215 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: time_pattern, seconds: 31}
  - {trigger: event, event_type: e1, id: alpha}
  actions:
  - delay: {seconds: 1}
  - sequence:
    - choose:
      - conditions:
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        sequence:
        - choose:
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
            - condition: not
              conditions:
              - not:
                - {condition: trigger, id: '0'}
                - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            sequence:
            - {action: test.s1, continue_on_error: true}
            - action: test.s2
              data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              continue_on_error: true
            - {delay: 1, enabled: false}
          - conditions: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
            sequence:
            - {action: test.s3, response_variable: v1}
            - action: test.s4
              data: {n: 4, v: '{{ states(''light.l1'') }}'}
        - choose:
          - conditions:
            - {condition: trigger, id: '1'}
            - and:
              - '{{ trigger.platform == ''event'' }}'
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
                - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
                - condition: state
                  entity_id: input_boolean.b1
                  state: ['off', unavailable]
                  for: 2
              - {condition: numeric_state, entity_id: sensor.s1, above: 6}
            sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ now().second }}'}
          default:
          - variables: {v1: 1}
          - event: m_6
            event_data: {n: 6, v: '{{ this.attributes.current }}'}
        - sequence:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - variables: {v3: x}
      default:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - if:
      - {condition: trigger, id: '1'}
      then:
      - parallel:
        - event: m_8
          event_data: {n: 8, v: '{{ trigger.id }}'}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
        - sequence:
          - action: test.s10
            data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          - {action: test.s11, continue_on_error: true}
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
      - event: m_14
        event_data: {n: 14, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - choose:
        - conditions:
          - {condition: time, after: '22:13:25', before: '22:13:30'}
          sequence:
          - event: m_12
            event_data: {n: 12, v: '{{ this.attributes.current }}', var: '{{ v2 | default(''undef'') }}'}
          - action: test.s13
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      else:
      - variables: {v1: 1}
        enabled: false
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - event: m_15
            event_data: {n: 15, v: '{{ states(''sensor.s1'') }}'}
          - {delay: '{{ 1 }}'}
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2, for: '00:00:02'}
  - event: m_16
    event_data: {n: 16, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 2
  set: [input_boolean.b1, unavailable]
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 10
  set: [light.l1, unavailable]
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 13
  set: [sensor.s2, '1']
- at: 14
  set: [input_boolean.b1, unavailable]
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [light.l1, 'on']

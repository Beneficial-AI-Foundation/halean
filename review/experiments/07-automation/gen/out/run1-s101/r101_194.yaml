# random scenario, seed 101, index 194 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: event, event_type: e2}
  - trigger: event
    event_type: e2
    event_data: {k: true}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2, continue_on_timeout: false}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  - if:
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    then:
    - {stop: s}
    - action: test.s1
      data: {n: 1, v: '{{ this.attributes.current }}'}
      target:
        entity_id: [light.l1, light.l2]
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - action: test.s2
    data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    response_variable: v2
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e2}
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.b1
      state: ['off', 'on']
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
  actions:
  - condition: not
    conditions:
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
  - {action: test.s4}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: 1, continue_on_timeout: false}
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}'}
  - sequence:
    - if:
      - {condition: trigger, id: alpha}
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      then:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - repeat:
          for_each: [a, b]
          sequence:
          - condition: trigger
            id: [beta, '0']
        continue_on_error: true
      - {event: m_5}
      else:
      - repeat:
          count: 2
          sequence:
          - {action: test.s6}
      - event: m_7
        event_data: {n: 7, v: '{{ states(''light.l1'') }}'}
      - if:
        - condition: state
          entity_id: light.l2
          state: ['on', 'off']
        then:
        - action: test.s8
          data: {n: 8, v: '{{ trigger.idx }}'}
        - {condition: trigger, id: alpha}
        else:
        - {event: m_9}
        - event: m_10
          event_data: {n: 10, v: '{{ trigger.idx }}'}
    - wait_for_trigger:
      - {trigger: state, entity_id: light.l2, from: 'off'}
      timeout: 3
    - event: m_11
      event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    continue_on_error: true
- alias: a2
  id: id2
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  conditions: ['{{ states(''sensor.s1'') | int(0) > 7 }}']
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2, continue_on_timeout: false}
  - event: m_21
    event_data: {n: 21, completed: '{{ wait.completed }}'}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_22
    event_data: {n: 22, completed: '{{ wait.completed }}'}
  - {event: m_13}
  - if:
    - {condition: time, after: '22:13:25'}
    - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
    then:
    - {event: m_14}
    - parallel:
      - sequence:
        - sequence:
          - {event: m_15}
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
        - action: test.s16
          data: {n: 16, v: '{{ trigger.id }}'}
          continue_on_error: true
          response_variable: v2
        - action: test.s17
          data: {n: 17, v: '{{ this.attributes.current }}'}
      - sequence:
        - variables:
            v2: [a, '{{ 1 + 1 }}']
        - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - event: m_18
          event_data: {n: 18, completed: '{{ wait.completed }}'}
        - wait_template: '{{ trigger.platform == ''event'' }}'
          timeout: {seconds: 2}
    else:
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: 1}
      - {trigger: event, event_type: e1}
    - event: m_19
      event_data: {n: 19, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s20
    data: {n: 20, v: '{{ trigger.id }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  set: [input_boolean.b1, 'on']
- at: 1
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 2
  set: [input_boolean.b1, 'off']
- at: 3
  set: [input_boolean.b1, unavailable]
- at: 4
  send: {type: event, event_type: e3}
- at: 5
  set: [sensor.s2, unknown]
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 5
  set: [sensor.s2, abc]
  attributes: {lvl: 2}
- at: 7
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 8
  set: [light.l1, 'on']
- at: 9
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 10
  set: [light.l2, 'on']
- at: 13
  set: [sensor.s2, '8']
  attributes: {lvl: 2}
- at: 15
  set: [sensor.s1, '8']
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 18
  set: [sensor.s2, '12']
  attributes: {lvl: 1}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 19
  set: [sensor.s1, '1']
- at: 20
  set: [light.l1, unavailable]
- at: 21
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: 2}

# random scenario, seed 101, index 284 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0}
  triggers:
  - trigger: state
    entity_id: sensor.s2
    to: [unavailable, '1']
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - {event: m_1}
  - event: m_2
    event_data: {n: 2, v: '{{ now().second }}'}
  - choose:
    - conditions:
      - condition: time
        after: '22:13:25'
        before: '22:13:30'
        weekday: [tue]
      - {condition: trigger, id: '1'}
      sequence:
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
      - repeat:
          count: 2
          sequence:
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
          - repeat:
              count: 0
              sequence:
              - {event: m_3}
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: 2, continue_on_timeout: false}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
    - conditions:
      - condition: state
        entity_id: [light.l1, sensor.s2]
        state: 'on'
        match: any
      - condition: not
        conditions:
        - condition: not
          conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
        - {condition: state, entity_id: light.l2, state: unavailable}
        - not:
          - '{{ trigger.id == ''0'' }}'
          - condition: state
            entity_id: [input_boolean.b1]
            state: 'on'
            match: any
      sequence:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: '{{ 2 }}'}
    default:
    - {stop: s, error: true}
    - repeat:
        count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
        sequence:
        - condition: not
          conditions:
          - condition: and
            conditions:
            - {condition: numeric_state, entity_id: sensor.s2, below: 15}
            - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
            - '{{ states(''sensor.s2'') | float(0) < 5 }}'
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
          enabled: false
  - choose:
    - conditions:
      - {condition: time, before: '06:00'}
      sequence:
      - repeat:
          count: 1
          sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
    default:
    - {delay: '{{ 1 }}'}
  - variables:
      v2: [a, '{{ 1 + 1 }}']
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: time, at: '22:13:33'}
  - {trigger: state, entity_id: light.l1, from: 'on'}
  actions:
  - if:
    - {condition: time, after: '22:00', before: '06:00'}
    then:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - variables: {v2: 1}
    continue_on_error: true
  - repeat:
      while:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      - '{{ repeat.index <= 1 }}'
      sequence:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - variables: {v1: 1}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: e1}
- at: 6
  set: [sensor.s1, '20']
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: e2}
- at: 11
  set: [light.l1, 'off']
- at: 12
  send: {type: event, event_type: e1}
- at: 13
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 16
  set: [light.l1, unavailable]
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: a}

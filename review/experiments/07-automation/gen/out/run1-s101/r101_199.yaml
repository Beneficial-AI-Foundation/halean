# random scenario, seed 101, index 199 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: 2, attribute: lvl}
  actions:
  - {action: test.s1}
  - variables: {v1: x}
  - sequence:
    - action: test.s2
      data: {n: 2, v: '{{ states(''light.l1'') }}'}
      continue_on_error: true
  - sequence:
    - if:
      - condition: not
        conditions:
        - {condition: state, entity_id: light.l2, state: 'on'}
        enabled: false
      then:
      - sequence:
        - variables: {v2: 1}
      continue_on_error: true
    - parallel:
      - sequence:
        - {event: m_3}
        - repeat:
            for_each: []
            sequence:
            - variables:
                v2: [a, '{{ 1 + 1 }}']
            - {action: test.s4}
            - condition: trigger
              id: [beta, '0']
      - sequence:
        - {stop: s, error: true}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: time, at: '22:13:23'}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - {delay: 1}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - if:
        - {condition: trigger, id: alpha}
        then:
        - wait_for_trigger:
          - {trigger: event, event_type: e1}
          timeout: 1
        - event: m_5
          event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        else:
        - choose:
          - conditions:
            - {condition: time, after: '22:13:25', before: '22:14', enabled: false}
            sequence:
            - delay: {seconds: '{{ 2 }}'}
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          default:
          - {condition: state, entity_id: sensor.s1, state: '7.5'}
          - {delay: '{{ 1 }}'}
      - parallel:
        - sequence:
          - choose:
            - conditions:
              - {condition: state, entity_id: input_boolean.b1, state: 'off'}
              sequence:
              - action: test.s6
                data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
                target: {entity_id: light.l1}
              - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
        - sequence:
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
          - choose:
            - conditions:
              - {condition: trigger, id: '0'}
              - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
              sequence:
              - {condition: trigger, id: alpha}
              - event: m_7
                event_data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
                enabled: false
            - conditions:
              - {condition: time, before: '06:00'}
              - {condition: trigger, id: alpha}
              sequence:
              - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - event: m_8
          event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - sequence:
    - {event: m_9}
    continue_on_error: true
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: queued
  max: 3
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: state, entity_id: light.l2, from: unavailable, to: 'on', for: '00:00:02', id: alpha}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  conditions:
  - '{{ trigger.platform == ''event'' }}'
  - condition: or
    conditions:
    - condition: trigger
      id: [beta, '0']
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - action: test.s10
    data: {n: 10, v: '{{ states(''sensor.s1'') }}'}
    response_variable: v1
  - sequence:
    - action: test.s11
      data: {n: 11, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    continue_on_error: true
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: e1}
- at: 7
  set: [sensor.s1, abc]
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 9
  set: [light.l2, 'off']
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 11
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 12
  set: [sensor.s1, unavailable]
  attributes: {lvl: 2}
- at: 15
  set: [light.l2, 'on']
- at: 15
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 16
  set: [input_boolean.b1, unavailable]
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: service_result
    call_id: 2
    ok: true
    response:
      value: [1, 2]
- at: 19
  send: {type: service_result, call_id: 3, ok: true}
- at: 20
  set: [light.l1, 'off']
- at: 21
  send: {type: event, event_type: e1}

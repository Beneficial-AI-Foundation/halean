# random scenario, seed 101, index 251 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /7}
  - {trigger: event, event_type: e1}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  conditions:
  - condition: state
    entity_id: light.l2
    state: 'on'
    for: {seconds: 1}
  actions:
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '00:00:03'}
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: a}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: light.l1
      to: 'off'
      from: [unavailable, 'off']
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - {condition: state, entity_id: sensor.s2, state: '4'}
          - condition: trigger
            id: [beta, '0']
          sequence:
          - repeat:
              for_each: '{{ [''x'', 1] }}'
              sequence:
              - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - conditions:
          - condition: not
            conditions:
            - {condition: time, before: '06:00'}
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '{{ 2 }}'}
          - event: m_1
            event_data: {n: 1, completed: '{{ wait.completed }}'}
        enabled: false
      - choose:
        - conditions:
          - condition: and
            conditions:
            - {condition: state, entity_id: sensor.s1, state: '7.5'}
            - {condition: trigger, id: '1'}
            - not:
              - {condition: numeric_state, entity_id: sensor.s1, below: 15}
              - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          sequence:
          - repeat:
              count: 0
              sequence:
              - action: test.s2
                data: {n: 2, v: '{{ trigger.id }}'}
              - event: m_3
                event_data: {n: 3, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
              - action: test.s4
                target:
                  entity_id: [light.l1, light.l2]
          - sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ trigger.idx }}'}
        default:
        - if:
          - {condition: time, before: '22:14', weekday: tue}
          then:
          - event: m_6
            event_data: {n: 6, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
          - event: m_7
            event_data: {n: 7, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
          else:
          - action: test.s8
            target: {entity_id: light.l1}
          - {event: m_9, enabled: false}
          - event: m_10
            event_data: {n: 10, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
        - {stop: s}
        - {stop: s}
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
    - sequence:
      - action: test.s11
        data: {n: 11, v: '{{ trigger.id }}'}
        response_variable: v3
  - delay: {seconds: '{{ 2 }}'}
  - delay: {seconds: 1}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s2, '12']
- at: 2
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 4
  set: [light.l1, 'off']
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 8
  set: [input_boolean.b1, 'on']
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 13
  set: [light.l1, 'on']
- at: 14
  set: [sensor.s1, '1']
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 18
  set: [sensor.s2, '1']
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [sensor.s1, '7.5']
- at: 24
  set: [light.l2, 'off']
- at: 25
  send: {type: event, event_type: e3}
- at: 26
  set: [sensor.s2, '4']

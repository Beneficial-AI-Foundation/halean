# random scenario, seed 101, index 275 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - if:
    - {condition: time, after: '23:00:00', before: '06:00'}
    then:
    - event: m_1
      event_data: {n: 1, v: '{{ now().second }}'}
    - parallel:
      - sequence:
        - sequence:
          - {action: test.s2}
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - sequence:
        - action: test.s3
          data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
          target:
            entity_id: [light.l1, light.l2]
      enabled: false
  - event: m_4
    event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
  - if:
    - condition: and
      conditions:
      - condition: or
        conditions:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - condition: trigger
          id: [beta, '0']
          enabled: false
    then:
    - parallel:
      - sequence:
        - {event: m_5, enabled: false}
        - repeat:
            for_each: []
            sequence:
            - variables: {v2: x}
      - event: m_6
        event_data: {n: 6, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
    - wait_for_trigger:
      - trigger: state
        entity_id: light.l2
        to: ['on', 'off']
        from: 'off'
        for: {seconds: 2}
      timeout: 2
    - condition: and
      conditions:
      - {condition: trigger, id: '1'}
      - {condition: numeric_state, entity_id: sensor.s1, above: 6}
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  set: [input_boolean.b1, unavailable]
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 9
  send: {type: event, event_type: e2}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: e1}
- at: 11
  set: [sensor.s1, abc]
- at: 12
  set: [sensor.s2, unknown]
- at: 14
  set: [light.l2, 'on']
- at: 14
  send: {type: event, event_type: e1}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 17
  set: [sensor.s1, '7.5']
- at: 18
  send: {type: event, event_type: e1}

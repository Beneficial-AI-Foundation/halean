# random scenario, seed 101, index 59 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: time_pattern, seconds: /7}
  conditions:
  - {condition: time, after: '22:13:25', weekday: tue}
  actions:
  - parallel:
    - sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - event: m_1
      event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
    continue_on_error: true
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '00:00:03', continue_on_timeout: false}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 0
  set: [light.l2, unavailable]
- at: 0
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l2, 'on']
- at: 4
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 5
  set: [sensor.s1, '12']
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 7
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 10
  set: [light.l1, unavailable]
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  set: [input_boolean.b1, 'on']
- at: 14
  send: {type: event, event_type: tick}

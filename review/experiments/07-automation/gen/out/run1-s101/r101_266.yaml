# random scenario, seed 101, index 266 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: state, entity_id: sensor.s2}
  - {trigger: event, event_type: e2, id: beta}
  actions:
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      sequence:
      - {stop: s}
      - {stop: s}
    - conditions:
      - {condition: state, entity_id: light.l2, state: 'on'}
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
      - {action: test.s2, continue_on_error: true}
    default:
    - event: m_3
      event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  - action: test.s4
    data: {n: 4, v: '{{ states(''light.l1'') }}'}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: time_pattern, seconds: /9}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
  - {trigger: event, event_type: e1}
  actions:
  - {event: m_5}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 3
  send: {type: event, event_type: e2}
- at: 6
  set: [light.l2, unavailable]
- at: 9
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 12
  send: {type: event, event_type: e1}
- at: 12
  set: [sensor.s1, '7.5']
- at: 12
  send: {type: service_result, call_id: 1, ok: true}
- at: 13
  set: [light.l1, unavailable]
- at: 14
  set: [light.l2, 'off']
- at: 14
  send: {type: event, event_type: e3}
- at: 14
  set: [sensor.s1, '12']
  attributes: {lvl: 3}
- at: 14
  send: {type: event, event_type: e2}

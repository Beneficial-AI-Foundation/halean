# random scenario, seed 101, index 156 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  actions:
  - variables: {v2: x}
  - variables:
      v2: [a, '{{ 1 + 1 }}']
  - sequence:
    - variables:
        v1: [a, '{{ 1 + 1 }}']
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 5
  set: [light.l2, 'off']
- at: 6
  set: [sensor.s2, '8']
- at: 8
  set: [light.l1, 'off']
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 14

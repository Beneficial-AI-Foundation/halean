# random scenario, seed 101, index 56 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, from: 'off', not_to: 'on'}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  actions:
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, to: '1'}
    timeout: 3
  - if:
    - {condition: state, entity_id: light.l1, state: 'on'}
    then:
    - sequence:
      - {delay: 1}
      - {event: m_1}
    - sequence:
      - repeat:
          count: 3
          sequence:
          - {delay: 1}
          - action: test.s2
            data: {n: 2, v: '{{ trigger.platform }}'}
          - event: m_3
            event_data: {n: 3, v: '{{ now().second }}'}
        continue_on_error: true
      - {stop: s}
      - if: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
        then:
        - {action: test.s4}
        else:
        - {event: m_5}
        - {event: m_6}
        enabled: false
    - parallel:
      - sequence:
        - {stop: s, error: true}
      - sequence:
        - event: m_7
          event_data: {n: 7, v: '{{ trigger.description }}'}
        - choose:
          - conditions:
            - condition: or
              conditions:
              - {condition: time, after: '22:13:25'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            sequence:
            - variables: {v1: '{{ states(''sensor.s1'') }}'}
            - event: m_8
              event_data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
          - conditions:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - condition: and
              conditions:
              - {condition: time, before: '22:13:30', enabled: false}
              - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
            sequence:
            - {delay: '{{ 1 }}'}
      - sequence:
        - variables: {v2: '{{ states(''sensor.s1'') }}'}
        - sequence:
          - condition: or
            conditions:
            - and:
              - {condition: trigger, id: alpha}
              - {condition: time, after: '22:13:25', before: '22:14'}
            - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
          - {action: test.s9, response_variable: v3}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: abc}
  - {trigger: time_pattern, seconds: /7}
  conditions:
  - and:
    - {condition: state, entity_id: light.l1, state: 'off'}
    - condition: and
      conditions:
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  actions:
  - parallel:
    - event: m_10
      event_data: {n: 10, v: '{{ now().second }}'}
    - sequence:
      - action: test.s11
        data: {n: 11, v: '{{ trigger.platform }}'}
        target: {entity_id: light.l1}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l1, sensor.s1]
      to: unavailable
      not_from: unavailable
    timeout: 0
    continue_on_timeout: false
  - event: m_12
    event_data: {n: 12, v: '{{ now().second }}'}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l2, 'off']
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 3
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 7
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s2, abc]
- at: 15
  set: [sensor.s1, '1']
- at: 16
  send: {type: event, event_type: e3}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l2, unavailable]
- at: 18
  set: [input_boolean.b1, unavailable]
- at: 19
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 22
  set: [light.l1, 'off']
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 27
  set: [sensor.s2, '1']
- at: 28
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 29
  set: [light.l1, 'off']
- at: 31
  send: {type: event, event_type: tick}

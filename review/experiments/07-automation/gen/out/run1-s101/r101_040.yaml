# random scenario, seed 101, index 40 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: true}
  actions:
  - {event: m_1}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - {stop: s, error: true}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: light.l1, for: '{{ 2 }}'}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
  actions:
  - {action: test.s3}
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - event: m_4
    event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 2
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  set: [input_boolean.b1, 'on']
- at: 6
  send: {type: service_result, call_id: 0, ok: true}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '4']
- at: 10
  set: [light.l1, 'on']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 13
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 13
  set: [sensor.s1, unavailable]

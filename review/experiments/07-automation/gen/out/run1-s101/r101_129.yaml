# random scenario, seed 101, index 129 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: event, event_type: e1}
  conditions:
  - {condition: trigger, id: '1'}
  - not:
    - condition: trigger
      id: [beta, '0']
  actions:
  - if:
    - {condition: time, after: '23:00:00', before: '22:14'}
    then:
    - sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, attribute: lvl}
        - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - action: test.s1
        data: {n: 1, v: '{{ trigger.idx }}'}
    - parallel:
      - event: m_3
        event_data: {n: 3, v: '{{ now().second }}'}
      - sequence:
        - choose:
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
            sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.description }}'}
            - {delay: 1}
            - {delay: 2}
          default:
          - {action: test.s5}
          - {condition: state, entity_id: light.l2, state: 'off'}
        - action: test.s6
          data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - trigger: state
      entity_id: [sensor.s2, input_boolean.b1]
      from: ['20', '1']
    timeout: 0
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - action: test.s7
      data: {n: 7, v: '{{ now().second }}'}
      target: {entity_id: light.l1}
      continue_on_error: true
    continue_on_error: true
  - if:
    - condition: state
      entity_id: [input_boolean.b1, sensor.s1]
      state: 'on'
      match: any
    then:
    - {stop: s}
states:
- {entity_id: sensor.s1, state: abc}
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 2}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l2, unavailable]
- at: 2
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 3
  set: [sensor.s2, '12']
  attributes: {lvl: 3}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [input_boolean.b1, 'on']
- at: 5
  send: {type: event, event_type: e3}
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 7
  set: [sensor.s2, '4']
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 12
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e3}
- at: 15
  set: [light.l1, 'on']
- at: 18
  send: {type: event, event_type: e2}
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  set: [input_boolean.b1, 'off']

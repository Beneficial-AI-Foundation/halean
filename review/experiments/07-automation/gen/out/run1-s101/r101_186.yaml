# random scenario, seed 101, index 186 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: time, at: '22:13:23'}
  - trigger: state
    entity_id: [input_boolean.b1, sensor.s2]
    to: ['off', 'on']
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
  - condition: state
    entity_id: light.l2
    state: 'off'
    for: {seconds: 1}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
  - wait_for_trigger:
    - trigger: event
      event_type: e3
      event_data: {k: 1}
    - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
    timeout: 3
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
steps:
- at: 0
  set: [sensor.s2, '4']
- at: 1
  set: [sensor.s1, '4']
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 7
  set: [light.l1, unavailable]
- at: 8
  set: [sensor.s1, '12']
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 15
  send: {type: event, event_type: tick}
- at: 15
  set: [input_boolean.b1, unavailable]

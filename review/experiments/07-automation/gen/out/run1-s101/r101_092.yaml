# random scenario, seed 101, index 92 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  conditions:
  - and:
    - '{{ states(''sensor.s2'') | float(0) < 5 }}'
    - and:
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - {condition: time, after: '22:13:25', before: '06:00'}
    - not:
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      - and:
        - condition: and
          conditions:
          - {condition: trigger, id: '1'}
          - {condition: trigger, id: alpha}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      sequence:
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - parallel:
        - sequence:
          - choose:
            - conditions:
              - condition: or
                conditions:
                - condition: and
                  conditions:
                  - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
                - condition: state
                  entity_id: [sensor.s1, light.l2]
                  state: 'on'
                  match: any
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
              sequence:
              - action: test.s1
                data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
                response_variable: v1
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - event: m_2
            event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - condition: or
            conditions:
            - '{{ is_state(''light.l1'', ''on'') }}'
            - condition: and
              conditions:
              - {condition: trigger, id: '1'}
              - {condition: state, entity_id: input_boolean.b1, state: 'on', for: 2, enabled: false}
        - sequence:
          - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 0}
          - event: m_6
            event_data: {n: 6, completed: '{{ wait.completed }}'}
          - action: test.s3
            data: {n: 3, v: '{{ this.attributes.current }}'}
          - if:
            - {condition: state, entity_id: light.l1, state: unavailable}
            then:
            - event: m_4
              event_data: {n: 4, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
            else:
            - {action: test.s5, continue_on_error: true}
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '{{ 2 }}'}
      - event: m_8
        event_data: {n: 8, completed: '{{ wait.completed }}'}
  - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
  - {condition: time, after: '22:00'}
  - if:
    - and:
      - condition: not
        conditions:
        - '{{ states(''sensor.s1'') | int(0) > 10 }}'
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
    then:
    - action: test.s9
      target: {entity_id: light.l1}
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    else:
    - variables:
        v4: [a, '{{ 1 + 1 }}']
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  variables: {v1: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, for: '{{ 2 }}'}
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: '{{ 2 }}'}
    timeout: 1
    continue_on_timeout: false
  - {delay: 0}
  - {event: m_10}
  - {event: m_11}
  - if:
    - condition: state
      entity_id: light.gone
      state: ['on', 'off']
      for: {seconds: 1}
    then:
    - {stop: s, enabled: false}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 2}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [light.l2, unavailable]
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 5
  set: [sensor.s2, '4']
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 11
  set: [light.l1, 'off']
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 17
  send: {type: event, event_type: e3}
- at: 18
  set: [light.l1, unavailable]
- at: 20
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 23
  set: [sensor.s2, abc]
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 26
  send: {type: event, event_type: tick}
- at: 27
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}

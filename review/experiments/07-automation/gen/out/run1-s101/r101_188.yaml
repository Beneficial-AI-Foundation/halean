# random scenario, seed 101, index 188 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', id: beta}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  conditions:
  - condition: state
    entity_id: input_boolean.b1
    state: ['off', 'on']
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - {condition: time, after: '22:13:25', weekday: tue}
        - condition: state
          entity_id: light.gone
          state: [unavailable, 'off']
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
      sequence:
      - choose:
        - conditions:
          - {condition: time, after: '23:00:00'}
          sequence:
          - delay: {seconds: 1}
    - conditions:
      - {condition: state, entity_id: light.l1, state: 'off', for: '00:00:03'}
      sequence:
      - choose:
        - conditions:
          - or:
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
          sequence:
          - variables:
              v1: [a, '{{ 1 + 1 }}']
        - conditions: ['{{ trigger.platform == ''event'' }}']
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ trigger.id }}'}
          - {event: m_2}
          - {delay: 0}
        default:
        - sequence:
          - {event: m_3}
          - {event: m_4}
        - action: test.s5
          data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
          response_variable: v2
        - {stop: s}
    default:
    - {stop: s, error: true}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        - condition: state
          entity_id: sensor.s1
          state: ['1', '4']
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
      sequence:
      - condition: not
        conditions:
        - {condition: time, after: '22:13:25', before: '22:14'}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      - {action: test.s6}
    - conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      sequence:
      - repeat:
          for_each:
          - {k: 1}
          - null
          sequence:
          - {action: test.s7, response_variable: v3}
          - parallel:
            - {event: m_8}
            - sequence:
              - action: test.s9
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            continue_on_error: true
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - if:
    - {condition: trigger, id: '0'}
    - condition: or
      conditions:
      - and:
        - condition: state
          entity_id: input_boolean.b1
          state: ['off', unavailable]
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - {condition: time, after: '22:00', before: '06:00', enabled: false}
      - not:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
        - {condition: time, before: '06:00'}
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    then:
    - choose:
      - conditions:
        - not:
          - {condition: trigger, id: '1'}
          - {condition: time, before: '06:00', enabled: false}
        - condition: state
          entity_id: [input_boolean.b1, sensor.s1]
          state: 'on'
          match: any
        sequence:
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
            - action: test.s10
              data: {n: 10, v: '{{ trigger.description }}'}
          continue_on_error: true
        - delay: {seconds: '{{ 2 }}'}
      - conditions:
        - condition: not
          conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
          enabled: false
        sequence:
        - action: test.s11
          target:
            entity_id: [light.l1, light.l2]
        - {delay: '{{ 1 }}'}
    else:
    - {delay: 1}
    - {condition: numeric_state, entity_id: sensor.s1, below: 15}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 2
  send: {type: event, event_type: e1}
- at: 4
  set: [input_boolean.b1, 'off']
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, '1']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: e2}
- at: 8
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 11
  set: [sensor.s2, unknown]
- at: 12
  send: {type: event, event_type: e3}
- at: 14
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 14
  set: [light.l1, unavailable]
- at: 16
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 17
  set: [input_boolean.b1, unavailable]
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 22
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 25
  set: [sensor.s1, '8']
- at: 27
  send:
    type: event
    event_type: e2
    data: {k: 2}

# random scenario, seed 101, index 263 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
  actions:
  - sequence:
    - {stop: s, error: true}
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - trigger: state
        entity_id: sensor.s1
        from: ['12', '4']
      timeout: 2
      continue_on_timeout: false
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - repeat:
        for_each:
        - {k: 1}
        - null
        sequence:
        - variables: {v1: '{{ states(''sensor.s1'') }}'}
        - sequence:
          - event: m_1
            event_data: {n: 1, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
          - event: m_2
            event_data: {n: 2, v: '{{ states(''light.l1'') }}'}
    enabled: false
  - action: test.s4
    data: {n: 4, v: '{{ this.attributes.current }}'}
  - action: test.s5
    data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
  - variables: {v3: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - {delay: 1}
    - condition: time
      after: '23:00:00'
      weekday: [tue]
    - {event: m_6}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [sensor.s2, '7.5']
- at: 1
  set: [light.l1, 'off']
- at: 2
  send: {type: event, event_type: e2}
- at: 2
  set: [light.l2, 'on']
- at: 4
  set: [sensor.s2, '12']
- at: 5
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 11
  set: [light.l1, 'on']
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 16
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 18
  set: [light.l2, unavailable]
- at: 20
  set: [sensor.s2, '20']
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 24
  send: {type: event, event_type: e3}
- at: 26
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 27
  set: [sensor.s1, unknown]
- at: 30
  send: {type: event, event_type: e2}
- at: 33
  set: [sensor.s2, '8']
- at: 34
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 35
  set: [light.l2, 'off']
- at: 35
  set: [sensor.s1, '8']

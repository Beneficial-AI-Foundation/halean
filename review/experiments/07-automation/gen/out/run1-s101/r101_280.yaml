# random scenario, seed 101, index 280 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  conditions:
  - condition: state
    entity_id: sensor.s2
    state: [unavailable, '20']
    for: 2
  - condition: not
    conditions:
    - {condition: trigger, id: alpha}
  actions:
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - parallel:
    - sequence:
      - action: test.s1
        target: {entity_id: light.l1}
      - parallel:
        - sequence:
          - parallel:
            - event: m_2
              event_data: {n: 2, v: '{{ this.attributes.current }}'}
            - sequence:
              - event: m_3
                event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
        - sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ trigger.id }}'}
        - sequence:
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
            enabled: false
        continue_on_error: true
    - event: m_5
      event_data: {n: 5, v: '{{ trigger.idx }}'}
  - delay: {seconds: 1}
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - if:
    - condition: state
      entity_id: light.l1
      state: ['off', 'on']
    then:
    - if:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      then:
      - {condition: time, after: '22:13:25', enabled: false}
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - {action: test.s7, continue_on_error: true}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 4
  set: [sensor.s2, unavailable]
  attributes: {lvl: 3}
- at: 5
  send: {type: event, event_type: e3}
- at: 8
  set: [sensor.s2, '20']
- at: 11
  send: {type: event, event_type: e2}
- at: 11
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 11
  send: {type: event, event_type: e3}
- at: 13
  set: [light.l2, 'on']
- at: 14
  send: {type: event, event_type: e2}
- at: 16
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 18
  set: [light.l1, 'on']
- at: 19
  send: {type: event, event_type: tick}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 22
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 23
  set: [sensor.s1, abc]
- at: 25
  send: {type: service_result, call_id: 1, ok: true}
- at: 28
  send: {type: event, event_type: e1}
- at: 30
  send: {type: event, event_type: tick}
- at: 32
  set: [input_boolean.b1, 'on']
- at: 33
  send: {type: service_result, call_id: 2, ok: true}
- at: 34
  set: [light.l2, unavailable]
- at: 36
  set: [input_boolean.b1, unavailable]
- at: 39
  send: {type: event, event_type: e1}

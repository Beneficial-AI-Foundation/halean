# random scenario, seed 101, index 72 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', id: alpha}
  - {trigger: event, event_type: e2}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.platform }}'}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
      sequence:
      - choose:
        - conditions:
          - {condition: trigger, id: '1'}
          sequence:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          sequence:
          - event: m_2
            event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
        continue_on_error: true
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - event: m_3
    event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
- alias: a1
  id: id1
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: a}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10, for: 2}
  - {trigger: event, event_type: e3}
  actions:
  - action: test.s4
    data: {n: 4, v: '{{ trigger.description }}'}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.idx }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {condition: trigger, id: '1'}
  - event: m_6
    event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 2
  send: {type: event, event_type: tick}
- at: 2
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 4
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 5
  send: {type: service_result, call_id: 1, ok: false, error_kind: invalid}
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 9
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s2, unknown]
- at: 12
  send: {type: event, event_type: e1}
- at: 15
  set: [light.l1, 'off']
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  set: [light.l1, 'on']

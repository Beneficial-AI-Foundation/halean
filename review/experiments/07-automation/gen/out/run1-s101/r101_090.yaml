# random scenario, seed 101, index 90 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: time_pattern, seconds: /3}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: sensor.s2, for: '00:00:02'}
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    timeout: 1
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: 0}
  - {stop: s}
  - action: test.s1
    target: {entity_id: light.l1}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, not_to: 'on'}
  - {trigger: event, event_type: e3}
  - trigger: event
    event_type: e3
    event_data: {k: true}
  actions:
  - action: test.s3
    data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {delay: '00:00:02'}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 0
  send: {type: event, event_type: tick}
- at: 0
  send: {type: event, event_type: tick}
- at: 0
  set: [sensor.s1, unknown]
- at: 1
  send: {type: event, event_type: e2}
- at: 4
  set: [light.l2, unavailable]
- at: 7
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 10
  send: {type: event, event_type: e3}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 18
  send: {type: service_result, call_id: 0, ok: true}
- at: 18
  send: {type: event, event_type: e3}
- at: 19
  set: [sensor.s1, '8']
- at: 20
  send: {type: event, event_type: e3}
- at: 22
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 25
  set: [light.l1, unavailable]
- at: 28
  set: [sensor.s2, '7.5']
  attributes: {lvl: 1}

# random scenario, seed 101, index 114 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  - trigger: state
    entity_id: [sensor.s1, light.l2]
    to: ['1', '12']
  - {trigger: state, entity_id: sensor.s1, from: '4'}
  actions:
  - repeat:
      count: 3
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.id }}'}
  - repeat:
      count: 2
      sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
  - action: test.s3
    data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - sequence:
    - event: m_4
      event_data: {n: 4, v: '{{ trigger.id }}'}
    - {delay: '00:00:02'}
  - event: m_5
    event_data: {n: 5, v: '{{ now().second }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: time, at: '22:13:29'}
  actions:
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.id }}'}
  - repeat:
      count: 1
      sequence:
      - action: test.s7
        data: {n: 7, v: '{{ now().second }}'}
    enabled: false
  - repeat:
      count: 3
      sequence:
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {condition: time, after: '22:00', before: '06:00'}
          - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: '{{ 2 }}'}
          - event: m_8
            event_data: {n: 8, completed: '{{ wait.completed }}'}
        continue_on_error: true
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, unavailable]
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send: {type: event, event_type: e3}
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 16
  set: [light.l2, 'on']
- at: 16
  set: [light.l2, 'off']
- at: 17
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 18
  set: [input_boolean.b1, 'on']

# random scenario, seed 101, index 211 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: '{{ 2 }}'}
  actions:
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - choose:
    - conditions:
      - and:
        - condition: and
          conditions:
          - {condition: time, before: '22:13:30'}
      sequence:
      - {event: m_1}
    default:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
    - choose:
      - conditions:
        - {condition: trigger, id: '1'}
        - {condition: numeric_state, entity_id: sensor.s1, above: 3}
        sequence:
        - if:
          - {condition: time, before: '06:00'}
          then:
          - event: m_3
            event_data: {n: 3, v: '{{ this.attributes.current }}'}
          - action: test.s4
            data: {n: 4, v: '{{ now().second }}'}
            target: {entity_id: light.l1}
            continue_on_error: true
        - if:
          - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
          - {condition: state, entity_id: input_boolean.b1, state: unavailable}
          then:
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
          - action: test.s5
            data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            target:
              entity_id: [light.l1, light.l2]
            continue_on_error: true
          else:
          - action: test.s6
            target: {entity_id: light.l1}
            continue_on_error: true
            response_variable: v3
            enabled: false
          - {delay: 0}
          - {delay: 2}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    - {trigger: state, entity_id: sensor.s1, from: '20', for: '00:00:02'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - condition: or
    conditions:
    - condition: or
      conditions:
      - {condition: state, entity_id: light.l1, state: unavailable}
      - '{{ states(''sensor.s2'') | float(0) < 15 }}'
      - condition: trigger
        id: [beta, '0']
    - condition: or
      conditions:
      - condition: state
        entity_id: sensor.s2
        state: ['4', '1']
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - not:
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          - {condition: time, after: '22:13:25'}
          - {condition: state, entity_id: sensor.s1, state: '1'}
        - condition: or
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
          - '{{ states(''sensor.s1'') | int(0) > 7 }}'
      sequence:
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
          for: {seconds: '{{ 1 + 1 }}'}
      - choose:
        - conditions:
          - condition: and
            conditions:
            - or:
              - {condition: state, entity_id: sensor.s1, state: '7.5'}
            - '{{ is_state(''light.l2'', ''off'') }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
          sequence:
          - choose:
            - conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}', '{{ states(''sensor.s1'') | int > 5 }}']
              sequence:
              - {delay: 0}
          - sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ trigger.id }}', var: '{{ v2 | default(''undef'') }}'}
              enabled: false
      - delay: {seconds: 1}
    - conditions:
      - condition: or
        conditions:
        - condition: not
          conditions: ['{{ trigger.id == ''0'' }}']
        - '{{ states(''sensor.s1'') | int(0) > 10 }}'
        - {condition: time, before: '22:14'}
      - condition: not
        conditions:
        - or:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          - condition: trigger
            id: [beta, '0']
      sequence:
      - wait_template: '{{ trigger.id == ''0'' }}'
        timeout: {seconds: 2}
    default:
    - {event: m_8}
    - delay: {seconds: '{{ 2 }}'}
    - event: m_9
      event_data: {n: 9, v: '{{ now().second }}', var: '{{ v3 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'off']
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: tick}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 18
  send: {type: event, event_type: tick}
- at: 20
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}
- at: 24
  set: [sensor.s2, '7.5']
- at: 26
  send: {type: event, event_type: e1}
- at: 26
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}

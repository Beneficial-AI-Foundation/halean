# random scenario, seed 101, index 185 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {trigger: state, entity_id: light.l1, from: 2, to: 1, attribute: lvl, id: alpha}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
    response_variable: v1
  - action: test.s2
    data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - sequence:
    - action: test.s3
      data: {n: 3, v: '{{ now().second }}'}
      response_variable: v2
  - if:
    - {condition: state, entity_id: light.l1, state: unavailable}
    then:
    - if:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
      then:
      - wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        timeout: {seconds: 2}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
    - sequence:
      - {action: test.s5}
      - choose:
        - conditions:
          - {condition: trigger, id: alpha}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          sequence:
          - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
        default:
        - variables:
            v3: [a, '{{ 1 + 1 }}']
        - variables: {v5: '{{ (v5 | default(0) | int(0)) + 1 }}'}
    - sequence:
      - parallel:
        - sequence:
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
          - action: test.s6
            data: {n: 6, v: '{{ trigger.description }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - sequence:
          - action: test.s7
            data: {n: 7, v: '{{ now().second }}'}
      - {action: test.s8, response_variable: v6}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, from: 3, attribute: lvl}
  - trigger: state
    entity_id: sensor.s1
    from: [unavailable, '8']
  - {trigger: time, at: '22:13:23'}
  actions:
  - variables: {v1: x}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: '{{ 2 }}', continue_on_timeout: false}
  - event: m_13
    event_data: {n: 13, completed: '{{ wait.completed }}'}
  - sequence:
    - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 2, continue_on_timeout: false}
    - wait_for_trigger:
      - {trigger: event, event_type: e1}
      timeout: 0
    - event: m_10
      event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - {action: test.s9}
  - parallel:
    - event: m_11
      event_data: {n: 11, v: '{{ states(''sensor.s1'') }}'}
    - event: m_12
      event_data: {n: 12, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  set: [light.l1, 'on']
- at: 3
  set: [sensor.s2, '20']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 7
  set: [sensor.s2, unknown]
- at: 8
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 8
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 10
  set: [sensor.s1, abc]
- at: 11
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 13
  set: [light.l1, unavailable]
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 17
  send: {type: event, event_type: tick}

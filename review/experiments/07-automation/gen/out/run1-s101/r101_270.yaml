# random scenario, seed 101, index 270 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0}
  triggers:
  - {trigger: time, at: '22:13:29'}
  conditions:
  - condition: state
    entity_id: [light.l2, sensor.s2]
    state: 'on'
    match: any
  - '{{ states(''sensor.s1'') | int > 5 }}'
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.description }}'}
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
states:
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 2
  send: {type: event, event_type: tick}
- at: 5
  set: [input_boolean.b1, unavailable]
- at: 6
  set: [sensor.s2, '8']
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 8
  set: [sensor.s1, '12']
  attributes: {lvl: 3}
- at: 9
  set: [sensor.s2, '12']
- at: 10
  set: [sensor.s2, '1']
- at: 11
  set: [input_boolean.b1, 'off']
- at: 12
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  set: [light.l1, 'on']
- at: 15
  set: [light.l2, 'off']
- at: 16
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 16
  set: [sensor.s1, '1']
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s2, '12']
- at: 20
  set: [sensor.s1, '8']

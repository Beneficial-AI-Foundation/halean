# random scenario, seed 101, index 248 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e2, id: beta}
  actions:
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0, enabled: false}
  - parallel:
    - sequence:
      - {stop: s, enabled: false}
      - event: m_1
        event_data: {n: 1, v: '{{ this.attributes.current }}'}
    - sequence:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - sequence:
      - choose:
        - conditions:
          - {condition: time, after: '23:00:00', before: '22:14'}
          - '{{ states(''sensor.s2'') | float(0) < 9 }}'
          sequence:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        default:
        - {delay: 1}
        - parallel:
          - sequence:
            - {event: m_2}
            - action: test.s3
              data: {n: 3, v: '{{ states(''light.l1'') }}'}
          - sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.platform }}'}
            - action: test.s5
              data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              response_variable: v2
            - action: test.s6
              data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - event: m_7
            event_data: {n: 7, v: '{{ states(''light.l1'') }}'}
        - repeat:
            count: 3
            sequence:
            - action: test.s8
              data: {n: 8, v: '{{ trigger.platform }}'}
            - action: test.s9
              data: {n: 9, v: '{{ trigger.idx }}'}
              target:
                entity_id: [light.l1, light.l2]
              enabled: false
            - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
        continue_on_error: true
    continue_on_error: true
  - sequence:
    - parallel:
      - sequence:
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        - variables: {v5: x}
        - variables:
            v1: [a, '{{ 1 + 1 }}']
      - sequence:
        - parallel:
          - {event: m_10}
          - {event: m_11}
          - sequence:
            - action: test.s12
              data: {n: 12, v: '{{ states(''sensor.s1'') }}'}
            - action: test.s13
              data: {n: 13, v: '{{ states(''sensor.s1'') }}'}
      - sequence:
        - variables: {v1: x}
        - parallel:
          - event: m_14
            event_data: {n: 14, v: '{{ states(''light.l1'') }}', var: '{{ v3 | default(''undef'') }}'}
          - sequence:
            - {action: test.s15, enabled: false}
            - {event: m_16}
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - sequence:
            - variables: {v6: x}
        - sequence:
          - event: m_17
            event_data: {n: 17, v: '{{ trigger.description }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0, v8: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: numeric_state, entity_id: sensor.s2, below: sensor.s2}
  actions:
  - sequence:
    - {stop: s, error: true}
    - sequence:
      - {event: m_18}
      continue_on_error: true
  - action: test.s19
    data: {n: 19, v: '{{ trigger.id }}'}
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: trigger, id: alpha, enabled: false}
      sequence:
      - choose:
        - conditions:
          - condition: and
            conditions: ['{{ trigger.platform == ''event'' }}']
          sequence:
          - {stop: s}
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          - {condition: time, after: '22:00'}
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
          sequence:
          - {condition: trigger, id: alpha, enabled: false}
        continue_on_error: true
      - repeat:
          count: 2
          sequence:
          - action: test.s20
            data: {n: 20, v: '{{ trigger.platform }}'}
            continue_on_error: true
          - variables: {v1: x}
        continue_on_error: true
      - sequence:
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 1}
        - event: m_22
          event_data: {n: 22, completed: '{{ wait.completed }}'}
        - parallel:
          - event: m_21
            event_data: {n: 21, v: '{{ states(''sensor.s1'') }}', var: '{{ v2 | default(''undef'') }}'}
          - sequence:
            - variables: {v2: '{{ states(''sensor.s1'') }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      - {condition: trigger, id: '1'}
      sequence:
      - action: test.s23
        data: {n: 23, v: '{{ trigger.id }}'}
    default:
    - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: 2, continue_on_timeout: false, enabled: false}
    - event: m_24
      event_data: {n: 24, completed: '{{ wait.completed }}'}
    - if:
      - or: ['{{ trigger.platform in [''state'', ''numeric_state''] }}', '{{ is_state(''light.l1'', ''on'') }}']
      then:
      - if:
        - condition: state
          entity_id: [input_boolean.b1, light.l2]
          state: 'on'
          match: any
        then:
        - {delay: '00:00:02'}
        - condition: or
          conditions:
          - {condition: time, after: '23:00:00'}
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - {condition: time, before: '22:13:30'}
  - sequence:
    - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0}
    - event: m_25
      event_data: {n: 25, completed: '{{ wait.completed }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a2
  id: id2
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
  actions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - {stop: s}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '4'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 0
  send: {type: event, event_type: e2}
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 4
  send: {type: service_result, call_id: 0, ok: true}
- at: 5
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 7
  set: [light.l1, 'on']
- at: 8
  send: {type: service_result, call_id: 2, ok: true}
- at: 9
  set: [sensor.s1, '12']
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: e3}
- at: 14
  send: {type: service_result, call_id: 3, ok: true}

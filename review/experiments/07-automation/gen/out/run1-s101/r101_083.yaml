# random scenario, seed 101, index 83 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: state
    entity_id: input_boolean.b1
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      - condition: or
        conditions:
        - condition: not
          conditions:
          - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
          - {condition: trigger, id: '1'}
        - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      sequence:
      - {event: m_1}
      - variables:
          v2: [a, '{{ 1 + 1 }}']
    default:
    - variables: {v2: 1}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: light.l2, from: 2, attribute: lvl, id: beta}
  - trigger: event
    event_type: e2
    event_data: {k: 1}
    id: alpha
  - trigger: state
    entity_id: [sensor.s2, sensor.s1]
    from: abc
  conditions:
  - not:
    - '{{ states(''sensor.s2'') | float(0) < 5 }}'
    - condition: and
      conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
    - condition: state
      entity_id: input_boolean.b1
      state: [unavailable, 'off']
  actions:
  - parallel:
    - sequence:
      - {condition: trigger, id: '1'}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.id }}'}
    - sequence:
      - {event: m_3}
      - parallel:
        - sequence:
          - choose:
            - conditions:
              - condition: not
                conditions:
                - {condition: trigger, id: '0', enabled: false}
              sequence:
              - action: test.s4
                data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
                response_variable: v1
              - action: test.s5
                data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
                continue_on_error: true
            default:
            - action: test.s6
              data: {n: 6, v: '{{ trigger.description }}'}
        - sequence:
          - action: test.s7
            data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            continue_on_error: true
        - event: m_8
          event_data: {n: 8, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - event: m_9
        event_data: {n: 9, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
      - event: m_10
        event_data: {n: 10, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - {condition: time, after: '22:13:25'}
      sequence:
      - sequence:
        - choose:
          - conditions: ['{{ is_state(''light.l1'', ''on'') }}']
            sequence:
            - {condition: time, after: '23:00:00', before: '06:00'}
          - conditions:
            - condition: or
              conditions:
              - condition: not
                conditions:
                - '{{ is_state(''light.l1'', ''on'') }}'
                - {condition: time, after: '23:00:00'}
              - {condition: trigger, id: '1'}
            sequence:
            - action: test.s11
              data: {n: 11, v: '{{ trigger.idx }}'}
              continue_on_error: true
    - conditions:
      - and:
        - condition: and
          conditions:
          - {condition: time, before: '22:14'}
          - condition: state
            entity_id: light.l2
            state: [unavailable, 'off']
        - condition: and
          conditions:
          - {condition: time, after: '22:13:25'}
      sequence:
      - action: test.s12
        data: {n: 12, v: '{{ trigger.platform }}'}
        target:
          entity_id: [light.l1, light.l2]
      - parallel:
        - event: m_13
          event_data: {n: 13, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - event: m_14
            event_data: {n: 14, v: '{{ now().second }}', var: '{{ v2 | default(''undef'') }}'}
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {stop: s}
        continue_on_error: true
  - {condition: state, entity_id: sensor.s1, state: unknown}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 6
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 7
  set: [sensor.s2, abc]
- at: 8
  set: [sensor.s2, unavailable]
- at: 10
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 10
  set: [input_boolean.b1, 'on']
- at: 12
  set: [light.l2, 'on']
- at: 15
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'off']
  attributes: {lvl: 1}

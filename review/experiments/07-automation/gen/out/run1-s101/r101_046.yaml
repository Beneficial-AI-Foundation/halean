# random scenario, seed 101, index 46 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  actions:
  - {delay: '00:00:02'}
  - parallel:
    - sequence:
      - repeat:
          count: 3
          sequence:
          - {delay: 2}
          - action: test.s1
            data: {n: 1, v: '{{ trigger.description }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: '00:00:03'}
    - sequence:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03', continue_on_timeout: false}
      - action: test.s2
        data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - event: m_3
        event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - {event: m_4}
- alias: a1
  id: id1
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: time, at: '22:13:23'}
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - if: ['{{ trigger.id == ''0'' }}']
    then:
    - event: m_5
      event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
    - {event: m_6}
    else:
    - {event: m_7}
    - choose:
      - conditions:
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        sequence:
        - sequence:
          - event: m_8
            event_data: {n: 8, v: '{{ this.attributes.current }}'}
          - condition: state
            entity_id: sensor.s1
            state: ['8', '20']
          continue_on_error: true
          enabled: false
      - conditions:
        - or:
          - condition: trigger
            id: [beta, '0']
          - {condition: trigger, id: alpha}
        - {condition: trigger, id: '0'}
        sequence:
        - if:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          then:
          - variables: {v2: x}
          - {action: test.s9}
          - {event: m_10}
      default:
      - {stop: s}
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - parallel:
    - sequence:
      - if: ['{{ is_state(''light.l2'', ''off'') }}']
        then:
        - event: m_11
          event_data: {n: 11, v: '{{ states(''sensor.s1'') }}'}
        - {stop: s}
        else:
        - {stop: s}
    - event: m_12
      event_data: {n: 12, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
  - if:
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    then:
    - repeat:
        for_each: '{{ states(''light.l1'') }}'
        sequence:
        - parallel:
          - event: m_13
            event_data: {n: 13, v: '{{ now().second }}'}
          - {event: m_14}
          - sequence:
            - event: m_15
              event_data: {n: 15, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - {delay: '{{ 1 }}'}
          continue_on_error: true
        - {event: m_16}
    - choose:
      - conditions:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - condition: or
            conditions:
            - condition: time
              before: '22:13:30'
              weekday: [tue]
            - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
            - '{{ trigger.platform == ''event'' }}'
        sequence:
        - sequence:
          - {action: test.s17, continue_on_error: true}
          - {delay: 2}
          - variables: {v2: 1}
          enabled: false
        - choose:
          - conditions:
            - {condition: trigger, id: '0'}
            sequence:
            - {action: test.s18, continue_on_error: true}
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            sequence:
            - variables: {v1: 1}
          default:
          - event: m_19
            event_data: {n: 19, v: '{{ trigger.platform }}'}
          continue_on_error: true
      - conditions:
        - {condition: state, entity_id: light.l1, state: 'off'}
        sequence:
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          timeout: 1
        - event: m_20
          event_data: {n: 20, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
    - {stop: s}
    continue_on_error: true
  - {stop: s}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l1, 'on']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 8
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 11
  send: {type: event, event_type: e1}
- at: 11
  set: [sensor.s1, '12']
- at: 13
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 19
  set: [sensor.s1, '1']
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 22
  set: [sensor.s2, unavailable]
  attributes: {lvl: 3}
- at: 25
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}

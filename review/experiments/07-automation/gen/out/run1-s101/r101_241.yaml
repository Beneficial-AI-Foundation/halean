# random scenario, seed 101, index 241 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:23', id: beta}
  - trigger: state
    entity_id: [light.l1, sensor.s2]
    not_to: 3
    not_from: 2
    attribute: lvl
    for: 3
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.s2
    not_to: [unavailable, '20']
  actions:
  - {event: m_2}
  - parallel:
    - sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - wait_for_trigger:
        - {trigger: state, entity_id: light.l1, to: 'off'}
        - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
        timeout: 2
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - {action: test.s4}
      - choose:
        - conditions:
          - {condition: trigger, id: '1'}
          sequence:
          - if:
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
            then:
            - {event: m_5}
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            else:
            - variables:
                v2: [a, '{{ 1 + 1 }}']
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - action: test.s6
            target:
              entity_id: [light.l1, light.l2]
            response_variable: v4
      - choose:
        - conditions:
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          sequence:
          - action: test.s7
            data: {n: 7, v: '{{ trigger.idx }}'}
            continue_on_error: true
        - conditions:
          - condition: not
            conditions:
            - condition: time
              after: '22:13:25'
              before: '22:14'
              weekday: [wed, mon]
            - {condition: time, after: '22:13:25', before: '06:00'}
            - condition: or
              conditions:
              - '{{ trigger.platform == ''event'' }}'
              - {condition: trigger, id: '1'}
          sequence:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - event: m_8
            event_data: {n: 8, completed: '{{ wait.completed }}'}
        default:
        - repeat:
            while:
            - and:
              - and:
                - {condition: trigger, id: alpha}
                - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              - condition: not
                conditions:
                - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
                - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
            - '{{ repeat.index <= 1 }}'
            sequence:
            - {event: m_9}
            - {event: m_10}
          continue_on_error: true
        - variables:
            v3: [a, '{{ 1 + 1 }}']
        - variables: {v4: '{{ states(''sensor.s1'') }}'}
        continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 1
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 4
  set: [sensor.s2, '7.5']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: service_result, call_id: 0, ok: true}
- at: 6
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 7
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 7
  set: [input_boolean.b1, 'off']
- at: 8
  send: {type: event, event_type: e3}
- at: 10
  set: [light.l2, unavailable]
- at: 13
  send: {type: event, event_type: tick}

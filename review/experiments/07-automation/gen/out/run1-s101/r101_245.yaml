# random scenario, seed 101, index 245 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: '1'}
  - {trigger: time_pattern, seconds: 31}
  - trigger: state
    entity_id: input_boolean.b1
    from: 'on'
    to: unavailable
    for: {seconds: 2}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
    target: {entity_id: light.l1}
    continue_on_error: true
  - parallel:
    - {event: m_2}
    - sequence:
      - variables: {v1: x}
      - wait_for_trigger:
        - {trigger: state, entity_id: input_boolean.b1, from: unavailable, for: '00:00:02'}
        timeout: 0
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    continue_on_error: true
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e2}
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  set: [light.l1, 'on']
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: e3}
- at: 12
  set: [light.l1, unavailable]
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  send: {type: service_result, call_id: 0, ok: true}
- at: 17
  send: {type: event, event_type: e3}
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 20
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: true}

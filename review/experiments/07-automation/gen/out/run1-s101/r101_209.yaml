# random scenario, seed 101, index 209 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, for: 2}
  actions:
  - {action: test.s1, continue_on_error: true}
  - wait_for_trigger:
    - {trigger: state, entity_id: input_boolean.b1, from: unavailable}
    - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', for: 2}
    timeout: 3
  - event: m_9
    event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - repeat:
      count: 2
      sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 1}
      - parallel:
        - sequence:
          - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
          - event: m_3
            event_data: {n: 3, completed: '{{ wait.completed }}'}
          - {event: m_2}
          - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0}
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}'}
        - sequence:
          - {event: m_5}
        continue_on_error: true
      - repeat:
          count: 3
          sequence:
          - wait_for_trigger:
            - {trigger: numeric_state, entity_id: sensor.s1, below: 10, for: '00:00:02'}
            enabled: false
          - parallel:
            - sequence:
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
              - action: test.s6
                data: {n: 6, v: '{{ trigger.description }}'}
                continue_on_error: true
              - {delay: 2}
            - sequence:
              - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
              - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
              - {event: m_7}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - event: m_8
        event_data: {n: 8, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: time_pattern, seconds: 31, id: alpha}
  - {trigger: state, entity_id: light.l1, to: 1, attribute: lvl, for: '{{ 2 }}', id: alpha}
  - {trigger: state, entity_id: light.l1, not_from: 'off'}
  conditions:
  - {condition: time, after: '22:13:25'}
  - '{{ trigger.platform == ''event'' }}'
  actions:
  - {stop: s, error: true}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    timeout: 1
    continue_on_timeout: false
- alias: a2
  id: id2
  mode: parallel
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'off'}
  conditions:
  - condition: and
    conditions:
    - {condition: time, after: '23:00:00', before: '22:14'}
    - {condition: trigger, id: alpha}
    - {condition: trigger, id: alpha}
  actions:
  - sequence:
    - sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        - condition: or
          conditions:
          - condition: state
            entity_id: sensor.s1
            state: ['7.5', '12']
          - condition: or
            conditions:
            - condition: trigger
              id: [beta, '0']
            - {condition: trigger, id: alpha}
        then:
        - {delay: '{{ 1 }}'}
        - {event: m_11}
        else:
        - variables: {v1: x}
        - {delay: 0}
        enabled: false
      - {stop: s, enabled: false}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - {trigger: state, entity_id: light.l1, from: 'off'}
        timeout: 1
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s13
    data: {n: 13, v: '{{ trigger.platform }}'}
  variables: {v1: 0}
states:
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: unavailable}
steps:
- at: 1
  set: [sensor.s2, '4']
- at: 2
  set: [light.l2, 'on']
- at: 3
  set: [light.l1, unavailable]
- at: 3
  set: [sensor.s2, '8']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s1, abc]
- at: 10
  set: [sensor.s2, '4']
- at: 12
  set: [light.l1, 'on']
- at: 13
  set: [light.l1, unavailable]
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  set: [light.l2, unavailable]
- at: 19
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 21
  send: {type: event, event_type: e3}
- at: 24
  set: [input_boolean.b1, unavailable]
- at: 26
  set: [sensor.s1, '1']
- at: 29
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 30
  set: [light.l1, 'off']
- at: 32
  set: [light.l2, 'off']
- at: 33
  send: {type: event, event_type: tick}
- at: 35
  send: {type: event, event_type: tick}

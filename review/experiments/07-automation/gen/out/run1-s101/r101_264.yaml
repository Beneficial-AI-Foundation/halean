# random scenario, seed 101, index 264 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', for: 2}
  conditions:
  - {condition: state, entity_id: light.l1, state: unavailable}
  - condition: not
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15, enabled: false}
    - {condition: state, entity_id: light.l1, state: 'on'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ this.attributes.current }}'}
    target: {entity_id: light.l1}
    continue_on_error: true
    response_variable: v1
  - event: m_2
    event_data: {n: 2, v: '{{ now().second }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l2}
    timeout: 3
  variables: {v1: 0}
states:
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [input_boolean.b1, unavailable]
- at: 2
  set: [light.l2, unavailable]
- at: 3
  set: [light.l2, 'off']
- at: 6
  set: [light.l2, 'on']
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [light.l2, unavailable]
- at: 14
  send: {type: event, event_type: e2}
- at: 16
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 22
  set: [light.l1, 'on']
- at: 24
  set: [sensor.s1, '7.5']
- at: 24
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 25
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 28
  set: [light.l2, 'off']
- at: 30
  send: {type: event, event_type: tick}
- at: 31
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 33
  send: {type: event, event_type: tick}

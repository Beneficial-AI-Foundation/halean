# random scenario, seed 101, index 286 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time, at: '22:13:26'}
  - {trigger: state, entity_id: light.l1, not_from: 'off', not_to: 'on'}
  - {trigger: event, event_type: e1}
  conditions:
  - '{{ trigger.platform == ''event'' }}'
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  actions:
  - repeat:
      until: ['{{ repeat.index >= 3 }}']
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
        continue_on_error: true
      - {delay: '{{ 1 }}'}
      - event: m_2
        event_data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    continue_on_error: true
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    - {trigger: event, event_type: e2}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
    timeout: 2
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: light.l2
    not_from: ['on', unavailable]
    for: 2
    id: beta
  - trigger: event
    event_type: e2
    event_data: {k: 1}
    id: beta
  - {trigger: event, event_type: e1}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - parallel:
    - sequence:
      - if:
        - or:
          - and:
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
          - condition: and
            conditions:
            - {condition: trigger, id: '1'}
        then:
        - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 2}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
        - if:
          - condition: or
            conditions:
            - '{{ is_state(''light.l2'', ''off'') }}'
            - {condition: time, after: '22:00', enabled: false}
            - '{{ is_state(''light.l2'', ''off'') }}'
          then:
          - {action: test.s4}
          - {action: test.s5}
          continue_on_error: true
        else:
        - wait_for_trigger:
          - trigger: state
            entity_id: light.l2
            from: 'on'
            for: {seconds: '{{ 1 + 1 }}'}
        - event: m_8
          event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - event: m_7
            event_data: {n: 7, v: '{{ trigger.id }}'}
      - sequence:
        - {stop: s}
        - if:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
          then:
          - event: m_9
            event_data: {n: 9, v: '{{ trigger.id }}'}
          continue_on_error: true
        - if:
          - condition: state
            entity_id: [sensor.s2, light.l1]
            state: 'on'
            match: any
          - {condition: time, after: '23:00:00'}
          then:
          - {event: m_10}
        continue_on_error: true
    - {event: m_11}
  - condition: not
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: 3}
    - {condition: state, entity_id: sensor.s2, state: unknown, for: '00:00:03'}
  - variables: {v1: 1}
  - event: m_12
    event_data: {n: 12, v: '{{ trigger.description }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 2
  set: [sensor.s1, unavailable]
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [input_boolean.b1, 'on']
- at: 7
  set: [light.l1, unavailable]
- at: 9
  set: [light.l2, 'on']
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 14
  set: [light.l2, 'off']
- at: 17
  set: [sensor.s2, '8']
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 23
  set: [light.l1, unavailable]
- at: 24
  set: [sensor.s2, '4']
  attributes: {lvl: 2}
- at: 24
  set: [sensor.s2, '20']
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e1}
- at: 28
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 31
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 34
  set: [sensor.s1, '12']
  attributes: {lvl: 3}
- at: 35
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 35
  set: [sensor.s2, '8']
- at: 37
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 37
  send: {type: event, event_type: e1}

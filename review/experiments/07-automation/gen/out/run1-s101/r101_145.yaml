# random scenario, seed 101, index 145 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  actions:
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - {delay: '{{ 1 }}', enabled: false}
  - variables: {v1: 1}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, for: '{{ 2 }}'}
  conditions:
  - condition: trigger
    id: [beta, '0']
  - condition: not
    conditions:
    - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
    - condition: not
      conditions:
      - {condition: time, before: '06:00'}
  actions:
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: sensor.s2, for: 3}
    - {trigger: state, entity_id: light.l2, attribute: lvl}
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {event: m_2}
  - sequence:
    - parallel:
      - sequence:
        - repeat:
            for_each: []
            sequence:
            - {delay: 1}
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s2, below: 10, for: 2}
          - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          timeout: 0
          continue_on_timeout: false
        - event: m_3
          event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - event: m_4
        event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - {delay: '00:00:02'}
  - repeat:
      count: 0
      sequence:
      - if:
        - condition: trigger
          id: [beta, '0']
        then:
        - {stop: s, error: true}
        - action: test.s5
          data: {n: 5, v: '{{ trigger.idx }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        else:
        - sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ states(''light.l1'') }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  set: [sensor.s1, '12']
  attributes: {lvl: 3}
- at: 5
  set: [sensor.s1, '20']
  attributes: {lvl: 1}
- at: 8
  set: [light.l2, 'on']
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s2, '12']
  attributes: {lvl: 3}
- at: 12
  set: [sensor.s2, '12']
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [sensor.s2, unavailable]
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [light.l2, unavailable]

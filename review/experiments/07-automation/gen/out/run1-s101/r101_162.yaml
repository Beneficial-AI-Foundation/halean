# random scenario, seed 101, index 162 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  conditions:
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - condition: time
    before: 06:00
    weekday: [wed, mon]
  - if:
    - condition: or
      conditions:
      - and:
        - {condition: time, before: '22:14'}
        - '{{ trigger.id == ''0'' }}'
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        enabled: false
      - '{{ trigger.platform == ''event'' }}'
      enabled: false
    then:
    - {stop: s}
    - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
    - event: m_1
      event_data: {n: 1, completed: '{{ wait.completed }}'}
    else:
    - {action: test.s2}
    - sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
        timeout: {seconds: 2}
        continue_on_timeout: false
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - action: test.s3
        data: {n: 3, v: '{{ trigger.idx }}'}
        target:
          entity_id: [light.l1, light.l2]
  - {condition: state, entity_id: sensor.s2, state: '1'}
  - event: m_5
    event_data: {n: 5, v: '{{ now().second }}'}
  - {event: m_6, enabled: false}
states:
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 1
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 2
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 4
  set: [sensor.s2, '1']
- at: 5
  set: [input_boolean.b1, unavailable]
- at: 7
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: e3}
- at: 11
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 13
  set: [sensor.s2, '4']
- at: 15
  set: [sensor.s2, unavailable]
- at: 16
  set: [sensor.s1, unavailable]
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 20
  send: {type: event, event_type: e1}
- at: 23
  send: {type: event, event_type: tick}
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: e2}
- at: 26
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 26
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 28
  set: [input_boolean.b1, 'on']
- at: 29
  send: {type: event, event_type: e1}
- at: 32
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 33
  send: {type: event, event_type: e2}

# random scenario, seed 101, index 281 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: time, at: '22:13:33'}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
  - condition: not
    conditions:
    - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
  - variables: {v1: x}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - parallel:
    - sequence:
      - parallel:
        - sequence:
          - {delay: 1}
          - action: test.s2
            data: {n: 2, v: '{{ trigger.description }}'}
            target: {entity_id: light.l1}
            response_variable: v2
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ trigger.idx }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - wait_for_trigger:
            - trigger: event
              event_type: e3
              event_data: {k: a}
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - action: test.s5
        target: {entity_id: light.l1}
        response_variable: v3
      - {event: m_6}
      - sequence:
        - if:
          - condition: not
            conditions:
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
            - condition: state
              entity_id: light.l2
              state: ['off', unavailable]
              enabled: false
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
          then:
          - event: m_7
            event_data: {n: 7, v: '{{ trigger.description }}', var: '{{ v2 | default(''undef'') }}'}
          - {condition: time, after: '22:00'}
        enabled: false
    continue_on_error: true
  - action: test.s8
    data: {n: 8, v: '{{ this.attributes.current }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, for: 3}
    - trigger: state
      entity_id: light.l2
      not_from: ['off', 'on']
      to: ['off', 'on']
      for: {seconds: 2}
    timeout: 1
  - parallel:
    - sequence:
      - repeat:
          count: 0
          sequence:
          - {stop: s}
          - if:
            - condition: and
              conditions:
              - condition: trigger
                id: [beta, '0']
              - {condition: state, entity_id: light.l2, state: 'on', for: '00:00:03'}
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
              - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
            then:
            - {action: test.s9}
            else:
            - {delay: 2}
            - variables: {v4: x}
            - {event: m_10}
          - {delay: '{{ 1 }}'}
      - sequence:
        - variables: {v3: '{{ states(''sensor.s1'') }}'}
    - sequence:
      - action: test.s11
        data: {n: 11, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
        - {trigger: event, event_type: e1}
        timeout: 1
    continue_on_error: true
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  set: [sensor.s1, '4']
- at: 7
  send: {type: event, event_type: e3}
- at: 8
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 9
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 10
  set: [sensor.s2, '12']
- at: 12
  send: {type: service_result, call_id: 2, ok: false, error_kind: invalid}
- at: 15
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 19
  set: [sensor.s1, '1']
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 21
  set: [sensor.s2, abc]
  attributes: {lvl: 3}
- at: 22
  send: {type: event, event_type: e3}
- at: 23
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: e2}
- at: 27
  send: {type: event, event_type: e2}

# random scenario, seed 101, index 86 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, light.l1]
    not_from: ['on', unavailable]
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.id }}'}
  - action: test.s2
    data: {n: 2, v: '{{ trigger.id }}'}
    continue_on_error: true
  - if:
    - or:
      - condition: trigger
        id: [beta, '0']
      - condition: not
        conditions:
        - {condition: trigger, id: '1'}
        - {condition: time, after: '22:13:25', before: '22:13:30'}
        - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    - condition: state
      entity_id: [light.l1, sensor.s2]
      state: 'on'
      match: any
    then:
    - action: test.s3
      data: {n: 3, v: '{{ trigger.description }}'}
    - event: m_4
      event_data: {n: 4, v: '{{ trigger.platform }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 0, continue_on_timeout: false}
  - if:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - {condition: time, after: '22:13:25'}
    then:
    - {event: m_5}
    else:
    - parallel:
      - sequence:
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
      - sequence:
        - {wait_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
      - sequence:
        - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '00:00:03'}
        - event: m_7
          event_data: {n: 7, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 5
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '20']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s1, '12']
- at: 13
  send: {type: event, event_type: e2}
- at: 15
  set: [sensor.s1, '20']
- at: 16
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 17
  set: [input_boolean.b1, 'on']
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 19
  set: [light.l2, 'on']
- at: 20
  send: {type: event, event_type: e3}
- at: 21
  set: [light.l1, 'on']
- at: 23
  send: {type: event, event_type: e1}
- at: 24
  set: [sensor.s1, '8']
- at: 25
  set: [light.l2, unavailable]
- at: 28
  set: [light.l1, unavailable]
- at: 31
  set: [input_boolean.b1, unavailable]
- at: 32
  send: {type: event, event_type: tick}
- at: 35
  set: [input_boolean.b1, 'off']
- at: 35
  send: {type: event, event_type: e2}
- at: 38
  send: {type: event, event_type: e1}

# random scenario, seed 101, index 62 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: light.l2, id: beta}
  - {trigger: time, at: '22:13:33'}
  - trigger: state
    entity_id: sensor.s2
    from: [abc, unknown]
  conditions:
  - condition: state
    entity_id: sensor.s1
    state: unknown
    for: {seconds: 1}
  actions:
  - condition: time
    before: 06:00
    weekday: [wed, mon]
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0}

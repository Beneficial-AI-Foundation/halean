# random scenario, seed 101, index 243 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - wait_for_trigger:
    - trigger: event
      event_type: e3
      event_data: {k: true}
    - {trigger: state, entity_id: sensor.s2}
    timeout: 2
  - sequence:
    - {condition: state, entity_id: input_boolean.b1, state: 'off'}
    - variables: {v1: x}
    continue_on_error: true
  - wait_for_trigger:
    - trigger: event
      event_type: e2
      event_data: {k: true}
    timeout: 0
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '{{ 2 }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', for: '{{ 2 }}'}
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: time_pattern, seconds: /3}
  actions:
  - sequence:
    - action: test.s2
      data: {n: 2, v: '{{ trigger.platform }}'}
    - parallel:
      - sequence:
        - {delay: 0}
        - {stop: s}
      - {event: m_3}
      - {event: m_4}
      enabled: false
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: '{{ 2 }}'}
  - action: test.s5
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    continue_on_error: true
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 1}
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 3
  set: [light.l2, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, '1']
- at: 6
  send: {type: service_result, call_id: 0, ok: true}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 8
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '7.5']
- at: 12
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 13
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 15
  set: [input_boolean.b1, 'on']
- at: 16
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 19
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 20
  set: [light.l2, 'off']
- at: 21
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 21
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l2, unavailable]
  attributes: {lvl: 1}

# random scenario, seed 101, index 75 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: time, at: '22:13:26', id: beta}
  actions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - {delay: 2}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 1}
  - action: test.s1
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    continue_on_error: true
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
  conditions:
  - condition: state
    entity_id: [light.l2, sensor.s1]
    state: 'on'
    match: any
  actions:
  - action: test.s2
    target:
      entity_id: [light.l1, light.l2]
  - if:
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
    then:
    - action: test.s3
      data: {n: 3, v: '{{ trigger.description }}'}
    - {stop: s}
    continue_on_error: true
  - repeat:
      while:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - action: test.s4
        data: {n: 4, v: '{{ trigger.platform }}'}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: abc}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 3
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l2, 'on']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 8
  send: {type: event, event_type: e3}
- at: 11
  set: [light.l2, unavailable]
- at: 11
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 12
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 14
  set: [light.l1, 'off']
- at: 15
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 22
  set: [input_boolean.b1, 'on']
- at: 24
  set: [light.l2, 'off']
- at: 27
  set: [light.l1, unavailable]
- at: 30
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 31
  send: {type: event, event_type: tick}
- at: 31
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 32
  send: {type: event, event_type: tick}
- at: 33
  send:
    type: event
    event_type: e3
    data: {k: 2}

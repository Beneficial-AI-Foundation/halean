# random scenario, seed 101, index 228 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  - {trigger: time, at: '22:13:26'}
  actions:
  - action: test.s1
    target: {entity_id: light.l1}
  - sequence:
    - wait_for_trigger:
      - {trigger: state, entity_id: light.l2, from: 1, not_to: 1, attribute: lvl}
      timeout: 1
      continue_on_timeout: false
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    enabled: false
  - action: test.s3
    data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    response_variable: v1
  variables: {v1: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  conditions:
  - {condition: trigger, id: '1'}
  actions:
  - {stop: s, error: true}
  - {delay: 0, enabled: false}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - {condition: state, entity_id: light.l1, state: unavailable}
        enabled: false
      - or:
        - or:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {condition: state, entity_id: light.l1, state: unavailable}
      sequence:
      - sequence:
        - event: m_4
          event_data: {n: 4, v: '{{ trigger.description }}'}
        - if:
          - condition: or
            conditions:
            - {condition: state, entity_id: input_boolean.b1, state: 'off'}
            - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
          then:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - {delay: 0}
          else:
          - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
          - action: test.s5
            data: {n: 5, v: '{{ now().second }}'}
          - variables: {v3: 1}
            enabled: false
        continue_on_error: true
      - {stop: s}
      - event: m_6
        event_data: {n: 6, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      - {condition: state, entity_id: light.l2, state: 'on'}
      sequence:
      - action: test.s7
        data: {n: 7, v: '{{ trigger.platform }}'}
      - repeat:
          while: ['{{ states(''sensor.s2'') | float(0) < 5 }}', '{{ repeat.index <= 2 }}']
          sequence:
          - event: m_8
            event_data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
        continue_on_error: true
    default:
    - {event: m_9}
  - condition: not
    conditions:
    - or:
      - {condition: trigger, id: '1'}
    - '{{ states(''sensor.s1'') | int > 5 }}'
  - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, for: '{{ 2 }}'}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
  conditions:
  - and:
    - condition: state
      entity_id: [light.l2, light.l1]
      state: 'on'
      match: any
    - condition: not
      conditions:
      - condition: trigger
        id: [beta, '0']
      - {condition: time, before: '06:00'}
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3}
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
  - condition: or
    conditions:
    - condition: trigger
      id: [beta, '0']
    - {condition: time, before: '22:13:30'}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s10
    data: {n: 10, v: '{{ states(''sensor.s1'') }}'}
    continue_on_error: true
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
steps:
- at: 1
  set: [sensor.s1, '8']
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e2}
- at: 8
  set: [light.l2, 'off']
- at: 9
  send: {type: service_result, call_id: 0, ok: true}
- at: 10
  set: [light.l2, 'on']
- at: 11
  set: [light.l1, unavailable]
- at: 12
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 13
  send: {type: service_result, call_id: 3, ok: false, error_kind: other}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: e1}
- at: 15
  set: [sensor.s1, '20']
- at: 16
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 18
  set: [light.l2, unavailable]
- at: 19
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: x}
- at: 24
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 25
  set: [sensor.s1, '4']
- at: 26
  send: {type: service_result, call_id: 4, ok: true}
- at: 27
  send:
    type: service_result
    call_id: 5
    ok: true
    response: {value: 1}

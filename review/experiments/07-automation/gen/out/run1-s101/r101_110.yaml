# random scenario, seed 101, index 110 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: '4', for: 3, id: alpha}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  - {trigger: time, at: '22:13:26'}
  conditions:
  - condition: or
    conditions:
    - and:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    - {condition: time, after: '22:13:25', before: '06:00', weekday: tue}
    enabled: false
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: 2, continue_on_timeout: false}
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}'}
  - {action: test.s1, response_variable: v1, enabled: false}
  - parallel:
    - sequence:
      - {delay: '{{ 1 }}'}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.id }}'}
    - sequence:
      - {wait_template: '{{ trigger.platform == ''event'' }}'}
    - sequence:
      - {event: m_3}
      - event: m_4
        event_data: {n: 4, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: '{{ 2 }}'}
  - action: test.s5
    data: {n: 5, v: '{{ now().second }}'}
    response_variable: v2
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_from: '8', id: beta}
  - {trigger: event, event_type: e1, id: beta}
  actions:
  - variables: {v1: x}
  - event: m_7
    event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
  - parallel:
    - sequence:
      - action: test.s8
        data: {n: 8, v: '{{ states(''light.l1'') }}'}
      - {stop: s}
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - {stop: s}
      - wait_for_trigger:
        - {trigger: state, entity_id: input_boolean.b1, to: 3, attribute: lvl}
        - trigger: event
          event_type: e1
          event_data: {k: 1}
        timeout: 0
      - event: m_10
        event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [input_boolean.b1, 'on']
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  set: [light.l2, 'on']
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 15
  set: [light.l1, 'on']
- at: 16
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 17
  set: [sensor.s1, '12']

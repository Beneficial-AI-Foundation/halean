# random scenario, seed 101, index 84 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1]
    from: unavailable
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  actions:
  - sequence:
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', for: 2}
      timeout: 0
    - event: m_1
      event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - wait_for_trigger:
      - trigger: event
        event_type: e3
        event_data: {k: true}
      timeout: {seconds: 2}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0, continue_on_timeout: false}
states:
- {entity_id: sensor.s1, state: '20'}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 2}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: e2}
- at: 1
  set: [sensor.s1, '1']
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 5
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: e1}
- at: 11
  set: [sensor.s1, '4']
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 17
  set: [input_boolean.b1, 'off']
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 23
  send: {type: event, event_type: e3}
- at: 23
  set: [light.l2, 'off']
- at: 26
  send: {type: event, event_type: e1}
- at: 28
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 29
  send: {type: event, event_type: e1}
- at: 30
  send: {type: event, event_type: e3}
- at: 31
  send: {type: event, event_type: tick}
- at: 32
  send: {type: event, event_type: tick}

# random scenario, seed 101, index 287 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l2, from: 'off', not_to: 'off'}
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - '{{ states(''sensor.s1'') | int(0) > 10 }}'
        - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      sequence:
      - choose:
        - conditions:
          - {condition: trigger, id: '0'}
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
            - '{{ states(''sensor.s1'') | int > 5 }}'
          sequence:
          - sequence:
            - condition: not
              conditions: ['{{ states(''sensor.s2'') | float(0) < 9 }}']
            - {event: m_1}
          - wait_for_trigger:
            - trigger: state
              entity_id: light.l2
              to: [unavailable, 'on']
              from: [unavailable, 'off']
            timeout: 3
          - event: m_2
            event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - conditions:
          - condition: or
            conditions:
            - condition: not
              conditions:
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
              - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
              - '{{ states(''sensor.s1'') | int > 5 }}'
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
          sequence:
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - {delay: '00:00:02'}
        default:
        - choose:
          - conditions:
            - {condition: state, entity_id: input_boolean.b1, state: 'on'}
            sequence:
            - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - {event: m_3}
        enabled: false
      - {action: test.s4, continue_on_error: true, response_variable: v2}
  - {delay: 1}
  - {stop: s}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  triggers:
  - trigger: state
    entity_id: [sensor.s2]
    from: '7.5'
  actions:
  - if:
    - {condition: state, entity_id: sensor.s2, state: abc}
    then:
    - sequence:
      - condition: not
        conditions:
        - and:
          - condition: trigger
            id: [beta, '0']
          - {condition: time, before: '06:00'}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      - {stop: s}
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {event: m_5}
          - {event: m_6}
      continue_on_error: true
    - action: test.s7
      data: {n: 7, v: '{{ trigger.idx }}'}
      continue_on_error: true
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - {condition: state, entity_id: light.l2, state: unavailable}
          sequence:
          - if: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
            then:
            - {event: m_8}
          - {stop: s}
          - variables: {v1: 1}
        - conditions:
          - {condition: state, entity_id: input_boolean.b1, state: 'off'}
          sequence:
          - action: test.s9
            data: {n: 9, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          - event: m_10
            event_data: {n: 10, v: '{{ trigger.id }}'}
          - {event: m_11}
        default:
        - {event: m_12}
      - {delay: 0}
    - {event: m_13}
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', enabled: false}
      - event: m_14
        event_data: {n: 14, completed: '{{ wait.completed }}'}
      - {delay: 2}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 2
  set: [light.l1, 'off']
- at: 3
  send: {type: event, event_type: e1}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 7
  set: [sensor.s2, '7.5']
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 13
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e1}
- at: 16
  set: [light.l2, 'on']
- at: 17
  set: [input_boolean.b1, 'off']
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 20
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 21
  set: [sensor.s2, abc]
  attributes: {lvl: 1}
- at: 22
  send: {type: service_result, call_id: 0, ok: true}
- at: 23
  send: {type: event, event_type: e2}
- at: 23
  send: {type: service_result, call_id: 1, ok: true}

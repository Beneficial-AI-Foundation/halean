# random scenario, seed 101, index 192 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - trigger: state
    entity_id: sensor.s1
    to: [unknown, '1']
    from: unknown
    for: {seconds: 2}
    id: alpha
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 9}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - if:
    - {condition: state, entity_id: light.l2, state: 'on'}
    then:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.idx }}'}
    - choose:
      - conditions:
        - or:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
          - condition: not
            conditions:
            - {condition: trigger, id: alpha}
        - {condition: time, after: '22:13:25'}
        sequence:
        - if:
          - condition: time
            before: 06:00
            weekday: [wed, mon]
          then:
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          else:
          - {delay: '00:00:02'}
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - event: m_3
          event_data: {n: 3, completed: '{{ wait.completed }}'}
      - conditions:
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        sequence:
        - if:
          - '{{ is_state(''light.l2'', ''off'') }}'
          - not:
            - {condition: state, entity_id: input_boolean.b1, state: 'on'}
          then:
          - {action: test.s4}
          - action: test.s5
            target:
              entity_id: [light.l1, light.l2]
          else:
          - {action: test.s6}
    - event: m_7
      event_data: {n: 7, v: '{{ trigger.idx }}'}
    else:
    - variables:
        v1: [a, '{{ 1 + 1 }}']
    continue_on_error: true
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - {condition: trigger, id: alpha}
    then:
    - sequence:
      - {event: m_8}
      continue_on_error: true
    - {action: test.s9, response_variable: v3}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - trigger: state
    entity_id: input_boolean.b1
    to: 'off'
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - parallel:
    - sequence:
      - {stop: s}
      - repeat:
          count: 2
          sequence:
          - parallel:
            - sequence:
              - action: test.s10
                data: {n: 10, v: '{{ states(''light.l1'') }}'}
                target: {entity_id: light.l1}
              - action: test.s11
                data: {n: 11, v: '{{ states(''light.l1'') }}'}
                continue_on_error: true
            - sequence:
              - {delay: 2}
              - action: test.s12
                data: {n: 12, v: '{{ trigger.idx }}'}
                response_variable: v2
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3}
          sequence:
          - {delay: 0}
        - conditions:
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            - '{{ is_state(''light.l2'', ''off'') }}'
          sequence:
          - event: m_13
            event_data: {n: 13, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
          - repeat:
              until: ['{{ repeat.index >= 2 }}']
              sequence:
              - event: m_14
                event_data: {n: 14, v: '{{ now().second }}'}
        default:
        - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '{{ 2 }}', continue_on_timeout: false}
    - event: m_15
      event_data: {n: 15, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - event: m_16
      event_data: {n: 16, v: '{{ trigger.platform }}', var: '{{ v2 | default(''undef'') }}'}
  - action: test.s17
    data: {n: 17, v: '{{ states(''sensor.s1'') }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    enabled: false
  - {delay: '00:00:02'}
  - sequence:
    - {delay: '00:00:02'}
    continue_on_error: true
  - {delay: '00:00:02'}
- alias: a2
  id: id2
  mode: parallel
  triggers:
  - {trigger: state, entity_id: light.l2}
  - {trigger: time_pattern, seconds: /7}
  actions:
  - {event: m_18}
  - action: test.s19
    data: {n: 19, v: '{{ states(''sensor.s1'') }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l2]
      to: ['off', unavailable]
    - trigger: event
      event_type: e3
      event_data: {k: 1}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_20
    event_data: {n: 20, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 2
  set: [sensor.s1, '4']
- at: 5
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}
- at: 6
  set: [sensor.s2, '1']
- at: 7
  send: {type: service_result, call_id: 0, ok: true}
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 9
  send: {type: event, event_type: e1}
- at: 10
  send: {type: service_result, call_id: 1, ok: true}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 17
  set: [sensor.s1, '1']

# random scenario, seed 101, index 164 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: true}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: time, after: '22:00'}
  actions:
  - {action: test.s1}
  - parallel:
    - sequence:
      - condition: not
        conditions:
        - condition: state
          entity_id: light.l1
          state: ['off', unavailable]
        - not:
          - '{{ states(''sensor.s2'') | float(0) < 9 }}'
          - {condition: time, before: '06:00'}
          - {condition: trigger, id: '1'}
        - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
    - event: m_2
      event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 2
  set: [light.l2, 'off']
- at: 3
  set: [sensor.s1, '7.5']
- at: 3
  send: {type: event, event_type: e1}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s1, '1']
- at: 11
  send: {type: event, event_type: e1}
- at: 11
  set: [sensor.s2, '1']
- at: 12
  set: [light.l2, 'on']
- at: 13
  set: [sensor.s2, '8']
- at: 14
  set: [sensor.s1, '7.5']
- at: 15
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 18
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [light.l2, unavailable]

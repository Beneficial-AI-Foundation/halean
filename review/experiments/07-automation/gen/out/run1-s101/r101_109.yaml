# random scenario, seed 101, index 109 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  conditions:
  - {condition: trigger, id: '1'}
  - {condition: time, after: '22:00', before: '22:13:30', weekday: tue}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
  - if:
    - or:
      - not:
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    then:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.platform }}'}
    else:
    - sequence:
      - repeat:
          count: 1
          sequence:
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          - {delay: 2}
      - repeat:
          count: '{{ 2 }}'
          sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
    - if:
      - {condition: trigger, id: '1'}
      then:
      - action: test.s3
        data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - {action: test.s4}
      else:
      - action: test.s5
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      - {event: m_6}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', for: '00:00:02'}
    - {trigger: state, entity_id: light.l2, not_to: unavailable, for: '{{ 2 }}'}
    timeout: {seconds: 2}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {event: m_7}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
    id: beta
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - event: m_9
    event_data: {n: 9, v: '{{ states(''sensor.s1'') }}'}
  - {condition: time, before: '06:00'}
- alias: a2
  id: id2
  triggers:
  - trigger: state
    entity_id: [light.l2, sensor.s2]
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s10
    data: {n: 10, v: '{{ states(''light.l1'') }}'}
    continue_on_error: true
  - repeat:
      count: 3
      sequence:
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - parallel:
        - sequence:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - sequence:
          - parallel:
            - sequence:
              - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
              - event: m_11
                event_data: {n: 11, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
            - {event: m_12}
          - choose:
            - conditions:
              - condition: and
                conditions:
                - condition: or
                  conditions:
                  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}', enabled: false}
                - or:
                  - {condition: time, after: '22:13:25', before: '06:00'}
                  - {condition: state, entity_id: light.l1, state: 'on', enabled: false}
                - and:
                  - '{{ states(''sensor.s1'') | int > 5 }}'
                  - {condition: numeric_state, entity_id: sensor.s2, below: 9}
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
              sequence:
              - condition: and
                conditions: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
              - action: test.s13
                data: {n: 13, v: '{{ now().second }}'}
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - sequence:
          - action: test.s14
            data: {n: 14, v: '{{ trigger.idx }}'}
            target: {entity_id: light.l1}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 1}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [sensor.s2, unavailable]
- at: 7
  set: [light.l2, 'on']
- at: 8
  set: [light.l2, unavailable]
- at: 10
  send: {type: event, event_type: e3}
- at: 11
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 11
  set: [sensor.s1, unknown]
- at: 12
  send: {type: event, event_type: e2}
- at: 15
  set: [light.l1, unavailable]
- at: 16
  send: {type: service_result, call_id: 0, ok: true}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 22
  set: [sensor.s2, '7.5']
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 25
  set: [sensor.s1, unavailable]
- at: 27
  set: [light.l1, 'on']
  attributes: {lvl: 2}

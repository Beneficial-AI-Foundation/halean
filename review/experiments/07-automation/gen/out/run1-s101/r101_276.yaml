# random scenario, seed 101, index 276 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
  - trigger: event
    event_type: e1
    event_data: {k: true}
    id: alpha
  - trigger: event
    event_type: e2
    event_data: {k: 1}
    id: beta
  actions:
  - action: test.s1
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 1}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 4
  set: [sensor.s2, unavailable]
- at: 5
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s1, unknown]
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [input_boolean.b1, unavailable]
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 14
  set: [light.l1, unavailable]
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 18
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 22
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 25
  send: {type: event, event_type: e3}
- at: 26
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 27
  send: {type: event, event_type: e3}
- at: 28
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 29
  set: [light.l1, unavailable]
- at: 30
  send: {type: service_result, call_id: 0, ok: true}

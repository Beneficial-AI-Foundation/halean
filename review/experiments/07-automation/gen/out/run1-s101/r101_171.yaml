# random scenario, seed 101, index 171 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: 1, id: alpha}
  conditions:
  - {condition: time, after: '22:13:25', before: '22:13:30'}
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - parallel:
    - sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 0}
      - parallel:
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ states(''light.l1'') }}'}
            continue_on_error: true
        - sequence:
          - {stop: s, error: true}
          - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
        - sequence:
          - action: test.s4
            data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 0, continue_on_timeout: false}
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}'}
      - sequence:
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
          timeout: 3
        - event: m_7
          event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {event: m_6}
        - {delay: 2}
        continue_on_error: true
    - sequence:
      - condition: trigger
        id: [beta, '0']
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1]
    to: 'on'
    from: 'on'
  actions:
  - if:
    - condition: time
      after: '22:13:25'
      before: 06:00
      weekday: [tue]
    then:
    - if:
      - '{{ is_state(''light.l2'', ''off'') }}'
      - {condition: time, before: '06:00'}
      then:
      - condition: time
        before: 06:00
        weekday: [wed, mon]
      else:
      - choose:
        - conditions:
          - {condition: trigger, id: '0'}
          sequence:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
        - conditions:
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - condition: trigger
            id: [beta, '0']
          sequence:
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          - {event: m_8}
          - action: test.s9
            data: {n: 9, v: '{{ now().second }}'}
            response_variable: v2
      - event: m_10
        event_data: {n: 10, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v2 | default(''undef'') }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      - condition: and
        conditions:
        - or:
          - condition: state
            entity_id: [light.l2, sensor.s2]
            state: 'on'
            match: any
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
          - '{{ states(''sensor.s1'') | int(0) > 7 }}'
        - condition: state
          entity_id: sensor.s1
          state: ['7.5', '4']
        - condition: and
          conditions:
          - {condition: trigger, id: '0'}
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: sensor.s1
          not_to: '8'
          for: {seconds: '{{ 1 + 1 }}'}
      - condition: time
        after: '22:00'
        before: '22:13:30'
        weekday: [wed, mon]
  - parallel:
    - event: m_11
      event_data: {n: 11, v: '{{ now().second }}'}
    - sequence:
      - {event: m_12}
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
    - event: m_13
      event_data: {n: 13, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v3 | default(''undef'') }}'}
    continue_on_error: true
  - event: m_14
    event_data: {n: 14, v: '{{ trigger.description }}', var: '{{ v3 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 4
  set: [input_boolean.b1, 'on']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s2, '12']
  attributes: {lvl: 2}
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 8
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 10
  set: [light.l2, 'off']
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s2, '8']
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 14
  set: [input_boolean.b1, 'off']
- at: 15
  set: [sensor.s2, '12']
- at: 16
  set: [light.l2, unavailable]
- at: 16
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: e1}
- at: 19
  set: [sensor.s1, unavailable]
- at: 20
  set: [sensor.s1, '4']
- at: 21
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 21
  set: [light.l1, 'off']
- at: 24
  set: [sensor.s2, unavailable]

# random scenario, seed 101, index 117 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, id: alpha}
  - {trigger: time_pattern, seconds: /3}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
  actions:
  - sequence:
    - event: m_1
      event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - {stop: s}
  - {event: m_2}
  - delay: {seconds: '{{ 2 }}'}
  - sequence:
    - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: '00:00:03'}
    - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 1, continue_on_timeout: false}
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}'}
    continue_on_error: true
  - event: m_4
    event_data: {n: 4, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 6
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 12
  set: [light.l1, unavailable]
- at: 13
  set: [input_boolean.b1, unavailable]
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [sensor.s2, abc]
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 17
  set: [sensor.s1, abc]
- at: 18
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 24
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 27
  send: {type: event, event_type: tick}

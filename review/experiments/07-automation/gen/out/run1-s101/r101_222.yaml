# random scenario, seed 101, index 222 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: light.l1}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - repeat:
      count: 2
      sequence:
      - {stop: s}
      - repeat:
          count: 0
          sequence:
          - {stop: s}
          - {stop: s}
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0, continue_on_timeout: false}
  - parallel:
    - sequence:
      - parallel:
        - {event: m_1}
        - sequence:
          - wait_for_trigger:
            - trigger: event
              event_type: e1
              event_data: {k: true}
            timeout: 0
            continue_on_timeout: false
          - {stop: s}
    - sequence:
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0, continue_on_timeout: false}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
    then:
    - sequence:
      - choose:
        - conditions:
          - {condition: state, entity_id: sensor.s2, state: '12'}
          sequence:
          - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
          - {action: test.s2, continue_on_error: true}
        - conditions:
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}', enabled: false}
          sequence:
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
          - event: m_3
            event_data: {n: 3, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
          - condition: state
            entity_id: sensor.s1
            state: ['8', '20']
      - action: test.s4
        data: {n: 4, v: '{{ now().second }}'}
        enabled: false
    - repeat:
        for_each: '{{ [''x'', 1] }}'
        sequence:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - if:
          - {condition: time, after: '23:00:00'}
          then:
          - {delay: 0}
    continue_on_error: true
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', for: '00:00:02'}
  actions:
  - delay: {seconds: '{{ 2 }}'}
  - parallel:
    - sequence:
      - sequence:
        - wait_for_trigger:
          - trigger: event
            event_type: e1
            event_data: {k: 1}
          timeout: {seconds: 2}
          continue_on_timeout: false
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - action: test.s5
            data: {n: 5, v: '{{ states(''light.l1'') }}'}
            continue_on_error: true
    - sequence:
      - wait_for_trigger:
        - trigger: event
          event_type: e2
          event_data: {k: a}
        timeout: 2
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - condition: and
    conditions:
    - {condition: state, entity_id: input_boolean.b1, state: unavailable}
    - {condition: state, entity_id: light.l1, state: 'on'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 3
  set: [sensor.s1, unknown]
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'on']
- at: 6
  send: {type: event, event_type: e3}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s1, abc]
- at: 11
  set: [sensor.s1, '12']
- at: 11
  set: [sensor.s1, '4']
- at: 12
  send: {type: event, event_type: e1}
- at: 13
  send: {type: event, event_type: e3}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'off']
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s2, '8']
- at: 22
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 23
  set: [input_boolean.b1, 'on']
- at: 24
  set: [sensor.s1, '1']
  attributes: {lvl: 2}

# random scenario, seed 101, index 256 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  - {trigger: time_pattern, seconds: /7}
  actions:
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - {delay: '00:00:02'}
states:
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s1, '1']
- at: 2
  set: [sensor.s1, unavailable]
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 7
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 9
  set: [light.l1, unavailable]
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 13
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  set: [light.l1, unavailable]
- at: 20
  set: [input_boolean.b1, 'on']
- at: 22
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 23
  set: [light.l2, unavailable]
- at: 25
  set: [input_boolean.b1, unavailable]
- at: 26
  set: [light.l1, 'on']
- at: 27
  set: [light.l1, unavailable]
- at: 29
  send: {type: event, event_type: tick}
- at: 30
  send:
    type: event
    event_type: e3
    data: {k: 2}

# random scenario, seed 101, index 213 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  - {trigger: time, at: '22:13:26'}
  - {trigger: event, event_type: e1, id: alpha}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ now().second }}'}
  - if:
    - {condition: trigger, id: '0'}
    then:
    - if:
      - condition: and
        conditions:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.s1
            state: ['7.5', '1']
        - {condition: trigger, id: '1', enabled: false}
        - {condition: time, after: '22:00'}
      - {condition: time, before: '06:00', enabled: false}
      then:
      - parallel:
        - sequence:
          - action: test.s2
            data: {n: 2, v: '{{ trigger.id }}'}
          - event: m_3
            event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
      else:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: light.gone
            state: [unavailable, 'on']
            enabled: false
          sequence:
          - action: test.s5
            data: {n: 5, v: '{{ trigger.description }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - conditions: ['{{ is_state(''light.l2'', ''off'') }}']
          sequence:
          - action: test.s6
            data: {n: 6, v: '{{ now().second }}'}
            target:
              entity_id: [light.l1, light.l2]
            continue_on_error: true
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          - variables:
              v2: [a, '{{ 1 + 1 }}']
        default:
        - event: m_7
          event_data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
        - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
    enabled: false
  - event: m_8
    event_data: {n: 8, v: '{{ now().second }}', var: '{{ v2 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 1
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s1, '8']
- at: 5
  set: [light.l1, 'off']
- at: 8
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l2, 'off']
- at: 11
  send: {type: event, event_type: e3}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 13
  set: [light.l2, 'on']
- at: 14
  send: {type: event, event_type: e2}
- at: 17
  send: {type: event, event_type: e2}
- at: 18
  set: [input_boolean.b1, 'off']
- at: 19
  send: {type: event, event_type: e1}
- at: 21
  send: {type: event, event_type: tick}
- at: 24
  set: [sensor.s2, '7.5']
- at: 27
  send: {type: event, event_type: tick}
- at: 28
  send: {type: event, event_type: e3}

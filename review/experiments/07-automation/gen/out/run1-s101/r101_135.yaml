# random scenario, seed 101, index 135 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, for: 1}
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  actions:
  - wait_for_trigger:
    - trigger: event
      event_type: e2
      event_data: {k: true}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - parallel:
    - sequence:
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
    - sequence:
      - {stop: s}
    - sequence:
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
        timeout: {seconds: 2}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - if: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
        then:
        - choose:
          - conditions:
            - {condition: time, after: '22:00'}
            sequence:
            - condition: and
              conditions:
              - and:
                - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
                - {condition: time, after: '22:00'}
              - condition: and
                conditions:
                - {condition: trigger, id: '0', enabled: false}
          - conditions:
            - {condition: time, after: '22:13:25'}
            sequence:
            - variables:
                v1: [a, '{{ 1 + 1 }}']
            - action: test.s1
              data: {n: 1, v: '{{ trigger.idx }}'}
              continue_on_error: true
        else:
        - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '{{ 2 }}'}
        - event: m_2
          event_data: {n: 2, completed: '{{ wait.completed }}'}
        - sequence:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
        enabled: false
      - wait_for_trigger:
        - trigger: event
          event_type: e2
          event_data: {k: a}
  - action: test.s4
    data: {n: 4, v: '{{ trigger.id }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 1
  set: [light.l2, 'on']
- at: 1
  set: [input_boolean.b1, 'off']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 4
  set: [light.l1, 'on']
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e1}
- at: 8
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 9
  set: [light.l1, 'off']
- at: 12
  set: [sensor.s2, '20']
  attributes: {lvl: 2}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s2, '12']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, 'on']
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: 1}

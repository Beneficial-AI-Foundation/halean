# random scenario, seed 101, index 108 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: 23}
  actions:
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      sequence:
      - parallel:
        - sequence:
          - if:
            - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
            then:
            - event: m_1
              event_data: {n: 1, v: '{{ trigger.description }}'}
          - parallel:
            - sequence:
              - action: test.s2
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            - sequence:
              - {delay: 0}
              - {action: test.s3}
            - sequence:
              - action: test.s4
                data: {n: 4, v: '{{ this.attributes.current }}'}
              - delay: {seconds: 1}
              - delay: {seconds: '{{ 2 }}'}
        - event: m_5
          event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
      - event: m_6
        event_data: {n: 6, v: '{{ trigger.idx }}'}
      - sequence:
        - choose:
          - conditions:
            - condition: not
              conditions:
              - or:
                - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
                enabled: false
              - condition: state
                entity_id: input_boolean.b1
                state: ['off', unavailable]
                for: 00:00:03
              - {condition: time, after: '22:00', before: '22:14'}
            sequence:
            - action: test.s7
              data: {n: 7, v: '{{ trigger.description }}'}
              continue_on_error: true
              response_variable: v1
        - action: test.s8
          data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {stop: s}
  - {event: m_9}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - condition: and
    conditions:
    - not:
      - {condition: state, entity_id: input_boolean.b1, state: unavailable, for: '00:00:03'}
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
  actions:
  - event: m_10
    event_data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - repeat:
      until: ['{{ repeat.index >= 1 }}']
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - action: test.s11
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - {stop: s}
        continue_on_error: true
- alias: a2
  id: id2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  actions:
  - if:
    - {condition: state, entity_id: light.l1, state: 'off'}
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
    then:
    - action: test.s12
      target: {entity_id: light.l1}
      response_variable: v1
    - choose:
      - conditions:
        - or:
          - {condition: trigger, id: alpha}
        sequence:
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - action: test.s13
          data: {n: 13, v: '{{ this.attributes.current }}'}
        - choose:
          - conditions:
            - condition: not
              conditions:
              - condition: trigger
                id: [beta, '0']
              - {condition: state, entity_id: light.l1, state: 'off'}
            sequence:
            - action: test.s14
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            - event: m_15
              event_data: {n: 15, v: '{{ trigger.description }}', var: '{{ v2 | default(''undef'') }}'}
          - conditions:
            - {condition: time, before: '06:00'}
            sequence:
            - {action: test.s16, response_variable: v3}
      default:
      - {action: test.s17}
    - parallel:
      - {event: m_18}
      - sequence:
        - parallel:
          - sequence:
            - variables: {v4: '{{ (v4 | default(0) | int(0)) + 1 }}'}
            - {event: m_19}
          - sequence:
            - event: m_20
              event_data: {n: 20, v: '{{ states(''light.l1'') }}'}
          - sequence:
            - variables: {v5: '{{ states(''sensor.s1'') }}'}
      enabled: false
    else:
    - variables:
        v6: [a, '{{ 1 + 1 }}']
      enabled: false
    - wait_for_trigger:
      - {trigger: event, event_type: e2}
      timeout: 2
  - {delay: 0}
  - event: m_21
    event_data: {n: 21, v: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '4'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [input_boolean.b1, 'on']
- at: 2
  send: {type: event, event_type: e3}
- at: 2
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l2, 'on']
- at: 5
  set: [sensor.s1, '8']
- at: 6
  send: {type: event, event_type: e1}
- at: 8
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 11
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 12
  set: [light.l1, 'off']
- at: 13
  send: {type: event, event_type: e1}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 23
  set: [light.l2, 'on']
- at: 23
  set: [input_boolean.b1, 'off']
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 25
  send: {type: event, event_type: tick}

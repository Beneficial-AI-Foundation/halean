# random scenario, seed 101, index 283 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  actions:
  - {condition: time, before: '22:13:30'}
  - parallel:
    - {event: m_1}
    - sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ this.attributes.current }}'}
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
    enabled: false
  - choose:
    - conditions: ['{{ trigger.platform == ''event'' }}']
      sequence:
      - parallel:
        - event: m_3
          event_data: {n: 3, v: '{{ now().second }}'}
        - sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ now().second }}'}
            enabled: false
          - event: m_5
            event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - event: m_6
        event_data: {n: 6, v: '{{ now().second }}'}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [input_boolean.b1, 'off']
- at: 2
  send: {type: event, event_type: e2}
- at: 5
  set: [light.l1, 'off']
- at: 6
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s2, '20']
- at: 10
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 14
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: e3}
- at: 17
  set: [sensor.s2, unavailable]
- at: 18
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 19
  set: [input_boolean.b1, 'on']
- at: 22
  set: [sensor.s2, unknown]
  attributes: {lvl: 2}
- at: 22
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  set: [light.l2, unavailable]
- at: 25
  send: {type: event, event_type: e3}
- at: 25
  set: [light.l2, 'off']
- at: 26
  set: [light.l1, unavailable]
- at: 26
  set: [sensor.s2, unavailable]
- at: 26
  send: {type: event, event_type: tick}

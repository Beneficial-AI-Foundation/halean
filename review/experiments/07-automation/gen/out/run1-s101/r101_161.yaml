# random scenario, seed 101, index 161 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  - {trigger: state, entity_id: sensor.s1, from: abc, for: 2}
  actions:
  - repeat:
      while:
      - {condition: time, before: '22:14'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ this.attributes.current }}'}
  - action: test.s2
    data: {n: 2, v: '{{ trigger.idx }}'}
  - {event: m_3}
  - sequence:
    - variables: {v1: '{{ states(''sensor.s1'') }}'}
    - {condition: time, before: '22:13:30'}
    - condition: not
      conditions:
      - {condition: time, before: '22:13:30'}
      - {condition: trigger, id: '0'}
      - {condition: state, entity_id: light.l2, state: 'on'}
  - {event: m_4}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - {delay: '00:00:02'}
  - repeat:
      count: 2
      sequence:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2, continue_on_timeout: false}
      - event: m_6
        event_data: {n: 6, completed: '{{ wait.completed }}'}
      - repeat:
          until:
          - condition: or
            conditions:
            - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - event: m_5
            event_data: {n: 5, v: '{{ now().second }}'}
      - wait_for_trigger:
        - trigger: state
          entity_id: [sensor.s1, sensor.s2]
          not_from: unavailable
        - trigger: numeric_state
          entity_id: sensor.s2
          above: 3
          below: 10
          value_template: '{{ state.state | float(0) * 2 }}'
          for: {seconds: 2}
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - event: m_8
      event_data: {n: 8, v: '{{ trigger.platform }}'}
  - {event: m_9}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '1']
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 7
  set: [sensor.s2, '12']
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 8
  set: [sensor.s2, abc]
- at: 10
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 11
  send: {type: event, event_type: e3}
- at: 14
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 16
  set: [sensor.s2, '4']
  attributes: {lvl: 2}
- at: 17
  send: {type: event, event_type: e1}
- at: 17
  send: {type: event, event_type: e3}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 21
  set: [sensor.s1, abc]
- at: 22
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 23
  send: {type: event, event_type: tick}
- at: 23
  set: [sensor.s1, unavailable]

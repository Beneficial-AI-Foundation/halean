# random scenario, seed 101, index 29 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: time, at: '22:13:23', id: alpha}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  actions:
  - if:
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    then:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.idx }}'}
    - choose:
      - conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
        sequence:
        - repeat:
            count: 0
            sequence:
            - {action: test.s2}
        - action: test.s3
          data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      default:
      - {delay: '{{ 1 }}'}
      - delay: {seconds: 1}
    continue_on_error: true
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - sequence:
    - parallel:
      - sequence:
        - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 1, continue_on_timeout: false}
        - choose:
          - conditions:
            - {condition: state, entity_id: light.l1, state: 'off'}
            sequence:
            - action: test.s4
              data: {n: 4, v: '{{ this.attributes.current }}'}
            - action: test.s5
              target:
                entity_id: [light.l1, light.l2]
              response_variable: v2
            - {delay: 0}
          continue_on_error: true
      - {event: m_6}
  - {event: m_7}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l2}
  conditions:
  - {condition: time, after: '23:00:00'}
  actions:
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
    timeout: 3
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - if:
    - not: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
    then:
    - choose:
      - conditions:
        - condition: and
          conditions:
          - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
          - {condition: state, entity_id: light.l1, state: unavailable}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        sequence:
        - action: test.s8
          data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          response_variable: v1
        - {delay: 0}
        - action: test.s9
          data: {n: 9, v: '{{ states(''light.l1'') }}'}
      continue_on_error: true
    - repeat:
        while:
        - not:
          - '{{ trigger.id == ''0'' }}'
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          enabled: false
        - '{{ repeat.index <= 2 }}'
        sequence:
        - variables: {v1: 1}
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - {delay: 1}
  - action: test.s10
    target: {entity_id: light.l1}
  - event: m_11
    event_data: {n: 11, v: '{{ trigger.idx }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '12'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s2, '20']
  attributes: {lvl: 2}
- at: 7
  set: [sensor.s1, '8']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, 'on']
- at: 11
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 12
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 14
  send: {type: event, event_type: e2}
- at: 16
  set: [input_boolean.b1, 'off']
- at: 17
  set: [light.l2, 'off']
- at: 19
  set: [light.l1, unavailable]
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}

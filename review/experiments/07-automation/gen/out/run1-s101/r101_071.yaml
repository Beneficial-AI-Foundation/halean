# random scenario, seed 101, index 71 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - trigger: event
    event_type: e3
    event_data: {k: 1}
    id: beta
  conditions:
  - {condition: state, entity_id: light.l2, state: 'on'}
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - parallel:
    - sequence:
      - {action: test.s1}
      - {event: m_2, enabled: false}
      - event: m_3
        event_data: {n: 3, v: '{{ trigger.id }}'}
    - sequence:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - action: test.s4
    data: {n: 4, v: '{{ now().second }}'}
    response_variable: v1
  - action: test.s5
    data: {n: 5, v: '{{ trigger.idx }}'}
  - sequence:
    - variables: {v1: 1}
    continue_on_error: true
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s2, '20']
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 17
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 20
  send: {type: event, event_type: tick}
- at: 23
  set: [sensor.s2, '4']
  attributes: {lvl: 1}
- at: 24
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  set: [light.l2, 'off']
- at: 27
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 29
  set: [sensor.s1, '8']
- at: 29
  set: [sensor.s1, unavailable]
  attributes: {lvl: 2}

# random scenario, seed 101, index 290 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: '26', id: alpha}
  - {trigger: state, entity_id: light.l2, not_to: 2, attribute: lvl, for: 1}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - parallel:
    - sequence:
      - sequence:
        - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 0, continue_on_timeout: false}
        - event: m_3
          event_data: {n: 3, completed: '{{ wait.completed }}'}
        - {event: m_2}
        continue_on_error: true
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - action: test.s4
        data: {n: 4, v: '{{ states(''light.l1'') }}'}
        target:
          entity_id: [light.l1, light.l2]
    - sequence:
      - {event: m_5}
      - sequence:
        - {stop: s}
      - event: m_6
        event_data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - if:
    - condition: and
      conditions:
      - condition: and
        conditions: ['{{ trigger.id == ''0'' }}']
        enabled: false
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    - {condition: time, after: '22:00', before: '22:14'}
    then:
    - event: m_7
      event_data: {n: 7, v: '{{ trigger.id }}'}
    - variables: {v1: '{{ states(''sensor.s1'') }}'}
    - {event: m_8}
  - choose:
    - conditions:
      - or:
        - condition: trigger
          id: [beta, '0']
        - condition: or
          conditions:
          - '{{ states(''sensor.s2'') | float(0) < 5 }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      sequence:
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0}
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}'}
    default:
    - if:
      - condition: not
        conditions:
        - and:
          - {condition: state, entity_id: sensor.s2, state: unavailable}
        - condition: or
          conditions:
          - {condition: trigger, id: '1'}
      - {condition: state, entity_id: sensor.s1, state: '20'}
      then:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  - trigger: state
    entity_id: [light.l2]
    to: 'on'
    from: [unavailable, 'off']
  conditions:
  - or:
    - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
    - condition: not
      conditions:
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - {condition: time, after: '22:00'}
      - {condition: trigger, id: '0'}
  actions:
  - action: test.s10
    data: {n: 10, v: '{{ trigger.idx }}'}
    target: {entity_id: light.l1}
  - sequence:
    - {event: m_11}
    - action: test.s12
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      continue_on_error: true
  - action: test.s13
    data: {n: 13, v: '{{ trigger.description }}'}
  - choose:
    - conditions:
      - or:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
        - condition: and
          conditions:
          - {condition: time, after: '23:00:00'}
          - {condition: trigger, id: alpha}
      sequence:
      - repeat:
          for_each: [a, b]
          sequence:
          - {event: m_14}
      - variables: {v2: '{{ states(''sensor.s1'') }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
      sequence:
      - action: test.s15
        data: {n: 15, v: '{{ trigger.description }}'}
        target:
          entity_id: [light.l1, light.l2]
      - sequence:
        - action: test.s16
          data: {n: 16, v: '{{ trigger.idx }}'}
          target: {entity_id: light.l1}
      - action: test.s17
        data: {n: 17, v: '{{ states(''sensor.s1'') }}'}
  - variables: {v2: 1}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [light.l1, unavailable]
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l2, 'on']
- at: 5
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 8
  send: {type: service_result, call_id: 0, ok: true}
- at: 9
  set: [sensor.s1, abc]
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 10
  set: [sensor.s2, '12']
- at: 11
  set: [sensor.s1, '7.5']
  attributes: {lvl: 2}
- at: 13
  send: {type: event, event_type: tick}

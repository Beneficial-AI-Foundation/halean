# random scenario, seed 202, index 29 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      sequence:
      - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: '{{ 2 }}'}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
      - if:
        - and:
          - {condition: time, after: '23:00:00', before: '22:13:30', enabled: false}
          - condition: and
            conditions:
            - {condition: time, before: '22:14'}
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            enabled: false
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        then:
        - {event: m_1}
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
          - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', for: 3}
          timeout: 0
    - conditions:
      - and:
        - '{{ is_state(''light.l1'', ''on'') }}'
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      sequence:
      - {action: test.s3, response_variable: v2}
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    default:
    - sequence:
      - choose:
        - conditions:
          - {condition: time, after: '22:13:25', before: '22:14'}
          sequence:
          - delay: {seconds: '{{ 2 }}'}
          - {delay: 0}
        - conditions:
          - condition: not
            conditions:
            - {condition: state, entity_id: light.l1, state: 'off'}
            - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
            - condition: or
              conditions:
              - {condition: time, before: '06:00'}
            enabled: false
          sequence:
          - delay: {seconds: 1}
      - action: test.s4
        data: {n: 4, v: '{{ states(''light.l1'') }}'}
    - if:
      - {condition: trigger, id: '1'}
      then:
      - wait_template: '{{ is_state(''light.l2'', ''off'') }}'
        timeout: {seconds: 2}
        continue_on_timeout: false
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}'}
      - action: test.s5
        data: {n: 5, v: '{{ trigger.id }}'}
        enabled: false
      - sequence:
        - event: m_6
          event_data: {n: 6, v: '{{ trigger.description }}'}
        - variables: {v2: '{{ states(''sensor.s1'') }}'}
          enabled: false
      else:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - sequence:
        - {action: test.s8, continue_on_error: true}
        - delay: {seconds: '{{ 2 }}'}
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      continue_on_error: true
    - delay: {seconds: '{{ 2 }}'}
    continue_on_error: true
  - parallel:
    - event: m_9
      event_data: {n: 9, v: '{{ this.attributes.current }}'}
    - sequence:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: 1}
    - sequence:
      - event: m_10
        event_data: {n: 10, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v3 | default(''undef'') }}'}
      - parallel:
        - event: m_11
          event_data: {n: 11, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - sequence:
          - {condition: trigger, id: '0'}
        - sequence:
          - wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            timeout: {seconds: 2}
            continue_on_timeout: false
          - event: m_12
            event_data: {n: 12, completed: '{{ wait.completed }}'}
          - {stop: s}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: event, event_type: e2}
  actions:
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      sequence:
      - {stop: s}
      - sequence:
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          timeout: {seconds: 2}
        - parallel:
          - {event: m_13}
          - sequence:
            - {event: m_14}
            - delay: {seconds: 1}
        - {event: m_15}
      - condition: or
        conditions:
        - {condition: state, entity_id: light.l2, state: unavailable}
        - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  - variables: {v1: x}
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - {condition: trigger, id: alpha}
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          sequence:
          - delay: {seconds: '{{ 2 }}'}
      - sequence:
        - choose:
          - conditions:
            - {condition: state, entity_id: sensor.s1, state: '7.5'}
            sequence:
            - {event: m_16}
            - event: m_17
              event_data: {n: 17, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
            - action: test.s18
              data: {n: 18, v: '{{ trigger.id }}'}
          - conditions:
            - condition: time
              after: '23:00:00'
              weekday: [tue]
              enabled: false
            sequence:
            - {condition: trigger, id: alpha}
            - event: m_19
              event_data: {n: 19, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          default:
          - {event: m_20}
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, enabled: false}
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - event: m_21
      event_data: {n: 21, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
- alias: a2
  id: id2
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, light.l1]
    not_from: unavailable
    id: beta
  actions:
  - {action: test.s22, continue_on_error: true, response_variable: v1}
  - choose:
    - conditions:
      - and:
        - condition: and
          conditions: ['{{ trigger.platform == ''event'' }}']
        - condition: state
          entity_id: light.l1
          state: ['on', 'off']
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      sequence:
      - {stop: s}
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
        timeout: 0
        continue_on_timeout: false
      - event: m_23
        event_data: {n: 23, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - conditions:
      - {condition: trigger, id: '0'}
      - {condition: trigger, id: '1'}
      sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
        timeout: 0
        continue_on_timeout: false
      - event: m_24
        event_data: {n: 24, v: '{{ trigger.description }}'}
    default:
    - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
    - {event: m_25}
  - parallel:
    - event: m_26
      event_data: {n: 26, v: '{{ trigger.description }}'}
    - {event: m_27}
    continue_on_error: true
  - variables: {v3: 1}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: or
          conditions:
          - {condition: trigger, id: '0'}
          - condition: state
            entity_id: light.l2
            state: ['off', unavailable]
            for: 00:00:03
            enabled: false
          - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
      sequence:
      - event: m_28
        event_data: {n: 28, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - repeat:
          while:
          - condition: trigger
            id: [beta, '0']
          - '{{ repeat.index <= 1 }}'
          sequence:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - {stop: s}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: e1}
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 5
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 6
  set: [sensor.s1, abc]
- at: 7
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '4']
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 15
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 16
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 19
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  set: [light.l1, unavailable]

# random scenario, seed 202, index 23 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 3, attribute: lvl}
  actions:
  - choose:
    - conditions:
      - or:
        - condition: or
          conditions:
          - '{{ is_state(''light.l1'', ''on'') }}'
          - {condition: trigger, id: alpha}
          enabled: false
      - not:
        - '{{ is_state(''light.l1'', ''on'') }}'
        - and:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
          - {condition: trigger, id: '1', enabled: false}
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      sequence:
      - choose:
        - conditions:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          sequence:
          - if: ['{{ trigger.id == ''0'' }}']
            then:
            - action: test.s1
              data: {n: 1, v: '{{ trigger.description }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - sequence:
            - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
            - {event: m_2}
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            continue_on_error: true
      - {wait_template: '{{ trigger.platform == ''event'' }}'}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
    default:
    - sequence:
      - variables: {v2: '{{ states(''sensor.s1'') }}'}
        enabled: false
  - {stop: s}
  - {action: test.s4, continue_on_error: true}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 1
  set: [sensor.s1, '7.5']
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 2
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l2, 'off']
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 3
  send: {type: event, event_type: e2}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, unknown]
- at: 9
  send: {type: event, event_type: e3}
- at: 10
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 11
  set: [light.l2, unavailable]
- at: 14
  set: [input_boolean.b1, 'on']
- at: 15
  send: {type: event, event_type: e2}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 21
  send: {type: event, event_type: tick}
- at: 23
  set: [light.l2, 'on']
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 28

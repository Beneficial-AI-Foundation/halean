# random scenario, seed 202, index 189 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {trigger: time, at: '22:13:33'}
  - {trigger: state, entity_id: light.l2, for: '00:00:02'}
  conditions:
  - {condition: state, entity_id: light.l1, state: 'on'}
  actions:
  - if:
    - {condition: state, entity_id: sensor.s2, state: '12'}
    then:
    - sequence:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
    - {event: m_1}
  - condition: and
    conditions:
    - and:
      - condition: state
        entity_id: [sensor.s1, input_boolean.b1]
        state: 'on'
        match: any
      - {condition: state, entity_id: sensor.s2, state: abc}
      - {condition: state, entity_id: light.l2, state: unavailable, for: 2}
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
  - {event: m_2}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - action: test.s3
        data: {n: 3, v: '{{ trigger.platform }}'}
      - repeat:
          while:
          - condition: state
            entity_id: sensor.s2
            state: ['4', '20']
          - '{{ repeat.index <= 2 }}'
          sequence:
          - {delay: 2}
          - {stop: s, error: true}
          - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1, continue_on_timeout: false}
  - {event: m_4}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 2
  set: [sensor.s1, unavailable]
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, '8']
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [input_boolean.b1, 'on']
- at: 8
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, unavailable]
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  send: {type: event, event_type: e2}
- at: 18
  send: {type: event, event_type: e2}
- at: 19
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 19
  set: [light.l1, 'off']
- at: 22
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}
- at: 28
  send: {type: event, event_type: tick}

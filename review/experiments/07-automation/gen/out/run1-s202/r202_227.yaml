# random scenario, seed 202, index 227 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: state, entity_id: light.l1, to: 'off', from: 'on'}
  actions:
  - delay: {seconds: '{{ 2 }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      - {condition: time, after: '22:00', before: '22:13:30'}
      sequence:
      - variables: {v1: x}
      - {delay: 0}
      - if:
        - condition: not
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
        then:
        - event: m_1
          event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
        else:
        - {stop: s, error: true}
        continue_on_error: true
    - conditions:
      - condition: and
        conditions:
        - and:
          - {condition: trigger, id: alpha}
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      sequence:
      - sequence:
        - {stop: s}
        - action: test.s2
          data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
          timeout: 3
      - parallel:
        - event: m_3
          event_data: {n: 3, v: '{{ now().second }}'}
        - sequence:
          - {event: m_4}
          - if:
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
              - {condition: trigger, id: '1'}
            - {condition: time, after: '23:00:00', before: '22:13:30'}
            then:
            - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
        - sequence:
          - {event: m_5}
          - repeat:
              for_each: '{{ states(''light.l1'') }}'
              sequence:
              - action: test.s6
                data: {n: 6, v: '{{ states(''light.l1'') }}'}
              - action: test.s7
                target:
                  entity_id: [light.l1, light.l2]
              - event: m_8
                event_data: {n: 8, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
        continue_on_error: true
    default:
    - {action: test.s9}
    continue_on_error: true
  - event: m_10
    event_data: {n: 10, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  - {stop: s}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: time_pattern, seconds: /9, id: alpha}
  conditions:
  - {condition: time, after: '22:13:25', before: '22:13:30'}
  actions:
  - action: test.s11
    target:
      entity_id: [light.l1, light.l2]
    response_variable: v1
  - {condition: trigger, id: alpha}
  - repeat:
      for_each:
      - {k: 1}
      - null
      sequence:
      - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 2, continue_on_timeout: false}
      - event: m_13
        event_data: {n: 13, completed: '{{ wait.completed }}'}
      - {event: m_12}
  - {delay: '{{ 1 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 5
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 6
  set: [input_boolean.b1, unavailable]
- at: 9
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 10
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 12
  set: [input_boolean.b1, 'on']
- at: 14
  set: [sensor.s2, '12']
- at: 14
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 273 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  conditions:
  - and:
    - condition: state
      entity_id: [sensor.s2, light.l1]
      state: 'on'
      match: any
      enabled: false
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
  - condition: time
    after: '22:13:25'
    before: '22:14'
    weekday: [wed, mon]
  actions:
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 0}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
      - sequence:
        - choose:
          - conditions:
            - {condition: state, entity_id: light.l1, state: 'off'}
            sequence:
            - variables: {v1: 1}
            - action: test.s1
              data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          default:
          - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s2, to: 2, attribute: lvl}
    continue_on_error: true
  - {stop: s, error: true}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: time
          after: '23:00:00'
          weekday: [wed, mon]
        - condition: time
          after: '22:13:25'
          before: '22:13:30'
          weekday: [wed, mon]
      sequence:
      - action: test.s3
        data: {n: 3, v: '{{ trigger.description }}'}
      - action: test.s4
        target: {entity_id: light.l1}
      - {wait_template: '{{ trigger.platform == ''event'' }}'}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
    - conditions:
      - condition: or
        conditions:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - condition: and
          conditions:
          - {condition: time, after: '22:00', before: '06:00'}
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
      sequence:
      - variables: {v3: '{{ states(''sensor.s1'') }}'}
      - action: test.s6
        data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      - {delay: '00:00:02'}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 2
  send: {type: event, event_type: e1}
- at: 4
  set: [input_boolean.b1, 'off']
- at: 7
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 8
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: e1}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 19
  set: [light.l2, 'on']
- at: 19
  set: [input_boolean.b1, unavailable]
- at: 22
  send: {type: event, event_type: e1}
- at: 25
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 27
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 30
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 30
  set: [light.l2, 'off']
- at: 32
  send: {type: event, event_type: tick}
- at: 34
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 36
  send: {type: event, event_type: tick}
- at: 37
  set: [sensor.s1, '1']
- at: 40
  send: {type: event, event_type: e2}
- at: 41
  set: [light.l1, 'on']
- at: 44
  send: {type: event, event_type: e2}
- at: 46
  set: [sensor.s2, unavailable]

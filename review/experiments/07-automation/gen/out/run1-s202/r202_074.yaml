# random scenario, seed 202, index 74 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1]
    for: 3
  conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
  actions:
  - {delay: '{{ 1 }}'}
  - repeat:
      for_each: []
      sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', for: 1}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - event: m_1
        event_data: {n: 1, v: '{{ states(''light.l1'') }}'}
      - if:
        - condition: time
          after: '22:13:25'
          before: '22:13:30'
          weekday: [tue]
        then:
        - if:
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
          then:
          - {event: m_2}
          - {action: test.s3}
          - action: test.s4
            data: {n: 4, v: '{{ trigger.description }}'}
            target: {entity_id: light.l1}
          else:
          - {delay: 1}
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, above: 6}
    then:
    - repeat:
        until: ['{{ repeat.index >= 3 }}']
        sequence:
        - {delay: 2}
        - event: m_6
          event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
      continue_on_error: true
  - {delay: '00:00:02'}
  - sequence:
    - parallel:
      - event: m_7
        event_data: {n: 7, v: '{{ this.attributes.current }}'}
      - sequence:
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - sequence:
        - {stop: s}
        - {event: m_8}
    enabled: false
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: template
    value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
    for: {seconds: '{{ 1 + 1 }}'}
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  - {trigger: event, event_type: e1}
  actions:
  - sequence:
    - choose:
      - conditions: ['{{ trigger.id == ''0'' }}']
        sequence:
        - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0}
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}'}
        - action: test.s9
          data: {n: 9, v: '{{ trigger.platform }}'}
      - conditions:
        - condition: not
          conditions:
          - condition: and
            conditions:
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            - {condition: trigger, id: '1'}
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        - condition: not
          conditions:
          - '{{ states(''sensor.s1'') | int(0) > 7 }}'
          - condition: not
            conditions:
            - {condition: state, entity_id: sensor.s1, state: '8', for: '00:00:03'}
            - {condition: time, after: '22:00', before: '22:13:30'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - condition: or
            conditions:
            - condition: state
              entity_id: light.l2
              state: [unavailable, 'off']
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        sequence:
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s2, below: sensor.s2, for: 3}
          - {trigger: event, event_type: e1}
          timeout: 3
        - event: m_15
          event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - parallel:
          - sequence:
            - event: m_11
              event_data: {n: 11, v: '{{ trigger.id }}'}
            - delay: {seconds: '{{ 2 }}'}
          - {event: m_12}
          - sequence:
            - action: test.s13
              data: {n: 13, v: '{{ trigger.id }}'}
              continue_on_error: true
            - event: m_14
              event_data: {n: 14, v: '{{ trigger.platform }}'}
        - wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          timeout: {seconds: 2}
        - event: m_16
          event_data: {n: 16, completed: '{{ wait.completed }}'}
    - choose:
      - conditions:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        sequence:
        - parallel:
          - sequence:
            - {event: m_17}
          - event: m_18
            event_data: {n: 18, v: '{{ trigger.description }}'}
      - conditions:
        - {condition: state, entity_id: sensor.s1, state: '7.5'}
        sequence:
        - condition: or
          conditions:
          - or:
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            - {condition: state, entity_id: light.l2, state: unavailable}
          - not:
            - condition: trigger
              id: [beta, '0']
          - not:
            - {condition: trigger, id: '0'}
            - {condition: time, after: '23:00:00', before: '22:14'}
    - {delay: 1}
  - {stop: s}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - {delay: 2}
  variables: {v1: 0}
- alias: a2
  id: id2
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: '4'}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  conditions:
  - {condition: state, entity_id: sensor.s2, state: unavailable}
  actions:
  - event: m_19
    event_data: {n: 19, v: '{{ trigger.description }}'}
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0, continue_on_timeout: false}
  - event: m_20
    event_data: {n: 20, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [input_boolean.b1, unavailable]
- at: 4
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [input_boolean.b1, 'off']
- at: 7
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 8
  set: [sensor.s2, abc]
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: e1}
- at: 15
  set: [input_boolean.b1, 'off']
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  set: [sensor.s1, '4']

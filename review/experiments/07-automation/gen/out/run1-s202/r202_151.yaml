# random scenario, seed 202, index 151 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  - {trigger: time, at: '22:13:23'}
  actions:
  - delay: {seconds: '{{ 2 }}'}
  - if:
    - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
    - condition: or
      conditions:
      - condition: or
        conditions:
        - {condition: time, before: '22:14'}
        - condition: trigger
          id: [beta, '0']
      - {condition: trigger, id: '1'}
      - condition: and
        conditions:
        - {condition: state, entity_id: input_boolean.b1, state: 'off'}
    then:
    - delay: {seconds: 1}
    - parallel:
      - sequence:
        - if:
          - or:
            - {condition: trigger, id: '1'}
            - {condition: trigger, id: '0'}
          then:
          - delay: {seconds: 1}
          - event: m_1
            event_data: {n: 1, v: '{{ states(''light.l1'') }}'}
            enabled: false
          else:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - action: test.s2
            data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - event: m_3
        event_data: {n: 3, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
      - sequence:
        - variables: {v2: x}
        - repeat:
            count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
            sequence:
            - event: m_4
              event_data: {n: 4, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
            - event: m_5
              event_data: {n: 5, v: '{{ trigger.idx }}'}
        - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
    else:
    - {event: m_7}
    - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 0}
    - event: m_8
      event_data: {n: 8, completed: '{{ wait.completed }}'}
  - {stop: s, error: true}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 3}
    - {condition: time, after: '22:13:25'}
    then:
    - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
    - event: m_9
      event_data: {n: 9, completed: '{{ wait.completed }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - trigger: template
    value_template: '{{ is_state(''light.l2'', ''off'') }}'
    for: {seconds: 2}
    id: beta
  - {trigger: event, event_type: e1}
  actions:
  - sequence:
    - {action: test.s10}
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    - delay: {seconds: '{{ 2 }}'}
  - {action: test.s11, continue_on_error: true, response_variable: v2}
  - repeat:
      for_each: '{{ [''x'', 1] }}'
      sequence:
      - sequence:
        - action: test.s12
          data: {n: 12, v: '{{ states(''sensor.s1'') }}'}
          target: {entity_id: light.l1}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  triggers:
  - {trigger: state, entity_id: light.l1, to: 2, from: 2, attribute: lvl}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - {condition: time, before: '22:14'}
        - '{{ repeat.index >= 3 }}'
      sequence:
      - parallel:
        - {event: m_13}
        - sequence:
          - repeat:
              while:
              - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
              - '{{ repeat.index <= 3 }}'
              sequence:
              - {event: m_14}
          - choose:
            - conditions: ['{{ trigger.id == ''0'' }}']
              sequence:
              - {delay: 0}
              - event: m_15
                event_data: {n: 15, v: '{{ trigger.id }}'}
      - wait_for_trigger:
        - trigger: event
          event_type: e1
          event_data: {k: true}
        - {trigger: event, event_type: e1}
      - repeat:
          count: 3
          sequence:
          - {event: m_16}
          - {event: m_17}
          - sequence:
            - {action: test.s18, response_variable: v1}
  - condition: and
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    - {condition: time, before: '22:13:30', enabled: false}
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '00:00:03'}
  - event: m_19
    event_data: {n: 19, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 2
  set: [sensor.s2, abc]
  attributes: {lvl: 3}
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 4
  send: {type: service_result, call_id: 0, ok: true}
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  set: [input_boolean.b1, unavailable]
- at: 6
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  send: {type: event, event_type: e1}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 13
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 14
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: 1}
- at: 15
  send: {type: service_result, call_id: 3, ok: true}
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 3}

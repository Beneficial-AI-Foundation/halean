# random scenario, seed 202, index 255 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l2, sensor.s1]
      from: unavailable
    - trigger: state
      entity_id: light.l1
      not_to: ['on', unavailable]
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.idx }}'}
  - {stop: s}
  - condition: and
    conditions:
    - condition: not
      conditions: ['{{ trigger.platform == ''event'' }}']
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: light.l1, for: '{{ 2 }}'}
  conditions:
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - '{{ states(''sensor.s1'') | int > 5 }}'
  actions:
  - if:
    - {condition: time, before: '22:13:30'}
    - {condition: time, after: '22:00', before: '06:00'}
    then:
    - sequence:
      - {action: test.s3, continue_on_error: true}
    else:
    - wait_for_trigger:
      - {trigger: state, entity_id: sensor.s1, for: 2}
      timeout: 3
      continue_on_timeout: false
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - repeat:
          count: 0
          sequence:
          - {event: m_4}
          - condition: state
            entity_id: [sensor.s1, light.l1]
            state: 'on'
            match: any
            enabled: false
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - parallel:
    - {event: m_6}
    - sequence:
      - condition: trigger
        id: [beta, '0']
      - event: m_7
        event_data: {n: 7, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - delay: {seconds: 1}
      - if:
        - {condition: time, before: '22:14'}
        - condition: or
          conditions:
          - {condition: trigger, id: '0'}
          - condition: trigger
            id: [beta, '0']
        then:
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l2}
          timeout: 1
        - event: m_8
          event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - action: test.s9
      data: {n: 9, v: '{{ states(''light.l1'') }}'}
      target:
        entity_id: [light.l1, light.l2]
      response_variable: v2
    - parallel:
      - event: m_10
        event_data: {n: 10, v: '{{ now().second }}'}
      - sequence:
        - {stop: s}
  - sequence:
    - wait_for_trigger:
      - {trigger: state, entity_id: sensor.s2, not_to: unavailable, for: 2}
      timeout: 0
      continue_on_timeout: false
    - parallel:
      - {event: m_11}
      - {event: m_12}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: queued
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, id: alpha}
  - {trigger: state, entity_id: light.l2}
  - {trigger: state, entity_id: sensor.s1, from: '12', to: '1', id: alpha}
  actions:
  - repeat:
      count: 0
      sequence:
      - {stop: s}
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - {delay: 0}
    continue_on_error: true
  - event: m_13
    event_data: {n: 13, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 3
  set: [sensor.s2, '12']
  attributes: {lvl: 1}
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s2, '4']
- at: 10
  set: [sensor.s2, '7.5']
- at: 13
  set: [input_boolean.b1, 'off']
- at: 14
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 14
  set: [sensor.s2, abc]
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 20
  set: [light.l1, 'on']
- at: 23
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 24
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 27
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}
- at: 28
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 88 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:26'}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - trigger: state
    entity_id: light.l1
    to: ['on', 'off']
    from: unavailable
    for: 00:00:02
    id: alpha
  actions:
  - sequence:
    - wait_for_trigger:
      - {trigger: event, event_type: e3}
      timeout: 1
      continue_on_timeout: false
    - event: m_1
      event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 2}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.idx }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.s2
    from: [unknown, '8']
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  - {trigger: state, entity_id: light.l1, from: unavailable, to: unavailable, id: alpha}
  actions:
  - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
  - sequence:
    - action: test.s4
      data: {n: 4, v: '{{ this.attributes.current }}'}
      continue_on_error: true
    - if: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
      then:
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.id }}'}
      else:
      - sequence:
        - condition: and
          conditions:
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - '{{ trigger.id == ''0'' }}'
        enabled: false
      continue_on_error: true
  - action: test.s6
    data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    enabled: false
  - sequence:
    - condition: or
      conditions:
      - {condition: trigger, id: '0'}
      - and:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - {condition: time, after: '22:00'}
      - condition: or
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
        - {condition: numeric_state, entity_id: sensor.s2, above: 3}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
    - variables: {v1: 1}
  - repeat:
      count: 3
      sequence:
      - {action: test.s7}
      - condition: and
        conditions:
        - {condition: trigger, id: '1'}
        - {condition: time, after: '22:00', before: '06:00'}
        enabled: false
  variables: {v1: 0}
states:
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [sensor.s1, '12']
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s2, '7.5']
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [input_boolean.b1, unavailable]
- at: 14
  send: {type: event, event_type: e1}
- at: 17
  set: [light.l2, 'on']
- at: 18
  set: [sensor.s2, '12']
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 19
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 20
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: e2}
- at: 24
  set: [sensor.s1, abc]
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: tick}
- at: 29
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 30
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 33
  set: [input_boolean.b1, 'off']
- at: 33
  set: [sensor.s1, '4']
- at: 34
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 35
  set: [sensor.s2, '1']

# random scenario, seed 202, index 260 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, from: 'on'}
  conditions:
  - condition: not
    conditions:
    - {condition: time, before: '06:00'}
    - '{{ states(''sensor.s1'') | int(0) > 3 }}'
  - {condition: trigger, id: '0'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - repeat:
      while:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - repeat:
          count: '{{ 2 }}'
          sequence:
          - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: '{{ 2 }}'}
          - action: test.s2
            data: {n: 2, v: '{{ trigger.platform }}'}
            target:
              entity_id: [light.l1, light.l2]
          - action: test.s3
            data: {n: 3, v: '{{ trigger.platform }}'}
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - action: test.s4
            data: {n: 4, v: '{{ trigger.description }}'}
            target:
              entity_id: [light.l1, light.l2]
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      - repeat:
          count: 2
          sequence:
          - if:
            - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
            then:
            - {condition: trigger, id: alpha}
            else:
            - delay: {seconds: 1}
  - {delay: 2}
  - {delay: 2, enabled: false}
  - variables:
      v1: [a, '{{ 1 + 1 }}']
    enabled: false
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 1}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 0
  set: [sensor.s2, '4']
- at: 1
  set: [input_boolean.b1, 'on']
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 3
  send: {type: event, event_type: e1}
- at: 3
  set: [sensor.s2, '1']
- at: 5
  send: {type: event, event_type: e3}
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 12
  set: [sensor.s1, '8']
- at: 13
  set: [sensor.s2, '4']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e1}
- at: 16
  set: [light.l1, unavailable]
- at: 18
  send: {type: event, event_type: e1}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: e3}
- at: 24
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 27
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 28
  set: [light.l1, 'off']
- at: 30
  send: {type: event, event_type: e2}
- at: 31
  set: [sensor.s2, '1']
  attributes: {lvl: 3}
- at: 32
  set: [sensor.s2, '1']

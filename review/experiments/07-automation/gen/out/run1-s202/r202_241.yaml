# random scenario, seed 202, index 241 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - action: test.s2
    data: {n: 2, v: '{{ this.attributes.current }}'}
  - {delay: '{{ 1 }}'}
  - variables:
      v2: [a, '{{ 1 + 1 }}']

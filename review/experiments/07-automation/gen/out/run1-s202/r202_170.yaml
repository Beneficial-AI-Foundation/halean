# random scenario, seed 202, index 170 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:23', id: beta}
  actions:
  - if:
    - {condition: time, after: '23:00:00'}
    then:
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
      timeout: 1
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - variables:
        v1: [a, '{{ 1 + 1 }}']
    - action: test.s1
      data: {n: 1, v: '{{ now().second }}'}
  - condition: and
    conditions:
    - '{{ states(''sensor.s1'') | int > 5 }}'
    - {condition: time, after: '22:00'}
    - not:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - parallel:
    - event: m_3
      event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - choose:
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 2 }}']
              sequence:
              - {delay: '{{ 1 }}'}
            continue_on_error: true
        - conditions:
          - condition: time
            before: '22:13:30'
            weekday: [tue]
          - condition: time
            before: '22:14'
            weekday: [tue]
          sequence:
          - action: test.s4
            data: {n: 4, v: '{{ trigger.platform }}'}
            continue_on_error: true
          - choose:
            - conditions:
              - not:
                - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
                - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
                - condition: not
                  conditions:
                  - {condition: trigger, id: '0'}
                  - '{{ trigger.platform == ''event'' }}'
                enabled: false
              sequence:
              - variables: {v2: 1}
              - action: test.s5
                data: {n: 5, v: '{{ trigger.description }}'}
            continue_on_error: true
      - {event: m_6}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, to: 'on', for: '{{ 2 }}', id: beta}
  - trigger: state
    entity_id: sensor.s2
    to: ['4', '8']
    from: ['1', '8']
    for: 2
  conditions:
  - and:
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    - condition: and
      conditions:
      - {condition: trigger, id: alpha}
      - condition: time
        after: '22:13:25'
        before: 06:00
        weekday: [wed, mon]
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - {event: m_7}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - {condition: time, after: '23:00:00', before: '22:14'}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '8'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  set: [light.l1, unavailable]
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 10
  set: [input_boolean.b1, 'off']
- at: 10
  send: {type: service_result, call_id: 0, ok: false, error_kind: invalid}
- at: 11
  send: {type: event, event_type: e3}
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 13
  set: [light.l2, 'on']
- at: 16
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 17
  set: [light.l2, unavailable]
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: event
    event_type: e3
    data: {k: true}

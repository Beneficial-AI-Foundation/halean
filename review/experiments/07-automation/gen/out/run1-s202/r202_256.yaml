# random scenario, seed 202, index 256 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  - {trigger: state, entity_id: input_boolean.b1, to: unavailable, from: 'off'}
  - {trigger: time, at: '22:13:23'}
  actions:
  - {event: m_1}
  - {stop: s, error: true}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.id }}'}
      - event: m_3
        event_data: {n: 3, v: '{{ trigger.idx }}'}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 3
  set: [sensor.s1, '1']
- at: 4
  set: [input_boolean.b1, unavailable]
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s2, abc]
- at: 11
  set: [sensor.s1, '4']
- at: 11
  set: [light.l2, 'on']
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e2}
- at: 19
  set: [input_boolean.b1, 'on']
- at: 20
  send: {type: event, event_type: tick}
- at: 23
  send: {type: event, event_type: e2}

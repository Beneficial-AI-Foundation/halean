# random scenario, seed 202, index 18 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l2}
  - {trigger: numeric_state, entity_id: sensor.s1, below: sensor.s2, for: '00:00:02'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
  actions:
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - {event: m_1}
  - choose:
    - conditions:
      - {condition: trigger, id: '1'}
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - conditions:
      - {condition: trigger, id: '1'}
      sequence:
      - wait_for_trigger:
        - trigger: event
          event_type: e2
          event_data: {k: true}
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.platform }}'}
        target: {entity_id: light.l1}
        response_variable: v2
      - repeat:
          while:
          - {condition: time, before: '22:13:30'}
          - '{{ repeat.index <= 1 }}'
          sequence:
          - {action: test.s3}
          - action: test.s4
            data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - sequence:
            - {action: test.s5, continue_on_error: true}
            - {delay: 1}
            - action: test.s6
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    default:
    - condition: or
      conditions:
      - {condition: trigger, id: '0'}
    - event: m_8
      event_data: {n: 8, v: '{{ states(''light.l1'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - event: m_9
    event_data: {n: 9, v: '{{ trigger.idx }}'}
  - {action: test.s10, response_variable: v1}
  - action: test.s11
    data: {n: 11, v: '{{ this.attributes.current }}'}
    continue_on_error: true
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, unavailable]
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 10
  set: [input_boolean.b1, 'on']
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 14
  set: [sensor.s2, unavailable]
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 17
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}

# random scenario, seed 202, index 237 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: /9, id: alpha}
  actions:
  - repeat:
      count: 2
      sequence:
      - {event: m_1}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.idx }}'}
      - action: test.s3
        data: {n: 3, v: '{{ this.attributes.current }}'}
  - {stop: s}
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '{{ 2 }}', continue_on_timeout: false}
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}'}
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: input_boolean.b1
        state: [unavailable, 'on']
        enabled: false
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
    then:
    - action: test.s4
      target:
        entity_id: [light.l1, light.l2]
      response_variable: v1
    - {event: m_5}
    continue_on_error: true
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l2, 'off']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 4
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  set: [light.l2, unavailable]
- at: 8
  send: {type: service_result, call_id: 0, ok: true}
- at: 11
  send: {type: service_result, call_id: 1, ok: true}
- at: 12
  set: [light.l1, 'off']
- at: 13
  send: {type: service_result, call_id: 2, ok: true}
- at: 16
  set: [sensor.s2, unavailable]
- at: 17
  set: [light.l1, unavailable]
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 19
  send: {type: service_result, call_id: 3, ok: true}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 22
  set: [light.l1, 'on']

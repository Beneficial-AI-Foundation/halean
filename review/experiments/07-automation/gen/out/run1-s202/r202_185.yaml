# random scenario, seed 202, index 185 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  conditions:
  - {condition: state, entity_id: light.l2, state: unavailable}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: '{{ 2 }}', continue_on_timeout: false}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: time_pattern, seconds: 23}
  actions:
  - {delay: '{{ 1 }}'}
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  set: [sensor.s2, '12']
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 9
  set: [light.l1, 'on']
- at: 10
  set: [light.l1, unavailable]
- at: 12
  set: [input_boolean.b1, 'off']
- at: 13
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 15
  set: [input_boolean.b1, unavailable]
- at: 15
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}

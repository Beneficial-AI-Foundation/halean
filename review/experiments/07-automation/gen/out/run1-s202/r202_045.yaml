# random scenario, seed 202, index 45 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: 0}
  triggers:
  - trigger: state
    entity_id: [light.l2, light.l1]
    for: 3
  actions:
  - {event: m_1}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 3
  set: [light.l1, unavailable]
- at: 5
  set: [light.l2, unavailable]
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 10
  set: [input_boolean.b1, 'off']
- at: 12
  set: [sensor.s2, unavailable]
- at: 13
  set: [sensor.s2, '7.5']
- at: 13
  send: {type: event, event_type: e3}
- at: 14
  set: [input_boolean.b1, unavailable]
- at: 16
  set: [input_boolean.b1, 'on']
- at: 19
  set: [input_boolean.b1, unavailable]
- at: 22
  set: [input_boolean.b1, 'on']
- at: 22
  send: {type: event, event_type: e3}
- at: 23
  set: [light.l2, 'off']
- at: 24
  send: {type: event, event_type: e3}
- at: 24
  set: [light.l1, 'off']
- at: 24
  set: [sensor.s2, unknown]

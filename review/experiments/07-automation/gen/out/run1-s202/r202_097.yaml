# random scenario, seed 202, index 97 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  conditions:
  - condition: not
    conditions:
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - {condition: state, entity_id: light.l2, state: unavailable, enabled: false}
  - not:
    - condition: or
      conditions:
      - condition: state
        entity_id: sensor.s1
        state: [unavailable, '12']
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    timeout: 2
    continue_on_timeout: false
  - {event: m_1}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: light.l2, attribute: lvl, for: '00:00:02'}
  conditions:
  - condition: and
    conditions:
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - {condition: time, after: '22:13:25', before: '06:00'}
    - condition: not
      conditions:
      - condition: time
        after: '22:00'
        weekday: [wed, mon]
    - '{{ trigger.platform == ''event'' }}'
  actions:
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - sequence:
    - event: m_3
      event_data: {n: 3, v: '{{ now().second }}'}
- alias: a2
  id: id2
  mode: parallel
  triggers:
  - {trigger: time, at: '22:13:33'}
  actions:
  - {action: test.s4, continue_on_error: true}
  - event: m_5
    event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 1
  set: [sensor.s2, '8']
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l2, unavailable]
- at: 7
  send: {type: event, event_type: e2}
- at: 10
  send: {type: event, event_type: e1}
- at: 13
  send: {type: event, event_type: e1}
- at: 13
  send: {type: service_result, call_id: 0, ok: true}
- at: 15
  send: {type: event, event_type: e2}
- at: 17
  set: [sensor.s2, '7.5']
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 19
  set: [sensor.s2, '20']

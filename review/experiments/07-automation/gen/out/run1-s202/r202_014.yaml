# random scenario, seed 202, index 14 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, light.l1]
    id: alpha
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: 3, id: alpha}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  conditions:
  - condition: and
    conditions:
    - condition: or
      conditions:
      - '{{ trigger.id == ''0'' }}'
      - {condition: state, entity_id: light.gone, state: unavailable}
    - condition: trigger
      id: [beta, '0']
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    - trigger: state
      entity_id: input_boolean.b1
      not_to: [unavailable, 'off']
      from: 'on'
      for: {seconds: '{{ 1 + 1 }}'}
    timeout: 1
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - action: test.s2
    data: {n: 2, v: '{{ this.attributes.current }}'}
    continue_on_error: true
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    timeout: {seconds: 2}
    continue_on_timeout: false
    enabled: false
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l1, unavailable]
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 8
  set: [light.l2, 'on']
- at: 9
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 9
  set: [sensor.s1, '12']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 1}

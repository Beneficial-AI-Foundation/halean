# random scenario, seed 202, index 200 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: time_pattern, seconds: '26'}
  - trigger: template
    value_template: '{{ states(''sensor.s1'') | int > 5 }}'
    for: {seconds: '{{ 1 + 1 }}'}
    id: beta
  - {trigger: event, event_type: e2, id: alpha}
  conditions:
  - {condition: time, after: '22:13:25'}
  - condition: or
    conditions:
    - or:
      - {condition: state, entity_id: sensor.s2, state: unknown}
      - '{{ is_state(''light.l2'', ''off'') }}'
      - '{{ is_state(''light.l2'', ''off'') }}'
    - {condition: time, after: '23:00:00', before: '22:14'}
    - not:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.id }}'}
  - condition: and
    conditions:
    - not: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
    - '{{ is_state(''light.l1'', ''on'') }}'
    - {condition: time, after: '23:00:00'}
states:
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [input_boolean.b1, unavailable]
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  set: [sensor.s1, '12']
  attributes: {lvl: 3}
- at: 9
  send: {type: service_result, call_id: 0, ok: true}
- at: 12
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 13
  set: [light.l2, 'off']
- at: 14
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 16
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}

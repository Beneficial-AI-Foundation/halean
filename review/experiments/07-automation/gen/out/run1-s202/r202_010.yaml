# random scenario, seed 202, index 10 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: time, at: '22:13:29'}
  - {trigger: event, event_type: e2}
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    - {trigger: state, entity_id: sensor.s2, to: '8', from: '12', for: '{{ 2 }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.id }}'}
  - if:
    - condition: not
      conditions:
      - condition: or
        conditions:
        - {condition: trigger, id: '1', enabled: false}
    - {condition: trigger, id: '0'}
    then:
    - {condition: time, after: '22:13:25'}
    - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0}
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}'}
    - event: m_2
      event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
    else:
    - {delay: 2}
  - {action: test.s4}
  - parallel:
    - sequence:
      - action: test.s5
        data: {n: 5, v: '{{ trigger.platform }}'}
      - sequence:
        - if:
          - {condition: state, entity_id: input_boolean.b1, state: unavailable}
          - condition: not
            conditions:
            - {condition: state, entity_id: sensor.s2, state: unavailable}
            - condition: state
              entity_id: sensor.s1
              state: ['20', '8']
          then:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          else:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
          - {event: m_6}
        - event: m_7
          event_data: {n: 7, v: '{{ this.attributes.current }}'}
    - sequence:
      - action: test.s8
        data: {n: 8, v: '{{ trigger.description }}'}
      - sequence:
        - event: m_9
          event_data: {n: 9, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - {delay: 2}
        continue_on_error: true
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - event: m_11
        event_data: {n: 11, v: '{{ this.attributes.current }}'}
      - action: test.s12
        data: {n: 12, v: '{{ trigger.idx }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {condition: numeric_state, entity_id: sensor.s1, above: 3}
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    - {trigger: event, event_type: e2}
    timeout: 0
  - event: m_14
    event_data: {n: 14, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_13
    event_data: {n: 13, v: '{{ trigger.id }}'}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send: {type: event, event_type: e1}
- at: 0
  set: [sensor.s1, unavailable]
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 5
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 8
  send: {type: service_result, call_id: 1, ok: true}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s2, '20']
  attributes: {lvl: 2}
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 15
  set: [light.l2, 'on']
- at: 16
  set: [input_boolean.b1, 'on']
- at: 17
  set: [sensor.s2, '1']
- at: 17
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [input_boolean.b1, unavailable]
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 26
  set: [sensor.s2, unavailable]
- at: 27
  send: {type: event, event_type: e1}
- at: 28
  set: [light.l1, 'on']

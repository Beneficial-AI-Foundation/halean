# random scenario, seed 202, index 119 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: sensor.s2
    from: [abc, '1']
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  conditions:
  - condition: or
    conditions:
    - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - condition: and
    conditions:
    - condition: state
      entity_id: sensor.s2
      state: ['20', '12']
    - or:
      - {condition: trigger, id: '0'}
    - condition: not
      conditions:
      - condition: trigger
        id: [beta, '0']
      - {condition: time, after: '22:00'}
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  actions:
  - parallel:
    - sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s2, to: unavailable}
        timeout: {seconds: 2}
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.id }}'}
    - sequence:
      - parallel:
        - event: m_2
          event_data: {n: 2, v: '{{ this.attributes.current }}'}
        - sequence:
          - repeat:
              count: 0
              sequence:
              - {delay: 0}
              - {action: test.s3, continue_on_error: true}
              - event: m_4
                event_data: {n: 4, v: '{{ this.attributes.current }}'}
        - sequence:
          - parallel:
            - sequence:
              - variables:
                  v1: [a, '{{ 1 + 1 }}']
              - {delay: 0}
            - sequence:
              - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
            continue_on_error: true
        continue_on_error: true
      - variables: {v2: 1}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s6
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - parallel:
    - sequence:
      - repeat:
          for_each: []
          sequence:
          - variables: {v3: 1}
          - choose:
            - conditions:
              - not:
                - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
              - {condition: state, entity_id: light.l2, state: unavailable}
              sequence:
              - action: test.s7
                data: {n: 7, v: '{{ trigger.idx }}'}
              - event: m_8
                event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
              - event: m_9
                event_data: {n: 9, v: '{{ trigger.id }}'}
            default:
            - event: m_10
              event_data: {n: 10, v: '{{ trigger.description }}', var: '{{ v4 | default(''undef'') }}'}
            - event: m_11
              event_data: {n: 11, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03', continue_on_timeout: false}
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}'}
    - sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - {trigger: event, event_type: e3}
      - event: m_13
        event_data: {n: 13, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s1, to: '7.5'}
  - {trigger: event, event_type: e3}
  actions:
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'
        timeout: {seconds: 2}
        continue_on_timeout: false
      - event: m_15
        event_data: {n: 15, completed: '{{ wait.completed }}'}
      - {event: m_14}
  - sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.b1
          state: ['on', 'off']
          for: 2
          enabled: false
        sequence:
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', enabled: false}
        - event: m_16
          event_data: {n: 16, completed: '{{ wait.completed }}'}
      - conditions:
        - {condition: time, after: '22:00'}
        sequence:
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 0}
        - event: m_17
          event_data: {n: 17, completed: '{{ wait.completed }}'}
      default:
      - wait_template: '{{ states(''sensor.s1'') | int > 5 }}'
        timeout: {seconds: 2}
        continue_on_timeout: false
      - repeat:
          while:
          - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          - '{{ repeat.index <= 1 }}'
          sequence:
          - event: m_18
            event_data: {n: 18, v: '{{ trigger.platform }}'}
          - {delay: 0}
          - event: m_19
            event_data: {n: 19, v: '{{ states(''light.l1'') }}'}
    - choose:
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
        sequence:
        - repeat:
            count: '{{ 2 }}'
            sequence:
            - action: test.s20
              data: {n: 20, v: '{{ now().second }}'}
              target: {entity_id: light.l1}
      default:
      - {action: test.s21, continue_on_error: true}
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: trigger, id: '1'}
      - {condition: time, after: '22:13:25', before: '06:00'}
      sequence:
      - choose:
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
          sequence:
          - {delay: 1}
        default:
        - event: m_22
          event_data: {n: 22, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - sequence:
          - delay: {seconds: 1}
      - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: '{{ 2 }}'}
      - event: m_27
        event_data: {n: 27, completed: '{{ wait.completed }}'}
      - choose:
        - conditions:
          - condition: or
            conditions:
            - {condition: time, after: '22:00', before: '06:00', weekday: tue}
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            - condition: not
              conditions:
              - {condition: state, entity_id: light.l2, state: unavailable}
          sequence:
          - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2}
          - event: m_23
            event_data: {n: 23, completed: '{{ wait.completed }}'}
          - condition: or
            conditions:
            - or:
              - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            - {condition: state, entity_id: light.l1, state: unavailable}
        default:
        - action: test.s24
          data: {n: 24, v: '{{ now().second }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - sequence:
          - {event: m_25}
          - action: test.s26
            target:
              entity_id: [light.l1, light.l2]
    - conditions:
      - condition: and
        conditions:
        - {condition: time, before: '22:13:30'}
      sequence:
      - action: test.s28
        data: {n: 28, v: '{{ states(''sensor.s1'') }}'}
        continue_on_error: true
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    then:
    - repeat:
        count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
        sequence:
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l2, not_to: 3, attribute: lvl, for: 2}
          timeout: {seconds: 2}
          continue_on_timeout: false
        - event: m_29
          event_data: {n: 29, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
    - event: m_30
      event_data: {n: 30, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 2
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 5
  send: {type: event, event_type: e3}
- at: 8
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 11
  set: [sensor.s1, '1']
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 14
  set: [sensor.s2, '7.5']
- at: 15
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 16
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 17
  set: [sensor.s1, '12']
- at: 19
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 20
  set: [sensor.s2, '20']
- at: 21
  set: [light.l2, 'off']
- at: 21
  set: [sensor.s2, unknown]
- at: 22
  send: {type: event, event_type: tick}

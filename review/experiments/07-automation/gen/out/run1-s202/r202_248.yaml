# random scenario, seed 202, index 248 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s2
    above: 3
    below: sensor.s2
    for: {seconds: '{{ 1 + 1 }}'}
    id: alpha
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ this.attributes.current }}'}
  - {event: m_2, enabled: false}
  - repeat:
      while:
      - condition: and
        conditions:
        - condition: and
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9, enabled: false}
          - {condition: time, before: '22:13:30'}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9, enabled: false}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - {action: test.s3, continue_on_error: true, response_variable: v1}
      - wait_for_trigger:
        - {trigger: event, event_type: e3}
        - {trigger: state, entity_id: light.l2, to: 2, from: 1, attribute: lvl}
        timeout: 1
        continue_on_timeout: false
        enabled: false
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 2}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', timeout: 2}
  - event: m_6
    event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
- alias: a2
  id: id2
  mode: queued
  max: 2
  triggers:
  - {trigger: time_pattern, seconds: /9, id: alpha}
  actions:
  - {stop: s, error: true}
  - event: m_7
    event_data: {n: 7, v: '{{ trigger.platform }}'}
  - {stop: s}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - {stop: s, error: true}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 6
  set: [light.l1, 'off']
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 8
  set: [sensor.s1, '7.5']
- at: 9
  set: [light.l2, unavailable]
- at: 10
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'on']
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  send: {type: event, event_type: e2}
- at: 20
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [sensor.s1, abc]
- at: 25
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 26
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e3}
- at: 30
  send: {type: event, event_type: tick}
- at: 31
  send:
    type: event
    event_type: e1
    data: {k: a}

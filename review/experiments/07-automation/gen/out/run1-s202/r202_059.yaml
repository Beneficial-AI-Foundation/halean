# random scenario, seed 202, index 59 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  actions:
  - {condition: trigger, id: '1', enabled: false}
  - sequence:
    - sequence:
      - {condition: time, before: '06:00'}
      enabled: false
- alias: a1
  id: id1
  mode: parallel
  max: 3
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: event, event_type: e1, id: alpha}
  actions:
  - if: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
    then:
    - event: m_1
      event_data: {n: 1, v: '{{ states(''light.l1'') }}'}
    - action: test.s2
      data: {n: 2, v: '{{ trigger.idx }}'}
      target:
        entity_id: [light.l1, light.l2]
    else:
    - {stop: s}
    - {stop: s, error: true}
  - sequence:
    - choose:
      - conditions:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - condition: and
            conditions:
            - condition: state
              entity_id: sensor.s2
              state: ['20', '7.5']
              enabled: false
            - {condition: time, after: '22:13:25', before: '22:13:30'}
          - {condition: time, after: '22:13:25'}
        sequence:
        - action: test.s3
          data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - {action: test.s4, continue_on_error: true}
  - {delay: '00:00:02'}
  - action: test.s5
    data: {n: 5, v: '{{ now().second }}'}
    target: {entity_id: light.l1}
  - choose:
    - conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
      sequence:
      - condition: time
        before: 06:00
        weekday: [wed, mon]
      - {action: test.s6}
      - repeat:
          until: ['{{ repeat.index >= 1 }}']
          sequence:
          - wait_for_trigger:
            - {trigger: event, event_type: e3}
            timeout: 1
            continue_on_timeout: false
          - event: m_7
            event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - {stop: s, error: true}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [sensor.s2, unavailable]
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 3
  send: {type: service_result, call_id: 0, ok: true}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 6
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e3}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 16
  send: {type: event, event_type: e1}
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}

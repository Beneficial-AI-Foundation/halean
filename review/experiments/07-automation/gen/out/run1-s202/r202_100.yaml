# random scenario, seed 202, index 100 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: time, at: '22:13:29', id: alpha}
  - trigger: state
    entity_id: sensor.s2
    to: [abc, unknown]
    from: '12'
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  conditions:
  - condition: or
    conditions:
    - {condition: time, before: '22:14'}
    - not:
      - condition: time
        after: '23:00:00'
        weekday: [wed, mon]
      - '{{ trigger.platform == ''event'' }}'
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - {condition: time, after: '22:13:25', before: '06:00'}
  actions:
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1}
    timeout: 2
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      sequence:
      - {delay: 1}
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      - '{{ states(''sensor.s1'') | int(0) > 3 }}'
      sequence:
      - parallel:
        - sequence:
          - wait_for_trigger:
            - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
            - trigger: event
              event_type: e1
              event_data: {k: a}
          - choose:
            - conditions:
              - condition: state
                entity_id: [light.l2, sensor.s2]
                state: 'on'
                match: any
                enabled: false
              - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
              sequence:
              - {delay: 2}
              - {event: m_3}
            default:
            - {delay: 1}
        - {event: m_4}
        - sequence:
          - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 2, continue_on_timeout: false}
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    default:
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
      timeout: 2
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - variables:
        v1: [a, '{{ 1 + 1 }}']
    - wait_for_trigger:
      - trigger: event
        event_type: e1
        event_data: {k: 1}
    - event: m_6
      event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: '8'}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}'}
  - {delay: 2}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 1
  set: [light.l2, 'off']
- at: 1
  send: {type: event, event_type: e2}
- at: 2
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 3
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 5
  set: [sensor.s2, '20']
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: e2}
- at: 11
  set: [sensor.s1, '20']

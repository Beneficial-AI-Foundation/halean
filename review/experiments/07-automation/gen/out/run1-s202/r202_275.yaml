# random scenario, seed 202, index 275 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  actions:
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - {event: m_1}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: '8', to: unknown}
  actions:
  - event: m_3
    event_data: {n: 3, v: '{{ trigger.id }}'}
  - parallel:
    - sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - delay: {seconds: 1}
      - {stop: s}
    - sequence:
      - {event: m_4}
    - {event: m_5}
    continue_on_error: true
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: parallel
  triggers:
  - trigger: state
    entity_id: [light.l2, light.l1]
    from: unavailable
    for: {seconds: '{{ 1 + 1 }}'}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  actions:
  - condition: trigger
    id: [beta, '0']
  - event: m_6
    event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - parallel:
    - sequence:
      - {delay: 1}
    - sequence:
      - {delay: 0}
    - sequence:
      - condition: time
        after: '22:00'
        before: '22:14'
        weekday: [tue]
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '8']
- at: 7
  set: [sensor.s2, '1']
- at: 9
  send: {type: event, event_type: e3}
- at: 9
  send: {type: event, event_type: e1}
- at: 11
  set: [light.l2, 'on']
- at: 12
  set: [input_boolean.b1, 'off']
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 16
  set: [input_boolean.b1, unavailable]
- at: 17
  set: [light.l1, 'on']
- at: 18
  set: [sensor.s2, '12']
- at: 21
  set: [sensor.s2, '4']
- at: 22
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 25
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 26
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: e1}
- at: 28
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 30
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 30
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 31
  set: [light.l1, unavailable]
- at: 32
  send: {type: event, event_type: e2}
- at: 33
  set: [sensor.s2, unknown]

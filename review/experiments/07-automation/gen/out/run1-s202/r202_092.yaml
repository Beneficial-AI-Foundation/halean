# random scenario, seed 202, index 92 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: time, at: '22:13:26'}
  - trigger: state
    entity_id: light.l1
    to: ['off', unavailable]
    from: 'off'
  actions:
  - parallel:
    - {event: m_1}
    - sequence:
      - {stop: s}
      - {event: m_2}
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
    continue_on_error: true
  - parallel:
    - sequence:
      - action: test.s4
        data: {n: 4, v: '{{ trigger.description }}'}
    - sequence:
      - event: m_5
        event_data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
      - sequence:
        - parallel:
          - {event: m_6}
          - sequence:
            - variables:
                v1: [a, '{{ 1 + 1 }}']
          - sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
      - event: m_8
        event_data: {n: 8, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
  - {action: test.s9}
  - {condition: state, entity_id: input_boolean.b1, state: 'off', for: 2}
  - parallel:
    - sequence:
      - repeat:
          until: ['{{ repeat.index >= 3 }}']
          sequence:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - choose:
            - conditions:
              - {condition: trigger, id: '0', enabled: false}
              sequence:
              - {delay: 0}
      - {action: test.s10, response_variable: v2}
      - event: m_11
        event_data: {n: 11, v: '{{ this.attributes.current }}'}
    - sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
    - sequence:
      - choose:
        - conditions:
          - and:
            - {condition: numeric_state, entity_id: sensor.s2, below: 9}
            - {condition: time, before: '22:14'}
          sequence:
          - choose:
            - conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              sequence:
              - event: m_12
                event_data: {n: 12, v: '{{ this.attributes.current }}'}
              - {condition: time, after: '23:00:00', before: '06:00'}
            - conditions:
              - or:
                - not:
                  - {condition: numeric_state, entity_id: sensor.s2, below: 15}
                  enabled: false
              sequence:
              - action: test.s13
                data: {n: 13, v: '{{ trigger.id }}'}
              - event: m_14
                event_data: {n: 14, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
              - action: test.s15
                data: {n: 15, v: '{{ trigger.idx }}'}
            default:
            - action: test.s16
              data: {n: 16, v: '{{ states(''sensor.s1'') }}'}
              continue_on_error: true
              response_variable: v4
            - delay: {seconds: '{{ 2 }}'}
            continue_on_error: true
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
            timeout: {seconds: 2}
            continue_on_timeout: false
          - event: m_17
            event_data: {n: 17, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - conditions:
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          sequence:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6}
        default:
        - event: m_18
          event_data: {n: 18, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, unavailable]
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 5
  set: [sensor.s2, '8']
- at: 7
  set: [light.l1, 'off']
- at: 9
  send: {type: event, event_type: e3}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 10
  send: {type: event, event_type: e2}
- at: 10
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 10
  set: [sensor.s2, '4']
- at: 11
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 13
  set: [input_boolean.b1, unavailable]
- at: 14
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 15
  set: [sensor.s1, unknown]
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 19
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 20
  send: {type: event, event_type: e3}

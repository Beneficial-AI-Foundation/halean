# random scenario, seed 202, index 58 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - {delay: '00:00:02'}
  - {event: m_1}
- alias: a1
  id: id1
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}', id: alpha}
  - {trigger: time_pattern, seconds: 23}
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 1}
- alias: a2
  id: id2
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, id: beta}
  actions:
  - variables: {v1: x}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - delay: {seconds: '{{ 2 }}'}
  - sequence:
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - condition: state
    entity_id: light.l1
    state: ['off', unavailable]
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 3
  set: [sensor.s1, '4']
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 5
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 6
  send: {type: event, event_type: e2}
- at: 8
  set: [light.l2, 'on']
- at: 11
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '7.5']
- at: 12
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s2, '4']
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, unavailable]
  attributes: {lvl: 3}

# random scenario, seed 202, index 30 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
    id: alpha
  conditions:
  - {condition: trigger, id: '0'}
  actions:
  - wait_template: '{{ trigger.id == ''0'' }}'
    timeout: {seconds: 2}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: abc}
- entity_id: sensor.s2
  state: '1'
  attributes: {lvl: 1}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 11
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 12
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 13
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 14
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 15
  set: [sensor.s1, '4']
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 20
  set: [light.l1, unavailable]
- at: 21
  set: [input_boolean.b1, 'off']
- at: 22
  set: [light.l2, unavailable]
- at: 25
  send: {type: event, event_type: tick}

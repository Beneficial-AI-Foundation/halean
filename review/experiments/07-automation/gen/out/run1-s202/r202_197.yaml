# random scenario, seed 202, index 197 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  actions:
  - choose:
    - conditions:
      - and:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - condition: and
          conditions:
          - {condition: state, entity_id: light.gone, state: unavailable}
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - {condition: trigger, id: '0'}
        - {condition: time, after: '22:13:25'}
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: sensor.s2
          not_to: '12'
          from: [abc, '12']
        timeout: 0
      - event: m_1
        event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - if:
      - {condition: time, before: '22:14'}
      then:
      - choose:
        - conditions:
          - {condition: state, entity_id: light.l2, state: 'on'}
          sequence:
          - condition: state
            entity_id: [input_boolean.b1, sensor.s1]
            state: 'on'
            match: any
          - {action: test.s2, continue_on_error: true}
        default:
        - variables: {v1: x}
      - repeat:
          until:
          - condition: or
            conditions:
            - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - {delay: '00:00:02'}
  - event: m_3
    event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
  - if:
    - {condition: state, entity_id: sensor.s1, state: '20'}
    - condition: or
      conditions:
      - condition: trigger
        id: [beta, '0']
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - {condition: state, entity_id: input_boolean.b1, state: 'on'}
    then:
    - event: m_4
      event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      enabled: false
  - {stop: s}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - variables: {v1: 1}
      - {delay: '{{ 1 }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  - trigger: event
    event_type: e3
    event_data: {k: a}
    id: alpha
  actions:
  - {condition: time, after: '22:00', before: '22:13:30'}
  - event: m_5
    event_data: {n: 5, v: '{{ trigger.idx }}'}
  - variables: {v1: x}
  variables: {v1: 0}
states:
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 1
  set: [light.l1, unavailable]
- at: 2
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 3
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 6
  set: [sensor.s1, '20']
  attributes: {lvl: 1}
- at: 7
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: e1}
- at: 10
  send: {type: event, event_type: e3}

# random scenario, seed 202, index 266 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, id: beta}
  conditions:
  - condition: or
    conditions:
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - condition: or
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - {condition: trigger, id: '1'}
      - {condition: trigger, id: '0'}
  - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - not:
          - condition: and
            conditions:
            - {condition: numeric_state, entity_id: sensor.s2, above: 6}
            - '{{ trigger.platform == ''event'' }}'
          - '{{ trigger.platform == ''event'' }}'
        - '{{ repeat.index >= 3 }}'
      sequence:
      - {condition: time, after: '22:13:25'}
      - {event: m_1}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
      sequence:
      - choose:
        - conditions:
          - {condition: state, entity_id: sensor.s2, state: '12'}
          sequence:
          - delay: {seconds: '{{ 2 }}'}
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          - {condition: trigger, id: '0'}
          sequence:
          - parallel:
            - event: m_2
              event_data: {n: 2, v: '{{ this.attributes.current }}'}
            - sequence:
              - {event: m_3}
              - event: m_4
                event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
            - sequence:
              - {event: m_5}
              - delay: {seconds: 1}
            continue_on_error: true
        continue_on_error: true
      - delay: {seconds: '{{ 2 }}'}
      - choose:
        - conditions:
          - and:
            - condition: state
              entity_id: input_boolean.b1
              state: [unavailable, 'off']
              for: {seconds: 1}
          sequence:
          - action: test.s6
            target:
              entity_id: [light.l1, light.l2]
          - parallel:
            - sequence:
              - action: test.s7
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            - sequence:
              - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
              - {event: m_8}
              - action: test.s9
                data: {n: 9, v: '{{ trigger.idx }}'}
                response_variable: v1
            - {event: m_10}
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - conditions:
      - condition: trigger
        id: [beta, '0']
      sequence:
      - action: test.s11
        data: {n: 11, v: '{{ trigger.description }}'}
        continue_on_error: true
      - if:
        - and:
          - condition: state
            entity_id: light.gone
            state: ['on', 'off']
          - condition: not
            conditions:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            - condition: trigger
              id: [beta, '0']
        - condition: trigger
          id: [beta, '0']
        then:
        - delay: {seconds: '{{ 2 }}'}
      - {event: m_12}
    default:
    - {condition: numeric_state, entity_id: sensor.s1, above: 3}
    continue_on_error: true
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, below: 9, enabled: false}
    - {condition: trigger, id: '1'}
    then:
    - {delay: 0}
    - action: test.s13
      data: {n: 13, v: '{{ trigger.description }}'}
    else:
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
      timeout: {seconds: 2}
      continue_on_timeout: false
    - sequence:
      - {stop: s}
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - action: test.s14
            data: {n: 14, v: '{{ trigger.id }}'}
          - event: m_15
            event_data: {n: 15, v: '{{ trigger.platform }}'}
        continue_on_error: true
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: 0}
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}

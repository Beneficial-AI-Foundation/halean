# random scenario, seed 202, index 94 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - {delay: '{{ 1 }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: trigger, id: alpha}
      - condition: or
        conditions:
        - and: ['{{ is_state(''light.l2'', ''off'') }}', '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
        - condition: or
          conditions:
          - {condition: time, before: '06:00'}
          - condition: trigger
            id: [beta, '0']
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      sequence:
      - wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        timeout: {seconds: 2}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
      - choose:
        - conditions:
          - and:
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
            - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          sequence:
          - choose:
            - conditions:
              - {condition: time, after: '22:00', before: '06:00'}
              sequence:
              - {action: test.s1, continue_on_error: true}
          - {event: m_2}
        default:
        - action: test.s3
          target:
            entity_id: [light.l1, light.l2]
          continue_on_error: true
    default:
    - parallel:
      - sequence:
        - {condition: trigger, id: '0', enabled: false}
      - sequence:
        - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 0}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
        - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 2, continue_on_timeout: false}
        - event: m_7
          event_data: {n: 7, completed: '{{ wait.completed }}'}
        - event: m_5
          event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - sequence:
        - {condition: trigger, id: alpha}
        - sequence:
          - {delay: 0}
        - action: test.s8
          data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - delay: {seconds: 1}
- alias: a1
  id: id1
  mode: queued
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: time_pattern, seconds: /3}
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  actions:
  - action: test.s9
    data: {n: 9, v: '{{ states(''light.l1'') }}'}
  - {action: test.s10}
  - action: test.s11
    data: {n: 11, v: '{{ trigger.description }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    response_variable: v2
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 4
  set: [sensor.s2, '20']
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 11
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 12
  send: {type: service_result, call_id: 1, ok: false, error_kind: invalid}
- at: 15
  set: [light.l2, unavailable]
- at: 17
  send: {type: service_result, call_id: 2, ok: true}
- at: 19
  send: {type: service_result, call_id: 3, ok: true}
- at: 22
  send: {type: service_result, call_id: 4, ok: false, error_kind: ha_error}
- at: 22
  set: [input_boolean.b1, unavailable]
- at: 25
  set: [sensor.s1, unknown]
- at: 27
  send: {type: event, event_type: e2}
- at: 30
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 30
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 30
  send: {type: event, event_type: tick}
- at: 31
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 34
  set: [light.l2, 'on']
- at: 35
  send:
    type: service_result
    call_id: 5
    ok: true
    response:
      value: [1, 2]

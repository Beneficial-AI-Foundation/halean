# random scenario, seed 202, index 160 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: event, event_type: e2, id: beta}
  - trigger: state
    entity_id: sensor.s2
    from: '12'
    to: ['8', '20']
    for: '{{ 2 }}'
    id: alpha
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - {condition: state, entity_id: sensor.s2, state: '7.5'}
      - {condition: trigger, id: '0'}
  - {condition: trigger, id: '1'}
  actions:
  - {event: m_1}
  - {action: test.s2}
  - if:
    - and:
      - '{{ trigger.id == ''0'' }}'
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    then:
    - wait_for_trigger:
      - {trigger: event, event_type: e3}
      timeout: 1
      continue_on_timeout: false
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', for: 1}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
  actions:
  - repeat:
      count: 0
      sequence:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: 1}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
  - parallel:
    - sequence:
      - repeat:
          while:
          - {condition: trigger, id: alpha}
          - '{{ repeat.index <= 1 }}'
          sequence:
          - {stop: s, error: true}
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: 2}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
    continue_on_error: true
  - {action: test.s6, response_variable: v1}
  variables: {v1: 0}
- alias: a2
  id: id2
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  - {trigger: event, event_type: e2}
  - trigger: state
    entity_id: [light.l2, sensor.s1]
    to: unavailable
  actions:
  - choose:
    - conditions: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
      sequence:
      - parallel:
        - sequence:
          - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - event: m_8
            event_data: {n: 8, completed: '{{ wait.completed }}'}
          - sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - variables: {v1: 1}
            enabled: false
        - sequence:
          - {stop: s, error: true}
          - if:
            - and:
              - condition: state
                entity_id: light.gone
                state: ['on', 'off']
                enabled: false
              - not:
                - '{{ trigger.platform == ''event'' }}'
                - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
                - {condition: state, entity_id: light.l1, state: 'on'}
              - {condition: trigger, id: '1'}
            then:
            - {event: m_9}
        continue_on_error: true
    default:
    - parallel:
      - event: m_10
        event_data: {n: 10, v: '{{ trigger.id }}'}
      - sequence:
        - parallel:
          - sequence:
            - {delay: '{{ 1 }}'}
            - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
            - event: m_11
              event_data: {n: 11, v: '{{ trigger.id }}'}
          - event: m_12
            event_data: {n: 12, v: '{{ states(''sensor.s1'') }}'}
          continue_on_error: true
        - action: test.s13
          data: {n: 13, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    enabled: false
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}'}
    - trigger: state
      entity_id: sensor.s1
      attribute: lvl
      for: {seconds: '{{ 1 + 1 }}'}
    timeout: 1
    continue_on_timeout: false
  - event: m_15
    event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_14
    event_data: {n: 14, v: '{{ now().second }}', var: '{{ v2 | default(''undef'') }}'}
  - condition: and
    conditions:
    - {condition: time, before: '22:13:30'}
    - {condition: numeric_state, entity_id: sensor.s1, below: 15, enabled: false}
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', enabled: false}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [input_boolean.b1, 'off']
- at: 6
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 11
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, unavailable]
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [input_boolean.b1, unavailable]
- at: 17
  send: {type: event, event_type: e1}
- at: 19
  send: {type: event, event_type: e2}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 23
  set: [light.l1, 'on']
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 27
  set: [sensor.s2, '1']
- at: 29
  send:
    type: event
    event_type: e2
    data: {k: 1}

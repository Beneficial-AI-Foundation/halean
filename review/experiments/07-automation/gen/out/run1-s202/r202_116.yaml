# random scenario, seed 202, index 116 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: state, entity_id: light.l2, to: unavailable, id: beta}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s1, above: 6}
  - {condition: time, before: '06:00'}
  actions:
  - parallel:
    - sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
      - if: ['{{ trigger.platform == ''event'' }}']
        then:
        - {stop: s}
    - sequence:
      - parallel:
        - sequence:
          - delay: {seconds: 1}
        - sequence:
          - condition: trigger
            id: [beta, '0']
            enabled: false
      - parallel:
        - sequence:
          - event: m_2
            event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
          - variables:
              v2: [a, '{{ 1 + 1 }}']
          - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 1}
          - event: m_3
            event_data: {n: 3, completed: '{{ wait.completed }}'}
        - sequence:
          - repeat:
              for_each: '{{ [''x'', 1] }}'
              sequence:
              - {event: m_4}
              - action: test.s5
                data: {n: 5, v: '{{ trigger.id }}'}
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
                continue_on_error: true
  - choose:
    - conditions:
      - {condition: state, entity_id: sensor.s2, state: '4'}
      - {condition: time, before: '22:14'}
      sequence:
      - action: test.s6
        data: {n: 6, v: '{{ trigger.platform }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        response_variable: v3
    default:
    - parallel:
      - sequence:
        - action: test.s7
          data: {n: 7, v: '{{ states(''light.l1'') }}'}
          response_variable: v4
        - {stop: s}
      - sequence:
        - {condition: time, after: '23:00:00', before: '22:14'}
        - wait_template: '{{ trigger.id == ''0'' }}'
          timeout: {seconds: 2}
        - event: m_8
          event_data: {n: 8, completed: '{{ wait.completed }}'}
        - delay: {seconds: '{{ 2 }}'}
          enabled: false
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: [sensor.s1, sensor.s2]
    from: unknown
    for: 1
    id: alpha
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
  - condition: not
    conditions:
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - '{{ states(''sensor.s1'') | int(0) > 7 }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    - condition: trigger
      id: [beta, '0']
  actions:
  - {delay: '{{ 1 }}'}
  - {delay: 2}
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - event: m_9
    event_data: {n: 9, v: '{{ now().second }}'}
- alias: a2
  id: id2
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: '20'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 6}
  actions:
  - repeat:
      count: 1
      sequence:
      - action: test.s10
        data: {n: 10, v: '{{ trigger.idx }}'}
        target: {entity_id: light.l1}
      - delay: {seconds: 1}
  - if:
    - condition: state
      entity_id: light.l2
      state: ['off', 'on']
    then:
    - delay: {seconds: 1}
  - sequence:
    - choose:
      - conditions:
        - {condition: time, after: '22:13:25'}
        - {condition: time, after: '22:13:25'}
        sequence:
        - sequence:
          - {action: test.s11}
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
        sequence:
        - parallel:
          - sequence:
            - event: m_12
              event_data: {n: 12, v: '{{ states(''sensor.s1'') }}'}
          - sequence:
            - condition: and
              conditions:
              - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - action: test.s13
              data: {n: 13, v: '{{ trigger.description }}'}
              continue_on_error: true
              response_variable: v1
        - parallel:
          - sequence:
            - action: test.s14
              data: {n: 14, v: '{{ trigger.description }}'}
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          - sequence:
            - action: test.s15
              data: {n: 15, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    - action: test.s16
      data: {n: 16, v: '{{ states(''light.l1'') }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    timeout: {seconds: 2}
  - action: test.s17
    target: {entity_id: light.l1}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 3
  send: {type: event, event_type: e1}
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [sensor.s1, '12']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 15
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s1, '7.5']
  attributes: {lvl: 2}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  set: [light.l2, 'on']
- at: 19
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 25
  set: [sensor.s2, '1']
  attributes: {lvl: 3}
- at: 27
  set: [light.l2, 'off']
- at: 29
  set: [input_boolean.b1, 'on']
- at: 32
  set: [input_boolean.b1, unavailable]
- at: 32
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 146 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', for: 1}
  actions:
  - action: test.s1
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 1}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}

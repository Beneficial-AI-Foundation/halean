  triggers:
  - {trigger: state, entity_id: input_boolean.b1, attribute: lvl}
  actions:
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {condition: trigger, id: '0'}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  - parallel:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.description }}'}
    - sequence:
      - sequence:
        - if:
          - condition: state
            entity_id: sensor.s2
            state: ['1', '4']
          then:
          - {delay: '00:00:02'}
          - action: test.s3
            data: {n: 3, v: '{{ states(''light.l1'') }}'}
            response_variable: v1
          continue_on_error: true

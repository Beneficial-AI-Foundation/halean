# random scenario, seed 202, index 162 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: ['8', '4']
  conditions:
  - {condition: time, after: '23:00:00', before: '22:13:30'}
  actions:
  - condition: or
    conditions:
    - '{{ is_state(''light.l2'', ''off'') }}'
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}', enabled: false}
  - wait_for_trigger:
    - {trigger: event, event_type: e1}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a1

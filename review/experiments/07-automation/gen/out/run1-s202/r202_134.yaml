# random scenario, seed 202, index 134 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:23', id: alpha}
  - {trigger: state, entity_id: light.l1}
  - {trigger: event, event_type: e2, id: alpha}
  actions:
  - sequence:
    - sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
        timeout: 3
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - parallel:
        - sequence:
          - {delay: 0}
        - event: m_1
          event_data: {n: 1, v: '{{ trigger.id }}'}
  - {delay: 2}
  - {delay: '00:00:02'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: sensor.s2}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', for: 3}
  - trigger: template
    value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'
    for: {seconds: 2}
  actions:
  - parallel:
    - event: m_3
      event_data: {n: 3, v: '{{ now().second }}'}
    - event: m_4
      event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - event: m_5
    event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - parallel:
    - sequence:
      - sequence:
        - choose:
          - conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
            sequence:
            - action: test.s6
              data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              response_variable: v1
          - conditions:
            - '{{ is_state(''light.l2'', ''off'') }}'
            - {condition: numeric_state, entity_id: sensor.s2, below: 9}
            sequence:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          default:
          - {delay: 2}
      - action: test.s7
        data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - sequence:
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {delay: 0}
          - {event: m_8}
    continue_on_error: true
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: sensor.s2}
  actions:
  - variables: {v1: 1}
  - action: test.s9
    data: {n: 9, v: '{{ trigger.id }}'}
  - {event: m_10}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: e1}
- at: 1
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 2
  send: {type: service_result, call_id: 0, ok: true}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s2, '1']
- at: 5
  set: [sensor.s1, '8']
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 6
  send: {type: service_result, call_id: 1, ok: true}
- at: 7
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  set: [input_boolean.b1, unavailable]
- at: 8
  send: {type: event, event_type: tick}

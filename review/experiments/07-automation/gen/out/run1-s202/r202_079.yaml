# random scenario, seed 202, index 79 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: unavailable, for: 3}
  - {trigger: event, event_type: e3, id: alpha}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
  actions:
  - condition: not
    conditions:
    - {condition: time, before: '06:00'}
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    - {trigger: event, event_type: e1}
    timeout: 2
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - repeat:
      count: 1
      sequence:
      - {stop: s}
- alias: a1
  id: id1
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0, v5: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
  - trigger: event
    event_type: e3
    event_data: {k: true}
  actions:
  - if:
    - {condition: time, after: '22:13:25'}
    - condition: state
      entity_id: [light.gone, light.l2]
      state: 'on'
      match: any
    then:
    - action: test.s3
      data: {n: 3, v: '{{ trigger.idx }}'}
      response_variable: v2
    - if:
      - condition: state
        entity_id: light.l2
        state: ['on', 'off']
      then:
      - action: test.s4
        target:
          entity_id: [light.l1, light.l2]
        continue_on_error: true
      - {delay: 0}
      - repeat:
          until:
          - condition: or
            conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}', '{{ repeat.index >= 3 }}']
          sequence:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - action: test.s5
            data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            response_variable: v3
          - event: m_6
            event_data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v3 | default(''undef'') }}'}
        continue_on_error: true
    else:
    - repeat:
        count: 0
        sequence:
        - {stop: s}
        - parallel:
          - sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ states(''sensor.s1'') }}', var: '{{ v3 | default(''undef'') }}'}
            - variables:
                v3: [a, '{{ 1 + 1 }}']
            - action: test.s8
              data: {n: 8, v: '{{ trigger.idx }}'}
          - sequence:
            - {condition: trigger, id: '0', enabled: false}
          - sequence:
            - variables: {v4: 1}
            - {event: m_9}
          continue_on_error: true
    - action: test.s10
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {stop: s}
  - parallel:
    - {event: m_11}
    - sequence:
      - action: test.s12
        data: {n: 12, v: '{{ trigger.platform }}'}
        continue_on_error: true
      - parallel:
        - {event: m_13}
        - sequence:
          - {event: m_14}
          - {event: m_15}
          - {event: m_16}
        - sequence:
          - {event: m_17}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - not:
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
          - '{{ states(''sensor.s1'') | int > 5 }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9, enabled: false}
      sequence:
      - {action: test.s18}
      - event: m_19
        event_data: {n: 19, v: '{{ states(''sensor.s1'') }}'}
      - parallel:
        - sequence:
          - wait_template: '{{ is_state(''light.l1'', ''on'') }}'
            timeout: {seconds: 2}
          - event: m_21
            event_data: {n: 21, completed: '{{ wait.completed }}'}
          - wait_for_trigger:
            - {trigger: event, event_type: e1}
            - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
          - {event: m_20}
        - sequence:
          - event: m_22
            event_data: {n: 22, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v3 | default(''undef'') }}'}
          - event: m_23
            event_data: {n: 23, v: '{{ trigger.idx }}'}
          - action: test.s24
            data: {n: 24, v: '{{ now().second }}'}
            target:
              entity_id: [light.l1, light.l2]
        - event: m_25
          event_data: {n: 25, v: '{{ now().second }}', var: '{{ v4 | default(''undef'') }}'}
    default:
    - repeat:
        while: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}', '{{ repeat.index <= 3 }}']
        sequence:
        - {event: m_26}
    continue_on_error: true
  - sequence:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      enabled: false
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 1}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 2}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [sensor.s1, abc]
- at: 4
  set: [light.l2, 'on']
- at: 5
  send: {type: event, event_type: e3}
- at: 6
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: e2}
- at: 10
  set: [light.l1, unavailable]
- at: 12
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 13
  set: [sensor.s1, '12']
- at: 14
  send: {type: service_result, call_id: 0, ok: true}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 17
  set: [input_boolean.b1, 'on']
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 20
  send: {type: event, event_type: e1}
- at: 21
  set: [light.l2, unavailable]
- at: 24
  send: {type: event, event_type: e2}
- at: 26
  send: {type: event, event_type: tick}
- at: 26
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 27
  send: {type: event, event_type: tick}

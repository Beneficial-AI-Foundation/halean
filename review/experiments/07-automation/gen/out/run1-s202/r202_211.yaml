# random scenario, seed 202, index 211 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  conditions:
  - condition: and
    conditions:
    - {condition: time, after: '22:13:25', before: '22:13:30'}
    - not:
      - {condition: trigger, id: '0'}
      - {condition: trigger, id: '0'}
      - {condition: state, entity_id: input_boolean.b1, state: 'off', enabled: false}
  - '{{ states(''sensor.s1'') | int(0) > 10 }}'

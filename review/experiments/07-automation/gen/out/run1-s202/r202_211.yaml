    event_data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}

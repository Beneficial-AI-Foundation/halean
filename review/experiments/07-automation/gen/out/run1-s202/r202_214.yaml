# random scenario, seed 202, index 214 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - variables: {v1: 1}
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - repeat:
      while:
      - condition: trigger
        id: [beta, '0']
      - '{{ repeat.index <= 2 }}'
      sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ now().second }}'}
- alias: a1
  id: id1
  mode: queued
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: state, entity_id: light.l2, from: 'on', id: alpha}
  conditions:
  - {condition: trigger, id: '0'}
  actions:
  - repeat:
      for_each: []
      sequence:
      - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
      - event: m_3
        event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
      - choose:
        - conditions:
          - not:
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            - {condition: time, after: '22:00', before: '22:14'}
          - {condition: time, after: '22:13:25', before: '22:13:30'}
          sequence:
          - sequence:
            - {action: test.s4}
            - action: test.s5
              data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
              target: {entity_id: light.l1}
          - {delay: 1}
  - parallel:
    - sequence:
      - {delay: 2}
      - {stop: s}
    - {event: m_6}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 1
  send: {type: event, event_type: e1}
- at: 4
  set: [light.l1, 'off']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e3}
- at: 9
  set: [light.l2, unavailable]
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  send: {type: event, event_type: e1}

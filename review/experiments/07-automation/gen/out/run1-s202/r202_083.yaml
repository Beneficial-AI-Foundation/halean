# random scenario, seed 202, index 83 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: time, at: '22:13:23'}
  - trigger: event
    event_type: e3
    event_data: {k: true}
  conditions:
  - not:
    - condition: trigger
      id: [beta, '0']
    - not:
      - {condition: time, after: '23:00:00', before: '22:14'}
      - {condition: time, after: '23:00:00', before: '22:13:30'}
  actions:
  - sequence:
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: sensor.s2}
      timeout: 0
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - action: test.s1
      data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - action: test.s3
    data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - if:
    - condition: and
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: light.gone
          state: ['off', unavailable]
    then:
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - repeat:
        until: ['{{ repeat.index >= 3 }}']
        sequence:
        - choose:
          - conditions:
            - {condition: time, after: '23:00:00', before: '22:13:30'}
            sequence:
            - condition: state
              entity_id: input_boolean.b1
              state: ['on', unavailable]
            - {action: test.s4}
          default:
          - {action: test.s5}
    else:
    - repeat:
        for_each: '{{ states(''light.l1'') }}'
        sequence:
        - event: m_6
          event_data: {n: 6, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
          enabled: false
        - event: m_7
          event_data: {n: 7, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
  - {delay: '00:00:02'}
  - sequence:
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 3}
      timeout: 1
    - event: m_12
      event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - if:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
      then:
      - parallel:
        - sequence:
          - {action: test.s8}
        - sequence:
          - event: m_9
            event_data: {n: 9, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
      else:
      - if:
        - {condition: state, entity_id: sensor.s2, state: unknown}
        - {condition: state, entity_id: sensor.s1, state: abc}
        then:
        - action: test.s10
          data: {n: 10, v: '{{ trigger.description }}'}
        - variables: {v1: '{{ states(''sensor.s1'') }}'}
        else:
        - {event: m_11}
      continue_on_error: true
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s2}
  - {trigger: event, event_type: e1}
  - trigger: state
    entity_id: light.l2

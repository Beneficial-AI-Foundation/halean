# random scenario, seed 202, index 153 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - trigger: state
    entity_id: [light.l2, sensor.s1]
    to: 1
    attribute: lvl
  conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
  actions:
  - action: test.s1
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    response_variable: v2
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '00:00:03'}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 2, to: 2, attribute: lvl, id: alpha}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - delay: {seconds: '{{ 2 }}'}
  - {stop: s, error: true}
  - repeat:
      until: ['{{ repeat.index >= 1 }}']
      sequence:
      - {stop: s}
states:
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s2, '4']
  attributes: {lvl: 1}
- at: 2
  send: {type: event, event_type: e1}
- at: 5
  send: {type: event, event_type: e3}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s2, unavailable]
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 11
  send: {type: event, event_type: e2}
- at: 14
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: e2}
- at: 15
  set: [sensor.s2, abc]
- at: 17
  send: {type: event, event_type: e2}
- at: 20
  send: {type: event, event_type: e2}
- at: 22
  send: {type: event, event_type: e3}
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  set: [sensor.s1, '12']
- at: 25
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 28
  set: [light.l2, unavailable]
- at: 30
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 33
  set: [light.l1, 'off']

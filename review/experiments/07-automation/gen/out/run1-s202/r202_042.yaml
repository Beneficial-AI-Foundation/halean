# random scenario, seed 202, index 42 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  actions:
  - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  - condition: and
    conditions:
    - condition: not
      conditions:
      - {condition: time, after: '23:00:00', before: '06:00'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      - {condition: time, before: '06:00'}
  - wait_for_trigger:
    - trigger: state
      entity_id: [sensor.s2, light.l2]
      not_to: unknown
      for: 00:00:02
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: alpha}
      - or:
        - condition: state
          entity_id: input_boolean.b1
          state: ['off', 'on']
      sequence:
      - {delay: 2}
    - conditions:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      sequence:
      - {delay: 1}
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '8'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 9
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '1']
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s1, '20']
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: a}

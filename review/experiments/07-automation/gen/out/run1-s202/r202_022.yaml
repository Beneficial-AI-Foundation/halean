# random scenario, seed 202, index 22 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l2, to: 'off', from: 'off'}
  conditions:
  - {condition: state, entity_id: light.l2, state: 'on'}
  actions:
  - {delay: '00:00:02'}
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.platform }}'}
    - sequence:
      - sequence:
        - event: m_2
          event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
        - wait_for_trigger:
          - {trigger: state, entity_id: input_boolean.b1}
        enabled: false
      - if:
        - {condition: state, entity_id: light.l1, state: 'on'}
        then:
        - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: '{{ 2 }}'}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - if:
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
          then:
          - variables: {v2: x}
          else:
          - event: m_3
            event_data: {n: 3, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
          - {event: m_4}
          - {event: m_5}
  - action: test.s7
    data: {n: 7, v: '{{ now().second }}'}
  - {event: m_8}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - {delay: 2}
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - sequence:
    - action: test.s9
      data: {n: 9, v: '{{ this.attributes.current }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    - {stop: s}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - '{{ states(''sensor.s1'') | int(0) > 3 }}'
        - not:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - {condition: trigger, id: alpha}
        - {condition: state, entity_id: light.l2, state: unavailable}
      - or:
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - condition: and
          conditions:
          - '{{ is_state(''light.l1'', ''on'') }}'
          - {condition: state, entity_id: light.l1, state: 'off', for: '00:00:03'}
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        - condition: not
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          - '{{ states(''sensor.s2'') | float(0) < 9 }}'
      sequence:
      - {event: m_10}
    - conditions:
      - or: ['{{ trigger.platform == ''event'' }}']
      sequence:
      - repeat:
          for_each: []
          sequence:
          - {action: test.s11}
        enabled: false
      - {condition: time, after: '22:00'}
      - wait_for_trigger:
        - {trigger: event, event_type: e3}
        timeout: 2
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - {stop: s}
  - if:
    - {condition: time, after: '22:00'}
    - {condition: state, entity_id: sensor.s2, state: unavailable}
    then:
    - delay: {seconds: 1}
    - repeat:
        count: 3
        sequence:
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            sequence:
            - {delay: 2}
          default:
          - action: test.s13
            data: {n: 13, v: '{{ states(''light.l1'') }}'}
            target:
              entity_id: [light.l1, light.l2]
          - action: test.s14
            data: {n: 14, v: '{{ trigger.id }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s2, '7.5']
- at: 6
  set: [sensor.s2, '1']
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e1}
- at: 12
  set: [sensor.s2, '12']
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 15
  send: {type: event, event_type: e3}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [sensor.s1, abc]

# random scenario, seed 202, index 142 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: 1, attribute: lvl, id: alpha}
  - {trigger: time, at: '22:13:26'}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', enabled: false}
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.s2
    to: unknown
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - and:
    - and:
      - '{{ states(''sensor.s2'') | float(0) < 9 }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      - condition: state
        entity_id: input_boolean.b1
        state: ['on', 'off']
  actions:
  - choose:
    - conditions:
      - condition: not
        conditions:
        - or:
          - {condition: trigger, id: '0'}
          - '{{ trigger.id == ''0'' }}'
        - condition: not
          conditions:
          - {condition: time, before: '06:00'}
          - '{{ trigger.id == ''0'' }}'
        - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', timeout: 1, continue_on_timeout: false}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
    - conditions:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    default:
    - {stop: s, error: true}
    - {stop: s}
  - event: m_3
    event_data: {n: 3, v: '{{ trigger.description }}'}
  - {condition: trigger, id: '1', enabled: false}
  - delay: {seconds: '{{ 2 }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2, continue_on_timeout: false}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: parallel
  max: 2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10, id: alpha}
  - {trigger: state, entity_id: sensor.s1, id: beta}
  actions:
  - {condition: state, entity_id: input_boolean.b1, state: 'on'}
  - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - delay: {seconds: 1}
  - sequence:
    - if:
      - condition: or
        conditions:
        - {condition: state, entity_id: light.gone, state: unavailable}
        - condition: and
          conditions:
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - condition: state
            entity_id: sensor.s1
            state: '1'
            for: {seconds: 1}
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - {condition: state, entity_id: sensor.s2, state: '12'}
      then:
      - parallel:
        - event: m_4
          event_data: {n: 4, v: '{{ trigger.description }}'}
        - event: m_5
          event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        continue_on_error: true
      else:
      - if:
        - {condition: trigger, id: '1'}
        then:
        - {action: test.s6}
      - repeat:
          count: '{{ 2 }}'
          sequence:
          - event: m_7
            event_data: {n: 7, v: '{{ trigger.id }}'}
    - if:
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      then:
      - variables:
          v3: [a, '{{ 1 + 1 }}']
      else:
      - {stop: s}
      - if:
        - {condition: time, before: '22:13:30'}
        - or:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - {condition: state, entity_id: light.gone, state: unavailable, for: 2}
        then:
        - {action: test.s8}
        - {delay: 2}
        - {action: test.s9}
        continue_on_error: true
        enabled: false
      - event: m_10
        event_data: {n: 10, v: '{{ trigger.id }}', var: '{{ v2 | default(''undef'') }}'}
      continue_on_error: true
    - action: test.s11
      data: {n: 11, v: '{{ now().second }}'}
      target:
        entity_id: [light.l1, light.l2]
  - delay: {seconds: '{{ 2 }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: e2}
- at: 6
  send: {type: event, event_type: e3}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 10
  send: {type: event, event_type: e2}
- at: 10
  send: {type: service_result, call_id: 0, ok: true}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 14
  set: [light.l1, unavailable]
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 18
  set: [light.l2, unavailable]
- at: 20
  set: [sensor.s2, '1']
- at: 22
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}
- at: 28
  set: [light.l1, 'on']
- at: 28
  send: {type: event, event_type: e1}
- at: 31
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 32
  set: [input_boolean.b1, 'off']
- at: 35
  set: [input_boolean.b1, 'on']
- at: 36
  set: [sensor.s2, '20']
- at: 37
  send: {type: event, event_type: e3}

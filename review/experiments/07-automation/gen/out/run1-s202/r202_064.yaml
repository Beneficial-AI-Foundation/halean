# random scenario, seed 202, index 64 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: time_pattern, seconds: 31}
  - {trigger: event, event_type: e2}
  actions:
  - action: test.s1
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    response_variable: v1
  - delay: {seconds: 1}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: 3, attribute: lvl}
  conditions: ['{{ is_state(''light.l1'', ''on'') }}']
  actions:
  - if:
    - and:
      - condition: and
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
        - condition: state
          entity_id: light.l1
          state: ['off', 'on']
      - {condition: trigger, id: '0'}
    - {condition: trigger, id: alpha}
    then:
    - repeat:
        until: ['{{ repeat.index >= 1 }}']
        sequence:
        - choose:
          - conditions:
            - {condition: state, entity_id: light.l2, state: 'on'}
            sequence:
            - action: test.s3
              data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            - event: m_4
              event_data: {n: 4, v: '{{ trigger.description }}'}
            - action: test.s5
              data: {n: 5, v: '{{ this.attributes.current }}'}
              target:
                entity_id: [light.l1, light.l2]
          - conditions:
            - or:
              - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
              - condition: state
                entity_id: input_boolean.b1
                state: ['on', unavailable]
              enabled: false
            - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
            sequence:
            - event: m_6
              event_data: {n: 6, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
            - {delay: 2}
            - {event: m_7}
          default:
          - {action: test.s8}
    - wait_for_trigger:
      - trigger: state
        entity_id: light.l1
        for: {seconds: '{{ 1 + 1 }}'}
      timeout: 1
      continue_on_timeout: false
      enabled: false
    - event: m_9
      event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    else:
    - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', timeout: 1}
  - event: m_11
    event_data: {n: 11, completed: '{{ wait.completed }}'}
  - {event: m_10}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 1
  set: [input_boolean.b1, unavailable]
- at: 1
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l1, 'off']
- at: 4
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, abc]
- at: 6
  set: [sensor.s2, '12']
  attributes: {lvl: 3}
- at: 9
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 11
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 12
  set: [input_boolean.b1, 'on']
- at: 13
  set: [light.l1, 'on']
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 16
  set: [light.l1, unavailable]
  attributes: {lvl: 1}

# random scenario, seed 202, index 46 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: [unavailable, 'on']
    to: unavailable
    id: beta
  - {trigger: time_pattern, seconds: '26'}
  conditions:
  - or:
    - condition: not
      conditions:
      - {condition: time, before: '22:13:30'}
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - {condition: state, entity_id: sensor.s1, state: unavailable, for: 2}
  actions:
  - {delay: '00:00:02'}
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: [light.l2, sensor.s2]
        timeout: 0
        continue_on_timeout: false
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {action: test.s1, continue_on_error: true}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', id: alpha}
  - {trigger: state, entity_id: light.l2}
  - {trigger: state, entity_id: sensor.s2, from: abc, to: '8'}
  actions:
  - event: m_3
    event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {delay: 1}
  - action: test.s4
    data: {n: 4, v: '{{ states(''light.l1'') }}'}
  - parallel:
    - sequence:
      - {delay: 2}
      - parallel:
        - event: m_5
          event_data: {n: 5, v: '{{ trigger.id }}'}
        - sequence:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - parallel:
            - sequence:
              - event: m_6
                event_data: {n: 6, v: '{{ trigger.idx }}'}
              - action: test.s7
                data: {n: 7, v: '{{ trigger.description }}'}
                response_variable: v1
            - {event: m_8}
            - {event: m_9}
        - sequence:
          - {stop: s}
          - wait_for_trigger:
            - trigger: state
              entity_id: input_boolean.b1
              from: ['on', unavailable]
          - event: m_10
            event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s2, unavailable]
- at: 3
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: e1}
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 8
  send: {type: event, event_type: e3}
- at: 8
  send: {type: event, event_type: e2}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 11
  set: [light.l1, unavailable]
- at: 13
  set: [light.l1, 'off']
- at: 15
  set: [sensor.s1, '20']
- at: 17
  set: [sensor.s1, '1']
- at: 19
  send: {type: event, event_type: tick}
- at: 19
  send: {type: service_result, call_id: 0, ok: true}
- at: 19
  set: [light.l2, 'on']
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 24
  send: {type: event, event_type: e1}

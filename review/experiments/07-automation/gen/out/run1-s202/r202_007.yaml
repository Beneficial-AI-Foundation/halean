# random scenario, seed 202, index 7 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {trigger: state, entity_id: light.l2, to: unavailable}
  conditions: ['{{ is_state(''light.l1'', ''on'') }}']
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - {delay: '00:00:02'}
  - if:
    - {condition: time, before: '06:00'}
    - '{{ is_state(''light.l1'', ''on'') }}'
    then:
    - if: ['{{ trigger.platform == ''event'' }}']
      then:
      - wait_for_trigger:
        - {trigger: event, event_type: e3}
        - {trigger: event, event_type: e3}
      else:
      - parallel:
        - {event: m_1}
        - event: m_2
          event_data: {n: 2, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ trigger.description }}'}
        enabled: false
    - parallel:
      - sequence:
        - {action: test.s4}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
        - repeat:
            for_each: [a, b]
            sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ trigger.description }}'}
            - {action: test.s6}
          continue_on_error: true
      - {event: m_7}
      - event: m_8
        event_data: {n: 8, v: '{{ trigger.platform }}'}
    - {stop: s, error: true}
  variables: {v1: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  conditions:
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s1, above: 6}
    - {condition: time, after: '22:00', before: '06:00'}
  actions:
  - {condition: time, before: '22:13:30', weekday: tue}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
    timeout: 2
    continue_on_timeout: false
  - event: m_9
    event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: '00:00:02'}
states:
- {entity_id: sensor.s1, state: '1'}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 3
  set: [sensor.s1, '7.5']
- at: 6
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s1, unavailable]
- at: 10
  set: [input_boolean.b1, 'on']
- at: 11
  set: [sensor.s2, '4']
- at: 13
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 17
  send: {type: event, event_type: e3}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 19
  send: {type: event, event_type: tick}
- at: 22
  set: [input_boolean.b1, 'off']
- at: 22
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 24
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e3}

# random scenario, seed 202, index 171 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10, id: alpha}
  actions:
  - if:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    then:
    - variables: {v1: x}
    else:
    - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: '00:00:03'}
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}'}
    - parallel:
      - sequence:
        - parallel:
          - sequence:
            - action: test.s1
              data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
              target: {entity_id: light.l1}
              response_variable: v2
          - {event: m_2}
      - sequence:
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - {condition: time, before: '22:14'}
    continue_on_error: true
  - condition: not
    conditions:
    - {condition: trigger, id: '0'}
    - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
    - or:
      - {condition: time, after: '22:00'}
      - '{{ is_state(''light.l2'', ''off'') }}'
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    enabled: false
  - delay: {seconds: '{{ 2 }}'}
  - repeat:
      count: 2
      sequence:
      - {delay: '{{ 1 }}'}
      - action: test.s4
        data: {n: 4, v: '{{ now().second }}'}
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
        timeout: {seconds: 2}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s6
    data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, unavailable]
  attributes: {lvl: 3}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: e3}
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, '7.5']
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 19
  send: {type: event, event_type: e3}
- at: 19
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 21
  send: {type: event, event_type: e2}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 24
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: tick}

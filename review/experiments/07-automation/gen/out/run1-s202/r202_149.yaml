# random scenario, seed 202, index 149 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /3}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: state, entity_id: input_boolean.b1, state: 'on'}
  - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  actions:
  - wait_for_trigger:
    - trigger: event
      event_type: e1
      event_data: {k: true}
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    timeout: {seconds: 2}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', for: 3}
    timeout: 3
    continue_on_timeout: false
  - sequence:
    - sequence:
      - choose:
        - conditions:
          - {condition: state, entity_id: sensor.s1, state: '7.5'}
          - condition: and
            conditions:
            - '{{ is_state(''light.l2'', ''off'') }}'
            - not:
              - {condition: time, before: '22:14'}
            enabled: false
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ states(''light.l1'') }}'}
        - conditions:
          - condition: not
            conditions:
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            - condition: or
              conditions:
              - {condition: trigger, id: '1'}
              - {condition: state, entity_id: sensor.s1, state: '7.5'}
              - condition: time
                after: '22:13:25'
                before: '22:13:30'
                weekday: [tue]
          - {condition: trigger, id: alpha, enabled: false}
          sequence:
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        enabled: false
    - action: test.s2
      data: {n: 2, v: '{{ trigger.platform }}'}
      response_variable: v1
  variables: {v1: 0}
states:
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 3
  send: {type: event, event_type: e2}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 6
  set: [sensor.s1, unavailable]
- at: 7
  set: [sensor.s2, '1']
- at: 8
  set: [input_boolean.b1, unavailable]
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e1}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [sensor.s2, '8']
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 19
  set: [light.l2, 'off']
- at: 19
  send: {type: event, event_type: e3}

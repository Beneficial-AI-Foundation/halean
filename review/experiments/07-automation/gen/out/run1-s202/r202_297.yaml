# random scenario, seed 202, index 297 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - trigger: state
    entity_id: [sensor.s2, input_boolean.b1]
    from: 2
    to: 3
    attribute: lvl
  actions:
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1, continue_on_timeout: false}
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: sensor.s2, for: '{{ 2 }}'}
    - trigger: state
      entity_id: [input_boolean.b1, light.l1]
      to: 'off'
      for: {seconds: 2}
    timeout: 1
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
    timeout: 1
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {condition: numeric_state, entity_id: sensor.s2, below: 15}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}

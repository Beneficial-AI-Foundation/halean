# random scenario, seed 202, index 295 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - if:
    - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    then:
    - {wait_template: '{{ trigger.id == ''0'' }}'}
    - event: m_2
      event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
    - event: m_3
      event_data: {n: 3, v: '{{ now().second }}'}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  send: {type: event, event_type: e2}
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 4
  send: {type: event, event_type: e2}
- at: 4
  send: {type: event, event_type: e1}
- at: 7
  set: [sensor.s2, '20']
- at: 8
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 11
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 14
  set: [input_boolean.b1, unavailable]
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l1, unavailable]
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 23
  set: [light.l2, unavailable]
  attributes: {lvl: 3}

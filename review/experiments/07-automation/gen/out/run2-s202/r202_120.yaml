# random scenario, seed 202, index 120 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1}
  - {trigger: event, event_type: e3}
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10, value_template: '{{ state.state | float(0) * 2 }}'}
  actions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - repeat:
          count: 1
          sequence:
          - {stop: s}
          - {stop: s}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l2]
    timeout: 1
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l2}
    - {trigger: event, event_type: e1}
  - {wait_template: '{{ is_state(''light.l1'', ''on'') }}'}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
steps:
- at: 1
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 2
  set: [sensor.s1, unknown]
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 4
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 5
  set: [input_boolean.b1, 'on']
- at: 6
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 11
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 12
  set: [input_boolean.b1, 'on']
- at: 12
  set: [sensor.s1, '7.5']
- at: 15
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l2, unavailable]
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'off']
- at: 20
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: e2}
- at: 22
  send: {type: event, event_type: e1}
- at: 23
  set: [sensor.s1, unknown]
- at: 24
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: e2}

# random scenario, seed 202, index 70 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s2
    above: 3
    below: sensor.s2
    for: {seconds: 2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  actions:
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - conditions:
      - condition: state
        entity_id: sensor.s2
        state: ['4', '20']
      - condition: state
        entity_id: [sensor.s2]
        state: 'on'
        match: any
      sequence:
      - parallel:
        - sequence:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - if:
            - condition: and
              conditions:
              - not:
                - {condition: time, before: '06:00'}
                - condition: time
                  after: '22:13:25'
                  weekday: [tue]
              - {condition: time, after: '23:00:00', before: '22:13:30'}
            - {condition: trigger, id: '1'}
            then:
            - variables: {v2: 1}
          - action: test.s2
            data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - sequence:
          - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0, continue_on_timeout: false}
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}'}
          - {event: m_3}
      - parallel:
        - {event: m_5}
        - sequence:
          - if:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            then:
            - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
            else:
            - condition: and
              conditions:
              - condition: trigger
                id: [beta, '0']
            continue_on_error: true
          - action: test.s6
            data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
            target:
              entity_id: [light.l1, light.l2]
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
    timeout: 1
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s7
    data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - delay: {seconds: '{{ 2 }}'}
  - sequence:
    - {condition: time, after: '22:00'}
    - choose:
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s1, above: 3}
        sequence:
        - {event: m_8}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.platform }}'}
      continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: '1'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 7
  set: [sensor.s1, '12']
- at: 7
  set: [sensor.s2, '4']
- at: 7
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 9
  send: {type: event, event_type: e1}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 13
  set: [light.l2, 'off']
- at: 14
  set: [sensor.s2, '20']
- at: 14
  set: [sensor.s2, unknown]
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 17
  set: [input_boolean.b1, unavailable]
- at: 19
  send: {type: event, event_type: e1}
- at: 20
  set: [sensor.s2, '12']
- at: 23
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 24
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: e1}

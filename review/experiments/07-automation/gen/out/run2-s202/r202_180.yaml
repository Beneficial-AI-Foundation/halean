# random scenario, seed 202, index 180 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  actions:
  - if:
    - or:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - condition: time
      after: '23:00:00'
      before: 06:00
      weekday: [wed, mon]
    then:
    - action: test.s1
      data: {n: 1, v: '{{ trigger.description }}'}
      continue_on_error: true
    else:
    - wait_for_trigger:
      - {trigger: state, entity_id: input_boolean.b1, to: 'on'}
      - trigger: template
        value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'
        for: {seconds: '{{ 1 + 1 }}'}
      timeout: 3
      continue_on_timeout: false
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - action: test.s3
      data: {n: 3, v: '{{ trigger.id }}'}
  - {action: test.s4, enabled: false}
  - {stop: s}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.id }}'}
    target: {entity_id: light.l1}
states:
- {entity_id: sensor.s1, state: '1'}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 2
  set: [sensor.s1, '20']
- at: 3
  send: {type: event, event_type: e3}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  set: [sensor.s1, unknown]
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 9
  set: [input_boolean.b1, unavailable]
- at: 12
  set: [light.l2, 'off']
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 13
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 14
  set: [light.l2, unavailable]
- at: 15
  set: [sensor.s1, '20']
- at: 15
  send: {type: event, event_type: e3}
- at: 15
  set: [sensor.s1, '1']
- at: 15
  send: {type: event, event_type: e1}
- at: 16
  send: {type: event, event_type: e2}

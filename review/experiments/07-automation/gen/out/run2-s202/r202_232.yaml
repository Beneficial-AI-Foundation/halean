# random scenario, seed 202, index 232 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
    - sequence:
      - action: test.s2
        data: {n: 2, v: '{{ this.attributes.current }}'}
      - choose:
        - conditions:
          - {condition: state, entity_id: sensor.s1, state: '7.5'}
          sequence:
          - {delay: 2}
        default:
        - {delay: 2, enabled: false}
        enabled: false
  - event: m_3
    event_data: {n: 3, v: '{{ trigger.id }}'}
  - {event: m_4}
  - action: test.s5
    data: {n: 5, v: '{{ states(''light.l1'') }}'}
    response_variable: v1
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  actions:
  - event: m_6
    event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - repeat:
      count: 3
      sequence:
      - sequence:
        - repeat:
            until:
            - condition: or
              conditions:
              - or:
                - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
                - not:
                  - condition: trigger
                    id: [beta, '0']
                  - {condition: time, before: '22:13:30'}
                - {condition: time, after: '23:00:00'}
              - '{{ repeat.index >= 3 }}'
            sequence:
            - action: test.s7
              target: {entity_id: light.l1}
              continue_on_error: true
            - action: test.s8
              data: {n: 8, v: '{{ trigger.platform }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              response_variable: v2
            - event: m_9
              event_data: {n: 9, v: '{{ trigger.platform }}'}
      - sequence:
        - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0, continue_on_timeout: false}
      - variables: {v3: '{{ states(''sensor.s1'') }}'}
    continue_on_error: true
  - sequence:
    - {delay: 2}
    - {delay: 2}
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - variables: {v4: x}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 3}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 1
  set: [sensor.s1, '20']
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, unavailable]
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 11
  set: [light.l2, 'on']
- at: 11
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 13
  set: [light.l2, unavailable]
- at: 16
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 17
  send: {type: event, event_type: e3}
- at: 17
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 20
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}

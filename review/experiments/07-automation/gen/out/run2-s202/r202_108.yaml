# random scenario, seed 202, index 108 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  - trigger: state
    entity_id: [sensor.s1]
  - {trigger: time, at: '22:13:23'}
  actions:
  - repeat:
      count: 0
      sequence:
      - {action: test.s1}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - {action: test.s2}
  - if:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - '{{ is_state(''light.l2'', ''off'') }}'
    then:
    - sequence:
      - wait_template: '{{ trigger.platform == ''event'' }}'
        timeout: {seconds: 2}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
      - repeat:
          while:
          - {condition: state, entity_id: input_boolean.b1, state: 'off'}
          - '{{ repeat.index <= 3 }}'
          sequence:
          - action: test.s3
            data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            target: {entity_id: light.l1}
            continue_on_error: true
  - wait_for_trigger:
    - trigger: state
      entity_id: [sensor.s1, sensor.s2]
      attribute: lvl
    timeout: 3
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  actions:
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - and: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
          sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ trigger.platform }}'}
        - conditions:
          - condition: not
            conditions:
            - '{{ states(''sensor.s2'') | float(0) < 15 }}'
            - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9, enabled: false}
          sequence:
          - {condition: time, before: '22:13:30'}
        default:
        - repeat:
            count: '{{ 2 }}'
            sequence:
            - {event: m_7}
            - {event: m_8}
            - action: test.s9
              data: {n: 9, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - sequence:
          - variables: {v2: 1}
          - {action: test.s10}
          continue_on_error: true
        - event: m_11
          event_data: {n: 11, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
      - {stop: s}
    - sequence:
      - {event: m_12}
    enabled: false
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    timeout: 2
  - event: m_13
    event_data: {n: 13, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a2
  id: id2
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  actions:
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s2, below: 10, value_template: '{{ state.state | float(0) * 2 }}', for: 2}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_14
    event_data: {n: 14, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 5
  set: [input_boolean.b1, 'off']
- at: 7
  send: {type: service_result, call_id: 0, ok: true}
- at: 8
  send: {type: event, event_type: e3}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 13
  send: {type: event, event_type: e3}
- at: 14
  set: [sensor.s2, unknown]
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 18
  send: {type: event, event_type: e3}
- at: 20
  set: [light.l1, 'off']
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}
- at: 25
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 26
  send: {type: event, event_type: e1}
- at: 28
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 28
  set: [light.l1, unavailable]
- at: 31
  send: {type: event, event_type: e3}
- at: 32
  send:
    type: event
    event_type: e2
    data: {k: true}

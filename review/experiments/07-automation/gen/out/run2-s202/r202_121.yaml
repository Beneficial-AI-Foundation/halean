# random scenario, seed 202, index 121 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  - {trigger: event, event_type: e1}
  - trigger: event
    event_type: e2
    event_data: {k: true}
    id: alpha
  conditions:
  - or:
    - {condition: trigger, id: alpha}
    - condition: state
      entity_id: light.gone
      state: ['off', 'on']
    - '{{ states(''sensor.s1'') | int(0) > 3 }}'
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ now().second }}'}
  - {action: test.s3}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l2]
      to: 1
      attribute: lvl
    timeout: 0
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s4
    data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [light.l1, unavailable]
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
- at: 5
  set: [input_boolean.b1, 'off']
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 10
  set: [light.l1, unavailable]
- at: 11
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 13
  set: [light.l2, 'off']
- at: 14
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 15
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 16
  set: [sensor.s1, '4']
- at: 17
  send: {type: event, event_type: e3}

# random scenario, seed 202, index 19 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, sensor.s2]
    from: 'off'
    for: 2
  - {trigger: time, at: '22:13:23'}
  - {trigger: event, event_type: e2}
  conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
  actions:
  - {condition: state, entity_id: light.l1, state: unavailable, for: '00:00:03'}
  - {action: test.s1}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  - action: test.s2
    data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
    response_variable: v1
  - sequence:
    - variables: {v1: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, from: unavailable}
  - {trigger: event, event_type: e1}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 3}
  - {condition: time, after: '23:00:00', before: '22:13:30'}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0, continue_on_timeout: false}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  - variables:
      v2: [a, '{{ 1 + 1 }}']
    enabled: false
  - event: m_3
    event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, unavailable]
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: e1}
- at: 13
  set: [sensor.s1, '20']
- at: 14
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: e3}
- at: 17
  set: [sensor.s1, abc]
- at: 18
  set: [sensor.s1, '12']
- at: 19
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: e3}
- at: 20
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 21
  set: [light.l1, 'off']
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 22
  send: {type: event, event_type: e1}
- at: 24
  set: [light.l1, 'on']
- at: 24
  set: [input_boolean.b1, 'off']

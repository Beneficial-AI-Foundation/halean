# random scenario, seed 202, index 8 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: time, at: '22:13:26'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {event: m_2}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s2, not_to: '7.5', from: '4'}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - parallel:
    - sequence:
      - action: test.s3
        data: {n: 3, v: '{{ now().second }}'}
      - sequence:
        - sequence:
          - delay: {seconds: '{{ 2 }}'}
        enabled: false
    - sequence:
      - {stop: s, error: true}
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - action: test.s4
    target: {entity_id: light.l1}
    response_variable: v1
  - action: test.s5
    data: {n: 5, v: '{{ this.attributes.current }}'}
  - wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s2, abc]
- at: 3
  set: [light.l1, unavailable]
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 8
  send: {type: event, event_type: e2}
- at: 8
  set: [light.l1, 'on']
- at: 11
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 14
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, 'on']
- at: 20
  set: [light.l2, 'on']
- at: 21
  set: [input_boolean.b1, 'on']
- at: 22
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 23
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 20 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: '7.5'}
  - {trigger: event, event_type: e1}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', enabled: false}
  actions:
  - {delay: '00:00:02'}
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
  - {event: m_3}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 3}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 3
  set: [input_boolean.b1, 'off']
- at: 5
  send: {type: event, event_type: e2}
- at: 8
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l1, 'off']
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 18
  set: [light.l1, 'on']
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 26
  set: [light.l2, unavailable]
- at: 27
  set: [input_boolean.b1, unavailable]

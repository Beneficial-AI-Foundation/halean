# random scenario, seed 202, index 182 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - {trigger: state, entity_id: light.l2, to: 1, attribute: lvl}
  actions:
  - variables:
      v2: [a, '{{ 1 + 1 }}']
  - repeat:
      count: 1
      sequence:
      - {delay: 2}
      - {stop: s}
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', enabled: false}
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0}
  - {delay: '{{ 1 }}'}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: time_pattern, seconds: 23}
  actions:
  - repeat:
      count: 3
      sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - {event: m_1}
    continue_on_error: true
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - or:
            - {condition: trigger, id: alpha}
            - {condition: state, entity_id: sensor.s2, state: '1', for: 2}
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 2 }}']
              sequence:
              - {action: test.s2}
          - variables: {v2: x}
          - repeat:
              count: 0
              sequence:
              - {action: test.s3}
        - conditions: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
          sequence:
          - choose:
            - conditions:
              - {condition: trigger, id: '1'}
              sequence:
              - variables:
                  v1: [a, '{{ 1 + 1 }}']
              - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - conditions:
              - or:
                - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
                enabled: false
              - or:
                - '{{ trigger.id == ''0'' }}'
                - {condition: time, after: '22:00', before: '22:14'}
                - {condition: time, after: '22:00', before: '22:14'}
                enabled: false
              sequence:
              - event: m_4
                event_data: {n: 4, v: '{{ states(''sensor.s1'') }}', var: '{{ v3 | default(''undef'') }}'}
              - condition: or
                conditions:
                - condition: not
                  conditions:
                  - '{{ trigger.id == ''0'' }}'
                  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
                - {condition: trigger, id: '1'}
              - {delay: 0}
            default:
            - delay: {seconds: 1}
            - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - event: m_5
        event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
    - sequence:
      - parallel:
        - sequence:
          - wait_for_trigger:
            - {trigger: state, entity_id: light.l2, for: 1}
            timeout: 3
          - event: m_7
            event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - action: test.s6
            data: {n: 6, v: '{{ states(''light.l1'') }}'}
            response_variable: v5
        - sequence:
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 2}
            timeout: 2
            continue_on_timeout: false
          - event: m_8
            event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.id }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 1
  set: [sensor.s2, unknown]
  attributes: {lvl: 2}
- at: 2
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 5
  send: {type: event, event_type: e3}
- at: 6
  set: [light.l2, 'off']
- at: 7
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 15
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: e2}
- at: 18
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}
- at: 21
  set: [light.l2, 'on']

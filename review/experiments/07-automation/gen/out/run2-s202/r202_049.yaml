# random scenario, seed 202, index 49 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2, id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', id: alpha}
  conditions:
  - condition: not
    conditions: ['{{ trigger.id == ''0'' }}']
  actions:
  - parallel:
    - sequence:
      - action: test.s1
        data: {n: 1, v: '{{ trigger.description }}'}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.description }}'}
      - action: test.s3
        data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - sequence:
      - event: m_4
        event_data: {n: 4, v: '{{ this.attributes.current }}'}
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 2}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
    - event: m_6
      event_data: {n: 6, v: '{{ this.attributes.current }}'}
  - event: m_7
    event_data: {n: 7, v: '{{ trigger.description }}'}
  - condition: trigger
    id: [beta, '0']
    enabled: false
  - parallel:
    - sequence:
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - {event: m_8}
      - repeat:
          while:
          - {condition: time, after: '22:00', before: '22:13:30'}
          - '{{ repeat.index <= 2 }}'
          sequence:
          - repeat:
              count: 3
              sequence:
              - event: m_9
                event_data: {n: 9, v: '{{ now().second }}'}
                enabled: false
              - action: test.s10
                data: {n: 10, v: '{{ now().second }}'}
              - event: m_11
                event_data: {n: 11, v: '{{ trigger.platform }}'}
          - event: m_12
            event_data: {n: 12, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        enabled: false
    - sequence:
      - action: test.s13
        data: {n: 13, v: '{{ states(''sensor.s1'') }}'}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 1
  set: [light.l1, 'on']
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 6
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 9
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 13
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 14
  send: {type: event, event_type: e1}
- at: 17
  set: [light.l2, 'off']
- at: 18
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 20
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 22
  send: {type: service_result, call_id: 3, ok: true}
- at: 23
  send: {type: event, event_type: e3}
- at: 26
  send: {type: service_result, call_id: 4, ok: true}
- at: 28
  send: {type: event, event_type: e1}
- at: 29
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 30
  set: [sensor.s2, '12']
  attributes: {lvl: 2}
- at: 30
  send:
    type: service_result
    call_id: 5
    ok: true
    response: {value: x}
- at: 33
  set: [sensor.s2, '1']
- at: 36
  send:
    type: event
    event_type: e2
    data: {k: true}

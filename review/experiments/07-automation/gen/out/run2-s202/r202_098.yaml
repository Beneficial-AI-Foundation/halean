# random scenario, seed 202, index 98 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  conditions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - condition: and
    conditions:
    - condition: state
      entity_id: [sensor.s1]
      state: 'on'
      match: any
    - or:
      - {condition: trigger, id: '1'}
      - {condition: state, entity_id: light.l2, state: 'on', for: 2}
    - condition: or
      conditions:
      - {condition: time, after: '22:13:25', before: '22:14'}
    enabled: false
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    continue_on_error: true
    enabled: false
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
      sequence:
      - repeat:
          count: 0
          sequence:
          - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: '00:00:03', continue_on_timeout: false}
          - event: m_7
            event_data: {n: 7, completed: '{{ wait.completed }}'}
          - action: test.s2
            data: {n: 2, v: '{{ now().second }}'}
          - if:
            - condition: not
              conditions:
              - condition: not
                conditions:
                - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
                - {condition: state, entity_id: light.gone, state: 'off', for: 2}
              - condition: trigger
                id: [beta, '0']
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
            then:
            - action: test.s3
              data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
              target:
                entity_id: [light.l1, light.l2]
            - action: test.s4
              data: {n: 4, v: '{{ this.attributes.current }}'}
            - event: m_5
              event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
              enabled: false
            else:
            - action: test.s6
              data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
              target:
                entity_id: [light.l1, light.l2]
            continue_on_error: true
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.s2
            state: ['4', '7.5']
            for: {seconds: 1}
          sequence:
          - {event: m_8}
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - conditions:
          - {condition: time, after: '22:00', before: '06:00'}
          sequence:
          - delay: {seconds: 1}
          - parallel:
            - sequence:
              - condition: state
                entity_id: light.l2
                state: [unavailable, 'off']
                for: {seconds: 1}
              - action: test.s9
                data: {n: 9, v: '{{ now().second }}'}
            - sequence:
              - condition: or
                conditions:
                - {condition: trigger, id: alpha}
                - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
              - action: test.s10
                data: {n: 10, v: '{{ states(''light.l1'') }}'}
                enabled: false
              - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        continue_on_error: true
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: and
              conditions:
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
                - {condition: time, after: '22:00'}
                - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
              - condition: or
                conditions:
                - condition: trigger
                  id: [beta, '0']
              - condition: not
                conditions:
                - condition: state
                  entity_id: light.l1
                  state: ['on', 'off']
                - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - event: m_11
            event_data: {n: 11, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
          - repeat:
              while:
              - {condition: state, entity_id: input_boolean.b1, state: 'on'}
              - '{{ repeat.index <= 3 }}'
              sequence:
              - event: m_12
                event_data: {n: 12, v: '{{ trigger.platform }}'}
            continue_on_error: true
    default:
    - {event: m_13}
    - action: test.s14
      data: {n: 14, v: '{{ states(''sensor.s1'') }}'}
      continue_on_error: true
    - action: test.s15
      data: {n: 15, v: '{{ trigger.platform }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: time, at: '22:13:23'}
  - trigger: template
    value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - or:
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    - condition: not
      conditions:
      - {condition: state, entity_id: light.l1, state: unavailable}
    - or:
      - {condition: state, entity_id: sensor.s2, state: '7.5'}
      - {condition: state, entity_id: light.l2, state: unavailable}
      - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
      enabled: false
  actions:
  - action: test.s16
    data: {n: 16, v: '{{ this.attributes.current }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - {delay: '{{ 1 }}'}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      sequence:
      - event: m_17
        event_data: {n: 17, v: '{{ states(''light.l1'') }}'}
      - sequence:
        - repeat:
            while:
            - or:
              - {condition: state, entity_id: light.l2, state: 'on'}
              - condition: not
                conditions:
                - '{{ states(''sensor.s2'') | float(0) < 9 }}'
                - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
                - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
              - {condition: trigger, id: '0'}
            - '{{ repeat.index <= 1 }}'
            sequence:
            - {action: test.s18}
            - event: m_19
              event_data: {n: 19, v: '{{ states(''light.l1'') }}'}
        - event: m_20
          event_data: {n: 20, v: '{{ this.attributes.current }}'}
    continue_on_error: true
- alias: a2
  id: id2
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  conditions:
  - {condition: trigger, id: alpha}
  actions:
  - action: test.s21
    data: {n: 21, v: '{{ states(''sensor.s1'') }}'}
    target: {entity_id: light.l1}
    response_variable: v1
  - {stop: s, enabled: false}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: not
          conditions:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      - condition: not
        conditions:
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        - condition: and
          conditions:
          - {condition: trigger, id: '1'}
          - '{{ trigger.platform == ''event'' }}'
      sequence:
      - variables: {v2: '{{ states(''sensor.s1'') }}'}
    - conditions:
      - condition: and
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3}
        - condition: state
          entity_id: input_boolean.b1
          state: ['on', unavailable]
      - condition: trigger
        id: [beta, '0']
      sequence:
      - event: m_22
        event_data: {n: 22, v: '{{ trigger.platform }}', var: '{{ v2 | default(''undef'') }}'}
    default:
    - repeat:
        for_each: []
        sequence:
        - action: test.s23
          data: {n: 23, v: '{{ states(''light.l1'') }}'}
          continue_on_error: true
        - choose:
          - conditions:
            - and:
              - condition: and
                conditions:
                - {condition: trigger, id: alpha}
            sequence:
            - action: test.s24
              data: {n: 24, v: '{{ now().second }}'}
              target: {entity_id: light.l1}
          - conditions:
            - and:
              - {condition: state, entity_id: light.l1, state: 'on'}
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
            sequence:
            - {event: m_25, enabled: false}
            - {condition: time, before: '22:14', weekday: tue, enabled: false}
          default:
          - {condition: state, entity_id: sensor.s1, state: unknown}
          - action: test.s26
            data: {n: 26, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  send: {type: event, event_type: e3}
- at: 2
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 3
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 3
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 7
  set: [sensor.s2, '8']
- at: 10
  set: [light.l2, unavailable]
- at: 12
  set: [sensor.s1, '20']
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  send: {type: event, event_type: tick}
- at: 14
  set: [input_boolean.b1, unavailable]
- at: 15
  set: [sensor.s2, unknown]
- at: 16
  send: {type: event, event_type: e2}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: tick}
- at: 21
  set: [sensor.s1, '1']
- at: 24
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: e3}

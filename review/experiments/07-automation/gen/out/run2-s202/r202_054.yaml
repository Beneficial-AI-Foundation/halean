# random scenario, seed 202, index 54 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.idx }}'}
  - {stop: s}
  - {action: test.s2}
  - if:
    - condition: state
      entity_id: light.l2
      state: ['off', 'on']
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
    then:
    - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
    else:
    - event: m_3
      event_data: {n: 3, v: '{{ this.attributes.current }}'}
    - {condition: numeric_state, entity_id: sensor.s1, above: 6}
  - event: m_4
    event_data: {n: 4, v: '{{ this.attributes.current }}'}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
    id: alpha
  - {trigger: state, entity_id: input_boolean.b1, from: 1, attribute: lvl}
  conditions:
  - {condition: time, before: '22:14'}
  actions:
  - {stop: s}
  - condition: not
    conditions:
    - condition: trigger
      id: [beta, '0']
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [sensor.s2, '8']
- at: 4
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 5
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [light.l1, 'off']
- at: 12
  send: {type: event, event_type: e1}
- at: 15
  set: [light.l2, unavailable]
- at: 18
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 20
  send: {type: event, event_type: e2}
- at: 21
  send: {type: event, event_type: e3}
- at: 21
  set: [light.l2, 'off']
- at: 22
  send: {type: event, event_type: e1}
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 28
  send: {type: event, event_type: tick}
- at: 29
  set: [light.l2, unavailable]

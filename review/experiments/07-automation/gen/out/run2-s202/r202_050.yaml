# random scenario, seed 202, index 50 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: time_pattern, seconds: 31}
  - {trigger: event, event_type: e3}
  actions:
  - wait_for_trigger:
    - trigger: event
      event_type: e2
      event_data: {k: 1}
    timeout: 1
  - parallel:
    - sequence:
      - repeat:
          count: 2
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ trigger.idx }}'}
          - choose:
            - conditions:
              - not:
                - {condition: time, after: '23:00:00', before: '22:14'}
                - '{{ states(''sensor.s1'') | int(0) > 3 }}'
              sequence:
              - event: m_2
                event_data: {n: 2, v: '{{ trigger.id }}'}
            default:
            - event: m_3
              event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
      - event: m_4
        event_data: {n: 4, v: '{{ states(''light.l1'') }}'}
    - sequence:
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.description }}'}
      - action: test.s6
        data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
      - parallel:
        - sequence:
          - {event: m_7}
          - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
          - event: m_8
            event_data: {n: 8, completed: '{{ wait.completed }}'}
          - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0, continue_on_timeout: false}
          - event: m_9
            event_data: {n: 9, completed: '{{ wait.completed }}'}
        - sequence:
          - sequence:
            - {delay: 0}
    - sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - sequence:
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - condition: trigger
      id: [beta, '0']
    then:
    - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0, continue_on_timeout: false}
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
      timeout: {seconds: 2}
    - event: m_11
      event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - {event: m_10}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s1, to: '8'}
  actions:
  - {action: test.s12}
  - wait_for_trigger:
    - trigger: event
      event_type: e1
      event_data: {k: 1}
    - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
    timeout: 3
  - event: m_13
    event_data: {n: 13, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a2
  id: id2
  mode: queued
  max: 3
  triggers:
  - trigger: state
    entity_id: sensor.s2
    to: [unknown, '20']
    for: 1
  - {trigger: event, event_type: e3}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2}
  - event: m_16
    event_data: {n: 16, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - or:
        - condition: state
          entity_id: light.l1
          state: ['off', unavailable]
        - {condition: trigger, id: '1'}
        enabled: false
      sequence:
      - event: m_14
        event_data: {n: 14, v: '{{ states(''sensor.s1'') }}'}
    default:
    - sequence:
      - action: test.s15
        data: {n: 15, v: '{{ now().second }}'}
        target:
          entity_id: [light.l1, light.l2]
    enabled: false
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  set: [input_boolean.b1, unavailable]
- at: 6
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: e3}
- at: 11
  set: [light.l1, 'off']
- at: 11
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 12
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 14
  set: [input_boolean.b1, 'off']
- at: 17
  send: {type: event, event_type: e1}
- at: 19
  send: {type: event, event_type: e1}

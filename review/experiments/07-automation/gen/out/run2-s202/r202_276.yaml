# random scenario, seed 202, index 276 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: time_pattern, seconds: /7}
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    timeout: 3
    continue_on_timeout: false
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - repeat:
        count: 2
        sequence:
        - {stop: s}
        - parallel:
          - sequence:
            - delay: {seconds: '{{ 2 }}'}
            - {delay: 1}
          - {event: m_1}
          - {event: m_2}
          continue_on_error: true
        - choose:
          - conditions:
            - {condition: trigger, id: alpha}
            sequence:
            - action: test.s3
              data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
              response_variable: v1
          - conditions:
            - {condition: state, entity_id: input_boolean.b1, state: 'off', for: 2}
            sequence:
            - {event: m_4}
            - action: test.s5
              data: {n: 5, v: '{{ this.attributes.current }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10, for: '{{ 2 }}'}
  - {trigger: state, entity_id: sensor.s1, for: '{{ 2 }}'}
  conditions:
  - not:
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
    - or:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - {condition: state, entity_id: light.l2, state: unavailable, for: 2}
      - {condition: numeric_state, entity_id: sensor.s1, above: 3}
    - condition: or
      conditions:
      - '{{ trigger.id == ''0'' }}'
      - condition: time
        after: '23:00:00'
        before: '22:14'
        weekday: [wed, mon]
  - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
  actions:
  - if:
    - condition: or
      conditions:
      - {condition: time, after: '22:13:25', before: '22:14'}
      - condition: or
        conditions:
        - {condition: state, entity_id: light.l2, state: 'off'}
        - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
        enabled: false
    then:
    - variables:
        v1: [a, '{{ 1 + 1 }}']
    - if:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      then:
      - delay: {seconds: 1}
      - sequence:
        - action: test.s7
          data: {n: 7, v: '{{ states(''sensor.s1'') }}'}
        - variables: {v1: '{{ states(''sensor.s1'') }}'}
      else:
      - condition: trigger
        id: [beta, '0']
        enabled: false
      - {stop: s}
      continue_on_error: true
    else:
    - event: m_8
      event_data: {n: 8, v: '{{ this.attributes.current }}'}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - action: test.s9
    data: {n: 9, v: '{{ states(''light.l1'') }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 4
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s2, '7.5']
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: e3}
- at: 8
  set: [sensor.s1, '1']
- at: 8
  send: {type: event, event_type: e2}
- at: 9
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s2, unknown]
- at: 14
  set: [light.l2, 'off']

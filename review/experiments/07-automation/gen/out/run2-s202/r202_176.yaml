# random scenario, seed 202, index 176 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2, id: beta}
  - {trigger: time, at: '22:13:33'}
  actions:
  - if:
    - {condition: state, entity_id: sensor.s2, state: unavailable, enabled: false}
    - or:
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    then:
    - sequence:
      - parallel:
        - sequence:
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - {action: test.s1, continue_on_error: true}
        - sequence:
          - action: test.s2
            data: {n: 2, v: '{{ trigger.platform }}'}
          - {event: m_3}
      - variables: {v2: x}
    - parallel:
      - sequence:
        - parallel:
          - sequence:
            - {delay: 1}
            - {delay: 0}
          - sequence:
            - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2}
          - {trigger: state, entity_id: input_boolean.b1, from: unavailable}
          timeout: 0
          continue_on_timeout: false
        - event: m_4
          event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - sequence:
        - parallel:
          - sequence:
            - {delay: 1}
            - {delay: '{{ 1 }}'}
          - sequence:
            - {event: m_5}
            - {delay: '00:00:02'}
          - sequence:
            - action: test.s6
              data: {n: 6, v: '{{ trigger.platform }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              response_variable: v4
    else:
    - variables: {v3: 1}
    - {condition: state, entity_id: light.l1, state: unavailable}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: 1, continue_on_timeout: false}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}'}
  - if:
    - condition: time
      before: '22:14'
      weekday: [wed, mon]
    then:
    - action: test.s7
      data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  set: [sensor.s1, '8']
- at: 4
  send: {type: event, event_type: e3}
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 9
  set: [sensor.s2, '20']
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 14
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s2, '4']
- at: 16
  set: [light.l2, 'on']
- at: 19
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 25
  set: [sensor.s2, '8']
- at: 28
  send: {type: event, event_type: e3}
- at: 29
  set: [light.l1, 'on']
- at: 30
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 33
  send: {type: event, event_type: tick}
- at: 35
  set: [input_boolean.b1, unavailable]
- at: 38
  send: {type: event, event_type: e3}
- at: 39
  set: [light.l1, 'off']
  attributes: {lvl: 3}

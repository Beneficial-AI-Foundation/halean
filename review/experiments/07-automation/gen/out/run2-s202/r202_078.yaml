- at: 5
  send: {type: event, event_type: e2}
- at: 6
  set: [sensor.s2, abc]
- at: 6
  set: [light.l1, 'on']
- at: 7
  set: [sensor.s1, '4']
- at: 9
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 11
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 13

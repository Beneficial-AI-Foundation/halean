# random scenario, seed 202, index 78 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time, at: '22:13:33', id: beta}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    timeout: 1
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - repeat:
      count: 3
      sequence:
      - {stop: s}
      - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 0, continue_on_timeout: false}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
      - condition: state
        entity_id: input_boolean.b1
        state: ['on', unavailable]
      sequence:
      - {event: m_3}
      - event: m_4
        event_data: {n: 4, v: '{{ states(''light.l1'') }}'}
    default:
    - action: test.s5
      data: {n: 5, v: '{{ trigger.id }}'}
      target: {entity_id: light.l1}
      continue_on_error: true
      response_variable: v1
  variables: {v1: 0}
states:
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 3}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: e1}
- at: 4

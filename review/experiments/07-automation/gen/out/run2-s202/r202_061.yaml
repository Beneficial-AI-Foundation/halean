# random scenario, seed 202, index 61 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s1
    above: 3
    below: 10
    for: {seconds: 2}
  conditions:
  - or:
    - or:
      - '{{ is_state(''light.l2'', ''off'') }}'
      - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
    - {condition: trigger, id: '1'}
  - {condition: time, before: '22:13:30'}
  actions:
  - sequence:
    - action: test.s1
      data: {n: 1, v: '{{ this.attributes.current }}'}
      target:
        entity_id: [light.l1, light.l2]
  - {stop: s}
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '{{ 2 }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: time, at: '22:13:23'}
  - {trigger: event, event_type: e3}
  actions:
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.description }}'}
  - action: test.s3
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {delay: '{{ 1 }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 2
  send: {type: event, event_type: e2}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'on']
- at: 3
  set: [sensor.s2, '12']
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: service_result, call_id: 0, ok: true}
- at: 4
  set: [light.l1, unavailable]
- at: 5
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: e1}
- at: 5
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  set: [light.l1, 'off']
- at: 6
  send: {type: service_result, call_id: 1, ok: true}
- at: 7
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 262 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  - {trigger: time_pattern, seconds: /3}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  conditions:
  - condition: state
    entity_id: light.l1
    state: ['on', 'off']
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 0}
  - {condition: trigger, id: '1'}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: state, entity_id: light.l2, attribute: lvl, for: 2}
  conditions:
  - condition: not
    conditions:
    - condition: trigger
      id: [beta, '0']
    - condition: and
      conditions:
      - {condition: state, entity_id: input_boolean.b1, state: unavailable}
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
  actions:
  - {delay: '{{ 1 }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.b1
      from: ['off', unavailable]
    timeout: 0
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: unknown}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 3
  set: [light.l2, unavailable]
- at: 3
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 6
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 8
  set: [light.l2, 'on']
- at: 9
  send: {type: event, event_type: e3}
- at: 11
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: 1}
- at: 12
  send: {type: service_result, call_id: 3, ok: true}
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 18
  send: {type: service_result, call_id: 4, ok: true}
- at: 19
  send: {type: event, event_type: e3}
- at: 20
  send: {type: service_result, call_id: 6, ok: true}
- at: 21
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 23
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}

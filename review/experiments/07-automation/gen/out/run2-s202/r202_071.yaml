# random scenario, seed 202, index 71 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: light.l1
    not_to: [unavailable, 'off']
  - {trigger: time, at: '22:13:33'}
  actions:
  - {event: m_1}
  - parallel:
    - event: m_2
      event_data: {n: 2, v: '{{ now().second }}'}
    - sequence:
      - event: m_3
        event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - action: test.s4
        data: {n: 4, v: '{{ trigger.idx }}'}
        response_variable: v1
  - condition: not
    conditions:
    - condition: state
      entity_id: light.l2
      state: ['off', unavailable]
  - repeat:
      count: 3
      sequence:
      - parallel:
        - event: m_5
          event_data: {n: 5, v: '{{ trigger.description }}'}
        - sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
          - if:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            then:
            - delay: {seconds: '{{ 2 }}'}
            - condition: or
              conditions:
              - condition: or
                conditions:
                - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
                - {condition: state, entity_id: sensor.s1, state: '1'}
              - condition: and
                conditions:
                - condition: state
                  entity_id: sensor.s2
                  state: ['4', '12']
                  for: 2
                - {condition: state, entity_id: input_boolean.b1, state: unavailable}
              - condition: not
                conditions:
                - '{{ states(''sensor.s1'') | int > 5 }}'
                - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
              enabled: false
            else:
            - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
      - wait_template: '{{ is_state(''light.l2'', ''off'') }}'
        timeout: {seconds: 2}
        continue_on_timeout: false
  - delay: {seconds: 1}
  variables: {v1: 0, v2: 0}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [sensor.s1, '8']
- at: 2
  set: [sensor.s1, '4']
- at: 4
  set: [sensor.s1, abc]
- at: 5
  set: [sensor.s2, '4']
  attributes: {lvl: 2}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s2, '8']
- at: 14
  set: [light.l1, 'on']
- at: 17
  set: [sensor.s1, '4']
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'off']
- at: 19
  send: {type: event, event_type: e3}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}

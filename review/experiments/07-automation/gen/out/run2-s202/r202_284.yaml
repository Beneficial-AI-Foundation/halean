# random scenario, seed 202, index 284 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: event
    event_type: e3
    event_data: {k: a}
  actions:
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - parallel:
        - {event: m_2}
        - {event: m_3}
      - {delay: 1}
  - if:
    - condition: or
      conditions:
      - '{{ states(''sensor.s1'') | int(0) > 3 }}'
      - {condition: time, after: '23:00:00'}
      enabled: false
    then:
    - sequence:
      - if:
        - condition: and
          conditions:
          - {condition: time, before: '22:14'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        then:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - action: test.s4
          target: {entity_id: light.l1}
      - event: m_5
        event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      continue_on_error: true
    else:
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s2, below: 10, for: 1}
      timeout: 2
    - action: test.s6
      data: {n: 6, v: '{{ this.attributes.current }}'}
      target:
        entity_id: [light.l1, light.l2]
  - repeat:
      count: 2
      sequence:
      - sequence:
        - repeat:
            while: ['{{ trigger.platform in [''state'', ''numeric_state''] }}', '{{ repeat.index <= 1 }}']
            sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ trigger.id }}'}
        - repeat:
            until: ['{{ repeat.index >= 3 }}']
            sequence:
            - condition: or
              conditions:
              - condition: or
                conditions:
                - {condition: state, entity_id: input_boolean.b1, state: 'off'}
              - {condition: numeric_state, entity_id: sensor.s1, below: 15}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    timeout: 2
  - action: test.s8
    data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: time_pattern, seconds: /7}
  conditions: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', '{{ states(''sensor.s2'') | float(0) < 15 }}']
  actions:
  - parallel:
    - sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    - sequence:
      - {event: m_9}
  - if:
    - {condition: trigger, id: '1'}
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    then:
    - sequence:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - event: m_10
        event_data: {n: 10, completed: '{{ wait.completed }}'}
      - {delay: 2}
      - choose:
        - conditions:
          - {condition: time, after: '22:13:25', before: '06:00'}
          sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
  - {stop: s}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: queued
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', id: beta}
  - {trigger: event, event_type: e2}
  actions:
  - delay: {seconds: 1}
  - {stop: s, error: true}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
      sequence:
      - parallel:
        - sequence:
          - parallel:
            - sequence:
              - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
            - event: m_11
              event_data: {n: 11, v: '{{ now().second }}'}
            - event: m_12
              event_data: {n: 12, v: '{{ trigger.idx }}'}
          - {condition: state, entity_id: light.l1, state: 'on', for: 2}
        - sequence:
          - choose:
            - conditions:
              - not:
                - condition: state
                  entity_id: sensor.s2
                  state: [unavailable, unknown]
                - {condition: trigger, id: '1'}
              sequence:
              - action: test.s13
                data: {n: 13, v: '{{ states(''sensor.s1'') }}'}
              - action: test.s14
                data: {n: 14, v: '{{ trigger.description }}'}
                response_variable: v1
            - conditions: ['{{ states(''sensor.s2'') | float(0) < 15 }}']
              sequence:
              - condition: or
                conditions:
                - {condition: time, before: '06:00'}
                - condition: and
                  conditions:
                  - {condition: state, entity_id: sensor.s2, state: unavailable, for: 2}
                  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
                  - {condition: time, after: '23:00:00'}
                - {condition: time, before: '22:13:30', weekday: tue}
            default:
            - event: m_15
              event_data: {n: 15, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
            - {delay: 1}
          - {stop: s, error: true}
        - sequence:
          - action: test.s16
            data: {n: 16, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            target:
              entity_id: [light.l1, light.l2]
          - event: m_17
            event_data: {n: 17, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
      sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
        timeout: 0
        continue_on_timeout: false
      - event: m_18
        event_data: {n: 18, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - repeat:
          count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
          sequence:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - {condition: time, before: '06:00'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [input_boolean.b1, 'on']
- at: 6
  set: [light.l2, 'on']
- at: 8
  set: [light.l2, unavailable]
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 10
  send: {type: event, event_type: e2}
- at: 13
  set: [light.l1, 'off']
- at: 14
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 15
  set: [sensor.s2, unknown]
- at: 16
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 17
  set: [sensor.s2, '7.5']
- at: 18
  set: [sensor.s1, unavailable]
- at: 18
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, unavailable]
- at: 21
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: true}

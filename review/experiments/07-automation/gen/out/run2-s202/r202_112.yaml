# random scenario, seed 202, index 112 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: 31, id: alpha}
  actions:
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - repeat:
      count: 3
      sequence:
      - choose:
        - conditions:
          - and:
            - {condition: trigger, id: alpha, enabled: false}
            - and:
              - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            continue_on_error: true
          - {stop: s, error: true}
          - action: test.s2
            data: {n: 2, v: '{{ trigger.description }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            continue_on_error: true
        enabled: false
    continue_on_error: true
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: abc}
  - {trigger: event, event_type: e1}
  - {trigger: state, entity_id: sensor.s2, not_to: unknown}
  conditions:
  - condition: not
    conditions:
    - '{{ is_state(''light.l1'', ''on'') }}'
    - {condition: time, before: '22:14'}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {action: test.s3}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 2
  send: {type: event, event_type: e3}
- at: 4
  set: [sensor.s1, '7.5']
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 8
  set: [sensor.s1, '20']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 10
  set: [light.l2, 'on']
- at: 11
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 12
  set: [light.l2, unavailable]
- at: 13
  set: [sensor.s2, unknown]
- at: 16
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: e3}
- at: 20
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: tick}
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 25
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 26
  send: {type: event, event_type: e2}
- at: 28
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 30
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 33
  send:
    type: event
    event_type: e3
    data: {k: 2}

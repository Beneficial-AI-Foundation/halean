# random scenario, seed 202, index 228 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: time_pattern, seconds: /7}
  conditions:
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  actions:
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - {delay: '00:00:02'}
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - {event: m_2}
        - conditions:
          - condition: not
            conditions:
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
              - condition: trigger
                id: [beta, '0']
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - {condition: trigger, id: alpha}
          sequence:
          - if:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
            then:
            - {event: m_3}
            - {delay: 0}
            else:
            - delay: {seconds: 1}
            - event: m_4
              event_data: {n: 4, v: '{{ trigger.platform }}'}
  - {stop: s}
  - if:
    - {condition: time, after: '22:13:25', before: '06:00'}
    then:
    - parallel:
      - sequence:
        - {stop: s}
        - sequence:
          - {delay: 0}
          - event: m_5
            event_data: {n: 5, v: '{{ now().second }}'}
          continue_on_error: true
      - sequence:
        - wait_for_trigger:
          - {trigger: event, event_type: e1}
          - {trigger: event, event_type: e3}
          timeout: {seconds: 2}
          continue_on_timeout: false
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - parallel:
      - sequence:
        - choose:
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            - or:
              - '{{ trigger.id == ''0'' }}'
              - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
            sequence:
            - {delay: '00:00:02'}
          - conditions:
            - {condition: trigger, id: '0'}
            - '{{ states(''sensor.s2'') | float(0) < 15 }}'
            sequence:
            - {delay: '00:00:02'}
      - sequence:
        - repeat:
            until: ['{{ repeat.index >= 1 }}']
            sequence:
            - {delay: 0}
            - delay: {seconds: 1}
        - parallel:
          - {event: m_7}
          - sequence:
            - {condition: state, entity_id: light.l2, state: 'on'}
            - action: test.s8
              data: {n: 8, v: '{{ states(''light.l1'') }}'}
            - {delay: '{{ 1 }}'}
          - {event: m_9}
      - sequence:
        - action: test.s10
          data: {n: 10, v: '{{ now().second }}'}
          response_variable: v2
        - {action: test.s11}
    enabled: false
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [light.l2, 'off']
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 5
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 7
  set: [sensor.s1, unknown]
  attributes: {lvl: 3}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, '1']
- at: 14
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s1, unknown]

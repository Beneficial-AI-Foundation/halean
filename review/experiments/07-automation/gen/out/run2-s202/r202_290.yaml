# random scenario, seed 202, index 290 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: time, at: '22:13:23'}
  actions:
  - sequence:
    - {action: test.s1, response_variable: v2}
  - if:
    - {condition: trigger, id: '1', enabled: false}
    then:
    - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}'}
    - action: test.s2
      data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
- alias: a1
  id: id1
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  actions:
  - action: test.s4
    data: {n: 4, v: '{{ trigger.idx }}'}
    target: {entity_id: light.l1}
  - {delay: 1}
  - {stop: s}
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    enabled: false
  - {stop: s}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 2
  send: {type: event, event_type: e2}
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 7
  set: [light.l2, unavailable]
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, unknown]
- at: 13
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 21
  set: [sensor.s1, abc]
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 22
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 25
  set: [sensor.s1, '12']

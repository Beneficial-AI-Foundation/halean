# random scenario, seed 202, index 235 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10, for: 3}
  actions:
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10, for: 1}
    - {trigger: state, entity_id: input_boolean.b1, from: 1, attribute: lvl}
    timeout: 3
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {stop: s}
  - sequence:
    - sequence:
      - sequence:
        - action: test.s1
          data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          target: {entity_id: light.l1}
        - {condition: state, entity_id: light.l1, state: 'on'}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
      - variables:
          v1: [a, '{{ 1 + 1 }}']
    - condition: or
      conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - not:
        - {condition: time, after: '22:13:25'}
      enabled: false
    - {stop: s}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l2}
    timeout: 2
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s1, to: '20', from: '4', id: alpha}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, id: beta}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.b1
          state: ['off', unavailable]
          for: 00:00:03
        - condition: state
          entity_id: [input_boolean.b1]
          state: 'on'
          match: any
      sequence:
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
    - conditions:
      - condition: not
        conditions:
        - condition: and
          conditions:
          - {condition: state, entity_id: sensor.s2, state: unknown}
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', enabled: false}
        - {condition: time, after: '22:00'}
      - condition: or
        conditions:
        - {condition: state, entity_id: input_boolean.b1, state: 'off'}
        - '{{ trigger.id == ''0'' }}'
      sequence:
      - {delay: 0}
  - event: m_5
    event_data: {n: 5, v: '{{ trigger.idx }}'}
  - event: m_6
    event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 0
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 0
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 3
  set: [sensor.s2, '12']
- at: 6
  set: [input_boolean.b1, unavailable]
- at: 7
  send: {type: event, event_type: e2}
- at: 10
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e1}
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 15
  set: [input_boolean.b1, 'on']
- at: 16
  set: [sensor.s2, '8']
- at: 16
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 18
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 21
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 21
  send: {type: event, event_type: e1}
- at: 21
  set: [sensor.s1, '7.5']
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 27
  send: {type: event, event_type: e1}
- at: 28
  send: {type: event, event_type: tick}
- at: 29
  send: {type: event, event_type: e1}

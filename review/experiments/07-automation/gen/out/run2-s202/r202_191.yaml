# random scenario, seed 202, index 191 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  variables: {v1: 0}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: true}
  - trigger: event
    event_type: e1
    event_data: {k: true}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: [beta, '0']
      - {condition: state, entity_id: input_boolean.b1, state: unavailable}
      sequence:
      - parallel:
        - sequence:
          - event: m_1
            event_data: {n: 1, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
        - event: m_2
          event_data: {n: 2, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
        continue_on_error: true
    - conditions:
      - condition: not
        conditions:
        - condition: and
          conditions:
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
          - '{{ states(''sensor.s1'') | int > 5 }}'
      sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        timeout: 0
        continue_on_timeout: false
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - event: m_4
      event_data: {n: 4, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
  - event: m_5
    event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
  - {action: test.s7}
states:
- {entity_id: sensor.s1, state: '4'}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 3
  set: [input_boolean.b1, 'on']
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 4
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 7
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 8
  set: [sensor.s1, '20']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, '12']
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 15
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 17
  send: {type: event, event_type: e3}
- at: 20
  set: [light.l2, 'off']
- at: 23
  send: {type: event, event_type: tick}
- at: 23
  set: [light.l2, 'on']
- at: 24
  send: {type: event, event_type: tick}
- at: 24
  set: [sensor.s2, '8']
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 29
  send: {type: event, event_type: tick}
- at: 31
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 32
  set: [sensor.s1, '8']
  attributes: {lvl: 2}
- at: 33
  send: {type: event, event_type: tick}
- at: 33
  set: [light.l2, unavailable]
- at: 34
  set: [input_boolean.b1, unavailable]

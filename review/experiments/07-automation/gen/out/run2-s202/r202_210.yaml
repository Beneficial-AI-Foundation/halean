# random scenario, seed 202, index 210 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  - trigger: state
    entity_id: [input_boolean.b1]
    to: ['off', unavailable]
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
  - and:
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
    - {condition: time, after: '23:00:00', before: '22:14', weekday: tue}
  actions:
  - wait_for_trigger:
    - trigger: event
      event_type: e3
      event_data: {k: true}
    - {trigger: numeric_state, entity_id: sensor.s2, below: 10, for: 3}
  - event: m_9
    event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s1
    data: {n: 1, v: '{{ states(''light.l1'') }}'}
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - parallel:
        - sequence:
          - event: m_2
            event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ trigger.id }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - {delay: 2, enabled: false}
        - sequence:
          - action: test.s4
            data: {n: 4, v: '{{ trigger.description }}'}
          - parallel:
            - event: m_5
              event_data: {n: 5, v: '{{ this.attributes.current }}'}
            - sequence:
              - delay: {seconds: '{{ 2 }}'}
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
              - event: m_6
                event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            - sequence:
              - action: test.s7
                data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
                target: {entity_id: light.l1}
                response_variable: v2
            continue_on_error: true
      - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
      - action: test.s8
        data: {n: 8, v: '{{ trigger.description }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 3
  set: [light.l2, 'on']
- at: 4
  send: {type: event, event_type: e3}
- at: 6
  set: [sensor.s1, '4']
- at: 7
  set: [input_boolean.b1, 'on']
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 12
  set: [sensor.s1, '8']
- at: 13
  set: [light.l1, 'off']
- at: 15
  set: [sensor.s2, '8']
- at: 16
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s1, '12']
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 20
  set: [light.l1, 'on']
- at: 22
  set: [sensor.s1, '1']
- at: 22
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 25
  set: [light.l1, 'off']
- at: 25
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 25
  set: [sensor.s1, unavailable]
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: 2}

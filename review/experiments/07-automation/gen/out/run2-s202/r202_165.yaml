# random scenario, seed 202, index 165 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0}
  triggers:
  - trigger: state
    entity_id: [light.l2, input_boolean.b1]
    to: 'on'
    from: 'on'
  - {trigger: state, entity_id: sensor.s1, id: beta}
  - {trigger: state, entity_id: sensor.s2, id: alpha}
  conditions:
  - '{{ trigger.id == ''0'' }}'
  - condition: trigger
    id: [beta, '0']
  actions:
  - repeat:
      count: 2
      sequence:
      - if:
        - condition: not
          conditions: ['{{ states(''sensor.s2'') | float(0) < 9 }}']
        then:
        - {delay: 2}
        - if:
          - {condition: trigger, id: '0'}
          then:
          - event: m_1
            event_data: {n: 1, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
          - event: m_2
            event_data: {n: 2, v: '{{ trigger.platform }}'}
          - {event: m_3}
        - sequence:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - {event: m_4}
  - parallel:
    - event: m_5
      event_data: {n: 5, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - {action: test.s6}
  - variables: {v1: x}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  send: {type: event, event_type: e2}
- at: 2
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 2
  set: [sensor.s2, unavailable]
- at: 5
  set: [light.l2, 'on']
- at: 6
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l2, unavailable]
- at: 10
  set: [sensor.s1, '4']
- at: 11
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s1, unknown]
- at: 21
  send: {type: event, event_type: e1}
- at: 23
  set: [sensor.s1, '12']
- at: 24
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 244 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e1, id: beta}
  actions:
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: light.gone
              state: ['on', unavailable]
              enabled: false
            - '{{ states(''sensor.s1'') | int > 5 }}'
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ trigger.description }}'}
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            timeout: 1
          - event: m_2
            event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - conditions:
          - condition: or
            conditions:
            - '{{ is_state(''light.l2'', ''off'') }}'
            - {condition: trigger, id: alpha}
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 3 }}']
              sequence:
              - {action: test.s3}
              - {event: m_4}
              - {event: m_5}
            continue_on_error: true
          - wait_for_trigger:
            - {trigger: event, event_type: e1}
            timeout: {seconds: 2}
        default:
        - event: m_6
          event_data: {n: 6, v: '{{ trigger.idx }}'}
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - {stop: s}
    - sequence:
      - {event: m_7}
      - sequence:
        - sequence:
          - {delay: '{{ 1 }}'}
          continue_on_error: true
        - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '{{ 2 }}'}
      - if:
        - {condition: numeric_state, entity_id: sensor.s1, below: 9}
        then:
        - {event: m_8}
        - {action: test.s9}
        - if:
          - {condition: state, entity_id: light.l2, state: unavailable}
          then:
          - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
          - action: test.s10
            data: {n: 10, v: '{{ states(''light.l1'') }}'}
            response_variable: v3
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        else:
        - parallel:
          - sequence:
            - event: m_11
              event_data: {n: 11, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
            - action: test.s12
              data: {n: 12, v: '{{ trigger.id }}'}
          - sequence:
            - action: test.s13
              data: {n: 13, v: '{{ trigger.idx }}'}
            - event: m_14
              event_data: {n: 14, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
            - {event: m_15}
          - sequence:
            - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
          enabled: false
  - {stop: s}
  - delay: {seconds: 1}
  - sequence:
    - if:
      - '{{ is_state(''light.l1'', ''on'') }}'
      - or:
        - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9, enabled: false}
        - '{{ states(''sensor.s1'') | int > 5 }}'
      then:
      - event: m_16
        event_data: {n: 16, v: '{{ trigger.description }}', var: '{{ v3 | default(''undef'') }}'}
      else:
      - sequence:
        - action: test.s17
          data: {n: 17, v: '{{ trigger.idx }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      enabled: false
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - delay: {seconds: 1}
    enabled: false
  - repeat:
      until:
      - condition: or
        conditions:
        - {condition: time, after: '22:00'}
        - '{{ repeat.index >= 3 }}'
      sequence:
      - {condition: time, after: '23:00:00'}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 5
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 7
  send: {type: event, event_type: e2}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 10
  set: [light.l2, 'on']
- at: 11
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 14
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 15
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 16
  send: {type: event, event_type: e2}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}

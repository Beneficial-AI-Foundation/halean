# random scenario, seed 202, index 157 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', for: 1}
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  conditions:
  - condition: and
    conditions:
    - condition: not
      conditions:
      - {condition: time, after: '22:00', before: '22:14'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    - not:
      - {condition: time, before: '22:13:30'}
      - {condition: time, after: '22:13:25', before: '22:13:30'}
    - {condition: state, entity_id: light.l1, state: unavailable}
  actions:
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - choose:
        - conditions:
          - {condition: trigger, id: '1'}
          sequence:
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
          - wait_for_trigger:
            - {trigger: event, event_type: e1}
            - {trigger: state, entity_id: light.l1}
            timeout: 2
      - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s3
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    response_variable: v5
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s2, '8']
- at: 6
  set: [light.l1, 'off']
- at: 8
  set: [sensor.s1, abc]
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 9
  set: [light.l1, 'on']
- at: 10
  set: [input_boolean.b1, 'on']
- at: 11
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 12
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 13
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 19
  set: [light.l2, 'on']
- at: 20
  send: {type: event, event_type: e1}
- at: 22
  set: [sensor.s2, '1']
- at: 23
  send: {type: event, event_type: tick}
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 23
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 26
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 27
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 30
  send: {type: event, event_type: e2}
- at: 31

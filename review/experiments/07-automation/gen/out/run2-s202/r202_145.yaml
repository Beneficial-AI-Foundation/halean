# random scenario, seed 202, index 145 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
  - {trigger: event, event_type: e2, id: alpha}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
  - {delay: 2}
  - repeat:
      for_each: []
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 3 }}']
          sequence:
          - repeat:
              count: 3
              sequence:
              - variables: {v1: x}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - action: test.s2
    data: {n: 2, v: '{{ this.attributes.current }}'}
    response_variable: v2
  - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: time_pattern, seconds: /9}
  actions:
  - {delay: 0}
  - event: m_3
    event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
  - choose:
    - conditions: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
      sequence:
      - repeat:
          for_each: '{{ states(''light.l1'') }}'
          sequence:
          - {event: m_4}
      - {delay: '{{ 1 }}'}
    - conditions:
      - condition: not
        conditions:
        - '{{ is_state(''light.l1'', ''on'') }}'
        - '{{ is_state(''light.l1'', ''on'') }}'
        - {condition: trigger, id: alpha}
      sequence:
      - parallel:
        - sequence:
          - wait_for_trigger:
            - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        continue_on_error: true
      - {action: test.s7, enabled: false}
    default:
    - {stop: s, error: true}
- alias: a2
  id: id2
  mode: queued
  triggers:
  - {trigger: event, event_type: e1, id: beta}
  actions:
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  - event: m_8
    event_data: {n: 8, v: '{{ trigger.platform }}'}
  - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      sequence:
      - {condition: trigger, id: '1'}
    - conditions:
      - {condition: trigger, id: alpha}
      - condition: and
        conditions:
        - condition: and
          conditions:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - {condition: time, before: '22:14'}
          - condition: state
            entity_id: input_boolean.b1
            state: ['on', 'off']
        - {condition: time, after: '22:00', before: '22:14'}
        - condition: not
          conditions:
          - '{{ trigger.id == ''0'' }}'
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    default:
    - {event: m_9}
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    - {delay: 1}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 5
  set: [sensor.s1, '12']
- at: 6
  send: {type: event, event_type: e3}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 9
  set: [sensor.s1, abc]
- at: 10
  set: [sensor.s2, '4']
- at: 11
  send: {type: event, event_type: e1}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 14
  set: [light.l1, unavailable]
- at: 17
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 22
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 25
  set: [sensor.s1, abc]
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 27
  send: {type: event, event_type: tick}
- at: 30
  send: {type: event, event_type: e1}
- at: 30
  send: {type: event, event_type: tick}
- at: 32
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 34
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}

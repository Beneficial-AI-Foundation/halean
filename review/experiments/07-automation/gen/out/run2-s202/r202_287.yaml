# random scenario, seed 202, index 287 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:26'}
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, value_template: '{{ state.state | float(0) * 2 }}', for: 1}
  - trigger: state
    entity_id: input_boolean.b1
    from: [unavailable, 'on']
  actions:
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      - condition: and
        conditions:
        - {condition: state, entity_id: light.l1, state: 'off'}
        - condition: or
          conditions:
          - {condition: state, entity_id: light.gone, state: 'off'}
      sequence:
      - variables: {v1: x}
      - {stop: s}
      - {event: m_1}
    - conditions:
      - and:
        - condition: not
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
        - not:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      sequence:
      - sequence:
        - wait_for_trigger:
          - trigger: state
            entity_id: sensor.s1
            to: ['20', unknown]
            not_from: '20'
            for: '{{ 2 }}'
      - parallel:
        - {event: m_2}
        - event: m_3
          event_data: {n: 3, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - {stop: s}
    default:
    - {event: m_4}
    continue_on_error: true
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0}
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}'}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.idx }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  conditions:
  - and:
    - {condition: time, after: '22:00'}
  - condition: state
    entity_id: sensor.s2
    state: [unavailable, '4']
  actions:
  - sequence:
    - {stop: s}
  - {event: m_7}
  - sequence:
    - {condition: numeric_state, entity_id: sensor.s1, below: 15}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 9
  set: [light.l2, 'off']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 14
  set: [sensor.s1, '20']
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s2, '20']
- at: 20
  set: [sensor.s2, '4']
  attributes: {lvl: 1}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [input_boolean.b1, 'off']
- at: 25
  set: [sensor.s1, '1']
- at: 27
  send: {type: service_result, call_id: 1, ok: true}
- at: 28
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 30
  send: {type: event, event_type: tick}
- at: 31
  set: [sensor.s2, '20']

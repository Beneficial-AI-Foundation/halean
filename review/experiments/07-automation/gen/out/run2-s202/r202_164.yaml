# random scenario, seed 202, index 164 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: time_pattern, seconds: 23, id: beta}
  - {trigger: event, event_type: e3, id: alpha}
  - trigger: state
    entity_id: input_boolean.b1
    from: ['on', 'off']
    for: 00:00:02
  actions:
  - wait_template: '{{ is_state(''light.l1'', ''on'') }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - repeat:
      count: 1
      sequence:
      - variables: {v1: x}
      - {wait_template: '{{ trigger.id == ''0'' }}'}
      - event: m_1
        event_data: {n: 1, completed: '{{ wait.completed }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
  - event: m_3
    event_data: {n: 3, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [sensor.s2, '7.5']
- at: 2
  set: [input_boolean.b1, unavailable]
- at: 2
  set: [sensor.s2, unknown]
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s2, '8']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 9
  set: [sensor.s2, '7.5']
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 12
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 14
  send: {type: event, event_type: e2}
- at: 15
  send: {type: event, event_type: e1}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [input_boolean.b1, 'on']
- at: 19
  set: [light.l1, 'on']
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 25
  send: {type: event, event_type: tick}

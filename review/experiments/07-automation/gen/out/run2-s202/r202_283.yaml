# random scenario, seed 202, index 283 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: time_pattern, seconds: /7}
  - {trigger: state, entity_id: light.l1, not_from: 2, to: 3, attribute: lvl, id: alpha}
  - {trigger: event, event_type: e2}
  actions:
  - choose:
    - conditions:
      - not:
        - condition: state
          entity_id: light.gone
          state: [unavailable, 'on']
        - condition: not
          conditions:
          - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
          - {condition: time, before: '22:13:30'}
      sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
        timeout: 3
      - event: m_1
        event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - choose:
    - conditions:
      - condition: time
        after: '22:13:25'
        before: 06:00
        weekday: [wed, mon]
      sequence:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: '00:00:03', continue_on_timeout: false}
- alias: a1
  id: id1
  mode: queued
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
  actions:
  - wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', for: '{{ 2 }}'}
    - {trigger: event, event_type: e2}
    timeout: 3
    continue_on_timeout: false
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - choose:
    - conditions:
      - {condition: time, after: '22:13:25', before: '22:14'}
      sequence:
      - wait_for_trigger:
        - trigger: numeric_state
          entity_id: sensor.s1
          below: 10
          for: {seconds: '{{ 1 + 1 }}'}
        timeout: {seconds: 2}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a2
  id: id2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: event, event_type: e3}
  - trigger: event
    event_type: e3
    event_data: {k: true}
  conditions:
  - {condition: time, after: '22:00'}
  - not:
    - {condition: trigger, id: '1'}
    - not:
      - {condition: trigger, id: alpha}
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
  actions:
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 2}
  - action: test.s6
    data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
  - action: test.s7
    data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - variables: {v2: 1}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
steps:
- at: 0
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 0
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 5
  set: [light.l2, 'on']
- at: 6
  set: [sensor.s1, '20']
- at: 7
  set: [sensor.s2, '8']
- at: 8
  set: [light.l1, 'off']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s2, '1']
- at: 14
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: e2}
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 19
  set: [light.l1, 'off']
- at: 19
  set: [light.l2, unavailable]

# random scenario, seed 202, index 55 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: '8', for: 2, id: alpha}
  conditions:
  - condition: state
    entity_id: [light.l1]
    state: 'on'
    match: any
  actions:
  - parallel:
    - sequence:
      - {stop: s}
    - {event: m_1}
    enabled: false
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15, enabled: false}
    then:
    - action: test.s2
      data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - {delay: 2, enabled: false}
    - {stop: s}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 2
  set: [light.l2, 'on']
- at: 5
  set: [sensor.s2, '7.5']
- at: 6
  set: [sensor.s2, unavailable]
- at: 7
  set: [sensor.s1, abc]
- at: 9
  send: {type: event, event_type: e3}
- at: 11
  set: [light.l1, unavailable]
- at: 14
  send: {type: event, event_type: e2}
- at: 15
  set: [sensor.s1, '7.5']
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 21
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 103 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: event, event_type: e3}
  conditions:
  - condition: not
    conditions:
    - {condition: trigger, id: alpha}
  - condition: trigger
    id: [beta, '0']
  actions:
  - choose:
    - conditions:
      - condition: not
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
        - condition: or
          conditions:
          - '{{ trigger.platform == ''event'' }}'
          - {condition: trigger, id: alpha}
          - {condition: trigger, id: '0'}
      sequence:
      - if:
        - condition: or
          conditions:
          - or:
            - {condition: time, after: '22:00', before: '22:14'}
          - and:
            - {condition: trigger, id: '1'}
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
        then:
        - if:
          - and:
            - condition: not
              conditions:
              - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
              - condition: trigger
                id: [beta, '0']
              - {condition: time, after: '22:13:25', before: '22:14'}
          - condition: and
            conditions:
            - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
            - condition: state
              entity_id: sensor.s1
              state: ['7.5', '4']
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          then:
          - {delay: '{{ 1 }}'}
          - delay: {seconds: 1}
          - {condition: state, entity_id: sensor.s1, state: '7.5'}
        - {stop: s}
      - {action: test.s1, continue_on_error: true}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    enabled: false
  - delay: {seconds: '{{ 2 }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - {condition: time, after: '23:00:00'}
        - condition: and
          conditions:
          - {condition: state, entity_id: light.gone, state: unavailable}
          - {condition: numeric_state, entity_id: sensor.s2, above: 3}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        enabled: false
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      sequence:
      - repeat:
          count: 0
          sequence:
          - action: test.s2
            data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            continue_on_error: true
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
    default:
    - action: test.s3
      data: {n: 3, v: '{{ trigger.platform }}'}
      continue_on_error: true
    - action: test.s4
      data: {n: 4, v: '{{ trigger.id }}'}
      enabled: false
    - action: test.s5
      data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      continue_on_error: true
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '{{ 2 }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: light.l2, from: 3, attribute: lvl, for: 1}
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
    timeout: 3
  - variables: {v1: 1}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  send: {type: event, event_type: e2}
- at: 3
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, '12']
  attributes: {lvl: 2}
- at: 7
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: e1}
- at: 12
  set: [sensor.s1, unknown]
- at: 14
  set: [input_boolean.b1, unavailable]
- at: 15
  send: {type: event, event_type: e3}
- at: 17
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}

# random scenario, seed 202, index 229 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - action: test.s1
    target:
      entity_id: [light.l1, light.l2]
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.idx }}'}
  - {event: m_3}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  conditions:
  - {condition: state, entity_id: sensor.s2, state: '12'}
  actions:
  - parallel:
    - sequence:
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
        enabled: false
      - action: test.s6
        data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - choose:
        - conditions:
          - condition: and
            conditions:
            - {condition: trigger, id: '0'}
            - {condition: time, after: '23:00:00', before: '22:13:30'}
            - '{{ states(''sensor.s1'') | int > 5 }}'
          sequence:
          - parallel:
            - sequence:
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
              - action: test.s7
                data: {n: 7, v: '{{ trigger.description }}'}
              - {condition: time, before: '22:13:30'}
            - sequence:
              - {action: test.s8}
            - event: m_9
              event_data: {n: 9, v: '{{ trigger.idx }}'}
        default:
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          timeout: {seconds: 2}
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
    - event: m_11
      event_data: {n: 11, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
    - event: m_12
      event_data: {n: 12, v: '{{ trigger.description }}'}
  - {stop: s}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [input_boolean.b1, 'off']
- at: 4
  send: {type: event, event_type: e3}
- at: 5
  send: {type: event, event_type: e3}
- at: 7
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 8
  set: [sensor.s1, abc]
- at: 8
  set: [light.l2, 'off']
- at: 9
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 10
  set: [light.l2, 'on']
- at: 11
  set: [sensor.s2, '20']
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 19
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 20
  send: {type: event, event_type: tick}
- at: 23
  set: [sensor.s2, unavailable]
- at: 24
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 24
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 184 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - {condition: state, entity_id: light.l2, state: 'on'}
        - '{{ repeat.index >= 3 }}'
      sequence:
      - parallel:
        - sequence:
          - parallel:
            - {event: m_1}
            - sequence:
              - event: m_2
                event_data: {n: 2, v: '{{ trigger.idx }}'}
            - event: m_3
              event_data: {n: 3, v: '{{ this.attributes.current }}'}
          - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: '00:00:03', continue_on_timeout: false}
        - sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ trigger.idx }}'}
          - choose:
            - conditions:
              - condition: or
                conditions:
                - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
                - {condition: numeric_state, entity_id: sensor.s1, below: 15}
              - and:
                - {condition: trigger, id: '0'}
                - and:
                  - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
                  - '{{ states(''sensor.s1'') | int(0) > 7 }}'
              sequence:
              - {event: m_5}
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - wait_for_trigger:
    - trigger: event
      event_type: e2
      event_data: {k: 1}
    timeout: 1
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_to: unknown, for: '{{ 2 }}'}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, id: beta}
  actions:
  - delay: {seconds: 1}
  - condition: not
    conditions:
    - not:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - {condition: time, after: '22:13:25', before: '22:13:30', weekday: tue}
    - {condition: time, after: '23:00:00', before: '06:00', enabled: false}
    - condition: or
      conditions:
      - {condition: state, entity_id: light.l2, state: 'on', enabled: false}
      - condition: trigger
        id: [beta, '0']
    enabled: false
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  set: [light.l1, unavailable]
- at: 3
  set: [light.l2, 'off']
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 3
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s2, '20']
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  set: [input_boolean.b1, unavailable]
- at: 10
  send: {type: event, event_type: e3}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  send: {type: event, event_type: e3}
- at: 19
  send: {type: event, event_type: e1}
- at: 22
  set: [light.l1, 'on']
- at: 23
  set: [light.l1, unavailable]
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 27
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e1}
- at: 28
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 31
  set: [sensor.s2, '7.5']
- at: 32
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 33
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 35
  send: {type: event, event_type: e2}
- at: 35
  send: {type: event, event_type: tick}

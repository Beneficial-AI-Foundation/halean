# random scenario, seed 202, index 56 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l2}
  conditions:
  - and:
    - condition: state
      entity_id: input_boolean.b1
      state: 'on'
      for: {seconds: 1}
    - {condition: state, entity_id: sensor.s2, state: '7.5'}
    enabled: false
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - trigger: state
      entity_id: sensor.s2
      to: '12'
      for: {seconds: 2}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {event: m_1}
  - {condition: state, entity_id: light.l2, state: 'off'}
  - event: m_2
    event_data: {n: 2, v: '{{ now().second }}'}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '12'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s2, '7.5']
- at: 3
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 6
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 8
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 11
  set: [light.l2, 'on']
- at: 12
  set: [light.l2, unavailable]
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 16
  set: [sensor.s1, '4']
- at: 17
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: e3}
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 20
  set: [sensor.s2, unknown]
  attributes: {lvl: 2}

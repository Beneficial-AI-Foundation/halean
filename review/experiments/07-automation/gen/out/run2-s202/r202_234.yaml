# random scenario, seed 202, index 234 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - trigger: state
    entity_id: [light.l2]
    from: [unavailable, 'on']
    for: 00:00:02
  actions:
  - choose:
    - conditions:
      - and:
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
        enabled: false
      sequence:
      - sequence:
        - {stop: s}
    - conditions:
      - condition: and
        conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
      - not:
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - {condition: trigger, id: '0'}
        - condition: or
          conditions:
          - {condition: time, after: '22:00'}
          - condition: trigger
            id: [beta, '0']
            enabled: false
      sequence:
      - {stop: s}
      - repeat:
          count: 3
          sequence:
          - repeat:
              for_each: '{{ states(''light.l1'') }}'
              sequence:
              - variables: {v1: x}
              - action: test.s1
                data: {n: 1, v: '{{ trigger.platform }}'}
                continue_on_error: true
          - event: m_2
            event_data: {n: 2, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
          - variables: {v3: 1}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    continue_on_error: true
  - {delay: 0}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, for: 2}
    enabled: false
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_3
    event_data: {n: 3, v: '{{ trigger.description }}'}
  - action: test.s4
    target:
      entity_id: [light.l1, light.l2]
- alias: a1
  id: id1
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - trigger: state
    entity_id: light.l1
    not_from: ['off', unavailable]
  - {trigger: event, event_type: e2}
  conditions:
  - {condition: time, before: '22:14', enabled: false}
  actions:
  - action: test.s6
    data: {n: 6, v: '{{ trigger.id }}'}
    continue_on_error: true
    response_variable: v2
  - condition: or
    conditions:
    - condition: or
      conditions:
      - {condition: time, after: '22:00'}
  - event: m_7
    event_data: {n: 7, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
  - {delay: 2}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 3
  set: [light.l2, 'on']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 5
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: e3}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 13
  set: [light.l1, unavailable]
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  set: [light.l2, 'off']
- at: 14
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 17
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  set: [sensor.s1, abc]
- at: 19
  set: [sensor.s2, abc]

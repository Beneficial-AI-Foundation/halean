    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 30
  send: {type: event, event_type: tick}
- at: 33
  set: [input_boolean.b1, 'on']
- at: 36
  send: {type: event, event_type: tick}
- at: 39
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 40
  set: [sensor.s1, '1']
- at: 41

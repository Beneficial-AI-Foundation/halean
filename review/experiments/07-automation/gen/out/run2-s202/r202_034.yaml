# random scenario, seed 202, index 34 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: time_pattern, seconds: '26', id: alpha}
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - repeat:
      for_each:
      - {k: 1}
      - null
      sequence:
      - sequence:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - {stop: s}
      - event: m_1
        event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
        - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', for: 3}
        timeout: 1
    continue_on_error: true
  - repeat:
      while:
      - condition: or
        conditions:
        - and:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - parallel:
        - event: m_2
          event_data: {n: 2, v: '{{ trigger.platform }}'}
        - {event: m_3}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: event, event_type: e1}
  actions:
  - {action: test.s5}
  - repeat:
      while:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
          - {condition: time, after: '23:00:00', before: '22:13:30'}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
        - not:
          - '{{ states(''sensor.s1'') | int > 5 }}'
          - {condition: state, entity_id: light.l2, state: unavailable}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - {stop: s}
      - {delay: '{{ 1 }}'}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '4']
- at: 7
  send: {type: event, event_type: e2}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 13
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 13
  set: [sensor.s2, '20']
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  set: [sensor.s2, unavailable]
- at: 20
  send: {type: service_result, call_id: 0, ok: true}
- at: 21
  set: [sensor.s1, abc]
- at: 21
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 24
  set: [light.l2, unavailable]
- at: 27
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 28

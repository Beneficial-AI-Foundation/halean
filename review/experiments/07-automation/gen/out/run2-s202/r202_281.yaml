# random scenario, seed 202, index 281 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: time, at: '22:13:29', id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  conditions:
  - {condition: state, entity_id: sensor.s2, state: '8'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.idx }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s2, below: sensor.s2}
    - trigger: state
      entity_id: [input_boolean.b1, sensor.s1]
      from: 'on'
      not_to: unavailable
      for: 2
    timeout: 2
    continue_on_timeout: false
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - if:
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      - '{{ trigger.platform == ''event'' }}'
    then:
    - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: '00:00:03'}
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}'}
    - wait_for_trigger:
      - {trigger: event, event_type: e3}
      - {trigger: event, event_type: e2}
      timeout: 0
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - {delay: 0}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - {event: m_4}
      - if: ['{{ trigger.platform == ''event'' }}']
        then:
        - {action: test.s5, continue_on_error: true, response_variable: v2}
        - wait_for_trigger:
          - {trigger: event, event_type: e3}
        else:
        - {delay: 2}
        - {delay: 1}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  set: [sensor.s1, '20']
- at: 3
  set: [light.l2, 'on']
- at: 6
  send: {type: event, event_type: e1}
- at: 8
  set: [input_boolean.b1, 'off']
- at: 10
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e2}
- at: 12
  send: {type: event, event_type: e2}
- at: 12
  set: [sensor.s1, '4']
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 17
  set: [sensor.s2, unavailable]
  attributes: {lvl: 3}
- at: 18
  set: [light.l1, 'off']
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s1, unknown]
- at: 20
  send: {type: event, event_type: tick}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  set: [input_boolean.b1, 'off']
- at: 25
  send: {type: event, event_type: e2}
- at: 26
  set: [sensor.s2, '12']

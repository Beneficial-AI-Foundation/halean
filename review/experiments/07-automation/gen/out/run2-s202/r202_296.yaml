# random scenario, seed 202, index 296 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: '4'}
  - {trigger: time_pattern, seconds: /7}
  - {trigger: state, entity_id: sensor.s1, to: abc, id: alpha}
  conditions:
  - and:
    - {condition: state, entity_id: sensor.s1, state: '7.5'}
    - condition: or
      conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: 2}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - {action: test.s1}
- alias: a1
  id: id1
  mode: queued
  max: 2
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - trigger: state
    entity_id: [sensor.s2, sensor.s1]
    to: [unknown, unavailable]
    from: [abc, unavailable]
    for: 2
  - trigger: event
    event_type: e3
    event_data: {k: 1}
    id: alpha
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - {wait_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  - {condition: numeric_state, entity_id: sensor.s1, below: 15, enabled: false}
  - {event: m_3}
  - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  - if:
    - condition: and
      conditions:
      - condition: and
        conditions:
        - '{{ states(''sensor.s2'') | float(0) < 5 }}'
        - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
        enabled: false
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      enabled: false
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    then:
    - variables: {v1: 1}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 3
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s2, unknown]
- at: 10
  set: [sensor.s2, abc]
- at: 11
  set: [sensor.s1, '1']
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 12
  set: [sensor.s2, '7.5']
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s1, '8']
- at: 16
  set: [light.l1, unavailable]
- at: 16
  set: [input_boolean.b1, unavailable]
- at: 19
  set: [input_boolean.b1, 'on']
- at: 20
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 23
  send: {type: event, event_type: e2}
- at: 25
  send: {type: event, event_type: e2}
- at: 26
  set: [sensor.s2, '12']
- at: 27
  set: [light.l1, 'off']

# random scenario, seed 202, index 53 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:26', id: alpha}
  conditions:
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - {condition: state, entity_id: sensor.s2, state: '20'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    continue_on_error: true
    enabled: false
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
    - and:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    then:
    - if: ['{{ trigger.platform == ''event'' }}']
      then:
      - parallel:
        - sequence:
          - {delay: 0}
          - {event: m_2}
        - event: m_3
          event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
      else:
      - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '{{ 2 }}'}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
      - {event: m_4}
    else:
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
- alias: a1
  id: id1
  mode: queued
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - if:
    - or:
      - or:
        - {condition: time, before: '22:13:30'}
      - '{{ states(''sensor.s2'') | float(0) < 9 }}'
    then:
    - {stop: s}
    - repeat:
        while:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
        - '{{ repeat.index <= 1 }}'
        sequence:
        - {event: m_7}
    else:
    - {event: m_8}
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      timeout: 1
      continue_on_timeout: false
    - event: m_9
      event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.s2
      from: ['1', '7.5']
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: parallel
  triggers:
  - {trigger: event, event_type: e2}
  actions:
  - {action: test.s11}
  - {action: test.s12}
  - repeat:
      while:
      - {condition: trigger, id: alpha}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        timeout: {seconds: 2}
  - {condition: numeric_state, entity_id: sensor.s1, below: 9}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 4
  set: [input_boolean.b1, 'on']
- at: 5
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 7
  set: [sensor.s1, '8']
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, unavailable]
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  set: [input_boolean.b1, unavailable]
- at: 10
  set: [light.l2, 'off']
- at: 11
  set: [sensor.s1, '1']

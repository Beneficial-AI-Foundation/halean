# random scenario, seed 202, index 183 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: 0}
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, light.l2]
    to: ['on', unavailable]
    from: unavailable
  - trigger: state
    entity_id: sensor.s2
    not_from: '7.5'
    to: '1'
    for: {seconds: 2}
  actions:
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      sequence:
      - delay: {seconds: 1}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ this.attributes.current }}'}
        target:
          entity_id: [light.l1, light.l2]
    default:
    - wait_for_trigger:
      - trigger: state
        entity_id: [sensor.s1, sensor.s2]
        not_to: 3
        from: 2
        attribute: lvl
      timeout: 3
    - event: m_4
      event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - if:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - {condition: trigger, id: '0'}
      then:
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
        timeout: 2
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
        timeout: 3
        continue_on_timeout: false
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0}
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}'}
  - event: m_5
    event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
- alias: a1
  id: id1
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s1
    above: 3
    below: sensor.s2
    for: {seconds: 2}
    id: beta
  - trigger: state
    entity_id: light.l1
    for: {seconds: 2}
  - {trigger: event, event_type: e1}
  conditions:
  - condition: and
    conditions:
    - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
    enabled: false
  - {condition: trigger, id: '1'}
  actions:
  - sequence:
    - sequence:
      - {stop: s}
      - {stop: s, error: true}
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - {delay: 0}
    enabled: false
  - if:
    - and:
      - condition: time
        before: 06:00
        weekday: [wed, mon]
      - condition: not
        conditions:
        - {condition: numeric_state, entity_id: sensor.s1, below: 9}
        - '{{ is_state(''light.l2'', ''off'') }}'
    - '{{ states(''sensor.s1'') | int(0) > 3 }}'
    then:
    - parallel:
      - sequence:
        - choose:
          - conditions:
            - and:
              - {condition: trigger, id: '1'}
              - condition: not
                conditions:
                - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
                - {condition: time, before: '06:00'}
            sequence:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
            - event: m_7
              event_data: {n: 7, v: '{{ this.attributes.current }}'}
          default:
          - {delay: 2}
        - choose:
          - conditions:
            - or:
              - {condition: numeric_state, entity_id: sensor.s1, above: 6}
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            sequence:
            - {action: test.s8, continue_on_error: true}
          - conditions:
            - condition: trigger
              id: [beta, '0']
            sequence:
            - action: test.s9
              data: {n: 9, v: '{{ trigger.platform }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              continue_on_error: true
            - {delay: '{{ 1 }}'}
        - event: m_10
          event_data: {n: 10, v: '{{ trigger.idx }}'}
      - sequence:
        - {event: m_11}
    - variables:
        v1: [a, '{{ 1 + 1 }}']
    - wait_for_trigger:
      - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
    - event: m_12
      event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, unknown]
- at: 6
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 7
  set: [light.l2, unavailable]
- at: 8
  set: [light.l1, unavailable]
- at: 9
  set: [sensor.s2, '12']
  attributes: {lvl: 2}
- at: 10
  set: [sensor.s1, unavailable]
- at: 11
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 14
  set: [sensor.s1, '8']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, unavailable]
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  set: [input_boolean.b1, unavailable]
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 20
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 22
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 25
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 26
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 27
  set: [sensor.s2, '7.5']
  attributes: {lvl: 1}
- at: 27
  send: {type: event, event_type: e1}
- at: 27
  set: [light.l1, 'on']
  attributes: {lvl: 3}

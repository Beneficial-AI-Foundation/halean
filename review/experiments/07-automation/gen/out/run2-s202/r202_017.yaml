# random scenario, seed 202, index 17 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: 0}
  triggers:
  - {trigger: time, at: '22:13:29', id: beta}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, for: 3, id: alpha}
  conditions:
  - condition: and
    conditions:
    - or:
      - {condition: time, after: '23:00:00', before: '22:13:30'}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  - if: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
    then:
    - if:
      - not:
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        - {condition: state, entity_id: input_boolean.b1, state: 'on'}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        enabled: false
      then:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 0}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
    enabled: false
  - action: test.s3
    data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, for: 2}
  conditions:
  - condition: not
    conditions:
    - or:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
      - {condition: state, entity_id: sensor.s1, state: '1'}
  actions:
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0}
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
      sequence:
      - action: test.s4
        target: {entity_id: light.l1}
        continue_on_error: true
    default:
    - if:
      - condition: and
        conditions:
        - {condition: trigger, id: '1'}
        - {condition: state, entity_id: light.gone, state: unavailable}
        - condition: state
          entity_id: light.l1
          state: [unavailable, 'on']
      then:
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.description }}'}
      - action: test.s6
        data: {n: 6, v: '{{ trigger.platform }}'}
        target: {entity_id: light.l1}
        continue_on_error: true
    - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 0}
  - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - variables:
      v2: [a, '{{ 1 + 1 }}']
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l2, 'on']
- at: 6
  set: [light.l2, unavailable]
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 10
  set: [sensor.s2, unavailable]
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, '4']
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 17
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, 'on']
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  send: {type: event, event_type: e1}
- at: 26
  send: {type: event, event_type: tick}
- at: 27
  set: [sensor.s1, '8']
  attributes: {lvl: 2}
- at: 28
  send: {type: event, event_type: e1}
- at: 29
  set: [sensor.s2, '8']
- at: 30
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 33
  set: [light.l2, 'on']
  attributes: {lvl: 1}

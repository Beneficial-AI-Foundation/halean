# random scenario, seed 202, index 207 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s1
    above: 6
    below: 15
    for: {seconds: 2}
  conditions:
  - condition: and
    conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
  - condition: time
    after: '23:00:00'
    before: '22:13:30'
    weekday: [wed, mon]
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.id }}'}
  - {delay: '00:00:02'}
- alias: a1
  id: id1
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {trigger: time_pattern, seconds: /7}
  actions:
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '{{ 2 }}'}
  - action: test.s2
    data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target:
      entity_id: [light.l1, light.l2]
  - parallel:
    - event: m_3
      event_data: {n: 3, v: '{{ trigger.description }}'}
    - sequence:
      - {event: m_4}
- alias: a2
  id: id2
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, to: unavailable}
  - {trigger: state, entity_id: sensor.s1}
  - {trigger: state, entity_id: input_boolean.b1, attribute: lvl, for: 3, id: beta}
  conditions:
  - condition: not
    conditions:
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - condition: trigger
        id: [beta, '0']
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
  - or:
    - condition: or
      conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15, enabled: false}
      - {condition: state, entity_id: sensor.s2, state: abc, enabled: false}
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - repeat:
      until: ['{{ repeat.index >= 3 }}']
      sequence:
      - action: test.s5
        data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        continue_on_error: true
      - event: m_6
        event_data: {n: 6, v: '{{ states(''light.l1'') }}'}
      - wait_for_trigger:
        - trigger: state
          entity_id: sensor.s2
          from: [unknown, '12']
        timeout: 3
        continue_on_timeout: false
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: 1}
  - sequence:
    - choose:
      - conditions:
        - condition: not
          conditions:
          - condition: not
            conditions:
            - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          - '{{ is_state(''light.l1'', ''on'') }}'
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        sequence:
        - wait_for_trigger:
          - trigger: state
            entity_id: [input_boolean.b1, sensor.s1]
            from: unavailable
          timeout: 1
          continue_on_timeout: false
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - action: test.s8
          data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          continue_on_error: true
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.idx }}'}
      default:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      - action: test.s11
        target: {entity_id: light.l1}
        response_variable: v2
    - {event: m_12}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l1, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 6
  set: [sensor.s2, '8']
- at: 8
  set: [sensor.s2, unavailable]
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: e1}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 1}

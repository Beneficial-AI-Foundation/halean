# random scenario, seed 202, index 222 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', id: alpha}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ this.attributes.current }}'}
  - repeat:
      for_each: [a, b]
      sequence:
      - if:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        then:
        - if:
          - not:
            - condition: or
              conditions:
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
              - {condition: trigger, id: '0'}
              - '{{ trigger.platform == ''event'' }}'
          - and:
            - '{{ is_state(''light.l1'', ''on'') }}'
            - {condition: state, entity_id: input_boolean.b1, state: 'on'}
            enabled: false
          then:
          - action: test.s2
            data: {n: 2, v: '{{ now().second }}'}
          else:
          - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
          - event: m_3
            event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          - event: m_4
            event_data: {n: 4, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
      - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: time_pattern, seconds: '26'}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2, value_template: '{{ state.state | float(0) * 2 }}'}
  - {trigger: event, event_type: e1, id: alpha}
  actions:
  - sequence:
    - if:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      then:
      - if:
        - condition: and
          conditions:
          - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
          - and:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            - '{{ trigger.id == ''0'' }}'
        then:
        - {event: m_5}
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', enabled: false}
        else:
        - {action: test.s6}
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - action: test.s7
          data: {n: 7, v: '{{ trigger.id }}'}
          target: {entity_id: light.l1}
      - {condition: state, entity_id: sensor.s2, state: '12'}
      - action: test.s8
        data: {n: 8, v: '{{ now().second }}'}
      else:
      - action: test.s9
        data: {n: 9, v: '{{ states(''light.l1'') }}'}
        target:
          entity_id: [light.l1, light.l2]
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      continue_on_error: true
    - parallel:
      - event: m_10
        event_data: {n: 10, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
      - event: m_11
        event_data: {n: 11, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
      - sequence:
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
          timeout: 0
        - event: m_12
          event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - {stop: s}
  - action: test.s13
    data: {n: 13, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target:
      entity_id: [light.l1, light.l2]
    continue_on_error: true
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: parallel
  max: 2
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: event, event_type: e2}
  - {trigger: event, event_type: e1}
  actions:
  - {condition: time, after: '22:00', before: '22:13:30'}
  - action: test.s14
    data: {n: 14, v: '{{ states(''light.l1'') }}'}
    continue_on_error: true
    enabled: false
  - {stop: s}
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e2}
- at: 2
  set: [sensor.s1, unavailable]
- at: 2
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 3
  set: [sensor.s2, unknown]
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  set: [sensor.s2, '8']
- at: 6
  set: [sensor.s2, abc]
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  send: {type: service_result, call_id: 0, ok: true}
- at: 11
  send: {type: event, event_type: e1}
- at: 12
  set: [input_boolean.b1, 'off']
- at: 12
  set: [light.l2, unavailable]
  attributes: {lvl: 2}

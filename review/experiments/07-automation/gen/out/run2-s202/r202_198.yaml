# random scenario, seed 202, index 198 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: time_pattern, seconds: /9}
  - {trigger: event, event_type: e3}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: '{{ 2 }}'}
  - if:
    - {condition: trigger, id: '0'}
    then:
    - {delay: 0}
    - variables: {v1: x}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - {stop: s}
  variables: {v1: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.b1
      to: [unavailable, 'on']
    timeout: 1
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - parallel:
      - sequence:
        - repeat:
            count: 1
            sequence:
            - {condition: state, entity_id: sensor.s2, state: unavailable, for: 2}
        - if:
          - condition: or
            conditions:
            - condition: or
              conditions:
              - condition: time
                before: '22:13:30'
                weekday: [tue]
              - condition: state
                entity_id: sensor.s2
                state: [abc, '4']
                enabled: false
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
            - '{{ states(''sensor.s1'') | int > 5 }}'
          then:
          - event: m_3
            event_data: {n: 3, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
          - action: test.s4
            target:
              entity_id: [light.l1, light.l2]
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            sequence:
            - action: test.s5
              data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
          default:
          - variables: {v2: x}
          - action: test.s6
            data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - sequence:
        - parallel:
          - {event: m_7}
          - event: m_8
            event_data: {n: 8, v: '{{ states(''light.l1'') }}'}
      continue_on_error: true
    - {event: m_9}
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 1}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  set: [sensor.s2, '7.5']
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  set: [input_boolean.b1, unavailable]
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 15
  set: [light.l2, unavailable]
- at: 16
  set: [light.l1, 'off']
- at: 17
  set: [light.l1, unavailable]
- at: 17
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 17
  set: [light.l1, 'off']
- at: 18
  set: [sensor.s1, '12']
- at: 21
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 22
  set: [sensor.s1, '8']
- at: 23
  set: [sensor.s1, '1']
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 24
  send: {type: event, event_type: e1}
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  send: {type: service_result, call_id: 0, ok: true}
- at: 29
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 30
  send: {type: service_result, call_id: 1, ok: true}

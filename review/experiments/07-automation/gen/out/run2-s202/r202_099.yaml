# random scenario, seed 202, index 99 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  - {trigger: event, event_type: e3, id: alpha}
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      - {condition: time, after: '23:00:00', before: '22:13:30'}
      - {condition: time, after: '22:13:25', before: '22:13:30'}
    - or:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  - condition: or
    conditions:
    - '{{ is_state(''light.l1'', ''on'') }}'
    - condition: state
      entity_id: input_boolean.b1
      state: [unavailable, 'off']
  actions:
  - if:
    - {condition: state, entity_id: sensor.s2, state: unavailable, for: 2}
    then:
    - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2, continue_on_timeout: false}
    - event: m_1
      event_data: {n: 1, completed: '{{ wait.completed }}'}
    - sequence:
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
    else:
    - {delay: 0}
  - repeat:
      while:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - variables: {v1: 1}
      - choose:
        - conditions:
          - not:
            - {condition: time, after: '22:13:25'}
            - {condition: state, entity_id: sensor.s2, state: abc}
            - condition: or
              conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - condition: state
            entity_id: light.l2
            state: [unavailable, 'on']
            for: 2
          sequence:
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
            timeout: 0
          - event: m_2
            event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {stop: s, error: true}
  - action: test.s3
    data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    continue_on_error: true
  - event: m_4
    event_data: {n: 4, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [light.l2, unavailable]
- at: 1
  set: [light.l1, 'on']
- at: 2
  set: [sensor.s1, '4']
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 6
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 12
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 14
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e1}
- at: 17
  set: [light.l1, 'off']
- at: 18
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 19
  set: [input_boolean.b1, 'on']
- at: 21
  set: [sensor.s2, abc]
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 25
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 26
  set: [sensor.s2, abc]
  attributes: {lvl: 2}
- at: 29
  send: {type: event, event_type: e3}
- at: 30
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 33
  set: [input_boolean.b1, 'off']
- at: 36
  send: {type: event, event_type: e1}
- at: 39
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 40
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 41
  set: [sensor.s1, unknown]
  attributes: {lvl: 2}

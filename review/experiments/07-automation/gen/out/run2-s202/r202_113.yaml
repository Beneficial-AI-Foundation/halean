# random scenario, seed 202, index 113 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, for: '00:00:02', id: beta}
  conditions:
  - and:
    - {condition: trigger, id: '1'}
    - condition: not
      conditions:
      - {condition: state, entity_id: sensor.s1, state: abc}
  actions:
  - {stop: s}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: '00:00:03'}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '12'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 6
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 9
  set: [light.l1, 'on']
- at: 10
  send: {type: event, event_type: tick}
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 15
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 15
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  set: [sensor.s1, '1']
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 23
  set: [light.l1, unavailable]
- at: 23
  set: [light.l1, 'off']
  attributes: {lvl: 3}

# random scenario, seed 202, index 220 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: '26'}
  - trigger: state
    entity_id: [sensor.s2, sensor.s1]
    to: ['12', '20']
    id: beta
  - {trigger: state, entity_id: sensor.s1, to: '8', from: '1'}
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - {condition: time, after: '23:00:00'}
      - {condition: trigger, id: '1'}
    - {condition: trigger, id: alpha}
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
  - sequence:
    - {stop: s}
    continue_on_error: true
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [sensor.s1, '8']
- at: 2
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 3
  set: [input_boolean.b1, 'off']
- at: 6
  set: [light.l2, unavailable]
- at: 9
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  set: [sensor.s1, '7.5']
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [sensor.s1, '20']
- at: 22
  set: [light.l1, 'on']

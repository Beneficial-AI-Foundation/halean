# random scenario, seed 202, index 43 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
  actions:
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: '{{ 2 }}', continue_on_timeout: false}
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.platform }}'}
  - {action: test.s2}
  - sequence:
    - sequence:
      - repeat:
          while:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          - '{{ repeat.index <= 1 }}'
          sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - parallel:
        - sequence:
          - event: m_3
            event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
          - {event: m_4}
          - event: m_5
            event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - sequence:
          - action: test.s6
            data: {n: 6, v: '{{ trigger.platform }}'}
            continue_on_error: true
            response_variable: v1
          - delay: {seconds: 1}
        - sequence:
          - {delay: 2}
        continue_on_error: true
    continue_on_error: true
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  variables: {v1: 0}
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: event, event_type: e2, id: beta}
  actions:
  - action: test.s8
    data: {n: 8, v: '{{ trigger.description }}'}
  - repeat:
      for_each: []
      sequence:
      - {stop: s}
    enabled: false
  - action: test.s9
    data: {n: 9, v: '{{ states(''sensor.s1'') }}'}
    target:
      entity_id: [light.l1, light.l2]
    continue_on_error: true
  - repeat:
      count: 0
      sequence:
      - action: test.s10
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        continue_on_error: true
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
        - {trigger: event, event_type: e1}
        timeout: 1
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: abc
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'off']
- at: 5
  set: [sensor.s1, unavailable]
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 8
  set: [sensor.s2, unknown]
- at: 9
  set: [light.l2, 'on']
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 13
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 14
  send: {type: event, event_type: e2}
- at: 14
  send: {type: service_result, call_id: 0, ok: true}
- at: 15
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 16
  set: [sensor.s2, '4']
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  set: [light.l1, unavailable]
- at: 19
  set: [light.l1, 'off']
- at: 19
  set: [input_boolean.b1, 'off']
- at: 20
  set: [light.l1, 'on']
- at: 21
  set: [light.l1, 'on']
  attributes: {lvl: 3}

# random scenario, seed 202, index 274 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: time_pattern, seconds: /3, id: beta}
  actions:
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - sequence:
      - sequence:
        - repeat:
            while:
            - not:
              - condition: state
                entity_id: light.gone
                state: ['off', 'on']
                for: 2
              - condition: not
                conditions:
                - condition: state
                  entity_id: light.l1
                  state: [unavailable, 'on']
                - {condition: trigger, id: '0'}
                - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
            - '{{ repeat.index <= 1 }}'
            sequence:
            - action: test.s2
              data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - repeat:
            while:
            - {condition: state, entity_id: sensor.s2, state: '12'}
            - '{{ repeat.index <= 3 }}'
            sequence:
            - condition: trigger
              id: [beta, '0']
            - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
              enabled: false
      - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  - condition: or
    conditions:
    - and:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6}
      - '{{ trigger.platform == ''event'' }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  - event: m_3
    event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - {event: m_4}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e3}
- at: 8
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: e1}
- at: 12
  set: [light.l1, unavailable]
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  set: [sensor.s1, '1']
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 20
  set: [light.l2, 'off']
- at: 22
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 2}
- at: 24
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 26
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 29
  send: {type: event, event_type: tick}
- at: 32
  send: {type: event, event_type: tick}
- at: 33
  set: [input_boolean.b1, unavailable]
- at: 36
  set: [sensor.s2, '12']
  attributes: {lvl: 1}
- at: 37
  set: [sensor.s1, '1']
- at: 40

# random scenario, seed 202, index 286 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  - {trigger: event, event_type: e2}
  - {trigger: time_pattern, seconds: 23, id: beta}
  actions:
  - sequence:
    - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - {stop: s, error: true}
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0, continue_on_timeout: false}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - {delay: '00:00:02'}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - variables: {v1: x}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.platform }}', var: '{{ v2 | default(''undef'') }}'}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l2, unavailable]
- at: 4
  set: [sensor.s1, '12']
- at: 5
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e2}
- at: 7
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 7
  send: {type: event, event_type: e3}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 11
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 12
  set: [light.l1, 'on']
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s1, unavailable]
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 22
  set: [sensor.s2, '20']
- at: 22
  set: [light.l2, 'off']

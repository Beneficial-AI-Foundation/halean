# random scenario, seed 202, index 65 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, id: beta}
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - event: m_13
    event_data: {n: 13, completed: '{{ wait.completed }}'}
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id: [beta, '0']
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
    then:
    - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1}
    else:
    - action: test.s1
      data: {n: 1, v: '{{ trigger.idx }}'}
    - action: test.s2
      data: {n: 2, v: '{{ states(''light.l1'') }}'}
  - event: m_3
    event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.b1
        state: [unavailable, 'off']
      - {condition: time, before: '22:13:30'}
      sequence:
      - parallel:
        - sequence:
          - parallel:
            - event: m_4
              event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
            - sequence:
              - {event: m_5}
              - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
            - {event: m_6}
          - action: test.s7
            data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            continue_on_error: true
          - if:
            - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
            then:
            - {event: m_8}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.description }}'}
      - parallel:
        - sequence:
          - event: m_10
            event_data: {n: 10, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - sequence:
            - {delay: '{{ 1 }}'}
            - action: test.s11
              data: {n: 11, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
              continue_on_error: true
        - {event: m_12}
        continue_on_error: true
    default:
    - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
    - choose:
      - conditions:
        - or:
          - {condition: time, after: '22:00', weekday: tue}
        sequence:
        - sequence:
          - variables: {v3: x}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - trigger: state
    entity_id: [light.l2]
  - trigger: state
    entity_id: [sensor.s2, sensor.s1]
    from: 3
    to: 3
    attribute: lvl
  conditions:
  - condition: not
    conditions:
    - {condition: trigger, id: '0'}
  - and:
    - condition: not
      conditions:
      - {condition: state, entity_id: sensor.s1, state: '20'}
      - {condition: time, after: '23:00:00'}
    - condition: not
      conditions:
      - condition: state
        entity_id: [sensor.s2, input_boolean.b1]
        state: 'on'
        match: any
      - condition: state
        entity_id: light.gone
        state: ['off', unavailable]
        for: {seconds: 1}
  actions:
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {event: m_14}
  - parallel:
    - {event: m_15}
    - sequence:
      - sequence:
        - action: test.s16
          data: {n: 16, v: '{{ states(''light.l1'') }}'}
      - event: m_17
        event_data: {n: 17, v: '{{ now().second }}'}
    - event: m_18
      event_data: {n: 18, v: '{{ states(''light.l1'') }}'}
states:
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e3}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 8
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: e2}
- at: 13
  set: [input_boolean.b1, 'off']
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [sensor.s1, '20']
- at: 17
  set: [light.l2, unavailable]
- at: 19
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 20
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 21
  set: [sensor.s2, '1']
- at: 24
  set: [input_boolean.b1, 'on']
- at: 25
  set: [input_boolean.b1, unavailable]
- at: 26
  set: [input_boolean.b1, 'off']
- at: 29
  send: {type: event, event_type: tick}
- at: 32
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 33
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 35
  set: [light.l1, unavailable]
- at: 35
  send: {type: event, event_type: e3}

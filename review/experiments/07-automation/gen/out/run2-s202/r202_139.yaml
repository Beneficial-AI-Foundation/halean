      event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - event: m_9
      event_data: {n: 9, v: '{{ this.attributes.current }}'}
  - {event: m_10, enabled: false}
  variables: {v1: 0}

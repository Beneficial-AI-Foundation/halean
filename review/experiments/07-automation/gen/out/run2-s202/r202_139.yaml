    response_variable: v1
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
  - action: test.s3
    data: {n: 3, v: '{{ trigger.id }}'}
  - choose:
    - conditions:
      - not:
        - {condition: time, after: '22:00', before: '22:13:30'}
      sequence:
      - sequence:
        - {stop: s, error: true}
        - sequence:
          - {event: m_4}
      - event: m_5
        event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - '{{ is_state(''light.l2'', ''off'') }}'
      sequence:
      - parallel:
        - sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
          - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '00:00:03', continue_on_timeout: false}
        - {event: m_7}
    default:

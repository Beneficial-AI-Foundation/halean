automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: state, entity_id: input_boolean.b1, to: 'on'}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, value_template: '{{ state.state | float(0) * 2 }}', for: 1}

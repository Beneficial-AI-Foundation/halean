# random scenario, seed 202, index 141 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: abc, for: '{{ 2 }}'}
  conditions:
  - condition: or
    conditions:
    - or:
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  actions:
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - sequence:
    - {event: m_1}
    - {delay: '00:00:02'}
    - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: '{{ 2 }}'}
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}'}
  - parallel:
    - sequence:
      - parallel:
        - sequence:
          - {event: m_3}
          - delay: {seconds: '{{ 2 }}'}
        - sequence:
          - wait_for_trigger:
            - trigger: state
              entity_id: light.l1
              not_to: ['off', unavailable]
            - {trigger: event, event_type: e1}
            timeout: 3
            continue_on_timeout: false
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {event: m_5}
      - repeat:
          while: ['{{ is_state(''light.l2'', ''off'') }}', '{{ repeat.index <= 1 }}']
          sequence:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - action: test.s6
            data: {n: 6, v: '{{ states(''light.l1'') }}'}
            continue_on_error: true
          - choose:
            - conditions:
              - condition: state
                entity_id: light.l1
                state: 'on'
                for: {seconds: 1}
              - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
              sequence:
              - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            - conditions:
              - {condition: time, after: '22:00', before: '06:00'}
              sequence:
              - event: m_7
                event_data: {n: 7, v: '{{ trigger.idx }}'}
              - {delay: 2}
            default:
            - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
            - {condition: trigger, id: alpha}
      - action: test.s8
        target:
          entity_id: [light.l1, light.l2]
        response_variable: v2
    - event: m_9
      event_data: {n: 9, v: '{{ now().second }}', var: '{{ v2 | default(''undef'') }}'}
  - sequence:
    - if:
      - condition: time
        after: '22:13:25'
        before: '22:13:30'
        weekday: [wed, mon]
      - {condition: time, after: '22:00'}
      then:
      - action: test.s10
        data: {n: 10, v: '{{ trigger.description }}'}
      - {event: m_11}
    - if:
      - {condition: trigger, id: '1'}
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      then:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        timeout: 2
        continue_on_timeout: false
      else:
      - action: test.s12
        data: {n: 12, v: '{{ trigger.id }}'}
        enabled: false
      continue_on_error: true
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2, continue_on_timeout: false}
  - event: m_13
    event_data: {n: 13, completed: '{{ wait.completed }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, unavailable]
- at: 5
  set: [sensor.s1, '4']
- at: 5
  set: [light.l2, 'on']
- at: 5
  send: {type: event, event_type: e2}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 6
  set: [input_boolean.b1, 'off']
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 11
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 12
  set: [sensor.s1, unknown]
  attributes: {lvl: 2}
- at: 13
  send: {type: event, event_type: tick}

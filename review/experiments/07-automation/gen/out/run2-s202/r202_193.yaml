# random scenario, seed 202, index 193 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    to: '4'
    for: 1
  conditions:
  - or:
    - {condition: state, entity_id: light.l1, state: 'off'}
    - {condition: time, before: '06:00'}
  actions:
  - sequence:
    - repeat:
        for_each: [a, b]
        sequence:
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
    - if:
      - {condition: time, before: '22:14'}
      then:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - {delay: 0}
      else:
      - choose:
        - conditions:
          - condition: and
            conditions:
            - condition: state
              entity_id: light.l1
              state: ['on', unavailable]
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ this.attributes.current }}'}
            target: {entity_id: light.l1}
          - {action: test.s2}
          - condition: not
            conditions: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', '{{ states(''sensor.s1'') | int > 5 }}']
            enabled: false
        default:
        - event: m_3
          event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        continue_on_error: true
    continue_on_error: true
    enabled: false
  - {delay: 2}
  - wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - action: test.s4
    data: {n: 4, v: '{{ trigger.idx }}'}
    target:
      entity_id: [light.l1, light.l2]
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, '12']
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 5
  set: [input_boolean.b1, unavailable]
- at: 8
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: e1}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 16
  send: {type: event, event_type: e3}
- at: 17
  set: [light.l1, unavailable]
- at: 18
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 22
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 23
  set: [light.l2, 'on']
- at: 24
  send: {type: event, event_type: tick}
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 27
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 27
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 27
  set: [input_boolean.b1, 'off']
- at: 28
  send: {type: event, event_type: e3}
- at: 28
  send: {type: event, event_type: tick}

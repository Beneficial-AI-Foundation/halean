# random scenario, seed 202, index 230 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: sensor.s1
    not_from: ['7.5', '4']
  conditions:
  - condition: trigger
    id: [beta, '0']
  - condition: and
    conditions:
    - {condition: trigger, id: alpha}
    - not:
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: 1, continue_on_timeout: false}
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}'}
  - {event: m_1}
  - if:
    - and:
      - condition: or
        conditions:
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - {condition: trigger, id: alpha}
      - and:
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - condition: state
          entity_id: light.l2
          state: ['on', 'off']
      - {condition: time, after: '22:00', before: '22:14'}
    then:
    - {condition: trigger, id: '0'}
    - condition: state
      entity_id: light.l2
      state: ['on', 'off']
    - {event: m_2}
    else:
    - event: m_3
      event_data: {n: 3, v: '{{ trigger.idx }}'}
  - action: test.s4
    data: {n: 4, v: '{{ now().second }}'}
    target: {entity_id: light.l1}
  - variables: {v1: 1}
  variables: {v1: 0}
- alias: a1
  id: id1
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s1
    above: 3
    below: 10
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - {delay: 2}
      - action: test.s6
        data: {n: 6, v: '{{ now().second }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - action: test.s7
    data: {n: 7, v: '{{ this.attributes.current }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: [sensor.s1, input_boolean.b1]
    timeout: 0
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '8'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 1
  set: [sensor.s2, '12']
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [input_boolean.b1, 'off']
- at: 7
  set: [sensor.s1, '7.5']
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  send: {type: event, event_type: e1}
- at: 10
  set: [input_boolean.b1, unavailable]
- at: 13
  send: {type: event, event_type: e3}
- at: 15
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 16
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: e2}
- at: 21
  send: {type: service_result, call_id: 1, ok: true}

# random scenario, seed 202, index 135 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10, value_template: '{{ state.state | float(0) * 2 }}'}
  - {trigger: time_pattern, seconds: /3}
  conditions:
  - condition: and
    conditions:
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      - '{{ states(''sensor.s1'') | int > 5 }}'
    - condition: trigger
      id: [beta, '0']
  actions:
  - {stop: s}
  - repeat:
      while:
      - or:
        - {condition: trigger, id: '0'}
        - {condition: trigger, id: alpha}
      - '{{ repeat.index <= 1 }}'
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - {stop: s, error: true}
      - if:
        - or:
          - {condition: time, after: '22:13:25'}
          - {condition: time, before: '22:13:30', weekday: tue}
        then:
        - {stop: s}
        else:
        - parallel:
          - sequence:
            - action: test.s1
              data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              target: {entity_id: light.l1}
              continue_on_error: true
            - {action: test.s2, response_variable: v2}
            - action: test.s3
              data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.description }}'}
          - event: m_5
            event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v2 | default(''undef'') }}'}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: [sensor.s1, sensor.s2]
          not_from: '20'
        timeout: 2
      - event: m_6
        event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
      - {wait_template: '{{ trigger.id == ''0'' }}'}
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}'}
    continue_on_error: true
  - {event: m_8}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - trigger: state
    entity_id: [sensor.s1, input_boolean.b1]
    to: abc
    not_from: '4'
    id: beta
  actions:
  - {stop: s}
  - repeat:
      count: 1
      sequence:
      - sequence:
        - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 0, continue_on_timeout: false}
        - event: m_9
          event_data: {n: 9, completed: '{{ wait.completed }}'}
        - condition: and
          conditions:
          - {condition: trigger, id: '1'}
          - '{{ is_state(''light.l1'', ''on'') }}'
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - {action: test.s10, response_variable: v1}
  - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 2
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 3
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 3
  send: {type: event, event_type: e3}
- at: 5
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 5
  send: {type: event, event_type: e3}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 11
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 12
  set: [light.l2, 'on']
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 15
  set: [sensor.s2, unknown]
- at: 16
  set: [sensor.s1, '4']
- at: 17
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: e2}
- at: 20
  set: [light.l2, 'off']
  attributes: {lvl: 3}

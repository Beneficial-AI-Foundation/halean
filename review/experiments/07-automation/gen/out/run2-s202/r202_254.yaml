# random scenario, seed 202, index 254 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', for: 2}
  actions:
  - if:
    - {condition: trigger, id: alpha}
    then:
    - action: test.s1
      data: {n: 1, v: '{{ trigger.idx }}'}
      continue_on_error: true
  - if:
    - condition: not
      conditions:
      - {condition: time, after: '22:13:25'}
    then:
    - sequence:
      - action: test.s2
        data: {n: 2, v: '{{ trigger.idx }}'}
        target: {entity_id: light.l1}
    - if:
      - {condition: trigger, id: alpha}
      then:
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 0}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
      else:
      - action: test.s4
        data: {n: 4, v: '{{ trigger.id }}'}
      - variables: {v1: 1}
      continue_on_error: true
    continue_on_error: true
  - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - condition: or
    conditions:
    - {condition: trigger, id: '0'}
    - condition: state
      entity_id: sensor.s1
      state: ['1', unknown]
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, for: 1}
    timeout: 3
    continue_on_timeout: false
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: time_pattern, seconds: 31}
  actions:
  - if:
    - or:
      - and: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
    - condition: and
      conditions:
      - condition: or
        conditions:
        - {condition: time, after: '22:00', before: '06:00'}
        - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
      - and:
        - {condition: state, entity_id: light.l1, state: 'off'}
        - condition: state
          entity_id: sensor.s2
          state: ['1', '8']
          for: {seconds: 1}
        enabled: false
    then:
    - sequence:
      - sequence:
        - {condition: trigger, id: '1'}
        enabled: false
      - {stop: s}
      continue_on_error: true
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - {event: m_6}
  - wait_template: '{{ trigger.id == ''0'' }}'
    timeout: {seconds: 2}
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  set: [sensor.s1, unavailable]
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l2, unavailable]
- at: 2
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 3
  set: [light.l1, 'off']
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 12
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 13
  send: {type: event, event_type: e1}
- at: 13
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 14
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 123 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ this.attributes.current }}'}
  - if:
    - condition: trigger
      id: [beta, '0']
    then:
    - parallel:
      - sequence:
        - if:
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          then:
          - event: m_2
            event_data: {n: 2, v: '{{ this.attributes.current }}'}
          else:
          - event: m_3
            event_data: {n: 3, v: '{{ trigger.description }}'}
          - delay: {seconds: '{{ 2 }}'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          continue_on_error: true
      - event: m_4
        event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - sequence:
        - repeat:
            count: 1
            sequence:
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
            - action: test.s5
              target:
                entity_id: [light.l1, light.l2]
            - {event: m_6}
        - event: m_7
          event_data: {n: 7, v: '{{ this.attributes.current }}'}
        - event: m_8
          event_data: {n: 8, v: '{{ trigger.description }}'}
    - if:
      - '{{ states(''sensor.s1'') | int(0) > 3 }}'
      - condition: not
        conditions:
        - {condition: time, after: '22:00', before: '22:14'}
        - {condition: time, after: '22:00'}
        - '{{ states(''sensor.s2'') | float(0) < 5 }}'
        enabled: false
      then:
      - repeat:
          while:
          - or:
            - not:
              - {condition: trigger, id: '1'}
              - {condition: time, before: '22:14'}
            - condition: not
              conditions:
              - condition: trigger
                id: [beta, '0']
              - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - '{{ repeat.index <= 2 }}'
          sequence:
          - event: m_9
            event_data: {n: 9, v: '{{ states(''light.l1'') }}'}
      - {event: m_10}
      - parallel:
        - sequence:
          - action: test.s11
            target: {entity_id: light.l1}
        - sequence:
          - event: m_12
            event_data: {n: 12, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            enabled: false
        - sequence:
          - {action: test.s13}
        enabled: false
      else:
      - {delay: '{{ 1 }}'}
      - parallel:
        - sequence:
          - action: test.s14
            data: {n: 14, v: '{{ now().second }}'}
          - action: test.s15
            data: {n: 15, v: '{{ trigger.description }}'}
        - {event: m_16}
      enabled: false
    - {event: m_17}
    continue_on_error: true
  - {event: m_18}
  - sequence:
    - delay: {seconds: '{{ 2 }}'}
  - sequence:
    - event: m_19
      event_data: {n: 19, v: '{{ trigger.id }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [input_boolean.b1, unavailable]
- at: 2
  set: [light.l1, unavailable]
- at: 2
  set: [input_boolean.b1, 'off']
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 5
  set: [light.l1, 'on']
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s1, '7.5']
- at: 11
  set: [sensor.s2, '7.5']
- at: 12
  set: [sensor.s1, unavailable]
  attributes: {lvl: 2}
- at: 13
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s2, '7.5']
- at: 15
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 17
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 21
  send: {type: event, event_type: e2}
- at: 21
  set: [light.l1, unavailable]
- at: 23
  set: [input_boolean.b1, unavailable]
- at: 26
  set: [sensor.s2, abc]
- at: 26
  set: [sensor.s1, '8']
- at: 28
  set: [sensor.s2, '8']
- at: 30
  send: {type: event, event_type: tick}
- at: 30
  set: [sensor.s2, '12']
- at: 31
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 31
  set: [sensor.s1, unknown]

# random scenario, seed 202, index 217 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:33'}
  conditions:
  - condition: or
    conditions:
    - not:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      - {condition: time, before: '22:13:30'}
    - not:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - '{{ trigger.platform == ''event'' }}'
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - repeat:
        count: 3
        sequence:
        - sequence:
          - action: test.s2
            data: {n: 2, v: '{{ states(''light.l1'') }}'}
          - action: test.s3
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            response_variable: v1
          continue_on_error: true
        - {condition: numeric_state, entity_id: sensor.s1, below: 9, enabled: false}
    - sequence:
      - repeat:
          for_each: []
          sequence:
          - action: test.s4
            data: {n: 4, v: '{{ this.attributes.current }}'}
          - action: test.s5
            data: {n: 5, v: '{{ trigger.id }}'}
        continue_on_error: true
      - sequence:
        - action: test.s6
          data: {n: 6, v: '{{ trigger.id }}'}
    - choose:
      - conditions:
        - {condition: state, entity_id: light.l2, state: 'on'}
        sequence:
        - parallel:
          - {event: m_7}
          - sequence:
            - event: m_8
              event_data: {n: 8, v: '{{ trigger.platform }}'}
            - {delay: '00:00:02'}
            - {delay: 2}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.idx }}'}
      - conditions:
        - condition: and
          conditions:
          - condition: and
            conditions:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        sequence:
        - choose:
          - conditions:
            - condition: not
              conditions:
              - condition: not
                conditions:
                - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
                - {condition: time, before: '06:00'}
              - and: ['{{ is_state(''light.l1'', ''on'') }}']
                enabled: false
            - not:
              - {condition: trigger, id: '0'}
              - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            sequence:
            - condition: and
              conditions:
              - condition: not
                conditions:
                - {condition: time, after: '22:00', enabled: false}
                - {condition: numeric_state, entity_id: sensor.s2, below: 9}
              - or:
                - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
                - {condition: numeric_state, entity_id: sensor.s2, below: 9}
                - '{{ trigger.platform == ''event'' }}'
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      default:
      - repeat:
          for_each: [a, b]
          sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
          - action: test.s11
            data: {n: 11, v: '{{ states(''light.l1'') }}'}
      - action: test.s12
        data: {n: 12, v: '{{ trigger.idx }}'}
        response_variable: v3
      - if:
        - condition: state
          entity_id: input_boolean.b1
          state: ['off', 'on']
        - condition: state
          entity_id: light.l1
          state: ['on', unavailable]
        then:
        - event: m_13
          event_data: {n: 13, v: '{{ this.attributes.current }}', var: '{{ v2 | default(''undef'') }}'}
        - variables: {v1: x}
        else:
        - variables: {v2: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, from: 3, to: 2, attribute: lvl}
  actions:
  - {stop: s}
  - action: test.s14
    data: {n: 14, v: '{{ this.attributes.current }}'}
  - {event: m_15}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - action: test.s16
        data: {n: 16, v: '{{ now().second }}'}
  - choose:
    - conditions:
      - {condition: time, before: '22:14', weekday: tue}
      - and:
        - {condition: time, before: '22:13:30'}
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      sequence:
      - delay: {seconds: 1}
    default:
    - event: m_17
      event_data: {n: 17, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - action: test.s18
      data: {n: 18, v: '{{ trigger.idx }}'}
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      timeout: 3
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: event, event_type: e3}
  - {trigger: event, event_type: e1}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
steps:
- at: 3
  set: [input_boolean.b1, 'on']
- at: 5
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [input_boolean.b1, 'off']
- at: 10
  set: [input_boolean.b1, 'on']
- at: 12
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 13
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 16
  set: [sensor.s2, '4']
- at: 19
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 22
  set: [sensor.s1, unavailable]
- at: 23
  set: [input_boolean.b1, 'off']
- at: 24
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 24
  set: [input_boolean.b1, unavailable]
- at: 25
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 26
  set: [sensor.s1, abc]
- at: 27
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 28
  set: [light.l2, unavailable]
- at: 29
  send: {type: event, event_type: e2}
- at: 30
  send: {type: event, event_type: e1}

# random scenario, seed 202, index 298 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - trigger: state
    entity_id: sensor.s2
    from: ['7.5', '8']
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  actions:
  - {delay: 1}
  - {action: test.s1}
  - {delay: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, to: 'off'}
  - {trigger: time_pattern, seconds: 31, id: alpha}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - variables: {v1: x}
  - if:
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    then:
    - {delay: 2}
  - {action: test.s2, enabled: false}
  - sequence:
    - action: test.s3
      data: {n: 3, v: '{{ trigger.description }}'}
    - action: test.s4
      data: {n: 4, v: '{{ trigger.idx }}'}
      enabled: false
  - if:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', enabled: false}
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    then:
    - {stop: s}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 2
  send: {type: event, event_type: e2}
- at: 2
  set: [sensor.s2, unavailable]
- at: 4
  send: {type: event, event_type: e3}
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s2, '20']
- at: 10
  set: [sensor.s2, '12']
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 15
  send: {type: service_result, call_id: 0, ok: true}

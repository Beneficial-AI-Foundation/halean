# random scenario, seed 202, index 299 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s2, attribute: lvl, for: 1}
  - {trigger: event, event_type: e1}
  - {trigger: time_pattern, seconds: /9, id: alpha}
  actions:
  - repeat:
      for_each: []
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - repeat:
          count: 0
          sequence:
          - delay: {seconds: 1}
          - choose:
            - conditions:
              - condition: and
                conditions:
                - not:
                  - condition: trigger
                    id: [beta, '0']
                  - '{{ trigger.platform == ''event'' }}'
                - condition: and
                  conditions:
                  - {condition: state, entity_id: light.l1, state: 'on'}
                  - {condition: numeric_state, entity_id: sensor.s1, above: 3}
                - {condition: time, after: '22:13:25', before: '06:00'}
                enabled: false
              sequence:
              - event: m_1
                event_data: {n: 1, v: '{{ trigger.id }}', var: '{{ v2 | default(''undef'') }}'}
              - {condition: time, before: '22:13:30'}
            - conditions:
              - {condition: time, after: '22:00'}
              sequence:
              - {delay: 1}
          - {event: m_2}
      - if: ['{{ states(''sensor.s2'') | float(0) < 15 }}']
        then:
        - event: m_3
          event_data: {n: 3, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - delay: {seconds: '{{ 2 }}'}
          - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
  - {event: m_4, enabled: false}
  - {stop: s}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 5
  set: [light.l2, unavailable]
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  set: [light.l1, unavailable]
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l2, 'on']
- at: 14
  set: [light.l2, 'off']
- at: 15
  set: [sensor.s1, '4']
- at: 15
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 17
  set: [sensor.s2, '12']
- at: 17
  set: [light.l2, 'on']
- at: 18
  set: [input_boolean.b1, 'off']

# random scenario, seed 202, index 82 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0}
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: unknown
    to: ['20', unknown]
  actions:
  - delay: {seconds: 1}
    enabled: false
  - sequence:
    - if:
      - {condition: time, before: '22:14', weekday: tue}
      then:
      - action: test.s1
        data: {n: 1, v: '{{ trigger.id }}'}
        response_variable: v2
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      else:
      - parallel:
        - sequence:
          - variables: {v2: x}
          - action: test.s2
            data: {n: 2, v: '{{ states(''light.l1'') }}'}
            target: {entity_id: light.l1}
        - sequence:
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
          - {event: m_3}
        - sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - sequence:
      - sequence:
        - event: m_4
          event_data: {n: 4, v: '{{ trigger.platform }}', var: '{{ v2 | default(''undef'') }}'}
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
  - parallel:
    - sequence:
      - repeat:
          for_each: '{{ [''x'', 1] }}'
          sequence:
          - {event: m_5}
          - event: m_6
            event_data: {n: 6, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
          - if:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
            then:
            - event: m_7
              event_data: {n: 7, v: '{{ trigger.description }}', var: '{{ v4 | default(''undef'') }}'}
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            else:
            - {event: m_8}
            - {event: m_9}
    - sequence:
      - choose:
        - conditions:
          - {condition: trigger, id: '1'}
          - condition: not
            conditions:
            - {condition: numeric_state, entity_id: sensor.s2, above: 6}
          sequence:
          - choose:
            - conditions: ['{{ is_state(''light.l1'', ''on'') }}']
              sequence:
              - event: m_10
                event_data: {n: 10, v: '{{ states(''light.l1'') }}', var: '{{ v2 | default(''undef'') }}'}
              - variables:
                  v2: [a, '{{ 1 + 1 }}']
            - conditions:
              - condition: state
                entity_id: sensor.s2
                state: ['1', '4']
              sequence:
              - {action: test.s11}
              - delay: {seconds: '{{ 2 }}'}
              - {action: test.s12}
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      - choose:
        - conditions:
          - condition: state
            entity_id: light.l1
            state: [unavailable, 'on']
          sequence:
          - if:
            - condition: state
              entity_id: light.l2
              state: ['on', 'off']
            then:
            - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
            - variables:
                v4: [a, '{{ 1 + 1 }}']
        enabled: false
  - {event: m_13}
  - repeat:
      while:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - if:
        - {condition: time, after: '23:00:00', before: '22:13:30'}
        - and:
          - condition: trigger
            id: [beta, '0']
        then:
        - event: m_14
          event_data: {n: 14, v: '{{ trigger.id }}'}
        - sequence:
          - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
        - {event: m_15}
        else:
        - {delay: '00:00:02'}
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - choose:
          - conditions: ['{{ trigger.platform == ''event'' }}']
            sequence:
            - {delay: '00:00:02'}
            - {condition: time, after: '22:13:25'}
            - {action: test.s16, continue_on_error: true}
      - event: m_17
        event_data: {n: 17, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v5 | default(''undef'') }}'}
      - sequence:
        - sequence:
          - condition: not
            conditions:
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
states:
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, unavailable]
- at: 5
  send: {type: event, event_type: e3}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 10
  send: {type: event, event_type: e3}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 13
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 16
  set: [light.l1, 'on']

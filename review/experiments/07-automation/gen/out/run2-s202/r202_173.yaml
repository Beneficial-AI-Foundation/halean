# random scenario, seed 202, index 173 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
  triggers:
  - {trigger: time_pattern, seconds: 23, id: alpha}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}'}
  - {event: m_1}
  - {event: m_2}
  - parallel:
    - sequence:
      - repeat:
          while:
          - and:
            - {condition: time, before: '22:13:30'}
          - '{{ repeat.index <= 2 }}'
          sequence:
          - repeat:
              count: 3
              sequence:
              - action: test.s3
                data: {n: 3, v: '{{ trigger.platform }}'}
              - action: test.s4
                target: {entity_id: light.l1}
                response_variable: v2
          - action: test.s5
            data: {n: 5, v: '{{ states(''light.l1'') }}'}
          - {condition: trigger, id: '1', enabled: false}
      - repeat:
          count: 1
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 2 }}']
              sequence:
              - variables: {v2: 1}
          - variables: {v4: '{{ states(''sensor.s1'') }}'}
          - choose:
            - conditions:
              - condition: state
                entity_id: input_boolean.b1
                state: ['off', unavailable]
              - {condition: trigger, id: '1'}
              sequence:
              - action: test.s6
                data: {n: 6, v: '{{ trigger.idx }}'}
            - conditions:
              - '{{ states(''sensor.s2'') | float(0) < 15 }}'
              - or:
                - and:
                  - {condition: time, after: '23:00:00', before: '06:00'}
                  - {condition: numeric_state, entity_id: sensor.s1, below: 15}
              sequence:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
            default:
            - {action: test.s7, response_variable: v5}
    - {event: m_8}
    - sequence:
      - variables: {v3: '{{ states(''sensor.s1'') }}'}
      - {event: m_9}
      - choose:
        - conditions: ['{{ trigger.id == ''0'' }}']
          sequence:
          - action: test.s10
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - action: test.s11
            target: {entity_id: light.l1}
    enabled: false
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s2, '1']
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 7
  set: [sensor.s2, '7.5']
- at: 8
  set: [light.l2, 'off']
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 9
  set: [input_boolean.b1, 'on']
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e2}
- at: 13
  send: {type: event, event_type: e3}
- at: 14
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 17
  send: {type: event, event_type: e1}
- at: 18
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 19
  set: [sensor.s2, '8']
- at: 19
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 23
  set: [light.l2, unavailable]
- at: 23
  set: [sensor.s2, abc]
  attributes: {lvl: 2}
- at: 23
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 26
  set: [sensor.s2, '8']
- at: 28
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 29
  send:
    type: event
    event_type: e3
    data: {k: true}

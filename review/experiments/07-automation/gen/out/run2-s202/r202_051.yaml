# random scenario, seed 202, index 51 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: time, at: '22:13:26'}
  actions:
  - {event: m_1}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - action: test.s2
    data: {n: 2, v: '{{ states(''light.l1'') }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s2, not_from: '20'}
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: sensor.s1
      state: [abc, '1']
    - {condition: state, entity_id: sensor.s2, state: '7.5'}
  actions:
  - choose:
    - conditions:
      - {condition: trigger, id: '1'}
      - condition: not
        conditions:
        - condition: or
          conditions:
          - {condition: time, after: '23:00:00', before: '06:00'}
          - {condition: trigger, id: '0'}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
        - {condition: state, entity_id: sensor.s1, state: '20'}
      sequence:
      - {stop: s}
    - conditions:
      - or:
        - {condition: state, entity_id: sensor.s1, state: '8'}
        - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
      - or:
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - '{{ states(''sensor.s2'') | float(0) < 15 }}'
        - {condition: trigger, id: '1'}
      sequence:
      - parallel:
        - sequence:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
            target:
              entity_id: [light.l1, light.l2]
            continue_on_error: true
          - delay: {seconds: 1}
        - sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ now().second }}'}
          - choose:
            - conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
              sequence:
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
              - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
            default:
            - event: m_5
              event_data: {n: 5, v: '{{ now().second }}'}
    default:
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
    - variables: {v2: 1}
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
      timeout: 3
      continue_on_timeout: false
    - event: m_7
      event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {action: test.s8}
  - {condition: trigger, id: alpha}
  - action: test.s9
    data: {n: 9, v: '{{ trigger.idx }}'}
    continue_on_error: true
    response_variable: v3
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 3
  set: [light.l2, 'on']
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send: {type: event, event_type: e1}
- at: 5
  set: [light.l1, 'on']
- at: 6
  set: [input_boolean.b1, 'off']
- at: 9
  send: {type: event, event_type: tick}
- at: 9
  send: {type: service_result, call_id: 0, ok: true}
- at: 10
  set: [sensor.s1, unknown]
  attributes: {lvl: 3}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 14
  set: [sensor.s1, '4']
- at: 16
  set: [light.l2, 'off']
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  set: [input_boolean.b1, unavailable]
- at: 21
  set: [sensor.s2, '4']
  attributes: {lvl: 3}

# random scenario, seed 202, index 75 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, to: 1, attribute: lvl}
  actions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 9}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - and:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15, enabled: false}
          - condition: state
            entity_id: sensor.s1
            state: ['12', '8']
      sequence:
      - action: test.s1
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    - conditions:
      - or:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        - condition: or
          conditions:
          - condition: trigger
            id: [beta, '0']
          - {condition: state, entity_id: light.l1, state: 'on', for: '00:00:03'}
        - {condition: trigger, id: '0'}
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
    default:
    - if:
      - and:
        - condition: trigger
          id: [beta, '0']
        - condition: not
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
          - {condition: numeric_state, entity_id: sensor.s2, above: 3}
      then:
      - parallel:
        - {event: m_2}
        - event: m_3
          event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  - {stop: s}
  - repeat:
      while:
      - {condition: trigger, id: alpha, enabled: false}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - event: m_4
        event_data: {n: 4, v: '{{ this.attributes.current }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '4']
- at: 12
  set: [sensor.s2, '12']
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 15
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 16
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: e2}
- at: 22
  send: {type: event, event_type: e2}
- at: 24
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: tick}
- at: 28
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 29
  set: [input_boolean.b1, 'off']
- at: 30
  set: [sensor.s2, '20']
- at: 31
  set: [input_boolean.b1, unavailable]
- at: 32
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 35
  send: {type: event, event_type: tick}
- at: 36
  set: [light.l2, 'off']
- at: 36
  set: [light.l2, unavailable]

# random scenario, seed 202, index 0 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - action: test.s1
    data: {n: 1, v: '{{ states(''light.l1'') }}'}
    target: {entity_id: light.l1}
  - if:
    - {condition: time, after: '22:13:25'}
    then:
    - {delay: 0}
  - repeat:
      for_each: [a, b]
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - delay: {seconds: 1}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '4'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  set: [sensor.s1, '1']
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  send: {type: event, event_type: e1}
- at: 5
  set: [sensor.s1, '12']
- at: 6
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 8
  set: [input_boolean.b1, 'on']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e3}
- at: 14
  send: {type: service_result, call_id: 0, ok: true}
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 16
  set: [sensor.s2, abc]
- at: 17
  set: [light.l1, unavailable]
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 17
  set: [light.l2, 'on']
- at: 18
  set: [light.l1, 'on']

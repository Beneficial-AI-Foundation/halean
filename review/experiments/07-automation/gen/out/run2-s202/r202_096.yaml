# random scenario, seed 202, index 96 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: event, event_type: e1, id: beta}
  - {trigger: time_pattern, seconds: /3}
  - trigger: template
    value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  actions:
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}'}
  - {delay: 1}
  - sequence:
    - choose:
      - conditions:
        - {condition: trigger, id: alpha}
        sequence:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        - wait_for_trigger:
          - {trigger: event, event_type: e3}
          - {trigger: numeric_state, entity_id: sensor.s1, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
          timeout: 2
        - event: m_1
          event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      default:
      - repeat:
          count: 3
          sequence:
          - action: test.s2
            data: {n: 2, v: '{{ trigger.platform }}'}
            target: {entity_id: light.l1}
    - action: test.s3
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    - sequence:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - {action: test.s4}
  - {condition: time, after: '23:00:00', before: '22:14'}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [sensor.s2, '8']
- at: 3
  set: [light.l1, 'off']
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 7
  set: [input_boolean.b1, 'on']
- at: 7
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 8
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  set: [sensor.s2, unknown]
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 11
  send: {type: event, event_type: tick}
- at: 11
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 12
  set: [light.l1, 'off']
- at: 13
  set: [sensor.s2, abc]
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 20
  set: [sensor.s2, '1']
- at: 21
  send: {type: event, event_type: tick}
- at: 23
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 24
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e3}
- at: 28
  set: [light.l1, unavailable]
  attributes: {lvl: 3}

# random scenario, seed 202, index 127 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: time_pattern, seconds: /7}
  conditions:
  - not:
    - and:
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      - {condition: trigger, id: '0'}
    - {condition: trigger, id: '0'}
  - not:
    - {condition: trigger, id: '0', enabled: false}
  actions:
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
    - {condition: time, before: '06:00'}
    then:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - if:
      - {condition: state, entity_id: sensor.s1, state: '12'}
      then:
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.id }}'}
      - {event: m_3}
      - {event: m_4}
  - {action: test.s5, continue_on_error: true}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10, value_template: '{{ state.state | float(0) * 2 }}'}
  - {trigger: event, event_type: e3, id: alpha}
  - trigger: state
    entity_id: light.l2
    to: [unavailable, 'off']
    from: unavailable
    id: alpha
  actions:
  - {stop: s}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s6
    data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    continue_on_error: true
states:
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 2
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, '12']
- at: 5
  set: [input_boolean.b1, 'off']
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s2, unknown]
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '4']
- at: 9
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 9
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 15
  set: [sensor.s2, abc]
  attributes: {lvl: 1}
- at: 18
  send: {type: event, event_type: e2}
- at: 19
  send:
    type: event
    event_type: e2
    data: {k: 1}

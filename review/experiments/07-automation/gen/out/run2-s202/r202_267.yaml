# random scenario, seed 202, index 267 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:29'}
  actions:
  - repeat:
      for_each: [a, b]
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.id }}'}
      - event: m_2
        event_data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - action: test.s3
        data: {n: 3, v: '{{ trigger.platform }}'}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - variables: {v1: x}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  actions:
  - choose:
    - conditions:
      - or:
        - '{{ states(''sensor.s1'') | int(0) > 7 }}'
        - {condition: time, after: '22:13:25', before: '06:00', weekday: tue}
      sequence:
      - {wait_template: '{{ trigger.id == ''0'' }}'}
  - if: ['{{ states(''sensor.s2'') | float(0) < 15 }}']
    then:
    - parallel:
      - event: m_4
        event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - sequence:
        - parallel:
          - sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ this.attributes.current }}'}
            - {delay: '{{ 1 }}'}
            - {delay: '00:00:02'}
          - event: m_6
            event_data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          - sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ trigger.idx }}'}
            - {event: m_8}
    - parallel:
      - sequence:
        - {stop: s}
        - wait_for_trigger:
          - trigger: state
            entity_id: [light.l1, light.l2]
            to: 'off'
            for: {seconds: 2}
          - {trigger: state, entity_id: light.l1, not_from: 'on'}
      - sequence:
        - action: test.s9
          data: {n: 9, v: '{{ trigger.idx }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      enabled: false
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [light.l2, 'off']
- at: 2
  send: {type: event, event_type: tick}
- at: 2
  set: [input_boolean.b1, unavailable]
- at: 5
  set: [input_boolean.b1, 'on']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, unavailable]
- at: 9
  set: [sensor.s2, unknown]
- at: 10
  set: [sensor.s1, '20']
- at: 11
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 14
  send: {type: event, event_type: e3}
- at: 14
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [input_boolean.b1, unavailable]
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: e1}
- at: 21
  set: [sensor.s1, unavailable]
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  send: {type: event, event_type: e1}
- at: 26
  send: {type: event, event_type: e1}
- at: 28
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 28
  send: {type: event, event_type: tick}
- at: 28
  send: {type: event, event_type: e1}
- at: 30
  send: {type: event, event_type: tick}

# random scenario, seed 202, index 77 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    for: {seconds: 2}
    id: beta
  actions:
  - if:
    - condition: or
      conditions:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - condition: state
        entity_id: [light.l1, input_boolean.b1]
        state: 'on'
        match: any
      - or:
        - {condition: time, after: '22:00'}
        - {condition: time, before: '22:14'}
    - and:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - {condition: time, before: '22:14'}
      - condition: time
        after: '22:13:25'
        before: 06:00
        weekday: [tue]
    then:
    - action: test.s1
      data: {n: 1, v: '{{ trigger.id }}'}
      response_variable: v1
    - wait_for_trigger:
      - {trigger: event, event_type: e1}
      timeout: {seconds: 2}
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: [sensor.s2, light.l1]
          from: '4'
          for: 1
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '{{ 2 }}', continue_on_timeout: false}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
      - {action: test.s3}
  - sequence:
    - {event: m_6}
    - choose:
      - conditions:
        - condition: not
          conditions:
          - condition: and
            conditions:
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - not: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
        sequence:
        - parallel:
          - {event: m_7}
          - event: m_8
            event_data: {n: 8, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
          - sequence:
            - action: test.s9
              data: {n: 9, v: '{{ states(''light.l1'') }}'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - conditions:
        - {condition: state, entity_id: sensor.s2, state: abc}
        sequence:
        - sequence:
          - action: test.s10
            data: {n: 10, v: '{{ states(''light.l1'') }}'}
            target:
              entity_id: [light.l1, light.l2]
          - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        - event: m_11
          event_data: {n: 11, v: '{{ trigger.description }}'}
        - {event: m_12}
    - parallel:
      - sequence:
        - action: test.s13
          data: {n: 13, v: '{{ states(''light.l1'') }}'}
        - {stop: s}
        - condition: state
          entity_id: [sensor.s1]
          state: 'on'
          match: any
      - event: m_14
        event_data: {n: 14, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
  - event: m_15
    event_data: {n: 15, v: '{{ states(''sensor.s1'') }}'}
  - variables:
      v2: [a, '{{ 1 + 1 }}']
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 8
  send: {type: event, event_type: e2}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 11
  set: [input_boolean.b1, 'off']
- at: 11
  set: [input_boolean.b1, 'on']
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, '4']
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 18
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 22
  set: [light.l1, unavailable]
- at: 24
  set: [sensor.s2, '8']

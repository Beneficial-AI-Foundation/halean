# random scenario, seed 202, index 5 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: time_pattern, seconds: '26'}
  - {trigger: event, event_type: e2}
  actions:
  - {stop: s, error: true}
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.b1
        state: ['off', 'on']
      - '{{ repeat.index <= 3 }}'
      sequence:
      - {stop: s}
  - if:
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
    then:
    - parallel:
      - sequence:
        - action: test.s1
          data: {n: 1, v: '{{ this.attributes.current }}'}
          target:
            entity_id: [light.l1, light.l2]
        - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: 2, continue_on_timeout: false}
        - event: m_2
          event_data: {n: 2, completed: '{{ wait.completed }}'}
      - sequence:
        - sequence:
          - {action: test.s3, continue_on_error: true}
          - event: m_4
            event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          continue_on_error: true
        - {stop: s}
    - {action: test.s5}
    - {event: m_6}
    else:
    - event: m_7
      event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - {event: m_8}
  - delay: {seconds: 1}
- alias: a1
  id: id1
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  actions:
  - parallel:
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.platform }}'}
    - event: m_10
      event_data: {n: 10, v: '{{ states(''sensor.s1'') }}'}
  - repeat:
      until: ['{{ repeat.index >= 1 }}']
      sequence:
      - delay: {seconds: 1}
      - event: m_11
        event_data: {n: 11, v: '{{ states(''light.l1'') }}'}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [input_boolean.b1, 'on']
- at: 2
  set: [light.l1, 'on']
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 6
  set: [sensor.s2, '20']
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 12
  set: [sensor.s1, '20']
- at: 14
  send: {type: event, event_type: e2}

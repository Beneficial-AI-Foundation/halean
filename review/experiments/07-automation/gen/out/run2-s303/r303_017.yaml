# random scenario, seed 303, index 17 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2, id: beta}
  - {trigger: state, entity_id: light.l1, to: 2, attribute: lvl}
  actions:
  - {condition: time, after: '22:13:25'}
  - {stop: s, error: true}
  - sequence:
    - sequence:
      - if:
        - not:
          - '{{ is_state(''light.l2'', ''off'') }}'
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          - and:
            - {condition: time, after: '23:00:00', enabled: false}
            - condition: state
              entity_id: [light.l1]
              state: 'on'
              match: any
        then:
        - {event: m_1}
        else:
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - event: m_2
          event_data: {n: 2, v: '{{ trigger.id }}'}
      - {stop: s}
      - repeat:
          until:
          - condition: or
            conditions:
            - and:
              - '{{ trigger.id == ''0'' }}'
              - condition: and
                conditions:
                - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
                - {condition: time, after: '22:00', before: '06:00'}
                - {condition: time, before: '22:14', weekday: tue}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - {action: test.s3, continue_on_error: true}
          - {action: test.s4, response_variable: v2}
  - choose:
    - conditions: ['{{ trigger.platform == ''event'' }}']
      sequence:
      - {delay: 0}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        timeout: 0
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    to: 'on'
    from: 'on'
  actions:
  - {action: test.s6}
  - sequence:
    - choose:
      - conditions:
        - {condition: trigger, id: alpha}
        - {condition: time, before: '22:13:30'}
        sequence:
        - event: m_7
          event_data: {n: 7, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 1}
      - conditions:
        - condition: state
          entity_id: sensor.s1
          state: ['8', unavailable]
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        sequence:
        - wait_template: '{{ is_state(''light.l1'', ''on'') }}'
          timeout: {seconds: 2}
          continue_on_timeout: false
        - event: m_8
          event_data: {n: 8, completed: '{{ wait.completed }}'}
    - repeat:
        until:
        - condition: or
          conditions:
          - condition: not
            conditions:
            - condition: and
              conditions:
              - {condition: state, entity_id: light.l1, state: unavailable}
              - {condition: state, entity_id: sensor.s1, state: '12'}
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
            - condition: state
              entity_id: light.l1
              state: ['off', 'on']
          - '{{ repeat.index >= 3 }}'
        sequence:
        - parallel:
          - sequence:
            - variables:
                v2: [a, '{{ 1 + 1 }}']
            - action: test.s9
              data: {n: 9, v: '{{ states(''light.l1'') }}'}
              response_variable: v3
              enabled: false
          - sequence:
            - {delay: 2}
    - repeat:
        until:
        - condition: or
          conditions:
          - {condition: trigger, id: alpha}
          - '{{ repeat.index >= 3 }}'
        sequence:
        - {action: test.s10}
        - {action: test.s11}
  - {condition: trigger, id: '0'}
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 2}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 6
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 7
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  send: {type: service_result, call_id: 1, ok: true}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, unavailable]
- at: 14
  set: [sensor.s1, '12']
- at: 15
  send: {type: service_result, call_id: 2, ok: true}
- at: 17
  set: [light.l1, 'on']
- at: 19
  set: [light.l1, unavailable]
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  send: {type: event, event_type: tick}

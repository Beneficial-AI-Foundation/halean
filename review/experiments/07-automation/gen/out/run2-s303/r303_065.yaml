# random scenario, seed 303, index 65 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: true}
    id: alpha
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.id }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {delay: 1}
  - repeat:
      count: 1
      sequence:
      - parallel:
        - sequence:
          - repeat:
              for_each:
              - {k: 1}
              - null
              sequence:
              - event: m_2
                event_data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - {delay: '00:00:02'}
          - wait_for_trigger:
            - trigger: event
              event_type: e2
              event_data: {k: 1}
            - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: '00:00:02'}
    enabled: false
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 0}
  - {stop: s}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2

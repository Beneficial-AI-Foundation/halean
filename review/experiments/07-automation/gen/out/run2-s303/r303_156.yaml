# random scenario, seed 303, index 156 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  conditions:
  - {condition: time, after: '23:00:00', before: '06:00'}
  - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
  actions:
  - wait_template: '{{ trigger.id == ''0'' }}'
    timeout: {seconds: 2}
  - {stop: s, enabled: false}
  - variables: {v1: 1}
  - choose:
    - conditions:
      - and:
        - {condition: time, before: '22:13:30'}
        - condition: not
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 3}
          - condition: trigger
            id: [beta, '0']
          enabled: false
        - '{{ is_state(''light.l1'', ''on'') }}'
      sequence:
      - if:
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        then:
        - variables:
            v1: [a, '{{ 1 + 1 }}']
        else:
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            sequence:
            - action: test.s1
              data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              enabled: false
            - action: test.s2
              data: {n: 2, v: '{{ states(''light.l1'') }}'}
          default:
          - action: test.s3
            data: {n: 3, v: '{{ this.attributes.current }}'}
            target: {entity_id: light.l1}
          - {action: test.s4}
      - repeat:
          count: '{{ 2 }}'
          sequence:
          - repeat:
              until:
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s2, above: 6}
                - '{{ repeat.index >= 3 }}'
              sequence:
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
              - action: test.s5
                data: {n: 5, v: '{{ now().second }}'}
                target:
                  entity_id: [light.l1, light.l2]
                continue_on_error: true
          - action: test.s6
            data: {n: 6, v: '{{ trigger.description }}'}
      - {stop: s}
    default:
    - event: m_7
      event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - event: m_8
      event_data: {n: 8, v: '{{ this.attributes.current }}'}
    - choose:
      - conditions:
        - {condition: time, after: '23:00:00', before: '22:14'}
        - not:
          - {condition: state, entity_id: light.l1, state: 'on'}
        sequence:
        - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 2, continue_on_timeout: false}
        - event: m_9
          event_data: {n: 9, completed: '{{ wait.completed }}'}
  - repeat:
      for_each: []
      sequence:
      - choose:
        - conditions:
          - condition: or
            conditions:
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          sequence:
          - {action: test.s10, response_variable: v3}
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - action: test.s11
        data: {n: 11, v: '{{ trigger.platform }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 5
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 6
  set: [light.l1, 'on']
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 9
  send: {type: event, event_type: e3}
- at: 11
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 13
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: e3}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 20
  set: [sensor.s1, '4']
- at: 23
  set: [light.l1, 'off']
- at: 24
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: tick}
- at: 28
  send: {type: event, event_type: tick}
- at: 28
  set: [light.l1, unavailable]
- at: 31
  send: {type: event, event_type: tick}
- at: 33
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 34
  send: {type: event, event_type: tick}
- at: 35
  set: [light.l1, 'off']

# random scenario, seed 303, index 45 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: event, event_type: e1}
  - trigger: state
    entity_id: light.l1
    for: {seconds: 2}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - action: test.s2
    data: {n: 2, v: '{{ states(''light.l1'') }}'}
  - {delay: 2}
- alias: a1
  id: id1
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: state
    entity_id: light.l1
    to: [unavailable, 'on']
    from: unavailable
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    to: ['on', 'off']
    from: [unavailable, 'off']
  actions:
  - action: test.s3
    data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target:
      entity_id: [light.l1, light.l2]
    continue_on_error: true
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
    timeout: {seconds: 2}
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s4
    data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 6
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 7
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 9
  send: {type: service_result, call_id: 2, ok: true}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 11
  send: {type: event, event_type: e2}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 17
  send: {type: service_result, call_id: 3, ok: true}
- at: 17
  set: [sensor.s1, '1']
- at: 17
  send: {type: event, event_type: e1}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: service_result, call_id: 4, ok: true}
- at: 23
  set: [light.l1, unavailable]
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  send:
    type: service_result
    call_id: 5
    ok: true
    response: {value: 1}
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: true}

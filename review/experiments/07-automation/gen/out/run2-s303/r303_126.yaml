# random scenario, seed 303, index 126 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, to: 'off'}
  - {trigger: state, entity_id: sensor.s1, to: 1, attribute: lvl, for: 1}
  - {trigger: state, entity_id: light.l1, not_to: 'off', from: 'on'}
  actions:
  - {condition: state, entity_id: light.l1, state: unavailable}
  - wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    timeout: {seconds: 2}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}'}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.platform }}'}
    target:
      entity_id: [light.l1, light.l2]
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: state, entity_id: light.l1, state: 'off'}
      - {condition: trigger, id: '0'}
      sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
          sequence:
          - if: ['{{ is_state(''light.l1'', ''on'') }}']
            then:
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - conditions:
          - {condition: trigger, id: '1'}
          - {condition: trigger, id: '0'}
          sequence:
          - event: m_3
            event_data: {n: 3, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
          - {stop: s}
      - action: test.s4
        data: {n: 4, v: '{{ now().second }}'}
    default:
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
    - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
    - {stop: s}
  - repeat:
      for_each:
      - {k: 1}
      - null
      sequence:
      - parallel:
        - event: m_5
          event_data: {n: 5, v: '{{ trigger.description }}'}
        - sequence:
          - {stop: s}
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      - if:
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        then:
        - if:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
          - condition: not
            conditions:
            - condition: not
              conditions:
              - {condition: trigger, id: alpha}
              - condition: state
                entity_id: light.l1
                state: ['off', unavailable]
            - {condition: trigger, id: alpha}
          then:
          - {condition: time, after: '22:00', before: '22:14'}
          else:
          - event: m_6
            event_data: {n: 6, v: '{{ states(''light.l1'') }}'}
        else:
        - if:
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          then:
          - action: test.s7
            data: {n: 7, v: '{{ states(''sensor.s1'') }}'}
          - {delay: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  - trigger: state
    entity_id: sensor.s1
    from: [unknown, '1']
    to: unknown
    for: 3
  - trigger: state
    entity_id: [sensor.s1]
    from: ['7.5', '4']
  conditions:
  - condition: trigger
    id: [beta, '0']
    enabled: false
  actions:
  - parallel:
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.platform }}'}
    - sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        timeout: {seconds: 2}
        continue_on_timeout: false
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - sequence:
        - action: test.s10
          data: {n: 10, v: '{{ trigger.idx }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          continue_on_error: true
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1, from: 2, attribute: lvl}
      - repeat:
          count: 2
          sequence:
          - action: test.s11
            data: {n: 11, v: '{{ now().second }}'}
  - event: m_13
    event_data: {n: 13, v: '{{ trigger.id }}'}
  - {wait_template: '{{ trigger.id == ''0'' }}'}
states:
- entity_id: sensor.s2
  state: abc
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 6
  set: [sensor.s1, '4']
- at: 7
  send: {type: event, event_type: e3}
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s1, '8']
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 11
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 12
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 13
  set: [sensor.s1, abc]
- at: 14
  send: {type: event, event_type: tick}

# random scenario, seed 303, index 97 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: event, event_type: e1, id: alpha}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: abc
    to: '1'
  - trigger: state
    entity_id: [light.l1]
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
  - {event: m_1}
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
    then:
    - {delay: '00:00:02'}
    - parallel:
      - sequence:
        - if:
          - and:
            - or:
              - condition: trigger
                id: [beta, '0']
              - condition: state
                entity_id: [light.l1, sensor.s1]
                state: 'on'
                match: any
            - {condition: trigger, id: '0'}
            - condition: not
              conditions:
              - {condition: time, before: '06:00', enabled: false}
              - {condition: time, after: '23:00:00'}
          then:
          - {event: m_2}
          - event: m_3
            event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {stop: s}
      - sequence:
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - event: m_4
              event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
            - {action: test.s5}
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
          - trigger: event
            event_type: e2
            event_data: {k: 1}
          timeout: {seconds: 2}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - sequence:
        - action: test.s7
          data: {n: 7, v: '{{ now().second }}'}
    else:
    - sequence:
      - parallel:
        - sequence:
          - event: m_8
            event_data: {n: 8, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - {event: m_9}
        - sequence:
          - event: m_10
            event_data: {n: 10, v: '{{ states(''sensor.s1'') }}'}
          - {condition: state, entity_id: light.l1, state: 'off'}
        continue_on_error: true
    - if:
      - {condition: time, after: '23:00:00', before: '22:14'}
      then:
      - sequence:
        - event: m_11
          event_data: {n: 11, v: '{{ this.attributes.current }}'}
        - variables:
            v1: [a, '{{ 1 + 1 }}']
        - action: test.s12
          data: {n: 12, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          continue_on_error: true
      - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l1, sensor.s1]
      not_from: unavailable
    - {trigger: state, entity_id: sensor.s1, to: '8', from: '12', for: 3}
  - parallel:
    - event: m_13
      event_data: {n: 13, v: '{{ trigger.idx }}'}
    - sequence:
      - repeat:
          while:
          - {condition: time, after: '23:00:00'}
          - '{{ repeat.index <= 2 }}'
          sequence:
          - choose:
            - conditions:
              - condition: time
                after: '22:00'
                before: 06:00
                weekday: [tue]
              - condition: state
                entity_id: light.l1
                state: [unavailable, 'off']
                enabled: false
              sequence:
              - {action: test.s14}
              - {delay: '00:00:02'}
            default:
            - event: m_15
              event_data: {n: 15, v: '{{ trigger.description }}'}
            - action: test.s16
              data: {n: 16, v: '{{ trigger.platform }}'}
            - action: test.s17
              data: {n: 17, v: '{{ trigger.description }}'}
          - repeat:
              count: 0
              sequence:
              - variables: {v2: 1}
              - delay: {seconds: 1}
      - sequence:
        - {stop: s, error: true}
      - {stop: s, error: true}
    continue_on_error: true
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    to: ['7.5', abc]
    for: 1
    id: beta
  - {trigger: event, event_type: e1}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 2}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 2
  set: [sensor.s1, unknown]
  attributes: {lvl: 3}
- at: 3
  set: [sensor.s1, '7.5']
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 5
  set: [light.l1, 'off']
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 9
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 10
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 14
  set: [light.l1, 'off']
- at: 17
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 17
  set: [sensor.s1, '7.5']
- at: 17
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}
- at: 18
  set: [light.l1, 'on']
- at: 19
  set: [light.l1, 'off']
- at: 20
  send: {type: event, event_type: e1}
- at: 21
  set: [light.l1, unavailable]
- at: 23
  send: {type: event, event_type: tick}

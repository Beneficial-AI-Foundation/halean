# random scenario, seed 303, index 190 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'off'}
  - {trigger: state, entity_id: sensor.s1, to: '20'}
  actions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - {action: test.s1, continue_on_error: true}
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.s1
            state: ['4', '12']
          - {condition: time, after: '23:00:00', before: '22:13:30'}
          sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
        - conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
          sequence:
          - sequence:
            - action: test.s2
              data: {n: 2, v: '{{ trigger.idx }}'}
              response_variable: v3
              enabled: false
          - wait_template: '{{ trigger.id == ''0'' }}'
            timeout: {seconds: 2}
            continue_on_timeout: false
          - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        default:
        - action: test.s3
          data: {n: 3, v: '{{ trigger.idx }}'}
          target:
            entity_id: [light.l1, light.l2]
      - action: test.s4
        data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        target: {entity_id: light.l1}
  - event: m_5
    event_data: {n: 5, v: '{{ trigger.platform }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: light.l1, not_from: 'on', not_to: 'off'}
  - {trigger: event, event_type: e2}
  actions:
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.id }}'}
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - {action: test.s7}
  - {action: test.s8}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, 'off']
- at: 9
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 11
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 20
  set: [light.l1, 'off']
- at: 21
  set: [sensor.s1, '7.5']
- at: 22
  send: {type: event, event_type: tick}
- at: 22
  set: [sensor.s1, '12']
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 24
  send: {type: event, event_type: e3}
- at: 27
  set: [light.l1, 'on']

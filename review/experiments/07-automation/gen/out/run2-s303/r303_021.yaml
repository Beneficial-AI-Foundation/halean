# random scenario, seed 303, index 21 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: state, entity_id: light.l1, not_to: 3, from: 1, attribute: lvl}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
  - variables: {v1: x}
  - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 1, continue_on_timeout: false}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  - trigger: state
    entity_id: light.l1
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - condition: or
    conditions:
    - or:
      - '{{ trigger.platform == ''event'' }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    enabled: false
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    - {condition: time, after: '22:00'}
  actions:
  - action: test.s2
    data: {n: 2, v: '{{ trigger.id }}'}
  - sequence:
    - sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s1, below: 15, enabled: false}
        then:
        - action: test.s3
          data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
          target: {entity_id: light.l1}
          response_variable: v1
      - {condition: time, before: '06:00'}
  - {condition: state, entity_id: sensor.s1, state: abc}
  - action: test.s4
    data: {n: 4, v: '{{ trigger.platform }}'}
    continue_on_error: true
    response_variable: v2
  - action: test.s5
    target: {entity_id: light.l1}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
    id: alpha
  - {trigger: state, entity_id: sensor.s1}
  conditions:
  - {condition: trigger, id: '0'}
  actions:
  - if: ['{{ is_state(''light.l1'', ''on'') }}']
    then:
    - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - repeat:
        until:
        - condition: or
          conditions:
          - {condition: state, entity_id: light.l1, state: unavailable}
          - '{{ repeat.index >= 3 }}'
        sequence:
        - action: test.s6
          data: {n: 6, v: '{{ states(''light.l1'') }}'}
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          enabled: false
    - {event: m_7}
    else:
    - parallel:
      - event: m_8
        event_data: {n: 8, v: '{{ trigger.idx }}'}
      - sequence:
        - {stop: s}
        - action: test.s9
          data: {n: 9, v: '{{ this.attributes.current }}'}
      - sequence:
        - action: test.s10
          data: {n: 10, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
    - action: test.s11
      target: {entity_id: light.l1}
      response_variable: v3
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - action: test.s12
    data: {n: 12, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: light.l1}
  - action: test.s13
    data: {n: 13, v: '{{ trigger.id }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, '8']
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
- at: 7
  send: {type: event, event_type: e3}
- at: 9
  set: [light.l1, 'off']
- at: 10
  send: {type: event, event_type: tick}
- at: 12
  send: {type: service_result, call_id: 0, ok: true}
- at: 12
  send: {type: service_result, call_id: 1, ok: true}
- at: 13
  set: [light.l1, unavailable]
- at: 14
  set: [sensor.s1, '4']
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 21
  set: [light.l1, 'off']

# random scenario, seed 303, index 182 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: light.l1
    not_from: [unavailable, 'on']
    for: {seconds: '{{ 1 + 1 }}'}
    id: alpha
  conditions:
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: 3}
    - {condition: state, entity_id: light.l1, state: 'on'}
  actions:
  - {delay: 0}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: state
    entity_id: light.l1
    not_to: [unavailable, 'off']
    from: 'off'
    for: 3
  - {trigger: event, event_type: e3}
  - {trigger: event, event_type: e1, id: alpha}
  actions:
  - sequence:
    - {stop: s, error: true, enabled: false}
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - repeat:
      count: 0
      sequence:
      - {event: m_2}
      - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 0}
      - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 1}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
  - sequence:
    - event: m_4
      event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  - event: m_5
    event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 2, attribute: lvl, for: 2}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  conditions:
  - condition: time
    after: '22:00'
    before: '22:14'
    weekday: [tue]
  - {condition: trigger, id: '0'}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      sequence:
      - if:
        - {condition: state, entity_id: light.l1, state: 'on'}
        then:
        - {event: m_6}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        timeout: 3
        continue_on_timeout: false
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - parallel:
      - sequence:
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
      - sequence:
        - sequence:
          - {delay: 0}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      continue_on_error: true
  - {stop: s, error: true}
  - {stop: s, error: true}
states:
- {entity_id: sensor.s1, state: '20'}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 2
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: e2}
- at: 9
  set: [light.l1, 'on']
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 13
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 13
  set: [sensor.s1, '12']
- at: 14
  send: {type: event, event_type: e3}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  send: {type: event, event_type: tick}

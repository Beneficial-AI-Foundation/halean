# random scenario, seed 303, index 138 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    to: 1
    attribute: lvl
  conditions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
    continue_on_error: true
  - {action: test.s2}
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 2
  set: [sensor.s1, unknown]
- at: 3
  set: [light.l1, 'off']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: e2}
- at: 10
  set: [sensor.s1, '12']

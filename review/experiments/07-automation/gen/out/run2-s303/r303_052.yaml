# random scenario, seed 303, index 52 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: state, entity_id: light.l1, from: unavailable, to: unavailable, id: alpha}
  conditions:
  - or:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
  - {condition: trigger, id: '0'}
  actions:
  - {delay: 1}
  - {stop: s}
  - {event: m_1}
  - variables: {v2: '{{ states(''sensor.s1'') }}'}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_to: unknown}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - trigger: event
    event_type: e1
    event_data: {k: true}
  actions:
  - parallel:
    - sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
      - {event: m_3}
    - {event: m_4}
  - event: m_5
    event_data: {n: 5, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - choose:
    - conditions:
      - {condition: state, entity_id: light.l1, state: unavailable}
      - {condition: trigger, id: '1'}
      sequence:
      - variables: {v2: '{{ states(''sensor.s1'') }}'}
    default:
    - delay: {seconds: 1}
  - repeat:
      for_each: '{{ [''x'', 1] }}'
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: light.l1
          not_from: [unavailable, 'off']
          for: 3
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - action: test.s6
        data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        target:
          entity_id: [light.l1, light.l2]
        response_variable: v3
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        timeout: 3
        continue_on_timeout: false
      - event: m_8
        event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a2
  id: id2
  mode: parallel
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: 1}
    id: beta
  - trigger: state
    entity_id: [light.l1]
    to: unavailable
  conditions:
  - condition: or
    conditions:
    - {condition: time, after: '23:00:00', before: '22:14', enabled: false}
    - and:
      - condition: time
        after: '23:00:00'
        before: 06:00
        weekday: [wed, mon]
    - condition: time
      after: '22:00'
      before: 06:00
      weekday: [wed, mon]
      enabled: false
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_11
    event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: 0}
  - parallel:
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
    - {event: m_10}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
- at: 4
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, unavailable]
- at: 5
  set: [sensor.s1, '20']
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: e3}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 3}

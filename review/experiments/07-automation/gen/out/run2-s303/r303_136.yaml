# random scenario, seed 303, index 136 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, to: unavailable}
  - trigger: state
    entity_id: light.l1
    from: ['off', unavailable]
  actions:
  - {delay: 1}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, from: '20', for: '{{ 2 }}'}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - {delay: '00:00:02'}
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - {event: m_1}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - trigger: state
    entity_id: sensor.s1
    from: [abc, '7.5']
    to: '20'
  conditions:
  - {condition: time, after: '23:00:00'}
  actions:
  - {stop: s}
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 1
  set: [sensor.s1, '20']
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [light.l1, 'on']
- at: 4
  set: [light.l1, unavailable]
- at: 5
  set: [sensor.s1, abc]
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e3}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 9
  set: [light.l1, 'on']
- at: 11
  send: {type: event, event_type: e1}
- at: 14
  send: {type: event, event_type: e3}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, unavailable]
- at: 18
  set: [light.l1, 'off']
- at: 20
  send: {type: event, event_type: tick}

# random scenario, seed 303, index 101 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', id: alpha}
  - trigger: state
    entity_id: light.l1
    not_from: 'on'
    for: {seconds: 2}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s1, below: 15}
  actions:
  - sequence:
    - event: m_1
      event_data: {n: 1, v: '{{ this.attributes.current }}'}
    - if:
      - {condition: trigger, id: '1'}
      - {condition: trigger, id: '0', enabled: false}
      then:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
      - event: m_2
        event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
  - action: test.s4
    data: {n: 4, v: '{{ trigger.description }}'}
    target: {entity_id: light.l1}
  - repeat:
      count: 1
      sequence:
      - action: test.s5
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        enabled: false
  - action: test.s6
    data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    continue_on_error: true
    response_variable: v1
  - sequence:
    - sequence:
      - {action: test.s7, response_variable: v2}
    - variables: {v3: '{{ states(''sensor.s1'') }}'}
    - {wait_template: '{{ trigger.platform == ''event'' }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
    id: alpha
  - {trigger: state, entity_id: sensor.s1}
  actions:
  - if:
    - {condition: time, after: '22:00', before: '06:00'}
    - {condition: numeric_state, entity_id: sensor.s1, below: 15}
    then:
    - {stop: s}
    - action: test.s8
      target:
        entity_id: [light.l1, light.l2]
    - {action: test.s9}
    else:
    - action: test.s10
      data: {n: 10, v: '{{ states(''light.l1'') }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    - if:
      - not:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - condition: state
            entity_id: light.l1
            state: ['off', unavailable]
      - {condition: time, after: '23:00:00', before: '22:14'}
      then:
      - {condition: trigger, id: '1'}
    - action: test.s11
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - if:
    - and:
      - {condition: trigger, id: alpha}
      - '{{ states(''sensor.s2'') | float(0) < 5 }}'
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
    then:
    - {stop: s, enabled: false}
    else:
    - {condition: time, after: '22:00', before: '22:13:30'}
    - {delay: '{{ 1 }}'}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 2
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 2
  set: [light.l1, unavailable]
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [sensor.s1, abc]
- at: 7
  send: {type: service_result, call_id: 0, ok: true}
- at: 8
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 9
  set: [light.l1, 'on']
- at: 10
  set: [sensor.s1, '1']
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 11
  send:
    type: event
    event_type: e1
    data: {k: 2}

# random scenario, seed 303, index 44 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  - {trigger: state, entity_id: light.l1}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: [unavailable, 'on']
    to: 'off'
  actions:
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    then:
    - action: test.s1
      data: {n: 1, v: '{{ states(''light.l1'') }}'}
      response_variable: v1
    - if:
      - condition: not
        conditions:
        - {condition: state, entity_id: light.l1, state: unavailable, for: 2}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      then:
      - choose:
        - conditions:
          - condition: and
            conditions:
            - '{{ is_state(''light.l1'', ''on'') }}'
            - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
          - condition: not
            conditions:
            - {condition: time, after: '22:00', before: '22:14'}
            - {condition: state, entity_id: sensor.s1, state: '1'}
          sequence:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
          - {event: m_2}
        default:
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      - condition: or
        conditions:
        - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
        - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
        - condition: trigger
          id: [beta, '0']
          enabled: false
      else:
      - repeat:
          until:
          - condition: or
            conditions:
            - not:
              - {condition: state, entity_id: light.l1, state: unavailable}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - {delay: '00:00:02'}
          - event: m_3
            event_data: {n: 3, v: '{{ trigger.platform }}'}
          - {action: test.s4}
      - choose:
        - conditions:
          - and:
            - condition: state
              entity_id: sensor.s1
              state: [unknown, '4']
            - condition: and
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
              - {condition: state, entity_id: light.l1, state: 'on'}
              - condition: trigger
                id: [beta, '0']
            - condition: and
              conditions:
              - '{{ trigger.platform == ''event'' }}'
              - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
              - {condition: numeric_state, entity_id: sensor.s1, above: 6}
          sequence:
          - condition: not
            conditions:
            - condition: state
              entity_id: sensor.s1
              state: ['12', '7.5']
            - condition: not
              conditions:
              - {condition: trigger, id: '1'}
              - {condition: time, after: '23:00:00'}
            - '{{ states(''sensor.s1'') | int > 5 }}'
        - conditions:
          - or:
            - condition: state
              entity_id: light.l1
              state: ['on', 'off']
            - condition: state
              entity_id: light.l1
              state: [unavailable, 'on']
              enabled: false
          sequence:
          - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
        continue_on_error: true
        enabled: false
    enabled: false
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 0}
  - if:
    - condition: or
      conditions:
      - condition: or
        conditions:
        - {condition: state, entity_id: sensor.s1, state: unavailable, enabled: false}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        - {condition: trigger, id: '0'}
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        - '{{ is_state(''light.l2'', ''off'') }}'
    then:
    - wait_for_trigger:
      - {trigger: state, entity_id: sensor.s1, from: 1, attribute: lvl}
      timeout: 0
      continue_on_timeout: false
    - action: test.s5
      data: {n: 5, v: '{{ trigger.idx }}'}
      continue_on_error: true
    else:
    - choose:
      - conditions:
        - condition: not
          conditions:
          - not:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - {condition: time, after: '22:00'}
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - condition: state
          entity_id: light.l1
          state: [unavailable, 'on']
          for: {seconds: 1}
        sequence:
        - variables:
            v3: [a, '{{ 1 + 1 }}']
        - action: test.s6
          data: {n: 6, v: '{{ trigger.description }}'}
      - conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: [beta, '0']
        sequence:
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
            - condition: not
              conditions:
              - condition: or
                conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
                enabled: false
              - not:
                - {condition: numeric_state, entity_id: sensor.s1, below: 15}
                - condition: state
                  entity_id: light.l1
                  state: [unavailable, 'off']
            sequence:
            - {event: m_7}
          default:
          - action: test.s8
            data: {n: 8, v: '{{ trigger.description }}'}
      default:
      - repeat:
          while:
          - condition: state
            entity_id: [sensor.s1]
            state: 'on'
            match: any
          - '{{ repeat.index <= 3 }}'
          sequence:
          - event: m_9
            event_data: {n: 9, v: '{{ this.attributes.current }}'}
      - event: m_10
        event_data: {n: 10, v: '{{ now().second }}'}
      continue_on_error: true
    - event: m_11
      event_data: {n: 11, v: '{{ states(''light.l1'') }}'}
  - condition: or
    conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
    enabled: false
  - sequence:
    - action: test.s12
      data: {n: 12, v: '{{ now().second }}'}
      target:
        entity_id: [light.l1, light.l2]
    - wait_for_trigger:
      - trigger: event
        event_type: e3
        event_data: {k: a}
      timeout: 0
    - event: m_13
      event_data: {n: 13, v: '{{ trigger.description }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, '20']
- at: 4
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, unavailable]
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 18
  set: [light.l1, 'on']
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 22
  set: [light.l1, 'off']
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  send: {type: service_result, call_id: 0, ok: true}
- at: 26
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 27
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 28
  set: [light.l1, unavailable]
- at: 29
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 30
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 31
  set: [light.l1, 'off']
- at: 32
  set: [sensor.s1, abc]
- at: 33
  send: {type: service_result, call_id: 7, ok: false, error_kind: other}
- at: 34
  send: {type: service_result, call_id: 9, ok: true}

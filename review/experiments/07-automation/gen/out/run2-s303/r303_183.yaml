# random scenario, seed 303, index 183 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - trigger: state
    entity_id: light.l1
    from: [unavailable, 'off']
    for: '{{ 2 }}'
  - trigger: state
    entity_id: [light.l1]
    not_to: 'on'
  actions:
  - {action: test.s1}
  - wait_for_trigger:
    - trigger: state
      entity_id: light.l1
      not_to: 'on'
      for: {seconds: '{{ 1 + 1 }}'}
    timeout: {seconds: 2}
    enabled: false
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {event: m_2}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  - {trigger: state, entity_id: sensor.s1, from: unavailable, to: unknown}
  actions:
  - parallel:
    - sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        timeout: 0
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - {event: m_5}
  - sequence:
    - {stop: s, error: true, enabled: false}
    - sequence:
      - if:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - {condition: state, entity_id: light.gone, state: unavailable}
        then:
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        - {event: m_6}
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        else:
        - event: m_7
          event_data: {n: 7, v: '{{ trigger.description }}', var: '{{ v2 | default(''undef'') }}'}
        - variables:
            v3: [a, '{{ 1 + 1 }}']
          enabled: false
      - {condition: time, after: '23:00:00'}
      - {event: m_8}
  - sequence:
    - {action: test.s9}
  - if:
    - condition: or
      conditions:
      - {condition: time, after: '22:00'}
      - not:
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
        - {condition: state, entity_id: light.l1, state: 'off'}
        - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
    then:
    - parallel:
      - event: m_10
        event_data: {n: 10, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
      - {event: m_11}
      - event: m_12
        event_data: {n: 12, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
      enabled: false
    else:
    - if:
      - {condition: trigger, id: '0'}
      - '{{ states(''sensor.s1'') | int > 5 }}'
      then:
      - sequence:
        - event: m_13
          event_data: {n: 13, v: '{{ states(''sensor.s1'') }}'}
        - event: m_14
          event_data: {n: 14, v: '{{ states(''sensor.s1'') }}', var: '{{ v3 | default(''undef'') }}'}
        enabled: false
      - action: test.s15
        data: {n: 15, v: '{{ trigger.idx }}'}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, '7.5']
- at: 2
  set: [light.l1, 'on']
- at: 3
  set: [light.l1, 'off']
- at: 4
  send: {type: service_result, call_id: 0, ok: true}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 9
  send: {type: event, event_type: e1}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, unavailable]
- at: 16
  send: {type: event, event_type: e3}
- at: 18
  set: [light.l1, 'off']
- at: 20
  set: [light.l1, 'on']
- at: 21
  send:
    type: service_result
    call_id: 3
    ok: true
    response:
      value: [1, 2]
- at: 22
  set: [light.l1, 'off']
- at: 25
  send: {type: service_result, call_id: 5, ok: false, error_kind: ha_error}
- at: 27
  send: {type: service_result, call_id: 2, ok: true}
- at: 28
  send: {type: event, event_type: tick}
- at: 31
  send:
    type: service_result
    call_id: 4
    ok: true
    response:
      value: [1, 2]

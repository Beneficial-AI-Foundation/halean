# random scenario, seed 303, index 166 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: true}
  - {trigger: state, entity_id: light.l1, from: 'off', id: alpha}
  conditions:
  - {condition: trigger, id: '0'}
  actions:
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '00:00:03', continue_on_timeout: false}
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.s1
      from: ['12', unknown]
      to: unavailable
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', for: 2}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.platform }}'}
    target: {entity_id: light.l1}
  - action: test.s2
    data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - {trigger: event, event_type: e2, id: alpha}
  actions:
  - {action: test.s4, response_variable: v1, enabled: false}
  - variables: {v2: 1}
  - action: test.s5
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 4
  set: [light.l1, unavailable]
- at: 5

    type: event
    event_type: e1
    data: {k: a}
- at: 4
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, 'on']
- at: 4
  set: [sensor.s1, '20']
- at: 6

# random scenario, seed 303, index 132 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: beta}
  - {trigger: state, entity_id: light.l1, to: 'off'}
  conditions:
  - and:
    - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    enabled: false
  - {condition: time, after: '22:13:25', before: '06:00'}
  actions:
  - sequence:
    - repeat:
        count: 3
        sequence:
        - event: m_1
          event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - {event: m_2}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s1, abc]
- at: 2
  send: {type: event, event_type: tick}
- at: 3

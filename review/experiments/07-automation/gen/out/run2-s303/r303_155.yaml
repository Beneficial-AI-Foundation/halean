# random scenario, seed 303, index 155 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: [abc, '7.5']
    to: [unknown, unavailable]
  actions:
  - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
  - choose:
    - conditions:
      - '{{ states(''sensor.s2'') | float(0) < 15 }}'
      - {condition: trigger, id: alpha}
      sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3}
        - {condition: trigger, id: '1'}
        then:
        - sequence:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9, enabled: false}
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
          sequence:
          - {stop: s, error: true}
          - choose:
            - conditions:
              - {condition: trigger, id: '1'}
              - condition: state
                entity_id: [light.gone, light.l1]
                state: 'on'
                match: any
              sequence:
              - {event: m_1}
              - {event: m_2}
            - conditions:
              - condition: and
                conditions:
                - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
                - not:
                  - condition: state
                    entity_id: light.l1
                    state: ['off', 'on']
                  - {condition: state, entity_id: light.l1, state: 'off'}
              - {condition: state, entity_id: light.l1, state: unavailable}
              sequence:
              - {delay: '00:00:02'}
            default:
            - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
            - {event: m_3}
          - variables:
              v1: [a, '{{ 1 + 1 }}']
    default:
    - choose:
      - conditions:
        - {condition: time, after: '22:00', before: '22:14'}
        sequence:
        - parallel:
          - sequence:
            - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
            - {event: m_4}
          - sequence:
            - variables: {v1: '{{ states(''sensor.s1'') }}'}
      default:
      - choose:
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
          sequence:
          - {event: m_5}
          - delay: {seconds: '{{ 2 }}'}
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
          sequence:
          - variables: {v4: 1}
      - action: test.s6
        target:
          entity_id: [light.l1, light.l2]
      continue_on_error: true
    - event: m_7
      event_data: {n: 7, v: '{{ this.attributes.current }}', var: '{{ v4 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: sensor.s1
    not_to: ['4', '20']
    for: 3
  - {trigger: event, event_type: e3, id: alpha}
  conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
  actions:
  - {condition: time, before: '22:13:30'}
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1}
  - action: test.s8
    data: {n: 8, v: '{{ trigger.idx }}'}
    response_variable: v1
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - action: test.s9
    data: {n: 9, v: '{{ trigger.description }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 0
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 0
  set: [sensor.s1, '1']
- at: 1
  set: [light.l1, unavailable]
- at: 3
  set: [sensor.s1, abc]
- at: 5
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 6
  send: {type: service_result, call_id: 1, ok: true}
- at: 9
  set: [light.l1, 'off']
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}
- at: 14
  set: [light.l1, 'on']
- at: 17
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 20
  set: [sensor.s1, '20']
- at: 21
  send: {type: event, event_type: e2}
- at: 22
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 23
  set: [sensor.s1, '12']
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 25
  send: {type: event, event_type: e1}

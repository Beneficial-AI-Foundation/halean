# random scenario, seed 303, index 72 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, to: unavailable, id: alpha}
  - {trigger: state, entity_id: sensor.s1, to: '12', from: abc}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.description }}'}
  - delay: {seconds: 1}
  - {stop: s, error: true, enabled: false}
  - if:
    - not:
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    then:
    - {event: m_2}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: light.l1
    to: ['off', unavailable]
    id: alpha
  - {trigger: event, event_type: e1}
  actions:
  - event: m_4
    event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - parallel:
    - sequence:
      - {event: m_5}
    - event: m_6
      event_data: {n: 6, v: '{{ states(''light.l1'') }}'}
    continue_on_error: true
  - choose:
    - conditions: ['{{ trigger.platform == ''event'' }}']
      sequence:
      - action: test.s7
        data: {n: 7, v: '{{ this.attributes.current }}'}
      - {action: test.s8, enabled: false}
    - conditions:
      - {condition: time, after: '22:00', before: '22:14'}
      - not:
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        - {condition: trigger, id: '0'}
        - condition: not
          conditions:
          - '{{ states(''sensor.s1'') | int(0) > 3 }}'
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          enabled: false
      sequence:
      - event: m_9
        event_data: {n: 9, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - action: test.s10
        target:
          entity_id: [light.l1, light.l2]
    continue_on_error: true
  - action: test.s11
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    response_variable: v1
  - {action: test.s12, response_variable: v2}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [sensor.s1, unavailable]
- at: 0
  send: {type: event, event_type: e3}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'on']
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 9
  set: [light.l1, 'off']
- at: 11
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 11
  set: [sensor.s1, '4']
- at: 13
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s1, '4']
- at: 15
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'off']
  attributes: {lvl: 2}

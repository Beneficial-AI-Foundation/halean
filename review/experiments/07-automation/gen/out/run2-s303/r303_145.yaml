# random scenario, seed 303, index 145 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: event, event_type: e1, id: beta}
  - {trigger: state, entity_id: light.l1, for: '00:00:02', id: beta}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ now().second }}'}
  - choose:
    - conditions:
      - condition: trigger
        id: [beta, '0']
        enabled: false
      sequence:
      - parallel:
        - sequence:
          - {condition: trigger, id: alpha, enabled: false}
          - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 1, continue_on_timeout: false}
          - {action: test.s2}
        - sequence:
          - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: '{{ 2 }}', continue_on_timeout: false}
          - event: m_3
            event_data: {n: 3, completed: '{{ wait.completed }}'}
      - action: test.s4
        data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        target: {entity_id: light.l1}
        response_variable: v1
      - repeat:
          until: ['{{ repeat.index >= 1 }}']
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 2 }}']
              sequence:
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
      sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        then:
        - {event: m_5}
      - sequence:
        - sequence:
          - {delay: '00:00:02'}
        continue_on_error: true
    enabled: false
  - condition: or
    conditions:
    - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    - {condition: time, before: '22:14'}
  - {delay: 2}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, id: alpha}
  - {trigger: event, event_type: e2}
  conditions:
  - condition: state
    entity_id: light.l1
    state: ['on', 'off']
  actions:
  - {event: m_6}
  - {stop: s, error: true}
  - {stop: s}
states:
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  set: [light.l1, 'off']
- at: 3
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: e1}
- at: 3
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, 'on']
- at: 8
  set: [light.l1, 'off']
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 9
  send: {type: event, event_type: e1}
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 17
  send: {type: event, event_type: e1}
- at: 20
  set: [light.l1, 'off']
- at: 23
  set: [light.l1, unavailable]
- at: 24
  send: {type: event, event_type: e2}
- at: 25
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 25
  send: {type: event, event_type: tick}
- at: 28
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 28
  send: {type: event, event_type: e3}
- at: 28
  set: [sensor.s1, '4']

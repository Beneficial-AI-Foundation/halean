# random scenario, seed 303, index 109 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2, id: beta}
  - trigger: state
    entity_id: [sensor.s1]
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - variables: {v1: 1}
  - choose:
    - conditions:
      - {condition: trigger, id: '1'}
      - condition: trigger
        id: [beta, '0']
      sequence:
      - repeat:
          count: 2
          sequence:
          - {action: test.s2}
          - {delay: 1}
      - repeat:
          for_each:
          - {k: 1}
          - null
          sequence:
          - parallel:
            - sequence:
              - {action: test.s3}
              - {event: m_4}
            - sequence:
              - {delay: 0}
          - if:
            - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
            - condition: and
              conditions:
              - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
              - condition: state
                entity_id: sensor.s1
                state: [unknown, '20']
            then:
            - {delay: 1}
            continue_on_error: true
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 1, continue_on_timeout: false}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
    - conditions:
      - {condition: trigger, id: '0'}
      sequence:
      - action: test.s6
        data: {n: 6, v: '{{ states(''light.l1'') }}'}
  - if:
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    then:
    - {event: m_7}
    - sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e2}
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {event: m_8}
      enabled: false
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 1}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 3}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
- at: 9
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 11
  set: [light.l1, unavailable]
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 13
  set: [light.l1, unavailable]
- at: 14
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 14
  set: [light.l1, 'on']
- at: 15
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 19
  set: [sensor.s1, unknown]
  attributes: {lvl: 3}
- at: 20
  set: [light.l1, 'off']
- at: 22
  send: {type: event, event_type: tick}

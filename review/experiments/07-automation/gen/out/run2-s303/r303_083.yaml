# random scenario, seed 303, index 83 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: [sensor.s1]
    for: {seconds: '{{ 1 + 1 }}'}
  - trigger: event
    event_type: e3
    event_data: {k: true}
  - {trigger: state, entity_id: light.l1, not_from: 'on'}
  actions:
  - choose:
    - conditions:
      - '{{ states(''sensor.s1'') | int > 5 }}'
      - condition: and
        conditions:
        - {condition: trigger, id: '1'}
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - {condition: trigger, id: '1'}
      sequence:
      - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - event: m_1
        event_data: {n: 1, completed: '{{ wait.completed }}'}
    default:
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    - {stop: s, enabled: false}
  - {stop: s}
  - sequence:
    - repeat:
        while:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - '{{ repeat.index <= 3 }}'
        sequence:
        - event: m_2
          event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
    - repeat:
        for_each: '{{ [''x'', 1] }}'
        sequence:
        - sequence:
          - condition: and
            conditions:
            - condition: trigger
              id: [beta, '0']
          - {delay: '00:00:02'}
          - condition: not
            conditions:
            - condition: and
              conditions:
              - {condition: template, value_template: '{{ trigger.id == ''0'' }}', enabled: false}
              - {condition: time, after: '22:13:25'}
            - condition: or
              conditions:
              - condition: state
                entity_id: light.l1
                state: [unavailable, 'on']
    - sequence:
      - choose:
        - conditions: ['{{ trigger.id == ''0'' }}']
          sequence:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - variables: {v1: 1}
        default:
        - event: m_3
          event_data: {n: 3, v: '{{ now().second }}'}
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - {stop: s}
    continue_on_error: true
  - {action: test.s4, continue_on_error: true, response_variable: v4}
  - condition: state
    entity_id: light.l1
    state: ['on', 'off']
    for: 00:00:03
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    not_to: 'off'
    from: 'on'
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}'}
  - repeat:
      count: 3
      sequence:
      - {delay: 2}
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - parallel:
    - event: m_5
      event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - sequence:
      - {condition: trigger, id: '0', enabled: false}
      - if:
        - condition: time
          after: '22:13:25'
          before: '22:14'
          weekday: [tue]
        then:
        - if:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          then:
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          - action: test.s6
            data: {n: 6, v: '{{ states(''light.l1'') }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          else:
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - event: m_7
            event_data: {n: 7, v: '{{ states(''sensor.s1'') }}'}
        - action: test.s8
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          timeout: 1
          continue_on_timeout: false
        - event: m_9
          event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        else:
        - sequence:
          - variables: {v1: x}
        - {stop: s}
        - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}'}
  - {event: m_11}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [sensor.s1, '20']
- at: 2
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 5
  set: [sensor.s1, unknown]
- at: 5
  set: [light.l1, unavailable]
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s1, abc]
- at: 15
  set: [sensor.s1, unknown]
- at: 16
  send: {type: event, event_type: e3}
- at: 16
  send: {type: event, event_type: e2}
- at: 17
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 19
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: tick}

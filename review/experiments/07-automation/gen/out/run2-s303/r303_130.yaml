# random scenario, seed 303, index 130 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', id: alpha}
  - trigger: event
    event_type: e3
    event_data: {k: a}
  actions:
  - if:
    - condition: not
      conditions:
      - {condition: time, after: '22:00'}
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - {condition: state, entity_id: light.l1, state: 'off', enabled: false}
    then:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.idx }}'}
    else:
    - action: test.s2
      data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {stop: s}
  - sequence:
    - choose:
      - conditions:
        - {condition: time, after: '23:00:00', before: '22:14'}
        sequence:
        - {stop: s}
      - conditions:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - {condition: time, after: '22:13:25', before: '22:13:30'}
        sequence:
        - {event: m_3}
        - {stop: s, error: true}
      default:
      - wait_for_trigger:
        - {trigger: state, entity_id: light.l1, from: 1, to: 3, attribute: lvl}
        - {trigger: state, entity_id: light.l1, to: unavailable, from: 'on'}
        timeout: 1
        continue_on_timeout: false
    - action: test.s4
      data: {n: 4, v: '{{ trigger.id }}'}
      response_variable: v2
    - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, above: 3}
    then:
    - parallel:
      - sequence:
        - {delay: 1}
      - sequence:
        - {delay: 2}
        - choose:
          - conditions:
            - condition: or
              conditions:
              - '{{ states(''sensor.s1'') | int(0) > 3 }}'
              - condition: or
                conditions:
                - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
              - {condition: time, after: '23:00:00'}
              enabled: false
            sequence:
            - action: test.s6
              data: {n: 6, v: '{{ states(''light.l1'') }}'}
              response_variable: v3
          continue_on_error: true
      - sequence:
        - action: test.s7
          target: {entity_id: light.l1}
    - variables: {v4: x}
    - {event: m_8}
    else:
    - repeat:
        while:
        - {condition: trigger, id: '0'}
        - '{{ repeat.index <= 1 }}'
        sequence:
        - sequence:
          - event: m_9
            event_data: {n: 9, v: '{{ this.attributes.current }}', var: '{{ v2 | default(''undef'') }}'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
          continue_on_error: true
          enabled: false
        - wait_template: '{{ is_state(''light.l2'', ''off'') }}'
          timeout: {seconds: 2}
          continue_on_timeout: false
    - delay: {seconds: '{{ 2 }}'}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: 1}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: light.l1
    from: ['off', 'on']
    to: ['on', unavailable]
    id: alpha
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: [light.gone, sensor.s1]
          state: 'on'
          match: any
      sequence:
      - {stop: s}
      - wait_for_trigger:
        - trigger: state
          entity_id: light.l1
          to: ['off', unavailable]
          from: unavailable
        timeout: {seconds: 2}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, from: unavailable}
    - {trigger: event, event_type: e3}
    timeout: 2
  - event: m_14
    event_data: {n: 14, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, to: '8', not_from: '7.5'}
    - {trigger: state, entity_id: sensor.s1, to: '4'}
    timeout: 1
  - event: m_15
    event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      sequence:
      - condition: not
        conditions:
        - condition: or
          conditions:
          - {condition: time, after: '22:13:25', before: '22:13:30'}
          - {condition: state, entity_id: light.l1, state: 'off'}
        - condition: state
          entity_id: light.l1
          state: ['off', 'on']
        - {condition: time, before: '22:13:30'}
    default:
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - if:
    - and:
      - {condition: time, before: '06:00'}
      - '{{ states(''sensor.s2'') | float(0) < 5 }}'
    then:
    - {stop: s}
    else:
    - choose:
      - conditions:
        - and:
          - {condition: state, entity_id: light.l1, state: unavailable}
          - '{{ states(''sensor.s2'') | float(0) < 9 }}'
        sequence:
        - sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
        - event: m_10
          event_data: {n: 10, v: '{{ trigger.idx }}'}
        - parallel:
          - {event: m_11}
          - {event: m_12}
          enabled: false
    - repeat:
        until: ['{{ repeat.index >= 2 }}']
        sequence:
        - choose:
          - conditions:
            - {condition: state, entity_id: light.l1, state: 'on', for: 2}
            - and:
              - condition: not
                conditions:
                - '{{ trigger.platform == ''event'' }}'
                - {condition: numeric_state, entity_id: sensor.s1, below: 9}
                - {condition: state, entity_id: sensor.s1, state: unavailable}
                enabled: false
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
            sequence:
            - {delay: 1}
        - action: test.s13
          data: {n: 13, v: '{{ trigger.id }}'}
          response_variable: v3
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, 'on']
- at: 2
  set: [light.l1, unavailable]
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 7
  set: [sensor.s1, '1']
- at: 8
  set: [light.l1, 'off']
- at: 8
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 10
  send: {type: event, event_type: e2}
- at: 13
  send: {type: event, event_type: e3}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  send: {type: event, event_type: tick}

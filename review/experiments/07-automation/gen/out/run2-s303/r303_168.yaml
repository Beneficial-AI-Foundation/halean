# random scenario, seed 303, index 168 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  - {trigger: state, entity_id: light.l1, to: 'on', from: 'off'}
  conditions:
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
    - or: ['{{ states(''sensor.s1'') | int > 5 }}']
    - {condition: time, before: '06:00'}
    enabled: false
  actions:
  - sequence:
    - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 1, continue_on_timeout: false}
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - parallel:
    - sequence:
      - repeat:
          while:
          - condition: and
            conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
          - '{{ repeat.index <= 3 }}'
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            target: {entity_id: light.l1}
          - sequence:
            - {delay: '{{ 1 }}'}
            - action: test.s2
              data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
              response_variable: v2
            - {event: m_3}
    - sequence:
      - event: m_4
        event_data: {n: 4, v: '{{ trigger.platform }}'}
    continue_on_error: true
  - {delay: '00:00:02'}
  - if:
    - '{{ states(''sensor.s2'') | float(0) < 5 }}'
    - or:
      - {condition: time, after: '22:13:25', before: '06:00'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 9, enabled: false}
    then:
    - if:
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      then:
      - choose:
        - conditions:
          - condition: or
            conditions:
            - condition: and
              conditions:
              - condition: state
                entity_id: light.l1
                state: ['off', 'on']
                for: {seconds: 1}
              - '{{ is_state(''light.l1'', ''on'') }}'
              - {condition: trigger, id: alpha}
            - or:
              - {condition: trigger, id: '1'}
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
          sequence:
          - event: m_5
            event_data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
          - {event: m_6}
        default:
        - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
        - {event: m_7}
      - if:
        - condition: state
          entity_id: sensor.s1
          state: ['12', '7.5']
        then:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - {action: test.s8, continue_on_error: true, enabled: false}
        else:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - delay: {seconds: 1}
        - {event: m_9}
      else:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3}
      - or:
        - {condition: state, entity_id: sensor.s1, state: abc}
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        enabled: false
  - parallel:
    - sequence:
      - {stop: s}
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2, continue_on_timeout: false}
      - event: m_10
        event_data: {n: 10, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
    continue_on_error: true
states:
- {entity_id: sensor.s1, state: '1'}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 0
  set: [light.l1, 'off']
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e2}
- at: 7
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 10
  set: [light.l1, 'off']
- at: 12
  send: {type: event, event_type: e1}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 15
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 15
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 16
  set: [light.l1, 'off']
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 21
  set: [sensor.s1, unavailable]
- at: 22
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}
- at: 27
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 28
  set: [light.l1, unavailable]
- at: 29
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 32
  set: [light.l1, 'off']
- at: 33
  send: {type: event, event_type: tick}

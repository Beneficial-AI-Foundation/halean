# random scenario, seed 303, index 110 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - trigger: state
    entity_id: [light.l1]
    for: '{{ 2 }}'
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  actions:
  - {stop: s, error: true}
  - {action: test.s1, response_variable: v1}
  - {event: m_2}
  - variables: {v2: x}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: or
          conditions:
          - {condition: state, entity_id: sensor.s1, state: '8'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - and:
          - {condition: numeric_state, entity_id: sensor.s1, below: 15, enabled: false}
          - condition: state
            entity_id: light.l1
            state: ['on', 'off']
            for: {seconds: 1}
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      sequence:
      - choose:
        - conditions:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          sequence:
          - action: test.s3
            data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
            enabled: false
    - conditions:
      - condition: time
        before: '22:14'
        weekday: [tue]
      sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        timeout: 2
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - choose:
        - conditions:
          - or:
            - condition: and
              conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          sequence:
          - if:
            - {condition: numeric_state, entity_id: sensor.s1, above: 6}
            then:
            - {delay: 0, enabled: false}
            - variables: {v2: x}
            - {delay: '00:00:02'}
          - if:
            - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
            then:
            - {action: test.s4}
          - {event: m_5}
        - conditions:
          - and:
            - condition: not
              conditions:
              - condition: trigger
                id: [beta, '0']
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
          sequence:
          - wait_for_trigger:
            - trigger: event
              event_type: e3
              event_data: {k: true}
            timeout: 0
            enabled: false
          - event: m_6
            event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    default:
    - if:
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      then:
      - action: test.s8
        data: {n: 8, v: '{{ trigger.description }}'}
      - event: m_9
        event_data: {n: 9, v: '{{ trigger.description }}', var: '{{ v3 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 2
  send: {type: event, event_type: e2}
- at: 3
  set: [sensor.s1, '4']
- at: 4
  set: [sensor.s1, unknown]
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 13
  set: [sensor.s1, '4']
- at: 14
  set: [light.l1, unavailable]
- at: 16
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  set: [sensor.s1, '1']
- at: 18
  send: {type: event, event_type: e3}
- at: 20
  set: [light.l1, 'on']

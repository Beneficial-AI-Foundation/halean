# random scenario, seed 303, index 10 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: [sensor.s1]
    from: ['8', '4']
    to: unknown
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    not_from: 2
    to: 2
    attribute: lvl
    id: beta
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', for: 2}
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: [light.gone, sensor.s1]
        state: 'on'
        match: any
      - '{{ repeat.index <= 2 }}'
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ now().second }}'}
    enabled: false
  - sequence:
    - event: m_2
      event_data: {n: 2, v: '{{ now().second }}'}
    - choose:
      - conditions:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - condition: not
            conditions:
            - condition: state
              entity_id: [light.l1]
              state: 'on'
              match: any
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {condition: state, entity_id: light.gone, state: unavailable}
        sequence:
        - event: m_3
          event_data: {n: 3, v: '{{ trigger.id }}'}
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {stop: s, error: true}
  - {event: m_4}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', for: 1}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    to: 'on'
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: 2}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - or:
    - condition: state
      entity_id: light.l1
      state: ['off', unavailable]
    - condition: not
      conditions:
      - {condition: time, before: '06:00'}
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - {condition: state, entity_id: light.l1, state: 'on'}
    enabled: false
  actions:
  - parallel:
    - sequence:
      - event: m_5
        event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - sequence:
      - repeat:
          count: '{{ 2 }}'
          sequence:
          - wait_for_trigger:
            - {trigger: state, entity_id: sensor.s1}
            timeout: 2
            continue_on_timeout: false
        continue_on_error: true
      - {action: test.s6}
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
      - parallel:
        - sequence:
          - choose:
            - conditions: ['{{ is_state(''light.l1'', ''on'') }}']
              sequence:
              - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
              - {event: m_7}
            - conditions:
              - {condition: time, after: '23:00:00', before: '22:14'}
              - condition: and
                conditions:
                - condition: or
                  conditions:
                  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
                  - {condition: state, entity_id: light.gone, state: unavailable}
                - {condition: state, entity_id: light.l1, state: 'off'}
              sequence:
              - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
              - event: m_8
                event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
                enabled: false
            enabled: false
          - event: m_9
            event_data: {n: 9, v: '{{ trigger.platform }}'}
        - event: m_10
          event_data: {n: 10, v: '{{ trigger.description }}'}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: '{{ 2 }}'}
        timeout: 3
        continue_on_timeout: false
      - event: m_11
        event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - condition: or
    conditions:
    - not:
      - {condition: trigger, id: '1', enabled: false}
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - delay: {seconds: '{{ 2 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 3
  set: [light.l1, 'off']
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 7
  set: [sensor.s1, '20']
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 13
  set: [light.l1, unavailable]
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 16
  set: [light.l1, 'on']
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 18
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 21
  set: [sensor.s1, '8']
- at: 24
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 25
  send: {type: event, event_type: e1}
- at: 26
  set: [light.l1, unavailable]
- at: 27
  send: {type: event, event_type: e3}
- at: 27
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 28
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 29
  set: [light.l1, 'off']
- at: 31
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 34
  send:
    type: event
    event_type: e3
    data: {k: true}

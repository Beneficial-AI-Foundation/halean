# random scenario, seed 303, index 49 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - trigger: state
    entity_id: [light.l1]
    to: unavailable
  - trigger: state
    entity_id: [light.l1]
    to: ['off', 'on']
    from: ['on', 'off']
  conditions:
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - {event: m_1}
  - if: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
    then:
    - {stop: s}
    - if:
      - condition: state
        entity_id: light.l1
        state: 'on'
        for: {seconds: 1}
      then:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, for: 3}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - action: test.s2
        data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    else:
    - choose:
      - conditions:
        - {condition: trigger, id: '0'}
        - condition: not
          conditions:
          - condition: not
            conditions:
            - {condition: state, entity_id: sensor.s1, state: '8'}
            - {condition: trigger, id: '1'}
        sequence:
        - parallel:
          - sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.platform }}'}
              response_variable: v1
            - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          - sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ trigger.idx }}'}
        - sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
      - conditions:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
          - {condition: time, before: '22:13:30'}
        sequence:
        - {delay: '00:00:02'}
        - sequence:
          - event: m_6
            event_data: {n: 6, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
          continue_on_error: true
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
    - sequence:
      - parallel:
        - sequence:
          - action: test.s7
            data: {n: 7, v: '{{ now().second }}'}
          - {action: test.s8}
          - {event: m_9}
        - sequence:
          - {event: m_10}
          - {action: test.s11}
        - sequence:
          - {action: test.s12, continue_on_error: true, response_variable: v5}
      - {stop: s}
      - parallel:
        - sequence:
          - variables: {v6: 1}
          - {condition: trigger, id: alpha}
        - event: m_13
          event_data: {n: 13, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v6 | default(''undef'') }}'}
        - sequence:
          - action: test.s14
            data: {n: 14, v: '{{ states(''sensor.s1'') }}'}
            continue_on_error: true
        continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s1, '1']
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, 'off']
- at: 11
  set: [light.l1, unavailable]
- at: 12
  set: [light.l1, 'off']
- at: 15
  set: [light.l1, 'on']
- at: 16
  set: [light.l1, unavailable]
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s1, '7.5']
- at: 18
  set: [sensor.s1, unknown]
- at: 21
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 22
  set: [sensor.s1, '8']
- at: 24
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 27
  send: {type: event, event_type: tick}
- at: 29
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 30
  send: {type: event, event_type: tick}

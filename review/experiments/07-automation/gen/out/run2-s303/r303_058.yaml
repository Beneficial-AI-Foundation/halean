# random scenario, seed 303, index 58 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: state
    entity_id: light.l1
    from: ['on', 'off']
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', id: beta}
  conditions:
  - or:
    - condition: not
      conditions:
      - {condition: trigger, id: '1'}
      - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
    - '{{ is_state(''light.l2'', ''off'') }}'
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    default:
    - event: m_2
      event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: ['on', unavailable]
    for: 1
    id: alpha
  - trigger: state
    entity_id: light.l1
    from: ['off', 'on']
    not_to: unavailable
  actions:
  - if:
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - and:
      - {condition: trigger, id: '1'}
      - {condition: numeric_state, entity_id: sensor.s2, above: 3}
    then:
    - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 0}
    - event: m_6
      event_data: {n: 6, completed: '{{ wait.completed }}'}
    - parallel:
      - sequence:
        - parallel:
          - sequence:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
            - event: m_3
              event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
          - event: m_4
            event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - sequence:
        - action: test.s5
          data: {n: 5, v: '{{ now().second }}'}
          continue_on_error: true
  - repeat:
      count: 3
      sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: light.l1, to: 2, not_from: 2, attribute: lvl}
        timeout: 2
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - choose:
    - conditions:
      - {condition: time, before: '22:13:30'}
      sequence:
      - event: m_8
        event_data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
      - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 0, continue_on_timeout: false}
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}'}
    default:
    - variables: {v1: x}
    - sequence:
      - action: test.s10
        data: {n: 10, v: '{{ trigger.id }}'}
      - choose:
        - conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          sequence:
          - {condition: time, before: '06:00'}
        - conditions:
          - {condition: state, entity_id: sensor.s1, state: '7.5', enabled: false}
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
          sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - action: test.s11
            data: {n: 11, v: '{{ trigger.id }}'}
            continue_on_error: true
            enabled: false
      continue_on_error: true
  - {stop: s, error: true}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {trigger: state, entity_id: light.l1, to: 1, attribute: lvl}
  conditions:
  - {condition: trigger, id: '1'}
  - {condition: time, before: '06:00'}
  actions:
  - parallel:
    - event: m_12
      event_data: {n: 12, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - {delay: 0}
  - {delay: 0}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, from: 'on'}
  - condition: trigger
    id: [beta, '0']
    enabled: false
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: '1'
  attributes: {lvl: 2}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'on']
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 4
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 5
  send: {type: event, event_type: e2}
- at: 5
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 7
  set: [light.l1, unavailable]
- at: 8
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 9
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 9
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 10
  set: [light.l1, unavailable]
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  send: {type: event, event_type: tick}

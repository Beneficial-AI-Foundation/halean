# random scenario, seed 303, index 87 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_to: '8', for: '{{ 2 }}'}
  - trigger: state
    entity_id: [light.l1]
    attribute: lvl
    for: {seconds: '{{ 1 + 1 }}'}
    id: alpha
  conditions:
  - not:
    - {condition: time, after: '22:13:25', enabled: false}
    - not:
      - {condition: state, entity_id: light.l1, state: 'off'}
      - {condition: time, before: '22:14'}
  actions:
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, below: 15}
    then:
    - variables:
        v1: [a, '{{ 1 + 1 }}']
  - {action: test.s1}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, to: 'off'}
  - trigger: state
    entity_id: light.l1
    to: [unavailable, 'off']
    from: 'off'
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - sequence:
    - action: test.s2
      data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      target:
        entity_id: [light.l1, light.l2]
      response_variable: v2
  - action: test.s3
    data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: parallel
  max: 3
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, to: unavailable, for: 3}
  - {trigger: state, entity_id: light.l1, not_from: unavailable, to: 'off'}
  conditions:
  - {condition: state, entity_id: sensor.s1, state: '1', for: '00:00:03'}
  actions:
  - {stop: s, error: true}
  - sequence:
    - if:
      - condition: and
        conditions:
        - {condition: trigger, id: '1'}
        - condition: and
          conditions:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
          - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
      then:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - event: m_4
        event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - {delay: '00:00:02'}
      else:
      - wait_for_trigger:
        - {trigger: state, entity_id: light.l1, from: 'off'}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - choose:
    - conditions:
      - '{{ trigger.id == ''0'' }}'
      - {condition: state, entity_id: light.l1, state: unavailable}
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - condition: or
        conditions:
        - condition: or
          conditions:
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - {condition: time, before: '22:14'}
        - not:
          - {condition: time, before: '22:14'}
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
        - condition: state
          entity_id: light.gone
          state: ['off', unavailable]
    default:
    - parallel:
      - sequence:
        - event: m_6
          event_data: {n: 6, v: '{{ trigger.description }}', var: '{{ v2 | default(''undef'') }}'}
      - sequence:
        - sequence:
          - event: m_7
            event_data: {n: 7, v: '{{ states(''sensor.s1'') }}', var: '{{ v2 | default(''undef'') }}'}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: '4'}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 1}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 1
  set: [light.l1, 'on']
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 5
  set: [sensor.s1, '7.5']
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: e3}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, unavailable]
- at: 14
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 14
  send: {type: service_result, call_id: 0, ok: true}

# random scenario, seed 303, index 150 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0, v5: 0}
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', for: 1}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', for: '{{ 2 }}', id: beta}
  conditions:
  - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
  - {condition: trigger, id: '0'}
  actions:
  - condition: and
    conditions:
    - {condition: trigger, id: alpha}
    - or:
      - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
  - choose:
    - conditions:
      - not:
        - {condition: trigger, id: alpha}
        - {condition: trigger, id: alpha}
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - {event: m_1}
          - {stop: s}
          - condition: or
            conditions:
            - not:
              - {condition: time, after: '22:00', before: '06:00'}
            - {condition: time, after: '23:00:00', before: '22:14', weekday: tue}
            - condition: or
              conditions:
              - condition: state
                entity_id: light.l1
                state: ['off', unavailable]
              - condition: state
                entity_id: [sensor.s1, light.l1]
                state: 'on'
                match: any
              - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            enabled: false
        continue_on_error: true
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - variables:
          v3: [a, '{{ 1 + 1 }}']
    continue_on_error: true
  - choose:
    - conditions:
      - condition: state
        entity_id: [light.l1]
        state: 'on'
        match: any
      - condition: and
        conditions:
        - {condition: time, before: '22:14'}
        enabled: false
      sequence:
      - {stop: s}
      - sequence:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, to: '4'}
        timeout: 0
        continue_on_timeout: false
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
      sequence:
      - parallel:
        - sequence:
          - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: 1}
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}'}
          - parallel:
            - sequence:
              - {condition: trigger, id: '1'}
              - variables:
                  v4: [a, '{{ 1 + 1 }}']
            - event: m_2
              event_data: {n: 2, v: '{{ trigger.idx }}'}
            - sequence:
              - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
              - {event: m_3}
          - {action: test.s4, continue_on_error: true}
        - sequence:
          - condition: state
            entity_id: light.l1
            state: ['on', unavailable]
      - repeat:
          for_each: '{{ states(''light.l1'') }}'
          sequence:
          - sequence:
            - {event: m_6, enabled: false}
            - {action: test.s7}
          - {delay: 2}
      - parallel:
        - {event: m_8}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.platform }}', var: '{{ v3 | default(''undef'') }}'}
    default:
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    then:
    - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: 2}
    - event: m_10
      event_data: {n: 10, completed: '{{ wait.completed }}'}
    else:
    - if:
      - and:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        - condition: and
          conditions:
          - {condition: state, entity_id: light.l1, state: 'off'}
          - '{{ is_state(''light.l1'', ''on'') }}'
      then:
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          sequence:
          - event: m_11
            event_data: {n: 11, v: '{{ trigger.platform }}', var: '{{ v4 | default(''undef'') }}'}
        default:
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - {condition: trigger, id: '0', enabled: false}
      - {event: m_12, enabled: false}
      - if: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
        then:
        - event: m_13
          event_data: {n: 13, v: '{{ trigger.platform }}', var: '{{ v5 | default(''undef'') }}'}
          enabled: false
      continue_on_error: true
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: state, entity_id: light.l1, attribute: lvl, id: alpha}
  - trigger: state
    entity_id: [light.l1]
    from: 'on'
    id: beta
  actions:
  - sequence:
    - if:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - condition: or
        conditions:
        - condition: state
          entity_id: light.l1
          state: ['on', 'off']
        - or:
          - condition: trigger
            id: [beta, '0']
          - condition: state
            entity_id: light.gone
            state: ['off', unavailable]
      then:
      - choose:
        - conditions:
          - not:
            - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
            - condition: not
              conditions:
              - '{{ is_state(''light.l1'', ''on'') }}'
              - {condition: trigger, id: alpha}
              - {condition: state, entity_id: sensor.s1, state: '20'}
          sequence:
          - {event: m_14}
          - {condition: numeric_state, entity_id: sensor.s1, above: 6}
          - event: m_15
            event_data: {n: 15, v: '{{ this.attributes.current }}'}
        - conditions:
          - condition: trigger
            id: [beta, '0']
          sequence:
          - event: m_16
            event_data: {n: 16, v: '{{ trigger.id }}'}
          - {event: m_17}
          - action: test.s18
            data: {n: 18, v: '{{ states(''sensor.s1'') }}'}
            target:
              entity_id: [light.l1, light.l2]
        default:
        - event: m_19
          event_data: {n: 19, v: '{{ this.attributes.current }}'}
        - {delay: '00:00:02'}
        - action: test.s20
          target:
            entity_id: [light.l1, light.l2]
          response_variable: v1
      - if:
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        then:
        - {action: test.s21}
        - event: m_22
          event_data: {n: 22, v: '{{ trigger.platform }}'}
        else:
        - event: m_23
          event_data: {n: 23, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
        - event: m_24
          event_data: {n: 24, v: '{{ this.attributes.current }}'}
        continue_on_error: true
      else:
      - {stop: s, error: true}
    - choose:
      - conditions:
        - condition: and
          conditions:
          - not:
            - {condition: time, before: '06:00', enabled: false}
          - condition: or
            conditions:
            - {condition: state, entity_id: sensor.s1, state: unknown}
            - '{{ states(''sensor.s1'') | int(0) > 3 }}'
        sequence:
        - action: test.s25
          data: {n: 25, v: '{{ trigger.id }}'}
          target:
            entity_id: [light.l1, light.l2]
          continue_on_error: true
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - {delay: 2}
            - {delay: '{{ 1 }}'}
            - condition: time
              after: '22:13:25'
              before: '22:14'
              weekday: [tue]
        - wait_for_trigger:
          - {trigger: event, event_type: e3}
      - conditions:
        - condition: and
          conditions:
          - or:
            - {condition: trigger, id: '0'}
            - {condition: numeric_state, entity_id: sensor.s1, above: 3}
            - '{{ states(''sensor.s2'') | float(0) < 9 }}'
        - {condition: time, before: '22:14'}
        sequence:
        - if:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          then:
          - {action: test.s26}
          - action: test.s27
            data: {n: 27, v: '{{ trigger.id }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - variables: {v1: x}
          else:
          - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
          - delay: {seconds: '{{ 2 }}'}
          continue_on_error: true
        - {stop: s}
  - {action: test.s28}
  - parallel:
    - sequence:
      - {action: test.s29, continue_on_error: true}
      - {event: m_30}
    - sequence:
      - delay: {seconds: '{{ 2 }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 7
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 8
  set: [light.l1, unavailable]
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 8
  set: [sensor.s1, '1']
- at: 9
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 11
  send: {type: service_result, call_id: 3, ok: false, error_kind: ha_error}
- at: 12
  send: {type: event, event_type: e3}
- at: 15
  set: [light.l1, 'on']
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 19
  send: {type: event, event_type: tick}
- at: 21
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 24
  send: {type: event, event_type: tick}
- at: 26
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 27
  send: {type: event, event_type: tick}
- at: 28
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 28
  set: [light.l1, 'off']
- at: 29
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 30
  send:
    type: event
    event_type: e1
    data: {k: 1}

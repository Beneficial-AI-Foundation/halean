  - choose:
    - conditions:
      - condition: state
        entity_id: light.l1
        state: ['on', 'off']
      sequence:
      - if:
        - {condition: trigger, id: '0'}
        - {condition: trigger, id: '1'}
        then:
        - condition: and
          conditions:
          - {condition: time, after: '23:00:00', before: '22:13:30'}
          - {condition: time, before: '22:14'}
          - condition: and
            conditions:
            - {condition: time, after: '22:00'}
            - '{{ is_state(''light.l1'', ''on'') }}'
            - {condition: trigger, id: '1'}
        continue_on_error: true
    - conditions:
      - {condition: trigger, id: alpha}
      - condition: state
        entity_id: light.l1
        state: [unavailable, 'off']
      sequence:
      - choose:
        - conditions:
          - and:
            - '{{ states(''sensor.s1'') | int > 5 }}'
            - {condition: time, after: '22:00', before: '06:00'}
            - and:
              - {condition: time, before: '22:13:30', enabled: false}
              enabled: false
          sequence:
          - {delay: 0}
          - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '00:00:03', continue_on_timeout: false}
      - {stop: s}
  - action: test.s1
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    continue_on_error: true
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}

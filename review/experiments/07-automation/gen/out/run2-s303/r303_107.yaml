# random scenario, seed 303, index 107 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: 0}
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {trigger: state, entity_id: light.l1}

# random scenario, seed 303, index 143 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, for: 3}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  conditions:
  - not:
    - {condition: state, entity_id: sensor.s1, state: '4'}
    - {condition: trigger, id: alpha}
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - repeat:
      count: 1
      sequence:
      - repeat:
          count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
          sequence:
          - event: m_1
            event_data: {n: 1, v: '{{ states(''light.l1'') }}'}
          - sequence:
            - action: test.s2
              data: {n: 2, v: '{{ trigger.description }}'}
            - delay: {seconds: 1}
            - {condition: trigger, id: '1'}
          - {stop: s}
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  - {stop: s}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 1}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: event, event_type: e1}
  - {trigger: event, event_type: e2, id: beta}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: sensor.s1, state: '4'}
      sequence:
      - sequence:
        - parallel:
          - sequence:
            - action: test.s5
              data: {n: 5, v: '{{ trigger.description }}'}
              response_variable: v1
          - event: m_6
            event_data: {n: 6, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
          - sequence:
            - {condition: state, entity_id: light.l1, state: unavailable, for: '00:00:03'}
        - event: m_7
          event_data: {n: 7, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
        - repeat:
            count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
            sequence:
            - action: test.s8
              data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            - delay: {seconds: '{{ 2 }}'}
    enabled: false
  - event: m_9
    event_data: {n: 9, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send: {type: event, event_type: e2}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 11
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 13
  set: [sensor.s1, '8']
- at: 14
  send: {type: event, event_type: e3}
- at: 15
  send: {type: service_result, call_id: 0, ok: false, error_kind: invalid}
- at: 17
  set: [light.l1, 'off']
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 21
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}
- at: 22
  set: [light.l1, unavailable]
- at: 25
  set: [sensor.s1, '1']
- at: 27
  send: {type: event, event_type: e1}
- at: 27
  send: {type: event, event_type: e3}
- at: 29
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 30
  send: {type: event, event_type: tick}
- at: 32
  set: [light.l1, 'on']
- at: 33
  send: {type: event, event_type: tick}
- at: 35
  set: [sensor.s1, unavailable]

# random scenario, seed 303, index 152 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0, v8: 0, v9: 0}
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', id: alpha}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target:
      entity_id: [light.l1, light.l2]
  - event: m_2
    event_data: {n: 2, v: '{{ this.attributes.current }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      sequence:
      - {event: m_3}
      - if:
        - {condition: trigger, id: '0'}
        then:
        - event: m_4
          event_data: {n: 4, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        else:
        - {stop: s}
        continue_on_error: true
    - conditions:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
        - condition: and
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - {condition: time, after: '22:00', before: '22:13:30'}
          - {condition: time, after: '22:13:25', before: '22:14'}
      sequence:
      - sequence:
        - choose:
          - conditions:
            - condition: trigger
              id: [beta, '0']
              enabled: false
            - {condition: time, after: '23:00:00', before: '22:14'}
            sequence:
            - condition: and
              conditions:
              - and:
                - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - {event: m_5}
            - variables: {v2: 1}
          - conditions:
            - {condition: time, after: '22:13:25', before: '06:00', enabled: false}
            - {condition: trigger, id: '1'}
            sequence:
            - event: m_6
              event_data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
          default:
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
          - event: m_7
            event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v3 | default(''undef'') }}'}
          - action: test.s8
            data: {n: 8, v: '{{ now().second }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - event: m_9
              event_data: {n: 9, v: '{{ trigger.description }}', var: '{{ v2 | default(''undef'') }}'}
            - variables: {v2: '{{ states(''sensor.s1'') }}'}
        continue_on_error: true
      - if:
        - {condition: state, entity_id: sensor.s1, state: '12'}
        then:
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1}
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1}
          timeout: 0
          continue_on_timeout: false
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
    default:
    - wait_template: '{{ trigger.id == ''0'' }}'
      timeout: {seconds: 2}
      continue_on_timeout: false
    - event: m_18
      event_data: {n: 18, completed: '{{ wait.completed }}'}
    - choose:
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15, enabled: false}
        - {condition: time, before: '22:13:30', weekday: tue}
        sequence:
        - action: test.s11
          data: {n: 11, v: '{{ trigger.description }}'}
          response_variable: v6
        - choose:
          - conditions:
            - condition: and
              conditions:
              - or:
                - {condition: state, entity_id: sensor.s1, state: '12'}
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, below: 9}
                - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
                enabled: false
            sequence:
            - action: test.s12
              target:
                entity_id: [light.l1, light.l2]
              continue_on_error: true
            - {condition: time, after: '23:00:00', before: '06:00'}
          - conditions:
            - condition: and
              conditions:
              - not:
                - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
                - {condition: state, entity_id: sensor.s1, state: '8'}
                - {condition: time, after: '22:13:25', before: '22:13:30'}
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
              - condition: not
                conditions:
                - condition: time
                  after: '22:13:25'
                  before: '22:13:30'
                  weekday: [wed, mon]
                - {condition: time, after: '23:00:00'}
            sequence:
            - action: test.s13
              data: {n: 13, v: '{{ trigger.idx }}'}
              target:
                entity_id: [light.l1, light.l2]
            - variables:
                v3: [a, '{{ 1 + 1 }}']
          default:
          - {action: test.s14}
        - event: m_15
          event_data: {n: 15, v: '{{ now().second }}'}
      - conditions:
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        - condition: or
          conditions:
          - condition: state
            entity_id: [light.l1]
            state: 'on'
            match: any
        sequence:
        - variables: {v2: x}
    - if:
      - {condition: state, entity_id: light.l1, state: unavailable}
      - {condition: numeric_state, entity_id: sensor.s2, above: 3}
      then:
      - wait_for_trigger:
        - trigger: state
          entity_id: [sensor.s1, light.l1]
      - event: m_16
        event_data: {n: 16, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      else:
      - {action: test.s17, response_variable: v9}
    continue_on_error: true
  - {event: m_19}
  - sequence:
    - event: m_20
      event_data: {n: 20, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, to: 'off'}
  - trigger: state
    entity_id: light.l1
    not_from: [unavailable, 'on']
    to: ['on', unavailable]
    for: 1
  actions:
  - {event: m_21}
  - {event: m_22}
- alias: a2
  id: id2
  mode: queued
  triggers:
  - trigger: state
    entity_id: light.l1
    not_to: ['off', 'on']
    from: unavailable
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - sequence:
    - sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
        timeout: {seconds: 2}
        continue_on_timeout: false
      continue_on_error: true
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
      sequence:
      - {condition: state, entity_id: light.l1, state: 'on'}
    default:
    - sequence:
      - {condition: time, after: '22:00'}
    - event: m_23
      event_data: {n: 23, v: '{{ trigger.description }}'}
    - action: test.s24
      target:
        entity_id: [light.l1, light.l2]
      response_variable: v1
  - {stop: s}
  - {stop: s}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: '1'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  set: [light.l1, 'off']
- at: 2
  set: [sensor.s1, '7.5']
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
- at: 7
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 10
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'off']
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 22
  send: {type: event, event_type: e2}
- at: 23
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 25
  set: [sensor.s1, '1']
  attributes: {lvl: 2}

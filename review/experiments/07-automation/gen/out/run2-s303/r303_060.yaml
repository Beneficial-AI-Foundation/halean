# random scenario, seed 303, index 60 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', id: beta}
  - trigger: state
    entity_id: light.l1
    not_to: [unavailable, 'on']
    from: 'off'
  - {trigger: event, event_type: e2}
  actions:
  - {stop: s}
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      sequence:
      - action: test.s2
        data: {n: 2, v: '{{ now().second }}'}
        continue_on_error: true
      - {stop: s, error: true}
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
    default:
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  send: {type: event, event_type: e2}
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l1, 'on']
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 6
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 7
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 10
  set: [light.l1, unavailable]
- at: 11
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 15
  set: [light.l1, unavailable]
- at: 16
  set: [sensor.s1, '4']
- at: 16
  set: [sensor.s1, '12']
- at: 19
  set: [light.l1, 'on']
  attributes: {lvl: 3}

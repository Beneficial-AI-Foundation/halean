# random scenario, seed 303, index 13 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
  - {trigger: event, event_type: e1}
  conditions:
  - {condition: time, before: '06:00'}
  - {condition: time, after: '23:00:00'}
  actions:
  - {action: test.s1}
  - parallel:
    - {event: m_2}
    - sequence:
      - parallel:
        - {event: m_3}
        - sequence:
          - wait_for_trigger:
            - {trigger: state, entity_id: light.l1, to: 2, attribute: lvl}
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    continue_on_error: true
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: '{{ 2 }}'}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}'}
  - event: m_5
    event_data: {n: 5, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
  - sequence:
    - repeat:
        count: '{{ 2 }}'
        sequence:
        - event: m_6
          event_data: {n: 6, v: '{{ now().second }}'}
      continue_on_error: true
    - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - event: m_7
      event_data: {n: 7, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    attribute: lvl
    for: {seconds: 2}
  - trigger: state
    entity_id: light.l1
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - condition: not
    conditions:
    - condition: or
      conditions:
      - condition: trigger
        id: [beta, '0']
        enabled: false
      enabled: false
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', enabled: false}
    - {condition: numeric_state, entity_id: sensor.s2, above: 3}
  - {condition: state, entity_id: sensor.s1, state: '4'}
  actions:
  - sequence:
    - wait_for_trigger:
      - {trigger: state, entity_id: light.l1, to: 'off'}
      - {trigger: state, entity_id: light.l1}
      timeout: 3
    - action: test.s9
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      continue_on_error: true
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    then:
    - delay: {seconds: 1}
    - action: test.s10
      data: {n: 10, v: '{{ this.attributes.current }}'}
    - if:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      then:
      - choose:
        - conditions:
          - condition: trigger
            id: [beta, '0']
          sequence:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        default:
        - {delay: 2}
        - action: test.s11
          data: {n: 11, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - action: test.s12
        target: {entity_id: light.l1}
      continue_on_error: true
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - {condition: time, after: '23:00:00', before: '06:00'}
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          sequence:
          - parallel:
            - sequence:
              - delay: {seconds: '{{ 2 }}'}
            - {event: m_13}
          - event: m_14
            event_data: {n: 14, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
        default:
        - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
        - event: m_15
          event_data: {n: 15, completed: '{{ wait.completed }}'}
    - sequence:
      - action: test.s16
        data: {n: 16, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - {condition: state, entity_id: light.l1, state: 'on'}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, not_to: unavailable, for: '{{ 2 }}', id: beta}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: beta}
  conditions:
  - condition: or
    conditions:
    - {condition: time, after: '22:13:25'}
    enabled: false
  - '{{ states(''sensor.s1'') | int > 5 }}'
  actions:
  - if:
    - {condition: trigger, id: alpha}
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
      - {condition: state, entity_id: sensor.s1, state: '4', for: '00:00:03'}
      - {condition: state, entity_id: sensor.s1, state: '20'}
    then:
    - if:
      - {condition: trigger, id: alpha}
      - condition: state
        entity_id: light.l1
        state: ['on', 'off']
      then:
      - if: ['{{ states(''sensor.s1'') | int > 5 }}']
        then:
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - {event: m_17}
        else:
        - {condition: state, entity_id: light.l1, state: 'off'}
        - {delay: 1}
        - {event: m_18}
        enabled: false
  - choose:
    - conditions:
      - not:
        - {condition: time, after: '23:00:00'}
      sequence:
      - {event: m_19}
    - conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
      sequence:
      - action: test.s20
        data: {n: 20, v: '{{ trigger.id }}'}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '{{ 2 }}'}
    default:
    - {condition: state, entity_id: sensor.s1, state: '4'}
    - choose:
      - conditions:
        - or:
          - condition: or
            conditions:
            - {condition: trigger, id: alpha}
            - {condition: time, after: '22:00', before: '06:00'}
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
        sequence:
        - choose:
          - conditions:
            - {condition: trigger, id: alpha}
            sequence:
            - action: test.s21
              data: {n: 21, v: '{{ trigger.platform }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s2, above: 3, enabled: false}
            sequence:
            - action: test.s22
              target: {entity_id: light.l1}
    - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  - sequence:
    - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - {event: m_23}
    - {action: test.s24}
  - event: m_25
    event_data: {n: 25, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 5
  set: [light.l1, 'on']
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'off']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l1, 'on']
- at: 14
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 15
  set: [light.l1, unavailable]
- at: 16
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: x}
- at: 17
  set: [sensor.s1, abc]
- at: 18
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 19
  send: {type: service_result, call_id: 3, ok: true}
- at: 19
  send: {type: event, event_type: e2}
- at: 21
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 22
  set: [sensor.s1, '8']
- at: 25
  send: {type: event, event_type: e2}
- at: 26
  set: [sensor.s1, '7.5']
- at: 27
  set: [sensor.s1, '12']
- at: 29
  send:
    type: event
    event_type: e1
    data: {k: 1}

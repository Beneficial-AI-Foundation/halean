# random scenario, seed 303, index 24 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, attribute: lvl}
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  - trigger: state
    entity_id: light.l1
    not_from: ['off', unavailable]
    id: beta
  actions:
  - {stop: s}
  - sequence:
    - action: test.s1
      data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
      continue_on_error: true
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 1}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
- alias: a1
  id: id1
  mode: queued
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: state, entity_id: light.l1, from: 2, attribute: lvl}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: unavailable
    id: beta
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', id: beta}
  conditions:
  - condition: time
    before: '22:14'
    weekday: [tue]
  - '{{ trigger.id == ''0'' }}'
  actions:
  - {event: m_3}
  - action: test.s4
    data: {n: 4, v: '{{ trigger.id }}'}
  - parallel:
    - sequence:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - event: m_5
      event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
states:
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 1
  send: {type: event, event_type: e3}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, abc]
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 10
  set: [light.l1, 'on']
- at: 11
  send: {type: event, event_type: e3}
- at: 13
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 16
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 19
  send: {type: event, event_type: e2}
- at: 20
  set: [light.l1, 'off']
- at: 20
  send: {type: service_result, call_id: 0, ok: true}
- at: 23
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: e2}
- at: 25
  send: {type: event, event_type: e3}
- at: 28
  send: {type: event, event_type: e3}
- at: 29
  set: [sensor.s1, '20']

# random scenario, seed 303, index 89 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: state
    entity_id: [light.l1]
    for: {seconds: '{{ 1 + 1 }}'}
  - trigger: state
    entity_id: light.l1
    not_from: ['on', 'off']
  conditions:
  - {condition: time, after: '22:13:25', before: '22:14'}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l1]
      attribute: lvl
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    timeout: 3
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: 0}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 0, continue_on_timeout: false}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, to: 3, attribute: lvl}
    timeout: 2
    continue_on_timeout: false
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, 'off']
- at: 1
  set: [light.l1, unavailable]
- at: 2
  set: [sensor.s1, unavailable]
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s1, '20']
  attributes: {lvl: 1}
- at: 8
  set: [sensor.s1, '20']
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 12
  set: [light.l1, 'on']
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 17
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  set: [light.l1, 'off']

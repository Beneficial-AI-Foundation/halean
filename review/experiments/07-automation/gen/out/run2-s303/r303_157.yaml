# random scenario, seed 303, index 157 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: state, entity_id: light.l1}
  - {trigger: state, entity_id: light.l1, to: 'off'}
  actions:
  - parallel:
    - sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
        timeout: 2
        continue_on_timeout: false
      - event: m_1
        event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
      - {event: m_2}
    - sequence:
      - if:
        - condition: state
          entity_id: light.l1
          state: [unavailable, 'off']
          for: 2
        - condition: state
          entity_id: light.gone
          state: ['off', unavailable]
        then:
        - action: test.s3
          data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - parallel:
          - sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.description }}'}
              target:
                entity_id: [light.l1, light.l2]
              response_variable: v1
            - {action: test.s5}
          - event: m_6
            event_data: {n: 6, v: '{{ trigger.idx }}'}
        - condition: state
          entity_id: light.l1
          state: ['on', 'off']
        else:
        - if:
          - '{{ states(''sensor.s1'') | int(0) > 7 }}'
          - condition: or
            conditions:
            - condition: and
              conditions:
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
              - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
              - {condition: numeric_state, entity_id: sensor.s2, above: 3}
            - condition: not
              conditions:
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
              - {condition: numeric_state, entity_id: sensor.s1, above: 3}
            - {condition: state, entity_id: light.l1, state: unavailable}
          then:
          - delay: {seconds: 1}
          - condition: or
            conditions:
            - condition: trigger
              id: [beta, '0']
              enabled: false
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - sequence:
          - condition: time
            before: '22:13:30'
            weekday: [wed, mon]
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - wait_for_trigger:
        - trigger: state
          entity_id: light.l1
          to: 'off'
          for: {seconds: 2}
        timeout: 1
      - event: m_8
        event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - sequence:
        - {event: m_7}
  - {event: m_9}
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: state, entity_id: light.l1, to: 'off'}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: [unavailable, '7.5']
  conditions:
  - condition: trigger
    id: [beta, '0']
  actions:
  - event: m_11
    event_data: {n: 11, v: '{{ trigger.platform }}'}
  - if:
    - {condition: state, entity_id: light.l1, state: 'on'}
    then:
    - {action: test.s12}
  - {event: m_13}
  - condition: or
    conditions:
    - {condition: time, after: '22:00', before: '22:13:30'}
    - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
    - {condition: time, after: '22:00', before: '22:13:30'}
states:
- {entity_id: sensor.s1, state: abc}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  send: {type: event, event_type: e3}
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 7
  set: [light.l1, 'off']
- at: 8
  set: [light.l1, 'on']
- at: 10
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 10
  send: {type: event, event_type: e1}
- at: 11
  send: {type: event, event_type: tick}
- at: 14
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 16
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 17
  set: [sensor.s1, '7.5']
- at: 18
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 20
  send: {type: event, event_type: tick}
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 28
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 29
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 30
  set: [light.l1, 'off']
- at: 31
  set: [light.l1, unavailable]
- at: 32
  send: {type: event, event_type: tick}

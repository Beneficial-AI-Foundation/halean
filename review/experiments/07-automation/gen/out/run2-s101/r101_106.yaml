# random scenario, seed 101, index 106 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 2, id: beta}
  - {trigger: time_pattern, seconds: /3}
  actions:
  - repeat:
      while:
      - condition: or
        conditions:
        - {condition: trigger, id: alpha}
        - {condition: time, after: '22:00'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ this.attributes.current }}'}
      - parallel:
        - {event: m_2}
        - sequence:
          - {condition: time, before: '06:00', enabled: false}
          - {delay: '{{ 1 }}'}
        continue_on_error: true
      - parallel:
        - sequence:
          - {action: test.s3}
          - {action: test.s4, response_variable: v1}
          - {event: m_5}
        - sequence:
          - choose:
            - conditions: ['{{ is_state(''light.l1'', ''on'') }}']
              sequence:
              - {condition: time, after: '22:13:25', before: '06:00'}
              - action: test.s6
                data: {n: 6, v: '{{ trigger.platform }}'}
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              - variables:
                  v2: [a, '{{ 1 + 1 }}']
            - conditions:
              - {condition: numeric_state, entity_id: sensor.s1, below: 9}
              sequence:
              - action: test.s7
                target: {entity_id: light.l1}
                response_variable: v3
              - variables: {v4: x}
            default:
            - {action: test.s8}
            - {delay: '{{ 1 }}'}
        - sequence:
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - sequence:
            - action: test.s9
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              response_variable: v5
          - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', enabled: false}
          - event: m_10
            event_data: {n: 10, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - {condition: state, entity_id: input_boolean.b1, state: 'off'}
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
          - {condition: time, after: '22:00'}
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        - condition: state
          entity_id: light.gone
          state: ['off', 'on']
      sequence:
      - event: m_11
        event_data: {n: 11, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
      - not:
        - condition: and
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15, enabled: false}
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          enabled: false
        - {condition: numeric_state, entity_id: sensor.s1, below: 15}
        - {condition: trigger, id: '1'}
      sequence:
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s1, above: 3, for: 3}
        timeout: 1
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - variables:
        v2: [a, '{{ 1 + 1 }}']
    - parallel:
      - sequence:
        - parallel:
          - sequence:
            - action: test.s13
              data: {n: 13, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              continue_on_error: true
            - variables: {v4: '{{ states(''sensor.s1'') }}'}
          - {event: m_14}
          - sequence:
            - variables: {v5: '{{ repeat.index if repeat is defined else -1 }}'}
        - event: m_15
          event_data: {n: 15, v: '{{ trigger.description }}', var: '{{ v8 | default(''undef'') }}'}
      - event: m_16
        event_data: {n: 16, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0, v8: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: event, event_type: e2}
  conditions:
  - {condition: time, before: '06:00', enabled: false}
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    timeout: {seconds: 2}
  - event: m_20
    event_data: {n: 20, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - {condition: trigger, id: '1'}
        - condition: state
          entity_id: light.gone
          state: [unavailable, 'off']
      sequence:
      - {delay: 2}
      - event: m_17
        event_data: {n: 17, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      sequence:
      - sequence:
        - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
        - event: m_19
          event_data: {n: 19, completed: '{{ wait.completed }}'}
        - {action: test.s18, continue_on_error: true, response_variable: v2}
        - {stop: s}
        continue_on_error: true
    default:
    - repeat:
        until: ['{{ repeat.index >= 2 }}']
        sequence:
        - condition: and
          conditions:
          - {condition: state, entity_id: light.l2, state: unavailable}
          - {condition: trigger, id: '1'}
        - variables:
            v2: [a, '{{ 1 + 1 }}']
        - variables: {v3: '{{ states(''sensor.s1'') }}'}
    - wait_for_trigger:
      - trigger: state
        entity_id: [input_boolean.b1, light.l1]
        from: 'off'
        to: unavailable
        for: 1
      - {trigger: event, event_type: e2}
      timeout: 3
- alias: a2
  id: id2
  mode: queued
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: event, event_type: e3, id: alpha}
  - trigger: event
    event_type: e2
    event_data: {k: a}
    id: beta
  conditions:
  - condition: time
    before: '22:14'
    weekday: [tue]
  actions:
  - parallel:
    - sequence:
      - action: test.s21
        data: {n: 21, v: '{{ now().second }}'}
        continue_on_error: true
    - {event: m_22}
  - variables: {v1: x}
  - choose:
    - conditions: ['{{ is_state(''light.l2'', ''off'') }}']
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 3 }}']
          sequence:
          - {delay: 1}
          - {delay: 1}
          - repeat:
              while: ['{{ trigger.id == ''0'' }}', '{{ repeat.index <= 2 }}']
              sequence:
              - event: m_23
                event_data: {n: 23, v: '{{ trigger.id }}'}
              - event: m_24
                event_data: {n: 24, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
              - action: test.s25
                data: {n: 25, v: '{{ this.attributes.current }}'}
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      - choose:
        - conditions:
          - {condition: trigger, id: '1'}
          sequence:
          - sequence:
            - {delay: '00:00:02'}
          - {action: test.s26}
          - action: test.s27
            data: {n: 27, v: '{{ trigger.id }}'}
            continue_on_error: true
  - action: test.s28
    data: {n: 28, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: light.l1}
    continue_on_error: true
  - sequence:
    - {action: test.s29}
    - variables:
        v1: [a, '{{ 1 + 1 }}']
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 0
  set: [sensor.s2, '12']
- at: 1
  set: [light.l1, 'on']
- at: 4
  set: [sensor.s2, '20']
- at: 4
  send: {type: service_result, call_id: 2, ok: true}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 5
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 8
  set: [sensor.s1, unavailable]
- at: 9
  send: {type: event, event_type: e1}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 13
  set: [sensor.s1, '20']
- at: 16
  set: [light.l1, unavailable]
- at: 18
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: e3}
- at: 20
  send: {type: event, event_type: tick}
- at: 23
  send: {type: event, event_type: tick}

# random scenario, seed 101, index 17 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: light.l2, from: 2, attribute: lvl}
  actions:
  - sequence:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.idx }}'}
    - wait_for_trigger:
      - {trigger: state, entity_id: input_boolean.b1, to: unavailable}
      - {trigger: state, entity_id: light.l1, from: 'off', for: 3}
      timeout: {seconds: 2}
      continue_on_timeout: false
  - {delay: 2}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [sensor.s1, abc]
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 2
  set: [input_boolean.b1, 'on']
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l2, 'off']
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  send: {type: event, event_type: e3}
- at: 13
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}

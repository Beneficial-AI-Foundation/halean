# random scenario, seed 101, index 191 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /7}
  actions:
  - {action: test.s1, continue_on_error: true}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - not:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
          - {condition: time, after: '22:00'}
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      sequence:
      - action: test.s2
        data: {n: 2, v: '{{ trigger.platform }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - action: test.s3
    data: {n: 3, v: '{{ trigger.platform }}'}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', for: 1}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
    timeout: 3
    continue_on_timeout: false
  - if:
    - and:
      - condition: and
        conditions:
        - {condition: trigger, id: '0'}
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - {condition: state, entity_id: light.l1, state: unavailable, enabled: false}
    then:
    - {event: m_4}
    - {event: m_5}
    - {delay: 1}
    else:
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    - if: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
      then:
      - sequence:
        - event: m_7
          event_data: {n: 7, v: '{{ trigger.platform }}'}
      else:
      - if:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        then:
        - variables:
            v1: [a, '{{ 1 + 1 }}']
        - action: test.s8
          target: {entity_id: light.l1}
        else:
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
        - {event: m_9}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: parallel
  max: 3
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10, for: '00:00:02'}
  conditions:
  - or:
    - and:
      - {condition: time, after: '22:13:25', before: '06:00'}
      - {condition: time, before: '22:13:30'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  actions:
  - action: test.s11
    data: {n: 11, v: '{{ trigger.idx }}'}
  - sequence:
    - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - event: m_12
    event_data: {n: 12, v: '{{ states(''light.l1'') }}'}
  - repeat:
      while:
      - or:
        - condition: not
          conditions:
          - '{{ is_state(''light.l1'', ''on'') }}'
          - {condition: time, before: '06:00'}
        - not:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - {stop: s}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  set: [input_boolean.b1, 'off']
- at: 5
  set: [light.l2, unavailable]
- at: 6
  send: {type: service_result, call_id: 1, ok: false, error_kind: invalid}
- at: 7
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '1']
- at: 11
  send: {type: service_result, call_id: 2, ok: false, error_kind: other}
- at: 12
  send: {type: service_result, call_id: 3, ok: false, error_kind: other}
- at: 12
  set: [light.l1, 'off']
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: service_result
    call_id: 4
    ok: true
    response: {value: 1}
- at: 20
  set: [sensor.s2, '7.5']

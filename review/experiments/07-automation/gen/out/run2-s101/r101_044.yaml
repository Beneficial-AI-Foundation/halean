# random scenario, seed 101, index 44 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: ['8', abc]
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  actions:
  - {event: m_1}
  - if:
    - condition: trigger
      id: [beta, '0']
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
    then:
    - parallel:
      - {event: m_2}
      - sequence:
        - sequence:
          - delay: {seconds: 1}
          - event: m_3
            event_data: {n: 3, v: '{{ now().second }}'}
          continue_on_error: true
        - repeat:
            while: ['{{ trigger.platform in [''state'', ''numeric_state''] }}', '{{ repeat.index <= 1 }}']
            sequence:
            - condition: state
              entity_id: light.l1
              state: unavailable
              for: {seconds: 1}
            - event: m_4
              event_data: {n: 4, v: '{{ trigger.description }}'}
          continue_on_error: true
        - {event: m_5, enabled: false}
      - sequence:
        - sequence:
          - {event: m_6}
          - variables: {v1: x}
    - {event: m_7}
    continue_on_error: true
  - {event: m_8, enabled: false}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  - trigger: state
    entity_id: sensor.s2
    not_from: [abc, '20']
    to: ['12', '20']
  actions:
  - sequence:
    - {event: m_9}
  - action: test.s10
    data: {n: 10, v: '{{ trigger.platform }}'}
  - action: test.s11
    data: {n: 11, v: '{{ trigger.idx }}'}
    target:
      entity_id: [light.l1, light.l2]
    continue_on_error: true
  - parallel:
    - {event: m_12}
    - sequence:
      - {action: test.s13}
      - event: m_14
        event_data: {n: 14, v: '{{ trigger.id }}'}
      - {event: m_15}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 3
  send: {type: event, event_type: e1}
- at: 6
  set: [sensor.s2, '12']
- at: 7
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 8
  send: {type: service_result, call_id: 0, ok: true}
- at: 9
  send: {type: service_result, call_id: 1, ok: true}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 14
  send: {type: event, event_type: e3}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 17
  send: {type: event, event_type: e1}
- at: 18
  send: {type: event, event_type: e3}
- at: 19
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 21
  send: {type: service_result, call_id: 2, ok: true}
- at: 22
  set: [sensor.s1, '8']
- at: 22
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 26
  set: [input_boolean.b1, 'on']

# random scenario, seed 101, index 246 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l2, attribute: lvl, id: beta}
  - {trigger: state, entity_id: sensor.s1, not_to: '7.5', for: '{{ 2 }}', id: beta}
  conditions:
  - condition: trigger
    id: [beta, '0']
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.platform }}'}
  - {event: m_2}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    timeout: 2
    continue_on_timeout: false
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: sensor.s2}
  - {trigger: time, at: '22:13:26'}
  - {trigger: event, event_type: e1}
  actions:
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: input_boolean.b1, to: 'on', not_from: 'off'}
    timeout: {seconds: 2}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 4
  set: [input_boolean.b1, unavailable]
- at: 4
  set: [light.l2, unavailable]
- at: 5
  set: [sensor.s2, abc]
  attributes: {lvl: 1}
- at: 6
  send: {type: event, event_type: e2}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 11
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 12
  send: {type: event, event_type: e3}
- at: 15
  set: [light.l1, 'off']
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e1}
- at: 19
  send: {type: event, event_type: tick}
- at: 22
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 23
  set: [sensor.s1, unavailable]

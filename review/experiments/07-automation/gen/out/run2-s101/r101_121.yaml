# random scenario, seed 101, index 121 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: light.l2
    to: 'off'
    from: ['off', 'on']
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.b1
      to: 'on'
      not_from: ['on', unavailable]
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.id }}'}
    response_variable: v1
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  - wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'
    timeout: {seconds: 2}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
    id: beta
  - {trigger: time, at: '22:13:26'}
  conditions:
  - {condition: time, after: '22:13:25'}
  - {condition: trigger, id: alpha}
  actions:
  - {stop: s, error: true}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.id }}'}
  - {stop: s}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
    id: alpha
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  conditions:
  - {condition: time, before: '22:13:30', weekday: tue}
  actions:
  - repeat:
      while:
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: or
              conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              - '{{ states(''sensor.s1'') | int > 5 }}'
              - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - {event: m_6}
          - wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'
            timeout: {seconds: 2}
            enabled: false
          - event: m_8
            event_data: {n: 8, completed: '{{ wait.completed }}'}
          - repeat:
              until: ['{{ repeat.index >= 3 }}']
              sequence:
              - {delay: 2}
              - event: m_7
                event_data: {n: 7, v: '{{ trigger.idx }}'}
      - parallel:
        - event: m_9
          event_data: {n: 9, v: '{{ this.attributes.current }}'}
        - {event: m_10}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}'}
  - {event: m_11}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: abc
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 2
  set: [sensor.s2, '7.5']
- at: 3
  send: {type: event, event_type: e3}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 6
  send: {type: event, event_type: e3}
- at: 9
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 10
  set: [sensor.s1, '20']
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 17
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 18
  send: {type: event, event_type: tick}
- at: 21
  set: [sensor.s2, '8']

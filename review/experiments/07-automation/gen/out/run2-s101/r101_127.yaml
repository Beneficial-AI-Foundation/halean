# random scenario, seed 101, index 127 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
  actions:
  - if:
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9, enabled: false}
      - condition: or
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      - condition: state
        entity_id: [light.l1, input_boolean.b1]
        state: 'on'
        match: any
    then:
    - parallel:
      - {event: m_1}
      - sequence:
        - if:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          then:
          - delay: {seconds: '{{ 2 }}'}
          else:
          - event: m_2
            event_data: {n: 2, v: '{{ trigger.idx }}'}
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
          - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
      - event: m_3
        event_data: {n: 3, v: '{{ trigger.platform }}'}
    continue_on_error: true
  - event: m_4
    event_data: {n: 4, v: '{{ trigger.description }}'}
  - action: test.s5
    data: {n: 5, v: '{{ this.attributes.current }}'}
  - parallel:
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
    - sequence:
      - wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
        timeout: {seconds: 2}
        continue_on_timeout: false
      - event: m_8
        event_data: {n: 8, completed: '{{ wait.completed }}'}
      - action: test.s7
        target:
          entity_id: [light.l1, light.l2]
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: light.l1, from: unavailable, to: 'off'}
  actions:
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - repeat:
      count: 1
      sequence:
      - {delay: '{{ 1 }}'}
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
- alias: a2
  id: id2
  triggers:
  - {trigger: time_pattern, seconds: /3}
  - trigger: state
    entity_id: input_boolean.b1
    not_from: 'on'
    to: ['off', 'on']
  actions:
  - {stop: s}
  - condition: not
    conditions:
    - condition: or
      conditions:
      - {condition: state, entity_id: sensor.s2, state: '20', for: '00:00:03'}
      - {condition: state, entity_id: light.l2, state: 'on'}
    - {condition: time, before: '22:13:30'}
  - variables: {v1: 1}
  - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 3
  set: [sensor.s1, unknown]
- at: 4
  set: [sensor.s1, '4']
- at: 5
  set: [sensor.s1, '20']
- at: 6
  set: [light.l1, 'off']
- at: 7
  send: {type: event, event_type: e1}
- at: 10
  set: [sensor.s1, '1']
- at: 11
  set: [input_boolean.b1, unavailable]
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l2, unavailable]
- at: 19
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 22
  set: [light.l1, 'off']

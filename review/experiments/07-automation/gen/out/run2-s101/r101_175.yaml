# random scenario, seed 101, index 175 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e1}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
  - condition: not
    conditions:
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - condition: trigger
      id: [beta, '0']
    enabled: false
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: input_boolean.b1
    not_from: unavailable
    for: {seconds: '{{ 1 + 1 }}'}
  - {trigger: time, at: '22:13:33'}
  actions:
  - {stop: s}
  - if:
    - and:
      - {condition: time, after: '23:00:00', before: '06:00'}
      - {condition: time, before: '22:14'}
    then:
    - repeat:
        count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
        sequence:
        - {condition: numeric_state, entity_id: sensor.s1, above: 3}
      continue_on_error: true
    else:
    - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.description }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 1, continue_on_timeout: false}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  - {stop: s}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 3
  set: [sensor.s1, '4']
- at: 3
  set: [light.l2, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 8
  set: [input_boolean.b1, unavailable]
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, '12']
- at: 11
  set: [sensor.s1, '8']
- at: 13
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 14
  set: [light.l2, 'on']
- at: 14
  set: [sensor.s1, '7.5']
  attributes: {lvl: 2}
- at: 16
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 19
  set: [light.l1, 'off']
- at: 19
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 22
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 25
  send:
    type: event
    event_type: e1
    data: {k: true}

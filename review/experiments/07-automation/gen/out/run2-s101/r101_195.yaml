# random scenario, seed 101, index 195 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10, id: alpha}
  conditions:
  - not:
    - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    enabled: false
  actions:
  - {event: m_1}
  - action: test.s2
    data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
- alias: a1
  id: id1
  triggers:
  - {trigger: time_pattern, seconds: 31}
  - {trigger: state, entity_id: sensor.s1, to: '4'}
  - {trigger: event, event_type: e3, id: beta}
  actions:
  - choose:
    - conditions:
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - condition: or
        conditions:
        - {condition: time, before: '06:00', weekday: tue}
        - condition: state
          entity_id: sensor.s1
          state: ['20', unknown]
        - or:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - {condition: state, entity_id: sensor.s1, state: '12'}
      sequence:
      - action: test.s3
        data: {n: 3, v: '{{ this.attributes.current }}'}
      - parallel:
        - sequence:
          - choose:
            - conditions:
              - or:
                - condition: trigger
                  id: [beta, '0']
                - {condition: state, entity_id: sensor.s2, state: '12'}
              sequence:
              - {condition: time, before: '22:13:30'}
              - {action: test.s4}
            - conditions:
              - condition: and
                conditions:
                - '{{ trigger.id == ''0'' }}'
                - condition: not
                  conditions:
                  - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
                  - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
                  - {condition: state, entity_id: light.l2, state: 'off'}
                - condition: and
                  conditions:
                  - {condition: state, entity_id: sensor.s2, state: '1'}
              sequence:
              - action: test.s5
                data: {n: 5, v: '{{ trigger.platform }}'}
                continue_on_error: true
        - sequence:
          - repeat:
              while:
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
              - '{{ repeat.index <= 2 }}'
              sequence:
              - {condition: time, before: '22:14', weekday: tue}
              - delay: {seconds: '{{ 2 }}'}
        - {event: m_6}
    - conditions:
      - or:
        - condition: or
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - {condition: trigger, id: alpha}
      sequence:
      - condition: or
        conditions:
        - condition: trigger
          id: [beta, '0']
        - and:
          - {condition: trigger, id: '1'}
          - {condition: numeric_state, entity_id: sensor.s2, above: 3}
          - {condition: trigger, id: '1'}
        - {condition: time, before: '22:14', weekday: tue}
  - {delay: '{{ 1 }}'}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 1}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 12
  set: [light.l1, 'off']
- at: 13
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 19
  send: {type: event, event_type: e2}
- at: 20
  set: [light.l1, 'on']
- at: 21
  set: [sensor.s2, '7.5']
  attributes: {lvl: 3}
- at: 22
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 25
  set: [light.l2, 'off']
- at: 27
  set: [sensor.s2, '20']
- at: 28
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 29
  send: {type: event, event_type: tick}

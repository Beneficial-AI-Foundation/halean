# random scenario, seed 101, index 219 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 9}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.idx }}'}
    target: {entity_id: light.l1}
  - condition: not
    conditions:
    - {condition: trigger, id: alpha}
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - delay: {seconds: 1}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9, enabled: false}
      - or:
        - condition: or
          conditions:
          - {condition: trigger, id: alpha}
        - condition: trigger
          id: [beta, '0']
      sequence:
      - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1, continue_on_timeout: false}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
    - conditions:
      - {condition: trigger, id: '0'}
      sequence:
      - wait_for_trigger:
        - trigger: event
          event_type: e1
          event_data: {k: a}
        timeout: 2
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - sequence:
      - event: m_4
        event_data: {n: 4, v: '{{ trigger.description }}'}
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.description }}'}
    - action: test.s6
      data: {n: 6, v: '{{ trigger.description }}'}
      target:
        entity_id: [light.l1, light.l2]
    - repeat:
        for_each: [a, b]
        sequence:
        - choose:
          - conditions: ['{{ trigger.platform == ''event'' }}']
            sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ this.attributes.current }}'}
          - conditions:
            - condition: or
              conditions:
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
              - {condition: time, after: '23:00:00'}
            sequence:
            - event: m_8
              event_data: {n: 8, v: '{{ trigger.platform }}'}
              enabled: false
            - event: m_9
              event_data: {n: 9, v: '{{ states(''light.l1'') }}'}
            - variables: {v1: 1}
          enabled: false
  - {delay: 0}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [sensor.s2, '4']
- at: 1
  set: [sensor.s1, '12']
- at: 4
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s1, '4']
- at: 9
  send: {type: event, event_type: e1}
- at: 11
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 12
  set: [sensor.s1, unknown]
- at: 15
  set: [sensor.s1, abc]
- at: 16
  send: {type: event, event_type: e1}

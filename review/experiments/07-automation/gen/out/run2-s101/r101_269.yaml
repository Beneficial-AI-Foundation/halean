# random scenario, seed 101, index 269 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_from: 1, attribute: lvl, id: beta}
  conditions: ['{{ trigger.platform == ''event'' }}']
  actions:
  - if:
    - condition: trigger
      id: [beta, '0']
    - condition: trigger
      id: [beta, '0']
    then:
    - {stop: s}
    - sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
    else:
    - action: test.s2
      data: {n: 2, v: '{{ states(''light.l1'') }}'}
      response_variable: v2
    - if:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      then:
      - parallel:
        - sequence:
          - event: m_3
            event_data: {n: 3, v: '{{ states(''sensor.s1'') }}', var: '{{ v2 | default(''undef'') }}'}
          - {action: test.s4}
          - action: test.s5
            data: {n: 5, v: '{{ states(''light.l1'') }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            enabled: false
        - sequence:
          - delay: {seconds: 1}
          - {event: m_6}
      - event: m_7
        event_data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - action: test.s8
    data: {n: 8, v: '{{ now().second }}'}
  - parallel:
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.idx }}'}
    - sequence:
      - {event: m_10}
      - choose:
        - conditions: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 3 }}']
              sequence:
              - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
          - action: test.s11
            data: {n: 11, v: '{{ states(''sensor.s1'') }}'}
          - parallel:
            - sequence:
              - action: test.s12
                data: {n: 12, v: '{{ states(''sensor.s1'') }}'}
              - {delay: 2}
            - sequence:
              - {delay: 0}
              - action: test.s13
                data: {n: 13, v: '{{ states(''sensor.s1'') }}'}
                target:
                  entity_id: [light.l1, light.l2]
                continue_on_error: true
        - conditions: ['{{ trigger.id == ''0'' }}']
          sequence:
          - {event: m_14}
          - repeat:
              count: 1
              sequence:
              - {event: m_15}
          - parallel:
            - {event: m_16}
            - sequence:
              - event: m_17
                event_data: {n: 17, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              - action: test.s18
                data: {n: 18, v: '{{ trigger.description }}'}
    continue_on_error: true
  - {event: m_19}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: state, entity_id: sensor.s2}
  - {trigger: state, entity_id: sensor.s1, from: 2, attribute: lvl, id: beta}
  conditions:
  - condition: not
    conditions:
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - {delay: 2}
  - {action: test.s20}
  - event: m_21
    event_data: {n: 21, v: '{{ trigger.idx }}'}
  - parallel:
    - sequence:
      - condition: not
        conditions:
        - {condition: state, entity_id: sensor.s2, state: '12'}
        - {condition: time, after: '22:00', before: '06:00'}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
      - parallel:
        - event: m_22
          event_data: {n: 22, v: '{{ now().second }}'}
        - event: m_23
          event_data: {n: 23, v: '{{ trigger.id }}'}
    - sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        - condition: not
          conditions:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        then:
        - choose:
          - conditions:
            - condition: not
              conditions:
              - {condition: time, before: '22:14'}
            - condition: or
              conditions:
              - {condition: trigger, id: '1'}
            sequence:
            - delay: {seconds: 1}
            - variables: {v1: x}
        else:
        - {wait_template: '{{ trigger.id == ''0'' }}'}
        - event: m_24
          event_data: {n: 24, completed: '{{ wait.completed }}'}
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        enabled: false
    - sequence:
      - parallel:
        - sequence:
          - {condition: time, before: '22:14'}
        - sequence:
          - {stop: s}
          - if:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
            then:
            - {delay: '{{ 1 }}'}
            - {delay: '00:00:02'}
            else:
            - action: test.s25
              data: {n: 25, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - {event: m_26}
    continue_on_error: true
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - event: m_27
        event_data: {n: 27, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}

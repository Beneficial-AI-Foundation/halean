# random scenario, seed 101, index 297 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
  - trigger: state
    entity_id: [input_boolean.b1, light.l2]
    to: 'off'
    from: ['off', unavailable]
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
    continue_on_error: true
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
- alias: a1
  id: id1
  variables: {v1: 0, v2: 0}
  triggers:
  - trigger: state
    entity_id: [light.l1, input_boolean.b1]
    from: 'on'
  actions:
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - {action: test.s3}
- alias: a2
  id: id2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e3, id: alpha}
  actions:
  - action: test.s4
    data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - variables: {v1: 1}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [input_boolean.b1, unavailable]
- at: 4
  set: [sensor.s2, '20']
- at: 5
  set: [light.l1, unavailable]
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 9
  send: {type: event, event_type: e3}
- at: 9
  send: {type: service_result, call_id: 0, ok: true}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: e2}
- at: 11
  set: [sensor.s2, '20']
  attributes: {lvl: 2}

# random scenario, seed 101, index 173 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: event, event_type: e3}
  actions:
  - {stop: s, error: true}
  - variables: {v1: x}
  - {delay: 1}
  - {stop: s}
  - {stop: s}
- alias: a1
  id: id1
  triggers:
  - {trigger: time, at: '22:13:29'}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', for: 1}
  - trigger: state
    entity_id: [sensor.s2, light.l1]
  actions:
  - if:
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
    then:
    - action: test.s1
      data: {n: 1, v: '{{ trigger.description }}'}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - variables: {v1: 1}
      - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 2}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - action: test.s2
        data: {n: 2, v: '{{ trigger.idx }}'}
        continue_on_error: true
  - if:
    - and:
      - condition: or
        conditions:
        - {condition: trigger, id: alpha}
        - condition: time
          before: '22:13:30'
          weekday: [tue]
      - or:
        - condition: trigger
          id: [beta, '0']
        - '{{ states(''sensor.s2'') | float(0) < 5 }}'
        enabled: false
    then:
    - {event: m_3}
  - if:
    - condition: or
      conditions:
      - condition: or
        conditions:
        - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
        - condition: trigger
          id: [beta, '0']
          enabled: false
        - '{{ states(''sensor.s1'') | int > 5 }}'
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    then:
    - parallel:
      - sequence:
        - sequence:
          - action: test.s4
            data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            target:
              entity_id: [light.l1, light.l2]
            continue_on_error: true
          - {action: test.s5}
        - repeat:
            count: 2
            sequence:
            - condition: state
              entity_id: sensor.s2
              state: ['7.5', '12']
      - sequence:
        - if:
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          then:
          - {delay: 0}
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - action: test.s6
              data: {n: 6, v: '{{ trigger.platform }}'}
              continue_on_error: true
            - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15, enabled: false}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: queued
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, sensor.s1]
    for: '{{ 2 }}'
  - {trigger: state, entity_id: light.l1, for: 2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - event: m_7
    event_data: {n: 7, v: '{{ this.attributes.current }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.s1
      for: {seconds: '{{ 1 + 1 }}'}
    - trigger: state
      entity_id: [input_boolean.b1]
      from: 'off'
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s2, '7.5']
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 5
  send: {type: service_result, call_id: 0, ok: false, error_kind: invalid}
- at: 8
  set: [input_boolean.b1, 'on']
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 9
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 10
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 10
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 11
  send: {type: service_result, call_id: 2, ok: true}
- at: 11
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: e1}
- at: 15
  send:
    type: service_result
    call_id: 3
    ok: true
    response: {value: x}
- at: 17
  set: [sensor.s2, '8']
  attributes: {lvl: 1}
- at: 20
  send: {type: event, event_type: tick}
- at: 22
  send: {type: service_result, call_id: 5, ok: true}
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 26
  send: {type: service_result, call_id: 4, ok: true}
- at: 27
  set: [light.l2, 'off']
- at: 29
  set: [sensor.s2, '20']

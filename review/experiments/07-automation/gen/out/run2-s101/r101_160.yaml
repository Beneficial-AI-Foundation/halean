# random scenario, seed 101, index 160 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
  conditions:
  - {condition: time, after: '22:13:25', enabled: false}
  actions:
  - {condition: time, after: '22:00', before: '22:14'}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
    enabled: false
  - {delay: '00:00:02', enabled: false}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 3
  send: {type: event, event_type: e2}
- at: 4
  set: [sensor.s2, unavailable]
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 8
  send: {type: event, event_type: e2}
- at: 9
  set: [sensor.s2, '7.5']
- at: 12
  send: {type: event, event_type: e2}
- at: 12
  set: [sensor.s1, '12']
- at: 12
  send: {type: event, event_type: tick}
- at: 14
  set: [input_boolean.b1, unavailable]
- at: 14
  set: [sensor.s2, '1']
- at: 15
  set: [sensor.s2, '4']
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 21
  send: {type: event, event_type: e2}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 23
  send: {type: event, event_type: e3}

# random scenario, seed 101, index 299 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  conditions:
  - {condition: state, entity_id: light.gone, state: 'off'}
  actions:
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.idx }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [sensor.s1, unavailable]
  attributes: {lvl: 1}
- at: 2
  set: [light.l1, 'off']
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 4
  send: {type: event, event_type: e3}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 10
  set: [sensor.s1, unavailable]
  attributes: {lvl: 2}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  set: [sensor.s2, '12']
- at: 14
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 15
  send: {type: event, event_type: tick}

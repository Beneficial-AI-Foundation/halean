# random scenario, seed 101, index 141 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: time, at: '22:13:33'}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: 0, continue_on_timeout: false}
  - parallel:
    - {event: m_1}
    - sequence:
      - sequence:
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - repeat:
            while:
            - {condition: trigger, id: '0'}
            - '{{ repeat.index <= 1 }}'
            sequence:
            - action: test.s2
              data: {n: 2, v: '{{ trigger.platform }}'}
              target: {entity_id: light.l1}
              response_variable: v1
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
            - event: m_3
              event_data: {n: 3, v: '{{ states(''light.l1'') }}'}
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - sequence:
        - choose:
          - conditions:
            - {condition: state, entity_id: sensor.s2, state: '7.5'}
            sequence:
            - {condition: trigger, id: alpha}
            - event: m_4
              event_data: {n: 4, v: '{{ trigger.platform }}'}
          - conditions:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - '{{ states(''sensor.s2'') | float(0) < 9 }}'
            sequence:
            - {delay: 2}
            - event: m_5
              event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          default:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: '{{ 2 }}'}
        - event: m_8
          event_data: {n: 8, completed: '{{ wait.completed }}'}
        - choose:
          - conditions:
            - {condition: trigger, id: '0'}
            - condition: state
              entity_id: sensor.s2
              state: ['7.5', '20']
            sequence:
            - event: m_6
              event_data: {n: 6, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
            - action: test.s7
              data: {n: 7, v: '{{ states(''sensor.s1'') }}'}
          default:
          - variables: {v2: x}
      - repeat:
          count: 0
          sequence:
          - parallel:
            - event: m_9
              event_data: {n: 9, v: '{{ states(''sensor.s1'') }}'}
            - {event: m_10}
            - sequence:
              - event: m_11
                event_data: {n: 11, v: '{{ trigger.idx }}'}
          - {delay: 2}
  - action: test.s12
    data: {n: 12, v: '{{ trigger.platform }}'}
    response_variable: v3
  - choose:
    - conditions: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
      sequence:
      - {delay: '{{ 1 }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: sensor.s2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - trigger: state
    entity_id: light.l2
    from: 'on'
    to: [unavailable, 'on']
  actions:
  - {event: m_13}
  - if:
    - or:
      - {condition: trigger, id: '0'}
      - condition: and
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        - {condition: time, before: '22:13:30'}
        - {condition: state, entity_id: sensor.s1, state: unavailable}
    then:
    - variables: {v1: x}
    - wait_for_trigger:
      - {trigger: event, event_type: e2}
      - trigger: event
        event_type: e3
        event_data: {k: a}
      timeout: 3
      continue_on_timeout: false
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      timeout: 0
      continue_on_timeout: false
    else:
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id: sensor.s2
        above: 6
        below: 15
        for: {seconds: 2}
      - trigger: event
        event_type: e2
        event_data: {k: a}
      timeout: 0
  - parallel:
    - sequence:
      - condition: not
        conditions:
        - {condition: trigger, id: alpha}
        - and:
          - {condition: time, after: '23:00:00', before: '22:14'}
      - sequence:
        - {event: m_14}
    - event: m_15
      event_data: {n: 15, v: '{{ trigger.description }}'}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s2, not_to: abc, from: '4', for: '{{ 2 }}'}
  - {trigger: event, event_type: e1}
  - {trigger: state, entity_id: light.l2, from: 'on', to: 'on'}
  conditions:
  - {condition: time, after: '23:00:00', before: '22:14', weekday: tue}
  actions:
  - {action: test.s16}
  - {event: m_17}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - '{{ is_state(''light.l1'', ''on'') }}'
        then:
        - choose:
          - conditions:
            - '{{ states(''sensor.s1'') | int > 5 }}'
            - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
            sequence:
            - action: test.s18
              data: {n: 18, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - action: test.s19
              data: {n: 19, v: '{{ trigger.platform }}'}
              response_variable: v1
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - conditions:
            - {condition: trigger, id: alpha}
            - condition: state
              entity_id: sensor.s2
              state: [abc, '7.5']
            sequence:
            - {action: test.s20}
            - action: test.s21
              data: {n: 21, v: '{{ states(''sensor.s1'') }}'}
              target:
                entity_id: [light.l1, light.l2]
              continue_on_error: true
          default:
          - {event: m_22}
          - {condition: time, after: '23:00:00', before: '06:00'}
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - {delay: 1}
        else:
        - choose:
          - conditions:
            - condition: or
              conditions:
              - {condition: time, after: '23:00:00', before: '06:00'}
              - condition: state
                entity_id: light.l1
                state: ['on', 'off']
            sequence:
            - action: test.s23
              data: {n: 23, v: '{{ trigger.platform }}'}
              continue_on_error: true
            - event: m_24
              event_data: {n: 24, v: '{{ trigger.description }}'}
          - conditions:
            - condition: and
              conditions:
              - {condition: time, after: '23:00:00', before: '06:00'}
            sequence:
            - event: m_25
              event_data: {n: 25, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - event: m_26
              event_data: {n: 26, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
        - {condition: state, entity_id: sensor.s1, state: unavailable}
    - conditions:
      - and:
        - {condition: trigger, id: '1'}
        - and:
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
          - condition: state
            entity_id: [sensor.s1]
            state: 'on'
            match: any
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      sequence:
      - {stop: s, error: true}
      - choose:
        - conditions:
          - {condition: time, after: '22:13:25', before: '22:14'}
          - condition: state
            entity_id: [sensor.s2]
            state: 'on'
            match: any
          sequence:
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: [sensor.s2, light.l2]
              state: 'on'
              match: any
            - '{{ states(''sensor.s1'') | int > 5 }}'
          - condition: state
            entity_id: light.l2
            state: ['off', unavailable]
          sequence:
          - {action: test.s27, continue_on_error: true}
          - parallel:
            - {event: m_28}
            - sequence:
              - condition: or
                conditions:
                - {condition: state, entity_id: light.l2, state: 'on'}
                - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        default:
        - {stop: s}
        - sequence:
          - delay: {seconds: 1}
          - {event: m_29}
    default:
    - event: m_30
      event_data: {n: 30, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  - {event: m_31}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 1
  set: [input_boolean.b1, unavailable]
- at: 4
  set: [light.l2, 'off']
- at: 7
  set: [input_boolean.b1, 'on']
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s2, '1']
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 13
  set: [light.l2, 'on']
- at: 15
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  send: {type: event, event_type: e3}
- at: 17
  set: [light.l1, 'off']
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [sensor.s1, '12']
- at: 24
  send: {type: event, event_type: tick}

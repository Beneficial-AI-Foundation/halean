# random scenario, seed 101, index 19 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: 23}
  actions:
  - variables: {v1: x}
  - {stop: s, error: true}
  - repeat:
      for_each:
      - {k: 1}
      - null
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ trigger.platform }}'}
      - variables: {v1: 1}
  - choose:
    - conditions:
      - condition: not
        conditions:
        - {condition: time, after: '22:13:25'}
      sequence:
      - {delay: '{{ 1 }}'}
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2, continue_on_timeout: false}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
    - conditions:
      - condition: and
        conditions:
        - '{{ states(''sensor.s2'') | float(0) < 15 }}'
        - condition: and
          conditions:
          - {condition: trigger, id: '1'}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          - '{{ trigger.id == ''0'' }}'
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
      - {condition: time, after: '22:00'}
      sequence:
      - if:
        - not:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6}
          - condition: trigger
            id: [beta, '0']
        then:
        - {action: test.s3}
        - {action: test.s4, response_variable: v3}
    default:
    - event: m_5
      event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - choose:
    - conditions:
      - {condition: trigger, id: '1'}
      sequence:
      - variables: {v4: 1}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 1}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 1
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 2
  set: [sensor.s2, abc]
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 4
  set: [sensor.s2, '8']
- at: 5
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: e2}
- at: 11
  set: [sensor.s2, '4']
- at: 12
  set: [sensor.s2, '7.5']
- at: 13
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 14
  set: [input_boolean.b1, 'off']
- at: 15
  send: {type: event, event_type: e1}
- at: 18
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s1, '7.5']
- at: 20
  set: [light.l1, unavailable]
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  set: [sensor.s1, '12']
- at: 23
  send: {type: event, event_type: e2}

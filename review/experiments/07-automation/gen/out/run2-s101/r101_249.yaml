# random scenario, seed 101, index 249 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}', for: 2, id: alpha}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ this.attributes.current }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e1}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e1}
    timeout: 1
    continue_on_timeout: false
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.idx }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: abc}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [sensor.s1, '4']
- at: 2
  set: [light.l2, unavailable]
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [light.l2, 'off']
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: e1}
- at: 10
  set: [light.l1, 'on']
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 17
  set: [sensor.s2, '4']
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s2, unknown]
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 20
  set: [sensor.s2, '1']
- at: 20
  set: [light.l1, unavailable]

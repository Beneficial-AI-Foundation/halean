# random scenario, seed 101, index 218 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: 31}
  - {trigger: event, event_type: e3, id: alpha}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
  actions:
  - {action: test.s1}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - condition: not
          conditions:
          - {condition: time, before: '22:14'}
        - {condition: trigger, id: '0'}
      - '{{ is_state(''light.l2'', ''off'') }}'
      sequence:
      - parallel:
        - sequence:
          - action: test.s2
            data: {n: 2, v: '{{ trigger.id }}'}
            target: {entity_id: light.l1}
        - sequence:
          - {stop: s}
          - parallel:
            - sequence:
              - action: test.s3
                data: {n: 3, v: '{{ states(''light.l1'') }}'}
                continue_on_error: true
              - delay: {seconds: '{{ 2 }}'}
            - sequence:
              - delay: {seconds: 1}
        - sequence:
          - wait_for_trigger:
            - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}'}
            - trigger: state
              entity_id: [sensor.s1, light.l1]
              not_to: ['4', '8']
            timeout: 1
            continue_on_timeout: false
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - repeat:
              count: 1
              sequence:
              - variables: {v1: '{{ states(''sensor.s1'') }}'}
              - event: m_4
                event_data: {n: 4, v: '{{ trigger.platform }}'}
          - repeat:
              count: 2
              sequence:
              - {delay: '{{ 1 }}'}
            enabled: false
        continue_on_error: true
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '{{ 2 }}'}
      - event: m_6
        event_data: {n: 6, completed: '{{ wait.completed }}'}
    default:
    - {stop: s}
    - delay: {seconds: '{{ 2 }}'}
    - repeat:
        while:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - '{{ repeat.index <= 3 }}'
        sequence:
        - sequence:
          - {action: test.s7}
        - {stop: s}
  variables: {v1: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - trigger: state
    entity_id: sensor.s2
    to: ['8', abc]
  actions:
  - {condition: time, after: '22:13:25', before: '22:13:30', enabled: false}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l1, unavailable]
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 9
  set: [sensor.s1, '1']
- at: 10
  set: [light.l2, 'on']
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 13
  send: {type: service_result, call_id: 0, ok: true}
- at: 14
  set: [light.l2, 'off']
- at: 14
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 15
  set: [light.l1, 'off']
- at: 16
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 17
  set: [sensor.s1, '7.5']
- at: 19
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: e2}
- at: 21
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 21
  send: {type: event, event_type: e1}
- at: 21
  set: [light.l2, 'on']
- at: 22
  send: {type: event, event_type: e2}
- at: 23
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 24
  set: [sensor.s2, '4']
- at: 25
  send: {type: service_result, call_id: 2, ok: true}
- at: 27
  send: {type: event, event_type: e1}

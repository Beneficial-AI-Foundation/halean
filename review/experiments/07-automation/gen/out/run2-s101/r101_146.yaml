# random scenario, seed 101, index 146 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - variables: {v2: x}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: 0}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
  - trigger: event
    event_type: e1
    event_data: {k: true}
  actions:
  - {stop: s}
  - repeat:
      count: 0
      sequence:
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          sequence:
          - {event: m_2}
          - wait_for_trigger:
            - {trigger: state, entity_id: light.l2, from: unavailable, to: 'off'}
            timeout: 1
          - event: m_3
            event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - conditions:
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', enabled: false}
          sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ states(''light.l1'') }}'}
          - parallel:
            - sequence:
              - event: m_5
                event_data: {n: 5, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
              - {delay: '{{ 1 }}'}
              - {delay: 0}
            - sequence:
              - event: m_6
                event_data: {n: 6, v: '{{ trigger.idx }}'}
          - {delay: 2}
    continue_on_error: true
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - action: test.s7
    data: {n: 7, v: '{{ trigger.id }}'}
  - repeat:
      while:
      - and:
        - not:
          - {condition: time, before: '22:13:30'}
          - {condition: time, after: '22:13:25', before: '22:13:30'}
        enabled: false
      - '{{ repeat.index <= 1 }}'
      sequence:
      - {condition: time, after: '23:00:00'}
      - action: test.s8
        data: {n: 8, v: '{{ trigger.platform }}'}
      - parallel:
        - sequence:
          - condition: or
            conditions:
            - {condition: time, before: '06:00'}
            - condition: and
              conditions:
              - {condition: time, after: '22:00', before: '06:00'}
              - {condition: time, before: '06:00'}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
        continue_on_error: true
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /9, id: beta}
  - {trigger: state, entity_id: light.l2, to: 'off', id: alpha}
  conditions:
  - {condition: state, entity_id: light.gone, state: 'on'}
  actions:
  - {event: m_10}
  - sequence:
    - {stop: s}
    - if:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      then:
      - choose:
        - conditions:
          - condition: and
            conditions:
            - {condition: trigger, id: '0'}
            - {condition: trigger, id: '0'}
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          - {condition: time, before: '22:14'}
          sequence:
          - action: test.s11
            data: {n: 11, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            response_variable: v1
        default:
        - {delay: '00:00:02'}
      - variables: {v1: x}
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          sequence:
          - {event: m_12}
          - event: m_13
            event_data: {n: 13, v: '{{ states(''sensor.s1'') }}'}
  - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
  - sequence:
    - {action: test.s14}
    - variables: {v4: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [sensor.s2, unavailable]
- at: 2
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e3}
- at: 8
  set: [input_boolean.b1, 'off']
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 12
  send: {type: event, event_type: tick}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'off']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l2, 'on']
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: e3}
- at: 20
  set: [input_boolean.b1, unavailable]
- at: 21
  set: [light.l2, unavailable]
- at: 22
  set: [light.l2, 'on']
- at: 23
  set: [sensor.s1, '8']
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 27
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 27
  set: [light.l2, 'off']
- at: 28
  send: {type: event, event_type: tick}
- at: 30
  set: [light.l1, 'on']
  attributes: {lvl: 2}

# random scenario, seed 101, index 190 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: [unavailable, unknown]
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - or:
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    enabled: false
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - wait_template: '{{ is_state(''light.l2'', ''off'') }}'
    timeout: {seconds: 2}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s2, unavailable]
- at: 2
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s2, '12']
  attributes: {lvl: 3}
- at: 6
  set: [light.l2, 'on']
- at: 7
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 8
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 12
  send: {type: event, event_type: e3}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 17
  set: [light.l1, 'off']
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  send: {type: event, event_type: e2}
- at: 21
  set: [sensor.s1, '20']
- at: 23
  send: {type: event, event_type: e2}

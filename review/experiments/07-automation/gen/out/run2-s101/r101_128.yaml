# random scenario, seed 101, index 128 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  actions:
  - {stop: s}
  - {stop: s}
  - {delay: '00:00:02'}
  - repeat:
      count: 0
      sequence:
      - condition: trigger
        id: [beta, '0']
      - {condition: state, entity_id: sensor.s2, state: '12', enabled: false}
      - action: test.s1
        data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
- alias: a1
  id: id1
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: unknown}
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: [light.l2]
      state: 'on'
      match: any
  actions:
  - if:
    - condition: not
      conditions:
      - {condition: state, entity_id: input_boolean.b1, state: unavailable}
      - {condition: trigger, id: alpha}
    then:
    - {action: test.s2, enabled: false}
  - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - sequence:
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
    - repeat:
        count: '{{ 2 }}'
        sequence:
        - sequence:
          - {delay: 1}
          - {condition: trigger, id: '1'}
        - sequence:
          - {delay: 1}
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
    continue_on_error: true
  - delay: {seconds: '{{ 2 }}'}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 1}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e2}
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 5
  set: [light.l1, unavailable]
- at: 7
  set: [input_boolean.b1, 'off']
- at: 9
  set: [sensor.s1, abc]
- at: 10
  send: {type: event, event_type: e1}
- at: 11
  set: [light.l2, 'off']
- at: 12
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 13
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 15
  set: [input_boolean.b1, unavailable]
- at: 18
  set: [sensor.s2, abc]
- at: 19
  set: [sensor.s1, unknown]
- at: 22
  send: {type: event, event_type: e3}
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 26
  send: {type: event, event_type: e2}
- at: 26
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 26
  send: {type: event, event_type: e3}
- at: 29
  send: {type: event, event_type: tick}
- at: 32
  send: {type: event, event_type: tick}
- at: 33
  send: {type: event, event_type: tick}
- at: 34
  send: {type: event, event_type: e1}

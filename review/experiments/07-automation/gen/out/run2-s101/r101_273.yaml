# random scenario, seed 101, index 273 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  actions:
  - {event: m_1}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
  actions:
  - sequence:
    - {action: test.s3, response_variable: v1}
    - {action: test.s4, response_variable: v2}
    continue_on_error: true
  - parallel:
    - sequence:
      - sequence:
        - choose:
          - conditions:
            - not:
              - condition: trigger
                id: [beta, '0']
              - and:
                - {condition: time, after: '22:13:25', weekday: tue}
                - condition: time
                  after: '23:00:00'
                  before: '22:13:30'
                  weekday: [wed, mon]
                enabled: false
            sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v2 | default(''undef'') }}'}
            - variables: {v3: x}
          default:
          - {action: test.s6}
          - action: test.s7
            data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - event: m_8
            event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - {stop: s}
        - parallel:
          - event: m_9
            event_data: {n: 9, v: '{{ states(''light.l1'') }}', var: '{{ v2 | default(''undef'') }}'}
          - sequence:
            - {action: test.s10}
      - sequence:
        - parallel:
          - sequence:
            - action: test.s11
              data: {n: 11, v: '{{ trigger.idx }}'}
            - {delay: '00:00:02'}
          - sequence:
            - {condition: time, before: '06:00', enabled: false}
        - sequence:
          - {action: test.s12, continue_on_error: true}
          - action: test.s13
            data: {n: 13, v: '{{ trigger.description }}'}
            enabled: false
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - {event: m_14}
            - {delay: 2}
      - choose:
        - conditions:
          - condition: not
            conditions:
            - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
            - not:
              - condition: trigger
                id: [beta, '0']
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          sequence:
          - action: test.s15
            data: {n: 15, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            continue_on_error: true
            enabled: false
          - delay: {seconds: '{{ 2 }}'}
          - event: m_16
            event_data: {n: 16, v: '{{ states(''light.l1'') }}', var: '{{ v2 | default(''undef'') }}'}
        enabled: false
    - sequence:
      - action: test.s17
        data: {n: 17, v: '{{ trigger.id }}'}
        continue_on_error: true
      - {action: test.s18, continue_on_error: true}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, '20']
- at: 6
  set: [sensor.s1, '20']
  attributes: {lvl: 1}
- at: 6
  set: [light.l2, 'off']
- at: 8
  set: [input_boolean.b1, 'on']
- at: 8
  set: [sensor.s2, '20']
  attributes: {lvl: 2}
- at: 8
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 16
  send: {type: service_result, call_id: 3, ok: false, error_kind: other}
- at: 17
  set: [sensor.s2, '7.5']

# random scenario, seed 101, index 174 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  actions:
  - if:
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - not:
        - {condition: time, after: '22:13:25'}
        - '{{ states(''sensor.s1'') | int(0) > 10 }}'
      - condition: and
        conditions: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
    then:
    - action: test.s1
      data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
      continue_on_error: true
      response_variable: v1
    - wait_for_trigger:
      - {trigger: event, event_type: e2}
      - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
      timeout: 3
      continue_on_timeout: false
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    else:
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - parallel:
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
      - delay: {seconds: '{{ 2 }}'}
    - event: m_4
      event_data: {n: 4, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - repeat:
          count: 0
          sequence:
          - choose:
            - conditions:
              - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
              - {condition: state, entity_id: input_boolean.b1, state: 'on'}
              sequence:
              - action: test.s5
                data: {n: 5, v: '{{ trigger.idx }}'}
                target:
                  entity_id: [light.l1, light.l2]
                response_variable: v2
          - if:
            - {condition: state, entity_id: sensor.s1, state: '8'}
            - {condition: time, after: '23:00:00'}
            then:
            - action: test.s6
              target: {entity_id: light.l1}
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: [light.l2, input_boolean.b1]
    from: [unavailable, 'on']
    for: 1
  - {trigger: time, at: '22:13:29'}
  actions:
  - if:
    - {condition: trigger, id: '1'}
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
    then:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    else:
    - {stop: s}
  - choose:
    - conditions: ['{{ trigger.platform == ''event'' }}']
      sequence:
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, enabled: false}
          - '{{ trigger.id == ''0'' }}'
          sequence:
          - event: m_7
            event_data: {n: 7, v: '{{ trigger.id }}'}
        - conditions:
          - {condition: trigger, id: '0'}
          sequence:
          - choose:
            - conditions: ['{{ is_state(''light.l1'', ''on'') }}']
              sequence:
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
            - conditions:
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
              sequence:
              - {condition: trigger, id: alpha}
              - action: test.s8
                data: {n: 8, v: '{{ trigger.platform }}'}
              - {event: m_9}
          - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 1, continue_on_timeout: false}
          - event: m_10
            event_data: {n: 10, completed: '{{ wait.completed }}'}
      - action: test.s11
        data: {n: 11, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    default:
    - parallel:
      - {event: m_12}
      - sequence:
        - if:
          - and:
            - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            - or:
              - condition: state
                entity_id: sensor.s2
                state: ['1', '12']
                for: 2
              - condition: trigger
                id: [beta, '0']
              - condition: trigger
                id: [beta, '0']
          then:
          - {event: m_13}
        - action: test.s14
          data: {n: 14, v: '{{ states(''light.l1'') }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - sequence:
    - action: test.s15
      data: {n: 15, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [light.l1, 'on']
- at: 3
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 4
  set: [light.l2, 'on']
- at: 5
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 7
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 10
  send: {type: event, event_type: e3}
- at: 11
  set: [light.l1, unavailable]
- at: 14
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 15
  set: [sensor.s1, abc]
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 21
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 22
  send: {type: event, event_type: tick}
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 25
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 27
  send: {type: event, event_type: tick}
- at: 29
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 30
  set: [sensor.s1, unknown]
- at: 30
  send: {type: event, event_type: tick}
- at: 33
  send: {type: event, event_type: tick}
- at: 36
  send: {type: event, event_type: e2}
- at: 39
  send:
    type: event
    event_type: e2
    data: {k: 2}

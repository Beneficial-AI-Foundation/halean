# random scenario, seed 101, index 178 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    for: {seconds: 2}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - {condition: numeric_state, entity_id: sensor.s2, below: 9, enabled: false}
  - action: test.s2
    data: {n: 2, v: '{{ trigger.platform }}'}
    target:
      entity_id: [light.l1, light.l2]
  - event: m_3
    event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, for: 2, id: beta}
  - {trigger: time_pattern, seconds: 31}
  - {trigger: event, event_type: e2}
  actions:
  - {delay: 2}
  - parallel:
    - {event: m_4}
    - sequence:
      - choose:
        - conditions:
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
            - {condition: time, before: '22:13:30'}
          sequence:
          - wait_for_trigger:
            - {trigger: state, entity_id: input_boolean.b1, from: 'off', for: '00:00:02'}
            timeout: 1
          - event: m_6
            event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - action: test.s5
            target: {entity_id: light.l1}
            continue_on_error: true
        - conditions:
          - condition: or
            conditions:
            - not:
              - {condition: time, after: '23:00:00', before: '06:00'}
              - '{{ is_state(''light.l2'', ''off'') }}'
          sequence:
          - {stop: s}
          - sequence:
            - variables: {v1: 1}
            - delay: {seconds: 1}
            continue_on_error: true
      - repeat:
          until:
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - if:
            - {condition: time, after: '23:00:00', before: '06:00'}
            then:
            - {event: m_7}
            - action: test.s8
              data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
              response_variable: v2
      - parallel:
        - event: m_9
          event_data: {n: 9, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v2 | default(''undef'') }}'}
        - sequence:
          - parallel:
            - sequence:
              - action: test.s10
                data: {n: 10, v: '{{ states(''light.l1'') }}'}
              - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
            - sequence:
              - action: test.s11
                data: {n: 11, v: '{{ states(''light.l1'') }}'}
              - {action: test.s12}
  - wait_for_trigger:
    - {trigger: state, entity_id: input_boolean.b1, from: 'off', to: 'off'}
    timeout: 2
    continue_on_timeout: false
  - event: m_13
    event_data: {n: 13, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
    timeout: 3
    continue_on_timeout: false
  - event: m_14
    event_data: {n: 14, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 4
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  send: {type: event, event_type: e1}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  send: {type: service_result, call_id: 0, ok: true}
- at: 14
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 15
  set: [light.l1, 'off']
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 18
  set: [light.l1, 'on']
- at: 19
  send: {type: service_result, call_id: 2, ok: true}
- at: 19
  set: [light.l2, unavailable]
- at: 20
  set: [sensor.s2, '7.5']
- at: 22
  send: {type: service_result, call_id: 3, ok: true}
- at: 22
  send: {type: event, event_type: e1}
- at: 23
  set: [light.l2, 'on']
- at: 26
  set: [sensor.s2, '1']
- at: 27
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 30
  set: [input_boolean.b1, 'on']
- at: 31
  set: [input_boolean.b1, 'off']
- at: 32
  set: [light.l2, unavailable]
- at: 33
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 34
  send: {type: event, event_type: tick}

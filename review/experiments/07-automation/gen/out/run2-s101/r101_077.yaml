# random scenario, seed 101, index 77 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: time, at: '22:13:29'}
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - not:
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
    - condition: and
      conditions:
      - {condition: trigger, id: alpha}
      - {condition: time, after: '22:13:25', before: '22:14', weekday: tue}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - variables: {v1: x}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.platform }}'}
    target:
      entity_id: [light.l1, light.l2]
    continue_on_error: true
  - sequence:
    - action: test.s2
      target: {entity_id: light.l1}
      continue_on_error: true
      enabled: false
    - {condition: state, entity_id: light.l1, state: 'off', for: '00:00:03'}
  - {stop: s}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: unavailable}

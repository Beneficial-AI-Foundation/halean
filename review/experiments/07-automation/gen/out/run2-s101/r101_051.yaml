# random scenario, seed 101, index 51 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: time_pattern, seconds: 23}
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - if:
    - {condition: trigger, id: '0'}
    then:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.id }}'}
    else:
    - choose:
      - conditions:
        - {condition: trigger, id: alpha}
        sequence:
        - event: m_2
          event_data: {n: 2, v: '{{ trigger.idx }}'}
      continue_on_error: true
  - {action: test.s3}
  - {delay: '00:00:02'}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - parallel:
    - event: m_4
      event_data: {n: 4, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - condition: state
        entity_id: light.l1
        state: ['on', unavailable]
        for: 2
      - parallel:
        - sequence:
          - {delay: 1}
          - variables: {v2: x}
          - wait_for_trigger:
            - {trigger: numeric_state, entity_id: sensor.s1, below: 10, for: '{{ 2 }}'}
            - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 3}
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - action: test.s6
            data: {n: 6, v: '{{ states(''light.l1'') }}'}
            target:
              entity_id: [light.l1, light.l2]
          - repeat:
              for_each: []
              sequence:
              - condition: or
                conditions:
                - not:
                  - condition: state
                    entity_id: light.l1
                    state: [unavailable, 'on']
                    for: {seconds: 1}
                  - {condition: time, before: '22:13:30'}
                - condition: trigger
                  id: [beta, '0']
                enabled: false
        enabled: false
    enabled: false
  - delay: {seconds: 1}
  - {stop: s}
  variables: {v1: 0, v2: 0}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 2
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 4
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 5
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l2, 'off']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s2, '20']
- at: 11
  send: {type: event, event_type: e3}
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  set: [input_boolean.b1, 'on']
- at: 17
  set: [sensor.s2, abc]
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 20
  set: [sensor.s2, '1']
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 21
  send: {type: event, event_type: e3}
- at: 24
  set: [light.l1, 'on']

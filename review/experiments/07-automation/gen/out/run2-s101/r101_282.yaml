# random scenario, seed 101, index 282 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
  - {trigger: event, event_type: e3}
  actions:
  - {event: m_1}
  - {stop: s}
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 0}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - {stop: s, error: true}
- alias: a1
  id: id1
  triggers:
  - {trigger: time_pattern, seconds: /7}
  - {trigger: state, entity_id: sensor.s2, from: '4'}
  - {trigger: event, event_type: e3}
  conditions:
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
  actions:
  - sequence:
    - wait_for_trigger:
      - trigger: event
        event_type: e3
        event_data: {k: a}
      timeout: 0
      enabled: false
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    continue_on_error: true
  - action: test.s4
    data: {n: 4, v: '{{ now().second }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    response_variable: v1
  - parallel:
    - sequence:
      - {action: test.s5, continue_on_error: true}
      - if:
        - condition: and
          conditions:
          - {condition: time, after: '23:00:00', before: '06:00'}
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        then:
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        else:
        - event: m_6
          event_data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v1 | default(''undef'') }}'}
        - choose:
          - conditions:
            - and:
              - {condition: time, after: '22:13:25'}
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s2, below: 9}
              - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
            - or:
              - condition: and
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, below: 15}
                - {condition: time, before: '06:00'}
                - {condition: state, entity_id: sensor.s2, state: abc}
              - condition: time
                after: '23:00:00'
                weekday: [tue]
            sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ states(''light.l1'') }}', var: '{{ v2 | default(''undef'') }}'}
            - {event: m_8}
            - delay: {seconds: '{{ 2 }}'}
          - conditions: ['{{ is_state(''light.l1'', ''on'') }}']
            sequence:
            - variables: {v3: '{{ states(''sensor.s1'') }}'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            - {event: m_9}
    - sequence:
      - event: m_10
        event_data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
  - {delay: '{{ 1 }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a2
  id: id2
  mode: queued
  max: 2
  triggers:
  - {trigger: event, event_type: e1, id: alpha}
  actions:
  - repeat:
      for_each: '{{ [''x'', 1] }}'
      sequence:
      - if:
        - condition: or
          conditions:
          - or:
            - {condition: time, after: '23:00:00'}
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
        then:
        - event: m_11
          event_data: {n: 11, v: '{{ states(''sensor.s1'') }}'}
        enabled: false
  - {delay: '{{ 1 }}'}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 3}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 3
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 4
  set: [sensor.s2, '20']
- at: 5
  set: [sensor.s1, '4']
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 14
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 15
  set: [sensor.s2, '20']
  attributes: {lvl: 2}
- at: 16
  send: {type: service_result, call_id: 1, ok: true}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 19
  send: {type: event, event_type: e3}
- at: 19
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  set: [light.l2, 'off']
- at: 24
  set: [sensor.s2, '8']
- at: 25
  set: [sensor.s2, unavailable]
- at: 25
  send: {type: event, event_type: e1}
- at: 28
  send: {type: event, event_type: tick}
- at: 29
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 30
  send: {type: event, event_type: e2}
- at: 31
  send: {type: event, event_type: e2}

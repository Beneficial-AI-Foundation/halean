# random scenario, seed 101, index 113 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: sensor.s2, id: beta}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''light.l1'') }}'}
  - sequence:
    - variables: {v1: 1}
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.platform }}'}
    - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 1}
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}'}
  - action: test.s4
    data: {n: 4, v: '{{ trigger.idx }}'}
  - choose:
    - conditions:
      - condition: or
        conditions:
        - {condition: state, entity_id: light.l2, state: unavailable}
      sequence:
      - parallel:
        - sequence:
          - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
          - event: m_6
            event_data: {n: 6, completed: '{{ wait.completed }}'}
          - action: test.s5
            target:
              entity_id: [light.l1, light.l2]
        - {event: m_7}
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
          sequence:
          - repeat:
              while:
              - {condition: trigger, id: alpha}
              - '{{ repeat.index <= 2 }}'
              sequence:
              - event: m_8
                event_data: {n: 8, v: '{{ trigger.idx }}'}
    - conditions:
      - {condition: trigger, id: '1'}
      sequence:
      - {delay: '{{ 1 }}'}
      - repeat:
          while:
          - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          - '{{ repeat.index <= 2 }}'
          sequence:
          - variables: {v2: x}
    default:
    - {stop: s}
    - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 4
  set: [sensor.s2, '12']
- at: 5
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 10
  send: {type: service_result, call_id: 0, ok: true}
- at: 11
  set: [sensor.s2, '8']
  attributes: {lvl: 3}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 13
  set: [sensor.s1, '20']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 19
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 20
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 21
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 22
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  set: [input_boolean.b1, 'off']
- at: 28
  set: [sensor.s2, '4']
- at: 29
  set: [sensor.s1, '12']
- at: 30
  send: {type: event, event_type: tick}
- at: 32
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 32
  set: [light.l2, 'off']

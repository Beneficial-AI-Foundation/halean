# random scenario, seed 101, index 9 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0}
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1, light.l2]
    to: 'off'
    for: {seconds: '{{ 1 + 1 }}'}
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: event, event_type: e3}
  actions:
  - repeat:
      while:
      - and:
        - condition: state
          entity_id: sensor.s2
          state: ['8', '4']
        - {condition: state, entity_id: input_boolean.b1, state: unavailable}
      - '{{ repeat.index <= 1 }}'
      sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', for: '00:00:02'}
      - parallel:
        - sequence:
          - sequence:
            - {action: test.s1, continue_on_error: true}
            - action: test.s2
              data: {n: 2, v: '{{ trigger.platform }}'}
          - parallel:
            - sequence:
              - {action: test.s3, continue_on_error: true, response_variable: v2}
            - event: m_4
              event_data: {n: 4, v: '{{ trigger.description }}'}
            continue_on_error: true
        - sequence:
          - sequence:
            - action: test.s5
              data: {n: 5, v: '{{ trigger.description }}'}
            - variables: {v1: x}
          - condition: not
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity_id: input_boolean.b1
                state: ['on', 'off']
              - {condition: time, after: '22:00'}
              - {condition: state, entity_id: sensor.s2, state: abc, enabled: false}
        continue_on_error: true
  - if:
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
      - {condition: trigger, id: '1'}
      enabled: false
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
    then:
    - parallel:
      - sequence:
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
      - sequence:
        - wait_for_trigger:
          - {trigger: event, event_type: e3}
          enabled: false
        - event: m_7
          event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      continue_on_error: true
    - repeat:
        for_each: []
        sequence:
        - repeat:
            for_each: [a, b]
            sequence:
            - condition: not
              conditions:
              - '{{ is_state(''light.l1'', ''on'') }}'
              - condition: or
                conditions:
                - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
                - condition: trigger
                  id: [beta, '0']
            - {event: m_8}
        - {event: m_9}
        - choose:
          - conditions:
            - {condition: state, entity_id: light.l2, state: unavailable}
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
              enabled: false
            sequence:
            - {delay: 1}
            - {event: m_10}
          continue_on_error: true
          enabled: false
    else:
    - repeat:
        until: ['{{ repeat.index >= 2 }}']
        sequence:
        - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - action: test.s11
          data: {n: 11, v: '{{ trigger.id }}'}
          response_variable: v4
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - variables: {v4: '{{ (v4 | default(0) | int(0)) + 1 }}'}
  - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: time, at: '22:13:26'}
  - {trigger: event, event_type: e3, id: alpha}
  actions:
  - action: test.s12
    data: {n: 12, v: '{{ trigger.description }}'}
  - {stop: s, error: true}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', timeout: '00:00:03'}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - if:
        - {condition: time, before: '22:14'}
        then:
        - wait_for_trigger:
          - trigger: state
            entity_id: [sensor.s1]
            not_from: ['1', '4']
            for: {seconds: 2}
          - {trigger: numeric_state, entity_id: sensor.s1, above: 3}
          timeout: 2
        - event: m_14
          event_data: {n: 14, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - event: m_13
          event_data: {n: 13, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
        else:
        - event: m_15
          event_data: {n: 15, v: '{{ this.attributes.current }}'}
    continue_on_error: true
states:
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 3}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s2, '7.5']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'on']
- at: 5
  set: [input_boolean.b1, 'on']
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: e3}
- at: 10
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 11
  send: {type: service_result, call_id: 0, ok: true}
- at: 12
  set: [light.l2, 'off']
- at: 13
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 14
  send: {type: event, event_type: e1}
- at: 15
  send: {type: event, event_type: e3}
- at: 17
  send: {type: service_result, call_id: 4, ok: false, error_kind: other}
- at: 18
  send:
    type: service_result
    call_id: 3
    ok: true
    response: {value: x}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 24
  send:
    type: service_result
    call_id: 5
    ok: true
    response: {value: 1}
- at: 25
  send: {type: event, event_type: e2}
- at: 26
  send: {type: service_result, call_id: 6, ok: true}
- at: 27
  send: {type: service_result, call_id: 7, ok: true}
- at: 29
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 30
  set: [light.l1, unavailable]

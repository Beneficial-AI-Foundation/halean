# random scenario, seed 101, index 167 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: sensor.s2}
  - {trigger: event, event_type: e2}
  actions:
  - sequence:
    - if:
      - condition: state
        entity_id: [input_boolean.b1, light.l1]
        state: 'on'
        match: any
      then:
      - action: test.s1
        data: {n: 1, v: '{{ trigger.description }}'}
      - {stop: s}
    - {stop: s, error: true, enabled: false}
  - {action: test.s2, response_variable: v1}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: time, at: '22:13:23'}
  actions:
  - action: test.s3
    data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {condition: trigger, id: alpha}
  - {event: m_4}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 2
  set: [input_boolean.b1, 'on']
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 6
  send: {type: service_result, call_id: 1, ok: false, error_kind: other}
- at: 7
  set: [input_boolean.b1, 'off']
- at: 7
  send: {type: service_result, call_id: 0, ok: true}
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 15
  set: [light.l2, unavailable]
- at: 17
  set: [sensor.s2, '4']
  attributes: {lvl: 2}
- at: 19
  set: [light.l2, 'off']
- at: 19
  send: {type: event, event_type: e1}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 20
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 21
  set: [sensor.s1, '4']

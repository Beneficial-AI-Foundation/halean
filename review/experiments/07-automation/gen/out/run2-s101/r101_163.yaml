# random scenario, seed 101, index 163 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: state, entity_id: light.l2, not_from: 'on'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9, enabled: false}
  actions:
  - {stop: s}
  - sequence:
    - parallel:
      - sequence:
        - repeat:
            until:
            - condition: or
              conditions:
              - condition: trigger
                id: [beta, '0']
              - '{{ repeat.index >= 3 }}'
            sequence:
            - {condition: state, entity_id: sensor.s1, state: '7.5'}
            - condition: and
              conditions:
              - not:
                - {condition: time, after: '22:13:25', before: '22:13:30'}
              - or:
                - {condition: state, entity_id: input_boolean.b1, state: unavailable}
                - '{{ states(''sensor.s2'') | float(0) < 9 }}'
                - {condition: trigger, id: '1'}
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
      - sequence:
        - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: 1}
        - action: test.s1
          data: {n: 1, v: '{{ states(''light.l1'') }}'}
        - wait_for_trigger:
          - {trigger: state, entity_id: sensor.s2, not_to: '1'}
    continue_on_error: true
  - repeat:
      while:
      - condition: or
        conditions:
        - {condition: state, entity_id: light.l2, state: 'off'}
        - {condition: state, entity_id: light.gone, state: 'off'}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - {delay: '00:00:02'}
  - variables: {v1: x}
  - variables: {v1: x}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: queued
  max: 3
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  conditions:
  - {condition: time, before: '22:13:30'}
  actions:
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - sequence:
    - sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: light.l1}
        timeout: 1
      - choose:
        - conditions:
          - '{{ is_state(''light.l1'', ''on'') }}'
          - {condition: trigger, id: '1', enabled: false}
          sequence:
          - variables: {v1: x}
            enabled: false
          - event: m_2
            event_data: {n: 2, v: '{{ trigger.platform }}'}
        - conditions:
          - condition: or
            conditions:
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            - {condition: state, entity_id: sensor.s1, state: unknown}
          sequence:
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
          - {event: m_3}
        continue_on_error: true
    - wait_for_trigger:
      - trigger: state
        entity_id: light.l1
        not_to: ['on', 'off']
      - trigger: event
        event_type: e2
        event_data: {k: true}
      timeout: 0
    - wait_for_trigger:
      - {trigger: event, event_type: e2}
      timeout: {seconds: 2}
      continue_on_timeout: false
    - event: m_4
      event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - if:
    - condition: and
      conditions:
      - {condition: trigger, id: alpha}
      - '{{ trigger.id == ''0'' }}'
    then:
    - {wait_template: '{{ is_state(''light.l1'', ''on'') }}'}
    - event: m_8
      event_data: {n: 8, completed: '{{ wait.completed }}'}
    - repeat:
        while:
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
        - '{{ repeat.index <= 3 }}'
        sequence:
        - choose:
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            sequence:
            - action: test.s5
              data: {n: 5, v: '{{ trigger.description }}'}
              target:
                entity_id: [light.l1, light.l2]
              continue_on_error: true
              response_variable: v3
          default:
          - action: test.s6
            data: {n: 6, v: '{{ trigger.id }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            response_variable: v4
          - action: test.s7
            data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            continue_on_error: true
        - {delay: 0}
    else:
    - condition: state
      entity_id: light.gone
      state: 'off'
      for: {seconds: 1}
    - {delay: '00:00:02'}
    continue_on_error: true
  - wait_for_trigger:
    - trigger: state
      entity_id: [input_boolean.b1]
      from: unavailable
      for: 2
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {event: m_9}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s2, '1']
- at: 6
  send: {type: event, event_type: e1}
- at: 6
  set: [sensor.s1, abc]
- at: 6
  send: {type: event, event_type: e1}
- at: 7
  set: [input_boolean.b1, unavailable]
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  set: [light.l1, unavailable]
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 11
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 12
  set: [sensor.s1, '4']
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 14
  set: [sensor.s2, '7.5']
  attributes: {lvl: 1}
- at: 17
  set: [light.l1, 'off']
- at: 20
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 20
  send: {type: event, event_type: e2}
- at: 22
  send: {type: event, event_type: e3}
- at: 25
  set: [light.l2, 'off']

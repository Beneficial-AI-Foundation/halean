# random scenario, seed 101, index 224 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  - {trigger: time_pattern, seconds: 23}
  conditions:
  - condition: state
    entity_id: [sensor.s1, light.l2]
    state: 'on'
    match: any
  actions:
  - {event: m_1}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}

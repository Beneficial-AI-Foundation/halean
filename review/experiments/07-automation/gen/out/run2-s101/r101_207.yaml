# random scenario, seed 101, index 207 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: event, event_type: e2, id: alpha}
  - {trigger: state, entity_id: sensor.s2, not_to: unknown, for: 2}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  conditions:
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
  actions:
  - condition: not
    conditions:
    - '{{ is_state(''light.l2'', ''off'') }}'
    - {condition: trigger, id: '0'}
  - event: m_1
    event_data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {stop: s, error: true}
  - delay: {seconds: '{{ 2 }}'}
  - choose:
    - conditions:
      - condition: not
        conditions:
        - condition: or
          conditions:
          - {condition: trigger, id: '1'}
          - {condition: time, after: '23:00:00', weekday: tue}
        - condition: trigger
          id: [beta, '0']
      - {condition: trigger, id: alpha}
      sequence:
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
        timeout: 1
        continue_on_timeout: false
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - choose:
        - conditions:
          - {condition: time, before: '22:13:30'}
          sequence:
          - event: m_2
            event_data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
      sequence:
      - action: test.s4
        data: {n: 4, v: '{{ trigger.idx }}'}
        target: {entity_id: light.l1}
      - action: test.s5
        data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        target: {entity_id: light.l1}
      - action: test.s6
        target: {entity_id: light.l1}
        continue_on_error: true
        response_variable: v1
    default:
    - action: test.s7
      data: {n: 7, v: '{{ now().second }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 3
  set: [input_boolean.b1, 'on']
- at: 4
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 7
  set: [sensor.s2, '12']
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 13
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e1}
- at: 15
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 16
  set: [light.l2, 'on']
- at: 17
  send: {type: event, event_type: e2}
- at: 17
  set: [sensor.s2, abc]
  attributes: {lvl: 1}
- at: 19
  set: [sensor.s2, '20']
- at: 20
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 20
  set: [input_boolean.b1, unavailable]
- at: 23
  set: [sensor.s1, '4']
- at: 24
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 25
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}

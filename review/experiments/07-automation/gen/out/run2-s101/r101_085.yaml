# random scenario, seed 101, index 85 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
  triggers:
  - {trigger: time, at: '22:13:29'}
  actions:
  - sequence:
    - {stop: s}
  - condition: and
    conditions:
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - {condition: trigger, id: '0', enabled: false}
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.b1
        state: [unavailable, 'on']
      sequence:
      - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
      - event: m_1
        event_data: {n: 1, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - or:
        - '{{ states(''sensor.s1'') | int(0) > 10 }}'
        - and:
          - '{{ states(''sensor.s1'') | int(0) > 10 }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      sequence:
      - parallel:
        - sequence:
          - sequence:
            - action: test.s2
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            - {delay: '{{ 1 }}', enabled: false}
          - event: m_3
            event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - event: m_4
          event_data: {n: 4, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
      - action: test.s5
        data: {n: 5, v: '{{ trigger.idx }}'}
        response_variable: v3
  - if:
    - or: ['{{ trigger.platform == ''event'' }}']
    then:
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s1'') }}', var: '{{ v2 | default(''undef'') }}'}
    else:
    - repeat:
        while:
        - condition: time
          after: '23:00:00'
          weekday: [tue]
        - '{{ repeat.index <= 1 }}'
        sequence:
        - repeat:
            count: '{{ 2 }}'
            sequence:
            - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
            - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
            - event: m_7
              event_data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          continue_on_error: true
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}', for: 1}
          timeout: 0
          continue_on_timeout: false
        - event: m_8
          event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - action: test.s9
      data: {n: 9, v: '{{ trigger.id }}'}
    - choose:
      - conditions:
        - not:
          - '{{ is_state(''light.l1'', ''on'') }}'
          - not:
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            - {condition: time, before: '22:14'}
            - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - {condition: trigger, id: alpha}
        sequence:
        - {event: m_10}
        - repeat:
            for_each: []
            sequence:
            - action: test.s11
              data: {n: 11, v: '{{ this.attributes.current }}'}
              continue_on_error: true
            - {event: m_12}
      - conditions:
        - condition: trigger
          id: [beta, '0']
        sequence:
        - variables:
            v2: [a, '{{ 1 + 1 }}']
        - {stop: s, error: true}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: e1}
- at: 3
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 3
  set: [sensor.s2, unknown]
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  set: [light.l2, unavailable]
  attributes: {lvl: 1}
- at: 10
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 11
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 14
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  set: [light.l1, 'off']
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 19
  send: {type: event, event_type: e3}
- at: 20
  send: {type: event, event_type: e2}
- at: 20
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 21
  set: [light.l2, 'on']
- at: 24
  set: [sensor.s2, unknown]
- at: 25
  set: [light.l2, unavailable]
- at: 26
  send: {type: event, event_type: tick}
- at: 28
  set: [input_boolean.b1, unavailable]
- at: 29
  set: [light.l2, 'off']

# random scenario, seed 101, index 131 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
  - {trigger: event, event_type: e2}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, for: '00:00:02'}
  conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
  actions:
  - sequence:
    - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 1, continue_on_timeout: false}
    - event: m_1
      event_data: {n: 1, completed: '{{ wait.completed }}'}
  - {delay: 0}
  - repeat:
      for_each:
      - {k: 1}
      - null
      sequence:
      - delay: {seconds: 1}
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.description }}'}
  - {event: m_3}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  triggers:
  - {trigger: state, entity_id: light.l1, to: unavailable}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    default:
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
      - {trigger: event, event_type: e1}
      timeout: 1
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - action: test.s4
      data: {n: 4, v: '{{ states(''light.l1'') }}'}
    continue_on_error: true
  - variables: {v2: x}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s2, not_to: abc}
  - sequence:
    - {delay: '{{ 1 }}'}
    - sequence:
      - choose:
        - conditions:
          - {condition: time, before: '06:00', weekday: tue}
          sequence:
          - variables:
              v1: [a, '{{ 1 + 1 }}']
          - event: m_6
            event_data: {n: 6, v: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [input_boolean.b1, 'off']
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, '7.5']
  attributes: {lvl: 1}
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: e3}
- at: 11
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 12
  send: {type: event, event_type: e3}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 13
  set: [sensor.s1, '4']
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 16
  set: [sensor.s1, '8']
- at: 16
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 17
  send: {type: event, event_type: e1}

# random scenario, seed 101, index 260 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s2
    below: 10
    value_template: '{{ state.state | float(0) * 2 }}'
    for: {seconds: 2}
    id: alpha
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  conditions:
  - {condition: trigger, id: '1'}
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: 2}
    - trigger: event
      event_type: e1
      event_data: {k: 1}
    timeout: 3
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - sequence:
        - action: test.s1
          data: {n: 1, v: '{{ now().second }}'}
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - parallel:
          - event: m_2
            event_data: {n: 2, v: '{{ trigger.idx }}'}
          - sequence:
            - action: test.s3
              data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
          - sequence:
            - variables:
                v1: [a, '{{ 1 + 1 }}']
            - {condition: state, entity_id: light.l2, state: 'off', enabled: false}
            - {delay: '{{ 1 }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: light.l2, not_to: 'off', for: '00:00:02'}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: sensor.s2, for: '{{ 2 }}'}
  conditions:
  - and: ['{{ states(''sensor.s1'') | int > 5 }}']
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  actions:
  - if:
    - condition: and
      conditions:
      - and:
        - condition: time
          before: '22:14'
          weekday: [wed, mon]
        - {condition: trigger, id: alpha}
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
      - not:
        - {condition: state, entity_id: light.l2, state: 'on'}
        - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    then:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - {event: m_5}
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    else:
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    continue_on_error: true
  - parallel:
    - sequence:
      - action: test.s6
        data: {n: 6, v: '{{ now().second }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        continue_on_error: true
    - sequence:
      - action: test.s7
        data: {n: 7, v: '{{ trigger.idx }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        continue_on_error: true
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - sequence:
        - {action: test.s8}
      - {stop: s}
  - {delay: 2, enabled: false}
  - {stop: s}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s2, not_to: '7.5', for: '{{ 2 }}'}
  - {trigger: state, entity_id: light.l2}
  conditions:
  - not:
    - {condition: state, entity_id: light.l1, state: 'on'}
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  actions:
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1, continue_on_timeout: false}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  - {event: m_9}
  - delay: {seconds: '{{ 2 }}'}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 1
  send: {type: event, event_type: e3}
- at: 2
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 5
  send: {type: event, event_type: e1}
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  set: [input_boolean.b1, 'on']
- at: 10
  send: {type: event, event_type: e1}
- at: 11
  set: [sensor.s1, '1']
- at: 12
  set: [sensor.s1, '12']
- at: 12
  set: [input_boolean.b1, unavailable]
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: e2}

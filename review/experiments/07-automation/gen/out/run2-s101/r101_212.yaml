# random scenario, seed 101, index 212 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}'}
  - {trigger: state, entity_id: input_boolean.b1, not_to: unavailable}
  - {trigger: time_pattern, seconds: '26', id: alpha}
  actions:
  - sequence:
    - parallel:
      - sequence:
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - event: m_1
        event_data: {n: 1, v: '{{ now().second }}'}
      continue_on_error: true
    - {stop: s, error: true}
    - sequence:
      - parallel:
        - event: m_2
          event_data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - {event: m_3}
  - event: m_4
    event_data: {n: 4, v: '{{ trigger.id }}'}
  - sequence:
    - delay: {seconds: '{{ 2 }}'}
  - action: test.s5
    data: {n: 5, v: '{{ this.attributes.current }}'}
  - action: test.s6
    data: {n: 6, v: '{{ now().second }}'}
    continue_on_error: true
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  max: 2
  variables: {v1: 0}
  triggers:
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: 'on'
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', id: alpha}
  actions:
  - {action: test.s7, continue_on_error: true}
  - {stop: s}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [light.l2, 'off']
- at: 2
  set: [sensor.s1, unavailable]
  attributes: {lvl: 2}
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 2
  set: [light.l1, 'off']
- at: 3
  send: {type: event, event_type: e1}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [input_boolean.b1, 'off']
- at: 9
  set: [input_boolean.b1, unavailable]
- at: 9
  set: [input_boolean.b1, 'off']
- at: 12
  set: [light.l1, 'on']
- at: 14
  send: {type: service_result, call_id: 0, ok: true}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 19
  set: [light.l2, 'off']

# random scenario, seed 101, index 55 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
  actions:
  - parallel:
    - sequence:
      - action: test.s1
        data: {n: 1, v: '{{ states(''light.l1'') }}'}
        target: {entity_id: light.l1}
        continue_on_error: true
      - if:
        - condition: or
          conditions: ['{{ states(''sensor.s1'') | int > 5 }}', '{{ states(''sensor.s1'') | int > 5 }}']
        then:
        - choose:
          - conditions:
            - {condition: state, entity_id: input_boolean.b1, state: 'on'}
            - condition: time
              before: '22:13:30'
              weekday: [tue]
            sequence:
            - variables: {v2: x}
          default:
          - action: test.s2
            target: {entity_id: light.l1}
            continue_on_error: true
            response_variable: v3
          - {delay: 2}
        - event: m_3
          event_data: {n: 3, v: '{{ trigger.id }}'}
        - sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - {event: m_4}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    - sequence:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: 1}
      - event: m_6
        event_data: {n: 6, completed: '{{ wait.completed }}'}
      - action: test.s5
        data: {n: 5, v: '{{ trigger.idx }}'}
      - {stop: s, error: true}
    - event: m_7
      event_data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    continue_on_error: true
  - action: test.s8
    data: {n: 8, v: '{{ trigger.id }}'}
    target:
      entity_id: [light.l1, light.l2]
    response_variable: v4
  - sequence:
    - {delay: 2}
    continue_on_error: true
  - parallel:
    - sequence:
      - {wait_template: '{{ trigger.platform == ''event'' }}'}
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}'}
    - event: m_10
      event_data: {n: 10, v: '{{ states(''light.l1'') }}', var: '{{ v2 | default(''undef'') }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '4'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l2, state: 'off'}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  send: {type: event, event_type: e3}
- at: 5
  set: [input_boolean.b1, 'off']
- at: 5
  set: [sensor.s1, '20']
- at: 6
  send: {type: event, event_type: e2}
- at: 8
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 14
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l2, 'on']
- at: 19
  set: [sensor.s1, '12']

# random scenario, seed 101, index 88 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: event, event_type: e2}
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.idx }}'}
    target: {entity_id: light.l1}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    not_to: ['7.5', '4']
  - {trigger: state, entity_id: input_boolean.b1}
  - trigger: event
    event_type: e1
    event_data: {k: a}
  actions:
  - action: test.s2
    data: {n: 2, v: '{{ trigger.description }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    then:
    - {delay: 2}
    continue_on_error: true
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - delay: {seconds: 1}
      - {event: m_3}
    continue_on_error: true
  - choose:
    - conditions:
      - and:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
        - '{{ states(''sensor.s2'') | float(0) < 9 }}'
      sequence:
      - choose:
        - conditions:
          - not:
            - condition: or
              conditions:
              - {condition: state, entity_id: input_boolean.b1, state: 'off'}
              - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
            - condition: not
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, below: 9}
              - {condition: time, after: '22:00', before: '06:00'}
            - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          sequence:
          - action: test.s4
            data: {n: 4, v: '{{ trigger.platform }}'}
            target:
              entity_id: [light.l1, light.l2]
            continue_on_error: true
          - parallel:
            - sequence:
              - variables:
                  v1: [a, '{{ 1 + 1 }}']
              - {delay: 1}
              - variables:
                  v2: [a, '{{ 1 + 1 }}']
            - sequence:
              - event: m_5
                event_data: {n: 5, v: '{{ now().second }}', var: '{{ v2 | default(''undef'') }}'}
        default:
        - condition: state
          entity_id: [light.l2, sensor.s1]
          state: 'on'
          match: any
        - if:
          - {condition: time, after: '23:00:00', before: '22:13:30'}
          then:
          - {delay: 2}
          continue_on_error: true
        - if: ['{{ is_state(''light.l2'', ''off'') }}']
          then:
          - action: test.s6
            data: {n: 6, v: '{{ trigger.id }}'}
    default:
    - {event: m_7}
    continue_on_error: true
  - {stop: s, error: true}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [input_boolean.b1, unavailable]
- at: 6
  send: {type: service_result, call_id: 0, ok: false, error_kind: invalid}
- at: 9
  set: [light.l2, 'on']
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 12
  set: [light.l1, 'off']
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 16
  send: {type: event, event_type: tick}

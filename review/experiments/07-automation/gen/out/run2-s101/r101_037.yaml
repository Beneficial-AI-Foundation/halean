# random scenario, seed 101, index 37 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', for: 1}
  - {trigger: event, event_type: e1, id: alpha}
  - trigger: event
    event_type: e2
    event_data: {k: a}
  actions:
  - repeat:
      count: 2
      sequence:
      - parallel:
        - sequence:
          - {event: m_1}
          - {stop: s}
          - {stop: s}
        - sequence:
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - {event: m_2}
      - {stop: s}
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {delay: 0}
  - repeat:
      while:
      - {condition: time, after: '22:00', before: '22:13:30'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: [sensor.s2, light.l1]
            state: 'on'
            match: any
          sequence:
          - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - {event: m_3}
          - event: m_4
            event_data: {n: 4, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
      - if:
        - condition: or
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        then:
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        else:
        - action: test.s5
          data: {n: 5, v: '{{ trigger.idx }}'}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2}
      - event: m_6
        event_data: {n: 6, completed: '{{ wait.completed }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 3}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  set: [input_boolean.b1, 'on']
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 2
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: e1}
- at: 12
  send: {type: event, event_type: e2}
- at: 14
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 15
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 1}
- at: 16
  send: {type: event, event_type: e2}
- at: 16
  set: [light.l2, 'off']
- at: 19
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 21
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 25
  send: {type: event, event_type: e2}

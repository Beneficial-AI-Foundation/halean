# random scenario, seed 101, index 244 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, value_template: '{{ state.state | float(0) * 2 }}', id: beta}
  - {trigger: time, at: '22:13:23'}
  actions:
  - repeat:
      for_each: [a, b]
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - {delay: 1}
  - choose:
    - conditions: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
      sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - {event: m_2}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, from: 'on', to: 'on'}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2}
  - {action: test.s3, continue_on_error: true}
  - sequence:
    - choose:
      - conditions:
        - {condition: trigger, id: '1'}
        - condition: not
          conditions:
          - or:
            - {condition: trigger, id: '1'}
            - {condition: trigger, id: '1'}
        sequence:
        - wait_for_trigger:
          - {trigger: event, event_type: e1}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - parallel:
          - sequence:
            - {action: test.s4}
            - event: m_5
              event_data: {n: 5, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
            - variables: {v1: x}
          - sequence:
            - {delay: 1}
      - conditions:
        - condition: not
          conditions:
          - condition: and
            conditions:
            - '{{ is_state(''light.l2'', ''off'') }}'
            - {condition: state, entity_id: light.gone, state: unavailable}
            - '{{ states(''sensor.s2'') | float(0) < 15 }}'
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        sequence:
        - action: test.s7
          data: {n: 7, v: '{{ trigger.description }}'}
        - event: m_8
          event_data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      default:
      - choose:
        - conditions:
          - {condition: time, after: '22:00', before: '22:14'}
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          sequence:
          - {event: m_9}
          - variables: {v3: '{{ states(''sensor.s1'') }}'}
          - {action: test.s10, continue_on_error: true, response_variable: v4}
        - conditions:
          - condition: or
            conditions:
            - not:
              - {condition: trigger, id: '1'}
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
            - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          sequence:
          - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        default:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        continue_on_error: true
      - parallel:
        - sequence:
          - {delay: 2}
        - sequence:
          - {condition: trigger, id: '1'}
        - {event: m_11}
    - action: test.s12
      data: {n: 12, v: '{{ now().second }}'}
      continue_on_error: true
  - parallel:
    - sequence:
      - {stop: s, error: true}
      - sequence:
        - repeat:
            count: 2
            sequence:
            - event: m_13
              event_data: {n: 13, v: '{{ trigger.platform }}', var: '{{ v4 | default(''undef'') }}'}
            - variables: {v1: x}
        - action: test.s14
          data: {n: 14, v: '{{ now().second }}'}
          response_variable: v7
        - repeat:
            for_each: []
            sequence:
            - condition: trigger
              id: [beta, '0']
            - {condition: state, entity_id: light.l1, state: 'on'}
        continue_on_error: true
    - {event: m_15}
    - sequence:
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          - condition: or
            conditions:
            - condition: state
              entity_id: [input_boolean.b1]
              state: 'on'
              match: any
            - and:
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          sequence:
          - event: m_16
            event_data: {n: 16, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v4 | default(''undef'') }}'}
          - event: m_17
            event_data: {n: 17, v: '{{ now().second }}', var: '{{ v3 | default(''undef'') }}'}
        default:
        - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: '00:00:03', continue_on_timeout: false}
        - event: m_18
          event_data: {n: 18, completed: '{{ wait.completed }}'}
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1, to: 'on'}
        - event: m_19
          event_data: {n: 19, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '{{ 2 }}', continue_on_timeout: false}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 2
  set: [input_boolean.b1, 'off']
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 4
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 6
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 7
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 7
  send: {type: event, event_type: e2}
- at: 10
  send: {type: service_result, call_id: 2, ok: true}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: e1}

# random scenario, seed 101, index 152 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: input_boolean.b1, state: 'on'}
      sequence:
      - sequence:
        - variables:
            v1: [a, '{{ 1 + 1 }}']
        - parallel:
          - sequence:
            - delay: {seconds: '{{ 2 }}'}
          - sequence:
            - {delay: 2}
            - event: m_1
              event_data: {n: 1, v: '{{ trigger.idx }}'}
          - sequence:
            - action: test.s2
              data: {n: 2, v: '{{ trigger.id }}'}
              continue_on_error: true
        - event: m_3
          event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}'}
      - {condition: time, before: '22:13:30'}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.id }}'}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 3
  set: [input_boolean.b1, 'on']
- at: 5
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, unavailable]
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send: {type: event, event_type: e3}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 11
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 13
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 14
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}
- at: 17
  send: {type: event, event_type: tick}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 21
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 22
  set: [input_boolean.b1, unavailable]
- at: 24
  send: {type: event, event_type: tick}
- at: 26
  set: [input_boolean.b1, 'off']
- at: 27
  set: [light.l1, unavailable]

# random scenario, seed 101, index 168 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: /9}
  actions:
  - variables: {v1: 1}
  - {stop: s, error: true}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: 3}
    - {trigger: event, event_type: e1}
    timeout: 3
    continue_on_timeout: false
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 0
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 1
  set: [light.l1, unavailable]
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 3
  set: [sensor.s2, '1']
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 12
  set: [light.l2, 'on']
- at: 13
  send: {type: event, event_type: e3}
- at: 14
  set: [input_boolean.b1, 'on']
- at: 16
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 17
  send: {type: event, event_type: e2}
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [input_boolean.b1, 'on']
- at: 20
  set: [input_boolean.b1, unavailable]
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 23
  send: {type: event, event_type: tick}
- at: 25
  set: [sensor.s2, unknown]
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: e2}

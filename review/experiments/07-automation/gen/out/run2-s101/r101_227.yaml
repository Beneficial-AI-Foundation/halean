# random scenario, seed 101, index 227 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: 3}
  actions:
  - {stop: s, error: true}
  - {event: m_1}
  - parallel:
    - sequence:
      - {action: test.s2, continue_on_error: true}
    - event: m_3
      event_data: {n: 3, v: '{{ this.attributes.current }}'}
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - action: test.s4
    data: {n: 4, v: '{{ states(''light.l1'') }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: '{{ 2 }}', continue_on_timeout: false}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.platform }}'}
  - repeat:
      while:
      - condition: time
        after: '22:13:25'
        weekday: [wed, mon]
      - '{{ repeat.index <= 3 }}'
      sequence:
      - action: test.s6
        target: {entity_id: light.l1}
      - {event: m_7}
      - {stop: s}
  - parallel:
    - sequence:
      - action: test.s8
        data: {n: 8, v: '{{ trigger.description }}'}
    - sequence:
      - action: test.s9
        data: {n: 9, v: '{{ this.attributes.current }}'}
        target: {entity_id: light.l1}
      - action: test.s10
        data: {n: 10, v: '{{ now().second }}'}
      - action: test.s11
        data: {n: 11, v: '{{ this.attributes.current }}'}
        continue_on_error: true
        response_variable: v1
  - event: m_12
    event_data: {n: 12, v: '{{ trigger.platform }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '12'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 1
  set: [input_boolean.b1, 'on']
- at: 2
  set: [light.l1, 'off']
- at: 3
  set: [sensor.s1, '7.5']
- at: 6
  set: [input_boolean.b1, unavailable]
- at: 7
  send: {type: event, event_type: e1}
- at: 7
  set: [light.l2, 'on']
- at: 8
  set: [light.l2, unavailable]
- at: 9
  set: [sensor.s1, '20']
- at: 11
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: e2}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  set: [sensor.s1, '4']
- at: 19
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 20
  set: [light.l1, 'on']

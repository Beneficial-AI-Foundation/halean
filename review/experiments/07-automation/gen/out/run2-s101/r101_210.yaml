# random scenario, seed 101, index 210 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: event, event_type: e2}
  conditions:
  - or:
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
  - and:
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
  actions:
  - delay: {seconds: 1}
  - {delay: 1}
  - sequence:
    - parallel:
      - sequence:
        - if:
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - condition: state
            entity_id: light.l1
            state: unavailable
            for: {seconds: 1}
            enabled: false
          then:
          - action: test.s1
            data: {n: 1, v: '{{ trigger.description }}'}
            continue_on_error: true
          - action: test.s2
            data: {n: 2, v: '{{ trigger.platform }}'}
          - {delay: 1}
          else:
          - action: test.s3
            data: {n: 3, v: '{{ trigger.platform }}'}
            enabled: false
          - action: test.s4
            data: {n: 4, v: '{{ trigger.idx }}'}
            continue_on_error: true
        - parallel:
          - sequence:
            - event: m_5
              event_data: {n: 5, v: '{{ trigger.id }}'}
          - sequence:
            - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9, enabled: false}
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - sequence:
            - event: m_6
              event_data: {n: 6, v: '{{ states(''light.l1'') }}'}
            - {event: m_7}
      - event: m_8
        event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - action: test.s9
      data: {n: 9, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      continue_on_error: true
  - {event: m_10}
  - parallel:
    - sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, to: 3, attribute: lvl}
        timeout: 0
        continue_on_timeout: false
      - event: m_11
        event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: '{{ 2 }}', continue_on_timeout: false}
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}'}
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, '4']
- at: 2
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l2, 'on']
- at: 10
  send: {type: event, event_type: e3}
- at: 11
  set: [sensor.s2, abc]
  attributes: {lvl: 3}
- at: 12
  set: [sensor.s1, '20']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'off']
- at: 18
  set: [input_boolean.b1, 'on']
- at: 21
  set: [sensor.s1, '7.5']
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 23
  set: [input_boolean.b1, 'off']
- at: 26
  send:
    type: event
    event_type: e3
    data: {k: true}

# random scenario, seed 101, index 18 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: state, entity_id: input_boolean.b1}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: time, before: '22:13:30'}
  - condition: and
    conditions:
    - {condition: state, entity_id: sensor.s1, state: abc}
    - {condition: time, before: '22:13:30', weekday: tue}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
    target: {entity_id: light.l1}
    continue_on_error: true
  - condition: not
    conditions:
    - {condition: trigger, id: '0'}
    enabled: false
  - action: test.s2
    target:
      entity_id: [light.l1, light.l2]
  - action: test.s3
    data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 1}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: '{{ 2 }}', id: beta}
  actions:
  - event: m_4
    event_data: {n: 4, v: '{{ this.attributes.current }}'}
  - wait_for_trigger:
    - trigger: event
      event_type: e1
      event_data: {k: a}
    timeout: 2
  - parallel:
    - sequence:
      - event: m_5
        event_data: {n: 5, v: '{{ this.attributes.current }}'}
      - event: m_6
        event_data: {n: 6, v: '{{ trigger.idx }}'}
    - event: m_7
      event_data: {n: 7, v: '{{ this.attributes.current }}'}
    continue_on_error: true
  - {stop: s}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, '4']
- at: 8
  send: {type: event, event_type: e3}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 9
  set: [sensor.s2, unknown]
- at: 10
  set: [light.l2, 'on']
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 13
  set: [sensor.s2, unknown]
  attributes: {lvl: 1}
- at: 13
  set: [sensor.s2, unknown]
- at: 14
  set: [sensor.s1, abc]
- at: 15
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 16
  set: [sensor.s1, unknown]
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  set: [sensor.s2, '7.5']
- at: 18
  send: {type: event, event_type: e1}
- at: 20
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 23
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 25
  send: {type: event, event_type: tick}
- at: 27
  send: {type: event, event_type: tick}
- at: 28
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 29
  send: {type: event, event_type: e2}
- at: 29
  send:
    type: event
    event_type: e1
    data: {k: a}

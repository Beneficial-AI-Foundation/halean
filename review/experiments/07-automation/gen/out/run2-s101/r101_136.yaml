- at: 14
  send: {type: service_result, call_id: 2, ok: true}
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  send: {type: service_result, call_id: 3, ok: true}
- at: 18
  send:
    type: service_result
    call_id: 4
    ok: true
    response: {value: x}
- at: 19
  set: [sensor.s1, '20']
- at: 21
  set: [light.l1, 'off']
- at: 23
  send: {type: event, event_type: tick}
- at: 23

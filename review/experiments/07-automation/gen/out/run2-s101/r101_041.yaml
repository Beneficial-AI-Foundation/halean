# random scenario, seed 101, index 41 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
    id: beta
  actions:
  - {event: m_1}
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: 2, continue_on_timeout: false}
  - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
  - {stop: s}
  - if:
    - {condition: trigger, id: '0'}
    - condition: state
      entity_id: light.gone
      state: 'on'
      for: {seconds: 1}
    then:
    - sequence:
      - variables: {v1: 1}
      - parallel:
        - sequence:
          - action: test.s2
            data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - {condition: trigger, id: '1'}
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ trigger.idx }}'}
            target: {entity_id: light.l1}
          - {action: test.s4, response_variable: v3}
          - {action: test.s5, response_variable: v4}
        - sequence:
          - variables: {v5: '{{ repeat.index if repeat is defined else -1 }}'}
          - {event: m_6}
          - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
- alias: a1
  id: id1
  mode: queued
  max: 3
  triggers:
  - trigger: numeric_state
    entity_id: sensor.s1
    above: 6
    below: 15
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - delay: {seconds: 1}
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.s1
      from: ['7.5', '20']
      to: ['12', abc]
    - trigger: state
      entity_id: input_boolean.b1
      to: ['off', unavailable]
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: '00:00:03'}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 4
  send: {type: event, event_type: e2}
- at: 5
  set: [light.l2, 'on']
- at: 6
  send: {type: event, event_type: e1}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, unavailable]
- at: 9
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 12
  set: [light.l1, unavailable]
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 14
  set: [light.l2, unavailable]
- at: 15
  set: [light.l2, 'off']
- at: 16
  set: [light.l2, 'off']
  attributes: {lvl: 3}
- at: 17
  set: [sensor.s2, abc]
- at: 18
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 18
  set: [input_boolean.b1, 'off']
- at: 19
  set: [sensor.s2, '1']
- at: 20
  send: {type: event, event_type: e3}
- at: 21
  send: {type: event, event_type: e3}
- at: 21
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 23
  send: {type: event, event_type: e1}

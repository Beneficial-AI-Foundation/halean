# random scenario, seed 101, index 255 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: state
    entity_id: [input_boolean.b1]
    to: unavailable
    from: 'off'
    id: alpha
  - {trigger: state, entity_id: input_boolean.b1}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''light.l1'') }}'}
  - if:
    - {condition: trigger, id: '0'}
    - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    then:
    - action: test.s2
      data: {n: 2, v: '{{ trigger.platform }}'}
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    else:
    - event: m_3
      event_data: {n: 3, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - sequence:
    - event: m_4
      event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
  - event: m_5
    event_data: {n: 5, v: '{{ trigger.description }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e1}
    - {trigger: state, entity_id: light.l2, to: 'off'}
    timeout: 0
    continue_on_timeout: false
states:
- {entity_id: sensor.s1, state: unknown}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: e3}
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 6
  send: {type: event, event_type: e1}
- at: 9
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'off']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: e1}
- at: 18
  set: [sensor.s1, '20']
- at: 19
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, unavailable]
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  set: [sensor.s1, '8']
- at: 23
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 24
  set: [sensor.s1, unavailable]
- at: 25
  set: [sensor.s2, unavailable]
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: 1}

# random scenario, seed 101, index 216 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: [sensor.s1, input_boolean.b1]
    to: ['20', '4']
  actions:
  - if: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
    then:
    - sequence:
      - sequence:
        - condition: state
          entity_id: [input_boolean.b1, sensor.s1]
          state: 'on'
          match: any
        - {delay: '00:00:02'}
        - action: test.s1
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          response_variable: v1
        continue_on_error: true
      - {action: test.s2}
    - wait_for_trigger:
      - trigger: state
        entity_id: [sensor.s2, input_boolean.b1]
        not_from: '7.5'
      - {trigger: state, entity_id: light.l1, for: '{{ 2 }}'}
      timeout: 1
    continue_on_error: true
  - wait_for_trigger:
    - trigger: event
      event_type: e2
      event_data: {k: 1}
    timeout: {seconds: 2}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  max: 3
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
  conditions:
  - condition: state
    entity_id: input_boolean.b1
    state: 'off'
    for: {seconds: 1}
  actions:
  - {delay: '{{ 1 }}'}
  - repeat:
      count: 0
      sequence:
      - {stop: s}
    enabled: false
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
    timeout: 2
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [sensor.s1, unavailable]
- at: 4
  send: {type: event, event_type: e2}
- at: 6
  set: [light.l2, 'on']
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 8
  send: {type: event, event_type: e2}
- at: 10
  set: [light.l2, 'on']
  attributes: {lvl: 3}
- at: 12
  set: [light.l2, unavailable]
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: 1}

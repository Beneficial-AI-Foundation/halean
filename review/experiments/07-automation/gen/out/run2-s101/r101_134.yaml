# random scenario, seed 101, index 134 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: a}
  - {trigger: time_pattern, seconds: /9}
  - {trigger: state, entity_id: light.l1, attribute: lvl}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s1, above: 6}
  actions:
  - if:
    - {condition: trigger, id: '0'}
    then:
    - {action: test.s1, continue_on_error: true}
    else:
    - action: test.s2
      data: {n: 2, v: '{{ this.attributes.current }}'}
      continue_on_error: true
      response_variable: v2
    - if: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
      then:
      - action: test.s3
        data: {n: 3, v: '{{ trigger.description }}'}
      else:
      - sequence:
        - action: test.s4
          data: {n: 4, v: '{{ trigger.description }}'}
        - variables:
            v1: [a, '{{ 1 + 1 }}']
    - wait_for_trigger:
      - {trigger: state, entity_id: sensor.s1, from: abc}
      - trigger: event
        event_type: e2
        event_data: {k: true}
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    continue_on_error: true
  - repeat:
      while:
      - condition: not
        conditions:
        - '{{ trigger.platform == ''event'' }}'
        - {condition: state, entity_id: input_boolean.b1, state: 'off'}
      - '{{ repeat.index <= 3 }}'
      sequence:
      - action: test.s6
        data: {n: 6, v: '{{ trigger.idx }}'}
        target: {entity_id: light.l1}
      - event: m_7
        event_data: {n: 7, v: '{{ states(''light.l1'') }}', var: '{{ v3 | default(''undef'') }}'}
      - parallel:
        - sequence:
          - sequence:
            - {action: test.s8}
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - {event: m_9}
        - sequence:
          - variables: {v4: 1}
          - choose:
            - conditions:
              - {condition: time, after: '22:13:25'}
              sequence:
              - action: test.s10
                data: {n: 10, v: '{{ trigger.platform }}'}
              - action: test.s11
                data: {n: 11, v: '{{ states(''light.l1'') }}'}
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - action: test.s12
    data: {n: 12, v: '{{ states(''light.l1'') }}'}
states:
- entity_id: sensor.s1
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 2
  set: [sensor.s2, unknown]
  attributes: {lvl: 3}
- at: 3
  set: [sensor.s2, '7.5']
- at: 4
  set: [light.l1, 'on']
- at: 4
  send: {type: event, event_type: e3}
- at: 4
  set: [light.l1, unavailable]
- at: 5
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 1}
- at: 6
  set: [sensor.s1, '4']
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 8
  set: [sensor.s2, abc]
- at: 9
  send: {type: event, event_type: e3}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  set: [sensor.s1, '7.5']
- at: 18
  set: [sensor.s2, '12']
- at: 19
  set: [sensor.s1, '4']
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 21
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l2, 'off']
- at: 22
  send: {type: event, event_type: e1}

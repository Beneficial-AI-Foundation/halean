# random scenario, seed 101, index 288 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /9}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
    target:
      entity_id: [light.l1, light.l2]
  - condition: or
    conditions:
    - {condition: state, entity_id: input_boolean.b1, state: 'on'}
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
  - wait_for_trigger:
    - {trigger: event, event_type: e1}
    - trigger: event
      event_type: e3
      event_data: {k: true}
    timeout: {seconds: 2}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [sensor.s1, unknown]
- at: 3
  set: [light.l1, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s2, '1']
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, abc]
- at: 13
  send: {type: event, event_type: e2}
- at: 15
  set: [sensor.s2, '7.5']
  attributes: {lvl: 1}
- at: 16
  set: [light.l1, 'on']
- at: 17
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 20
  send: {type: event, event_type: tick}

# random scenario, seed 101, index 82 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, for: 1}
  actions:
  - parallel:
    - sequence:
      - {condition: time, before: '22:14', weekday: tue}
      - sequence:
        - action: test.s1
          data: {n: 1, v: '{{ this.attributes.current }}'}
          continue_on_error: true
          response_variable: v1
        - {event: m_2}
        - action: test.s3
          data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
          response_variable: v2
    - sequence:
      - {event: m_4}
      - action: test.s5
        data: {n: 5, v: '{{ trigger.id }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {event: m_6}
  - {delay: '00:00:02'}
  - repeat:
      while: ['{{ trigger.platform in [''state'', ''numeric_state''] }}', '{{ repeat.index <= 2 }}']
      sequence:
      - {stop: s}
      - {stop: s}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: 3}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6}
      sequence:
      - action: test.s7
        data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - if:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
        then:
        - repeat:
            until: ['{{ repeat.index >= 1 }}']
            sequence:
            - action: test.s8
              data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            - delay: {seconds: 1}
        else:
        - variables: {v1: 1}
      - {action: test.s9}
    - conditions:
      - {condition: trigger, id: '1'}
      - condition: or
        conditions:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        - {condition: trigger, id: alpha}
      sequence:
      - wait_for_trigger:
        - trigger: event
          event_type: e2
          event_data: {k: a}
        timeout: 1
        continue_on_timeout: false
      - {action: test.s10}
  - parallel:
    - event: m_11
      event_data: {n: 11, v: '{{ states(''light.l1'') }}'}
    - sequence:
      - event: m_12
        event_data: {n: 12, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
      - choose:
        - conditions:
          - or:
            - {condition: trigger, id: '0'}
            - or: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 3 }}']
              sequence:
              - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
            continue_on_error: true
          - if:
            - condition: state
              entity_id: light.gone
              state: [unavailable, 'on']
            - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
            then:
            - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15, enabled: false}
        - conditions:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          sequence:
          - choose:
            - conditions:
              - {condition: numeric_state, entity_id: sensor.s1, above: 6}
              sequence:
              - delay: {seconds: 1}
            - conditions:
              - {condition: state, entity_id: light.l1, state: 'on'}
              sequence:
              - {event: m_13}
          - {delay: 2}
          - {delay: '{{ 1 }}'}
    - sequence:
      - if:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - condition: and
            conditions: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}']
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - condition: not
            conditions:
            - {condition: state, entity_id: sensor.s1, state: '4', for: '00:00:03'}
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        then:
        - choose:
          - conditions:
            - {condition: state, entity_id: sensor.s2, state: '4'}
            - {condition: time, after: '22:00', before: '22:13:30'}
            sequence:
            - action: test.s14
              target: {entity_id: light.l1}
        - event: m_15
          event_data: {n: 15, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          enabled: false
        else:
        - parallel:
          - sequence:
            - {event: m_16}
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            - {delay: 0}
          - event: m_17
            event_data: {n: 17, v: '{{ trigger.id }}', var: '{{ v2 | default(''undef'') }}'}
          - sequence:
            - event: m_18
              event_data: {n: 18, v: '{{ now().second }}'}
            - {event: m_19}
      - delay: {seconds: '{{ 2 }}'}
        enabled: false
      - repeat:
          for_each: []
          sequence:
          - action: test.s20
            data: {n: 20, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - {stop: s}
  - {event: m_21}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: abc
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [sensor.s2, unavailable]
- at: 0
  set: [light.l2, 'on']
- at: 1
  send: {type: event, event_type: e2}
- at: 2
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 4
  set: [sensor.s2, '7.5']
  attributes: {lvl: 2}
- at: 5
  set: [sensor.s2, '20']
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l2, 'on']
- at: 9
  set: [input_boolean.b1, 'on']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 17
  set: [input_boolean.b1, unavailable]
- at: 17
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s1, '4']
  attributes: {lvl: 3}
- at: 20
  set: [sensor.s2, unknown]
  attributes: {lvl: 2}
- at: 21
  set: [light.l2, 'off']
- at: 22
  set: [sensor.s1, abc]
- at: 25
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 27
  set: [sensor.s1, unavailable]
- at: 28
  set: [sensor.s1, '8']
- at: 29
  send:
    type: event
    event_type: e2
    data: {k: true}

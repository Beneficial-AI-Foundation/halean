# random scenario, seed 101, index 298 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: state, entity_id: input_boolean.b1, to: 1, from: 1, attribute: lvl}
  conditions:
  - condition: trigger
    id: [beta, '0']
  actions:
  - if:
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    then:
    - {event: m_1}
    - {stop: s}
  - repeat:
      count: 3
      sequence:
      - action: test.s2
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - parallel:
    - sequence:
      - repeat:
          for_each: '{{ [''x'', 1] }}'
          sequence:
          - {stop: s, error: true}
          - variables: {v1: 1}
          - event: m_3
            event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
      - choose:
        - conditions:
          - {condition: time, after: '23:00:00', before: '06:00'}
          sequence:
          - {event: m_4}
        default:
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
            sequence:
            - {action: test.s5}
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
            - action: test.s6
              data: {n: 6, v: '{{ trigger.description }}'}
          default:
          - {delay: 0}
          continue_on_error: true
    - {event: m_7}
    - sequence:
      - {stop: s}
  - {stop: s, error: true}
  - sequence:
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: [sensor.s2, light.l1]
          not_from: abc
          to: unknown
          for: 3
        timeout: 2
      - event: m_8
        event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}'}
    - action: test.s10
      data: {n: 10, v: '{{ trigger.idx }}'}
      target: {entity_id: light.l1}
      enabled: false
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: time, at: '22:13:26'}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {trigger: event, event_type: e2, id: beta}
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e1}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_12
    event_data: {n: 12, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - action: test.s11
    data: {n: 11, v: '{{ states(''sensor.s1'') }}'}
    target: {entity_id: light.l1}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: e2}
- at: 1
  set: [sensor.s2, abc]
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e1}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: e3}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, 'off']
- at: 13
  set: [light.l2, 'off']
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 19
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 26
  send: {type: event, event_type: tick}
- at: 29
  set: [light.l2, unavailable]
  attributes: {lvl: 2}
- at: 30
  set: [sensor.s2, unknown]
- at: 32
  send:
    type: event
    event_type: e3
    data: {k: true}

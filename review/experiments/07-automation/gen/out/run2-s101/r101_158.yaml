# random scenario, seed 101, index 158 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_from: unavailable, id: beta}
  conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
  actions:
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    - condition: trigger
      id: [beta, '0']
    then:
    - sequence:
      - if:
        - {condition: time, before: '06:00'}
        then:
        - {delay: '{{ 1 }}'}
        - action: test.s1
          data: {n: 1, v: '{{ now().second }}'}
          continue_on_error: true
        - event: m_2
          event_data: {n: 2, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
        else:
        - {delay: 2}
      - {event: m_3}
    else:
    - parallel:
      - {event: m_4}
      - event: m_5
        event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: state, entity_id: sensor.s2, state: '8', for: '00:00:03'}
      sequence:
      - {event: m_6}
      - parallel:
        - sequence:
          - {delay: '{{ 1 }}'}
          - if: ['{{ trigger.id == ''0'' }}']
            then:
            - {action: test.s7}
            - event: m_8
              event_data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            - condition: or
              conditions:
              - {condition: trigger, id: alpha}
            else:
            - action: test.s9
              data: {n: 9, v: '{{ this.attributes.current }}'}
            - event: m_10
              event_data: {n: 10, v: '{{ trigger.description }}'}
            - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - sequence:
          - {event: m_11}
          - event: m_12
            event_data: {n: 12, v: '{{ now().second }}'}
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      sequence:
      - choose:
        - conditions:
          - condition: not
            conditions:
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            - and:
              - {condition: time, before: '22:13:30', weekday: tue}
            - condition: or
              conditions:
              - {condition: state, entity_id: light.l2, state: 'off'}
              - {condition: time, after: '22:13:25', before: '22:14'}
          - condition: state
            entity_id: light.l1
            state: ['on', unavailable]
          sequence:
          - action: test.s13
            data: {n: 13, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        enabled: false
      - {action: test.s14}
    default:
    - {condition: numeric_state, entity_id: sensor.s1, below: 15}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: 2, attribute: lvl}
  actions:
  - action: test.s15
    target:
      entity_id: [light.l1, light.l2]
  - sequence:
    - variables: {v1: x}
    continue_on_error: true
  - {stop: s, error: true}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: unavailable}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 3
  set: [input_boolean.b1, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 8
  send: {type: event, event_type: e2}
- at: 9
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [input_boolean.b1, unavailable]
- at: 14
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 15
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}

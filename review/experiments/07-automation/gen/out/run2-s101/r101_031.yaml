# random scenario, seed 101, index 31 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10, value_template: '{{ state.state | float(0) * 2 }}'}
  - {trigger: time, at: '22:13:33'}
  conditions:
  - condition: and
    conditions:
    - or:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      - {condition: time, after: '22:00', weekday: tue}
      - {condition: trigger, id: '1'}
  actions:
  - sequence:
    - choose:
      - conditions:
        - or:
          - '{{ states(''sensor.s1'') | int > 5 }}'
          - condition: not
            conditions:
            - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
            - condition: state
              entity_id: [light.l2, light.l1]
              state: 'on'
              match: any
          - condition: or
            conditions: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
        sequence:
        - sequence:
          - variables: {v1: x}
        - action: test.s1
          data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
        - event: m_2
          event_data: {n: 2, completed: '{{ wait.completed }}'}
      default:
      - {stop: s}
      - action: test.s3
        data: {n: 3, v: '{{ trigger.description }}'}
        response_variable: v3
      - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
    - {stop: s, error: true}
  - choose:
    - conditions:
      - not:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - condition: state
            entity_id: sensor.s1
            state: ['7.5', abc]
            enabled: false
          - '{{ is_state(''light.l1'', ''on'') }}'
        - condition: not
          conditions:
          - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
          enabled: false
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: input_boolean.b1
          for: {seconds: 2}
        timeout: 2
        continue_on_timeout: false
    - conditions:
      - condition: not
        conditions:
        - condition: and
          conditions:
          - {condition: time, before: '22:13:30', weekday: tue}
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          - {condition: trigger, id: alpha}
        - {condition: state, entity_id: sensor.s2, state: '4'}
        - {condition: trigger, id: '0'}
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      sequence:
      - sequence:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - parallel:
          - sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.description }}'}
              continue_on_error: true
            - {event: m_5}
            - {event: m_6}
          - sequence:
            - action: test.s7
              data: {n: 7, v: '{{ trigger.idx }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            - variables:
                v2: [a, '{{ 1 + 1 }}']
          - sequence:
            - condition: and
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15, enabled: false}
              - or:
                - {condition: state, entity_id: sensor.s1, state: '8', for: '00:00:03'}
                - {condition: time, after: '22:13:25'}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
    default:
    - sequence:
      - sequence:
        - {event: m_8}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        continue_on_error: true
  - {event: m_9}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - event: m_11
    event_data: {n: 11, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
      - condition: and
        conditions:
        - condition: time
          before: '22:13:30'
          weekday: [tue]
        - condition: trigger
          id: [beta, '0']
      sequence:
      - variables: {v4: x}
      - {event: m_10}
- alias: a1
  id: id1
  mode: queued
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - trigger: state
    entity_id: [light.l1, input_boolean.b1]
    not_to: 'on'
    from: ['on', unavailable]
  actions:
  - condition: not
    conditions:
    - {condition: time, after: '23:00:00', before: '22:14'}
    - '{{ trigger.platform == ''event'' }}'
    - '{{ is_state(''light.l2'', ''off'') }}'
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - variables: {v3: '{{ states(''sensor.s1'') }}'}
  - choose:
    - conditions:
      - not:
        - not:
          - '{{ trigger.id == ''0'' }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9, enabled: false}
          - {condition: time, before: '22:14'}
        - {condition: numeric_state, entity_id: sensor.s2, above: 3}
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - choose:
            - conditions:
              - {condition: time, after: '22:00', before: '22:14'}
              sequence:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
            default:
            - action: test.s12
              data: {n: 12, v: '{{ trigger.id }}'}
              target: {entity_id: light.l1}
              response_variable: v4
              enabled: false
      - parallel:
        - sequence:
          - action: test.s13
            data: {n: 13, v: '{{ states(''light.l1'') }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - variables: {v4: 1}
          - if:
            - {condition: state, entity_id: light.gone, state: 'on'}
            - {condition: time, after: '22:00', before: '22:13:30'}
            then:
            - {action: test.s14}
        - sequence:
          - event: m_15
            event_data: {n: 15, v: '{{ [states(''light.l1''), states(''light.l2'')] }}', var: '{{ v5 | default(''undef'') }}'}
          - {delay: 1}
        - sequence:
          - action: test.s16
            data: {n: 16, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            target:
              entity_id: [light.l1, light.l2]
          - choose:
            - conditions:
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
              sequence:
              - {delay: '{{ 1 }}'}
              - action: test.s17
                data: {n: 17, v: '{{ trigger.idx }}'}
            - conditions:
              - condition: time
                before: '22:14'
                weekday: [tue]
              sequence:
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
              - action: test.s18
                target:
                  entity_id: [light.l1, light.l2]
            default:
            - variables: {v3: x}
- alias: a2
  id: id2
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15, id: alpha}
  conditions:
  - not:
    - or:
      - {condition: time, after: '22:00'}
      - {condition: time, before: '22:13:30'}
  actions:
  - {event: m_19}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - sequence:
      - {stop: s}
      - condition: state
        entity_id: [light.l1, input_boolean.b1]
        state: 'on'
        match: any
      - sequence:
        - {action: test.s20}
    continue_on_error: true
  - choose:
    - conditions:
      - not:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', enabled: false}
        - condition: or
          conditions:
          - {condition: state, entity_id: light.l2, state: 'off', for: 2}
      sequence:
      - {delay: 2}
      - {wait_template: '{{ trigger.platform == ''event'' }}'}
    default:
    - action: test.s21
      data: {n: 21, v: '{{ states(''light.l1'') }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    continue_on_error: true
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [light.l1, unavailable]
- at: 2
  set: [sensor.s2, '1']
  attributes: {lvl: 1}
- at: 2
  set: [input_boolean.b1, 'on']
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  set: [light.l1, 'on']
- at: 5
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l2, unavailable]
- at: 9
  set: [sensor.s1, unknown]
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [input_boolean.b1, unavailable]
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s1, '4']
- at: 17
  send: {type: service_result, call_id: 0, ok: true}
- at: 18
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}

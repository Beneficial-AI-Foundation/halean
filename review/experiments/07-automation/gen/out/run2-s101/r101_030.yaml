# random scenario, seed 101, index 30 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
  - trigger: state
    entity_id: light.l2
    for: {seconds: 2}
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - {condition: time, after: '22:00', before: '22:14'}
    - not:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
      - '{{ states(''sensor.s1'') | int(0) > 7 }}'
  actions:
  - parallel:
    - sequence:
      - repeat:
          while: ['{{ is_state(''light.l2'', ''off'') }}', '{{ repeat.index <= 1 }}']
          sequence:
          - {event: m_1}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - {delay: '{{ 1 }}'}
    - sequence:
      - event: m_2
        event_data: {n: 2, v: '{{ states(''light.l1'') }}'}
      - {stop: s}
    - sequence:
      - action: test.s3
        data: {n: 3, v: '{{ trigger.idx }}'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      - {event: m_4}
  - event: m_5
    event_data: {n: 5, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.id }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      - or:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      sequence:
      - parallel:
        - sequence:
          - event: m_7
            event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - sequence:
          - repeat:
              until:
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, below: 9}
                - '{{ repeat.index >= 3 }}'
              sequence:
              - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
              - event: m_8
                event_data: {n: 8, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
            continue_on_error: true
          - wait_for_trigger:
            - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: 10, value_template: '{{ state.state | float(0) * 2 }}'}
            timeout: {seconds: 2}
          - event: m_9
            event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - wait_template: '{{ trigger.platform == ''event'' }}'
        timeout: {seconds: 2}
      - event: m_12
        event_data: {n: 12, completed: '{{ wait.completed }}'}
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: and
              conditions:
              - condition: not
                conditions:
                - {condition: time, after: '22:13:25', before: '22:14'}
                - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
              - and:
                - {condition: time, after: '23:00:00', before: '22:14'}
                - condition: trigger
                  id: [beta, '0']
                - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
            - '{{ repeat.index >= 3 }}'
          sequence:
          - parallel:
            - sequence:
              - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
            - {event: m_10}
            - sequence:
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
          - action: test.s11
            data: {n: 11, v: '{{ states(''light.l1'') }}'}
            enabled: false
    - conditions:
      - not:
        - '{{ trigger.platform == ''event'' }}'
        - {condition: state, entity_id: light.l2, state: 'off'}
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      sequence:
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s2, below: 10, for: 2}
        timeout: 1
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 1
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 2
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 2
  set: [sensor.s1, '12']
- at: 3
  set: [sensor.s2, '8']
- at: 6
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 8
  set: [light.l1, 'off']
- at: 8
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 11
  send: {type: event, event_type: e1}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}

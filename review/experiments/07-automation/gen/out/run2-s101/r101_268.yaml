# random scenario, seed 101, index 268 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: 0, v2: 0}
  triggers:
  - {trigger: time, at: '22:13:23'}
  actions:
  - sequence:
    - parallel:
      - event: m_1
        event_data: {n: 1, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
      - sequence:
        - {event: m_2}
        - variables: {v1: x}
      - sequence:
        - choose:
          - conditions:
            - condition: or
              conditions:
              - condition: time
                after: '22:00'
                before: '22:14'
                weekday: [wed, mon]
              - or:
                - {condition: trigger, id: '0'}
                - {condition: numeric_state, entity_id: sensor.s2, below: 9}
                - {condition: trigger, id: alpha}
              - '{{ trigger.platform == ''event'' }}'
            sequence:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  - {event: m_3}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l1, sensor.s1]
      from: 'off'
    timeout: {seconds: 2}
states:
- {entity_id: sensor.s1, state: '1'}
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 2

# random scenario, seed 101, index 23 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e3, id: alpha}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  - event: m_1
    event_data: {n: 1, completed: '{{ wait.completed }}'}
- alias: a1
  id: id1
  triggers:
  - trigger: state
    entity_id: light.l1
    from: [unavailable, 'on']
  - {trigger: time_pattern, seconds: /9}
  actions:
  - sequence:
    - {delay: '{{ 1 }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ trigger.description }}'}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 2
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 8
  set: [input_boolean.b1, 'off']
- at: 9
  set: [sensor.s1, '20']
- at: 12
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  send: {type: event, event_type: e1}
- at: 17
  set: [sensor.s2, '8']
- at: 17
  send: {type: event, event_type: e3}
- at: 18
  send: {type: event, event_type: e3}
- at: 21
  send: {type: event, event_type: tick}
- at: 23
  set: [light.l1, unavailable]
- at: 24
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 25
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: tick}

# random scenario, seed 101, index 65 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: true}
  - {trigger: time_pattern, seconds: 23}
  actions:
  - parallel:
    - sequence:
      - sequence:
        - parallel:
          - sequence:
            - event: m_1
              event_data: {n: 1, v: '{{ trigger.description }}'}
            - condition: not
              conditions: ['{{ states(''sensor.s1'') | int > 5 }}']
            - {action: test.s2, continue_on_error: true, response_variable: v1}
          - sequence:
            - action: test.s3
              data: {n: 3, v: '{{ now().second }}'}
              enabled: false
            - action: test.s4
              data: {n: 4, v: '{{ states(''light.l1'') }}'}
      - {stop: s, error: true}
      - parallel:
        - event: m_5
          event_data: {n: 5, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - {stop: s, error: true}
          - action: test.s6
            data: {n: 6, v: '{{ trigger.description }}'}
        - event: m_7
          event_data: {n: 7, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
    - event: m_8
      event_data: {n: 8, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
  - sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: sensor.s1
          state: [abc, unavailable]
        sequence:
        - {event: m_9}
  variables: {v1: 0}
states:
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [sensor.s1, '4']
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 7
  set: [light.l1, 'off']
- at: 8
  send: {type: service_result, call_id: 1, ok: true}
- at: 10
  set: [sensor.s2, '20']
- at: 11
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 19
  set: [light.l1, 'on']
- at: 20
  send: {type: event, event_type: e2}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  set: [input_boolean.b1, unavailable]
- at: 25
  set: [sensor.s1, abc]
- at: 25
  set: [light.l1, 'off']
- at: 26
  set: [sensor.s1, '12']
- at: 29
  send: {type: event, event_type: e1}
- at: 29

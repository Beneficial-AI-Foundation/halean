# random scenario, seed 101, index 126 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:33'}
  actions:
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.idx }}'}
  - if:
    - or:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    then:
    - if: ['{{ states(''sensor.s2'') | float(0) < 5 }}']
      then:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 0, continue_on_timeout: false}
      - {delay: 0}
    - {event: m_2}
    else:
    - action: test.s3
      data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      target:
        entity_id: [light.l1, light.l2]
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: '8'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 1
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 6
  set: [sensor.s1, unavailable]
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  set: [input_boolean.b1, 'on']
- at: 9
  set: [sensor.s2, unavailable]
- at: 9
  send: {type: event, event_type: e2}
- at: 10
  set: [light.l1, 'on']
- at: 11
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 3}
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 14
  send: {type: event, event_type: tick}

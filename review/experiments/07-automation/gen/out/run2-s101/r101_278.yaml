# random scenario, seed 101, index 278 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: 0, v2: 0}
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: a}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - sequence:
    - if:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
      then:
      - sequence:
        - {event: m_2}
      - {stop: s}
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      else:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '00:00:03'}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
      continue_on_error: true
    - parallel:
      - event: m_4
        event_data: {n: 4, v: '{{ trigger.idx }}'}
      - sequence:
        - wait_for_trigger:
          - trigger: state
            entity_id: [light.l1]
            to: [unavailable, 'on']
            for: 3
          timeout: 0
          continue_on_timeout: false
    - choose:
      - conditions:
        - condition: trigger
          id: [beta, '0']
          enabled: false
        sequence:
        - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: '00:00:03', continue_on_timeout: false}
        - event: m_5
          event_data: {n: 5, completed: '{{ wait.completed }}'}
      - conditions:
        - {condition: state, entity_id: sensor.s1, state: abc}
        - condition: and
          conditions:
          - or:
            - condition: state
              entity_id: light.l2
              state: ['on', unavailable]
              for: {seconds: 1}
            - {condition: time, after: '22:00'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        sequence:
        - variables: {v1: x}
        - wait_for_trigger:
          - {trigger: event, event_type: e1}
          - {trigger: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
      continue_on_error: true
- alias: a1
  id: id1
  triggers:
  - {trigger: time_pattern, seconds: '26', id: alpha}
  actions:
  - variables: {v1: 1}
    enabled: false
  - wait_for_trigger:
    - trigger: event
      event_type: e2
      event_data: {k: true}
    - trigger: state
      entity_id: input_boolean.b1
      from: ['off', unavailable]
      for: 00:00:02
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - action: test.s6
    data: {n: 6, v: '{{ this.attributes.current }}'}
    continue_on_error: true
  - action: test.s7
    data: {n: 7, v: '{{ this.attributes.current }}'}
    response_variable: v2
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  set: [sensor.s1, unknown]
- at: 5
  set: [sensor.s2, unavailable]
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l2, 'on']
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 8
  set: [sensor.s2, '4']
  attributes: {lvl: 1}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 11
  set: [input_boolean.b1, 'off']
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e1}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 14
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 15
  set: [sensor.s2, abc]
- at: 15
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}

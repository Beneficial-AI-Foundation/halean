# random scenario, seed 101, index 99 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: time_pattern, seconds: /3}
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, value_template: '{{ state.state | float(0) * 2 }}', for: 1}
  actions:
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - sequence:
        - action: test.s1
          data: {n: 1, v: '{{ now().second }}'}
        - choose:
          - conditions:
            - {condition: trigger, id: alpha}
            - condition: or
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, below: 9}
              - {condition: time, after: '23:00:00', before: '06:00'}
              - condition: and
                conditions:
                - condition: trigger
                  id: [beta, '0']
                - {condition: trigger, id: alpha}
                - '{{ states(''sensor.s2'') | float(0) < 15 }}'
            sequence:
            - event: m_2
              event_data: {n: 2, v: '{{ states(''light.l1'') }}'}
            - variables: {v1: 1}
            - variables: {v1: '{{ states(''sensor.s1'') }}'}
          default:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - action: test.s3
            data: {n: 3, v: '{{ this.attributes.current }}'}
  - delay: {seconds: '{{ 2 }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e1, id: alpha}
  - trigger: state
    entity_id: light.l1
    from: ['on', unavailable]
  conditions:
  - {condition: state, entity_id: light.l2, state: unavailable}
  - {condition: trigger, id: '0'}
  actions:
  - event: m_4
    event_data: {n: 4, v: '{{ trigger.idx }}'}
    enabled: false
  - {stop: s}
  - repeat:
      for_each: '{{ [''x'', 1] }}'
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 1 }}']
          sequence:
          - {event: m_5}
          - wait_for_trigger:
            - {trigger: event, event_type: e3}
            timeout: {seconds: 2}
            continue_on_timeout: false
          - event: m_6
            event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - {stop: s, error: true}
  - {delay: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [sensor.s2, '8']
- at: 4
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: e3}
- at: 9
  send: {type: service_result, call_id: 1, ok: true}
- at: 11
  set: [sensor.s2, unavailable]
  attributes: {lvl: 2}
- at: 11
  send: {type: service_result, call_id: 3, ok: true}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [input_boolean.b1, 'on']
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  send: {type: event, event_type: e3}
- at: 18
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 20
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 21
  send: {type: service_result, call_id: 7, ok: true}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 24
  set: [sensor.s2, '20']
  attributes: {lvl: 1}
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 26
  send: {type: event, event_type: tick}

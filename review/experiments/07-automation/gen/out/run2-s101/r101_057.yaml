# random scenario, seed 101, index 57 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, below: 10, id: beta}
  actions:
  - {condition: time, before: '06:00'}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', for: 3}
    timeout: 2
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - {event: m_1}
    enabled: false
  - condition: and
    conditions:
    - condition: or
      conditions:
      - '{{ states(''sensor.s1'') | int(0) > 3 }}'
      - {condition: state, entity_id: light.gone, state: 'on'}
    - condition: and
      conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - delay: {seconds: '{{ 2 }}'}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '20'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s2, abc]
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: e3}
- at: 6
  set: [sensor.s2, unknown]
- at: 7
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 7
  set: [light.l2, 'on']
- at: 10
  set: [input_boolean.b1, unavailable]
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 11
  set: [sensor.s2, abc]
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: e1}
- at: 12
  set: [sensor.s1, '8']
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  set: [input_boolean.b1, 'off']
- at: 15
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 15
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 16
  send: {type: event, event_type: e3}
- at: 17
  set: [light.l1, 'off']
- at: 19
  set: [sensor.s1, unavailable]
- at: 20
  set: [sensor.s1, unavailable]
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: e3}
- at: 21
  send: {type: event, event_type: e1}
- at: 24
  set: [light.l1, unavailable]
  attributes: {lvl: 3}

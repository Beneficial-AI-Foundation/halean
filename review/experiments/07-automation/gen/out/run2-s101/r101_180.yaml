# random scenario, seed 101, index 180 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', for: '{{ 2 }}'}
  - trigger: state
    entity_id: light.l2
    not_from: ['off', 'on']
  conditions:
  - condition: state
    entity_id: sensor.s1
    state: ['8', '4']
  - not:
    - condition: not
      conditions:
      - {condition: time, after: '23:00:00', before: '06:00'}
    - '{{ states(''sensor.s2'') | float(0) < 15 }}'
  actions:
  - {delay: 1}
  - repeat:
      count: 3
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - {event: m_1}
  - sequence:
    - action: test.s2
      data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  - {trigger: state, entity_id: light.l2, to: 'on'}
  conditions:
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - condition: and
    conditions:
    - condition: not
      conditions:
      - {condition: time, after: '23:00:00', before: '22:14'}
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
    - or:
      - {condition: state, entity_id: sensor.s1, state: '12'}
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    enabled: false
  actions:
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - event: m_3
    event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 3}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 8
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 9
  set: [light.l2, unavailable]
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: e1}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 17
  send: {type: event, event_type: e3}
- at: 18
  set: [input_boolean.b1, 'off']

# random scenario, seed 101, index 12 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: 23, id: beta}
  conditions:
  - {condition: time, before: '22:13:30'}
  - {condition: numeric_state, entity_id: sensor.s2, above: 6}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6}
      sequence:
      - repeat:
          while:
          - {condition: time, after: '23:00:00', before: '06:00', enabled: false}
          - '{{ repeat.index <= 3 }}'
          sequence:
          - {stop: s, error: true}
          - wait_for_trigger:
            - trigger: state
              entity_id: light.l1
              from: [unavailable, 'off']
              to: 'off'
    default:
    - if:
      - {condition: state, entity_id: light.l2, state: 'off'}
      then:
      - choose:
        - conditions:
          - condition: and
            conditions:
            - condition: time
              after: '22:00'
              before: '22:14'
              weekday: [wed, mon]
          sequence:
          - variables: {v1: 1}
            enabled: false
          - event: m_1
            event_data: {n: 1, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
          - {event: m_2}
        - conditions:
          - condition: and
            conditions:
            - condition: or
              conditions:
              - {condition: state, entity_id: light.l1, state: 'off'}
            - condition: not
              conditions:
              - {condition: time, before: '06:00'}
              - {condition: state, entity_id: light.l2, state: 'off'}
              - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
          sequence:
          - action: test.s3
            data: {n: 3, v: '{{ trigger.idx }}'}
          - delay: {seconds: '{{ 2 }}'}
      - {delay: 2}
      else:
      - parallel:
        - sequence:
          - {condition: state, entity_id: light.l2, state: unavailable, for: 2}
          - {delay: 0}
        - sequence:
          - action: test.s4
            data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            target:
              entity_id: [light.l1, light.l2]
            response_variable: v2
          - event: m_5
            event_data: {n: 5, v: '{{ trigger.idx }}'}
          - action: test.s6
            data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            response_variable: v3
        continue_on_error: true
      - action: test.s7
        target:
          entity_id: [light.l1, light.l2]
      - {stop: s, error: true}
    - parallel:
      - sequence:
        - {stop: s}
        - sequence:
          - action: test.s8
            data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
          - action: test.s9
            data: {n: 9, v: '{{ trigger.idx }}'}
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
        - choose:
          - conditions: ['{{ states(''sensor.s2'') | float(0) < 15 }}']
            sequence:
            - {event: m_10}
          - conditions:
            - condition: and
              conditions:
              - condition: and
                conditions:
                - {condition: numeric_state, entity_id: sensor.s2, above: 6}
                - '{{ states(''sensor.s1'') | int > 5 }}'
                - {condition: trigger, id: '0'}
              - {condition: time, before: '22:13:30'}
            sequence:
            - {condition: numeric_state, entity_id: sensor.s2, below: 9}
            - delay: {seconds: 1}
      - event: m_11
        event_data: {n: 11, v: '{{ states(''light.l1'') }}'}
    - {event: m_12}
  - {event: m_13}
  - action: test.s14
    data: {n: 14, v: '{{ now().second }}'}
  - action: test.s15
    data: {n: 15, v: '{{ trigger.id }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: state, entity_id: sensor.s2, not_from: 2, attribute: lvl}
  - {trigger: state, entity_id: sensor.s1, for: '{{ 2 }}', id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
  conditions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  actions:
  - parallel:
    - event: m_16
      event_data: {n: 16, v: '{{ now().second }}'}
    - sequence:
      - if:
        - condition: state
          entity_id: light.l2
          state: ['off', unavailable]
        then:
        - wait_for_trigger:
          - {trigger: event, event_type: e1}
          enabled: false
        - event: m_17
          event_data: {n: 17, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - delay: {seconds: 1}
        else:
        - choose:
          - conditions:
            - not:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            sequence:
            - action: test.s18
              data: {n: 18, v: '{{ trigger.platform }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          - conditions:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', enabled: false}
            sequence:
            - action: test.s19
              data: {n: 19, v: '{{ states(''sensor.s1'') }}'}
              continue_on_error: true
            - delay: {seconds: 1}
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s2, below: 10, value_template: '{{ state.state | float(0) * 2 }}', for: '{{ 2 }}'}
          - {trigger: state, entity_id: light.l2, from: 1, to: 2, attribute: lvl}
      - repeat:
          for_each: [a, b]
          sequence:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
          - choose:
            - conditions:
              - {condition: numeric_state, entity_id: sensor.s2, above: 6}
              sequence:
              - action: test.s20
                data: {n: 20, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
              - delay: {seconds: 1}
            - conditions:
              - condition: and
                conditions:
                - {condition: time, before: '22:14'}
              sequence:
              - {delay: '00:00:02'}
              - variables: {v1: '{{ states(''sensor.s1'') }}'}
          - wait_for_trigger:
            - {trigger: state, entity_id: light.l2, not_from: 'off'}
            - {trigger: event, event_type: e2}
            timeout: {seconds: 2}
          - event: m_21
            event_data: {n: 21, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        continue_on_error: true
  - delay: {seconds: 1}
  - sequence:
    - {action: test.s22}
    - {delay: 2}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  set: [sensor.s2, unknown]
- at: 5
  set: [sensor.s2, abc]
- at: 5
  set: [sensor.s1, '12']
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 6
  set: [light.l2, 'off']
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 18
  send: {type: event, event_type: e3}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 21
  set: [sensor.s2, '7.5']
- at: 22
  set: [input_boolean.b1, 'on']

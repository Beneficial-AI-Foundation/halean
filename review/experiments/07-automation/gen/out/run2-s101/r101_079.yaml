# random scenario, seed 101, index 79 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', for: 2}
  - {trigger: time, at: '22:13:26'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.id }}'}
  - {stop: s, error: true}
  - variables: {v1: 1}
  - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e1}
  conditions:
  - condition: not
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
    - not:
      - {condition: state, entity_id: sensor.s1, state: '20'}
      - {condition: numeric_state, entity_id: sensor.s2, above: 6}
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
    enabled: false
  - condition: not
    conditions:
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
    - condition: not
      conditions:
      - condition: time
        after: '22:13:25'
        before: '22:14'
        weekday: [tue]
      - {condition: state, entity_id: light.l1, state: 'on'}
  actions:
  - {event: m_3}
  - if:
    - or:
      - '{{ trigger.platform == ''event'' }}'
      - condition: and
        conditions:
        - condition: trigger
          id: [beta, '0']
        - {condition: time, after: '22:00', before: '22:13:30'}
      - condition: or
        conditions:
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
        - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 15}
        - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    then:
    - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 2}
    - event: m_4
      event_data: {n: 4, completed: '{{ wait.completed }}'}
    continue_on_error: true
  - sequence:
    - if:
      - not:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - {condition: time, before: '22:13:30'}
      - condition: state
        entity_id: light.l1
        state: 'on'
        for: {seconds: 1}
      then:
      - delay: {seconds: '{{ 2 }}'}
      else:
      - {delay: 0}
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
      continue_on_error: true
    - {event: m_6}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '8'
  attributes: {lvl: 1}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 1}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 2
  set: [sensor.s2, '4']
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 12
  set: [light.l2, 'off']
  attributes: {lvl: 2}
- at: 13
  set: [light.l2, 'off']
- at: 15
  set: [sensor.s2, '1']
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 21
  send: {type: event, event_type: tick}
- at: 21
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 25
  set: [input_boolean.b1, unavailable]
- at: 26
  set: [light.l1, unavailable]
- at: 28
  send: {type: event, event_type: tick}
- at: 30
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 33
  set: [sensor.s2, '12']
- at: 36
  set: [input_boolean.b1, unavailable]
  attributes: {lvl: 3}
- at: 37
  set: [input_boolean.b1, unavailable]
- at: 38
  send: {type: event, event_type: e1}
- at: 39
  send: {type: event, event_type: e1}

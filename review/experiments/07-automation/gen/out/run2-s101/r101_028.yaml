# random scenario, seed 101, index 28 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - {trigger: time_pattern, seconds: /9}
  conditions:
  - not:
    - condition: or
      conditions:
      - '{{ states(''sensor.s1'') | int(0) > 7 }}'
      - condition: time
        after: '23:00:00'
        before: '22:13:30'
        weekday: [tue]
  - condition: and
    conditions:
    - condition: time
      after: '23:00:00'
      before: '22:13:30'
      weekday: [wed, mon]
  actions:
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 0}
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  - variables: {v1: x}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [input_boolean.b1, unavailable]
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [sensor.s2, '20']
  attributes: {lvl: 3}
- at: 9
  set: [input_boolean.b1, 'on']
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l2, 'off']
- at: 14
  send:
    type: event
    event_type: e1
    data: {k: 2}

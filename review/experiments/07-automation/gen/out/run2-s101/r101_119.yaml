# random scenario, seed 101, index 119 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: state, entity_id: sensor.s2, to: '8'}
  - {trigger: state, entity_id: sensor.s1, not_to: '8', id: beta}
  - trigger: template
    value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''light.l1'') }}'}
    target:
      entity_id: [light.l1, light.l2]
    response_variable: v1
  - condition: not
    conditions:
    - {condition: state, entity_id: input_boolean.b1, state: 'on', for: 2}
    - condition: and
      conditions:
      - '{{ states(''sensor.s1'') | int > 5 }}'
      - condition: state
        entity_id: light.l1
        state: ['on', 'off']
      - condition: state
        entity_id: light.l1
        state: ['on', 'off']
        enabled: false
  - variables: {v1: x}
  - {stop: s}
  - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: time_pattern, seconds: 23}
  - {trigger: state, entity_id: light.l1, for: 2}
  - trigger: state
    entity_id: [sensor.s1]
    to: [abc, '8']
    for: {seconds: 2}
  actions:
  - if:
    - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
    - {condition: time, before: '06:00'}
    then:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.platform }}'}
    - action: test.s3
      data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      target:
        entity_id: [light.l1, light.l2]
      enabled: false
    - event: m_4
      event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {event: m_5}
  - action: test.s6
    data: {n: 6, v: '{{ trigger.platform }}'}
    response_variable: v1
  - action: test.s7
    data: {n: 7, v: '{{ states(''sensor.s1'') }}'}
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  set: [light.l2, 'off']
- at: 3
  set: [light.l2, 'on']
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 7
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  send: {type: service_result, call_id: 1, ok: true}
- at: 13
  set: [sensor.s2, '8']
- at: 14
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 2}
- at: 15
  send: {type: event, event_type: e1}
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: 1}
- at: 16
  set: [sensor.s2, abc]
- at: 17
  send: {type: event, event_type: e1}
- at: 18
  set: [input_boolean.b1, 'on']
- at: 19
  set: [sensor.s2, unavailable]
  attributes: {lvl: 3}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: service_result
    call_id: 3
    ok: true
    response: {value: 1}
- at: 21
  set: [light.l1, 'on']
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 24
  send: {type: service_result, call_id: 4, ok: false, error_kind: ha_error}
- at: 24
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}

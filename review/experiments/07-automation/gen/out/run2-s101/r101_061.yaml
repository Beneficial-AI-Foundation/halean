# random scenario, seed 101, index 61 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /3}
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: event, event_type: e3}
  actions:
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - if:
        - {condition: numeric_state, entity_id: sensor.s1, above: 6}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
        then:
        - event: m_1
          event_data: {n: 1, v: '{{ trigger.platform }}'}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
        - condition: trigger
          id: [beta, '0']
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - parallel:
    - sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - sequence:
      - condition: or
        conditions:
        - condition: or
          conditions: ['{{ is_state(''light.l1'', ''on'') }}']
    - event: m_3
      event_data: {n: 3, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
  - {stop: s}
  - sequence:
    - parallel:
      - sequence:
        - sequence:
          - delay: {seconds: 1}
        - action: test.s4
          data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - sequence:
        - {condition: numeric_state, entity_id: sensor.s1, below: 15}
        - repeat:
            until: ['{{ repeat.index >= 2 }}']
            sequence:
            - {event: m_5}
          continue_on_error: true
    - {stop: s}
  - sequence:
    - {delay: 2}
    - parallel:
      - sequence:
        - wait_for_trigger:
          - {trigger: numeric_state, entity_id: sensor.s1, below: 10, value_template: '{{ state.state | float(0) * 2 }}'}
          - {trigger: state, entity_id: sensor.s2}
          timeout: {seconds: 2}
          continue_on_timeout: false
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - variables: {v1: x}
      - sequence:
        - sequence:
          - action: test.s7
            data: {n: 7, v: '{{ trigger.description }}'}
            continue_on_error: true
            enabled: false
          - {event: m_8}
          continue_on_error: true
        - sequence:
          - condition: not
            conditions:
            - condition: not
              conditions:
              - condition: state
                entity_id: light.l2
                state: ['off', unavailable]
              - {condition: trigger, id: '0'}
            - condition: not
              conditions:
              - condition: time
                before: 06:00
                weekday: [wed, mon]
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              - {condition: trigger, id: alpha}
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - trigger: event
            event_type: e2
            event_data: {k: a}
          timeout: 3
        - event: m_9
          event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - sequence:
        - variables: {v3: 1}
      continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, value_template: '{{ state.state | float(0) * 2 }}'}
  conditions:
  - {condition: time, before: '22:13:30'}
  actions:
  - action: test.s10
    data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    enabled: false
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s2, above: 6, below: 15, for: 1}
  - {delay: '{{ 1 }}'}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
- alias: a2
  id: id2
  mode: queued
  max: 3
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, id: beta}
  conditions:
  - not:
    - condition: trigger
      id: [beta, '0']
    - condition: time
      after: '23:00:00'
      before: 06:00
      weekday: [wed, mon]
  - {condition: time, after: '22:00', before: '22:14'}
  actions:
  - parallel:
    - sequence:
      - sequence:
        - {stop: s}
        - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 0}
        - event: m_11
          event_data: {n: 11, completed: '{{ wait.completed }}'}
      - {event: m_12}
    - sequence:
      - action: test.s13
        data: {n: 13, v: '{{ trigger.idx }}'}
  - wait_for_trigger:
    - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
    timeout: 3
  - event: m_14
    event_data: {n: 14, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 1, continue_on_timeout: false}
  - event: m_15
    event_data: {n: 15, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '4'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  set: [light.l2, unavailable]
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 8
  send: {type: event, event_type: e2}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 9
  send: {type: event, event_type: e3}
- at: 10
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: e2}
- at: 11
  set: [sensor.s1, '1']
- at: 14
  set: [sensor.s2, '12']
- at: 14
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 15
  set: [input_boolean.b1, 'off']
- at: 16
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 19
  set: [sensor.s2, '1']
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 21
  set: [sensor.s1, '8']
- at: 24
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 26
  set: [input_boolean.b1, 'on']
- at: 29
  send: {type: event, event_type: tick}
- at: 29
  set: [light.l1, 'off']
- at: 31
  set: [sensor.s2, '8']
- at: 32
  send: {type: event, event_type: e2}

# random scenario, seed 101, index 253 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:26'}
  conditions:
  - condition: or
    conditions:
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - condition: or
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - {condition: time, before: '22:14'}
  - {condition: trigger, id: '1'}
  actions:
  - sequence:
    - {delay: 1}
  - if:
    - {condition: time, after: '22:00', before: '06:00'}
    then:
    - {delay: '{{ 1 }}'}
    - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
    - event: m_1
      event_data: {n: 1, completed: '{{ wait.completed }}'}
    enabled: false
  - {event: m_2}
  - {delay: '{{ 1 }}'}
  - {event: m_3, enabled: false}
- alias: a1
  id: id1
  variables: {v1: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  conditions:
  - '{{ trigger.id == ''0'' }}'
  - condition: state
    entity_id: sensor.s1
    state: ['20', unknown]
  actions:
  - event: m_4
    event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
  - parallel:
    - event: m_5
      event_data: {n: 5, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
    continue_on_error: true
  - {delay: 0}
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {stop: s, error: true}
- alias: a2
  id: id2
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: '4', to: '8'}
  conditions:
  - {condition: time, after: '23:00:00', before: '22:14'}
  actions:
  - sequence:
    - {stop: s, error: true}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    timeout: 3
    continue_on_timeout: false
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 4
  send: {type: event, event_type: e3}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 7
  set: [light.l2, 'off']
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, unavailable]
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  set: [light.l1, 'on']
- at: 13
  set: [sensor.s1, unknown]
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 15
  set: [sensor.s2, abc]
- at: 15
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: e1}
- at: 19
  set: [sensor.s2, '12']
  attributes: {lvl: 3}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 23
  set: [sensor.s2, '1']
  attributes: {lvl: 2}
- at: 24
  send: {type: event, event_type: tick}
- at: 26
  set: [light.l2, 'on']
  attributes: {lvl: 2}
- at: 27
  send: {type: event, event_type: e3}
- at: 29
  set: [input_boolean.b1, unavailable]
- at: 30
  send: {type: event, event_type: e2}
- at: 33
  send: {type: event, event_type: e3}

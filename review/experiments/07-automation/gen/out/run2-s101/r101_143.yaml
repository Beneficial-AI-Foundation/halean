# random scenario, seed 101, index 143 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time, at: '22:13:33'}
  - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2, for: 1}
  actions:
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - {event: m_1, enabled: false}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.idx }}'}
  - sequence:
    - repeat:
        count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
        sequence:
        - {event: m_3}
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
            sequence:
            - event: m_4
              event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
            - action: test.s5
              data: {n: 5, v: '{{ trigger.platform }}'}
          - conditions:
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            sequence:
            - {event: m_6}
        - choose:
          - conditions:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - {condition: trigger, id: '0'}
            sequence:
            - {delay: 2}
            - action: test.s7
              data: {n: 7, v: '{{ trigger.id }}'}
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      continue_on_error: true
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  actions:
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', timeout: 1, continue_on_timeout: false}
  - event: m_9
    event_data: {n: 9, completed: '{{ wait.completed }}'}
  - {action: test.s8}
  - {stop: s, error: true}
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {stop: s}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3}
  actions:
  - event: m_10
    event_data: {n: 10, v: '{{ trigger.platform }}'}
  - parallel:
    - sequence:
      - {event: m_11}
      - condition: not
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.l2
            state: [unavailable, 'on']
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - {condition: trigger, id: '0'}
        - condition: or
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, enabled: false}
      - action: test.s12
        data: {n: 12, v: '{{ this.attributes.current }}'}
    - {event: m_13}
    - event: m_14
      event_data: {n: 14, v: '{{ trigger.platform }}'}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
    - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10}
    timeout: 1
    continue_on_timeout: false
  - event: m_15
    event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- entity_id: sensor.s1
  state: abc
  attributes: {lvl: 1}
- entity_id: sensor.s2
  state: abc
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 2
  set: [input_boolean.b1, 'off']
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 9
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 10
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 12
  send: {type: event, event_type: e1}
- at: 13
  set: [input_boolean.b1, 'on']
  attributes: {lvl: 2}
- at: 13
  set: [input_boolean.b1, 'off']
  attributes: {lvl: 1}
- at: 13
  send: {type: event, event_type: tick}
- at: 16
  set: [sensor.s2, '4']
- at: 16
  set: [sensor.s1, '7.5']

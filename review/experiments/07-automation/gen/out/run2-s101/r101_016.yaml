# random scenario, seed 101, index 16 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: time_pattern, seconds: /7}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - variables: {v1: 1}
      - repeat:
          until: ['{{ repeat.index >= 3 }}']
          sequence:
          - delay: {seconds: 1}
  - {wait_template: '{{ trigger.id == ''0'' }}', timeout: 1}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}', timeout: 2, continue_on_timeout: false}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: event, event_type: e3, id: alpha}
  actions:
  - repeat:
      count: 0
      sequence:
      - action: test.s2
        data: {n: 2, v: '{{ trigger.id }}'}
      - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
  - action: test.s3
    data: {n: 3, v: '{{ trigger.idx }}'}
- alias: a2
  id: id2
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0}
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: event, event_type: e1, id: beta}
  - trigger: state
    entity_id: light.l1
    to: ['on', unavailable]
    from: [unavailable, 'off']
    for: '{{ 2 }}'
    id: alpha
  actions:
  - parallel:
    - sequence:
      - action: test.s4
        data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        response_variable: v2
    - sequence:
      - action: test.s5
        data: {n: 5, v: '{{ now().second }}'}
        continue_on_error: true
        response_variable: v3
  - {delay: '{{ 1 }}'}
  - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
  - wait_for_trigger:
    - trigger: event
      event_type: e3
      event_data: {k: 1}
    timeout: 1
  - {wait_template: '{{ trigger.platform == ''event'' }}', timeout: '00:00:03'}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, abc]
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 7
  send: {type: event, event_type: e3}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send: {type: service_result, call_id: 0, ok: true}
- at: 11
  send: {type: event, event_type: e1}
- at: 13
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 17
  send: {type: service_result, call_id: 3, ok: false, error_kind: other}
- at: 18
  set: [sensor.s1, unknown]
- at: 19
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: 1}
- at: 20
  set: [light.l2, 'off']
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 25
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 27
  send: {type: event, event_type: tick}
- at: 28
  set: [input_boolean.b1, 'on']
- at: 29
  set: [input_boolean.b1, 'off']
- at: 30
  send: {type: event, event_type: e2}
- at: 31
  send: {type: event, event_type: tick}
- at: 32
  send: {type: service_result, call_id: 4, ok: false, error_kind: ha_error}

# random scenario, seed 101, index 43 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: sensor.s2, from: '7.5'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  - parallel:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.id }}'}
    - event: m_3
      event_data: {n: 3, v: '{{ now().second }}'}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - {stop: s, error: true}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: numeric_state, entity_id: sensor.s2, above: 3, below: 10, id: alpha}
  actions:
  - variables: {v1: x}
  - action: test.s5
    data: {n: 5, v: '{{ now().second }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  send: {type: event, event_type: e1}
- at: 2
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 3
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 5
  set: [input_boolean.b1, 'on']
- at: 7
  set: [light.l2, unavailable]
- at: 10
  set: [light.l2, unavailable]
  attributes: {lvl: 3}
- at: 11
  set: [light.l2, 'off']
  attributes: {lvl: 1}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 14
  set: [sensor.s2, '4']
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 16
  send: {type: event, event_type: e3}
- at: 17
  send: {type: event, event_type: e2}
- at: 18
  set: [sensor.s2, unavailable]
  attributes: {lvl: 1}
- at: 19
  send:
    type: event
    event_type: e2
    data: {k: 1}

# random scenario, seed 101, index 38 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: time_pattern, seconds: 31}
  actions:
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - wait_for_trigger:
        - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    enabled: false
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l2}
    - {trigger: numeric_state, entity_id: sensor.s1, above: 3, below: sensor.s2, value_template: '{{ state.state | float(0) * 2 }}'}
  - event: m_8
    event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {condition: state, entity_id: sensor.s2, state: abc}
  - if:
    - {condition: time, after: '22:13:25'}
    then:
    - {event: m_3}
    - choose:
      - conditions:
        - and:
          - condition: not
            conditions: ['{{ is_state(''light.l1'', ''on'') }}']
          - '{{ is_state(''light.l1'', ''on'') }}'
          - condition: not
            conditions:
            - {condition: trigger, id: '0'}
            - {condition: trigger, id: '1'}
            enabled: false
        - condition: not
          conditions:
          - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
          - condition: and
            conditions:
            - {condition: time, after: '22:00'}
        sequence:
        - {stop: s, error: true}
      - conditions:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        sequence:
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          timeout: 1
          continue_on_timeout: false
      default:
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2, continue_on_timeout: false}
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}'}
      - choose:
        - conditions:
          - and:
            - {condition: numeric_state, entity_id: sensor.s2, below: 9}
            - and:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              - {condition: time, after: '22:00', before: '22:14', weekday: tue}
          sequence:
          - {delay: '{{ 1 }}'}
        - conditions:
          - condition: not
            conditions:
            - '{{ states(''sensor.s1'') | int(0) > 7 }}'
            - {condition: time, before: '22:14'}
          sequence:
          - event: m_4
            event_data: {n: 4, v: '{{ now().second }}'}
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - {condition: state, entity_id: sensor.s1, state: '20', enabled: false}
  - sequence:
    - variables: {v2: x}
    - {event: m_6, enabled: false}
    - parallel:
      - sequence:
        - {stop: s, error: true}
      - event: m_7
        event_data: {n: 7, v: '{{ trigger.description }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: light.l2}
  - {trigger: event, event_type: e3, id: beta}
  - {trigger: numeric_state, entity_id: sensor.s2, below: 10}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - repeat:
      for_each: [a, b]
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
  - {delay: '{{ 1 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 4
  set: [sensor.s1, '4']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  set: [sensor.s1, unknown]
- at: 7
  send: {type: event, event_type: e3}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 11
  send: {type: event, event_type: e3}
- at: 12
  set: [input_boolean.b1, 'on']
- at: 13
  send: {type: event, event_type: e3}
- at: 13
  set: [sensor.s2, '4']
  attributes: {lvl: 2}
- at: 14
  set: [light.l2, 'on']
  attributes: {lvl: 1}
- at: 15
  set: [sensor.s2, '4']
  attributes: {lvl: 3}
- at: 18
  set: [sensor.s2, unknown]
  attributes: {lvl: 2}
- at: 18
  set: [light.l2, 'off']
- at: 20
  set: [sensor.s2, unknown]

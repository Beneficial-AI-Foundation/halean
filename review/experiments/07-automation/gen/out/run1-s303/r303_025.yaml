- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s1, '12']
- at: 5
  set: [sensor.s1, '1']
- at: 5
  set: [light.l1, 'off']
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 9
  set: [light.l1, 'on']
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 16
  send: {type: service_result, call_id: 1, ok: true}
- at: 17

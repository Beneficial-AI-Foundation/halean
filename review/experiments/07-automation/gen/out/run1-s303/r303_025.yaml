# random scenario, seed 303, index 25 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: state
    entity_id: [light.l1]
    to: ['on', 'off']
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', for: 2}
  - trigger: state
    entity_id: [sensor.s1]
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  - action: test.s2
    data: {n: 2, v: '{{ trigger.id }}'}
states:
- {entity_id: sensor.s1, state: '7.5'}

# random scenario, seed 303, index 184 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'
    for: {seconds: 2}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    id: alpha
  conditions:
  - condition: not
    conditions:
    - {condition: time, after: '23:00:00'}
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - '{{ states(''sensor.s1'') | int > 5 }}'
    - and:
      - {condition: state, entity_id: sensor.s1, state: '1'}
      - {condition: trigger, id: alpha}
  actions:
  - {delay: 0}
  - action: test.s1
    data: {n: 1, v: '{{ now().second }}'}
    target:
      entity_id: [light.l1, light.l2]
  - event: m_2
    event_data: {n: 2, v: '{{ states(''light.l1'') }}'}
  - {delay: 0}
states:
- entity_id: sensor.s1
  state: '1'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 1
  set: [sensor.s1, '1']
- at: 1
  send: {type: event, event_type: tick}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 5
  set: [light.l1, 'off']
- at: 5
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, abc]
- at: 14
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 15
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 16
  set: [sensor.s1, unavailable]
  attributes: {lvl: 2}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [sensor.s1, '4']
  attributes: {lvl: 1}
- at: 19
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 19
  set: [sensor.s1, unknown]
- at: 20
  set: [light.l1, unavailable]

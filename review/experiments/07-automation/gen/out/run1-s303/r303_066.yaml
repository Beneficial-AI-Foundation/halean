# random scenario, seed 303, index 66 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 2
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'off'}
  - trigger: state
    entity_id: light.l1
    to: [unavailable, 'off']
  actions:
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
    timeout: 2
  - choose:
    - conditions:
      - condition: state
        entity_id: light.l1
        state: ['off', 'on']
      - {condition: time, after: '23:00:00', weekday: tue}
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ this.attributes.current }}'}
      - {stop: s}
    - conditions:
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        enabled: false
      - {condition: trigger, id: '0'}
      - sequence:
        - repeat:
            count: 1
            sequence:
            - action: test.s2
              data: {n: 2, v: '{{ this.attributes.current }}'}
              continue_on_error: true
              response_variable: v2
        - {condition: state, entity_id: light.l1, state: 'on'}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: 0}
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: state, entity_id: light.l1}
  actions:
  - condition: not
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: [beta, '0']
      - '{{ trigger.platform == ''event'' }}'
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_4
    event_data: {n: 4, v: '{{ trigger.id }}'}
  - action: test.s5
    data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
states:
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, 'off']
- at: 13
  set: [sensor.s1, unavailable]
- at: 14
  set: [sensor.s1, '8']
  attributes: {lvl: 1}
- at: 15
  set: [light.l1, unavailable]
- at: 16
  set: [light.l1, 'on']
- at: 17
  set: [light.l1, unavailable]
- at: 20
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 20
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  send: {type: event, event_type: e3}
- at: 23
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: e2}
- at: 26
  set: [light.l1, 'on']
- at: 29
  set: [sensor.s1, unknown]
- at: 31
  set: [sensor.s1, '8']

# random scenario, seed 303, index 119 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  - trigger: event
    event_type: e1
    event_data: {k: 1}
    id: beta
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
    target: {entity_id: light.l1}
    continue_on_error: true
  - {stop: s}
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - or:
            - {condition: time, after: '23:00:00', before: '22:14'}
            - condition: or
              conditions:
              - '{{ is_state(''light.l2'', ''off'') }}'
              - {condition: state, entity_id: sensor.s1, state: '20'}
          sequence:
          - event: m_2
            event_data: {n: 2, v: '{{ trigger.id }}'}
          - action: test.s3
            data: {n: 3, v: '{{ trigger.idx }}'}
        - conditions:
          - condition: or
            conditions:
            - or:
              - '{{ is_state(''light.l1'', ''on'') }}'
              - {condition: state, entity_id: light.gone, state: 'on'}
              - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
            - {condition: time, before: '06:00'}
          sequence:
          - {wait_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}'}
      - delay: {seconds: '{{ 2 }}'}
      - wait_for_trigger:
        - trigger: state
          entity_id: sensor.s1
          to: ['20', '4']
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - {event: m_6}
      - variables: {v1: 1}
      - action: test.s7
        data: {n: 7, v: '{{ now().second }}'}
    - sequence:
      - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: '00:00:03', continue_on_timeout: false}
      - event: m_9
        event_data: {n: 9, completed: '{{ wait.completed }}'}
      - action: test.s8
        data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: trigger, id: alpha}
        - condition: and
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
      - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      sequence:
      - action: test.s10
        target:
          entity_id: [light.l1, light.l2]
        response_variable: v2
    - conditions:
      - or:
        - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
      sequence:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    continue_on_error: true
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: abc, to: '20'}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  conditions:
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - sequence:
    - event: m_11
      event_data: {n: 11, v: '{{ states(''light.l1'') }}'}
    - action: test.s12
      data: {n: 12, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      response_variable: v1
    - if:
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      - {condition: time, after: '22:00', before: '22:13:30'}
      then:
      - repeat:
          while: ['{{ trigger.id == ''0'' }}', '{{ repeat.index <= 2 }}']
          sequence:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - variables: {v1: 1}
      else:
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: '{{ 2 }}'}
      - event: m_13
        event_data: {n: 13, completed: '{{ wait.completed }}'}
  - delay: {seconds: '{{ 2 }}'}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: unavailable, id: alpha}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: unavailable
    for: 1
    id: beta
  conditions:
  - {condition: time, after: '22:00', before: '22:13:30'}
  - not:
    - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    - {condition: time, after: '22:00', before: '22:13:30'}
  actions:
  - {stop: s, error: true}
  - {delay: '00:00:02'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      sequence:
      - action: test.s14
        data: {n: 14, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 5
  set: [sensor.s1, '1']
- at: 6
  send: {type: service_result, call_id: 0, ok: false, error_kind: invalid}
- at: 7
  set: [sensor.s1, abc]
- at: 10
  set: [light.l1, unavailable]
- at: 11
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 13
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 16
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 17
  send: {type: service_result, call_id: 2, ok: true}
- at: 18
  set: [sensor.s1, unavailable]
- at: 19
  send: {type: service_result, call_id: 3, ok: false, error_kind: invalid}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s1, '4']
  attributes: {lvl: 2}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 23
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 24
  send: {type: service_result, call_id: 4, ok: true}
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 26
  send: {type: event, event_type: e2}
- at: 27
  set: [light.l1, 'on']

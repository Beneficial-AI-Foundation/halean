# random scenario, seed 303, index 2 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  max: 3
  triggers:
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    id: beta
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  - trigger: state
    entity_id: light.l1
    from: [unavailable, 'off']
  conditions: ['{{ trigger.id == ''0'' }}']
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - {event: m_1}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  - {trigger: event, event_type: e1}
  actions:
  - action: test.s2
    target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {delay: 1}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, to: 'on'}
    - {trigger: state, entity_id: light.l1, from: 'on'}
    timeout: 0
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 9
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 9
  send: {type: event, event_type: e2}
- at: 10
  set: [sensor.s1, '8']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 12
  send: {type: service_result, call_id: 0, ok: true}
- at: 15
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 21
  send: {type: event, event_type: e1}
- at: 22
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 23
  set: [sensor.s1, '7.5']
- at: 24
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: x}
- at: 27
  set: [sensor.s1, '20']
- at: 28
  send:
    type: service_result
    call_id: 3
    ok: true
    response: {value: 1}
- at: 29
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 31
  send: {type: event, event_type: tick}
- at: 31
  set: [sensor.s1, unavailable]
- at: 32
  set: [light.l1, 'on']

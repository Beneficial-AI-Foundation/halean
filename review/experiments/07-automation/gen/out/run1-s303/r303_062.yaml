# random scenario, seed 303, index 62 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, attribute: lvl}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', id: beta}
  actions:
  - if:
    - condition: state
      entity_id: sensor.s1
      state: ['8', '4']
    then:
    - action: test.s1
      data: {n: 1, v: '{{ now().second }}'}
    - parallel:
      - {event: m_2}
      - sequence:
        - variables: {v1: x}
  - {delay: 2}
  - action: test.s3
    data: {n: 3, v: '{{ now().second }}'}
    target: {entity_id: light.l1}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: event, event_type: e2}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    to: ['on', 'off']
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - {event: m_4}
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - repeat:
          for_each: [a, b]
          sequence:
          - action: test.s5
            data: {n: 5, v: '{{ trigger.platform }}'}
          - action: test.s6
            data: {n: 6, v: '{{ trigger.idx }}'}
            target: {entity_id: light.l1}
          - action: test.s7
            data: {n: 7, v: '{{ trigger.id }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
            continue_on_error: true
      - delay: {seconds: 1}
  - wait_template: '{{ trigger.platform == ''event'' }}'
    timeout: {seconds: 2}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - sequence:
    - {delay: '{{ 1 }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  set: [light.l1, unavailable]
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 9
  set: [light.l1, unavailable]
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  send: {type: event, event_type: e1}
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 17
  send: {type: service_result, call_id: 0, ok: true}
- at: 18
  set: [light.l1, 'on']
- at: 20
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 21
  send: {type: service_result, call_id: 1, ok: true}

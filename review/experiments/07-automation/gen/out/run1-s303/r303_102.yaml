# random scenario, seed 303, index 102 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'off', to: 'on'}
  - {trigger: event, event_type: e2}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: [sensor.s1]
      from: unavailable
    timeout: 3
    continue_on_timeout: false
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - sequence:
    - action: test.s1
      data: {n: 1, v: '{{ states(''light.l1'') }}'}
    - {delay: 0}
    continue_on_error: true
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: unknown, to: '12'}
  - {trigger: state, entity_id: sensor.s1}
  actions:
  - parallel:
    - sequence:
      - repeat:
          while:
          - condition: and
            conditions:
            - condition: trigger
              id: [beta, '0']
            - condition: time
              after: '22:13:25'
              before: '22:13:30'
              weekday: [wed, mon]
            - condition: time
              after: '23:00:00'
              before: 06:00
              weekday: [tue]
          - '{{ repeat.index <= 2 }}'
          sequence:
          - parallel:
            - event: m_3
              event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
            - sequence:
              - {delay: 0, enabled: false}
        continue_on_error: true
      - {stop: s, error: true}
    - sequence:
      - repeat:
          count: 2
          sequence:
          - {delay: '{{ 1 }}'}
    - sequence:
      - action: test.s4
        data: {n: 4, v: '{{ trigger.platform }}'}
  - action: test.s5
    data: {n: 5, v: '{{ trigger.idx }}'}
  - sequence:
    - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 0}
    - {delay: '00:00:02'}
    - variables:
        v1: [a, '{{ 1 + 1 }}']
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: parallel
  max: 2
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'on'}
  - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  actions:
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      sequence:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 1}
  - action: test.s6
    data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [light.l1, 'on']
- at: 2
  send: {type: service_result, call_id: 0, ok: true}
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l1, unavailable]
- at: 8
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 9
  set: [sensor.s1, '1']
- at: 12
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 13
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 15
  send: {type: service_result, call_id: 2, ok: true}
- at: 15
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: e2}
- at: 15
  send: {type: service_result, call_id: 3, ok: true}
- at: 18
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s1, abc]
- at: 21
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 24
  send: {type: event, event_type: e3}
- at: 25
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 26
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 28
  set: [light.l1, unavailable]
- at: 29
  set: [sensor.s1, '20']
- at: 31
  send: {type: service_result, call_id: 4, ok: true}

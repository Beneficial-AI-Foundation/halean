# random scenario, seed 303, index 179 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: 1}
    id: alpha
  - {trigger: state, entity_id: sensor.s1}
  conditions:
  - not:
    - condition: not
      conditions:
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
      - {condition: time, after: '22:00', before: '22:14'}
    - {condition: numeric_state, entity_id: sensor.s1, above: 6}
    - not:
      - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
      - {condition: time, after: '22:13:25'}
  actions:
  - choose:
    - conditions:
      - '{{ is_state(''light.l1'', ''on'') }}'
      - condition: and
        conditions:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - condition: state
          entity_id: [sensor.s1, light.l1]
          state: 'on'
          match: any
      sequence:
      - if:
        - condition: state
          entity_id: light.l1
          state: ['on', unavailable]
        - not:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        then:
        - {wait_template: '{{ states(''sensor.s2'') | float(0) < 15 }}', timeout: 1, continue_on_timeout: false}
        - event: m_1
          event_data: {n: 1, completed: '{{ wait.completed }}'}
        - choose:
          - conditions:
            - condition: and
              conditions:
              - {condition: time, after: '23:00:00', before: '06:00'}
              - condition: or
                conditions:
                - {condition: time, after: '23:00:00'}
                - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
                - {condition: numeric_state, entity_id: sensor.s2, below: 15}
                enabled: false
              - {condition: numeric_state, entity_id: sensor.s1, below: 15}
              enabled: false
            - condition: and
              conditions:
              - condition: or
                conditions:
                - '{{ trigger.id == ''0'' }}'
                - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
              - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            sequence:
            - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - {event: m_2}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
  - {trigger: event, event_type: e3}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', for: 2, id: alpha}
  conditions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - parallel:
    - sequence:
      - parallel:
        - sequence:
          - {delay: '00:00:02'}
          - action: test.s3
            data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
            continue_on_error: true
          - repeat:
              count: 3
              sequence:
              - variables: {v1: 1}
              - event: m_4
                event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - sequence:
          - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
            timeout: 1
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        continue_on_error: true
      - action: test.s6
        data: {n: 6, v: '{{ trigger.id }}'}
    - {event: m_7}
  - {event: m_8}
  - action: test.s9
    data: {n: 9, v: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: e2}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 4
  set: [sensor.s1, unavailable]
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 7
  set: [sensor.s1, '1']
- at: 8
  send: {type: event, event_type: e3}
- at: 8
  set: [sensor.s1, '12']
- at: 9
  send: {type: event, event_type: e2}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: e3}
- at: 15
  set: [sensor.s1, '8']
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  send: {type: service_result, call_id: 0, ok: true}
- at: 18
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  set: [light.l1, 'on']
- at: 21
  send: {type: service_result, call_id: 1, ok: true}
- at: 21
  set: [sensor.s1, '1']
  attributes: {lvl: 2}
- at: 22
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 23
  send: {type: service_result, call_id: 2, ok: true}
- at: 24
  send: {type: event, event_type: tick}

# random scenario, seed 303, index 30 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: [light.l1]
    to: 'on'
    not_from: 'on'
    id: beta
  - {trigger: state, entity_id: light.l1, id: alpha}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.id }}'}
  - wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
- alias: a1
  id: id1
  mode: parallel
  max: 2
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - parallel:
    - sequence:
      - repeat:
          count: 1
          sequence:
          - {delay: '00:00:02'}
          - parallel:
            - event: m_3
              event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            - event: m_4
              event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - action: test.s5
        data: {n: 5, v: '{{ this.attributes.current }}'}
      - choose:
        - conditions: ['{{ states(''sensor.s1'') | int(0) > 7 }}', '{{ trigger.platform == ''event'' }}']
          sequence:
          - repeat:
              while:
              - {condition: state, entity_id: light.l1, state: unavailable}
              - '{{ repeat.index <= 3 }}'
              sequence:
              - action: test.s6
                data: {n: 6, v: '{{ trigger.description }}'}
                target:
                  entity_id: [light.l1, light.l2]
              - {event: m_7, enabled: false}
        default:
        - if:
          - condition: time
            after: '22:00'
            before: '22:14'
            weekday: [tue]
          - {condition: trigger, id: '1'}
          then:
          - delay: {seconds: 1}
          - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', enabled: false}
    - {event: m_8}
  - event: m_9
    event_data: {n: 9, v: '{{ trigger.platform }}'}
  - event: m_10
    event_data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - choose:
    - conditions: ['{{ states(''sensor.s2'') | float(0) < 15 }}']
      sequence:
      - {stop: s}
      - {delay: 0}
  - {delay: 1}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, unknown]
  attributes: {lvl: 2}
- at: 6
  set: [sensor.s1, '4']
- at: 7
  set: [light.l1, 'on']
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 10
  set: [light.l1, unavailable]
- at: 11
  set: [light.l1, 'off']
- at: 14
  set: [sensor.s1, '8']
- at: 14
  set: [sensor.s1, '20']
  attributes: {lvl: 1}
- at: 17
  send: {type: service_result, call_id: 0, ok: true}
- at: 18
  send: {type: event, event_type: tick}
- at: 19
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 22
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 23
  set: [sensor.s1, '20']
- at: 24
  set: [sensor.s1, '12']
- at: 24
  send: {type: service_result, call_id: 1, ok: true}
- at: 26
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 26
  send: {type: service_result, call_id: 2, ok: true}
- at: 27
  send: {type: event, event_type: e1}
- at: 28
  send: {type: event, event_type: e1}
- at: 31
  send: {type: event, event_type: tick}

# random scenario, seed 303, index 31 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 3, to: 3, attribute: lvl, id: beta}
  - {trigger: state, entity_id: sensor.s1}
  actions:
  - sequence:
    - parallel:
      - sequence:
        - repeat:
            count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
            sequence:
            - action: test.s1
              data: {n: 1, v: '{{ trigger.description }}'}
            - {delay: 1}
      - sequence:
        - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '00:00:03', continue_on_timeout: false}
        - event: m_2
          event_data: {n: 2, completed: '{{ wait.completed }}'}
      - event: m_3
        event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - event: m_4
    event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - {wait_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
- alias: a1
  id: id1
  mode: parallel
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, to: unavailable, id: beta}
  - {trigger: state, entity_id: sensor.s1, not_from: abc}
  - {trigger: state, entity_id: light.l1, to: 1, attribute: lvl}
  conditions:
  - {condition: time, after: '23:00:00', before: '06:00'}
  actions:
  - repeat:
      count: 0
      sequence:
      - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 0}
      - event: m_8
        event_data: {n: 8, completed: '{{ wait.completed }}'}
      - choose:
        - conditions: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
          sequence:
          - sequence:
            - {delay: 2}
            - {delay: '{{ 1 }}'}
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          - {delay: '00:00:02'}
          - action: test.s5
            data: {n: 5, v: '{{ trigger.id }}'}
            continue_on_error: true
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
          sequence:
          - {event: m_6}
          - sequence:
            - action: test.s7
              data: {n: 7, v: '{{ this.attributes.current }}'}
              target:
                entity_id: [light.l1, light.l2]
            - variables: {v2: 1}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - not:
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
          - '{{ states(''sensor.s1'') | int(0) > 7 }}'
      sequence:
      - sequence:
        - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 2, continue_on_timeout: false}
        - event: m_10
          event_data: {n: 10, completed: '{{ wait.completed }}'}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - condition: trigger
        id: [beta, '0']
      sequence:
      - {stop: s, error: true}
  - variables: {v3: x}
  - condition: not
    conditions:
    - {condition: time, before: '06:00'}
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
    - '{{ states(''sensor.s1'') | int > 5 }}'
  - sequence:
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '8'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 3
  set: [light.l1, 'off']
- at: 4
  set: [sensor.s1, '7.5']
  attributes: {lvl: 2}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 7
  send: {type: service_result, call_id: 0, ok: true}
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  set: [sensor.s1, unknown]
  attributes: {lvl: 2}
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 11
  set: [light.l1, unavailable]
- at: 11
  set: [sensor.s1, '4']
- at: 14
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 15
  send: {type: event, event_type: e1}
- at: 17
  set: [light.l1, 'on']
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 21
  send:
    type: service_result
    call_id: 2
    ok: true
    response:
      value: [1, 2]
- at: 22
  send: {type: event, event_type: e1}
- at: 25
  set: [sensor.s1, abc]
- at: 25
  set: [sensor.s1, '8']
- at: 26
  set: [sensor.s1, '20']

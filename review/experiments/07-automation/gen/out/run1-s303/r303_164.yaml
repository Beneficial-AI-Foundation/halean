# random scenario, seed 303, index 164 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: state
    entity_id: light.l1
    not_from: [unavailable, 'on']
    to: 'off'
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: 2
    attribute: lvl
  - trigger: state
    entity_id: light.l1
    to: ['off', 'on']
    for: 00:00:02
  actions:
  - {stop: s, error: true}
  - if:
    - and: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
    then:
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
    else:
    - action: test.s1
      data: {n: 1, v: '{{ trigger.platform }}'}
      response_variable: v1
    - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - condition: or
    conditions:
    - not:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
      - '{{ is_state(''light.l1'', ''on'') }}'
      - {condition: state, entity_id: light.l1, state: 'off'}
    enabled: false
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: parallel
  max: 3
  triggers:
  - {trigger: event, event_type: e2, id: beta}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, above: 3}
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  actions:
  - {event: m_2}
  - sequence:
    - {delay: '{{ 1 }}'}
    - event: m_3
      event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
    - action: test.s4
      data: {n: 4, v: '{{ trigger.idx }}'}
      response_variable: v1
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: unknown}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 11
  send: {type: event, event_type: e3}
- at: 12
  set: [light.l1, unavailable]
- at: 13
  set: [light.l1, 'on']
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 16
  set: [light.l1, unavailable]
- at: 17
  set: [light.l1, 'on']
- at: 20
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 22
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 1}

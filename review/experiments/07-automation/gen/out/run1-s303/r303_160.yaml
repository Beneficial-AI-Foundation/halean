# random scenario, seed 303, index 160 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: 1}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
  conditions:
  - condition: or
    conditions:
    - {condition: trigger, id: alpha}
    - {condition: trigger, id: '0'}
  actions:
  - repeat:
      for_each:
      - {k: 1}
      - null
      sequence:
      - if:
        - {condition: time, before: '06:00'}
        then:
        - action: test.s1
          data: {n: 1, v: '{{ trigger.description }}'}
          continue_on_error: true
        - condition: not
          conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 6}
          - {condition: trigger, id: '1'}
        - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        else:
        - action: test.s2
          data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
          target:
            entity_id: [light.l1, light.l2]
        - condition: state
          entity_id: sensor.s1
          state: ['1', '20']
        - event: m_3
          event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - if:
        - condition: not
          conditions:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
          - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
          - {condition: trigger, id: alpha}
        then:
        - {event: m_4}
        - if:
          - {condition: numeric_state, entity_id: sensor.s1, above: 6}
          - condition: trigger
            id: [beta, '0']
          then:
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
          - event: m_5
            event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
          else:
          - action: test.s6
            data: {n: 6, v: '{{ trigger.idx }}'}
            continue_on_error: true
          - {event: m_7}
        continue_on_error: true
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: trigger, id: '0'}
      sequence:
      - parallel:
        - event: m_8
          event_data: {n: 8, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
        - event: m_9
          event_data: {n: 9, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions:
      - condition: or
        conditions:
        - and:
          - {condition: state, entity_id: light.l1, state: 'off'}
      sequence:
      - sequence:
        - {condition: trigger, id: alpha}
        - action: test.s10
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          response_variable: v2
        - {event: m_11}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: queued
  triggers:
  - {trigger: state, entity_id: light.l1, from: 2, attribute: lvl, for: 2}
  - {trigger: event, event_type: e2}
  actions:
  - event: m_12
    event_data: {n: 12, v: '{{ states(''sensor.s1'') }}'}
  - repeat:
      count: 1
      sequence:
      - {event: m_13}
      - action: test.s14
        data: {n: 14, v: '{{ states(''sensor.s1'') }}'}
- alias: a2
  id: id2
  mode: queued
  max: 3
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'on'}
  - {trigger: state, entity_id: light.l1, from: 'on', for: 1}
  - {trigger: state, entity_id: light.l1, attribute: lvl}
  actions:
  - repeat:
      for_each: '{{ [''x'', 1] }}'
      sequence:
      - delay: {seconds: '{{ 2 }}'}
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: time, after: '23:00:00', before: '22:14'}
      - and:
        - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
        - {condition: time, after: '22:13:25', before: '06:00'}
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          - condition: trigger
            id: [beta, '0']
        enabled: false
      sequence:
      - {stop: s, error: true}
      - variables: {v1: x}
      - wait_for_trigger:
        - {trigger: event, event_type: e3}
      - event: m_15
        event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - conditions:
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      - condition: and
        conditions:
        - condition: or
          conditions:
          - {condition: state, entity_id: light.l1, state: 'off'}
        - and:
          - condition: state
            entity_id: [sensor.s1, light.l1]
            state: 'on'
            match: any
          - condition: state
            entity_id: sensor.s1
            state: unavailable
            for: {seconds: 1}
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: [sensor.s1, light.l1]
          from: 3
          attribute: lvl
          for: {seconds: 2}
        timeout: 3
      - event: m_16
        event_data: {n: 16, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
    default:
    - action: test.s17
      target: {entity_id: light.l1}
  - action: test.s18
    data: {n: 18, v: '{{ trigger.platform }}'}
    continue_on_error: true
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
steps:
- at: 0
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 2
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 2
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l1, 'off']
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 7
  set: [light.l1, 'off']
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  set: [light.l1, 'on']
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 11
  send: {type: event, event_type: e3}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 13
  send: {type: service_result, call_id: 2, ok: true}
- at: 15
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 16
  set: [sensor.s1, '1']
  attributes: {lvl: 3}
- at: 19
  send: {type: service_result, call_id: 3, ok: true}
- at: 19
  set: [light.l1, 'off']
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 20
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 20
  send: {type: service_result, call_id: 4, ok: true}
- at: 21
  send: {type: event, event_type: tick}

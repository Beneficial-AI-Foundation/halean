# random scenario, seed 303, index 120 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: ['1', '20']
  - trigger: state
    entity_id: [light.l1, sensor.s1]
  conditions:
  - condition: not
    conditions:
    - and:
      - {condition: time, before: '22:14'}
    - {condition: state, entity_id: light.l1, state: 'on'}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ now().second }}'}
  - parallel:
    - sequence:
      - {delay: '00:00:02'}
    - sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, not_from: 2, to: 3, attribute: lvl}
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
        - trigger: state
          entity_id: light.l1
          not_to: [unavailable, 'on']
        timeout: 1
        continue_on_timeout: false
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - sequence:
      - delay: {seconds: 1}
  - if:
    - {condition: state, entity_id: light.l1, state: unavailable, for: 2}
    then:
    - repeat:
        for_each: [a, b]
        sequence:
        - event: m_3
          event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
        - action: test.s4
          data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - if: ['{{ states(''sensor.s1'') | int > 5 }}']
      then:
      - {event: m_5}
      - sequence:
        - variables: {v1: x}
        - delay: {seconds: '{{ 2 }}'}
      - repeat:
          for_each: '{{ [''x'', 1] }}'
          sequence:
          - delay: {seconds: '{{ 2 }}'}
          - {condition: time, after: '22:00', before: '22:14'}
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        - {condition: trigger, id: alpha}
        enabled: false
      sequence:
      - sequence:
        - parallel:
          - sequence:
            - action: test.s6
              data: {n: 6, v: '{{ this.attributes.current }}'}
            - action: test.s7
              target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
              continue_on_error: true
          - event: m_8
            event_data: {n: 8, v: '{{ now().second }}'}
          - sequence:
            - event: m_9
              event_data: {n: 9, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - {delay: 1}
        - {delay: '00:00:02'}
        - parallel:
          - sequence:
            - event: m_10
              event_data: {n: 10, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
            - action: test.s11
              data: {n: 11, v: '{{ now().second }}'}
          - {event: m_12}
        continue_on_error: true
      - {event: m_13}
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - condition: and
        conditions:
        - {condition: trigger, id: alpha, enabled: false}
      sequence:
      - repeat:
          until: ['{{ repeat.index >= 1 }}']
          sequence:
          - action: test.s14
            data: {n: 14, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        timeout: {seconds: 2}
        continue_on_timeout: false
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
          sequence:
          - action: test.s15
            target:
              entity_id: [light.l1, light.l2]
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
          - event: m_19
            event_data: {n: 19, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - sequence:
            - event: m_16
              event_data: {n: 16, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
            - {action: test.s17}
            - event: m_18
              event_data: {n: 18, v: '{{ this.attributes.current }}'}
              enabled: false
        default:
        - {event: m_20}
        - {delay: 1}
    enabled: false
  - if:
    - {condition: numeric_state, entity_id: sensor.s1, below: 15}
    then:
    - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
    - event: m_21
      event_data: {n: 21, completed: '{{ wait.completed }}'}
    continue_on_error: true
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: state, entity_id: sensor.s1, to: 1, not_from: 2, attribute: lvl}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: event, event_type: e2}
  conditions:
  - {condition: time, before: '06:00'}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: light.l1
      to: [unavailable, 'off']
      from: 'off'
    timeout: 0
    continue_on_timeout: false
  - sequence:
    - {delay: 2}
    - {stop: s}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: '4'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 2}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 4
  send: {type: event, event_type: e2}
- at: 6
  set: [light.l1, 'on']
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, '7.5']
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e1}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: e3}
- at: 24
  set: [sensor.s1, '1']
- at: 24
  set: [sensor.s1, '12']
- at: 25
  set: [light.l1, 'off']
- at: 26
  send: {type: event, event_type: e3}
- at: 29
  set: [sensor.s1, unknown]
  attributes: {lvl: 1}
- at: 30
  set: [light.l1, 'on']
- at: 32
  set: [sensor.s1, unknown]
  attributes: {lvl: 3}
- at: 34
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 35
  send: {type: event, event_type: tick}
- at: 36
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 37
  set: [light.l1, unavailable]

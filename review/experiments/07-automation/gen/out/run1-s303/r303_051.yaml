# random scenario, seed 303, index 51 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - trigger: event
    event_type: e3
    event_data: {k: true}
  conditions:
  - condition: and
    conditions:
    - condition: and
      conditions:
      - {condition: time, after: '23:00:00', enabled: false}
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
    - or:
      - {condition: time, before: '06:00'}
      - '{{ states(''sensor.s2'') | float(0) < 5 }}'
  actions:
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
      sequence:
      - wait_template: '{{ trigger.platform == ''event'' }}'
        timeout: {seconds: 2}
      - event: m_1
        event_data: {n: 1, completed: '{{ wait.completed }}'}
    - conditions:
      - '{{ is_state(''light.l2'', ''off'') }}'
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', enabled: false}
      sequence:
      - sequence:
        - sequence:
          - action: test.s2
            data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
            target: {entity_id: light.l1}
    continue_on_error: true
  - choose:
    - conditions: ['{{ trigger.platform == ''event'' }}']
      sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
    - conditions:
      - condition: not
        conditions:
        - '{{ trigger.platform == ''event'' }}'
        - {condition: state, entity_id: light.l1, state: unavailable}
      sequence:
      - event: m_3
        event_data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
      - {action: test.s4}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: event
    event_type: e2
    event_data: {k: true}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  conditions:
  - not:
    - condition: time
      after: '23:00:00'
      before: '22:13:30'
      weekday: [wed, mon]
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, below: 9}
  - {condition: numeric_state, entity_id: sensor.s1, below: 15}
  actions:
  - {stop: s}
  - action: test.s5
    data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
  - event: m_6
    event_data: {n: 6, v: '{{ trigger.id }}'}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - trigger: state
    entity_id: [light.l1]
    to: 3
    from: 2
    attribute: lvl
  - {trigger: event, event_type: e2, id: alpha}
  conditions:
  - condition: and
    conditions:
    - condition: and
      conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - condition: state
        entity_id: light.l1
        state: ['on', 'off']
  - {condition: time, after: '22:13:25', before: '22:13:30'}
  actions:
  - choose:
    - conditions:
      - or:
        - condition: not
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2, enabled: false}
        - condition: and
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
          - '{{ states(''sensor.s2'') | float(0) < 9 }}'
          - {condition: time, after: '22:13:25', before: '22:14'}
        - {condition: trigger, id: '0'}
      sequence:
      - variables:
          v1: [a, '{{ 1 + 1 }}']
      - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
    - conditions:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - {condition: time, before: '06:00'}
          - {condition: trigger, id: alpha}
          - {condition: time, after: '23:00:00', before: '22:14'}
        - {condition: numeric_state, entity_id: sensor.s1, above: 6}
      - condition: not
        conditions:
        - or:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', enabled: false}
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - condition: or
          conditions:
          - condition: state
            entity_id: [light.l1]
            state: 'on'
            match: any
          - {condition: state, entity_id: light.l1, state: unavailable}
          - condition: trigger
            id: [beta, '0']
      sequence:
      - parallel:
        - {event: m_7}
        - sequence:
          - choose:
            - conditions:
              - {condition: state, entity_id: light.l1, state: unavailable}
              - {condition: time, after: '23:00:00', before: '22:14'}
              sequence:
              - {action: test.s8}
              - {event: m_9, enabled: false}
            - conditions: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
              sequence:
              - variables: {v2: 1}
                enabled: false
              - {action: test.s10}
              - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
          - parallel:
            - sequence:
              - variables: {v4: x}
              - {event: m_11}
            - sequence:
              - {condition: time, after: '22:13:25', before: '22:13:30'}
              - delay: {seconds: 1}
        continue_on_error: true
      - if:
        - condition: and
          conditions:
          - condition: not
            conditions:
            - {condition: time, after: '22:13:25', before: '06:00'}
            - {condition: state, entity_id: light.l1, state: unavailable}
          - '{{ states(''sensor.s1'') | int > 5 }}'
        - condition: time
          after: '22:00'
          weekday: [tue]
        then:
        - repeat:
            count: 0
            sequence:
            - action: test.s12
              data: {n: 12, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
              continue_on_error: true
        - {condition: trigger, id: '0'}
    default:
    - {event: m_13}
    - variables: {v3: 1}
      enabled: false
  - parallel:
    - sequence:
      - event: m_14
        event_data: {n: 14, v: '{{ now().second }}', var: '{{ v6 | default(''undef'') }}'}
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: light.l1
          to: 'off'
          not_from: ['off', 'on']
        timeout: 2
      - event: m_15
        event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - variables: {v6: 1}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      - {condition: time, before: '06:00'}
      sequence:
      - action: test.s16
        data: {n: 16, v: '{{ trigger.platform }}'}
        continue_on_error: true
        enabled: false
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      sequence:
      - parallel:
        - sequence:
          - sequence:
            - delay: {seconds: '{{ 2 }}'}
            - {action: test.s17, response_variable: v8}
            - {action: test.s18}
        - sequence:
          - parallel:
            - {event: m_19}
            - sequence:
              - action: test.s20
                data: {n: 20, v: '{{ this.attributes.current }}'}
                target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
                enabled: false
              - {action: test.s21}
            continue_on_error: true
          - delay: {seconds: 1}
        - sequence:
          - variables: {v8: '{{ states(''sensor.s1'') }}'}
          - {action: test.s22}
      - sequence:
        - variables: {v8: 1}
        - if:
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          then:
          - {condition: time, after: '22:00', before: '22:13:30', weekday: tue}
          - event: m_23
            event_data: {n: 23, v: '{{ trigger.id }}', var: '{{ v8 | default(''undef'') }}'}
          else:
          - delay: {seconds: 1}
    default:
    - if:
      - {condition: time, after: '23:00:00'}
      then:
      - action: test.s24
        data: {n: 24, v: '{{ states(''sensor.s1'') }}'}
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
      - event: m_25
        event_data: {n: 25, completed: '{{ wait.completed }}'}
      else:
      - parallel:
        - sequence:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
          - action: test.s26
            data: {n: 26, v: '{{ states(''sensor.s1'') }}'}
        - sequence:
          - event: m_27
            event_data: {n: 27, v: '{{ this.attributes.current }}'}
      - sequence:
        - event: m_28
          event_data: {n: 28, v: '{{ trigger.idx }}'}
        - delay: {seconds: 1}
        continue_on_error: true
      - repeat:
          until: ['{{ repeat.index >= 3 }}']
          sequence:
          - action: test.s29
            data: {n: 29, v: '{{ states(''sensor.s1'') }}'}
            continue_on_error: true
    - action: test.s30
      data: {n: 30, v: '{{ trigger.description }}'}
    - wait_for_trigger:
      - trigger: event
        event_type: e3
        event_data: {k: true}
    - event: m_31
      event_data: {n: 31, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    continue_on_error: true
  - repeat:
      count: 0
      sequence:
      - {action: test.s32}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0, v8: 0, v9: 0, v10: 0}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  set: [sensor.s1, '12']
- at: 1
  send: {type: event, event_type: tick}
- at: 4
  set: [light.l1, 'off']
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 7
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 9
  send: {type: service_result, call_id: 0, ok: true}
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send: {type: service_result, call_id: 1, ok: true}
- at: 14
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: 1}
- at: 15
  send: {type: service_result, call_id: 3, ok: false, error_kind: ha_error}
- at: 16
  send: {type: service_result, call_id: 4, ok: true}

# random scenario, seed 303, index 0 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - {trigger: state, entity_id: light.l1}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: trigger, id: alpha}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    continue_on_error: true
  - if:
    - {condition: trigger, id: alpha}
    then:
    - sequence:
      - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
      - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
      - choose:
        - conditions: ['{{ trigger.platform == ''event'' }}']
          sequence:
          - condition: or
            conditions:
            - condition: or
              conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              - {condition: time, before: '22:14'}
            - or:
              - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
          - {delay: 0}
    - choose:
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3}
        sequence:
        - {delay: 1}
        - event: m_2
          event_data: {n: 2, v: '{{ now().second }}'}
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      default:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
    else:
    - parallel:
      - event: m_3
        event_data: {n: 3, v: '{{ this.attributes.current }}'}
      - event: m_4
        event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      continue_on_error: true
    - choose:
      - conditions:
        - {condition: time, before: '06:00'}
        sequence:
        - if:
          - condition: or
            conditions:
            - '{{ states(''sensor.s1'') | int > 5 }}'
            - {condition: time, after: '22:00', before: '22:13:30'}
            - condition: or
              conditions:
              - {condition: state, entity_id: light.l1, state: unavailable}
            enabled: false
          - or:
            - and:
              - {condition: time, before: '22:13:30'}
              - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
            - and:
              - {condition: state, entity_id: sensor.s1, state: '12'}
          then:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - {delay: 2}
          else:
          - condition: or
            conditions:
            - condition: or
              conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            - condition: and
              conditions:
              - condition: time
                after: '22:13:25'
                before: '22:14'
                weekday: [wed, mon]
            - {condition: numeric_state, entity_id: sensor.s1, below: 15}
          - variables: {v1: x}
      default:
      - sequence:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
        continue_on_error: true
        enabled: false
      - {event: m_5}
  - event: m_6
    event_data: {n: 6, v: '{{ this.attributes.current }}'}
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: '8'
  conditions:
  - condition: trigger
    id: [beta, '0']
  - condition: or
    conditions:
    - condition: trigger
      id: [beta, '0']
    - {condition: state, entity_id: light.l1, state: unavailable}
  actions:
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - event: m_7
    event_data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - event: m_8
    event_data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
steps:
- at: 0
  set: [light.l1, 'on']
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, unavailable]
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 6
  send: {type: event, event_type: e1}
- at: 6
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 7
  set: [light.l1, 'off']
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: tick}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 12
  set: [light.l1, 'on']
- at: 12
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 13
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 16
  send: {type: event, event_type: e2}
- at: 19
  set: [light.l1, 'off']
- at: 20
  set: [sensor.s1, unavailable]
- at: 22
  send: {type: event, event_type: e1}

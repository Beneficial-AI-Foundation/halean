# random scenario, seed 303, index 1 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e1}
  - trigger: state
    entity_id: sensor.s1
    to: ['4', unavailable]
    id: beta
  conditions:
  - {condition: time, after: '22:00'}
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - sequence:
    - {stop: s}
    - action: test.s1
      data: {n: 1, v: '{{ states(''light.l1'') }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      continue_on_error: true
  - action: test.s2
    data: {n: 2, v: '{{ trigger.platform }}'}
    response_variable: v2
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 1}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, '8']
  attributes: {lvl: 3}
- at: 5
  set: [light.l1, 'on']
- at: 6
  set: [sensor.s1, '12']
  attributes: {lvl: 2}
- at: 9
  send: {type: event, event_type: e2}
- at: 12
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e1}
- at: 18
  set: [sensor.s1, '12']
- at: 19
  send: {type: event, event_type: e2}
- at: 22
  set: [light.l1, 'off']
- at: 22
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 25
  set: [light.l1, unavailable]
- at: 26
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 27
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 28
  set: [sensor.s1, unavailable]
- at: 29
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 30
  send: {type: event, event_type: tick}

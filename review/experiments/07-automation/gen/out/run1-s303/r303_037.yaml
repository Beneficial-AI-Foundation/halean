# random scenario, seed 303, index 37 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: unavailable}
  - trigger: event
    event_type: e2
    event_data: {k: a}
  actions:
  - parallel:
    - sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
      - {delay: 0}
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.description }}'}
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - {delay: 2}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: ['12', '4']
    to: '1'
  - {trigger: state, entity_id: sensor.s1, from: '7.5', id: alpha}
  - {trigger: state, entity_id: light.l1, from: unavailable}
  actions:
  - if:
    - {condition: trigger, id: '0'}
    then:
    - event: m_3
      event_data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    else:
    - variables: {v1: '{{ states(''sensor.s1'') }}'}
    - repeat:
        count: 3
        sequence:
        - {action: test.s4}
        - event: m_5
          event_data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - {delay: '{{ 1 }}'}
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: light.l1
        state: ['on', unavailable]
        for: 2
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
    then:
    - {action: test.s6}
  - {delay: 2, enabled: false}
  - event: m_7
    event_data: {n: 7, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v1 | default(''undef'') }}'}
  - event: m_8
    event_data: {n: 8, v: '{{ this.attributes.current }}'}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  variables: {v1: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, not_from: '8'}
  - trigger: state
    entity_id: [light.l1]
    from: ['on', 'off']
  - {trigger: state, entity_id: light.l1, not_to: 'on', not_from: 'on'}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.s1
      from: '12'
      to: [unknown, '12']
  - event: m_9
    event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ trigger.id == ''0'' }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e1}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [sensor.s1, '1']
- at: 9
  set: [light.l1, unavailable]
- at: 10
  send: {type: event, event_type: e2}
- at: 13
  set: [light.l1, 'off']
- at: 16
  set: [light.l1, unavailable]
- at: 17
  set: [sensor.s1, '8']
  attributes: {lvl: 2}
- at: 18
  send: {type: event, event_type: e3}
- at: 18
  send: {type: service_result, call_id: 0, ok: true}
- at: 20
  set: [light.l1, 'off']
- at: 21
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 22
  set: [light.l1, unavailable]
- at: 24
  send: {type: event, event_type: e3}

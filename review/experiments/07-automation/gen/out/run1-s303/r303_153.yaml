# random scenario, seed 303, index 153 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: state, entity_id: light.l1, to: 'on', not_from: unavailable, id: alpha}
  conditions:
  - not:
    - condition: not
      conditions:
      - {condition: state, entity_id: light.gone, state: unavailable}
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
    - {condition: state, entity_id: light.l1, state: 'off'}
    - condition: or
      conditions:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - '{{ states(''sensor.s1'') | int(0) > 7 }}'
  actions:
  - repeat:
      count: 1
      sequence:
      - parallel:
        - sequence:
          - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
          - wait_for_trigger:
            - trigger: state
              entity_id: light.l1
              not_from: 'off'
              to: [unavailable, 'on']
              for: 1
            - trigger: template
              value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'
              for: {seconds: 2}
            timeout: 1
            continue_on_timeout: false
        - sequence:
          - {event: m_1}
  - repeat:
      count: '{{ 2 }}'
      sequence:
      - choose:
        - conditions:
          - condition: time
            before: 06:00
            weekday: [tue]
            enabled: false
          sequence:
          - action: test.s2
            data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
        - conditions:
          - '{{ states(''sensor.s1'') | int > 5 }}'
          - and:
            - {condition: time, after: '23:00:00', weekday: tue}
          sequence:
          - repeat:
              count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
              sequence:
              - action: test.s3
                data: {n: 3, v: '{{ trigger.idx }}'}
      - sequence:
        - variables:
            v1: [a, '{{ 1 + 1 }}']
        continue_on_error: true
      - sequence:
        - {stop: s}
        - {delay: '00:00:02', enabled: false}
    continue_on_error: true
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, attribute: lvl, id: alpha}
  - trigger: state
    entity_id: sensor.s1
    from: '20'
    to: abc
    for: {seconds: '{{ 1 + 1 }}'}
  - {trigger: event, event_type: e3}
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: or
          conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
      sequence:
      - action: test.s4
        data: {n: 4, v: '{{ trigger.id }}'}
        response_variable: v1
      - choose:
        - conditions:
          - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
          sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
        - conditions:
          - condition: and
            conditions:
            - condition: not
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, above: 3}
              - {condition: trigger, id: alpha}
            - {condition: trigger, id: alpha}
          - '{{ states(''sensor.s1'') | int > 5 }}'
          sequence:
          - event: m_5
            event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
        default:
        - action: test.s6
          data: {n: 6, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          enabled: false
        continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - {condition: trigger, id: '0'}
        - {condition: trigger, id: '0'}
      sequence:
      - parallel:
        - sequence:
          - {event: m_7}
        - sequence:
          - event: m_8
            event_data: {n: 8, v: '{{ trigger.description }}'}
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - sequence:
          - {condition: time, after: '22:00', before: '06:00'}
          - condition: not
            conditions:
            - {condition: state, entity_id: light.l1, state: 'off'}
      - parallel:
        - sequence:
          - variables: {v2: '{{ states(''sensor.s1'') }}'}
        - sequence:
          - variables:
              v3: [a, '{{ 1 + 1 }}']
            enabled: false
        - {event: m_9}
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - action: test.s10
    data: {n: 10, v: '{{ now().second }}'}
  - if: ['{{ states(''sensor.s1'') | int(0) > 10 }}']
    then:
    - wait_for_trigger:
      - {trigger: event, event_type: e3}
      - {trigger: state, entity_id: sensor.s1, not_to: unavailable}
      timeout: {seconds: 2}
    - repeat:
        until: ['{{ repeat.index >= 2 }}']
        sequence:
        - {delay: 1}
        - parallel:
          - sequence:
            - action: test.s11
              data: {n: 11, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          - sequence:
            - action: test.s12
              data: {n: 12, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - action: test.s13
              data: {n: 13, v: '{{ states(''light.l1'') }}'}
          - sequence:
            - action: test.s14
              data: {n: 14, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        - action: test.s15
          data: {n: 15, v: '{{ this.attributes.current }}'}
          target: {entity_id: light.l1}
      continue_on_error: true
    - {event: m_16}
    else:
    - choose:
      - conditions:
        - {condition: state, entity_id: sensor.s1, state: '12'}
        sequence:
        - {event: m_17}
        - {event: m_18}
      - conditions:
        - {condition: trigger, id: '1'}
        sequence:
        - action: test.s19
          data: {n: 19, v: '{{ states(''sensor.s1'') }}'}
          response_variable: v7
        - action: test.s20
          data: {n: 20, v: '{{ now().second }}'}
        - parallel:
          - event: m_21
            event_data: {n: 21, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
          - event: m_22
            event_data: {n: 22, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v5 | default(''undef'') }}'}
      continue_on_error: true
    - {delay: 0}
    - repeat:
        count: 1
        sequence:
        - variables: {v6: '{{ repeat.index if repeat is defined else -1 }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0, v7: 0, v8: 0}
- alias: a2
  id: id2
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: beta}
  - {trigger: state, entity_id: light.l1, from: 'off'}
  actions:
  - {delay: 0}
  - {stop: s, error: true}
  - choose:
    - conditions:
      - and:
        - {condition: time, before: '22:13:30'}
        - and:
          - {condition: time, after: '22:00', before: '22:14', weekday: tue}
          - {condition: time, after: '23:00:00', before: '22:14'}
      sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, to: '7.5'}
      - event: m_23
        event_data: {n: 23, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: '{{ 1 }}'}
  - repeat:
      count: 0
      sequence:
      - {stop: s}
states:
- {entity_id: sensor.s1, state: '20'}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 3}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 6
  set: [sensor.s1, '7.5']
- at: 7
  set: [light.l1, unavailable]
- at: 10
  send:
    type: service_result
    call_id: 0
    ok: true
    response:
      value: [1, 2]
- at: 12
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 15
  send:
    type: service_result
    call_id: 1
    ok: true
    response:
      value: [1, 2]
- at: 18
  set: [light.l1, 'off']
- at: 19
  set: [light.l1, unavailable]
- at: 20
  send: {type: event, event_type: e3}
- at: 21
  send:
    type: service_result
    call_id: 2
    ok: true
    response:
      value: [1, 2]

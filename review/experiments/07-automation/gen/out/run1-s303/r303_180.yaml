# random scenario, seed 303, index 180 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: '20'}
  - trigger: state
    entity_id: sensor.s1
    to: ['20', abc]
    for: 2
  actions:
  - if: ['{{ is_state(''light.l1'', ''on'') }}']
    then:
    - {stop: s}
    - action: test.s1
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
    else:
    - if:
      - {condition: time, after: '23:00:00', before: '22:14'}
      then:
      - {stop: s, error: true}
      - action: test.s2
        data: {n: 2, v: '{{ trigger.id }}'}
        continue_on_error: true
      else:
      - {wait_template: '{{ trigger.id == ''0'' }}', timeout: '{{ 2 }}', continue_on_timeout: false}
    - action: test.s3
      data: {n: 3, v: '{{ trigger.id }}'}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - {event: m_4}
  - condition: state
    entity_id: light.l1
    state: ['on', unavailable]
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}'}
  - sequence:
    - {stop: s}
- alias: a1
  id: id1
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: light.l1, not_from: 'off', for: 3}
  - {trigger: state, entity_id: light.l1, to: 'on'}
  - trigger: state
    entity_id: [light.l1]
    to: 1
    attribute: lvl
  actions:
  - variables: {v1: x}
  - action: test.s6
    data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    continue_on_error: true
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 15 }}'}
  - {trigger: state, entity_id: sensor.s1, from: 1, attribute: lvl}
  actions:
  - action: test.s7
    data: {n: 7, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: light.l1}
  - event: m_8
    event_data: {n: 8, v: '{{ this.attributes.current }}'}
  - action: test.s9
    data: {n: 9, v: '{{ trigger.description }}'}
    target:
      entity_id: [light.l1, light.l2]
    response_variable: v2
  - sequence:
    - event: m_10
      event_data: {n: 10, v: '{{ this.attributes.current }}', var: '{{ v1 | default(''undef'') }}'}
      enabled: false
    - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
    - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
states:
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 2
  set: [light.l1, 'off']
- at: 3
  set: [light.l1, unavailable]
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l1, 'on']
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  set: [light.l1, unavailable]
- at: 8
  set: [light.l1, 'off']
- at: 9
  send: {type: service_result, call_id: 0, ok: false, error_kind: other}
- at: 10
  set: [light.l1, unavailable]
- at: 10
  set: [sensor.s1, '1']
- at: 10
  send: {type: event, event_type: tick}

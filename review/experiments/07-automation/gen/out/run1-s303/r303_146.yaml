# random scenario, seed 303, index 146 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  triggers:
  - trigger: event
    event_type: e1
    event_data: {k: a}
  - trigger: state
    entity_id: sensor.s1
    from: '8'
    to: '8'
    for: {seconds: 2}
  - trigger: event
    event_type: e1
    event_data: {k: true}
    id: alpha
  conditions:
  - '{{ trigger.platform == ''event'' }}'
  - or:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - {condition: numeric_state, entity_id: sensor.s1, above: sensor.s2}
  actions:
  - parallel:
    - sequence:
      - sequence:
        - repeat:
            count: 1
            sequence:
            - action: test.s1
              data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
            - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
        - event: m_3
          event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - event: m_2
          event_data: {n: 2, v: '{{ now().second }}'}
        continue_on_error: true
      - sequence:
        - {action: test.s4, response_variable: v1}
    - sequence:
      - wait_for_trigger:
        - trigger: event
          event_type: e3
          event_data: {k: true}
        - trigger: state
          entity_id: light.l1
          for: {seconds: '{{ 1 + 1 }}'}
        timeout: 1
        continue_on_timeout: false
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', timeout: 2}
    - sequence:
      - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - variables: {v1: x}
  - parallel:
    - sequence:
      - variables: {v1: '{{ states(''sensor.s1'') }}'}
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.description }}', var: '{{ v1 | default(''undef'') }}'}
      - wait_for_trigger:
        - trigger: state
          entity_id: light.l1
          to: [unavailable, 'on']
        - {trigger: event, event_type: e1}
        timeout: 3
        continue_on_timeout: false
    - {event: m_6}
  - if:
    - condition: time
      after: '22:00'
      weekday: [wed, mon]
    - not:
      - condition: not
        conditions:
        - {condition: time, after: '22:00', before: '06:00'}
        - {condition: time, before: '22:13:30'}
      - {condition: state, entity_id: light.l1, state: unavailable}
      - condition: or
        conditions:
        - {condition: time, before: '22:14'}
        - condition: time
          after: '22:13:25'
          weekday: [wed, mon]
    then:
    - {delay: '{{ 1 }}'}
    else:
    - {stop: s}
    - delay: {seconds: 1}
  - variables:
      v3: [a, '{{ 1 + 1 }}']
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - trigger: state
    entity_id: light.l1
    for: {seconds: 2}
  - {trigger: state, entity_id: sensor.s1, from: '8', to: unavailable, for: 2}
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: sensor.s1, state: '8', for: '00:00:03'}
      sequence:
      - variables: {v1: x}
      - wait_for_trigger:
        - trigger: event
          event_type: e3
          event_data: {k: a}
        - {trigger: state, entity_id: light.l1, to: unavailable, from: 'on'}
        timeout: 0
      - event: m_7
        event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - if:
    - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
    then:
    - action: test.s8
      data: {n: 8, v: '{{ trigger.description }}'}
    - repeat:
        while:
        - not:
          - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
          - condition: and
            conditions:
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            enabled: false
          enabled: false
        - '{{ repeat.index <= 3 }}'
        sequence:
        - {action: test.s9}
        - variables:
            v2: [a, '{{ 1 + 1 }}']
    - {stop: s, error: true}
    else:
    - {stop: s}
    - event: m_10
      event_data: {n: 10, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
states:
- entity_id: sensor.s1
  state: unknown
  attributes: {lvl: 2}
- entity_id: sensor.s2
  state: '12'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 3
  send: {type: event, event_type: e3}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  set: [light.l1, unavailable]
- at: 7
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 8
  send: {type: service_result, call_id: 1, ok: true}

# random scenario, seed 303, index 56 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: 0}
  triggers:
  - trigger: state
    entity_id: light.l1
    from: ['on', 'off']
    to: ['on', unavailable]
  - {trigger: state, entity_id: light.l1, to: 2, from: 3, attribute: lvl, id: alpha}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - wait_for_trigger:
    - trigger: state
      entity_id: [light.l1]
      from: 1
      attribute: lvl
    timeout: 1
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, to: unavailable}
    timeout: 1
    continue_on_timeout: false
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, from: 1, attribute: lvl, for: '{{ 2 }}'}
    - trigger: state
      entity_id: sensor.s1
      to: '8'
      not_from: abc
      for: {seconds: 2}
    timeout: 3
- alias: a1
  id: id1
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  - trigger: state
    entity_id: [light.l1]
    attribute: lvl
  conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
  actions:
  - event: m_4
    event_data: {n: 4, v: '{{ this.attributes.current }}'}
  - {action: test.s5, continue_on_error: true, response_variable: v1}
  - variables: {v1: x}
  - sequence:
    - delay: {seconds: '{{ 2 }}'}
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', for: 3}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: 3
    to: 2
    attribute: lvl
    for: 1
  - trigger: state
    entity_id: sensor.s1
    not_to: ['12', abc]
    from: unavailable
  actions:
  - sequence:
    - {delay: 0}
    - {event: m_6}
  - variables: {v1: x}
  - sequence:
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    - {stop: s, error: true}
    - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 0}
  - choose:
    - conditions:
      - and:
        - or:
          - '{{ trigger.id == ''0'' }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: 6}
          - {condition: time, after: '22:13:25', before: '22:14'}
      sequence:
      - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 1, continue_on_timeout: false}
      - repeat:
          for_each: '{{ [''x'', 1] }}'
          sequence:
          - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
          - event: m_7
            event_data: {n: 7, completed: '{{ wait.completed }}'}
  - repeat:
      count: 3
      sequence:
      - event: m_8
        event_data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  variables: {v1: 0}
states:
- entity_id: sensor.s1
  state: '7.5'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 2
  send: {type: event, event_type: e2}
- at: 3
  set: [light.l1, unavailable]
- at: 3
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  set: [sensor.s1, '7.5']
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 10
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 11
  set: [sensor.s1, abc]
- at: 12
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, '12']
- at: 15
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 16
  set: [light.l1, 'off']
- at: 16
  send: {type: event, event_type: tick}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 17
  set: [light.l1, 'on']
- at: 17
  set: [light.l1, 'off']
- at: 17
  set: [sensor.s1, '20']
  attributes: {lvl: 2}
- at: 18
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 18
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 21
  send: {type: event, event_type: tick}
- at: 22
  send: {type: event, event_type: tick}
- at: 24
  send:
    type: event
    event_type: e2
    data: {k: 1}

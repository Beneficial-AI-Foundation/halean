# random scenario, seed 303, index 103 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  actions:
  - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - sequence:
    - action: test.s2
      data: {n: 2, v: '{{ states(''light.l1'') }}'}
      continue_on_error: true
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    attribute: lvl
    for: 1
  - {trigger: state, entity_id: sensor.s1}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    from: ['on', unavailable]
    for: 2
  actions:
  - sequence:
    - {stop: s}
    - action: test.s3
      target: {entity_id: light.l1}
    - choose:
      - conditions:
        - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
        sequence:
        - action: test.s4
          data: {n: 4, v: '{{ states(''light.l1'') }}'}
          target:
            entity_id: [light.l1, light.l2]
          response_variable: v1
      - conditions:
        - condition: or
          conditions:
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          - {condition: numeric_state, entity_id: sensor.s1, below: 9}
        - {condition: state, entity_id: sensor.s1, state: '7.5'}
        sequence:
        - {delay: '00:00:02'}
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - variables: {v3: '{{ (v3 | default(0) | int(0)) + 1 }}'}
      default:
      - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: 0, continue_on_timeout: false}
      - choose:
        - conditions:
          - condition: not
            conditions:
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
              enabled: false
            - condition: or
              conditions: ['{{ states(''sensor.s1'') | int(0) > 3 }}', '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
          - or:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          sequence:
          - {delay: 1}
          - {action: test.s5}
        - conditions:
          - condition: state
            entity_id: sensor.s1
            state: '12'
            for: {seconds: 1}
          - '{{ is_state(''light.l1'', ''on'') }}'
          sequence:
          - variables: {v3: x}
          - event: m_6
            event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}', var: '{{ v4 | default(''undef'') }}'}
      - {action: test.s7}
  - {condition: time, after: '22:00', before: '22:13:30'}
  - {delay: 2}
  - {stop: s}
  - event: m_8
    event_data: {n: 8, v: '{{ trigger.description }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 2}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'on']
- at: 6
  send: {type: event, event_type: tick}
- at: 6
  send: {type: event, event_type: e3}
- at: 9
  set: [sensor.s1, unknown]
- at: 10
  set: [sensor.s1, '4']
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 12
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 15
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 18
  send: {type: event, event_type: tick}

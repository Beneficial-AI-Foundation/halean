# random scenario, seed 303, index 18 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - {trigger: state, entity_id: sensor.s1, for: 3}
  - {trigger: event, event_type: e3}
  actions:
  - {stop: s, error: true}
  - action: test.s1
    data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    target: {entity_id: light.l1}
    continue_on_error: true
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e2, id: alpha}
  - {trigger: state, entity_id: sensor.s1, not_from: 1, attribute: lvl, for: 3}
  actions:
  - action: test.s2
    data: {n: 2, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    enabled: false
  - wait_for_trigger:
    - {trigger: event, event_type: e3}
  - event: m_5
    event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - event: m_3
    event_data: {n: 3, v: '{{ trigger.platform }}'}
  - action: test.s4
    data: {n: 4, v: '{{ this.attributes.current }}'}
    continue_on_error: true
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: event, event_type: e1}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    to: [unavailable, 'off']
    for: 3
  conditions:
  - {condition: trigger, id: '0'}
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - {condition: state, entity_id: light.l1, state: unavailable}
  - {condition: numeric_state, entity_id: sensor.s2, above: 3}
  - {event: m_6}
  - if:
    - {condition: time, after: '22:00', before: '22:13:30', weekday: tue}
    - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
    then:
    - {event: m_7}
    - wait_for_trigger:
      - {trigger: state, entity_id: sensor.s1, not_to: '12'}
      - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      timeout: 3
      continue_on_timeout: false
    - event: m_8
      event_data: {n: 8, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    else:
    - repeat:
        while:
        - {condition: time, after: '22:13:25'}
        - '{{ repeat.index <= 2 }}'
        sequence:
        - {delay: 1}
  - event: m_9
    event_data: {n: 9, v: '{{ trigger.id }}'}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 3
  set: [light.l1, unavailable]
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 6
  set: [light.l1, 'off']
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 7
  send: {type: event, event_type: e3}
- at: 8
  send: {type: event, event_type: e1}
- at: 9
  send: {type: event, event_type: e3}
- at: 11
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 12
  send: {type: service_result, call_id: 0, ok: true}
- at: 15
  send: {type: event, event_type: e1}
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  set: [light.l1, unavailable]
- at: 18
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: tick}
- at: 19
  set: [light.l1, unavailable]
- at: 20
  send: {type: event, event_type: e3}
- at: 22
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 23
  set: [sensor.s1, '1']

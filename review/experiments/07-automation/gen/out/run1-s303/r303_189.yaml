# random scenario, seed 303, index 189 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 2, id: alpha}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    to: '12'
    for: 00:00:02
  - {trigger: event, event_type: e1, id: beta}
  conditions:
  - {condition: time, before: '22:13:30'}
  - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
  actions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - action: test.s1
    target: {entity_id: light.l1}
    response_variable: v1
  - if:
    - condition: and
      conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
    then:
    - choose:
      - conditions:
        - {condition: trigger, id: alpha}
        - and:
          - condition: or
            conditions:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
            - {condition: trigger, id: '0'}
          - {condition: time, after: '22:00', enabled: false}
        sequence:
        - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - if:
          - condition: not
            conditions:
            - {condition: numeric_state, entity_id: sensor.s2, below: 15}
            - condition: not
              conditions:
              - '{{ trigger.platform == ''event'' }}'
              - {condition: time, after: '22:00'}
          - condition: and
            conditions:
            - condition: not
              conditions:
              - {condition: time, after: '23:00:00'}
              - {condition: trigger, id: '0'}
            - condition: state
              entity_id: light.l1
              state: 'on'
              for: {seconds: 1}
            enabled: false
          then:
          - action: test.s2
            data: {n: 2, v: '{{ trigger.platform }}'}
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s1, above: 6}
        - condition: and
          conditions:
          - condition: and
            conditions:
            - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 15}
            - condition: time
              after: '23:00:00'
              before: '22:14'
              weekday: [tue]
          - '{{ states(''sensor.s2'') | float(0) < 15 }}'
        sequence:
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1}
          - {trigger: event, event_type: e1}
          timeout: 3
        - event: m_4
          event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - sequence:
          - {event: m_3}
          continue_on_error: true
    - repeat:
        count: '{{ 2 }}'
        sequence:
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
          enabled: false
        - action: test.s5
          data: {n: 5, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
          target: {entity_id: light.l1}
    continue_on_error: true
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - delay: {seconds: '{{ 2 }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - trigger: state
    entity_id: light.l1
    to: ['off', 'on']
    from: ['on', 'off']
    id: alpha
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', for: 1}
  conditions:
  - condition: and
    conditions:
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
    - '{{ is_state(''light.l2'', ''off'') }}'
  actions:
  - repeat:
      for_each: '{{ states(''light.l1'') }}'
      sequence:
      - delay: {seconds: '{{ 2 }}'}
  - variables: {v1: 1}
  - {condition: time, after: '23:00:00', before: '22:13:30'}
  - repeat:
      count: 2
      sequence:
      - action: test.s6
        data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        target:
          entity_id: [light.l1, light.l2]
      - sequence:
        - delay: {seconds: 1}
  - action: test.s7
    target:
      entity_id: [light.l1, light.l2]
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 1}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, unavailable]
- at: 4
  set: [light.l1, 'on']
- at: 6
  send: {type: event, event_type: tick}
- at: 9
  set: [light.l1, 'off']
- at: 12
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 13
  set: [light.l1, unavailable]
- at: 14
  send: {type: event, event_type: e2}
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 19
  send: {type: event, event_type: e3}
- at: 21
  send: {type: event, event_type: e2}

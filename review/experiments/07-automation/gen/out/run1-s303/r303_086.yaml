# random scenario, seed 303, index 86 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
  - {trigger: state, entity_id: light.l1}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    not_to: ['8', '12']
  actions:
  - variables:
      v1: [a, '{{ 1 + 1 }}']
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      - condition: time
        before: '22:14'
        weekday: [tue]
      sequence:
      - event: m_1
        event_data: {n: 1, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
    - conditions: ['{{ is_state(''light.l1'', ''on'') }}', '{{ states(''sensor.s1'') | int > 5 }}']
      sequence:
      - action: test.s2
        data: {n: 2, v: '{{ now().second }}'}
        response_variable: v2
      - {stop: s}
      - {wait_template: '{{ states(''sensor.s1'') | int(0) > 10 }}', timeout: 2}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
      sequence:
      - {action: test.s4}
    - conditions:
      - condition: state
        entity_id: light.l1
        state: [unavailable, 'off']
      sequence:
      - {event: m_5}
    default:
    - {stop: s}
    - event: m_6
      event_data: {n: 6, v: '{{ trigger.id }}'}
  - event: m_7
    event_data: {n: 7, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, to: 2, attribute: lvl, for: '{{ 2 }}'}
  - {trigger: event, event_type: e1}
  conditions:
  - condition: state
    entity_id: sensor.s1
    state: abc
    for: {seconds: 1}
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - {event: m_8}
  - sequence:
    - event: m_9
      event_data: {n: 9, v: '{{ trigger.id }}'}
    continue_on_error: true
    enabled: false
- alias: a2
  id: id2
  mode: queued
  max: 3
  variables: {v1: '{{ trigger.platform }}', v2: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: unknown, to: '4'}
  - {trigger: state, entity_id: light.l1, not_from: unavailable, for: 1}
  actions:
  - repeat:
      count: '{{ states(''sensor.s1'') | int(0) // 4 }}'
      sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: sensor.s1, attribute: lvl, for: '00:00:02'}
        timeout: {seconds: 2}
      - event: m_10
        event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: 2}
  - event: m_16
    event_data: {n: 16, completed: '{{ wait.completed }}'}
  - sequence:
    - action: test.s11
      data: {n: 11, v: '{{ states(''sensor.s1'') }}'}
      response_variable: v2
  - {delay: '{{ 1 }}'}
  - repeat:
      count: 1
      sequence:
      - choose:
        - conditions:
          - condition: not
            conditions:
            - '{{ is_state(''light.l1'', ''on'') }}'
            - condition: not
              conditions:
              - condition: trigger
                id: [beta, '0']
          - {condition: time, before: '06:00'}
          sequence:
          - sequence:
            - action: test.s12
              data: {n: 12, v: '{{ this.attributes.current }}'}
              continue_on_error: true
          - event: m_13
            event_data: {n: 13, v: '{{ this.attributes.current }}'}
        enabled: false
      - repeat:
          for_each:
          - {k: 1}
          - null
          sequence:
          - event: m_14
            event_data: {n: 14, v: '{{ trigger.idx }}', var: '{{ v2 | default(''undef'') }}'}
          - wait_for_trigger:
            - {trigger: event, event_type: e1}
            timeout: 3
          - event: m_15
            event_data: {n: 15, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '1'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [light.l1, unavailable]
- at: 2
  set: [sensor.s1, '12']
- at: 3
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 3
  set: [light.l1, 'off']
- at: 4
  send: {type: service_result, call_id: 0, ok: true}
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 7
  set: [sensor.s1, '20']
  attributes: {lvl: 3}
- at: 8
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: x}
- at: 9
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 11
  set: [light.l1, unavailable]
- at: 14
  send: {type: event, event_type: e1}
- at: 16
  send: {type: event, event_type: e1}
- at: 18
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 23
  send: {type: service_result, call_id: 5, ok: false, error_kind: ha_error}
- at: 24
  send: {type: event, event_type: tick}
- at: 25
  send: {type: service_result, call_id: 4, ok: true}
- at: 28
  send: {type: service_result, call_id: 6, ok: false, error_kind: invalid}
- at: 30
  set: [light.l1, unavailable]
- at: 31
  send: {type: service_result, call_id: 7, ok: false, error_kind: ha_error}
- at: 31
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 31
  send: {type: service_result, call_id: 3, ok: false, error_kind: ha_error}

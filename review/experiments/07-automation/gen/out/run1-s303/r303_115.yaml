# random scenario, seed 303, index 115 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: event, event_type: e1}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: ['1', unknown]
  - trigger: state
    entity_id: light.l1
    from: ['on', 'off']
  actions:
  - {delay: 0}
  - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 1, continue_on_timeout: false}
  - event: m_2
    event_data: {n: 2, completed: '{{ wait.completed }}'}
  - action: test.s1
    data: {n: 1, v: '{{ trigger.description }}'}
  - {stop: s}
- alias: a1
  id: id1
  mode: queued
  max: 2
  variables: {v1: 0, v2: 0, v3: 0}
  triggers:
  - {trigger: state, entity_id: sensor.s1}
  - {trigger: event, event_type: e3}
  - {trigger: state, entity_id: sensor.s1, not_to: '8'}
  actions:
  - action: test.s3
    data: {n: 3, v: '{{ now().second }}'}
    target: {entity_id: light.l1}
    response_variable: v2
  - delay: {seconds: '{{ 2 }}'}
  - {stop: s}
  - choose:
    - conditions: ['{{ states(''sensor.s1'') | int(0) > 7 }}']
      sequence:
      - {event: m_4}
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.idx }}'}
      - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s6
    data: {n: 6, v: '{{ this.attributes.current }}'}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'off'}
  - {trigger: state, entity_id: light.l1, from: 3, to: 2, attribute: lvl}
  actions:
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - action: test.s7
    data: {n: 7, v: '{{ trigger.idx }}'}
    target:
      entity_id: [light.l1, light.l2]
  - {stop: s, error: true}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 1
  send: {type: event, event_type: e1}
- at: 2
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  set: [sensor.s1, '20']
- at: 6
  set: [sensor.s1, '1']
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  set: [light.l1, unavailable]
- at: 10
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 11
  set: [sensor.s1, '8']
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, 'off']
- at: 12
  set: [light.l1, 'on']
- at: 15
  set: [sensor.s1, '7.5']
- at: 16
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 17
  send: {type: event, event_type: tick}
- at: 20
  send: {type: event, event_type: tick}
- at: 22
  set: [light.l1, 'on']
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 24
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 27
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: 1}
- at: 28
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 31
  set: [light.l1, unavailable]

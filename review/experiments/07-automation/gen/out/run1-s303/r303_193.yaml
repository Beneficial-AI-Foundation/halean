# random scenario, seed 303, index 193 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  variables: {v1: '{{ states(''sensor.s2'') }}', v2: 0, v3: 0}
  triggers:
  - trigger: state
    entity_id: light.l1
    from: [unavailable, 'off']
  - trigger: state
    entity_id: [light.l1]
    to: ['on', unavailable]
  - {trigger: state, entity_id: light.l1, from: 2, to: 3, attribute: lvl}
  conditions:
  - and:
    - {condition: trigger, id: alpha}
    - condition: trigger
      id: [beta, '0']
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - action: test.s1
    target: {entity_id: light.l1}
    continue_on_error: true
    response_variable: v3
- alias: a1
  id: id1
  variables: {v1: 0}
  triggers:
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    not_from: '1'
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: '00:00:02', id: beta}
  actions:
  - action: test.s2
    data: {n: 2, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    continue_on_error: true
  - sequence:
    - {condition: trigger, id: '0', enabled: false}
  - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: 2}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}'}
states:
- entity_id: sensor.s1
  state: '20'
  attributes: {lvl: 3}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 3
  set: [sensor.s1, '7.5']
  attributes: {lvl: 3}
- at: 5
  set: [sensor.s1, '7.5']
- at: 6
  send: {type: service_result, call_id: 0, ok: false, error_kind: invalid}
- at: 8
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 9
  set: [sensor.s1, '4']
- at: 11
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: x}
- at: 12
  set: [light.l1, 'on']
- at: 15
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 15
  set: [light.l1, 'on']
- at: 16
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: 2}

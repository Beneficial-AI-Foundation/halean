# random scenario, seed 303, index 6 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: event, event_type: e1}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  actions:
  - repeat:
      while:
      - or:
        - '{{ is_state(''light.l2'', ''off'') }}'
        - {condition: time, after: '22:13:25', before: '06:00', weekday: tue}
        - condition: or
          conditions:
          - {condition: state, entity_id: sensor.s1, state: '12'}
          - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
          - {condition: time, before: '06:00'}
      - '{{ repeat.index <= 2 }}'
      sequence:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - variables:
          v2: [a, '{{ 1 + 1 }}']
  - variables:
      v2: [a, '{{ 1 + 1 }}']
  - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
states:
- {entity_id: sensor.s2, state: '1'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 2}
steps:
- at: 1
  set: [sensor.s1, '20']
- at: 2
  send: {type: event, event_type: e1}
- at: 3
  set: [light.l1, 'off']
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 9
  set: [light.l1, 'on']
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 11
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send: {type: event, event_type: e1}
- at: 13
  set: [light.l1, unavailable]
- at: 13
  send: {type: event, event_type: e1}
- at: 13
  set: [sensor.s1, '4']
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 15
  set: [sensor.s1, '1']
- at: 15
  set: [sensor.s1, '4']
- at: 16
  send: {type: event, event_type: e2}
- at: 19
  send: {type: event, event_type: e3}

# random scenario, seed 303, index 41 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, not_to: 2, attribute: lvl}
  - {trigger: state, entity_id: sensor.s1, from: unavailable}
  conditions:
  - {condition: numeric_state, entity_id: sensor.s2, below: 9}
  actions:
  - {delay: '{{ 1 }}'}
  - action: test.s1
    target: {entity_id: light.l1}
    continue_on_error: true
  - {event: m_2}
  - choose:
    - conditions:
      - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - {condition: numeric_state, entity_id: sensor.s1, below: 9, enabled: false}
      sequence:
      - event: m_3
        event_data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 9}
      - condition: and
        conditions:
        - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      sequence:
      - sequence:
        - if:
          - and:
            - and:
              - condition: state
                entity_id: light.l1
                state: ['off', 'on']
              - {condition: time, after: '22:00'}
            - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
            enabled: false
          then:
          - {condition: trigger, id: '0'}
        continue_on_error: true
    default:
    - wait_for_trigger:
      - trigger: event
        event_type: e3
        event_data: {k: a}
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - action: test.s4
      data: {n: 4, v: '{{ trigger.description }}'}
  - {action: test.s6}
- alias: a1
  id: id1
  variables: {v1: 0}
  triggers:
  - {trigger: event, event_type: e1}
  - trigger: state
    entity_id: light.l1
    to: ['on', unavailable]
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - {stop: s}
  - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}'}
  - {stop: s, error: true}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  - trigger: event
    event_type: e1
    event_data: {k: true}
    id: alpha
  actions:
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
  - {stop: s}
  - event: m_8
    event_data: {n: 8, v: '{{ states(''sensor.s1'') }}'}
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: 1, continue_on_timeout: false}
states:
- {entity_id: sensor.s1, state: '12'}
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 4
  set: [light.l1, 'off']
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 6
  set: [sensor.s1, abc]
- at: 7
  send: {type: event, event_type: e2}
- at: 8
  set: [sensor.s1, '20']
- at: 10
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [sensor.s1, '12']
- at: 14
  send: {type: event, event_type: e1}

# random scenario, seed 303, index 137 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}'}
  triggers:
  - {trigger: state, entity_id: sensor.s1, to: unknown}
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: time, after: '23:00:00', before: '06:00', weekday: tue}
  - and:
    - {condition: numeric_state, entity_id: sensor.s1, below: 9}
    - or:
      - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      - condition: state
        entity_id: light.l1
        state: [unavailable, 'off']
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - parallel:
    - sequence:
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
      - {action: test.s1, continue_on_error: true, enabled: false}
    - sequence:
      - event: m_3
        event_data: {n: 3, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
      - {stop: s}
  - {stop: s}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, attribute: lvl}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  conditions:
  - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - parallel:
    - sequence:
      - {event: m_5}
    - sequence:
      - parallel:
        - sequence:
          - sequence:
            - event: m_6
              event_data: {n: 6, v: '{{ trigger.id }}'}
        - sequence:
          - repeat:
              for_each:
              - {k: 1}
              - null
              sequence:
              - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - sequence:
          - choose:
            - conditions:
              - condition: not
                conditions:
                - '{{ is_state(''light.l2'', ''off'') }}'
                - condition: and
                  conditions:
                  - {condition: state, entity_id: sensor.s1, state: '1'}
                  - {condition: state, entity_id: light.l1, state: unavailable, for: 2}
                  - '{{ states(''sensor.s1'') | int(0) > 10 }}'
              sequence:
              - action: test.s7
                data: {n: 7, v: '{{ states(''sensor.s1'') }}'}
              - {condition: trigger, id: alpha}
            default:
            - condition: not
              conditions:
              - {condition: trigger, id: alpha}
              - condition: or
                conditions:
                - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
                - {condition: numeric_state, entity_id: sensor.s2, below: 15}
      - {event: m_8}
      - action: test.s9
        data: {n: 9, v: '{{ states(''light.l1'') }}'}
        target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        continue_on_error: true
  - sequence:
    - wait_for_trigger:
      - trigger: event
        event_type: e1
        event_data: {k: a}
      timeout: 2
      continue_on_timeout: false
    - action: test.s10
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - {action: test.s11}
  - repeat:
      count: 2
      sequence:
      - event: m_12
        event_data: {n: 12, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send: {type: event, event_type: tick}
- at: 1
  set: [light.l1, unavailable]
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  set: [light.l1, 'off']
- at: 7
  set: [light.l1, 'on']
- at: 10
  set: [light.l1, unavailable]
- at: 11
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e2}
- at: 14
  set: [sensor.s1, '8']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [light.l1, 'on']
- at: 20
  send:
    type: event
    event_type: e1
    data: {k: 2}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 23
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 24
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 25
  send: {type: event, event_type: e1}
- at: 26
  set: [sensor.s1, unknown]
  attributes: {lvl: 3}
- at: 27
  send: {type: event, event_type: e2}
- at: 28
  set: [light.l1, 'on']
  attributes: {lvl: 3}

# random scenario, seed 303, index 88 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
  triggers:
  - trigger: state
    entity_id: light.l1
    not_from: unavailable
    to: ['on', 'off']
    id: beta
  - trigger: template
    value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
    for: {seconds: '{{ 1 + 1 }}'}
  - {trigger: state, entity_id: light.l1, not_from: unavailable}
  conditions:
  - not:
    - or:
      - {condition: trigger, id: alpha}
      - {condition: time, before: '06:00'}
    - {condition: numeric_state, entity_id: sensor.s2, below: 9, enabled: false}
    - '{{ is_state(''light.l1'', ''on'') }}'
  - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
  actions:
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 2}
    timeout: 3
    continue_on_timeout: false
  - repeat:
      count: 2
      sequence:
      - wait_for_trigger:
        - {trigger: state, entity_id: light.l1, to: 'on'}
        timeout: 3
      - {delay: '{{ 1 }}'}
      - variables: {v2: '{{ states(''sensor.s1'') }}'}
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
    - sequence:
      - {event: m_2}
      - if:
        - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
        then:
        - action: test.s3
          data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
        else:
        - action: test.s4
          data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - if:
        - and:
          - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
          - not:
            - {condition: trigger, id: '1'}
        then:
        - variables: {v3: x}
        - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
        else:
        - parallel:
          - event: m_5
            event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
          - sequence:
            - event: m_6
              event_data: {n: 6, v: '{{ trigger.platform }}'}
              enabled: false
            - variables: {v5: x}
            - variables: {v5: '{{ repeat.index if repeat is defined else -1 }}'}
        - repeat:
            while:
            - {condition: numeric_state, entity_id: sensor.s2, below: 9}
            - '{{ repeat.index <= 3 }}'
            sequence:
            - event: m_7
              event_data: {n: 7, v: '{{ trigger.platform }}', var: '{{ v4 | default(''undef'') }}'}
            - {event: m_8, enabled: false}
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'off'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s1, unavailable]
- at: 4
  set: [light.l1, unavailable]
- at: 5
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 6
  set: [light.l1, 'off']
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 8
  set: [light.l1, 'off']
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  set: [light.l1, 'off']
- at: 11
  send: {type: event, event_type: e2}
- at: 12
  send: {type: event, event_type: e3}
- at: 15
  set: [sensor.s1, '1']
- at: 15
  send: {type: event, event_type: e2}
- at: 16
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 17
  set: [sensor.s1, '20']
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, unavailable]
- at: 21
  set: [light.l1, 'off']
- at: 23
  send: {type: event, event_type: e1}
- at: 26
  set: [sensor.s1, '1']
  attributes: {lvl: 1}
- at: 26
  send: {type: event, event_type: e3}
- at: 28
  send: {type: event, event_type: e1}
- at: 29
  send:
    type: event
    event_type: e1
    data: {k: 2}

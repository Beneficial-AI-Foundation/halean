# random scenario, seed 303, index 46 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
  - trigger: template
    value_template: '{{ states(''sensor.s1'') | int > 5 }}'
    for: {seconds: '{{ 1 + 1 }}'}
  conditions:
  - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
  - condition: time
    after: '23:00:00'
    before: '22:14'
    weekday: [tue]
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - delay: {seconds: 1}
  - choose:
    - conditions:
      - {condition: time, after: '22:00'}
      - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      sequence:
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
      - variables:
          v1: [a, '{{ 1 + 1 }}']
  - parallel:
    - sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
        timeout: {seconds: 2}
      - event: m_4
        event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - action: test.s3
        data: {n: 3, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
      - repeat:
          until: ['{{ repeat.index >= 3 }}']
          sequence:
          - if:
            - {condition: numeric_state, entity_id: sensor.s2, below: 15}
            - condition: state
              entity_id: light.l1
              state: [unavailable, 'on']
            then:
            - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
            enabled: false
    - event: m_5
      event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
    enabled: false
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: '20'}
- {entity_id: sensor.s2, state: abc}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 3
  set: [sensor.s1, '8']
  attributes: {lvl: 2}
- at: 3
  send: {type: event, event_type: tick}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 9
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 11
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 12
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 15
  send: {type: event, event_type: e1}
- at: 15
  set: [sensor.s1, abc]
- at: 18
  send: {type: event, event_type: tick}
- at: 21
  send:
    type: event
    event_type: e2
    data: {k: 1}

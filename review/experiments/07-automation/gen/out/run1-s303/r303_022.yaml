# random scenario, seed 303, index 22 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1, to: 2, attribute: lvl}
  - {trigger: event, event_type: e3}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
  actions:
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, from: 3, attribute: lvl}
    timeout: 2
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - parallel:
    - event: m_1
      event_data: {n: 1, v: '{{ trigger.description }}'}
    - event: m_2
      event_data: {n: 2, v: '{{ now().second }}'}
  - choose:
    - conditions:
      - {condition: time, after: '22:00'}
      - {condition: numeric_state, entity_id: sensor.s1, below: 9}
      sequence:
      - {condition: trigger, id: alpha}
      - {delay: '00:00:02'}
    default:
    - event: m_3
      event_data: {n: 3, v: '{{ trigger.description }}'}
  - {delay: '00:00:02'}
- alias: a1
  id: id1
  mode: parallel
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: state, entity_id: light.l1, from: unavailable}
  conditions:
  - or:
    - and:
      - {condition: state, entity_id: light.l1, state: 'on'}
      - {condition: time, after: '22:13:25'}
  actions:
  - sequence:
    - event: m_5
      event_data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
    - {stop: s}
  - wait_template: '{{ is_state(''light.l2'', ''off'') }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}'}
  - {stop: s, error: true}
  - {stop: s}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, from: 'on'}
  - event: m_7
    event_data: {n: 7, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
- alias: a2
  id: id2
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', for: '00:00:02'}
  - {trigger: state, entity_id: sensor.s1, from: 2, attribute: lvl, id: beta}
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: [sensor.s1, light.l1]
      to: unavailable
      from: unavailable
    timeout: 1
  - event: m_11
    event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
      sequence:
      - if:
        - condition: trigger
          id: [beta, '0']
        then:
        - variables:
            v1: [a, '{{ 1 + 1 }}']
        - {stop: s}
        else:
        - if:
          - condition: not
            conditions:
            - condition: trigger
              id: [beta, '0']
            - or:
              - {condition: numeric_state, entity_id: sensor.s1, below: 15}
              enabled: false
            - not:
              - {condition: state, entity_id: light.l1, state: unavailable}
          then:
          - {event: m_8}
          - {condition: state, entity_id: light.l1, state: 'off'}
          else:
          - event: m_9
            event_data: {n: 9, v: '{{ states(''sensor.s1'') }}'}
          - {event: m_10}
          continue_on_error: true
        continue_on_error: true
    enabled: false
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '7.5'}
- entity_id: sensor.s2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: light.l1, state: 'off'}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 0
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 3
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 4
  set: [light.l1, 'on']
- at: 7
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 11
  send: {type: event, event_type: e1}
- at: 12
  send: {type: event, event_type: e3}
- at: 14
  send: {type: event, event_type: tick}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  set: [sensor.s1, '12']
  attributes: {lvl: 1}
- at: 18
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 19
  send:
    type: event
    event_type: e1
    data: {k: true}

# random scenario, seed 303, index 99 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
  triggers:
  - trigger: state
    entity_id: light.l1
    from: ['on', unavailable]
    for: {seconds: 2}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ trigger.platform }}'}
  - choose:
    - conditions:
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
      - {condition: time, after: '22:00'}
      sequence:
      - sequence:
        - parallel:
          - sequence:
            - {event: m_2}
          - sequence:
            - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 10 }}'}
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
      - choose:
        - conditions:
          - and:
            - condition: or
              conditions:
              - {condition: trigger, id: alpha}
              - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 9}
            - '{{ states(''sensor.s2'') | float(0) < 15 }}'
            - {condition: numeric_state, entity_id: sensor.s1, below: 15, enabled: false}
          sequence:
          - wait_for_trigger:
            - {trigger: state, entity_id: light.l1, attribute: lvl}
          - event: m_4
            event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
          - delay: {seconds: '{{ 2 }}'}
          - event: m_3
            event_data: {n: 3, v: '{{ trigger.description }}'}
        - conditions:
          - {condition: time, before: '06:00'}
          sequence:
          - wait_for_trigger:
            - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}', for: '00:00:02'}
            enabled: false
          - event: m_5
            event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - if:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
    - not:
      - {condition: state, entity_id: light.l1, state: 'off'}
      - '{{ is_state(''light.l2'', ''off'') }}'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: [sensor.s1, light.l1]
        from: unknown
        for: 00:00:02
      timeout: 3
      continue_on_timeout: false
    else:
    - sequence:
      - repeat:
          until: ['{{ repeat.index >= 2 }}']
          sequence:
          - delay: {seconds: 1}
          - {delay: 1}
          - variables: {v2: 1}
      - sequence:
        - action: test.s6
          data: {n: 6, v: '{{ states(''light.l1'') }}'}
        - action: test.s7
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          enabled: false
      - sequence:
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - action: test.s8
          data: {n: 8, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - event: m_9
          event_data: {n: 9, v: '{{ states(''light.l1'') }}', var: '{{ v3 | default(''undef'') }}'}
  - wait_template: '{{ states(''sensor.s1'') | int > 5 }}'
    timeout: {seconds: 2}
  - repeat:
      count: 1
      sequence:
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        enabled: false
      - {event: m_10}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '12'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 3}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 2
  set: [sensor.s1, '8']
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  set: [sensor.s1, abc]
- at: 4
  set: [light.l1, 'off']
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  set: [light.l1, unavailable]
- at: 10
  send: {type: service_result, call_id: 0, ok: true}
- at: 12
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 12
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 14
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 15
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 18
  set: [light.l1, unavailable]
- at: 20
  send: {type: service_result, call_id: 2, ok: true}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  set: [sensor.s1, '8']
  attributes: {lvl: 1}

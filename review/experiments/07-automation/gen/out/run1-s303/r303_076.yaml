# random scenario, seed 303, index 76 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: light.l1, to: 'on', id: alpha}
  - {trigger: state, entity_id: light.l1, id: beta}
  - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  actions:
  - choose:
    - conditions:
      - {condition: time, after: '23:00:00'}
      - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
      sequence:
      - sequence:
        - {delay: '00:00:02'}
    default:
    - {stop: s}
    - event: m_1
      event_data: {n: 1, v: '{{ this.attributes.current }}'}
  - wait_template: '{{ states(''sensor.s1'') | int > 5 }}'
    timeout: {seconds: 2}
    continue_on_timeout: false
  - parallel:
    - sequence:
      - parallel:
        - sequence:
          - {event: m_2}
        - sequence:
          - action: test.s3
            data: {n: 3, v: '{{ states(''sensor.s1'') }}'}
            continue_on_error: true
            response_variable: v1
    - sequence:
      - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
      - repeat:
          while:
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
          - '{{ repeat.index <= 2 }}'
          sequence:
          - action: test.s4
            data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  variables: {v1: 0, v2: 0}
states:
- {entity_id: sensor.s1, state: abc}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 2}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, unavailable]
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 5
  set: [sensor.s1, '7.5']
- at: 5
  set: [sensor.s1, unknown]
- at: 6
  send: {type: event, event_type: e2}
- at: 7
  send: {type: event, event_type: e1}
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, 'off']
- at: 8
  send: {type: event, event_type: e2}
- at: 9
  send: {type: event, event_type: e2}
- at: 11
  send: {type: event, event_type: tick}
- at: 12
  set: [light.l1, 'on']
- at: 12
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  send: {type: event, event_type: e1}
- at: 14
  set: [sensor.s1, unavailable]
- at: 15
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 16
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 18
  set: [light.l1, unavailable]
- at: 19
  send: {type: event, event_type: tick}
- at: 19
  set: [sensor.s1, abc]
  attributes: {lvl: 1}
- at: 20
  send:
    type: event
    event_type: e2
    data: {k: true}
- at: 21
  send: {type: event, event_type: e2}
- at: 21
  send:
    type: event
    event_type: e1
    data: {k: a}

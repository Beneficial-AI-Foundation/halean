# random scenario, seed 303, index 93 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 2
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: '8', to: '4'}
  - {trigger: state, entity_id: light.l1}
  conditions:
  - condition: time
    after: '23:00:00'
    before: 06:00
    weekday: [tue]
  actions:
  - sequence:
    - choose:
      - conditions: ['{{ is_state(''light.l2'', ''off'') }}']
        sequence:
        - event: m_1
          event_data: {n: 1, v: '{{ states(''light.l1'') }}'}
      default:
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', enabled: false}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}'}
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
      - event: m_2
        event_data: {n: 2, v: '{{ trigger.id }}'}
    - repeat:
        while:
        - {condition: time, after: '23:00:00', enabled: false}
        - '{{ repeat.index <= 1 }}'
        sequence:
        - repeat:
            while:
            - condition: and
              conditions:
              - condition: not
                conditions:
                - {condition: state, entity_id: sensor.s1, state: unavailable, for: '00:00:03'}
                - {condition: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
            - '{{ repeat.index <= 2 }}'
            sequence:
            - action: test.s4
              data: {n: 4, v: '{{ trigger.id }}'}
              enabled: false
            - action: test.s5
              data: {n: 5, v: '{{ now().second }}'}
            - action: test.s6
              data: {n: 6, v: '{{ trigger.id }}'}
          enabled: false
        - delay: {seconds: 1}
  - action: test.s7
    data: {n: 7, v: '{{ trigger.platform }}'}
    continue_on_error: true
    response_variable: v1
  - action: test.s8
    target:
      entity_id: [light.l1, light.l2]
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '7.5'}
- entity_id: light.l1
  state: 'off'
  attributes: {lvl: 1}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 2
  set: [light.l1, unavailable]
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [light.l1, 'off']
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  set: [sensor.s1, '4']
- at: 14
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  send: {type: event, event_type: e2}
- at: 21
  set: [light.l1, unavailable]
- at: 22
  set: [light.l1, 'off']
- at: 24
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 27
  set: [light.l1, 'off']
- at: 28
  set: [light.l1, unavailable]
- at: 29
  set: [light.l1, 'on']
- at: 30
  set: [sensor.s1, unavailable]
- at: 31
  set: [sensor.s1, '8']

# random scenario, seed 303, index 8 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    from: ['7.5', unknown]
    for: '{{ 2 }}'
  - trigger: state
    entity_id: light.l1
    not_from: ['on', unavailable]
  - trigger: state
    entity_id: light.l1
    not_from: ['on', unavailable]
    to: 'off'
    for: {seconds: 2}
  actions:
  - {condition: trigger, id: alpha, enabled: false}
  - repeat:
      until: ['{{ repeat.index >= 2 }}']
      sequence:
      - action: test.s1
        data: {n: 1, v: '{{ trigger.description }}'}
        continue_on_error: true
      - sequence:
        - {event: m_2}
        - {condition: state, entity_id: sensor.s1, state: '1'}
      - {event: m_3}
    continue_on_error: true
  - sequence:
    - parallel:
      - event: m_4
        event_data: {n: 4, v: '{{ this.attributes.current }}'}
      - event: m_5
        event_data: {n: 5, v: '{{ this.attributes.current }}'}
    - parallel:
      - sequence:
        - action: test.s6
          data: {n: 6, v: '{{ trigger.platform }}'}
        - if: ['{{ trigger.platform == ''event'' }}']
          then:
          - {event: m_7}
          - {event: m_8}
      - sequence:
        - delay: {seconds: 1}
      - sequence:
        - if:
          - condition: not
            conditions:
            - {condition: trigger, id: '1'}
            - or:
              - {condition: trigger, id: alpha}
              - {condition: numeric_state, entity_id: sensor.s1, below: 9}
          then:
          - condition: not
            conditions:
            - {condition: time, after: '22:00', before: '06:00'}
          - delay: {seconds: '{{ 2 }}'}
          - variables: {v1: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'on'
  attributes: {lvl: 2}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 3}
steps:
- at: 1
  set: [light.l1, unavailable]
- at: 4
  set: [light.l1, 'off']
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 5
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 7
  set: [light.l1, 'on']
- at: 8
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: x}
- at: 8
  send:
    type: service_result
    call_id: 1
    ok: true
    response: {value: 1}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 10
  send: {type: event, event_type: tick}
- at: 11
  set: [light.l1, unavailable]
- at: 13
  set: [sensor.s1, '8']
- at: 14
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}

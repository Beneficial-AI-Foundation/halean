# random scenario, seed 303, index 128 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0}
  triggers:
  - {trigger: event, event_type: e2}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {trigger: state, entity_id: sensor.s1, for: 1}
  actions:
  - {action: test.s1}
  - repeat:
      count: 1
      sequence:
      - parallel:
        - sequence:
          - repeat:
              while:
              - condition: or
                conditions:
                - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
                - {condition: state, entity_id: sensor.s1, state: '12'}
              - '{{ repeat.index <= 2 }}'
              sequence:
              - {event: m_2}
              - action: test.s3
                data: {n: 3, v: '{{ now().second }}'}
                target:
                  entity_id: [light.l1, light.l2]
                response_variable: v2
        - sequence:
          - repeat:
              while:
              - {condition: state, entity_id: light.l1, state: 'on'}
              - '{{ repeat.index <= 1 }}'
              sequence:
              - variables: {v2: '{{ repeat.index if repeat is defined else -1 }}'}
          - action: test.s4
            data: {n: 4, v: '{{ trigger.description }}'}
  - {stop: s, error: true}
  - condition: not
    conditions:
    - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
    - {condition: time, before: '06:00'}
    enabled: false
states:
- entity_id: sensor.s2
  state: '4'
  attributes: {lvl: 3}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s1, unavailable]
- at: 4
  set: [light.l1, unavailable]
- at: 5
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 5
  send: {type: service_result, call_id: 0, ok: true}
- at: 7
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 10
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 13
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 14
  set: [light.l1, 'on']
- at: 14
  set: [sensor.s1, unknown]
- at: 17
  send: {type: event, event_type: e1}
- at: 18
  set: [sensor.s1, '20']
- at: 21
  send: {type: event, event_type: e1}
- at: 21
  send: {type: event, event_type: e1}
- at: 24
  send: {type: service_result, call_id: 2, ok: true}

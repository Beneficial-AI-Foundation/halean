# random scenario, seed 303, index 33 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: light.l1
    for: {seconds: '{{ 1 + 1 }}'}
  - trigger: state
    entity_id: [light.l1]
    from: ['on', unavailable]
    to: [unavailable, 'on']
  - trigger: event
    event_type: e3
    event_data: {k: a}
  conditions:
  - '{{ states(''sensor.s1'') | int > 5 }}'
  - not: ['{{ states(''sensor.s1'') | int > 5 }}', '{{ trigger.platform in [''state'', ''numeric_state''] }}']
  actions:
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - action: test.s1
    target: {entity_id: light.l1}
  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e1}
  - {trigger: state, entity_id: light.l1, not_to: 'off'}
  conditions:
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  - or:
    - or:
      - condition: state
        entity_id: light.l1
        state: [unavailable, 'on']
    - condition: not
      conditions:
      - {condition: time, after: '22:13:25'}
      - condition: trigger
        id: [beta, '0']
      - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9}
  actions:
  - action: test.s2
    data: {n: 2, v: '{{ states(''light.l1'') }}'}
  - action: test.s3
    data: {n: 3, v: '{{ trigger.idx }}'}
    target: {entity_id: light.l1}
  - wait_for_trigger:
    - {trigger: state, entity_id: light.l1, to: unavailable}
    - {trigger: template, value_template: '{{ states(''sensor.s1'') | int(0) > 7 }}'}
    timeout: {seconds: 2}
    continue_on_timeout: false
  - event: m_6
    event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - repeat:
      until: ['{{ repeat.index >= 1 }}']
      sequence:
      - wait_for_trigger:
        - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', for: '{{ 2 }}'}
        - {trigger: state, entity_id: sensor.s1, from: 3, attribute: lvl, for: '{{ 2 }}'}
        timeout: 0
        continue_on_timeout: false
      - event: m_5
        event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - {event: m_4}
    continue_on_error: true
states:
- {entity_id: sensor.s2, state: unavailable}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: unavailable}
- entity_id: input_boolean.b1
  state: unavailable
  attributes: {lvl: 1}
steps:
- at: 3
  send: {type: event, event_type: e1}
- at: 4
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 5
  send: {type: service_result, call_id: 0, ok: true}
- at: 7
  set: [light.l1, 'off']
- at: 10
  send: {type: service_result, call_id: 1, ok: true}
- at: 11
  send: {type: service_result, call_id: 2, ok: true}
- at: 11
  set: [light.l1, 'on']
- at: 14
  set: [sensor.s1, '12']
- at: 16
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 20
  set: [light.l1, 'on']
- at: 20
  set: [sensor.s1, '8']
  attributes: {lvl: 3}

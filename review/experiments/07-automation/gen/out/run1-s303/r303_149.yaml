# random scenario, seed 303, index 149 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: event, event_type: e3}
  - {trigger: state, entity_id: light.l1, to: unavailable, from: 'off'}
  actions:
  - action: test.s1
    data: {n: 1, v: '{{ states(''light.l1'') }}'}
    continue_on_error: true
  - choose:
    - conditions:
      - {condition: trigger, id: '1'}
      - {condition: trigger, id: alpha, enabled: false}
      sequence:
      - repeat:
          count: 3
          sequence:
          - repeat:
              until: ['{{ repeat.index >= 2 }}']
              sequence:
              - variables:
                  v1: [a, '{{ 1 + 1 }}']
            continue_on_error: true
          - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
    default:
    - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}', timeout: '{{ 2 }}', continue_on_timeout: false}
    - event: m_2
      event_data: {n: 2, completed: '{{ wait.completed }}'}
  - action: test.s3
    data: {n: 3, v: '{{ trigger.idx }}'}
    continue_on_error: true
  - sequence:
    - choose:
      - conditions:
        - condition: trigger
          id: [beta, '0']
        sequence:
        - event: m_4
          event_data: {n: 4, v: '{{ states(''light.l1'') }}', var: '{{ v1 | default(''undef'') }}'}
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1}
          - trigger: state
            entity_id: sensor.s1
            to: ['4', '1']
            not_from: [abc, '12']
            for: 3
      - conditions:
        - {condition: time, after: '22:13:25', before: '22:14'}
        sequence:
        - {action: test.s5, continue_on_error: true, response_variable: v2}
        - {event: m_6}
      default:
      - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: 0}
      - sequence:
        - {action: test.s7}
    continue_on_error: true
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: state, entity_id: light.l1, not_from: 2, attribute: lvl, for: '{{ 2 }}'}
  - {trigger: event, event_type: e3}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    not_from: '4'
    to: '7.5'
  actions:
  - repeat:
      count: 3
      sequence:
      - variables: {v1: x}
      - variables: {v2: x}
  - event: m_8
    event_data: {n: 8, v: '{{ states(''sensor.s1'') }}', var: '{{ v2 | default(''undef'') }}'}
  - action: test.s9
    data: {n: 9, v: '{{ states(''light.l1'') }}'}
  - choose:
    - conditions:
      - not:
        - condition: not
          conditions:
          - '{{ is_state(''light.l1'', ''on'') }}'
          - {condition: time, after: '22:13:25', before: '22:13:30'}
          - {condition: trigger, id: '0'}
        - condition: time
          before: '22:14'
          weekday: [tue]
        - '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'
      - not:
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
        - condition: not
          conditions:
          - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
          - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 15}
        - {condition: state, entity_id: light.l1, state: unavailable}
      sequence:
      - {action: test.s10}
      - repeat:
          count: 1
          sequence:
          - variables: {v4: x}
      - event: m_11
        event_data: {n: 11, v: '{{ trigger.idx }}'}
    default:
    - condition: not
      conditions:
      - {condition: numeric_state, entity_id: sensor.s1, below: 15}
      - {condition: trigger, id: '0'}
- alias: a2
  id: id2
  mode: queued
  max: 2
  triggers:
  - trigger: state
    entity_id: light.l1
    to: ['on', unavailable]
    from: 'off'
  - trigger: event
    event_type: e2
    event_data: {k: true}
  actions:
  - parallel:
    - sequence:
      - sequence:
        - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 0}
      - sequence:
        - repeat:
            while:
            - not:
              - and:
                - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
                - {condition: numeric_state, entity_id: sensor.s1, below: 9}
              - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}', enabled: false}
            - '{{ repeat.index <= 1 }}'
            sequence:
            - event: m_12
              event_data: {n: 12, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        - {stop: s}
      - parallel:
        - sequence:
          - {action: test.s13}
          - {condition: numeric_state, entity_id: sensor.s1, above: 3}
          - choose:
            - conditions:
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
              - or:
                - condition: not
                  conditions:
                  - {condition: state, entity_id: light.l1, state: 'on'}
                  - '{{ is_state(''light.l1'', ''on'') }}'
                - not:
                  - {condition: numeric_state, entity_id: sensor.s2, above: 6, below: 9, enabled: false}
                  - condition: state
                    entity_id: sensor.s1
                    state: ['12', '7.5']
                  - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
              sequence:
              - event: m_14
                event_data: {n: 14, v: '{{ this.attributes.current }}'}
            - conditions: ['{{ trigger.platform in [''state'', ''numeric_state''] }}']
              sequence:
              - event: m_15
                event_data: {n: 15, v: '{{ now().second }}'}
              - {delay: 2}
            default:
            - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
            - variables:
                v2: [a, '{{ 1 + 1 }}']
            - event: m_16
              event_data: {n: 16, v: '{{ states(''sensor.s1'') }}', var: '{{ v1 | default(''undef'') }}'}
        - sequence:
          - repeat:
              while:
              - condition: not
                conditions:
                - condition: or
                  conditions:
                  - {condition: time, after: '22:13:25', before: '06:00'}
                  - '{{ states(''sensor.s2'') | float(0) < 15 }}'
                - condition: not
                  conditions:
                  - condition: trigger
                    id: [beta, '0']
                  - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
              - '{{ repeat.index <= 1 }}'
              sequence:
              - variables: {v2: '{{ states(''sensor.s1'') }}'}
              - condition: not
                conditions:
                - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
        enabled: false
    - event: m_17
      event_data: {n: 17, v: '{{ now().second }}', var: '{{ v2 | default(''undef'') }}'}
    - event: m_18
      event_data: {n: 18, v: '{{ trigger.description }}'}
  - parallel:
    - sequence:
      - delay: {seconds: '{{ 2 }}'}
      - {delay: '00:00:02'}
      - {stop: s}
    - {event: m_19}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: abc}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 1}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 2}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, 'off']
- at: 2
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: tick}
- at: 4
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 5
  set: [light.l1, 'on']
- at: 8
  set: [light.l1, 'off']
- at: 11
  set: [sensor.s1, '20']
- at: 12
  send: {type: event, event_type: e2}
- at: 13
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 13
  set: [sensor.s1, abc]
- at: 14
  send: {type: event, event_type: e3}
- at: 14
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}

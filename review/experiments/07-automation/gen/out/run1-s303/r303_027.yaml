# random scenario, seed 303, index 27 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: '8', to: '7.5'}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    not_from: ['12', abc]
  conditions:
  - {condition: template, value_template: '{{ trigger.id == ''0'' }}', enabled: false}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.s1
        state: ['1', unavailable]
      sequence:
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - if:
        - condition: state
          entity_id: sensor.s1
          state: '4'
          for: {seconds: 1}
        then:
        - action: test.s1
          data: {n: 1, v: '{{ trigger.description }}'}
          continue_on_error: true
        - {stop: s, error: true}
    continue_on_error: true
  - action: test.s2
    data: {n: 2, v: '{{ trigger.idx }}'}
    response_variable: v2
  - choose:
    - conditions:
      - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      sequence:
      - sequence:
        - wait_for_trigger:
          - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          timeout: 2
        - event: m_3
          event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - variables: {v2: '{{ (v2 | default(0) | int(0)) + 1 }}'}
    - conditions:
      - condition: or
        conditions:
        - condition: or
          conditions:
          - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
          - {condition: numeric_state, entity_id: sensor.s1, above: 3, enabled: false}
        - {condition: state, entity_id: sensor.s1, state: '12'}
      - condition: or
        conditions:
        - or:
          - {condition: trigger, id: '0'}
        - '{{ states(''sensor.s1'') | int(0) > 3 }}'
        - condition: not
          conditions:
          - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
      sequence:
      - {stop: s, error: true}
  - {condition: numeric_state, entity_id: sensor.s1, above: 6, below: 9}
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, for: 3}
  - {trigger: state, entity_id: sensor.s1, from: '7.5'}
  actions:
  - {stop: s}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, to: '7.5'}
    timeout: 1
states:
- {entity_id: sensor.s1, state: '8'}
- entity_id: sensor.s2
  state: '20'
  attributes: {lvl: 2}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: 'on'}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 1
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 2
  send: {type: event, event_type: tick}
- at: 3
  set: [sensor.s1, '7.5']
  attributes: {lvl: 2}
- at: 4
  send:
    type: event
    event_type: e3
    data: {k: a}
- at: 5
  send: {type: event, event_type: e1}
- at: 6
  send: {type: event, event_type: e3}
- at: 7
  set: [sensor.s1, '8']
- at: 9
  set: [sensor.s1, '20']
- at: 10
  send: {type: event, event_type: tick}
- at: 10
  send: {type: service_result, call_id: 2, ok: false, error_kind: ha_error}
- at: 10
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 12
  send: {type: service_result, call_id: 1, ok: false, error_kind: invalid}

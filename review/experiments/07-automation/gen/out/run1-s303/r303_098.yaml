# random scenario, seed 303, index 98 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: sensor.s1, from: '20', for: 2}
  - trigger: state
    entity_id: [light.l1]
    from: ['on', 'off']
  - trigger: state
    entity_id: sensor.s1
    not_from: ['12', abc]
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: light.l1, state: unavailable}
      sequence:
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
        - trigger: state
          entity_id: [sensor.s1]
          to: '20'
        timeout: {seconds: 2}
        continue_on_timeout: false
      - event: m_1
        event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
      - {wait_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
      - event: m_2
        event_data: {n: 2, completed: '{{ wait.completed }}'}
    - conditions:
      - condition: not
        conditions:
        - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 15}
      sequence:
      - {delay: '00:00:02'}
      - wait_for_trigger:
        - {trigger: event, event_type: e1}
      - event: m_3
        event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    default:
    - wait_for_trigger:
      - {trigger: state, entity_id: sensor.s1, to: '7.5', from: '12'}
      timeout: 1
    - event: m_5
      event_data: {n: 5, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - action: test.s4
      data: {n: 4, v: '{{ now().second }}'}
  - {condition: time, after: '22:13:25'}
  - repeat:
      while:
      - condition: trigger
        id: [beta, '0']
      - '{{ repeat.index <= 3 }}'
      sequence:
      - parallel:
        - sequence:
          - {stop: s}
          - event: m_6
            event_data: {n: 6, v: '{{ trigger.id }}'}
        - sequence:
          - {condition: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
          - {stop: s, error: true}
          - {delay: 1}
      - repeat:
          for_each:
          - {k: 1}
          - null
          sequence:
          - {wait_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
        continue_on_error: true
  - parallel:
    - sequence:
      - parallel:
        - sequence:
          - delay: {seconds: 1}
          - variables:
              v1: [a, '{{ 1 + 1 }}']
        - sequence:
          - sequence:
            - action: test.s7
              data: {n: 7, v: '{{ trigger.id }}'}
              continue_on_error: true
          - if:
            - condition: or
              conditions:
              - condition: or
                conditions:
                - {condition: trigger, id: '0'}
                - {condition: state, entity_id: sensor.s1, state: '4'}
              - {condition: state, entity_id: light.l1, state: 'off'}
            - or:
              - condition: state
                entity_id: sensor.s1
                state: ['7.5', '20']
            then:
            - delay: {seconds: '{{ 2 }}'}
            else:
            - {event: m_8}
          - {condition: time, before: '22:13:30'}
        - {event: m_9}
      - {delay: 1}
    - sequence:
      - event: m_10
        event_data: {n: 10, v: '{{ trigger.platform }}'}
    - {event: m_11}
    enabled: false
  - {event: m_12}
  variables: {v1: 0, v2: 0}
states:
- entity_id: sensor.s1
  state: '4'
  attributes: {lvl: 3}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 1
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 2
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 4
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 5
  set: [sensor.s1, '4']
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
- at: 7
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 8
  set: [light.l1, 'off']
- at: 9
  set: [sensor.s1, '1']
- at: 10
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 11
  set: [light.l1, unavailable]
- at: 13
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send: {type: event, event_type: e2}
- at: 17
  set: [sensor.s1, '8']
- at: 18
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 21
  send: {type: event, event_type: tick}
- at: 24
  send: {type: event, event_type: e3}
- at: 25
  send: {type: event, event_type: tick}
- at: 25
  send:
    type: event
    event_type: e2
    data: {k: 1}

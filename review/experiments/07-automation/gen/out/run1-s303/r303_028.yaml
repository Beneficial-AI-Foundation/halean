# random scenario, seed 303, index 28 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: parallel
  triggers:
  - {trigger: state, entity_id: sensor.s1, attribute: lvl, for: 3, id: beta}
  - {trigger: state, entity_id: light.l1, to: 'on', id: alpha}
  - trigger: event
    event_type: e1
    event_data: {k: a}
  actions:
  - event: m_1
    event_data: {n: 1, v: '{{ now().second }}'}
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
    enabled: false
  variables: {v1: 0}
- alias: a1
  id: id1
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  conditions: ['{{ states(''sensor.s1'') | int(0) > 3 }}']
  actions:
  - {wait_template: '{{ trigger.platform == ''event'' }}'}
  - event: m_2
    event_data: {n: 2, v: '{{ states(''light.l1'') }}'}
  - wait_for_trigger:
    - {trigger: event, event_type: e2}
  - event: m_3
    event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
states:
- {entity_id: sensor.s1, state: '20'}
- entity_id: sensor.s2
  state: unknown
  attributes: {lvl: 3}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: unavailable}
steps:
- at: 3
  send: {type: event, event_type: e1}
- at: 5
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e2}
- at: 5
  set: [sensor.s1, abc]
- at: 6
  set: [sensor.s1, '4']
- at: 6
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 9
  send: {type: event, event_type: e1}
- at: 9
  set: [light.l1, unavailable]
- at: 9
  send: {type: event, event_type: tick}
- at: 10
  set: [sensor.s1, '8']
- at: 12
  send: {type: event, event_type: tick}
- at: 14
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 15
  send: {type: event, event_type: e2}
- at: 18
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 19
  send: {type: event, event_type: tick}
- at: 20
  set: [light.l1, unavailable]

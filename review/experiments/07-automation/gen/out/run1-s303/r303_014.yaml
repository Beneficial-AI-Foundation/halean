# random scenario, seed 303, index 14 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 1, not_to: 3, attribute: lvl}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - condition: state
    entity_id: light.l1
    state: [unavailable, 'off']
    for: 00:00:03
  - parallel:
    - sequence:
      - sequence:
        - {stop: s}
        - {stop: s}
      - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
      - {delay: '00:00:02'}
    - sequence:
      - action: test.s1
        data: {n: 1, v: '{{ states(''sensor.s1'') }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: queued
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', id: alpha}
  - {trigger: state, entity_id: light.l1, to: 'on', from: 'on'}
  conditions:
  - {condition: trigger, id: alpha}
  actions:
  - parallel:
    - sequence:
      - sequence:
        - event: m_2
          event_data: {n: 2, v: '{{ trigger.idx }}', var: '{{ v1 | default(''undef'') }}'}
        - {wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}', timeout: '{{ 2 }}'}
      - {event: m_3}
    - sequence:
      - {stop: s}
    - sequence:
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
    continue_on_error: true
  - {delay: '00:00:02'}
  - {stop: s}
  - repeat:
      count: 3
      sequence:
      - {stop: s}
    continue_on_error: true
states:
- {entity_id: sensor.s2, state: unknown}
- {entity_id: light.l1, state: 'on'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [sensor.s1, '1']
- at: 3
  set: [light.l1, unavailable]
- at: 4
  set: [light.l1, 'off']
- at: 5
  set: [light.l1, 'on']
- at: 5
  send: {type: event, event_type: e3}
- at: 8
  set: [light.l1, 'off']
- at: 10
  set: [light.l1, unavailable]
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'on']
- at: 16
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 18
  set: [sensor.s1, unknown]
- at: 20
  set: [light.l1, unavailable]
- at: 20
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 22
  send: {type: event, event_type: tick}
- at: 23
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 24
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 24
  set: [light.l1, unavailable]
- at: 24
  send: {type: event, event_type: tick}
- at: 26
  set: [light.l1, 'on']
- at: 29
  send: {type: event, event_type: e2}

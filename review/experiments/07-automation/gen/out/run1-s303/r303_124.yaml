# random scenario, seed 303, index 124 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'on', id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', id: alpha}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', id: alpha}
  conditions:
  - {condition: time, after: '22:00', before: '22:14'}
  - {condition: time, after: '22:13:25'}
  actions:
  - choose:
    - conditions:
      - condition: not
        conditions:
        - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
        - '{{ trigger.platform in [''state'', ''numeric_state''] }}'
      - condition: or
        conditions:
        - {condition: time, after: '22:00', before: '06:00'}
        - '{{ trigger.platform == ''event'' }}'
      sequence:
      - {stop: s, enabled: false}
    - conditions:
      - {condition: time, after: '22:00', before: '22:13:30'}
      sequence:
      - {action: test.s1, response_variable: v1}
    default:
    - event: m_2
      event_data: {n: 2, v: '{{ trigger.id }}'}
    continue_on_error: true
  - choose:
    - conditions:
      - condition: and
        conditions:
        - {condition: time, after: '23:00:00', before: '22:14'}
        - {condition: trigger, id: alpha}
      sequence:
      - choose:
        - conditions:
          - {condition: trigger, id: '0'}
          sequence:
          - if:
            - {condition: numeric_state, entity_id: sensor.s1, below: 9}
            - condition: and
              conditions:
              - {condition: numeric_state, entity_id: sensor.s1, below: 9}
              - condition: or
                conditions:
                - {condition: time, after: '22:13:25', before: '06:00'}
              - condition: or
                conditions:
                - {condition: numeric_state, entity_id: sensor.s1, above: 3, below: 9}
                - condition: trigger
                  id: [beta, '0']
                - {condition: numeric_state, entity_id: sensor.s1, below: 15}
            then:
            - variables:
                v2: [a, '{{ 1 + 1 }}']
            else:
            - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
            - {event: m_3}
          - choose:
            - conditions:
              - {condition: time, after: '22:13:25', weekday: tue}
              sequence:
              - event: m_4
                event_data: {n: 4, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
        default:
        - repeat:
            while:
            - {condition: time, before: '22:14'}
            - '{{ repeat.index <= 2 }}'
            sequence:
            - {event: m_5}
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
        continue_on_error: true
  - event: m_6
    event_data: {n: 6, v: '{{ now().second }}'}
    enabled: false
  - variables: {v3: '{{ repeat.index if repeat is defined else -1 }}'}
  variables: {v1: 0, v2: 0, v3: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1}
  - trigger: event
    event_type: e3
    event_data: {k: 1}
  conditions: ['{{ trigger.platform == ''event'' }}']
  actions:
  - event: m_7
    event_data: {n: 7, v: '{{ trigger.id }}'}
  - condition: or
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, below: 15}
    - and:
      - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      - condition: state
        entity_id: [light.l1]
        state: 'on'
        match: any
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'}
    - trigger: state
      entity_id: sensor.s1
      from: [unavailable, unknown]
      to: unavailable
      for: {seconds: '{{ 1 + 1 }}'}
    timeout: 3
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {delay: 1}
  - parallel:
    - event: m_8
      event_data: {n: 8, v: '{{ this.attributes.current }}'}
    - sequence:
      - {stop: s, error: true}
      - sequence:
        - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
        - wait_for_trigger:
          - {trigger: event, event_type: e2}
          timeout: 2
        - event: m_9
          event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  variables: {v1: 0}
- alias: a2
  id: id2
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - {trigger: state, entity_id: light.l1, not_from: 'on', not_to: 'on', for: 3}
  - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
  - {trigger: event, event_type: e3}
  actions:
  - {wait_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}', timeout: '00:00:03', continue_on_timeout: false}
  - {condition: time, before: '22:13:30', enabled: false}
  - wait_for_trigger:
    - {trigger: template, value_template: '{{ is_state(''light.l1'', ''on'') }}'}
  - event: m_11
    event_data: {n: 11, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - {condition: state, entity_id: light.l1, state: 'on'}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: 'on'}
- entity_id: light.l2
  state: 'off'
  attributes: {lvl: 3}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 0
  send:
    type: event
    event_type: e3
    data: {k: true}
- at: 1
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, 'off']
- at: 5
  set: [light.l1, 'on']
- at: 5
  send: {type: event, event_type: e2}
- at: 6
  send:
    type: event
    event_type: e3
    data: {k: 1}
- at: 6
  set: [sensor.s1, '8']
- at: 8
  send: {type: event, event_type: tick}
- at: 9
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 9
  set: [sensor.s1, '12']
- at: 10
  send: {type: event, event_type: tick}

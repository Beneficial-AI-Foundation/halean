# random scenario, seed 303, index 140 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', for: 3, id: beta}
  - {trigger: state, entity_id: sensor.s1, id: alpha}
  conditions:
  - condition: state
    entity_id: sensor.s1
    state: [unavailable, '4']
  - not:
    - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'}
  actions:
  - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
  - action: test.s1
    data: {n: 1, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
    target: {entity_id: light.l1}
  - action: test.s2
    data: {n: 2, v: '{{ states(''sensor.s1'') }}'}
  - wait_template: '{{ states(''sensor.s2'') | float(0) < 9 }}'
    timeout: {seconds: 2}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, from: 'on', for: 3}
  - {trigger: state, entity_id: light.l1, from: 3, attribute: lvl, id: beta}
  conditions:
  - condition: not
    conditions:
    - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2, below: 15}
    - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
    - {condition: trigger, id: alpha, enabled: false}
    enabled: false
  - {condition: time, after: '22:00'}
  actions:
  - {delay: '{{ 1 }}', enabled: false}
  - parallel:
    - sequence:
      - event: m_3
        event_data: {n: 3, v: '{{ trigger.platform }}'}
      - event: m_4
        event_data: {n: 4, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
      - sequence:
        - if:
          - {condition: time, after: '22:00', weekday: tue}
          - {condition: trigger, id: '1'}
          then:
          - action: test.s5
            data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
            continue_on_error: true
          - action: test.s6
            data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
            response_variable: v1
          else:
          - {condition: time, before: '22:14'}
        - condition: and
          conditions:
          - condition: time
            before: '22:14'
            weekday: [tue]
          - '{{ states(''sensor.s1'') | int(0) > 3 }}'
        continue_on_error: true
    - {event: m_7}
    - sequence:
      - {event: m_8}
      - {delay: 2}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '7.5'}
- {entity_id: light.l1, state: unavailable}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [light.l1, 'on']
- at: 4
  set: [light.l1, 'off']
- at: 5
  send: {type: event, event_type: tick}
- at: 6
  set: [sensor.s1, unknown]
- at: 7
  send: {type: event, event_type: e2}
- at: 9
  set: [light.l1, unavailable]
- at: 10
  set: [light.l1, 'off']
- at: 11
  send: {type: event, event_type: e1}
- at: 14
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 15
  send: {type: event, event_type: e1}
- at: 15
  send: {type: event, event_type: e3}
- at: 16
  send: {type: event, event_type: e1}
- at: 17
  send: {type: event, event_type: tick}
- at: 17
  set: [sensor.s1, '1']
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: tick}

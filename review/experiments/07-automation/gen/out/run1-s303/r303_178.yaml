# random scenario, seed 303, index 178 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - trigger: state
    entity_id: [light.l1, sensor.s1]
    not_to: ['on', 'off']
    not_from: 'on'
  actions:
  - variables: {v1: '{{ states(''sensor.s1'') }}'}
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.s1
        state: ['20', '4']
        for: 2
      sequence:
      - parallel:
        - sequence:
          - action: test.s1
            data: {n: 1, v: '{{ this.attributes.current }}'}
          - choose:
            - conditions:
              - condition: not
                conditions:
                - condition: time
                  after: '22:13:25'
                  before: 06:00
                  weekday: [wed, mon]
                - condition: and
                  conditions:
                  - {condition: trigger, id: '0'}
                  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              sequence:
              - variables: {v1: 1}
            - conditions:
              - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
              sequence:
              - {delay: '{{ 1 }}'}
              - action: test.s2
                data: {n: 2, v: '{{ now().second }}'}
            default:
            - {event: m_3}
        - event: m_4
          event_data: {n: 4, v: '{{ states(''light.l1'') }}'}
        - sequence:
          - action: test.s5
            data: {n: 5, v: '{{ trigger.idx }}'}
      - sequence:
        - choose:
          - conditions:
            - {condition: time, after: '22:13:25', enabled: false}
            sequence:
            - action: test.s6
              data: {n: 6, v: '{{ now().second }}'}
        - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - parallel:
          - {event: m_7}
          - sequence:
            - variables: {v4: '{{ (v4 | default(0) | int(0)) + 1 }}'}
            - {delay: 1}
    - conditions:
      - or:
        - {condition: numeric_state, entity_id: sensor.s2, below: 9}
        - condition: trigger
          id: [beta, '0']
      sequence:
      - event: m_8
        event_data: {n: 8, v: '{{ now().second }}'}
      - action: test.s9
        data: {n: 9, v: '{{ states(''light.l1'') }}'}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0}
states:
- {entity_id: sensor.s1, state: abc}
- {entity_id: sensor.s2, state: '4'}
- {entity_id: light.l1, state: unavailable}
- entity_id: light.l2
  state: unavailable
  attributes: {lvl: 1}
- {entity_id: input_boolean.b1, state: 'off'}
steps:
- at: 2
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 4
  set: [light.l1, 'off']
- at: 5
  send:
    type: event
    event_type: e1
    data: {k: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 8
  send: {type: event, event_type: tick}
- at: 8
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 9
  send: {type: event, event_type: tick}
- at: 11
  set: [sensor.s1, unavailable]
- at: 12
  send: {type: event, event_type: e2}
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  set: [sensor.s1, abc]
- at: 16
  send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}
- at: 17
  send: {type: event, event_type: tick}
- at: 18
  set: [light.l1, 'off']
- at: 19
  send: {type: event, event_type: tick}

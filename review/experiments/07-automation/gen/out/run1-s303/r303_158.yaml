# random scenario, seed 303, index 158 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.s1
    not_to: ['8', '12']
  - {trigger: event, event_type: e2}
  - {trigger: state, entity_id: light.l1, not_to: 'off'}
  conditions:
  - condition: state
    entity_id: light.l1
    state: [unavailable, 'off']
    for: 2
  actions:
  - sequence:
    - repeat:
        count: 3
        sequence:
        - {wait_template: '{{ is_state(''light.l1'', ''on'') }}', timeout: '00:00:03'}
        - {wait_template: '{{ states(''sensor.s1'') | int > 5 }}', timeout: 1, continue_on_timeout: false}
        - wait_for_trigger:
          - {trigger: state, entity_id: sensor.s1}
        - event: m_1
          event_data: {n: 1, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - parallel:
      - sequence:
        - choose:
          - conditions:
            - condition: or
              conditions:
              - '{{ trigger.platform == ''event'' }}'
              - condition: not
                conditions:
                - '{{ is_state(''light.l2'', ''off'') }}'
                - {condition: state, entity_id: sensor.s1, state: '20', for: '00:00:03'}
                - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
              - or:
                - {condition: trigger, id: '1', enabled: false}
                - '{{ trigger.id == ''0'' }}'
            - condition: or
              conditions:
              - condition: trigger
                id: [beta, '0']
            sequence:
            - {action: test.s2, continue_on_error: true}
            - {delay: 0}
          default:
          - delay: {seconds: 1}
        - choose:
          - conditions:
            - condition: or
              conditions:
              - {condition: time, before: '22:13:30'}
              - {condition: state, entity_id: light.gone, state: 'on'}
            - {condition: trigger, id: alpha}
            sequence:
            - variables: {v1: x}
          - conditions:
            - not:
              - {condition: state, entity_id: light.l1, state: unavailable}
              - {condition: trigger, id: alpha}
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
            sequence:
            - event: m_3
              event_data: {n: 3, v: '{{ this.attributes.current }}'}
            - {event: m_4}
      - sequence:
        - {event: m_5}
        - wait_for_trigger:
          - {trigger: state, entity_id: light.l1, from: 'off', for: '00:00:02'}
          - trigger: event
            event_type: e3
            event_data: {k: 1}
          timeout: {seconds: 2}
          continue_on_timeout: false
          enabled: false
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
        - {condition: trigger, id: '0'}
      - sequence:
        - {condition: state, entity_id: sensor.s1, state: '1'}
        - parallel:
          - event: m_7
            event_data: {n: 7, v: '{{ now().second }}'}
          - event: m_8
            event_data: {n: 8, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
  - if:
    - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}', enabled: false}
    - condition: state
      entity_id: [light.l1]
      state: 'on'
      match: any
    then:
    - sequence:
      - {action: test.s9}
    enabled: false
  - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', timeout: '{{ 2 }}'}
  - event: m_10
    event_data: {n: 10, completed: '{{ wait.completed }}'}
  variables: {v1: 0}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: state, entity_id: light.l1, to: unavailable}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}', id: alpha}
  conditions:
  - condition: or
    conditions:
    - or:
      - {condition: time, before: '22:14'}
      - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
      - condition: state
        entity_id: light.l1
        state: ['on', unavailable]
  - {condition: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - action: test.s11
    data: {n: 11, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - choose:
    - conditions:
      - or:
        - and:
          - {condition: time, before: '06:00'}
          - {condition: numeric_state, entity_id: sensor.s2, below: 9}
          - condition: state
            entity_id: [light.l1]
            state: 'on'
            match: any
        - condition: state
          entity_id: sensor.s1
          state: ['4', '12']
      sequence:
      - action: test.s12
        data: {n: 12, v: '{{ trigger.description }}'}
        target: {entity_id: light.l1}
        continue_on_error: true
      - event: m_13
        event_data: {n: 13, v: '{{ trigger.id }}', var: '{{ v1 | default(''undef'') }}'}
    default:
    - {stop: s, error: true}
  - sequence:
    - {event: m_14}
  variables: {v1: 0}
states:
- {entity_id: sensor.s1, state: '8'}
- {entity_id: sensor.s2, state: '20'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- entity_id: input_boolean.b1
  state: 'off'
  attributes: {lvl: 1}
steps:
- at: 3
  send: {type: event, event_type: tick}
- at: 4
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 5
  send: {type: event, event_type: e2}
- at: 5
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 6
  set: [light.l1, 'off']
  attributes: {lvl: 2}
- at: 6
  set: [light.l1, 'on']
- at: 9
  set: [light.l1, unavailable]
  attributes: {lvl: 3}
- at: 10
  send: {type: service_result, call_id: 0, ok: true}
- at: 11
  set: [sensor.s1, abc]
  attributes: {lvl: 2}
- at: 13
  send: {type: event, event_type: tick}
- at: 14
  set: [light.l1, 'off']
- at: 15
  set: [light.l1, 'on']
  attributes: {lvl: 1}

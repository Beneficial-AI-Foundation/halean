# random scenario, seed 303, index 133 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  variables: {v1: '{{ trigger.platform }}', v2: 0, v3: 0, v4: 0}
  triggers:
  - {trigger: state, entity_id: light.l1}
  - trigger: event
    event_type: e1
    event_data: {k: a}
  conditions:
  - {condition: time, after: '22:00', before: '22:14'}
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: [beta, '0']
      - {condition: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      sequence:
      - choose:
        - conditions:
          - {condition: time, before: '22:14'}
          - {condition: numeric_state, entity_id: sensor.s2, below: 15}
          sequence:
          - sequence:
            - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
            continue_on_error: true
          - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
        - conditions:
          - {condition: time, before: '06:00', enabled: false}
          - condition: and
            conditions:
            - {condition: time, after: '22:00'}
            - condition: not
              conditions:
              - {condition: time, after: '22:13:25'}
              - {condition: trigger, id: '1'}
              enabled: false
          sequence:
          - variables:
              v2: [a, '{{ 1 + 1 }}']
        default:
        - action: test.s1
          target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
          response_variable: v4
      - {action: test.s2, continue_on_error: true}
      - {wait_template: '{{ is_state(''light.l2'', ''off'') }}', timeout: 0}
  - {action: test.s3, enabled: false}
- alias: a1
  id: id1
  mode: restart
  triggers:
  - {trigger: event, event_type: e2}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    to: ['1', '7.5']
  actions:
  - variables: {v1: '{{ repeat.index if repeat is defined else -1 }}'}
  - {event: m_4}
  - {condition: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  - if:
    - {condition: state, entity_id: light.l1, state: 'off'}
    then:
    - parallel:
      - event: m_5
        event_data: {n: 5, v: '{{ trigger.platform }}', var: '{{ v1 | default(''undef'') }}'}
      - sequence:
        - {wait_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - event: m_6
          event_data: {n: 6, completed: '{{ wait.completed }}'}
        - {delay: 0}
      - {event: m_7}
      continue_on_error: true
    - parallel:
      - sequence:
        - choose:
          - conditions:
            - '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}'
            - {condition: numeric_state, entity_id: sensor.s2, below: 15}
            sequence:
            - action: test.s8
              target:
                entity_id: [light.l1, light.l2]
            - variables: {v1: 1}
            - condition: not
              conditions:
              - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
              - {condition: time, after: '23:00:00', before: '22:13:30'}
          default:
          - action: test.s9
            target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
        - choose:
          - conditions:
            - {condition: trigger, id: '1'}
            sequence:
            - condition: or
              conditions:
              - {condition: state, entity_id: sensor.s1, state: '7.5'}
              - {condition: trigger, id: '1'}
            - event: m_10
              event_data: {n: 10, v: '{{ states(''light.l1'') }}'}
          - conditions:
            - condition: not
              conditions:
              - and:
                - {condition: numeric_state, entity_id: sensor.s2, below: 15}
              - {condition: numeric_state, entity_id: sensor.s1, above: 6}
              - {condition: time, after: '23:00:00'}
            sequence:
            - {delay: '00:00:02'}
          default:
          - condition: trigger
            id: [beta, '0']
        - {wait_template: '{{ states(''sensor.s1'') | int(0) > 3 }}'}
        - event: m_11
          event_data: {n: 11, completed: '{{ wait.completed }}'}
      - sequence:
        - if:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}', enabled: false}
          then:
          - variables: {v1: x}
          - {event: m_12}
        - {event: m_13}
    else:
    - action: test.s14
      data: {n: 14, v: '{{ trigger.description }}'}
      target: {entity_id: '{{ trigger.entity_id | default(''light.l2'', true) }}'}
  - action: test.s15
    data: {n: 15, v: '{{ states(''light.l1'') }}'}
    continue_on_error: true
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: unavailable}
- {entity_id: light.l1, state: 'on'}
- entity_id: input_boolean.b1
  state: 'on'
  attributes: {lvl: 1}
steps:
- at: 2
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 2
  set: [light.l1, unavailable]
- at: 3
  set: [light.l1, unavailable]
  attributes: {lvl: 1}
- at: 4
  set: [light.l1, 'off']
- at: 6
  set: [light.l1, unavailable]
  attributes: {lvl: 2}
- at: 9
  send: {type: event, event_type: tick}
- at: 12
  send: {type: event, event_type: tick}
- at: 13
  set: [light.l1, 'on']
- at: 13
  send: {type: event, event_type: tick}
- at: 15
  send: {type: event, event_type: tick}
- at: 18
  send: {type: event, event_type: e2}
- at: 18
  send: {type: event, event_type: e3}
- at: 21
  send:
    type: event
    event_type: e3
    data: {k: 2}
- at: 23
  send: {type: event, event_type: tick}
- at: 26
  send: {type: event, event_type: tick}
- at: 29
  set: [light.l1, unavailable]
  attributes: {lvl: 3}

# random scenario, seed 303, index 108 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - trigger: state
    entity_id: light.l1
    to: unavailable
    from: ['off', unavailable]
    for: 00:00:02
  - {trigger: state, entity_id: light.l1, to: 'on', for: 3}
  conditions:
  - '{{ is_state(''light.l2'', ''off'') }}'
  - and:
    - {condition: numeric_state, entity_id: sensor.s2, above: sensor.s2}
    - {condition: trigger, id: alpha}
  actions:
  - parallel:
    - sequence:
      - choose:
        - conditions:
          - {condition: state, entity_id: light.l1, state: 'off'}
          sequence:
          - action: test.s1
            data: {n: 1, v: '{{ now().second }}'}
        - conditions:
          - condition: not
            conditions:
            - {condition: template, value_template: '{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}', enabled: false}
            - '{{ states(''sensor.s1'') | int > 5 }}'
            - condition: not
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, above: 3, enabled: false}
          sequence:
          - repeat:
              while:
              - {condition: time, after: '23:00:00', weekday: tue}
              - '{{ repeat.index <= 1 }}'
              sequence:
              - action: test.s2
                data: {n: 2, v: '{{ states(''light.l1'') }}'}
                enabled: false
          - wait_for_trigger:
            - {trigger: state, entity_id: light.l1, not_from: 'off', for: 3}
            - {trigger: template, value_template: '{{ states(''sensor.s1'') | int > 5 }}'}
          - event: m_3
            event_data: {n: 3, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
      - choose:
        - conditions: ['{{ is_state(''input_boolean.b1'', ''on'') and is_state(''light.l1'', ''on'') }}']
          sequence:
          - {event: m_4}
        - conditions:
          - {condition: time, after: '22:00', before: '06:00'}
          sequence:
          - event: m_5
            event_data: {n: 5, v: '{{ states(''light.l1'') }}'}
        default:
        - if:
          - {condition: state, entity_id: light.gone, state: 'on'}
          - {condition: time, after: '22:13:25', before: '22:14', weekday: tue}
          then:
          - {event: m_6}
          else:
          - action: test.s7
            data: {n: 7, v: '{{ trigger.description }}'}
        - if:
          - {condition: time, before: '06:00'}
          then:
          - event: m_8
            event_data: {n: 8, v: '{{ trigger.platform }}'}
          - {delay: 0}
          else:
          - delay: {seconds: '{{ 2 }}'}
          - action: test.s9
            data: {n: 9, v: '{{ trigger.platform }}'}
            response_variable: v1
        - action: test.s10
          data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          response_variable: v2
    - event: m_11
      event_data: {n: 11, v: '{{ now().second }}', var: '{{ v1 | default(''undef'') }}'}
  - if:
    - {condition: trigger, id: '1'}
    then:
    - if:
      - and:
        - {condition: trigger, id: '0'}
      then:
      - {condition: time, after: '22:13:25', before: '22:14'}
      - {condition: trigger, id: '0'}
      else:
      - delay: {seconds: '{{ 2 }}'}
  - variables: {v3: x}
  variables: {v1: 0, v2: 0, v3: 0}
states:
- {entity_id: sensor.s1, state: '12'}
- entity_id: sensor.s2
  state: '7.5'
  attributes: {lvl: 1}
- entity_id: light.l1
  state: unavailable
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 0
  send: {type: event, event_type: e2}
- at: 1
  send: {type: event, event_type: tick}
- at: 2
  set: [sensor.s1, '4']
- at: 2
  set: [light.l1, 'on']
- at: 3
  set: [light.l1, unavailable]
- at: 4
  set: [sensor.s1, '12']
- at: 5
  set: [light.l1, 'off']
  attributes: {lvl: 3}
- at: 6
  set: [light.l1, 'on']
- at: 7
  set: [sensor.s1, abc]
- at: 8
  set: [light.l1, 'off']
  attributes: {lvl: 1}
- at: 9
  send:
    type: event
    event_type: e1
    data: {k: true}
- at: 12
  send: {type: event, event_type: tick}

# random scenario, seed 303, index 3 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  mode: queued
  max: 3
  triggers:
  - {trigger: event, event_type: e3, id: alpha}
  - {trigger: template, value_template: '{{ is_state(''light.l2'', ''off'') }}'}
  actions:
  - {delay: 2}
  - {condition: numeric_state, entity_id: sensor.s1, above: 6, enabled: false}
  - event: m_1
    event_data: {n: 1, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
  - if:
    - {condition: state, entity_id: light.l1, state: unavailable}
    then:
    - {wait_template: '{{ trigger.platform == ''event'' }}'}
    - event: m_3
      event_data: {n: 3, completed: '{{ wait.completed }}'}
    - action: test.s2
      data: {n: 2, v: '{{ now().second }}'}
    - {stop: s}
    continue_on_error: true
  - event: m_4
    event_data: {n: 4, v: '{{ states(''sensor.s1'') }}'}
- alias: a1
  id: id1
  mode: queued
  max: 3
  triggers:
  - trigger: state
    entity_id: light.l1
    for: {seconds: '{{ 1 + 1 }}'}
  - {trigger: state, entity_id: light.l1}
  - {trigger: state, entity_id: light.l1, not_to: 'off', not_from: unavailable}
  conditions:
  - condition: state
    entity_id: light.l1
    state: ['on', 'off']
    for: 00:00:03
  actions:
  - action: test.s5
    data: {n: 5, v: '{{ trigger.id }}'}
    target:
      entity_id: [light.l1, light.l2]
    response_variable: v1
  - {stop: s, error: true}
  variables: {v1: 0}
- alias: a2
  id: id2
  triggers:
  - trigger: event
    event_type: e3
    event_data: {k: a}
  - trigger: state
    entity_id: [light.l1]
    from: ['off', 'on']
  actions:
  - if: ['{{ states(''sensor.s1'') == states(''sensor.s2'') }}', '{{ trigger.platform in [''state'', ''numeric_state''] }}']
    then:
    - event: m_6
      event_data: {n: 6, v: '{{ states(''sensor.s2'') | int(0) + 1 }}'}
    - action: test.s7
      data: {n: 7, v: '{{ trigger.platform }}'}
      continue_on_error: true
    else:
    - wait_for_trigger:
      - {trigger: template, value_template: '{{ states(''sensor.s1'') == states(''sensor.s2'') }}'}
      timeout: 1
      continue_on_timeout: false
    - event: m_9
      event_data: {n: 9, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
    - parallel:
      - sequence:
        - {condition: template, value_template: '{{ states(''sensor.s2'') | float(0) < 5 }}'}
      - event: m_8
        event_data: {n: 8, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
  - if:
    - {condition: trigger, id: '1'}
    then:
    - choose:
      - conditions:
        - {condition: numeric_state, entity_id: sensor.s2, above: 3, below: 15}
        sequence:
        - parallel:
          - sequence:
            - event: m_10
              event_data: {n: 10, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
          - sequence:
            - action: test.s11
              data: {n: 11, v: '{{ states(''light.l1'') }}'}
              response_variable: v1
            - delay: {seconds: '{{ 2 }}'}
        - choose:
          - conditions:
            - condition: not
              conditions:
              - {condition: numeric_state, entity_id: sensor.s2, below: 15}
              - {condition: time, after: '23:00:00', before: '22:13:30'}
              - {condition: trigger, id: '0'}
            sequence:
            - variables: {v2: '{{ states(''sensor.s1'') }}'}
          default:
          - {action: test.s12, response_variable: v3}
          - {event: m_13}
          - {event: m_14}
      default:
      - parallel:
        - sequence:
          - variables: {v1: '{{ (v1 | default(0) | int(0)) + 1 }}'}
            enabled: false
          - variables:
              v4: [a, '{{ 1 + 1 }}']
        - sequence:
          - event: m_15
            event_data: {n: 15, v: '{{ trigger.id }}'}
          - event: m_16
            event_data: {n: 16, v: '{{ trigger.idx }}'}
            enabled: false
          - {event: m_17}
    else:
    - variables:
        v2: [a, '{{ 1 + 1 }}']
  - {stop: s, error: true}
  variables: {v1: 0, v2: 0, v3: 0, v4: 0, v5: 0, v6: 0}
states:
- {entity_id: sensor.s1, state: unknown}
- {entity_id: sensor.s2, state: '8'}
- entity_id: light.l1
  state: 'on'
  attributes: {lvl: 3}
- {entity_id: light.l2, state: unavailable}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 3
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 4
  send: {type: event, event_type: tick}
- at: 5
  send: {type: event, event_type: e1}
- at: 6
  set: [sensor.s1, abc]
  attributes: {lvl: 3}
- at: 6
  send:
    type: event
    event_type: e2
    data: {k: a}
- at: 7
  set: [sensor.s1, '1']
- at: 8
  set: [light.l1, 'on']
  attributes: {lvl: 1}
- at: 11
  send:
    type: event
    event_type: e2
    data: {k: 2}
- at: 13
  set: [light.l1, 'on']
- at: 16
  send: {type: event, event_type: tick}
- at: 17
  send:
    type: service_result
    call_id: 0
    ok: true
    response: {value: 1}
- at: 18
  send: {type: event, event_type: tick}
- at: 18
  send: {type: service_result, call_id: 1, ok: false, error_kind: ha_error}
- at: 21
  set: [light.l1, unavailable]
- at: 21
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 22
  set: [light.l1, 'off']
- at: 23
  send: {type: event, event_type: e2}
- at: 24
  set: [sensor.s1, '12']
- at: 27
  set: [light.l1, 'on']
- at: 28
  set: [light.l1, 'on']
  attributes: {lvl: 3}
- at: 29
  send:
    type: event
    event_type: e1
    data: {k: a}
- at: 30
  send: {type: event, event_type: e3}
- at: 31
  send:
    type: service_result
    call_id: 2
    ok: true
    response: {value: x}
- at: 33
  send: {type: event, event_type: e3}

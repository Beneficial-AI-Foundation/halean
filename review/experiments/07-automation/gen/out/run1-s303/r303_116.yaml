# random scenario, seed 303, index 116 (gen/gen_scenarios.py)
automations:
- alias: a0
  id: id0
  triggers:
  - {trigger: state, entity_id: light.l1}
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    for: {seconds: 2}
  - trigger: state
    entity_id: sensor.s1
    to: unavailable
    for: {seconds: '{{ 1 + 1 }}'}
  actions:
  - variables: {v1: 1}
  - wait_for_trigger:
    - {trigger: state, entity_id: sensor.s1, from: abc}
  - event: m_4
    event_data: {n: 4, completed: '{{ wait.completed }}', trig: '{{ wait.trigger.platform if wait.trigger else ''none'' }}'}
  - if:
    - {condition: time, before: '06:00'}
    then:
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: sensor.s1
          from: ['20', '1']
        timeout: {seconds: 2}
        continue_on_timeout: false
    - sequence:
      - delay: {seconds: 1}
      - if:
        - condition: state
          entity_id: [sensor.s1, light.l1]
          state: 'on'
          match: any
        then:
        - {event: m_1}
        - {action: test.s2}
      - action: test.s3
        data: {n: 3, v: '{{ [states(''light.l1''), states(''light.l2'')] }}'}
        response_variable: v2
    else:
    - sequence:
      - condition: not
        conditions:
        - condition: and
          conditions:
          - {condition: template, value_template: '{{ trigger.platform in [''state'', ''numeric_state''] }}'}
        - {condition: template, value_template: '{{ trigger.platform == ''event'' }}'}
    - {condition: template, value_template: '{{ trigger.id == ''0'' }}'}
  variables: {v1: 0, v2: 0}
- alias: a1
  id: id1
  mode: restart
  variables: {v1: '{{ states(''sensor.s2'') }}'}
  triggers:
  - trigger: state
    entity_id: [sensor.s1, light.l1]
    from: '12'
  - {trigger: event, event_type: e3}
  conditions:
  - {condition: state, entity_id: light.l1, state: unavailable, for: '00:00:03'}
  actions:
  - {delay: 2}
  - action: test.s5
    data: {n: 5, v: '{{ states(''sensor.s1'') }}'}
  - delay: {seconds: 1}
states:
- {entity_id: sensor.s1, state: '1'}
- {entity_id: light.l1, state: 'on'}
- {entity_id: light.l2, state: 'off'}
- {entity_id: input_boolean.b1, state: 'on'}
steps:
- at: 2
  set: [light.l1, unavailable]
- at: 3
  set: [light.l1, 'on']
  attributes: {lvl: 2}
- at: 4
  send: {type: event, event_type: e1}
- at: 5
  send:
    type: event
    event_type: e2
    data: {k: 1}
- at: 6
  send: {type: event, event_type: tick}
- at: 7
  send: {type: event, event_type: tick}
- at: 8
  send: {type: event, event_type: tick}
- at: 11
  send: {type: event, event_type: e2}
- at: 14
  send: {type: event, event_type: tick}
- at: 15
  set: [light.l1, 'off']
- at: 16
  set: [sensor.s1, '12']
- at: 17
  send: {type: event, event_type: e3}

# an entity bound must be an input_number, number, sensor or zone
automations:
  - alias: bounddomain
    triggers: [{trigger: numeric_state, entity_id: sensor.t, above: input_text.limit}]
    actions: [{event: m_bounddomain}]
states: [{entity_id: sensor.t, state: "1"}, {entity_id: input_text.limit, state: "5"}]
steps:
  - {at: 1, set: [sensor.t, "9"]}

# a time trigger for the very second the automation is loaded (T0 = 22:13:20.000)
automations:
  - alias: atload
    triggers: [{trigger: time, at: "22:13:20"}]
    actions: [{event: m_atload}]
steps:
  - {at: 1, send: {type: event, event_type: tick}}
  - {at: 2, send: {type: event, event_type: tick}}

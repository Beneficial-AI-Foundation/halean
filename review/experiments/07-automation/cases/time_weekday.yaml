# weekday filter: T0 is a Tuesday (UTC)
automations:
  - alias: wd_tue
    triggers: [{trigger: time, at: "22:13:22", weekday: tue}]
    actions: [{event: m_wd_tue}]
  - alias: wd_wed
    triggers: [{trigger: time, at: "22:13:22", weekday: [wed, thu]}]
    actions: [{event: m_wd_wed}]
  - alias: wd_list
    triggers: [{trigger: time, at: "22:13:22", weekday: [mon, tue]}]
    actions: [{event: m_wd_list}]
steps:
  - {at: 3, send: {type: event, event_type: tick}}

# legacy singular keys (trigger/condition/action, platform, service) still load
automations:
  - alias: legacy
    trigger: {platform: event, event_type: e}
    condition: {condition: template, value_template: "{{ true }}"}
    action: [{service: test.legacy, data: {v: 1}}]
steps:
  - {at: 1, send: {type: event, event_type: e}}

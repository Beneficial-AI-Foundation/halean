# `from` and `not_from` together: probatio.Exclusive rejects the automation
automations:
  - alias: excl
    triggers: [{trigger: state, entity_id: sensor.a, from: "1", not_from: "2"}]
    actions: [{event: m_excl}]
states: [{entity_id: sensor.a, state: "1"}]
steps:
  - {at: 1, set: [sensor.a, "3"]}

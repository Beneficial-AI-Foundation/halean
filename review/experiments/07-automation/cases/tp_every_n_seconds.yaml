# time_pattern seconds "/5"
automations:
  - alias: every5
    triggers: [{trigger: time_pattern, seconds: "/5"}]
    actions: [{event: m_every5, event_data: {s: "{{ trigger.now.second }}"}}]
steps:
  - {at: 4, send: {type: event, event_type: tick}}
  - {at: 5, send: {type: event, event_type: tick}}
  - {at: 9, send: {type: event, event_type: tick}}
  - {at: 10, send: {type: event, event_type: tick}}
  - {at: 12, send: {type: event, event_type: tick}}

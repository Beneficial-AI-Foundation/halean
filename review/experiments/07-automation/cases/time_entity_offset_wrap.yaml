# a time-only input_datetime with a negative offset
automations:
  - alias: idtoff
    triggers: [{trigger: time, at: {entity_id: input_datetime.t, offset: "-00:00:10"}}]
    actions: [{event: m_idtoff}]
states:
  - {entity_id: input_datetime.t, state: "22:13:35", attributes: {has_date: false, has_time: true, hour: 22, minute: 13, second: 35}}
steps:
  - {at: 4, send: {type: event, event_type: tick}}
  - {at: 5, send: {type: event, event_type: tick}}
  - {at: 6, send: {type: event, event_type: tick}}
  - {at: 15, send: {type: event, event_type: tick}}

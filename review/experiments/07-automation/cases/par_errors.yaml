# parallel: a branch error is raised after all branches are done; continue_on_error on the parallel step
automations:
  - alias: parerr
    mode: queued
    triggers: [{trigger: event, event_type: e}]
    actions:
      - continue_on_error: true
        parallel:
          - sequence: [{action: test.fail}, {event: m_a_never}]
          - sequence: [{action: test.slow}, {event: m_b_done}]
      - {event: m_after}
steps:
  - {at: 1, send: {type: event, event_type: e}}
  - {at: 2, send: {type: service_result, call_id: 0, ok: false, error_kind: ha_error}}
  - {at: 3, send: {type: service_result, call_id: 1, ok: true}}
  - {at: 4, send: {type: event, event_type: e}}
  - {at: 5, send: {type: service_result, call_id: 2, ok: false, error_kind: other}}
  - {at: 6, send: {type: service_result, call_id: 3, ok: true}}

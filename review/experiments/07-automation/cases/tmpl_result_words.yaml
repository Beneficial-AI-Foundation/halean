# template trigger truthiness: result_as_boolean of the rendered result
automations:
  - alias: words
    triggers: [{trigger: template, value_template: "{{ states('input_text.v') }}"}]
    actions: [{event: m_words, event_data: {v: "{{ states('input_text.v') }}"}}]
states: [{entity_id: input_text.v, state: "no"}]
steps:
  - {at: 1, set: [input_text.v, "yes"]}
  - {at: 2, set: [input_text.v, "off"]}
  - {at: 3, set: [input_text.v, "On"]}
  - {at: 4, set: [input_text.v, "0"]}
  - {at: 5, set: [input_text.v, "enable"]}
  - {at: 6, set: [input_text.v, "disable"]}
  - {at: 7, set: [input_text.v, "2"]}
  - {at: 8, set: [input_text.v, "none"]}
  - {at: 9, set: [input_text.v, "-1.5"]}
  - {at: 10, set: [input_text.v, "false"]}
  - {at: 11, set: [input_text.v, "TRUE"]}
  - {at: 12, set: [input_text.v, ""]}
  - {at: 13, set: [input_text.v, "anything"]}
  - {at: 14, set: [input_text.v, "0.0"]}
  - {at: 15, set: [input_text.v, "[1]"]}

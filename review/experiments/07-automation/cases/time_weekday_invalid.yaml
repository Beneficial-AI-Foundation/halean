# an unknown weekday: HA rejects the automation
automations:
  - alias: wd_bad
    triggers: [{trigger: time, at: "22:13:22", weekday: tuesday}, {trigger: event, event_type: go}]
    actions: [{event: m_wd_bad}]
steps:
  - {at: 1, send: {type: event, event_type: go}}
  - {at: 3, send: {type: event, event_type: tick}}

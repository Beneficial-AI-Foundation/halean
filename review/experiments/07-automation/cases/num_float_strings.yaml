# how the state text is read as a number: Python float()
automations:
  - alias: floats
    triggers: [{trigger: numeric_state, entity_id: sensor.t, above: 10}]
    actions: [{event: m_floats, event_data: {s: "{{ trigger.to_state.state }}"}}]
states: [{entity_id: sensor.t, state: "0"}]
steps:
  - {at: 1, set: [sensor.t, " 11 "]}
  - {at: 2, set: [sensor.t, "0"]}
  - {at: 3, set: [sensor.t, "1e2"]}
  - {at: 4, set: [sensor.t, "0"]}
  - {at: 5, set: [sensor.t, "1_1"]}
  - {at: 6, set: [sensor.t, "0"]}
  - {at: 7, set: [sensor.t, "inf"]}
  - {at: 8, set: [sensor.t, "0"]}
  - {at: 9, set: [sensor.t, "nan"]}
  - {at: 10, set: [sensor.t, "0"]}
  - {at: 11, set: [sensor.t, "+12."]}
  - {at: 12, set: [sensor.t, "0"]}
  - {at: 13, set: [sensor.t, "0x20"]}
  - {at: 14, set: [sensor.t, "Infinity"]}
  - {at: 15, set: [sensor.t, "0"]}
  - {at: 16, set: [sensor.t, "１２"]}

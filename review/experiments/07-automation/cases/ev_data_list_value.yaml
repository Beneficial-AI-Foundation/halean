# a list as a wanted value (not nested): compared with ==
automations:
  - alias: evlistval
    triggers: [{trigger: event, event_type: e, event_data: {x: [1, 2]}}]
    actions: [{event: m_evlistval}]
steps:
  - {at: 1, send: {type: event, event_type: e, data: {x: [1, 2]}}}
  - {at: 2, send: {type: event, event_type: e, data: {x: [2, 1]}}}
  - {at: 3, send: {type: event, event_type: e, data: {x: 1}}}
  - {at: 4, send: {type: event, event_type: e, data: {x: [true, 2.0]}}}

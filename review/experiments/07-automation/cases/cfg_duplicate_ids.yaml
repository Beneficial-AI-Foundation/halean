# two automations with the same id: HA keeps the first and drops the second
automations:
  - id: same
    alias: first
    triggers: [{trigger: event, event_type: e}]
    actions: [{event: m_first}]
  - id: same
    alias: second
    triggers: [{trigger: event, event_type: e}]
    actions: [{event: m_second}]
steps:
  - {at: 1, send: {type: event, event_type: e}}

# `at: "22:14"` (HH:MM) fires at second 0
automations:
  - alias: hhmm
    triggers: [{trigger: time, at: "22:14"}]
    actions: [{event: m_hhmm, event_data: {now: "{{ trigger.now.strftime('%H:%M:%S') }}", p: "{{ trigger.platform }}", e: "{{ trigger.entity_id }}"}}]
steps:
  - {at: 39, send: {type: event, event_type: tick}}
  - {at: 40, send: {type: event, event_type: tick}}
  - {at: 41, send: {type: event, event_type: tick}}

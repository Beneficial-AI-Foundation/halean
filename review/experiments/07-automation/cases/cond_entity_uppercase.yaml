# conditions lower-case their entity ids (cv.entity_ids)
automations:
  - alias: upcond
    triggers: [{trigger: event, event_type: e}]
    conditions: [{condition: state, entity_id: Light.A, state: "on"}]
    actions: [{event: m_upcond}]
states: [{entity_id: light.a, state: "on"}]
steps:
  - {at: 1, send: {type: event, event_type: e}}

# a static float count: probatio.Coerce(int) truncates (2.5 -> 2, 3.0 -> 3)
automations:
  - alias: floatcount
    triggers: [{trigger: event, event_type: e}]
    actions:
      - repeat: {count: 2.5, sequence: [{event: m_25}]}
      - repeat: {count: 3.0, sequence: [{event: m_30}]}
steps:
  - {at: 1, send: {type: event, event_type: e}}

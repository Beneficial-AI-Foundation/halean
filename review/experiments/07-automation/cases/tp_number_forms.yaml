# time_pattern values go through int(): "05", " 25 ", "+25" and 25.0 are all valid
automations:
  - alias: lead0
    triggers: [{trigger: time_pattern, seconds: "025"}]
    actions: [{event: m_lead0}]
  - alias: spaces
    triggers: [{trigger: time_pattern, seconds: " 25 "}]
    actions: [{event: m_spaces}]
  - alias: plus
    triggers: [{trigger: time_pattern, seconds: "+25"}]
    actions: [{event: m_plus}]
  - alias: float
    triggers: [{trigger: time_pattern, seconds: 25.0}]
    actions: [{event: m_float}]
  - alias: int
    triggers: [{trigger: time_pattern, seconds: 25}]
    actions: [{event: m_int}]
steps:
  - {at: 5, send: {type: event, event_type: tick}}
  - {at: 6, send: {type: event, event_type: tick}}

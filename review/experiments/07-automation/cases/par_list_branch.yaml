# a parallel branch written as a list of actions (shorthand sequence)
automations:
  - alias: known   # never triggers; lets the harness's _walk_actions see the events of the list branch
    triggers: [{trigger: event, event_type: never}]
    actions: [{event: m_a1}, {event: m_a2}]
  - alias: parlist
    triggers: [{trigger: event, event_type: e}]
    actions:
      - parallel:
          - [{event: m_a1}, {event: m_a2}]
          - {event: m_b}
      - {event: m_after}
steps:
  - {at: 1, send: {type: event, event_type: e}}

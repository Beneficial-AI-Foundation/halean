# initial_state: false: the automation starts disabled and does not trigger
automations:
  - alias: off_at_start
    initial_state: false
    triggers: [{trigger: event, event_type: e}]
    actions: [{event: m_off_at_start}]
  - alias: on_at_start
    initial_state: true
    triggers: [{trigger: event, event_type: e}]
    actions: [{event: m_on_at_start}]
steps:
  - {at: 1, send: {type: event, event_type: e}}

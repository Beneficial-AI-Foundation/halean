- {name: since_precision_2, template: "{{ time_since(utcnow() - timedelta(days=1, hours=2, minutes=40), 2) }}"}
- {name: since_precision_0, template: "{{ time_since(utcnow() - timedelta(days=400, hours=2, minutes=40, seconds=7), 0) }}"}
- {name: since_precision_6, template: "{{ time_since(utcnow() - timedelta(days=400, hours=2, minutes=40, seconds=7), 6) }}"}
- {name: since_precision_big, template: "{{ time_since(utcnow() - timedelta(hours=2, seconds=7), 9) }}"}
- {name: since_precision_float, template: "{{ time_since(utcnow() - timedelta(hours=2, minutes=40), 1.0) }}"}
- {name: since_precision_str, template: "{{ time_since(utcnow() - timedelta(hours=2, minutes=40), '1') }}"}
- {name: since_precision_negative, template: "{{ time_since(utcnow() - timedelta(hours=2, minutes=40), -1) }}"}
- {name: since_future, template: "{{ time_since(utcnow() + timedelta(hours=2)) is datetime }}"}
- {name: until_basic, template: "{{ time_until(utcnow() + timedelta(hours=2, minutes=31)) }}"}
- {name: until_precision_3, template: "{{ time_until(utcnow() + timedelta(days=40, hours=2, minutes=31), 3) }}"}
- {name: until_past, template: "{{ time_until(utcnow() - timedelta(hours=2)) is datetime }}"}
- {name: until_kw, template: "{{ time_until(utcnow() + timedelta(minutes=2), precision=2) }}"}
- {name: until_filter, template: "{{ (utcnow() + timedelta(seconds=3599)) | time_until }}"}
- {name: until_none, template: "{{ time_until(none) is none }}"}
- {name: tds_basic, template: "{{ timedelta_string(timedelta(hours=1, minutes=29)) }}"}
- {name: tds_negative, template: "{{ timedelta(seconds=-90) | timedelta_string(2) }}"}
- {name: tds_zero, template: "{{ timedelta(0) | timedelta_string }}"}
- {name: tds_sub_second, template: "{{ timedelta(milliseconds=499) | timedelta_string }}|{{ timedelta(milliseconds=500) | timedelta_string }}|{{ timedelta(milliseconds=501) | timedelta_string }}"}
- {name: tds_non_td, template: "{{ timedelta_string(5) }}"}
- {name: tds_month_year, template: "{{ timedelta(days=395) | timedelta_string(0) }}"}
- {name: tds_round_up_unit, template: "{{ timedelta(minutes=59, seconds=59) | timedelta_string }}"}
- {name: tds_precision_2_round, template: "{{ timedelta(hours=1, minutes=59, seconds=31) | timedelta_string(2) }}"}

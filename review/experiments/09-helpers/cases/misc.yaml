# several domains together, repeated setup, cross-domain targets.
- name: hw_m_all_domains
  steps:
    - setup: {input_boolean: {x: null}}
    - setup: {counter: {x: null}}
    - setup: {timer: {x: null}}
    - setup: {input_number: {x: {min: 0, max: 1}}}
    - setup: {input_select: {x: {options: [a]}}}
    - setup: {input_text: {x: null}}
    - call: counter.increment
      data: {entity_id: [counter.x, input_boolean.x, timer.x]}
    - call: input_boolean.toggle
      data: {entity_id: all}
    - call: timer.start
      data: {entity_id: all}
    - call: input_text.set_value
      data: {entity_id: all, value: v}
    - call: input_number.increment
      data: {entity_id: all}
    - call: input_select.select_next
      data: {entity_id: all}
- name: hw_m_setup_twice
  steps:
    - setup: {counter: {a: {initial: 1}}}
    - setup: {counter: {b: {initial: 2}}}
- name: hw_m_setup_retry_after_error
  steps:
    - setup: {counter: {a: {step: -1}}}
    - setup: {counter: {a: {step: 1}}}
    - call: counter.increment
      data: {entity_id: counter.a}
- name: hw_m_entity_id_non_ascii
  steps:
    - setup: {counter: {a: {}}}
    - call: counter.increment
      data: {entity_id: "counter.é"}
- name: hw_m_name_non_ascii_lower
  steps:
    - setup: {input_boolean: {a: {name: "ÀÉ", initial: "ÖN"}}}
- name: hw_m_icon_forms
  steps:
    - setup: {counter: {a: {icon: "mdi:a:b"}, b: {icon: ":"}}}
- name: hw_m_icon_number
  steps:
    - setup: {counter: {a: {icon: 5}}}
- name: hw_m_icon_null
  steps:
    - setup: {counter: {a: {icon: null}}}
